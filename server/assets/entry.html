<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<!-- Pretendard — 한글 자소가 고르고 숫자가 라틴과 같은 리듬으로 선다. dynamic-subset 은
     unicode-range 로 쪼개져 있어 실제로 쓴 글자 묶음만 내려온다.
     못 받으면(오프라인·사내망) --sans 의 뒤쪽 스택으로 조용히 떨어진다 — 화면은 그대로 선다.

     **막지 않게 받는다.** 평범한 stylesheet 링크는 파서를 막아, 뒤에 오는 모든
     스크립트가 이 파일을 받을 때까지 실행되지 않는다. CDN 이 안 열리는
     환경(오프라인·사내망·검사 샌드박스)에서는 그게 곧 이 화면이 죽는 것이다:
     사이트 목록도 진행 상황도 아래 페이지 스크립트가 /api 를 불러 채우는데 그것이
     시작을 못 한다. (이 주석에 여는 스크립트 태그를 글자로 적으면 안 된다 —
     pages.data 가 "문서의 첫 script 태그 앞"에 값을 싣는데, 주석 안의 글자가 그
     자리로 잡히면 window.__SITES__ 가 통째로 주석 속에 묻힌다. 실제로 묻혔다.)
     media=print 로 받으면 이 파일은 처음부터 이 화면의 스타일이
     아니라서 아무것도 막지 않고, 다 받은 뒤 onload 가 media 를 열어 그때 글꼴이
     적용된다. 서체는 읽는 데 필요한 게 아니라 좋아지는 것이므로 늦게 와도 된다.
     (정본은 dashboard.html 의 같은 자리다.) -->
<link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<noscript><link rel="stylesheet"
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"></noscript>
<style>
/* 이 화면이 대시보드의 입구다 — 입구 두 화면(app.html 사이트 목록 · start.html 온보딩)이
   같이 쓰는 머리이고, 서버가 <!-- ENTRY_HEAD --> 자리에 끼운다. 토큰은 dashboard.html 의
   tokens 블록을 통째로 복사한 사본이다(정본은 그쪽, 마커 주석까지 글자 하나 다르지 않게).
   상자 문법은 하나다: 면 카드(반경 20px · 옅은 그림자 · 테두리 없음). 알림·빈 상태·오류는
   상자를 또 두르지 않고 면의 색조(--sunk · --accent-wash · --warn-wash)로 가른다.
   두 화면에 각자 적으면 사본이 셋이 된다 — 여기 하나만 둔다. */

/* tokens:begin */
:root {
  --canvas:#EEF1EF; --card:#FFFFFF; --sunk:#F5F7F6;
  --ink:#101613; --sub:#5A655F; --mute:#8A948E;
  --line:rgba(16,22,19,.07); --rule:rgba(16,22,19,.14);
  --accent:#1D6455; --accent-ink:#FFFFFF; --accent-wash:#E1F0EB;
  --warn:#9A3F17; --warn-wash:#F8E9E1;
  --info:#3A4F73; --info-wash:#E7ECF4;
  /* 증감은 투명도로 줄이지 않고 전용 색으로 말한다 */
  --up:#1D6455; --up-wash:#E1F0EB; --dn:#9A3F17; --dn-wash:#F8E9E1;
  --r-card:20px; --r-in:12px; --r-pill:999px;
  --shadow:0 1px 2px rgba(16,22,19,.04), 0 10px 28px -12px rgba(16,22,19,.10);
  --fs-1:12px; --fs-2:14px; --fs-3:16px; --fs-4:22px; --fs-5:32px;
  --gap:16px;
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,
         system-ui,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"Cascadia Mono","Consolas",ui-monospace,SFMono-Regular,Menlo,
         "Malgun Gothic",monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --canvas:#0C110F; --card:#161D1A; --sunk:#1C2521;
    --ink:#E8EEEA; --sub:#A2AEA7; --mute:#8A978F;
    --line:rgba(232,238,234,.08); --rule:rgba(232,238,234,.16);
    --accent:#57B49C; --accent-ink:#06120E; --accent-wash:#1B2E28;
    --warn:#DE8351; --warn-wash:#33221A;
    --info:#9DB2D6; --info-wash:#1E2632;
    --up:#57B49C; --up-wash:#1B2E28; --dn:#DE8351; --dn-wash:#33221A;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -12px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  --canvas:#0C110F; --card:#161D1A; --sunk:#1C2521;
  --ink:#E8EEEA; --sub:#A2AEA7; --mute:#8A978F;
  --line:rgba(232,238,234,.08); --rule:rgba(232,238,234,.16);
  --accent:#57B49C; --accent-ink:#06120E; --accent-wash:#1B2E28;
  --warn:#DE8351; --warn-wash:#33221A;
  --info:#9DB2D6; --info-wash:#1E2632;
  --up:#57B49C; --up-wash:#1B2E28; --dn:#DE8351; --dn-wash:#33221A;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -12px rgba(0,0,0,.5);
}
/* tokens:end */

/* 이 화면 전용 — 토큰 블록 밖 */
:root {
  --micro:500 var(--fs-1)/1.35 var(--sans);
}
* { box-sizing:border-box; }
body { margin:0; background:var(--canvas); color:var(--ink);
  font:400 var(--fs-2)/1.6 var(--sans); word-break:keep-all; overflow-wrap:break-word;
  -webkit-font-smoothing:antialiased; min-height:100vh; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:8px; }

/* 한글에 letter-spacing/uppercase 를 걸지 않는다. 위계는 크기·굵기·색으로만 만든다.
   등폭(--mono)은 URL·날짜·식별자에만 쓴다. 글자 크기는 --fs-1..5 만 쓴다(최소 12px). */

.wrap { max-width:1120px; margin:0 auto; padding:0 24px; }

/* ── 버튼: 알약 두 종류(기본·ghost)뿐이다(.sec 는 흰 알약). 상태는 .badge 가 맡는다 ─── */
.go { display:inline-flex; align-items:center; justify-content:center; gap:8px;
  height:44px; padding:0 20px; font:650 var(--fs-2)/1 var(--sans);
  color:var(--accent-ink); background:var(--accent); border:0;
  border-radius:var(--r-pill); cursor:pointer; text-decoration:none; white-space:nowrap; }
.go:hover:not(:disabled) { filter:brightness(1.08); }
/* 비활성은 채운 색이 아니라 면의 색조다 — 켜졌는지 껐는지가 갈린다. */
.go:disabled { background:var(--sunk); color:var(--mute); cursor:default; }
.go.sec { background:var(--card); color:var(--ink); box-shadow:var(--shadow); }
.go.ghost { background:transparent; color:var(--sub); box-shadow:none; }
.go.sec:hover:not(:disabled), .go.ghost:hover:not(:disabled) { color:var(--accent); filter:none; }
.go.ghost:hover:not(:disabled) { background:var(--card); }
/* 흰 카드 위의 흰 알약은 안 보인다 — 카드 안에서는 색조 면(--sunk)으로 선다. */
.sites .go.sec, .panel .go.sec, .form .go.sec, .runbox .go.sec, .empty .go.sec,
.gain .go.sec { background:var(--sunk); box-shadow:none; }

/* ── 상태 배지: 옅은 알약 24px. 절대 버튼 모양이 아니다 ─────── */
.badge { display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  height:24px; padding:0 10px; border-radius:var(--r-pill);
  font:600 var(--fs-1)/1 var(--sans); background:var(--sunk); color:var(--sub); }
.badge::before { content:""; width:6px; height:6px; border-radius:50%;
  background:currentColor; flex:none; }
.badge.ok { color:var(--up); background:var(--up-wash); }
.badge.run { color:var(--warn); background:var(--warn-wash); }
.badge.muted::before { display:none; }

/* ── 상단바: 캔버스 위 로고 · 페이지 이름 · 사용자 알약 ───────── */
header { background:transparent; color:var(--ink); }
.hbar { display:flex; align-items:center; flex-wrap:wrap; gap:8px 16px;
  padding-top:16px; padding-bottom:0; min-height:60px; }
.mark { display:inline-flex; align-items:center; gap:0; font:700 var(--fs-3)/1 var(--sans);
  letter-spacing:-.01em; white-space:nowrap; }
.mark b { color:var(--accent); font-weight:700; }
h1.tag { font:600 var(--fs-2)/1 var(--sans); color:var(--sub); margin:0; white-space:nowrap;
  padding:0 0 0 16px; border-left:1px solid var(--rule); }
.hbar .sp { flex:1; }
.who { font:400 var(--fs-1)/1 var(--mono); color:var(--sub); overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; min-width:0; }
.lo { margin:0; flex:0 0 auto; }
.lo button { font:600 var(--fs-2)/1 var(--sans); color:var(--sub); background:var(--card);
  box-shadow:var(--shadow); border:0; border-radius:var(--r-pill); height:44px;
  padding:0 18px; cursor:pointer; }
.lo button:hover { color:var(--ink); }

main { padding:0 0 12px; }
/* 섹션 구분은 괘선이 아니라 여백이다. */
section { padding:32px 0 0; }
main > .act { margin-top:24px; }

/* ── 제목 묶음: eyebrow → h2 → sub ─────────────────────────── */
h1 { font:700 var(--fs-5)/1.25 var(--sans); letter-spacing:-.02em; margin:0;
  padding:36px 0 0; text-wrap:balance; }
.eyebrow, .label { font:var(--micro); color:var(--sub); margin:0; }
.eyebrow { color:var(--accent); font-weight:600; }
h2 { font:700 var(--fs-4)/1.35 var(--sans); letter-spacing:-.01em; margin:4px 0 4px; }
.sub { font-size:var(--fs-2); color:var(--sub); margin:0 0 16px; max-width:62ch; }

/* ── 진행 단계: 첫 사용 흐름에서만 서 있다 ─────────────────── */
.rail { padding-top:24px; }
.rail ol { list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap;
  align-items:center; gap:10px; font:500 var(--fs-1)/1 var(--sans); color:var(--sub); }
.rail li { display:flex; align-items:center; gap:8px; }
.rail li + li::before { content:""; width:22px; height:1px; background:var(--rule);
  margin-right:2px; }
.rail .n { display:inline-flex; align-items:center; justify-content:center;
  width:24px; height:24px; border-radius:50%; background:var(--sunk);
  font:600 var(--fs-1)/1 var(--sans); font-variant-numeric:tabular-nums; color:var(--sub); }
.rail .here { color:var(--ink); font-weight:650; }
.rail .here .n { background:var(--accent-wash); color:var(--accent); }
.rail .done .n { background:var(--accent); color:var(--accent-ink); }
.rail .done .n::before { content:"✓"; }
.rail .done .n b { display:none; }

/* ── 사이트 목록 화면(app.html): 머리 · 상태 띠 · 카드 격자 ────────────
   .nm .pr .when .progress .stg 는 온보딩(start.html)도 쓰는 기본형이라 그대로 두고,
   목록 전용 모양은 전부 .sites / .strip / .shead 안에서만 덮는다. 카드는 테두리 없이 면 색조로 가른다:
   끝난 사이트는 흰 면, 첫 분석 중인 사이트는 옅은 강조 면, 추가 타일은 가라앉은 면. */
.nm { font:650 var(--fs-3)/1.35 var(--sans); overflow-wrap:anywhere; }
.pr { font:400 var(--fs-1)/1.4 var(--mono); color:var(--sub); overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; }
/* 날짜는 등폭 — 자릿수가 줄마다 같은 자리에 선다. */
.when { font:400 var(--fs-1)/1.35 var(--mono); font-variant-numeric:tabular-nums;
  color:var(--sub); white-space:nowrap; }
.progress { height:6px; border-radius:var(--r-pill); background:var(--accent-wash); overflow:hidden; }
.progress i { display:block; height:100%; width:6%; background:var(--accent);
  border-radius:var(--r-pill); transition:width .5s ease; }
.stg { margin:0; font:400 var(--fs-1)/1.35 var(--sans); color:var(--sub); }

/* 머리: 물음 하나 + 한 문장 + 주 행동 하나 */
.shead { display:flex; align-items:flex-end; justify-content:space-between;
  flex-wrap:wrap; gap:16px 24px; padding-top:32px; }
.shead h1 { padding:0; }
.shead p { margin:8px 0 0; font-size:var(--fs-2); color:var(--sub); max-width:52ch; }
.shead .go::before { content:"+"; font:500 var(--fs-4)/1 var(--sans); margin-top:-2px; }
/* 화면의 h1 은 하나다 — 상단 띠의 "사이트 관리"는 이름표일 뿐이라 span 이다. */
.hbar span.tag { font:600 var(--fs-2)/1 var(--sans); color:var(--sub); margin:0; white-space:nowrap;
  padding:0 0 0 16px; border-left:1px solid var(--rule); }

/* 카드 머리 한 벌: 제목(16px 650) + 보조 설명(12px). 요약 카드 둘이 같이 쓴다. */
.ch { display:grid; gap:2px; margin-bottom:16px; }
.ch b { font:650 var(--fs-3)/1.4 var(--sans); }
.ch span { font:400 var(--fs-1)/1.4 var(--sans); color:var(--sub); }

/* 요약 줄: 사이트 단위 네 칸(넓은 카드) + 측정 단위 도넛(좁은 카드). 상태 조회가 실패하면 도넛이 빠지고 띠가 전폭이다. */
.sumrow { margin-top:24px; display:grid; gap:var(--gap); grid-template-columns:repeat(12,minmax(0,1fr)); }
.sumrow > * { background:var(--card); border-radius:var(--r-card); box-shadow:var(--shadow); padding:20px 24px; min-width:0; }
.sumrow > [hidden] { display:none; }
.strip { grid-column:span 8; }
.ringcard { grid-column:span 4; }
.sumrow:has(#sitering[hidden]) .strip { grid-column:1 / -1; }
.pcs { display:grid; gap:16px 20px; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); }
.pc[hidden] { display:none; }
.pc { display:grid; grid-template-columns:44px minmax(0,1fr); column-gap:14px; align-items:center;
  --c:var(--mute); --w:var(--sunk); }
.pc[data-k="sites"] { --c:var(--accent); --w:var(--accent-wash); }
.pc[data-k="run"] { --c:var(--warn); --w:var(--warn-wash); }
.pc[data-k="due"] { --c:var(--info); --w:var(--info-wash); }
.pc[data-k="fail"] { --c:var(--dn); --w:var(--dn-wash); }
.pc.zero { --c:var(--mute); --w:var(--sunk); }
.pc .ic { grid-row:span 2; width:44px; height:44px; border-radius:16px; display:grid; place-items:center;
  background:var(--w); color:var(--c); }
.pc .ic svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.8;
  stroke-linecap:round; stroke-linejoin:round; }
.pc .l { font:var(--micro); color:var(--sub); align-self:end; }
.pc .v { display:flex; align-items:baseline; gap:4px; align-self:start; }
.pc .v b { font:700 var(--fs-4)/1.25 var(--sans); font-variant-numeric:tabular-nums; }
.pc .v small { font:500 var(--fs-2)/1 var(--sans); color:var(--sub); }
.pc.zero .v b { color:var(--mute); }
/* 손댈 곳: 이 화면의 물음("어디를 열까")에 대한 답을 카드 격자 위에서 한 줄로. 눌리면 그 사이트 대시보드다. */
.strip { display:flex; flex-direction:column; }
.jump { margin-top:auto; padding-top:20px; display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
.jump:empty { display:none; }
.jump .jl { font:var(--micro); color:var(--sub); margin-right:4px; }
.jump a { display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:0 14px 0 6px;
  border-radius:var(--r-pill); background:var(--sunk); color:var(--ink); text-decoration:none;
  font:600 var(--fs-2)/1 var(--sans); }
.jump a:hover { background:var(--accent-wash); color:var(--accent); }
.jump a .av { width:32px; height:32px; border-radius:50%; font-size:var(--fs-2); }
.jump a small { font:500 var(--fs-1)/1 var(--sans); color:var(--warn); }
.jump .ok { font:400 var(--fs-2)/1.4 var(--sans); color:var(--sub); }

/* 도넛: 색 세 가지(최신 · 다시 잴 때 · 재는 중). 가운데 숫자가 답이고 옆 목록이 근거다. */
.rg { display:flex; align-items:center; gap:20px; }
.ring { position:relative; width:104px; height:104px; flex:none; }
.ring svg { display:block; width:100%; height:100%; transform:rotate(-90deg); }
.ring circle { fill:none; stroke-width:12; }
.ring .trk { stroke:var(--sunk); }
.ring .s-up { stroke:var(--up); }
.ring .s-due { stroke:var(--warn); }
.ring .s-run { stroke:var(--info); }
.rc { position:absolute; inset:0; display:grid; place-content:center; text-align:center; }
.rc b { font:700 var(--fs-4)/1.1 var(--sans); font-variant-numeric:tabular-nums; }
.rc small { font:500 var(--fs-1)/1.3 var(--sans); color:var(--sub); }
.leg { list-style:none; margin:0; padding:0; display:grid; gap:8px; flex:1; min-width:0; }
.leg li { display:flex; align-items:center; gap:8px; font:400 var(--fs-2)/1.3 var(--sans); color:var(--sub); }
.leg li::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--c); flex:none; }
.leg li b { margin-left:auto; color:var(--ink); font:650 var(--fs-2)/1.3 var(--sans); font-variant-numeric:tabular-nums; }
.leg .up { --c:var(--up); } .leg .due { --c:var(--warn); } .leg .run { --c:var(--info); }
.leg li.z b { color:var(--mute); font-weight:500; }

.sites { list-style:none; margin:0; padding:0; display:grid; gap:var(--gap);
  grid-template-columns:repeat(12,minmax(0,1fr)); }
#live { padding-top:24px; }
#live h2 { font:650 var(--fs-3)/1.4 var(--sans); letter-spacing:0; margin:0 0 12px; }
/* 서버가 h2 아래에 싣는 "이 줄에서 들어갑니다" 문장은 머리 한 문장과 겹친다 — 카드 격자에 맞지 않는 말이라 감춘다. */
#live > .sub { display:none; }

/* 사이트 카드 — 이니셜 · 이름/주소 · 상태 알약 / 마지막 분석 / 측정 현황(링 + 경과일 막대) / 열기 */
.sites > li { position:relative; grid-column:span 4; display:grid; align-content:start;
  grid-template-columns:48px minmax(0,1fr) auto;
  grid-template-rows:auto auto auto 1fr auto;
  grid-template-areas:"av id badge" "last last last" "fresh fresh fresh" "go go go" "prog prog prog";
  align-items:center; column-gap:14px; padding:20px;
  background:var(--card); border-radius:var(--r-card); box-shadow:var(--shadow); }
.sites > li.done:hover { box-shadow:0 2px 4px rgba(16,22,19,.06), 0 22px 40px -16px rgba(16,22,19,.22); }
.sites > li.waiting { background:var(--accent-wash); box-shadow:none; }
.sites > li:has(.go:focus-visible) { outline:2px solid var(--accent); outline-offset:2px; }
/* .s-state 는 자리 잡는 상자가 아니다 — 안의 알약·날짜가 카드 칸에 바로 앉는다. */
.sites .s-state { display:contents; }
.sites .av { grid-area:av; }
