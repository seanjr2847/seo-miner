
<style>
  /* 본문 서체는 원본이 Pretendard 로 간다 — 여기서 덮지 않는다. 등폭만 갈아끼운다:
     원본의 Cascadia/Consolas 는 윈도우 기준이라 다른 OS 에서 폴백이 제각각이다. */
  :root{
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,monospace;
  }
  /* 원본 셸(dashboard.html)이 레일·화면 전환·괘선 체계를 다 갖는다. 여기서는
     호스팅에만 있는 것만 칠한다 — 예전에는 이 애드온이 body 격자부터 카드까지
     원본을 !important 로 덮어써서, 같은 조립본이 배포마다 다른 몸으로 섰다. */

  /* 로컬 설정(부품 설치·API 키·구글 클라이언트)은 호스팅에서 유저 몫이 아니다.
     지우지 않고 감춘다 — 원본 스크립트가 이 칸들에 이벤트를 이미 걸어 뒀다. */
  #setup { display:none; }

  /* 초기화 한 곳이 터졌을 때의 알림. 조용히 넘어가지 않되, 화면을 죽이지도 않는다. */
  #sm-fail{border-left:2px solid var(--copper);padding:12px 0 12px 16px;
    margin:0 0 18px;color:var(--copper);font:400 13px/1.6 var(--sans)}
  #sm-fail p{margin:0}

  /* 레일 바닥 통 — 이동(메뉴)이 아니라 실행이다. 원본 .rail-foot 안에 들어간다. */
  #sm-run{font:500 13px/1 var(--sans);cursor:pointer;border:1px solid var(--patina);
    background:var(--patina);color:var(--stone);border-radius:4px;padding:9px 14px}
  #sm-run:hover:not(:disabled){filter:brightness(1.12)}
  #sm-run:disabled{opacity:.5;cursor:default}
  .rail-foot .cmd{font:400 12.5px/1 var(--sans);color:var(--on-ink-dim);
    cursor:pointer;text-decoration:none;border:0;background:none;padding:2px 0}
  .rail-foot .cmd:hover{opacity:1}
  .rail-foot .cmd::after{content:none}   /* 원본 .cmd 는 복사 칩이라 아이콘을 달고 있다 */
  @media (min-width:1000px){
    .rail-foot{flex-direction:column;align-items:stretch}
    #sm-run{width:100%}
  }

  /* 화면 제목 옆 실행 버튼 — 그 화면을 채우는 단계를 거기서 돌린다. */
  .sm-refresh{font:500 12.5px/1 var(--sans);color:var(--patina);background:transparent;
    border:1px solid var(--rule);border-radius:4px;padding:8px 13px;cursor:pointer;flex:none}
  .sm-refresh:hover:not(:disabled){border-color:var(--patina);background:var(--wash)}
  .sm-refresh:disabled{opacity:.5;cursor:default}
  .sm-refresh:focus-visible{outline:2px solid var(--patina);outline-offset:2px}

  /* 실행 배너 — 눌렀다·도는 중·끝났다·못 했다를 한 자리에서 말한다.
     세 상태가 각자 다른 데 있으면 "지금 뭐가 되고 있나"를 화면이 못 답한다.
     자리는 화면 머리(.vh) 아래·다음 행동 띠 위다(위 slot()). 예전에는 sticky 로
     화면 위에 붙여 뒀는데, 그 자리로 내려온 지금은 스크롤하면 제목 위를 덮는다 —
     붙이지 않는다. 눌러 놓고 아래를 보는 동안 진행을 알리는 일은 토스트가 맡는다.
     바탕은 반투명 위에 종이색을 깐다 — 그냥 --wash 만 쓰면 아래 글자가 비쳐 읽힌다.
     상태(수집 중·완료·실패)는 셸의 .badge 가, 얼마나 왔는지는 셸의 .progress 가
     말한다 — 이 파일이 점·맥박을 따로 그리지 않는다. */
  /* 배너 자리는 셸의 .vban 이다(화면 머리 아래·다음 행동 띠 위, 본문 칸 폭).
     여기서는 상자 안쪽만 그린다 — 폭도 자리도 셸이 정한다. 셸이 아직 그 규칙을
     안 가졌을 때를 대비해 빈 자리는 접어 둔다. */
  #sm-wait{margin:0;
    padding:13px 16px;border-left:2px solid var(--patina);
    background:linear-gradient(var(--wash),var(--wash)),var(--stone);
    color:var(--ink);font-size:13.5px;line-height:1.6;
    display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap}
  /* 문장만 재운다 — 상자는 본문 폭이고, 한 줄이 74자를 넘으면 눈이 다음 줄
     머리를 못 찾는다(셸의 .sub 과 같은 규칙). */
  #sm-wait .t{margin:0;flex:1 1 min(320px,100%);max-width:74ch}
  #sm-wait .progress{flex:0 0 100%}
  /* 오류가 초록 바탕을 쓰면 색이 뜻과 반대로 말한다. */
  #sm-wait.bad{border-left-color:var(--copper);color:var(--copper);
    background:linear-gradient(var(--wash-copper),var(--wash-copper)),var(--stone)}
  #sm-wait.bad .progress i{background:var(--copper)}

  /* 목록 자리의 빈 상태·오류. 생김새는 셸의 .empty 가 갖는다 — 여기서는 그것이
     테두리 있는 상자(.list) 안에 설 때만 손본다: 상자 안 상자가 되지 않게
     바깥 테두리를 지우고(.bare), 안쪽 여백을 준다. */
  .sm-note{margin:14px}
  #sm-kw .list.bare,#sm-aiq .list.bare{border:0;background:none;box-shadow:none}
  /* 불러오는 동안 세우는 스켈레톤 — 셸의 .skel 을 그대로 쓴다. */
  .sm-note > .skel{margin:10px 0}

  /* 마지막 수집이 일부 실패했다는 알림. #sm-wait 과 같은 자리·같은 몸을 쓰되 색만
     산화동(경고)이다 — 자리가 다르면 "무엇이 지금 화면을 설명하는가"가 흩어진다.
     한글이 섞이는 문장이라 letter-spacing·uppercase 를 걸지 않는다.
     "같은 몸"이라 실행 배너가 화면 위에 붙게 된 것도 같이 따라간다 — 둘이 나란히
     설 수 있어서, 하나만 붙으면 스크롤할 때 서로 어긋나 보인다.
     (주석이 여기서 한 번 일찍 닫혀 있었다 — 그 뒤 두 줄이 선택자로 읽혀 아래
     #sm-bad 규칙을 통째로 삼켰다. 실패 알림이 색도 자리도 없이 나갔다.) */
  #sm-bad{margin:0;
    padding:13px 16px;border-left:2px solid var(--copper);
    background:linear-gradient(var(--wash-copper),var(--wash-copper)),var(--stone);
    color:var(--copper);font-size:13.5px;line-height:1.6;
    display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap}
  #sm-bad .t{margin:0;flex:1 1 min(320px,100%);max-width:74ch}
  #sm-bad .acts{margin:0;flex:0 0 auto}

  /* 검색 성과 — 서치콘솔 4대 지표를 같은 크기로 나란히 둔다.
     축이 서로 달라 한 그림에 겹치지 않는다(게재순위는 방향까지 반대다). */
  .sm-charts{display:grid;grid-template-columns:repeat(2,1fr);gap:44px;margin-top:4px}
  @media(max-width:760px){.sm-charts{grid-template-columns:1fr}}
  .sm-ct{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
    font:500 12.5px/1 var(--sans);color:var(--ink);margin-bottom:10px}
  /* 제목 옆 현재 값 — 선은 모양만 말한다. 지금 얼마인지는 숫자로 붙인다. */
  .sm-ct .nowv{font:500 14px/1 var(--mono);font-variant-numeric:tabular-nums;
    color:var(--ink);white-space:nowrap}
  .sm-ct .nowv .d{font-size:11px;margin-left:5px}
  /* 세로축 값은 그림 오른쪽 위·아래에 얹는다 — preserveAspectRatio:none 이라
     SVG 안에 글자를 두면 늘어난다. */
  .sm-plot{position:relative}
  .sm-gl{position:absolute;right:0;font:400 10.5px/1 var(--mono);color:var(--slate);
    background:var(--stone);padding:1px 0 1px 7px;pointer-events:none}
  .sm-gl.t{top:-4px} .sm-gl.b{bottom:-4px}
  .sm-line{display:block;width:100%;height:76px;overflow:visible}
  .sm-line path{fill:none;stroke:var(--patina);stroke-width:1.2;
    vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
  .sm-line circle{fill:var(--patina);vector-effect:non-scaling-stroke}
  .sm-line line.g{stroke:var(--rule-soft);stroke-width:1;stroke-dasharray:2 4;
    vector-effect:non-scaling-stroke}
  .sm-line rect{fill:transparent}
  .sm-line rect:hover{fill:var(--wash)}
  .sm-ax{display:flex;justify-content:space-between;font:400 10.5px/1 var(--mono);
    color:var(--slate);margin-top:6px;opacity:.75}
  .sm-none{font-size:13px;color:var(--slate);margin:10px 0 2px}

  /* 분해 표 — 긴 URL 이 표 폭을 밀지 않게 첫 칸만 줄인다 */
  #sm-dim .tabs{display:flex;gap:6px}
  #sm-dim .tabs button{font:400 12px/1 var(--sans);color:var(--slate);background:transparent;
    border:1px solid var(--rule);border-radius:4px;padding:6px 12px;cursor:pointer}
  #sm-dim .tabs button.on{color:var(--patina);border-color:var(--patina);background:var(--wash)}
  #sm-dim table{table-layout:fixed;width:100%;min-width:420px}
  #sm-dim th:first-child,#sm-dim td:first-child{width:46%}
  #sm-dim .sm-k{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #sm-dim th button{font:inherit;color:inherit;background:none;border:0;padding:0;
    cursor:pointer;letter-spacing:inherit;text-transform:inherit}
  #sm-dim th button:hover{color:var(--ink)}
  #sm-dim th button.on{color:var(--patina)}
  #sm-dim th button.on::after{content:" ↓"}
  #sm-dim th button.on.asc::after{content:" ↑"}
  /* 노출 비중 막대 — 상위 몇 줄이 전부인지가 숫자보다 빨리 보인다. */
  #sm-dim .sm-share{display:block;height:2px;background:var(--bar);border-radius:2px;
    margin-top:6px;max-width:260px}
  #sm-dim .sm-share i{display:block;height:100%;border-radius:2px;background:var(--patina);
    opacity:.55}
  #sm-dim .tools{margin-bottom:10px}

  /* 키워드 선별 — 자동은 서치콘솔 노출만 켠다. 나머지는 사람이 골라야 한다. */
  #sm-kw .tabs{display:flex;gap:6px}
  /* 탭 이름은 한글이다 — 등폭으로 찍으면 폴백 서체로 떨어진다(CLAUDE.md). */
  #sm-kw .tabs button{font:400 12.5px/1 var(--sans);color:var(--slate);background:transparent;
    border:1px solid var(--rule);border-radius:6px;padding:6px 12px;cursor:pointer}
  #sm-kw .tabs button.on{color:var(--patina);border-color:var(--patina);background:var(--wash)}
  /* 목록은 폼이다 — 셸의 .card 와 같은 몸으로 세운다(테두리·모서리·종이색).
     안내가 통째로 들어설 때만 .bare 가 그 몸을 벗긴다. */
  #sm-kw .list{max-height:340px;overflow:auto;border:1px solid var(--rule);
    border-radius:var(--r-md);background:var(--card);box-shadow:var(--shadow-1);
    overflow-x:hidden}
  /* flex 로 두면 자식이 넘칠 때 .kw 의 flex-basis:0 이 0px 으로 굳어 글자가 사라진다.
     grid 의 1fr 은 넘쳐도 자기 몫을 지킨다. */
  #sm-kw label{display:grid;grid-template-columns:auto minmax(0,1fr) auto;
    align-items:center;gap:10px;padding:7px 12px;cursor:pointer;
    border-bottom:1px solid var(--rule-soft);font-size:13.5px}
  #sm-kw label:hover{background:var(--bar)}
  #sm-kw label input{accent-color:var(--patina);flex:none;margin:0}
  /* 원본 어딘가의 text-transform 이 상속돼 검색어가 전부 대문자로 보였다.
     검색어는 사용자가 실제로 친 문자열이라 그대로 보여야 한다. */
  #sm-kw .kw{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    color:var(--ink);text-transform:none}
  /* "노출 1,234" 는 한글과 숫자가 한 요소에 섞인다 — 등폭은 숫자 정렬만 얻는다. */
  #sm-kw .n{font:var(--micro);font-variant-numeric:tabular-nums;color:var(--slate);
    white-space:nowrap}
  #sm-kw .bar2{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
  /* 목록을 못 읽는 동안 — 그 목록에 거는 손잡이는 같이 물러난다. */
  #sm-kw.dead .tabs,#sm-kw.dead .bar2{display:none}
  #sm-kw .cnt{font-size:12.5px;color:var(--slate)}
  #sm-kw .warn{color:var(--copper)}

  /* AI 질문 관리 — 만들어 놓고 볼 데가 없었다. 목록이 곧 편집기다. */
  #sm-aiq .list{max-height:420px;overflow:auto;border:1px solid var(--rule);
    border-radius:var(--r-md);background:var(--card);box-shadow:var(--shadow-1)}
  #sm-aiq .q{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;
    align-items:center;gap:10px;padding:7px 12px;
    border-bottom:1px solid var(--rule-soft)}
  #sm-aiq .q:last-child{border-bottom:0}
  #sm-aiq .q input[type=checkbox]{accent-color:var(--patina);margin:0}
  /* 꺼진 질문은 목록에 남지만 이번 확인에는 안 나간다. 그 사실은 배지가 말한다 —
     예전에는 줄 전체를 opacity .45 로 흐려서 무슨 질문인지 읽을 수가 없었다.
     꺼짐은 상태지 "덜 중요한 글자"가 아니다. */
  #sm-aiq .q.off .t{color:var(--slate)}
  #sm-aiq .t{min-width:0;font:400 13.5px/1.5 var(--sans);color:var(--ink);
    background:transparent;border:1px solid transparent;border-radius:4px;
    padding:4px 6px;text-transform:none}
  #sm-aiq .t:hover{border-color:var(--rule-soft)}
  #sm-aiq .t:focus{outline:0;border-color:var(--patina);background:var(--wash)}
  /* 갈래 이름(추천·비교·문제해결)도 한글이다 — 등폭에 걸지 않는다. */
  #sm-aiq select{font:400 12px/1 var(--sans);color:var(--slate);
    background:transparent;border:1px solid var(--rule);border-radius:6px;
    padding:5px 6px}
  #sm-aiq .n{font:var(--micro);font-variant-numeric:tabular-nums;color:var(--slate);
    white-space:nowrap}
  /* 지우기는 파괴적 행동이라 이름을 갖는다 — 부품은 셸의 .go.sm.danger 다.
     다만 스무 줄짜리 목록에서 채운 산화동 버튼이 스무 개 서면 목록이 아니라
     경고판이 된다. 평소에는 테두리로 물러나 있다가 그 줄에 손을 얹거나 포커스가
     닿으면 제 색(파괴적)으로 선다 — 기회 카드의 .acts 와 같은 규칙이다.
     누르면 confirm 이 무엇이 사라지는지 먼저 말한다(아래 aiqPanel). */
  #sm-aiq .del:not(:hover):not(:focus-visible){background:transparent;
    border-color:var(--rule);color:var(--slate)}
  #sm-aiq .q:hover .del:not(:hover):not(:focus-visible){border-color:var(--copper);
    color:var(--copper)}
  /* 좁은 화면에서는 다섯 칸이 한 줄에 못 선다 — 질문 글자가 반쪽만 보였다.
     질문·지우기를 첫 줄에 두고 갈래·횟수를 아래로 내린다. */
  @media(max-width:560px){
    #sm-aiq .q{grid-template-columns:auto minmax(0,1fr) auto;row-gap:6px}
    #sm-aiq .q input[type=checkbox]{grid-area:1/1}
    #sm-aiq .q .t{grid-area:1/2}
    #sm-aiq .q .del{grid-area:1/3}
    #sm-aiq .q select{grid-area:2/2;justify-self:start}
    #sm-aiq .q .n{grid-area:3/2;justify-self:start}
  }
  #sm-aiq .bar2{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
  #sm-aiq .new{flex:1 1 260px;font:400 13.5px/1 var(--sans);color:var(--ink);
    background:transparent;border:1px solid var(--rule);border-radius:6px;padding:9px 10px}
  #sm-aiq .cnt{font-size:12.5px;color:var(--slate)}
  #sm-aiq .warn{color:var(--copper)}

  /* 플러그인으로 넘기는 일 — 조용한 목록. 화면의 결론이 아니라 각주다. */
  #sm-cc ul{list-style:none;padding:0;margin:0;border-top:1px solid var(--rule-soft)}
  #sm-cc li{display:flex;align-items:center;gap:18px;padding:12px 0;
    border-bottom:1px solid var(--rule-soft)}
  #sm-cc li div{flex:1;min-width:0}
  #sm-cc li b{display:block;font-weight:600;font-size:14px}
  #sm-cc li span{color:var(--slate);font-size:12.5px}
  /* 칩은 셸의 .cmd.sec 을 그대로 쓴다 — 명령을 복사하는 칩이라는 뜻이 이미 그
     부품에 있다(복사 아이콘·[복사됨] 표시). 여기서 다시 칠하면 같은 것이 화면마다
     다르게 보인다. 줄 안에서 안 눌리게 하는 것만 손본다. */
  #sm-cc .cmd{flex:none;margin:0}
  @media(max-width:640px){#sm-cc li{flex-direction:column;align-items:flex-start;gap:8px}}

  /* 설정 — 고르면 곧바로 저장한다. 저장 버튼이 따로 없으니 결과는 옆에서 말해 준다. */
  /* 칸 셋(주기·저장소·GA4)은 한 섹션 안의 형제다 — 섹션 제목(h2)과 같은 크기로
     세우면 어느 것이 상위인지가 안 읽힌다. */
  #sm-set .grp{padding-top:22px;margin-top:22px;border-top:1px solid var(--rule-soft)}
  /* 설정을 못 읽는 동안 — 빈 칸 셋 대신 상자 하나가 말한다. .cli 는 /api/settings
     와 무관하게 서므로 남는다. */
  #sm-set.dead .grp:not(.cli){display:none}
  .sm-setfail{margin-top:4px}
  #sm-set .grp h3{font:600 14.5px/1.35 var(--sans);color:var(--ink);margin:0}
  #sm-set .grp .sub{margin:5px 0 12px}
  #sm-set .opts{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

  /* 연결 명령은 한 줄이 길다 — 셸의 .cmd 칩(등폭 + 복사 손잡이)을 그대로 쓰되

  /* 모바일: 차트 SVG 는 720px 고정이고 부모(.logwrap)가 overflow-x:auto 로 받는다.

    .logwrap{position:relative;-webkit-overflow-scrolling:touch;
      /* 오른쪽 끝에 페이드 — 끝나지 않았다는 신호 */
      -webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);

    .logwrap.at-end{-webkit-mask-image:none;mask-image:none}
    .sm-swipe{font:var(--micro);color:var(--slate);margin:6px 0 0;
      display:flex;align-items:center;gap:6px}

  @media(min-width:901px){.sm-swipe{display:none}}

  /* 안내 단계의 실행 버튼 — 원본 .cmd 는 명령어를 복사하는 칩이었다. */
  .stp .cmd{font:inherit;font-size:13px;cursor:pointer;border:1px solid var(--patina);
    background:transparent;color:var(--patina);border-radius:6px;padding:5px 12px}
  .stp .cmd:hover:not(:disabled){background:var(--wash)}
  .stp .cmd:disabled{opacity:.5;cursor:default}

  /* 기회 카드: 버튼 넷이 카드마다 반복돼 소음이 된다. 평소엔 물러나 있게. */
