  .opp:hover .acts button,.opp .acts button:focus-visible{opacity:1}
  .opp [data-write]{color:var(--copper);border-color:var(--copper)}
</style>
<script>
(function () {
  // 이 조각은 호스팅 대시보드에만 얹힌다(server/app.py 의 /d). 그 배포에서는 유료 키를
  // 서버가 대므로 doctor 의 준비물 명부에서도 owner 가 server 로 뒤집혀 있다
  // (SEOMINER_HOSTED). 원본 뷰가 "키를 발급하세요"라고 말하면 안 되는 자리를 이 표식
  // 하나로 판단한다 — 렌더된 한국어를 정규식으로 되짚지 않는다.
  // 정본은 서버다 — /d 가 첫 <script> 앞에 세운다(app.py). 여기서 세우면 늦어서,
  // 원본의 첫 렌더가 이미 지나간 뒤가 된다. 이 줄은 애드온만 따로 얹는 경로(미리보기·
  // 검사)를 위한 보험이고, 서버가 이미 세웠으면 같은 값을 다시 쓰는 것뿐이다.
  window.SM_HOSTED = true;

  // 초기화 한 곳이 터져도 나머지는 돈다. 조용히 넘어가지도 않는다 — 콘솔에 원인을
  // 남기고 화면 맨 위에 배너를 세운다. 예전에는 여기서 throw 해서 아래
  // addEventListener 가 하나도 안 걸렸다: 사이드바도, 사이트 전환도, 실행 버튼도
  // 같이 죽었다. 어긋남을 '알리는 것'과 화면을 '못 쓰게 만드는 것'은 다르다.
  var FAILED = {};
  function fail(what, e) {
    if (FAILED[what]) return;      // "sm:site" 마다 다시 부르는 step 이 있다 — 한 번만 알린다
    FAILED[what] = 1;
    console.error("[seo-miner] " + what, e);
    var host = document.querySelector("main") || document.body;
    if (!host) return;
    var box = document.getElementById("sm-fail");
    if (!box) {
      box = document.createElement("div");
      box.id = "sm-fail";
      host.insertBefore(box, host.firstChild);
    }
    // 유저가 읽는 줄이다 — 무엇이 안 뜨는지와 무엇을 하면 되는지를 먼저 말하고,
    // 기술적 원인은 뒤에 붙인다(그대로 붙여 보내면 원인 추적이 된다).
    var line = document.createElement("p");
    line.textContent = "화면의 일부(" + what + ")를 세우지 못했습니다. " +
      "새로고침하면 다시 세웁니다. 그래도 같으면 아래 원인을 그대로 알려 주시면 " +
      "고칩니다. 원인: " + ((e && e.message) || e);
    box.appendChild(line);
  }
  function step(what, fn) { try { fn(); } catch (e) { fail(what, e); } }

  var b = document.createElement("button");
  b.id = "sm-run"; b.textContent = "전체 분석 실행";

  function proj() {
    var p = document.getElementById("proj");
    return p ? p.value : "";
  }
  // 실행 배너 한 자리. 누른 직후·도는 중·끝났다·못 했다가 전부 여기로 온다 —
  // 예전에는 버튼 글자만 4초 바뀌고 끝이라, 무엇이 언제 끝나는지 화면에 없었다.
  // 셋으로 읽힌다: 상태 배지(.badge) · 문장 · 진행 막대(.progress). 세 부품 다
  // 셸이 갖는다 — 여기서 같은 것을 다시 만들지 않는다. pct 를 알면 막대에 값을
  // 싣고, 모르면 .wait 로 둔다(남은 시간을 지어내지 않는다).
  var BADGE = {"": ["run", "수집 중"], done: ["ok", "완료"], bad: ["bad", "실패"]};

  // 배너가 설 자리. 정본은 셸이다 — SM.slot() 이 지금 보는 화면의 머리(.vh) 아래,
  // 다음 행동 띠 위 자리를 준다. 거기 서야 폭이 본문 칸과 같고, 화면을 바꾸면
  // 셸의 show() 가 data-vban 을 단 것을 새 자리로 옮겨 준다. 예전에는 이 파일이
  // 자리를 스스로 정해서 main 첫 자식·본문 폭의 절반·h1 보다 위에 떴다.
  // 아직 화면 상자가 안 섰으면(첫 폴링) 자리가 없다 — 그때는 안 그린다.
  // 다음 폴링이 sm:site 뒤에 오므로 한 박자 늦게 제자리에 선다.
  function slot() { return (window.SM && SM.slot) ? SM.slot() : null; }

  function banner(kind, text, pct) {
    var host = slot();
    if (!host) return;
    var el = document.getElementById("sm-wait");
    if (!el) {
      el = document.createElement("div");
      el.id = "sm-wait";
      el.setAttribute("data-vban", "");     // 셸의 show() 가 이 표식을 보고 옮긴다
      // 화면을 안 보고 있어도 알아야 한다 — 실행은 몇 분 걸리고, 그동안 유저는
      // 다른 데를 본다. polite 라 읽던 문장을 끊지 않고 다음 틈에 읽어 준다.
      el.setAttribute("role", "status");
      el.setAttribute("aria-live", "polite");
      el.innerHTML = '<span class="badge"></span><p class="t"></p>' +
        '<div class="progress wait"><i></i></div>';
    }
    if (el.parentNode !== host) host.appendChild(el);
    if (el.className !== kind) el.className = kind;      // "" 도는 중 · done · bad
    var tag = BADGE[kind] || BADGE[""], badge = el.querySelector(".badge");
    badge.className = "badge " + tag[0];
    put(badge, tag[1]);
    put(el.querySelector(".t"), text);
    // 막대는 도는 동안만 선다 — 끝난 뒤에도 서 있으면 아직 도는 것처럼 읽힌다.
    var pr = el.querySelector(".progress");
    pr.hidden = !!kind;
    pr.classList.toggle("wait", typeof pct !== "number");
    pr.firstChild.style.width = typeof pct === "number" ? pct + "%" : "";
    // 지금 보고 있는 화면의 다음 행동 띠도 같이 "도는 중"으로 넘긴다.
    running(!kind);
  }
  // 도는 중 배너만 지운다. 결과(done·bad)는 사람이 읽을 시간을 준다.
  function unbanner() {
    var el = document.getElementById("sm-wait");
    if (el && !el.className) el.remove();
    running(false);
  }
  // 다음 행동 띠(.next)의 도는 중 상태. 화면을 옮겨도 따라가야 하므로 어느
  // 화면에 서 있는지는 매번 다시 본다 — 셸이 SM.cur 로 정본을 준다.
  var RUN_VIEW = "";
  function running(on) {
    if (typeof window.nextRunning !== "function") return;
    var v = (window.SM && SM.cur) || "";
    if (RUN_VIEW && RUN_VIEW !== v) nextRunning(RUN_VIEW, false);
    RUN_VIEW = on ? v : "";
    if (v) nextRunning(v, !!on);
  }

  // 분석은 워커가 백그라운드로 돈다. 끝난 걸 화면이 모르면 유저는 빈 대시보드를
  // 보고 있다가 직접 새로고침해야 한다 — 첫 분석이면 그게 이탈 지점이다.
  // PENDING: 시작 요청은 받아졌는데 아직 워커가 running 으로 안 올라온 사이.
  // 이 틈에 폴링이 "안 돌고 있다"고 읽어 방금 세운 시작 배너를 지웠다.
  var ran = null, ranStage = "", RUNNING = false, PENDING = false;
  function paint(st) {
    var r = st && st[proj()];
    if (!r) return;
    RUNNING = !!r.running;
    if (RUNNING) PENDING = false;
    b.disabled = RUNNING;
    b.textContent = !RUNNING ? "전체 분석 실행"
      : (typeof r.pct === "number" ? "분석 중 " + r.pct + "%" : "분석 중…");
    runLock(RUNNING);
    problem(r);            // 지난 런에서 실패한 단계가 있으면 그것부터 말한다
    if (RUNNING) {
      if (r.stage) ranStage = r.stage;
      waiting(r);
    } else if (ran) {
      load(); loadDoctor(); perfLoad();                  // 끝나면 스스로 채워진다
      done(r);
    } else if (!PENDING) {
      unbanner();
    }
    ran = r.running;
  }

  // 도는 동안 화면은 빈 상태 문구로 뒤덮인다 — "실행하세요"라고 잘못 안내한다.
  // 문구만 세우면 "얼마나 남았나"에 답을 못 한다. 워커가 단계마다 찍어 주는
  // 진행률(sites.stage_pct)을 그대로 보여 준다 — 8분의 1씩 뛰지만 지어낸 값이 아니다.
  function waiting(r) {
    var s = (STAGE || {})[r.stage], now = (s && s.t) || "";   // 폴링이 STAGE 보다 빠를 수 있다
    var head = typeof r.pct === "number"
      ? r.pct + "% 진행했습니다." + (now ? " 지금 " + now + " 단계입니다." : "")
      : (r.last_run_at ? "다시 측정하는 중입니다." : "첫 측정이 진행 중입니다.");
    var tail = r.last_run_at
      ? " 끝나면 숫자가 저절로 갱신됩니다."
      : " 검색 실적부터 개선 기회까지 순서대로 모읍니다. 몇 분 걸립니다." +
        " 끝나면 숫자가 저절로 갱신됩니다.";
    banner("", head + tail, r.pct);
  }

  // 끝난 순간이 가장 중요한 한 줄이다 — 무엇이 끝났고 화면의 어디가 방금 값인지.
  function done(r) {
    var s = (STAGE || {})[ranStage], bad = r && r.last_ok === 0;
    banner(bad ? "bad" : "done",
      bad ? (s ? s.t + ul(s.t) + " 마치지 못했습니다." : "분석을 마치지 못했습니다.") +
            " 실패한 단계와 다시 실행할 자리는 아래 알림에 있습니다."
          : (s ? s.t + ul(s.t) + " 마쳤습니다." : "분석을 마쳤습니다.") +
            " 숫자를 방금 값으로 바꿨습니다." +
            (r && r.last_run_at ? " 기준 시각은 " + r.last_run_at + "입니다." : ""));
    say(bad ? "일부 단계가 실패했습니다" : "수집을 마쳤습니다", bad ? "bad" : "ok");
    ranStage = "";
    setTimeout(function () {
      var el = document.getElementById("sm-wait");
      if (el && el.className === "done") el.remove();
    }, 20000);
  }

  // 폴링이 계속 실패하면 화면은 옛 숫자를 진짜인 것처럼 들고 있게 된다.
  // 한 번 끊긴 것과 계속 끊긴 것은 다르다 — 세 번(약 24초) 이어질 때만 말한다.
  var pollBad = 0;

  // 실패한 단계가 있어도 화면은 여태 아무 말도 안 했다 — 잔액이 떨어져 순위가
  // 3주째 안 걸려도 사용자는 낡은 숫자를 최신으로 읽는다. 다음 런이 시작되면
  // (running) 지운다: 지금 다시 재는 중에 지난 실패를 세워 두면 두 번 놀란다.
  // 단계 이름은 서버가 보낸 id 를 단계 용어표로 옮긴다 — 사본을 만들지 않는다.
  function problem(r) {
    var el = document.getElementById("sm-bad"), host = slot();
    if (r.running || r.last_ok !== 0) { if (el) el.remove(); return; }
    if (!host) return;
    if (!el) {
      el = document.createElement("div");     // 안에 문장과 버튼이 함께 선다
      el.id = "sm-bad";
      el.setAttribute("data-vban", "");     // 셸의 show() 가 이 표식을 보고 옮긴다
      el.setAttribute("role", "status");
    }
    if (el.parentNode !== host) host.appendChild(el);
    // 오류 공식대로 셋으로만 읽힌다: 무엇이 실패했나 · 왜 · 지금 할 것.
    // 단계 이름을 먼저 세우고 이유를 뒤에 붙인다 — 이유를 앞에 두면 문장이
    // "…질문이 없습니다 가 실패했습니다" 처럼 읽힌다. 나머지 사정(그 단계의
    // 숫자가 지난 값이라는 것)은 툴팁으로 접는다.
    var fails = [];
    String(r.last_error || "").split("; ").forEach(function (part) {
      var i = part.indexOf(": ");
      var id = i < 0 ? "" : part.slice(0, i), g = (STAGE || {})[id];
      fails.push({id: g ? id : "", nm: (g && g.t) || id || "일부 단계",
                  why: i < 0 ? part : part.slice(i + 2)});
    });
    // 실패한 단계마다 다시 실행할 자리를 준다 — 둘이 실패했는데 버튼이 하나면
    // 나머지 하나는 복구 경로가 화면에 없다.
    var act = fails.filter(function (f) { return f.id; }).map(function (f) {
      return '<button class="go sm sec" data-run="' + esc(f.id) + '">' +
        esc(STAGE[f.id].run) + "</button>";
    }).join("");
    var line = fails.length === 1
      ? "지난 수집에서 " + fails[0].nm + iga(fails[0].nm) + " 실패했습니다. " + fails[0].why
      : "지난 수집에서 " + fails.length + "개 단계가 실패했습니다. " +
        fails.map(function (f) { return f.nm + " — " + f.why; }).join(" · ") + ".";
    var tip = "이 단계의 숫자는 지난 수집 값 그대로입니다. 다시 실행하면 이어서 채워집니다.";
    var html = '<span class="badge warn">실패</span><p class="t">' + esc(line) +
      '<span class="hint" tabindex="0" data-tip="' + esc(tip) + '" aria-label="' +
      esc(tip) + '">i</span></p>' + (act ? '<div class="acts">' + act + "</div>" : "");
    if (el.innerHTML !== html) el.innerHTML = html;
  }

  async function poll() {
    try {
      paint(await (await fetch("/api/run/status")).json());
      pollBad = 0;
    } catch (e) {
      if (++pollBad === 3 && !RUNNING) {
        banner("bad", OFFLINE + " 지금 보이는 숫자는 마지막으로 받은 값입니다." +
          " 새로고침하면 다시 받아 옵니다.");
      }
    }
  }
  // 전 단계 일괄 실행. 레일 바닥 버튼과, 화면이 `data-run="run"` 으로 부르는
  // 버튼이 같은 것을 탄다 — [기록]·[안내]처럼 선언된 단계가 없는 화면은 이것이
  // 유일한 다음 걸음이라, 예전에는 띠가 "왼쪽 아래 [전체 분석 실행]" 이라고
  // 글자로 가리키기만 했다. 가리키는 대신 그 자리에서 누르게 한다.
  // ("run" 은 단계가 아니다 — 이음매 검사의 NON_STAGE 에 이미 들어 있다.)
  async function runAll(btn) {
    if (!proj()) return;
    var was = btn.textContent;
    btn.disabled = true; btn.textContent = "시작하는 중…";
    try {
      var rr = await fetch("/api/run", {method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({project: proj()})});
      if (!rr.ok) throw new Error((await rr.json().catch(noDetail)).detail || "");
    } catch (e) {
      btn.disabled = false; btn.textContent = was;
      banner("bad", "분석을 시작하지 못했습니다. " + reason(e) +
        " 잠시 뒤 다시 누르면 재시도합니다.");
      say("시작하지 못했습니다", "bad");
      return;
    }
    ranStage = ""; PENDING = true;
    btn.textContent = was;                 // 잠금은 폴링이 푼다(runLock)
    btn.dataset.smLock = "1";
    say("수집을 시작했습니다", "ok");
    banner("", "전체 분석을 시작했습니다. 끝나면 숫자가 저절로 갱신됩니다.");
    poll();
    setTimeout(function () { PENDING = false; if (!RUNNING) runLock(false); }, 12000);
  }
  b.addEventListener("click", function () { runAll(b); });

  // 오류 문구는 원인 + 복구 행동이다. "실패했습니다" 로 끝내지 않는다.
  //
  // 서버가 안 받아 준 일은 **한 가지 말로만** 한다. 예전에는 같은 사건을 네 가지로
  // 말했다("서버에 연결하지 못했습니다"·"질문 목록을 주지 않았습니다"·"요청을 받지
  // 않았습니다"·"연결이 끊겼습니다"). 읽는 사람에게는 전부 같은 고장인데, 말이
  // 갈리면 서로 다른 고장으로 읽힌다.
  var OFFLINE = "서버가 응답하지 않았습니다.";
  function noDetail() { return {}; }
  function reason(e) {
    var m = (e && e.message) || "";
    return m ? m.slice(0, 90) : OFFLINE;
  }
  // 을/를 — 단계 이름이 표에서 오므로 조사를 손으로 못 고른다("순위 추적을",
  // "키워드 찾기를"). 받침 유무만 보면 되고, 안 그러면 문장이 매번 어색해진다.
  function batchim(w) {
    var c = String(w || "").charCodeAt(String(w).length - 1);
    return c >= 0xac00 && c <= 0xd7a3 && (c - 0xac00) % 28;
  }
  function ul(w) { return batchim(w) ? "을" : "를"; }
  function iga(w) { return batchim(w) ? "이" : "가"; }
  var sel = document.getElementById("proj");
  if (sel) sel.addEventListener("change", poll);
  poll();
  setInterval(poll, 8000);    // 끝나면 버튼이 풀리고 화면이 스스로 채워진다

  // 기회 카드마다 '글 쓰기' — /create run 의 자리다. 리포가 안 붙어 있으면 서버가
  // 428 로 알려 주고, 그때 연결 링크를 보여 준다.
  //
  // **버튼 자신에 건다. document 위임으로 잡으면 안 된다** — 원본은 기회 카드의
  // .acts 에서 event.stopPropagation() 을 한다(카드가 같이 펼쳐지지 않게). 위임
  // 리스너에는 이 클릭이 영영 안 닿는다. 그래서 SM.host.oppBtn 이 만드는 버튼은
  // 자기 onclick 을 인라인으로 직접 단다(아래 SM.host) — 나중에 걸지 않는다.
  async function writeClick(b) {
    var id = b.getAttribute("data-write");
    b.disabled = true; b.textContent = "작성 중…";
    try {
      var r = await fetch("/api/create", {method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({project: proj(), opportunity_id: Number(id)})});
      var d = await r.json().catch(noDetail);
      if (r.ok && d.pr) {
        banner("done", "초안을 PR 로 올렸습니다. 내용을 확인하고 머지하면 반영됩니다.");
        say("초안을 올렸습니다", "ok");
        b.outerHTML = '<a href="' + d.pr + '" target="_blank" rel="noopener">PR 열기</a>';
        return;
      }
      if (r.status === 428) {            // SET_H 가 낡았다 — 설정을 다시 읽고 그 자리로
        SET_DONE = ""; REPO_LIST = null; await setLoad();   // setLoad 가 SM.repaint 로 다시 그린다
        SM.touched = true; SM.show("settings");
        return;
      }
      banner("bad", "초안을 만들지 못했습니다. " + (d.detail || OFFLINE) +
        " 잠시 뒤 다시 누르면 재시도합니다.");
      say("초안을 만들지 못했습니다", "bad");
    } catch (e) {
      banner("bad", OFFLINE + " 잠시 뒤 다시 누르면 재시도합니다.");
      say("초안을 만들지 못했습니다", "bad");
    }
    b.disabled = false; b.textContent = "콘텐츠 작성";
  }

  document.title = "SEO 대시보드 — seo-miner";   // 원본 <title> 은 애드온보다 앞에 있다

  // ── 단계 용어 한 벌 ─────────────────────────────────────────
  // 정본은 stage.STAGE_LABELS(파이썬)다 — 조립(dashboard.py._assemble)이
  // window.__STAGES__ 로 실어 보낸다. 여기서 사본을 만들지 않는다: 예전엔 여기와
  // stage.py 에 각자 있었고, 문구가 이미 갈라져 있었다(gsc.t: "검색 실적 수집" vs
  // "구글 실적 읽기" 등). 키는 단계 id 라 화면 글자를 되짚지 않는다.
  var STAGE = window.__STAGES__ || {};

  // [기록] 화면의 실행 종류 라벨도 이 표를 본다(runs.kind 는 단계 id 와 같은 말이다).
  window.SM_STAGE = STAGE;

  // 안내 단계의 이름·설명은 이제 이 애드온이 되짚어 붙이지 않는다 — stage.py 가
  // 같은 STAGE_LABELS 로 이미 렌더한 값을 payload 에 실어 보내므로 원본이 처음부터
  // 맞게 그린다(renderGuide). 여기 남는 건 그 값과 다르게(실행 버튼으로) 그릴
  // 자리뿐이다 — 아래 SM.host.
  function put(el, s) { if (el && s && el.textContent !== s) el.textContent = s; }

  // 눌렀는데 화면이 그대로면 눌렸는지 알 수 없다 — 결과는 셸의 토스트가 말한다.
  // 셸이 아직 안 섰을 수도 있으니(검사·미리보기) 없으면 조용히 넘어간다.
  function say(msg, kind) { if (typeof window.toast === "function") toast(msg, kind); }

  // 단계 하나를 돌린다. 피드백은 세 박자다 — 눌렀다(버튼) · 도는 중(배너) ·
  // 끝났다(배너 + 화면 갱신). 실패는 버튼 라벨을 44자로 자르지 않고 배너에서
  // 원인과 다음 행동을 말한다.
  async function runStage(stage, btn) {
    var was = btn.textContent, g = (STAGE || {})[stage], nm = (g && g.t) || "분석";
    btn.disabled = true; btn.textContent = "시작하는 중…";
    try {
      var r = await fetch("/api/run", {method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({project: proj(), stages: stage})});
      if (!r.ok) throw new Error((await r.json().catch(noDetail)).detail || "");
    } catch (e) {
      btn.disabled = false; btn.textContent = was;
      banner("bad", nm + ul(nm) + " 시작하지 못했습니다. " + reason(e) +
        " 잠시 뒤 다시 누르면 재시도합니다.");
      say("시작하지 못했습니다", "bad");
      return;
    }
    ranStage = stage; PENDING = true;
    btn.textContent = was;                 // 잠금은 폴링이 푼다(runLock)
    btn.dataset.smLock = "1";
    say("수집을 시작했습니다", "ok");
    banner("", nm + ul(nm) + " 시작했습니다. 끝나면 숫자가 저절로 갱신됩니다.");
    poll();
    // 폴링 자체가 못 돌면 버튼이 영영 잠긴 채로 남는다 — 그때만 손으로 푼다.
    setTimeout(function () { PENDING = false; if (!RUNNING) runLock(false); }, 12000);
  }

  // 도는 동안에는 어느 단계를 눌러도 서버가 같은 이유로 막는다 — 눌러 보게 하지
  // 않는다. 여기서 잠근 것만 여기서 푼다(다른 이유로 꺼 둔 버튼을 켜지 않는다).
  function runLock(on) {
    document.querySelectorAll("[data-run]").forEach(function (x) {
      if (on) { x.disabled = true; x.dataset.smLock = "1"; }
      else if (x.dataset.smLock) { x.disabled = false; delete x.dataset.smLock; }
    });
  }

  // 화면이 자기 마크업에 심어 둔 실행 손잡이를 잇는다 — 다음 행동 띠(.next)와
  // 빈 상태(.empty)의 버튼은 셸이 window.act 로 만들고, 무엇을 할지는 배포가
  // 정한다. 로컬은 명령 복사 칩이고, 호스팅에서는 여기가 그 클릭을 받는다.
  // 다시 불러오기(data-sm-retry)도 같은 자리에서 받는다.
  //
  // 자리로 고르지 않고 **표식으로 고른다**. 처음엔 `.next [data-run], .empty
  // [data-run]` 만 봤는데, 뷰가 펼침 패널(.det .acts)에도 같은 버튼을 달자
  // 그것만 조용히 죽었다 — 떠 있는데 눌러도 아무 일이 없는, 이 리포가 이미
  // 한 번 겪은 그 모양이다. data-run 이 계약이지 상자 이름이 계약이 아니다.
  // 두 부류만 뺀다:
  //   · .sm-refresh — 머리줄 버튼은 SM.host.viewChip 이 자기 onclick 을 달아 낸다
  //   · 인라인 onclick 을 가진 것 — 그 버튼은 자기가 할 일을 이미 안다
  // 둘 다 여기서 또 받으면 한 번 누른 게 두 번 돈다.
  document.addEventListener("click", function (ev) {
    if (!ev.target.closest) return;
    var t = ev.target.closest("[data-run]");
    if (t && !t.classList.contains("sm-refresh") && !t.hasAttribute("onclick")) {
      ev.preventDefault();
      if (t.disabled) return;
      var st = t.getAttribute("data-run");
      // "run" 은 단계가 아니라 전 단계 일괄 실행이다 — 레일 바닥 버튼과 같은 것.
      return st === "run" ? runAll(t) : runStage(st, t);
    }
    var rt = ev.target.closest("[data-sm-retry]");
    if (rt) { ev.preventDefault(); retry(rt.getAttribute("data-sm-retry")); }
    // 다음 행동 띠의 버튼이 실제로 그 일을 시작한다 — 아래 칸을 손으로 찾게
    // 하지 않는다. 띠가 채운 버튼을 가지므로 그 칸의 같은 행동은 보조로 남는다.
    var jp = ev.target.closest("[data-sm-jump]");
    if (jp) { ev.preventDefault(); jump(jp.getAttribute("data-sm-jump")); }
  });

  function jump(what) {
    if (what === "overview") { SM.touched = true; return SM.show("overview"); }
    var sec = document.getElementById("sm-set");
    if (!sec) return;
    var box = sec.querySelector(what === "ga4" ? ".ga4" : ".repo");
    if (box) box.scrollIntoView({behavior: "smooth", block: "center"});
    if (what === "ga4") ga4Pick();       // 속성 목록을 바로 받아 온다
  }

  function retry(what) {
    if (what === "kw") return kwLoad();
    if (what === "aiq") return aiqLoad();
    if (what === "set") { SET_DONE = ""; return setLoad(); }
  }

  // 목록 자리의 빈 상태·오류. 셸의 .empty 계약을 그대로 쓴다 — 없는 것 · 왜
  // 필요한지 · 무엇을 하면 되는지. 행동이 없는 빈 상태는 막다른 길이다.
  // 안내가 목록을 통째로 채울 때는 바깥 상자 테두리를 지운다 — 점선 상자가
  // 실선 상자 안에 또 서면 무엇이 한 덩어리인지가 안 읽힌다.
  function bare(list, on) { if (list) list.classList.toggle("bare", !!on); }

  // 불러오는 동안. "불러오는 중…" 이라고 쓰지 않고 채워질 자리의 모양을 세운다 —
  // 셸의 .skel 이 그 부품이다.
  var SKEL = '<div class="sm-note"><span class="skel"></span>' +
    '<span class="skel line2"></span><span class="skel line3"></span></div>';

  function note(cls, title, why, acts) {
    return '<div class="' + cls + ' sm-note"><b>' + esc(title) + "</b><p>" + esc(why) +
      "</p>" + (acts ? '<div class="acts">' + acts + "</div>" : "") + "</div>";
  }
  function emptyNote(title, why, acts) { return note("empty", title, why, acts); }
  // 비었으면 채우면 되고, 실패했으면 다시 하면 된다 — 다른 일이라 다른 부품이다.
  // 셸의 .empty.err(산화동 좌측선)이 그 차이를 그린다.
  function errNote(title, why, what) {
    return note("empty err", title, why,
      '<button class="go sm sec" data-sm-retry="' + what + '">다시 시도</button>');
  }

  // [질문 만들기] — 웹에는 `/capture add` 를 칠 채팅이 없다. 이 버튼이 그 자리다.
  // 만들기만 하고 인용 확인(유료)은 사용자가 따로 눌러야 한다.
  async function makePrompts(btn) {
    var was = btn.textContent;
    btn.disabled = true; btn.textContent = "질문 만드는 중…";
    try {
      var r = await fetch("/api/ai/prompts", {method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({project: proj(), limit: 20})});
      var d = await r.json().catch(noDetail);
      if (!r.ok) throw new Error(d.detail || "");
      banner("done", "질문 " + d.added + "개를 만들었습니다. 아래 목록에서 읽어 보고" +
        " 업종과 안 맞는 것은 끄거나 고치면 됩니다.");
      say("질문을 만들었습니다", "ok");
      load(); loadDoctor(); aiqLoad();
      return;                                     // 화면이 다시 그려지며 이 버튼은 사라진다
    } catch (e) {
      banner("bad", "질문을 만들지 못했습니다. " + reason(e) +
        " 잠시 뒤 다시 누르면 재시도합니다.");
      say("질문을 만들지 못했습니다", "bad");
    }
    btn.disabled = false; btn.textContent = was;
  }

  // 화면이 자기 마크업에 심어 둔 동작을 잇는다 — 렌더된 글자를 되짚지 않는다.
  function wireActs() {
    document.querySelectorAll('[data-sm-act="make-prompts"]').forEach(function (b) {
      if (b.dataset.smWired) return;
      b.dataset.smWired = "1";
      b.onclick = function () { makePrompts(b); };
    });
  }

  // SM.repaint() 는 셸의 렌더 함수만 다시 부른다 — 이 애드온이 렌더 **뒤에** 직접
  // 심는 것들(질문 만들기 핸들러·KPI 두 칸)은 셸이 모르니 그 뒤에 한 번 더 잇는다.
  function repaint() { SM.repaint(); wireActs(); kpi(); paintSetNext(); }

  // ── 배포 손잡이 — 원본이 렌더 시점에 부르는 훅을 통째로 갈아 낀다 ────────────
  // (renderGuide·viewCmds·oppActs, dashboard.html). 로컬 기본값(명령 복사)이 아니라
  // 여기서는 실제로 돌리거나, 못 돌리는 칩은 아예 안 그린다. 다 그려진 뒤 DOM 을
  // 되짚어 고치지 않는다 — 그릴 내용 자체가 다르다.
  //
  // 예외 하나: 이 스크립트가 원본 스크립트보다 뒤에 있어서, 화면 제목 옆 칩
  // (viewChip)은 SM.sync() 가 처음 부를 때 이미 로컬 기본값(복사 칩)으로 한 번
  // 그려진 뒤다. 그래서 이 객체를 세운 다음 sm:views 를 한 번 더 알려 다시
  // 그리게 한다(원본의 viewCmds() 가 듣는다) — 아래 파일 끝.
  SM.host = {
    // 안내 단계 칩 — s.runnable 은 stage.py 가 낸 판정이다(화면은 명령 문자열을
    // 다시 안 본다). [실제로 고치기]만 예외다: 명령이 늘 /create 라 runnable 이
    // 못 되는데, 그 기회는 이미 아래 목록에 있으니 거기로 스크롤만 시킨다.
    stepChip(s) {
      // data-run 은 표식이다 — 셸의 dimHead 가 이걸 보고 "다음 행동 띠가 이미
      // 주요 버튼으로 든 단계"의 칩을 뺀다. 없으면 안내 카드와 띠에 같은 행동이
      // 두 번 선다(안내 3단계의 [키워드 찾기 실행]이 그랬다). 누르는 것은 인라인
      // onclick 이라 아래 [data-run] 위임과 겹치지 않는다(두 번 안 돈다).
      // data-run 은 onclick **뒤**에 붙인다 — test_render.py 의 호스팅 검사가
      // `class="cmd" data-stage="…" onclick="SM.host.run(` 를 한 덩어리로 찾는다.
      // 사이에 끼우면 그 검사가 "복사 칩인 채로 남았다"고 잘못 읽는다(실제로 그랬다).
      if (s.runnable && STAGE[s.id] && STAGE[s.id].run)
        return '<button class="cmd" data-stage="' + esc(s.id) + '" onclick="SM.host.run(\'' +
          esc(s.id) + '\', this)" data-run="' + esc(s.id) + '">' +
          esc(STAGE[s.id].t) + ' 실행</button>';
      if (s.id === "create")
        return '<button class="cmd" data-stage="create" onclick="SM.host.gotoOpps()"' +
          '>기회 열기</button>';
      // 남는 건 웹에서 실행할 수 없는 칩이다(빈 상태 안의 명령 복사칩, 단계는
      // 알지만 명령이 다른 일을 하는 칩) — 웹에는 칠 채팅이 없다.
      return "";
    },
    // 화면 제목 옆 칩 — 그 화면을 채우는 단계를 그 자리에서 돌린다.
    viewChip(st) {
      if (!STAGE[st]) return "";
      // data-run 은 표식이다. 셸의 dimHead 가 이걸 보고 "다음 행동 띠가 이미 주요
      // 버튼으로 든 단계"의 머리줄 버튼을 뺀다(.taken) — 같은 일을 한 화면에 두 번
      // 놓지 않는다. 도는 동안 잠그는 runLock 도 같은 표식을 본다. 누르는 것은
      // 인라인 onclick 이라 아래 [data-run] 위임과 겹치지 않는다(두 번 안 돈다).
      return '<button class="sm-refresh vh-cmd" data-run="' + esc(st) +
        '" title="' + esc(STAGE[st].t) +
        '" onclick="SM.host.run(\'' + esc(st) + '\', this)">' + esc(STAGE[st].run) + '</button>';
    },
    run(st, btn) { runStage(st, btn); },
    gotoOpps() {
      var o = document.getElementById("opps") || document.querySelector(".opp");
      if (o) o.scrollIntoView({behavior: "smooth", block: "start"});
    },
    // 기회 카드의 '콘텐츠 작성' 버튼. 저장소가 없을 때 여기 서던 [저장소 연결
    // 필요]는 **상태를 버튼 모양으로** 낸 것이었다 — 눌러도 초안이 안 나오는데
    // 옆의 [확인 표시]와 같은 몸으로 서 있었다. 상태는 배지, 행동은 버튼으로
    // 가른다: 무엇이 막혔는지는 .badge.warn 이, 푸는 길은 보조 버튼이 말한다.
    oppBtn(id) {
      if (!SET_H || !SET_H.repo) {
        var why = "이 사이트에 저장소가 연결되지 않았습니다. 연결하면 이 기회를 " +
          "콘텐츠 초안으로 받습니다. 지금도 아래 [AI 에게 수정 요청]으로 프롬프트는 " +
          "복사할 수 있습니다.";
        return '<span class="badge warn" title="' + esc(why) + '" aria-label="' +
          esc(why) + '">저장소 미연결</span>' +
          '<button class="go sm ghost" onclick="SM.host.gotoRepo()">저장소 연결</button>';
      }
      return '<button data-write="' + id + '" onclick="SM.host.write(this)">' +
        "콘텐츠 작성</button>";
    },
    write(btn) { writeClick(btn); },
    // 저장소 칸으로 데려간다 — 못 하는 일을 서버까지 가서 확인할 이유가 없다.
    gotoRepo() {
      SM.touched = true; SM.show("settings");
      var sec = document.getElementById("sm-set");
      if (sec) sec.scrollIntoView({block: "start"});
    },
  };

  // ── 호스팅이 덧붙이는 화면·섹션 ───────────────────────────────
  // 화면 목록의 정본은 뷰 파일의 view-def 다 — 조립(dashboard.py)이
  // window.__VIEWS__ 로 실어 보내고, 원본 셸(dashboard.html 의 SM)이 그걸로
  // 레일과 화면 상자를 만든다. 여기서 다시 나열하지 않는다.
  //
  // 호스팅 전용 섹션(성과·분해·키워드 관리·AI 질문·고급 분석·설정)의 정적 마크업도
  // 이제 여기서 안 짓는다 — templates/sections/*.html 의 section-def 로 선언하고,
  // dashboard.py._assemble("hosted") 가 조립 시점에 원본 뷰 순서 안에 끼운다.
  // 여기 남는 건 이미 서 있는 그 요소를 찾아 데이터를 채우고 이벤트를 붙이는
  // 것뿐이다(perfLoad·kwLoad·aiqLoad·handoff·setLoad 아래). 예전에는 이 파일이
  // createElement/innerHTML 로 섹션 자체를 짓고, HOST_SEC 라는 표로 어디에
  // 붙는지를 따로 말했다 — 그 표와 실제로 만드는 것이 어긋날 수 있었다(그리고
  // 사이드바·배치·전환까지 통째로 다시 구현해 !important 로 원본을 덮어써서, 같은
  // 조립본이 배포마다 다른 몸으로 섰다). 셸도 섹션도 원본 하나뿐이다.

  step("레일 바닥", function foot() {
    var box = document.querySelector(".rail-foot");
    if (!box || document.getElementById("sm-run")) return;
    box.prepend(b);                           // 위에서 만든 '전체 분석 실행'
    var rep = document.createElement("a");
    rep.className = "cmd"; rep.textContent = "보고서 내려받기";
    rep.addEventListener("click", function () {
      rep.href = "/api/report?project=" + encodeURIComponent(proj());
    });
    box.appendChild(rep);
  });

  // 화면 제목 옆 실행 버튼은 이제 원본의 viewCmds() 가 그린다 — 원본이 부르는
  // SM.host.viewChip(위) 이 이 자리를 채운다. 여기서 따로 만들지 않는다.

  // ── 설정 ─────────────────────────────────────────────────────
  // 사이트마다 다른 값이 사는 자리. 지금은 수집 주기 하나뿐이고, 항목이 늘면 여기 붙는다.
  // 프리셋 목록의 정본은 서버(app.RUN_PRESETS)다 — 화면은 받아서 그리기만 한다.
  var SET_DONE = "", SET_H = null;

  // 마크업은 이미 서 있다(templates/sections/sm-set.html) — 여기서는 이벤트만
  // 한 번 건다. 위임 한 번만: 다시 부르면 한 번 누른 게 여러 번 저장된다.
  step("설정 배선", function setShell() {
    var sec = document.getElementById("sm-set");
    if (!sec || sec.dataset.smWired) return;
    sec.dataset.smWired = "1";
    sec.addEventListener("click", function (ev) {
      var t = ev.target.closest ? ev.target.closest("[data-h]") : null;
      if (t) return setSave(Number(t.dataset.h));
      if (ev.target.closest && ev.target.closest("[data-repo-pick]")) return repoPick();
      if (ev.target.closest && ev.target.closest("[data-repo-save]")) return repoSave();
      if (ev.target.closest && ev.target.closest("[data-ga4-pick]")) return ga4Pick();
      if (ev.target.closest && ev.target.closest("[data-ga4-save]")) return ga4Save();
      if (ev.target.closest && ev.target.closest("[data-cli-new]")) return cliNew();
    });
    cliRender();       // 이 칸은 사이트 설정과 무관하다 — /api/settings 를 안 기다린다
    setRender("");     // 상자가 신호보다 늦게 생겼으면 이미 받아 둔 값으로 지금 그린다
  });

  function setRender(msg) {
    var sec = document.getElementById("sm-set");
    if (!sec || !SET_H) return;
    if (!SET_H.presets) return setFail();       // 응답은 왔는데 내용이 아니다
    sec.classList.remove("dead");               // 되살아났으면 감춘 칸을 되돌린다
    var fb = sec.querySelector(".sm-setfail");
    if (fb) fb.remove();
    // 고른 것은 눌린 상태로 선다. 여태 아주 옅은 배경뿐이라 어느 것이 켜졌는지
    // 한눈에 안 잡혔다 — aria-pressed 로 낭독기에도 같은 말을 하고, 켜진 것에는
    // 체크를 붙인다(색만으로 뜻을 말하지 않는다).
    sec.querySelector(".opts").innerHTML = SET_H.presets.map(function (p) {
      var on = p.h === SET_H.run_every_hours;
      return '<button data-h="' + p.h + '" aria-pressed="' + on + '"' +
        (on ? ' class="on"' : "") + ">" + esc(p.label) + "</button>";
    }).join("") + '<span class="msg">' + esc(msg || "") + "</span>";
    repoRender();
    ga4Render();
    setNext(true);
  }

  // 안 끝난 첫 칸(저장소 다음 GA4). 다음 행동 띠가 이 판정으로 문장을 고른다.
  function firstTodo() {
    if (!SET_H) return "";
    if (SET_H.github_enabled && (!SET_H.github_connected || !SET_H.repo)) return "repo";
    if (!SET_H.ga4_property) return "ga4";
    return "";
  }
  // 카드 안 버튼은 전부 보조다. 화면의 채운 버튼 하나는 다음 행동 띠가 갖는다 —
  // 예전에는 이 자리가 채운 버튼이라, 띠가 "GA4를 연결하면…" 이라고 말해 놓고
  // 누를 것을 안 주는데도 화면 아래에 채운 버튼이 따로 서 있었다(같은 화면에
  // 주요 행동이 둘로 갈렸다). firstTodo() 는 그대로 남는다 — 띠의 문장을 고르는
  // 판정이지 버튼의 굵기가 아니다.

  // 설정을 못 받으면 세 칸이 통째로 빈다 — 빈 화면은 고장으로 보이지, 이유를
  // 말하지 않는다. 세 칸 다 빈 상태 상자를 세운다: 회색 한 줄만 남기면 그 칸이
  // 고장 난 것처럼 읽히고, 다시 불러올 손잡이도 그 자리에 없다.
  // 한 번의 실패(=/api/settings 하나가 안 옴)는 한 번 말한다. 예전에는 칸마다
  // 상자를 세워 같은 문장이 한 화면에 세 번, 폭도 제각각(400·590)으로 떴다.
  // 세 칸을 감추고 섹션 머리 밑에 상자 하나를 세운다 — [명령어로 연결] 칸은
  // 이 응답과 무관하게 서므로(cliRender) 건드리지 않는다.
  function setFail() {
    var sec = document.getElementById("sm-set");
    if (!sec) return;
    sec.classList.add("dead");
    var box = sec.querySelector(".sm-setfail");
    if (!box) {
      box = document.createElement("div");
      box.className = "sm-setfail";
      var sh = sec.querySelector(".sh");
      if (sh) sh.insertAdjacentElement("afterend", box); else sec.prepend(box);
    }
    box.innerHTML = errNote("설정을 못 읽었습니다",
      OFFLINE + " 다시 시도하면 주기·저장소·GA4 상태를 함께 받아 옵니다.", "set");
    setNext(false);
  }

  // 설정 화면의 다음 행동 띠는 서버 응답을 보고 정해야 한다. 뷰는 페이로드가
  // 오기 전에 "측정에 필요한 연결은 다 됐습니다" 라고 낙관했다 — 실제로는 아직
  // 아무것도 안 읽은 상태였다. 받은 뒤 여기서 사실로 덮는다.
  //
  // 띠에 상태 이름을 표식으로 남기고, 같은 상태면 다시 쓰지 않는다. nextStep 은
  // 부를 때마다 innerHTML 을 새로 쓰므로, 표식 없이 MutationObserver 에서 부르면
  // 자기가 자기를 깨워 화면이 얼어붙는다. 뷰가 띠를 다시 그리면 표식이 사라지고,
  // 그때 한 번만 다시 덮는다.
  var SET_NEXT = {
    fail: "<p>설정을 못 읽어 지금 상태를 알 수 없습니다. 다시 시도하면 이어서 " +
      "채워집니다.</p>" +
      '<div class="acts"><button class="go" data-sm-retry="set">다시 시도</button></div>',
    repo: "<p><b>저장소</b>를 연결하면 개선 기회가 콘텐츠 초안으로 옵니다. " +
      "연결 전에도 나머지 측정은 그대로 됩니다.</p>" +
      '<div class="acts"><a class="go" href="/auth/github">GitHub 연결</a></div>',
    ga4: "<p><b>GA4</b>를 연결하면 클릭 다음에 일어난 일까지 보입니다. " +
      "연결 전에도 검색 실적은 그대로 쌓입니다.</p>" +
      '<div class="acts"><button class="go" data-sm-jump="ga4">GA4 연결</button></div>',
    done: "<p>연결은 다 됐습니다. 여기서 바꾼 값은 다음 실행부터 적용됩니다.</p>" +
      '<div class="acts"><button class="go" data-sm-jump="overview">개요 열기</button></div>'
  };
  var SET_STATE = "";
  function setNext(ok) {
    SET_STATE = !ok ? "fail" : (firstTodo() || "done");
    paintSetNext();
  }
  // 이미 그 말이 서 있으면 다시 쓰지 않는다. **표식(data-*)으로 판단하면 안 된다**:
  // nextStep 은 띠 요소를 새로 만들지 않고 innerHTML 만 갈아 끼우므로, 뷰가 자기
  // 문장으로 다시 그려도 내가 붙인 속성은 그 요소에 그대로 남는다 — 그러면 "이미
  // 내 말이 서 있다"고 잘못 읽어 영영 안 덮는다(실제로 그렇게 나갔다).
  // 내용을 본다. MutationObserver 가 없어졌으니 여기서 써도 되돌아 불리지 않는다.
  function paintSetNext() {
    if (!SET_STATE || typeof window.nextStep !== "function") return;
    var box = document.getElementById("view-settings");
    if (!box) return;
    var cur = box.querySelector(".next");
    if (cur && cur.innerHTML === SET_NEXT[SET_STATE]) return;
    nextStep("settings", SET_NEXT[SET_STATE]);
  }

  // 저장소 칸. 세 상태뿐이다 — GitHub 계정이 없다 / 계정은 있고 저장소만 없다 /
  // 붙어 있다. 셋을 한 문장으로 뭉치면 "무엇을 먼저 하라"를 말할 수 없다.
  var REPO_LIST = null;
  function repoRender(msg) {
    var sec = document.getElementById("sm-set");
    if (!sec || !SET_H) return;
    var body = sec.querySelector(".repo .body");
    if (!body) return;
    var note = msg ? '<span class="msg">' + esc(msg) + "</span>" : "";
    if (!SET_H.github_enabled) {           // 이 배포 자체가 GitHub 연동을 안 갖고 있다
      body.innerHTML = '<p class="none">이 서비스에서는 GitHub 연결을 쓰지 않습니다. ' +
        "개선 기회는 그대로 보이니 글은 직접 옮기세요.</p>" + note;
      return;
    }
    if (!SET_H.github_connected) {
      body.innerHTML = '<p class="none">GitHub 계정이 아직 연결되지 않았습니다. ' +
        '연결하면 개선 기회를 PR 로 바로 받습니다.</p>' +
        '<a class="btn" href="/auth/github">GitHub 연결</a>' + note;
      return;
    }
    if (REPO_LIST) {                       // [바꾸기] 를 눌러 목록을 받아 온 상태
      body.innerHTML = '<div class="opts">' +
        "<select>" + REPO_LIST.map(function (r) {
          var n = r.full_name || r;
          return '<option' + (n === SET_H.repo ? " selected" : "") + ">" + esc(n) + "</option>";
        }).join("") + "</select>" +
        '<input value="' + esc(SET_H.repo_branch || "main") + '" aria-label="브랜치">' +
        '<button data-repo-save>저장</button></div>' + note;
      return;
    }
    body.innerHTML = '<div class="opts">' +
      (SET_H.repo ? '<span class="now"><code>' + esc(SET_H.repo) + "</code> · <code>" +
                    esc(SET_H.repo_branch || "main") + "</code> 에 보냅니다</span>"
                  : '<span class="none">아직 연결된 저장소가 없습니다</span>') +
      "<button data-repo-pick>" +
      (SET_H.repo ? "저장소 바꾸기" : "저장소 고르기") + "</button></div>" + note;
  }

  // 목록은 누를 때 받는다 — GitHub API 호출이라 화면을 열 때마다 부르지 않는다.
  async function repoPick() {
    repoRender("불러오는 중…");
    try {
      var r = await fetch("/api/repos");
      var d = await r.json();
      if (!r.ok) throw new Error(d.detail || "");
      REPO_LIST = d.repos || [];
      if (!REPO_LIST.length) return repoRender("이 계정에 쓸 수 있는 저장소가 없습니다. GitHub 에서 만든 뒤 다시 누르면 목록이 옵니다.");
    } catch (e) {
      return repoRender("저장소 목록을 못 읽었습니다. " + reason(e) + " 다시 누르면 재시도합니다.");
    }
    repoRender("");
  }

  async function repoSave() {
    var sec = document.getElementById("sm-set");
    var repo = sec.querySelector(".repo select").value;
    var branch = sec.querySelector(".repo input").value.trim() || "main";
    try {
      var r = await fetch("/api/repo", {method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({project: proj(), repo: repo, branch: branch})});
      var d = await r.json();
      if (!r.ok) throw new Error(d.detail || "");
      SET_H.repo = repo; SET_H.repo_branch = branch;
      REPO_LIST = null;                    // 고른 것을 보여 주는 상태로 돌아간다
      repoRender("저장했습니다.");
      say("저장했습니다", "ok");
      repaint();                           // [콘텐츠 작성] 이 이제 쓸 수 있게 된다
    } catch (e) {
      repoRender("저장하지 못했습니다. " + reason(e) + " 다시 누르면 재시도합니다.");
    }
  }

  // GA4 칸. GSC 와 달리 속성 ID(숫자)는 도메인에서 유추가 안 돼 목록에서 사람이
  // 고른다. suggest_property 의 제안은 select 에 미리 골라만 둔다 — 저장은 사람이
  // 눌러야 확정된다(엉뚱한 속성이 붙으면 그 뒤 모든 숫자가 조용히 거짓이 된다).
  var GA4_LIST = null, GA4_SUGGESTED = [], GA4_AUTH_ERR = "";
  function ga4Render(msg) {
    var sec = document.getElementById("sm-set");
    if (!sec || !SET_H) return;
    var body = sec.querySelector(".ga4 .body");
    if (!body) return;
    if (GA4_AUTH_ERR) {           // 스코프 부족 — 재로그인 손잡이를 준다
      body.innerHTML = '<p class="none">' + esc(GA4_AUTH_ERR) + "</p>" +
        '<a href="/auth/login">다시 로그인</a>';
      return;
    }
    var note = msg ? '<span class="msg">' + esc(msg) + "</span>" : "";
    if (GA4_LIST) {                       // [연결하기]/[바꾸기] 를 눌러 목록을 받아 온 상태
      body.innerHTML = '<div class="opts"><select>' + GA4_LIST.map(function (p) {
        var sel = p.id === (SET_H.ga4_property || GA4_SUGGESTED[0] || "");
        return '<option value="' + esc(p.id) + '"' + (sel ? " selected" : "") + ">" +
          esc(p.account) + " · " + esc(p.name) + " (" + esc(p.id) + ")</option>";
      }).join("") + '</select><button data-ga4-save>저장</button></div>' +
        (GA4_SUGGESTED.length ?
          '<p class="msg">도메인·이름이 비슷한 속성을 미리 골라 뒀습니다. 맞는지 확인하고 저장합니다.</p>' : "") +
        note;
      return;
    }
    if (SET_H.ga4_property) {
      body.innerHTML = '<div class="opts"><span class="now">속성 <code>' +
        esc(SET_H.ga4_property) + "</code> 를 읽고 있습니다</span>" +
        "<button data-ga4-pick>속성 바꾸기</button></div>" + note;
      return;
    }
    body.innerHTML = '<div class="opts"><span class="none">아직 연결되지 않았습니다. ' +
      "연결하면 클릭 다음에 일어난 일(세션·매출)까지 봅니다.</span>" +
      "<button data-ga4-pick>GA4 연결</button></div>" + note;
  }

  async function ga4Pick() {
    GA4_AUTH_ERR = "";
    ga4Render("불러오는 중…");
    var r, d;
    try {
      r = await fetch("/api/ga4/properties?project=" + encodeURIComponent(proj()));
      d = await r.json();
    } catch (e) {
      return ga4Render(OFFLINE + " 다시 누르면 재시도합니다.");
    }
    if (r.status === 403) {
      GA4_AUTH_ERR = d.detail || "이 로그인에는 GA4 읽기 권한이 없습니다. 다시 로그인하면 권한을 받습니다.";
      return ga4Render();
    }
    if (!r.ok) return ga4Render("속성 목록을 못 읽었습니다. " + (d.detail || "잠시 뒤 다시 누르면 재시도합니다."));
    GA4_LIST = d.properties || [];
    GA4_SUGGESTED = d.suggested || [];
    if (!GA4_LIST.length) return ga4Render("이 계정으로 볼 수 있는 GA4 속성이 없습니다. 속성 읽기 권한이 있는 계정으로 로그인하면 목록이 옵니다.");
    ga4Render("");
  }

  async function ga4Save() {
    var sec = document.getElementById("sm-set");
    var propId = sec.querySelector(".ga4 select").value;
    try {
      var r = await fetch("/api/ga4/property", {method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({project: proj(), property_id: propId})});
      var d = await r.json();
      if (!r.ok) throw new Error(d.detail || "");
      SET_H.ga4_property = d.ga4_property;
      GA4_LIST = null;
      ga4Render("저장했습니다.");
      say("저장했습니다", "ok");
    } catch (e) {
      ga4Render("저장하지 못했습니다. " + reason(e) + " 다시 누르면 재시도합니다.");
    }
  }

  // 명령어로 연결하기. 토큰 원문은 발급 응답에만 있다 — 서버는 해시만 보관하므로
  // 다시 물어봐도 못 준다. 그래서 화면에 쟁여 두지 않고(새로고침하면 사라진다),
  // 누르기 전에 "한 번만 보인다"를 먼저 말한다(칸 설명은 sm-set.html 에 있다).
  var CLI_TOKEN = "";
  function cliRender(msg) {
    var sec = document.getElementById("sm-set");
    if (!sec) return;
    var body = sec.querySelector(".cli .body");
    if (!body) return;
    var note = msg ? '<span class="msg">' + esc(msg) + "</span>" : "";
    if (!CLI_TOKEN) {
      body.innerHTML = '<div class="opts"><button data-cli-new>명령 만들기</button>' +
        '<span class="msg">다시 만들면 전에 받은 토큰은 그 자리에서 끊깁니다.</span>' +
        "</div>" + note;
      return;
    }
    // 명령 한 줄이 곧 복사 대상이다 — 셸의 copyCmd 가 textContent 를 그대로 집는다.
    // button 대신 role="button" div 를 쓴다 — 뷰들과 같은 관례다(ai.html 의
    // role="button" 복사칩). 이 칩은 안내의 SM.host.stepChip 이 그리는 게 아니라
    // 이 파일이 직접 심으므로 button.cmd 와 섞일 이유가 원래 없다.
    // 자리표까지 라틴이다 — 명령 칩은 통째로 등폭이라 한글을 넣으면 그 낱자만
    // 폴백 서체로 떨어져 흩어진다(CLAUDE.md). 무엇을 채울지는 아래 줄이 말한다.
    body.innerHTML = '<div class="cmd" role="button" tabindex="0">' +
      esc("python PLUGIN_DIR/skills/capture/scripts/remote.py connect " +
          location.origin + " " + CLI_TOKEN) + "</div>" +
      '<p class="msg warn">이 명령은 지금만 보입니다 — 클로드 코드 채팅에 그대로 ' +
      '붙여 넣으면 연결됩니다. <code>PLUGIN_DIR</code> 자리는 클로드가 채웁니다.</p>' +
      note;
    var chip = body.querySelector(".cmd");
    chip.onclick = function () { copyCmd(chip); };
    chip.onkeydown = function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); copyCmd(chip); }
    };
  }

  async function cliNew() {
    cliRender("만드는 중…");
    try {
      var r = await fetch("/api/cli/token", {method: "POST"});
      var d = await r.json();
      if (!r.ok) throw new Error(d.detail || "");
      CLI_TOKEN = d.token;
    } catch (e) {
      // 원인이 있으면 앞에 놓고, 복구 행동은 늘 뒤에 붙인다 — 서버가 이유를 준
      // 경우에만 문장이 원인으로 끝나 버리던 자리다.
      var why = (e && e.message) ? String(e.message).slice(0, 90) + " " : "";
      return cliRender("연결 명령을 만들지 못했습니다. " + why + "다시 누르면 재시도합니다.");
    }
    cliRender("");
  }

  async function setLoad() {
    var pj = proj();
    if (!pj || SET_DONE === pj) return;
    SET_DONE = pj;
    try {
      SET_H = await (await fetch("/api/settings?project=" +
        encodeURIComponent(pj))).json();
    } catch (e) {
      SET_DONE = "";                         // 실패는 되돌려 다음 기회에 다시 받는다
      return setFail();
    }
    setRender("");
    // 처음 도착한 SET_H(저장소 연결 여부)가 이미 그려진 기회 카드의 [콘텐츠 작성]
    // 버튼에 반영되게 다시 그린다 — 그 버튼은 렌더 시점에만 SM.host.oppBtn 을 본다.
    repaint();
  }

  async function setSave(h) {
    var pj = proj();
    if (!pj) return;
    try {
      var r = await fetch("/api/settings", {method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({project: pj, run_every_hours: h})});
      var d = await r.json();
      if (!r.ok) throw new Error(d.detail || "");
      SET_H.run_every_hours = d.run_every_hours;
      setRender("저장했습니다.");
      say("저장했습니다", "ok");
    } catch (e) {
      setRender("저장하지 못했습니다. " + reason(e) + " 다시 누르면 재시도합니다.");
    }
  }
  // 갱신 계기는 "sm:site" 하나다 — 아래 한 자리에서 같이 받는다.

  // 좁은 화면에서 차트는 가로로 스크롤한다(원본 .logwrap 설계). 그 사실을 알린다 —
  // 모르면 잘린 그림으로만 보인다.
  function swipeHint() {
    document.querySelectorAll(".logwrap").forEach(function (w) {
      if (w.scrollWidth <= w.clientWidth + 2) return;      // 넘칠 때만
      if (!w.dataset.smHint) {
        w.dataset.smHint = "1";
        var p = document.createElement("p");
        p.className = "sm-swipe";
        p.textContent = "← 좌우로 더 있습니다";
        w.parentNode.insertBefore(p, w.nextSibling);
        w.addEventListener("scroll", function () {
          var end = w.scrollLeft + w.clientWidth >= w.scrollWidth - 4;
          w.classList.toggle("at-end", end);
          p.style.visibility = end ? "hidden" : "";
        });
      }
    });
  }
  step("가로 스크롤 안내", swipeHint);
  window.addEventListener("resize", swipeHint);

  // ── 키워드 선별 ────────────────────────────────────────────
  // 자동 활성화는 '구글이 이미 노출시킨' 검색어만 켠다. 자동완성에서 캔 후보는
  // 관련성이 확인되지 않아 그대로 잠들어 있다 — 여기서 사람이 고른다.
  var kwMode = "candidate";

  async function kwLoad() {
    var box = document.getElementById("sm-kw");
    if (!box) return;
    var list = box.querySelector(".list");
    box.classList.remove("dead");
    bare(list, true);
    list.innerHTML = SKEL;                 // 글자 대신 채워질 자리의 모양을 보여 준다
    var d;
    try {
      d = await (await fetch("/api/keywords?status=" + kwMode +
                             "&project=" + encodeURIComponent(proj()))).json();
    } catch (e) {
      // 목록이 없으면 [추적에 넣기]도 탭도 누를 수 없다 — 살려 두면 눌러도
      // 아무 일이 없는 손잡이가 오류 밑에 남는다.
      box.classList.add("dead");
      list.innerHTML = errNote("검색어 목록을 못 읽었습니다",
        OFFLINE + " 다시 시도하면 목록을 받아 옵니다.", "kw");
      return;
    }
    var ks = d.keywords || [];
    box.querySelector(".cnt").innerHTML = "추적 중 " + d.active_total + " / " + d.limit +
      "개" + (d.active_total >= d.limit ? ' <b class="warn">· 한도에 닿았습니다</b>' : "");
    if (!ks.length) {
      list.innerHTML = kwMode === "candidate"
        ? emptyNote("아직 후보가 없습니다",
               "찾아 두면 검색창 자동완성에서 모은 검색어 중에서 고를 수 있습니다.",
               '<button class="go sm sec" data-run="keywords">키워드 찾기</button>')
        : emptyNote("추적 중인 검색어가 없습니다",
               "추적을 켜면 날마다 순위를 재고 1페이지까지 얼마나 남았는지 봅니다.",
               '<button class="go sm sec" data-m="candidate">후보에서 고르기</button>');
      return;
    }
    // 오른쪽 한 줄이 "이걸 왜 켜야 하나"에 답해야 한다. 노출이 있으면 실측이 먼저고,
    // 없으면 월 검색량(collect_metrics)이 유일한 수요 신호다 — 그것도 없으면 출처만.
    // 난이도는 켤지 말지를 가르는 값이라 검색량 옆에 붙인다.
    var kwWhy = function (k) {
      if (k.imp) return "노출 " + nf(k.imp);
      if (k.volume != null) {
        return "검색량 " + nf(k.volume) +
               (k.difficulty == null ? "" : " · 난이도 " + Math.round(k.difficulty));
      }
      return esc(k.source || "");
    };
    bare(list, false);
    list.innerHTML = ks.map(function (k) {
      return '<label><input type="checkbox" value="' + k.id + '">' +
             '<span class="kw">' + esc(k.keyword) + "</span>" +
             '<span class="n">' + kwWhy(k) + "</span></label>";
    }).join("");
  }

  // 검색어 목록 옆 한 줄 경고 — aiqSay 와 같은 규칙이다(원인 + 복구 행동).
  function kwSay(box, msg) {
    box.querySelector(".cnt").innerHTML =
      '<b class="warn">' + esc(msg + " 다시 누르면 재시도합니다.") + "</b>";
  }

  async function kwApply(on) {
    var box = document.getElementById("sm-kw");
    var ids = [...box.querySelectorAll(".list input:checked")].map(function (i) {
      return Number(i.value);
    });
    if (!ids.length) return;
    var btn = box.querySelector(".bar2 .go");
    btn.disabled = true;
    try {
      var r = await fetch("/api/keywords", {method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({project: proj(), ids: ids, active: on})});
      var d = await r.json();
      btn.disabled = false;
      if (!r.ok) { kwSay(box, d.detail || "추적을 바꾸지 못했습니다.");
        say("바꾸지 못했습니다", "bad"); return; }
    } catch (e) {
      btn.disabled = false;
      kwSay(box, OFFLINE);
      say("바꾸지 못했습니다", "bad");
      return;
    }
    say(on ? "추적에 넣었습니다" : "추적에서 뺐습니다", "ok");
    kwLoad();
  }

  // 마크업은 이미 서 있다(templates/sections/sm-kw.html) — 여기서는 탭·버튼에
  // 이벤트만 건다.
  function keywords() {
    var sec = document.getElementById("sm-kw");
    if (!sec || sec.dataset.smWired) return;
    sec.dataset.smWired = "1";

    // 섹션 전체에서 받는다 — 빈 상태의 [후보에서 고르기]도 같은 탭 전환이다.
    // 그래서 켜진 탭은 "눌린 것"이 아니라 지금 모드로 판단한다.
    sec.addEventListener("click", function (ev) {
      var b = ev.target.closest ? ev.target.closest("[data-m]") : null;
      if (!b) return;
      kwMode = b.getAttribute("data-m");
      sec.querySelectorAll(".tabs button").forEach(function (x) {
        x.classList.toggle("on", x.getAttribute("data-m") === kwMode);
      });
      sec.querySelector(".bar2 .go").textContent =
        kwMode === "candidate" ? "추적에 넣기" : "추적에서 빼기";
      kwLoad();
    });
    sec.querySelector(".bar2 .go").addEventListener("click", function () {
      kwApply(kwMode === "candidate");
    });
    kwLoad();
  }
  step("키워드 패널", keywords);

  // ── AI 질문 관리 ───────────────────────────────────────────
  // [질문 만들기]는 있었는데 무엇이 만들어졌는지 볼 데가 없었다. 인용 확인을 한 번
  // 돌리기 전에는 목록이 화면 어디에도 안 나와서, 업종과 안 맞는 질문이 섞여도
  // 그대로 물어보는 수밖에 없었다. 목록이 곧 편집기다 — 고치고, 끄고, 지운다.
  var AIQ_CATS = ["추천", "비교", "문제해결", "브랜드", "general"];

  function aiqPaint(box, d) {
    var list = box.querySelector(".list");
    box.querySelector(".cnt").innerHTML =
      "켠 질문 " + d.active_total + " / " + d.limit +
      "개" + (d.active_total >= d.limit ? ' <b class="warn">· 상한에 닿았습니다</b>' : "");
    if (!(d.prompts || []).length) {
      list.innerHTML = emptyNote("아직 질문이 없습니다",
        "만들면 업종과 검색어에 맞는 스무 개가 목록에 채워집니다.",
        '<button class="go sm sec" data-sm-act="make-prompts">질문 만들기</button>');
      return;
    }
    bare(list, false);
    list.innerHTML = d.prompts.map(function (q) {
      return '<div class="q' + (q.is_active ? "" : " off") + '" data-id="' + q.id + '">' +
        '<input type="checkbox" class="on"' + (q.is_active ? " checked" : "") +
          ' title="켜 두면 다음 확인에 이 질문을 물어봅니다">' +
        '<input class="t" value="' + esc(q.prompt) + '">' +
        '<select class="c">' + AIQ_CATS.map(function (c) {
          return '<option' + (c === q.category ? " selected" : "") + ">" + esc(c) + "</option>";
        }).join("") + "</select>" +
        '<span class="n">' + (q.is_active ? "" : '<span class="badge muted">꺼짐</span> ') +
          (q.checks ? q.checks + "회 물음 · 인용 " + q.cited + "회" : "아직 안 물어봤습니다") +
          "</span>" +
        '<button class="go sm danger del">지우기</button>' +
        "</div>";
    }).join("");
  }

  // 개수 칸에 서는 한 줄 경고. 원인만 적고 끝내지 않는다 — 무엇을 하면 되는지는
  // 부르는 쪽이 매번 다시 쓰지 않게 여기서 한 벌로 붙인다(copy-guide 5장).
  function aiqSay(box, msg) {
    box.querySelector(".cnt").innerHTML =
      '<b class="warn">' + esc(msg + " 다시 누르면 재시도합니다.") + "</b>";
  }

  // 목록을 못 받으면 상자가 "불러오는 중…" 인 채로 굳는다 — 오류는 목록 자리에
  // 둔다. 오른쪽 끝 개수 칸(.cnt)에만 적으면 읽는 사람이 그걸 못 본다.
  function aiqDead(box, why) {
    box.querySelector(".list").innerHTML =
      errNote("질문 목록을 못 읽었습니다", why + " 다시 시도하면 목록을 받아 옵니다.", "aiq");
    box.querySelector(".cnt").textContent = "";
  }

  async function aiqLoad() {
    var box = document.getElementById("sm-aiq");
    if (!box) return;
    bare(box.querySelector(".list"), true);
    box.querySelector(".list").innerHTML = SKEL;
    try {
      var r = await fetch("/api/ai/prompts?project=" + encodeURIComponent(proj()));
      var d = await r.json().catch(noDetail);
      if (!r.ok) return aiqDead(box, d.detail || OFFLINE);
      aiqPaint(box, d);
    } catch (e) {
      aiqDead(box, OFFLINE);
    }
  }

  async function aiqSend(body) {
    var box = document.getElementById("sm-aiq");
    try {
      var r = await fetch("/api/ai/prompts/edit", {method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(Object.assign({project: proj()}, body))});
      var d = await r.json();
      if (!r.ok) { aiqSay(box, d.detail || "저장하지 못했습니다.");
        say("저장하지 못했습니다", "bad"); return; }
      aiqPaint(box, d);
      say(body.op === "delete" ? "지웠습니다" : "저장했습니다", "ok");
    } catch (e) { aiqSay(box, OFFLINE); say("저장하지 못했습니다", "bad"); }
  }

  // 마크업은 이미 서 있다(templates/sections/sm-aiq.html) — 여기서는 이벤트를
  // 걸고 목록을 채운다.
  function aiqPanel() {
    var sec = document.getElementById("sm-aiq");
    if (!sec || sec.dataset.smWired) return;
    sec.dataset.smWired = "1";

    var list = sec.querySelector(".list");
    var idOf = function (el) { return Number(el.closest(".q").dataset.id); };
    list.addEventListener("change", function (ev) {
      var t = ev.target;
      if (t.classList.contains("on")) {
        aiqSend({op: "active", ids: [idOf(t)], active: t.checked});
      } else if (t.classList.contains("c")) {
        aiqSend({op: "save", id: idOf(t), category: t.value,
                 prompt: t.closest(".q").querySelector(".t").value});
      }
    });
    // 문구 수정은 포커스를 뗄 때 저장한다 — 타이핑 한 글자마다 쏘지 않는다.
    list.addEventListener("focusout", function (ev) {
      var t = ev.target;
      if (!t.classList || !t.classList.contains("t")) return;
      if (t.value.trim() === t.defaultValue.trim()) return;
      aiqSend({op: "save", id: idOf(t), prompt: t.value,
               category: t.closest(".q").querySelector(".c").value});
    });
    list.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter" && ev.target.classList.contains("t")) ev.target.blur();
    });
    list.addEventListener("click", function (ev) {
      var b = ev.target.closest ? ev.target.closest(".del") : null;
      if (!b) return;
      var row = b.closest(".q");
      // 지우면 이 질문으로 쌓인 확인 기록도 같이 사라진다 — 되돌릴 수 없다.
      if (!window.confirm("이 질문과 지금까지의 확인 기록을 지웁니다. 기록을 남기려면 " +
                          "지우지 말고 체크를 꺼 주세요.\n\n" +
                          row.querySelector(".t").value)) return;
      // 지운 뒤 토스트는 aiqSend 가 낸다("지웠습니다") — 여기서 두 번 말하지 않는다.
      aiqSend({op: "delete", ids: [Number(row.dataset.id)]});
    });

    var box = sec.querySelector(".new"), add = sec.querySelector(".add");
    // [질문 추가]는 옆 입력칸에 매인 행동이다 — 빈 칸일 때는 눌러도 아무 일이
    // 안 나는데 테두리 버튼으로 서 있었다. 글자가 있을 때만 켠다: 위계를 굵기가
    // 아니라 상태로 말한다. ([질문 만들기]는 입력과 무관한 보조라 고스트 그대로다.)
    var addable = function () { add.disabled = !box.value.trim(); };
    var addOne = function () {
      var v = box.value.trim();
      if (!v) return;
      box.value = "";
      addable();
      aiqSend({op: "save", prompt: v});
    };
    addable();
    box.addEventListener("input", addable);
    add.addEventListener("click", addOne);
    box.addEventListener("keydown", function (ev) { if (ev.key === "Enter") addOne(); });
    sec.querySelector(".gen").addEventListener("click", function () { makePrompts(this); });
    aiqLoad();
  }
  step("AI 질문 패널", aiqPanel);

  // ── 사이트가 정해졌을 때 ─────────────────────────────────────
  // 원본(dashboard.html 의 load)이 데이터를 다 그린 뒤 한 번 쏜다. 여태 이 계층은
  // #proj 의 change 이벤트로만 그걸 알았는데, hash 로 자동 선택될 때는 change 가
  // 안 난다 — 그래서 백링크·설정·키워드가 각자 첫 로드에 비어 있었다(같은 함정에
  // 세 번 빠졌다). 계기를 한 자리로 모은다: 여기 안 걸린 것은 안 채워진다.
  document.addEventListener("sm:site", function () {
    SET_DONE = ""; REPO_LIST = null; GA4_LIST = null; GA4_SUGGESTED = []; GA4_AUTH_ERR = "";
    SET_H = null; PERF = null;
    // 실행 상태도 여기서 다시 묻는다. 첫 폴링은 사이트가 정해지기 전에 나가므로
    // (hash 로 고르면 #proj 의 change 가 안 난다) 지난 런의 실패 알림이 다음
    // 폴링까지 8초 동안 안 떴다.
    step("실행 상태", poll);
    step("설정", setLoad);
    step("성과", perfLoad);
    step("키워드", kwLoad);
    step("AI 질문", aiqLoad);
    // render() 가 방금 새로 그린 자리에 이벤트를 잇는다 — [질문 만들기]는 렌더
    // 함수(ai.html)가 직접 심는 정적 마크업이라 SM.host 훅이 없다.
    step("빈 상태 버튼", wireActs);
  });

  // ── Claude Code 로 넘길 일 ─────────────────────────────────
  // 웹에서 못 하는 게 분명히 있다(관련성 판단·스킬 해석·자유 질문). 없는 척하지 말고
  // 명령어를 그대로 준다 — 여기서만은 '복사'가 맞는 동작이다. 목록 자체는
  // templates/sections/sm-cc.html 에 정적으로 적혀 있다 — 여기서는 클릭(복사)만 건다.
  function handoff() {
    var sec = document.getElementById("sm-cc");
    if (!sec || sec.dataset.smWired) return;
    sec.dataset.smWired = "1";
    sec.addEventListener("click", function (ev) {
      var b = ev.target.closest ? ev.target.closest("[data-cc]") : null;
      if (!b) return;
      var cmd = b.getAttribute("data-cc") + proj();
      // 복사됐다는 표시는 셸의 .cmd.copied 가 갖는다 — 글자를 갈아치우면 그 자리에
      // 있던 명령이 사라져, 무엇을 복사했는지가 화면에서 없어진다.
      navigator.clipboard.writeText(cmd).then(function () {
        b.classList.add("copied");
        say("명령을 복사했습니다", "ok");
        setTimeout(function () { b.classList.remove("copied"); }, 1400);
      }, function () { say("복사하지 못했습니다", "bad"); });
    });
  }
  step("고급 분석 패널", handoff);

  // ── 서치콘솔 성과 ───────────────────────────────────────────
  // 화면이 쓰던 것은 클릭·노출 둘뿐이었다. CTR 과 게재순위는 gsc_snapshots 에 이미
  // 들어 있는데 아무도 읽지 않아서, 서치콘솔을 보던 사람에게는 지표 절반이 빈 화면이었다.
  var PERF = null, dimMode = "queries";
  var nf = function (n) { return Number(n || 0).toLocaleString("ko-KR"); };
  var pct = function (v) { return v == null ? "—" : (v * 100).toFixed(2) + "%"; };
  var pos = function (v) { return v == null ? "—" : v.toFixed(1); };

  // 증감. 게재순위만 방향이 반대다 — 작아지는 게 오르는 것이다.
  // 이름은 smDelta — 셸의 delta(d, invert, base, tip)(dashboard.html)와 시그니처가
  // 달라서, 같은 이름이면 어느 걸 부르는지 헷갈린다(IIFE 안이라 실제로 덮어쓰진
  // 않지만, 읽는 사람은 그걸 모른다).
  function smDelta(now, was, fmt, lowerIsBetter) {
    if (now == null || was == null) return "";
    var d = now - was;
    if (Math.abs(d) < 1e-9) return ' <span class="d muted">—</span>';
    var good = lowerIsBetter ? d < 0 : d > 0;
    var body = (d > 0 ? "+" : "−") + fmt(Math.abs(d));
    return ' <span class="d ' + (good ? "up" : "down") + '">' + body + "</span>";
  }

  // KPI 두 칸을 원본 밴드에 끼운다. render() 가 band 를 다시 그리면 사라지므로
  // repaint() 가 다시 부른다(아래) — 이미 있으면 아무것도 하지 않는다.
  function kpi() {
    var band = document.getElementById("band");
    if (!band || !PERF || !PERF.totals || band.querySelector("[data-sm-kpi]")) return;
    var t = PERF.totals, pv = PERF.prev || {};
    var box = document.createElement("div");
    box.style.display = "contents";
    box.setAttribute("data-sm-kpi", "1");
    // 옆 칸들과 같은 기준 줄을 단다 — 무엇을 어떻게 잰 값이고 직전이 얼마였는지.
    // 직전이 없는 이유가 둘이다 — 아직 두 번을 안 쟀거나, 쟀는데 기간(period_days)이
    // 달라 비교하지 않았거나. 말없이 사라지면 Δ가 그냥 없어진 것처럼 보인다
    // (views/keywords.html 의 period_mismatch 안내와 같은 말을 한다).
    var basis = function (how, was, fmt) {
      var note = was != null ? "이전 " + fmt(was)
        : PERF.period_mismatch ? "직전 기록과 기간이 달라 비교하지 않음"
        : "비교할 직전 기록 없음";
      return '<div class="b">' + how + " · " + note + "</div>";
    };
    box.innerHTML =
      '<div class="m"><div class="v">' + pct(t.ctr) +
        smDelta(t.ctr, pv.ctr, function (x) { return (x * 100).toFixed(2) + "%p"; }, false) +
        '</div><div class="l">클릭률</div>' + basis("노출 대비 클릭", pv.ctr, pct) + "</div>" +
      '<div class="m"><div class="v">' + pos(t.position) +
        smDelta(t.position, pv.position, function (x) { return x.toFixed(1); }, true) +
        '</div><div class="l">평균 순위</div>' +
        basis("노출 가중 평균", pv.position, pos) + "</div>";
    band.appendChild(box);
  }

  // 꺾은선 하나. 원본 로그 차트와 같은 언어(등폭 숫자·괘선·patina)로 그린다.
  // 제목 줄에는 '지금 값 + 직전 대비', 차트에는 눈금선과 그 값 — 선만 있으면 모양만 보이고
  // "그래서 지금 얼마"를 못 읽는다. 세로축 값은 차트 오른쪽 위·아래에 붙인다.
  function line(rows, key, opt) {
    var pts = [];
    rows.forEach(function (r, i) { if (r[key] != null) pts.push([i, r[key]]); });
    var now = opt.now == null ? "" : '<span class="nowv">' + opt.fmt(opt.now) +
      smDelta(opt.now, opt.was, opt.dfmt, !!opt.invert) + "</span>";
    var head = function () {
      return '<div class="sm-ct"><span>' + opt.label + "</span>" + now + "</div>";
    };
    if (pts.length < 2)
      return head() +
        '<p class="sm-none">추이를 그리려면 이틀 이상의 일별 데이터가 필요합니다.</p>';
    var W = 100, H = 42, P = 3, n = rows.length;
    var vs = pts.map(function (q) { return q[1]; });
    var lo = Math.min.apply(null, vs), hi = Math.max.apply(null, vs);
    if (hi === lo) { hi = lo + (lo || 1) * 0.1; lo = lo - (lo || 1) * 0.1; }
    var X = function (i) { return P + i * (W - P * 2) / Math.max(1, n - 1); };
    var Y = function (v) {
      var t = (v - lo) / (hi - lo);
      return P + (opt.invert ? t : 1 - t) * (H - P * 2);   // 게재순위는 작을수록 위
    };
    var d = pts.map(function (q, k) {
      return (k ? "L" : "M") + X(q[0]).toFixed(2) + " " + Y(q[1]).toFixed(2);
    }).join(" ");
    var last = pts[pts.length - 1];
    // 눈금선 셋 — 위·가운데·아래. 위아래 값은 옆의 라벨이 말한다.
    var grid = [P, H / 2, H - P].map(function (y) {
      return '<line class="g" x1="' + P + '" y1="' + y + '" x2="' + (W - P) +
        '" y2="' + y + '"/>';
    }).join("");
    // 칸마다 투명한 띠 — <title> 만으로 그날 값을 읽는다(핸들러를 안 붙인다).
    var bw = (W - P * 2) / Math.max(1, n - 1);
    var hov = rows.map(function (r, i) {
      var x0 = Math.max(0, X(i) - bw / 2), x1 = Math.min(W, X(i) + bw / 2);
      return '<rect x="' + x0.toFixed(2) + '" y="0" width="' + (x1 - x0).toFixed(2) +
        '" height="' + H + '"><title>' + esc(r.d) + " — " + opt.label + " " +
        (r[key] == null ? "값 없음" : opt.fmt(r[key])) + "</title></rect>";
    }).join("");
    var mid = n > 2 ? "<span>" + esc(rows[Math.floor((n - 1) / 2)].d) + "</span>" : "";
    return head() +
      '<div class="sm-plot"><span class="sm-gl t">' +
      opt.fmt(opt.invert ? lo : hi) + '</span><span class="sm-gl b">' +
      opt.fmt(opt.invert ? hi : lo) + "</span>" +
      '<svg class="sm-line" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none"' +
      ' role="img" aria-label="' + opt.label + ' 추이 — 최고 ' +
      opt.fmt(opt.invert ? lo : hi) + ', 최저 ' + opt.fmt(opt.invert ? hi : lo) + '">' +
      grid + '<path d="' + d + '"/>' +
      '<circle cx="' + X(last[0]).toFixed(2) + '" cy="' + Y(last[1]).toFixed(2) +
      '" r="1.1"/>' + hov + "</svg></div>" +
      '<div class="sm-ax"><span>' + esc(rows[0].d) + "</span>" + mid +
      "<span>" + esc(rows[rows.length - 1].d) + "</span></div>";
  }

  function perfRender() {
    var sec = document.getElementById("sm-perf");
    if (!sec || !PERF) return;
    sec.hidden = false;
    var t = PERF.totals;
    if (!t) {
      sec.innerHTML = '<div class="sh"><p class="eyebrow">검색 실적</p>' +
        "<h2>클릭률과 순위</h2></div>" +
        emptyNote("실적을 아직 수집하지 않았습니다",
          "수집하면 평균 클릭률과 평균 순위가 채워집니다.",
          '<button class="go sm sec" data-run="gsc">실적 수집</button>');
      return;
    }
    var dl = PERF.daily || [], pv = PERF.prev || {};
    var span = dl.length
      ? dl[0].d + " → " + String(dl[dl.length - 1].d).slice(5)   // 끝은 월·일만
      : PERF.snapshot;
    var tip = "평균 순위는 노출 가중 평균이라 서치콘솔 화면의 값과 같고, 선이 " +
      "위로 갈수록 순위가 높습니다. 위 일별 추이가 클릭과 노출을 그리고, 남은 두 " +
      "지표를 여기서 봅니다.";
    // eyebrow 는 기간만 적는다 — 개수·상태·결론은 부제와 배지의 몫이다.
    sec.innerHTML = '<div class="sh"><p class="eyebrow">' + esc(span) + "</p>" +
      "<h2>클릭률과 순위</h2>" +
      '<p class="sub">' + (dl.length ? dl.length + "일치입니다. " : "") +
      '제목 옆 숫자가 지금 값이고, 증감은 직전 측정 대비입니다.' +
      '<span class="hint" tabindex="0" data-tip="' + esc(tip) + '" aria-label="' +
      esc(tip) + '">i</span></p>' +
      (PERF.period_mismatch ? '<p class="sub">직전 기록과 기간이 달라 이번에는 증감을 ' +
        "비교하지 않았습니다. 같은 기간으로 한 번 더 수집하면 채워집니다.</p>" : "") +
      "</div>" +
      '<div class="card sm-charts">' +
      ['<div>' + line(dl, "ctr", {label: "클릭률", fmt: pct, now: t.ctr, was: pv.ctr,
          dfmt: function (x) { return (x * 100).toFixed(2) + "%p"; }}) + "</div>",
       '<div>' + line(dl, "position", {label: "평균 순위", fmt: pos, invert: true,
          now: t.position, was: pv.position,
          dfmt: function (x) { return x.toFixed(1); }}) + "</div>"
      ].join("") + "</div>";
  }

  var DIMS = [["queries", "검색어"], ["pages", "페이지"], ["devices", "기기"]];
  var DEVICE = {MOBILE: "모바일", DESKTOP: "데스크톱", TABLET: "태블릿"};
  // [키, 라벨, 작은 값이 좋은가] — 게재순위만 오름차순이 '좋은 순'이다
  var COLS = [["clicks", "클릭", false], ["impressions", "노출", false],
              ["ctr", "클릭률", false], ["position", "평균 순위", true]];
  var dimSort = "clicks", dimAsc = false, dimQ = "";

  // 지금 보고 있는 줄들. 찾기 칸과 정렬을 함께 반영한다.
  function dimRows() {
    var q = dimQ.trim().toLowerCase();
    var rows = (PERF[dimMode] || []).filter(function (r) {
      return !q || String(r.key).toLowerCase().indexOf(q) >= 0;
    });
    return rows.sort(function (a, b) {
      var x = a[dimSort], y = b[dimSort];
      if (x == null) return 1;
      if (y == null) return -1;
      return dimAsc ? x - y : y - x;
    });
  }

  // 표만 다시 그린다 — 껍데기까지 갈아치우면 찾기 칸이 사라져 입력 도중 포커스를 잃는다.
  function dimTable() {
    var sec = document.getElementById("sm-dim");
    var box = sec && sec.querySelector(".sm-dimt");
    if (!box || !PERF) return;
    sec.querySelectorAll("[data-d]").forEach(function (b) {
      b.classList.toggle("on", b.dataset.d === dimMode);
      b.setAttribute("aria-pressed", b.dataset.d === dimMode);
    });
    var all = (PERF[dimMode] || []).length, rows = dimRows();
    var cnt = sec.querySelector(".sm-dimn");
    if (cnt) cnt.textContent = rows.length === all
      ? all + "행" : rows.length + "행 / 전체 " + all + "행";
    var head = DIMS.filter(function (x) { return x[0] === dimMode; })[0][1];
    if (!all) {
      box.innerHTML = emptyNote(
        dimMode === "devices" ? "기기별 실적이 없습니다" : "이 축의 실적이 없습니다",
        "실적을 한 번 더 수집하면 이 표가 채워집니다.",
        '<button class="go sm sec" data-run="gsc">실적 수집</button>');
      return;
    }
    if (!rows.length) {
      box.innerHTML = '<p class="sm-none">찾는 말과 맞는 줄이 없습니다. 다른 말로 찾으면 다시 나옵니다.</p>';
      return;
    }
    // 노출 비중 막대 — 상위 몇 줄이 전부인지, 고르게 퍼졌는지가 숫자보다 빨리 보인다.
    var mxI = Math.max.apply(null, rows.map(function (r) { return r.impressions || 0; }).concat([1]));
    var t = '<table><thead><tr><th>' + head + "</th>" +
      COLS.map(function (c) {
        var on = c[0] === dimSort;
        return '<th class="num"><button data-s="' + c[0] + '"' +
          (on ? ' class="on' + (dimAsc ? " asc" : "") + '"' : "") +
          ' title="' + c[1] + ' 기준으로 정렬' + (on ? ". 다시 누르면 반대 순서" : "") +
          '">' + c[1] + "</button></th>";
      }).join("") + "</tr></thead><tbody>" +
      rows.map(function (r) {
        var k = r.key;
        if (dimMode === "pages") k = k.replace(/^https?:\/\/[^/]+/, "") || "/";
        if (dimMode === "devices") k = DEVICE[k] || k;
        return '<tr><td title="' + esc(r.key) + '"><span class="sm-k">' + esc(k) +
          '</span><span class="sm-share"><i style="width:' +
          ((r.impressions || 0) / mxI * 100).toFixed(1) + '%"></i></span>' +
          '</td><td class="num">' + nf(r.clicks) + '</td><td class="num">' +
          nf(r.impressions) + '</td><td class="num">' + pct(r.ctr) +
          '</td><td class="num">' + pos(r.position) + "</td></tr>";
      }).join("") + "</tbody></table>";
    // 늘 .tw 로 싼다 — 좁은 화면에서 다섯 열이 접히면 숫자가 두 줄로 쪼개진다.
    // 상자 안에서 옆으로 넘기게 두는 편이 읽힌다(min-width 는 아래 CSS).
    box.innerHTML = '<div class="card"><div class="tw">' + t + "</div></div>";
  }

  // 지금 보이는 줄 그대로 표로 내보낸다 — 만드는 코드는 셸의 csv(name, rows)
  // 하나다(null 처리가 갈라졌던 자리라 사본을 안 둔다).
  function dimCsv() {
    var head = DIMS.filter(function (x) { return x[0] === dimMode; })[0][1];
    var rows = [[head, "클릭", "노출", "클릭률", "평균 순위"]].concat(
      dimRows().map(function (r) {
        return [r.key, r.clicks || 0, r.impressions || 0, pct(r.ctr), pos(r.position)];
      }));
    csv(dimMode + "-" + (PERF.snapshot || ""), rows);
  }

  function dimRender() {
    var sec = document.getElementById("sm-dim");
    if (!sec || !PERF) return;
    // 실적 자체가 없으면 위 [검색 성과]가 이미 이유를 말한다 — 빈 표를 또 보이지 않는다.
    if (!PERF.totals) { sec.hidden = true; return; }
    sec.hidden = false;
    if (!sec.querySelector(".sm-dimt")) {
      var tip = "열 이름을 누르면 그 기준으로 정렬하고, 같은 열을 다시 누르면 반대 " +
        "순서가 됩니다. 노출 상위 25개까지 봅니다.";
      sec.innerHTML = '<div class="sh"><p class="eyebrow">유입 분해</p>' +
        "<h2>무엇으로 들어오나</h2>" +
        '<p class="sub">노출은 많은데 클릭률이 낮은 줄이 제목과 설명을 고칠 자리입니다.' +
        '<span class="hint" tabindex="0" data-tip="' + esc(tip) + '" aria-label="' +
        esc(tip) + '">i</span></p>' +
        '<div class="tools tabs">' + DIMS.map(function (d) {
          return '<button data-d="' + d[0] + '">' + d[1] + "</button>";
        }).join("") + "</div></div>" +
        '<div class="tools"><input type="search" class="sm-dimq" ' +
        'placeholder="검색어·주소로 찾기" aria-label="분해 표에서 찾기">' +
        '<span class="n sm-dimn"></span><span class="sp"></span>' +
        '<button class="go sm sec sm-dimx" title="지금 보이는 줄 그대로 내려받습니다"' +
        ">CSV 내려받기</button></div>" +
        '<div class="sm-dimt"></div>';
      // 위임 한 번만 — 그릴 때마다 붙이면 핸들러가 쌓여 한 번 누른 게 여러 번 돈다.
      sec.addEventListener("click", function (ev) {
        if (ev.target.classList.contains("sm-dimx")) return dimCsv();
        var t = ev.target.closest ? ev.target.closest("[data-d],[data-s]") : null;
        if (!t) return;
        if (t.dataset.d) { dimMode = t.dataset.d; dimSort = "clicks"; dimAsc = false; }
        else if (t.dataset.s === dimSort) dimAsc = !dimAsc;
        else {
          dimSort = t.dataset.s;
          dimAsc = !!(COLS.filter(function (c) { return c[0] === dimSort; })[0] || [])[2];
        }
        dimTable();
      });
      sec.addEventListener("input", function (ev) {
        if (!ev.target.classList.contains("sm-dimq")) return;
        dimQ = ev.target.value;
        dimTable();
      });
    }
    dimTable();
  }

  // ── 일별 추이를 페이로드에 얹는다 ──────────────────────────────────────
  // 호스팅 페이로드(/api/data)에는 daily 가 없다. 그래서 [개요]의 일별 추이가
  // 로컬에서는 그려지고 호스팅에서는 "아직 없습니다"로 나갔다 — 같은 자료
  // (gsc_daily)를 두 화면이 다르게 판정한 것이다. 새 API 를 만들지 않는다:
  // /api/perf 가 이미 그 줄을 준다. 모양만 페이로드 규격으로 옮겨 얹는다.
  //
  // 두 줄 모양이 다르다 — 날짜 열 이름(d ↔ date)과 클릭률 단위(비율 ↔ %)다.
  // 여기서 맞춰 두지 않으면 차트가 x축을 못 찾거나 클릭률을 100배로 그린다.
  function dailyRows() {
    return (PERF && PERF.daily || []).map(function (r) {
      return {date: r.d, clicks: r.clicks, impressions: r.impressions,
              ctr: r.ctr == null ? null : Math.round(r.ctr * 1e4) / 100,
              position: r.position};
    });
  }
  // daily_stats 는 셸이 옛 박제본에만 채워 준다 — 스키마가 있는 페이로드에서는
  // 얹는 쪽이 같이 낸다(정본은 dashboard.py 의 같은 네 값이다).
  function dailyStats(rows) {
    var num = function (k) { return rows.map(function (r) { return r[k] || 0; }); };
    var sum = function (v) { return v.reduce(function (a, b) { return a + b; }, 0); };
    return {clicks_sum: sum(num("clicks")), impressions_sum: sum(num("impressions")),
            clicks_max: Math.max.apply(null, num("clicks").concat([1])),
            impressions_max: Math.max.apply(null, num("impressions").concat([1]))};
  }
  // 렌더는 늘 페이로드 하나의 함수다(셸의 SM.repaint 주석) — 그리니까 DOM 을
  // 되짚어 고치지 않고 **그리기 직전의 페이로드에 얹는다**. 셸의 render 는 최상위
  // function 선언이라 전역 객체의 속성이고, 안쪽 호출도 이 속성을 다시 본다.
  var _render = window.render;
  if (typeof _render === "function") {
    window.render = function (d) {
      // 있고 없고가 아니라 **비었나**를 본다 — 조립에 따라 이 자리가 아예 없기도,
      // 빈 배열([])로 실려 오기도 한다. 빈 배열은 truthy 라 `!d.daily` 로는 못 잡는다.
      if (d && !(d.daily || []).length) {
        var rows = dailyRows();
        if (rows.length) { d.daily = rows; d.daily_stats = dailyStats(rows); }
      }
      return _render.apply(this, arguments);
    };
  }

  // 껍데기(#sm-perf·#sm-dim)는 이미 hidden 으로 서 있다
  // (templates/sections/sm-perf.html, sm-dim.html) — 채워지기 전까지는 감춰 둔다:
  // 빈 상자 둘이 개요 밑에 떠 있으면 고장으로 보인다.
  async function perfLoad() {
    var pj = proj();
    if (!pj) return;
    try {
      PERF = await (await fetch("/api/perf?project=" + encodeURIComponent(pj))).json();
    } catch (e) { return; }
    kpi(); perfRender(); dimRender();
    // 일별 줄이 방금 도착했다 — 같은 페이로드로 다시 그리면 위 래퍼가 얹는다.
    // 첫 render 는 perfLoad 보다 앞이라 그때는 얹을 것이 아직 없었다.
    if ((PERF && PERF.daily || []).length) repaint();
  }
  // 갱신 계기는 "sm:site" 하나다 — 아래 한 자리에서 같이 받는다.

  // 화면 상자는 원본이 이미 다 지었다(section-def 가 조립 시점에 끼운다) — 여기서
  // 다시 세울 게 없다. SM.sync() 를 한 번 더 부르는 이유는 하나: 이 스크립트가
  // 원본 스크립트보다 뒤에 있어서, 화면 제목 옆 칩(viewCmds)이 이미 로컬 기본값
  // (복사 칩)으로 한 번 그려진 뒤이기 때문이다 — SM.host 를 방금 갈아 끼웠으니
  // sm:views 를 다시 알려 실행 버튼으로 다시 그리게 한다.
  step("화면 배치", function () { SM.sync(); });

  // 안내 단계 칩(SM.host.stepChip)과 기회 카드의 [콘텐츠 작성](SM.host.oppBtn)은
  // 이제 원본 렌더 함수(renderGuide·oppActs)가 그릴 때 직접 부른다 — 다 그려진
  // 뒤에 이 파일이 DOM 을 되짚어 고치지 않는다. 그래서 여기 있던 wire()·wireSteps()·
  // MutationObserver 는 전부 없앴다: 값이 바뀌면(설정 저장 등) repaint() 가 같은
  // 페이로드로 render() 를 다시 부르고, 그 안에서 이 훅들이 다시 불린다.
  // [질문 만들기](data-sm-act)만 예외다 — ai.html 이 직접 심는 정적 마크업이라
  // "sm:site" 핸들러에서 렌더 뒤에 한 번씩 잇는다(위).
  //
  // 설정 화면의 다음 행동 띠만 렌더 뒤에 한 번 더 손댄다 — 그 문장은 페이로드가
  // 아니라 /api/settings 응답에서 나오므로 셸의 렌더 함수가 알 수 없다. 표식
  // (data-sm-set)이 있어 같은 상태면 다시 쓰지 않는다.
})();
</script>
<!-- 폰트 링크는 <script> 뒤에 둔다 — 대기 중인 외부 스타일시트는 그 앞에 있는
     스크립트의 실행을 막을 수 있다(파서가 CSSOM 확정을 기다린다). 이 스크립트가
     SM.host 를 이 자리에서 세우는데, 그게 밀리면 원본의 첫 렌더가 로컬 기본값
     (복사 칩)으로 나간다 — 실제로 헤드리스 검사에서 간헐적으로 재현됐다.
     자리만으로는 부족하다: media="print" 로 받아 다 받은 뒤 all 로 돌린다(원본
     dashboard.html:27 과 같은 모양). 스크립트가 꺼진 브라우저는 noscript 가 받는다. -->

<link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
