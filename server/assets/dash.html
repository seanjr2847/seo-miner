
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* 원본은 시스템 폰트(Segoe UI/Cascadia)라 한글이 맑은고딕으로 떨어져 수치와 섞이면
     지저분하다. 변수만 갈아끼우면 화면 전체가 따라온다 — 원본 규칙은 손대지 않는다. */
  :root{
    --sans:"IBM Plex Sans KR","Segoe UI",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,monospace;
  }
  body{word-break:keep-all}          /* 한글은 어절 단위로 끊는다 */

  #toggle-setup,#setup{display:none!important}
  #nx code{display:none}             /* 배너의 명령어 — 웹에는 칠 곳이 없다 */

  /* 초기화 한 곳이 터졌을 때의 알림. 조용히 넘어가지 않되, 화면을 죽이지도 않는다. */
  #sm-fail{border:1px solid var(--copper);border-radius:8px;padding:12px 16px;
    margin:0 0 18px;color:var(--copper);font:400 13px/1.6 var(--sans)}
  #sm-fail p{margin:0}

  /* ── 좌측 네비게이션 ────────────────────────────────────────
     원본은 한 페이지에 섹션 열넷을 세로로 쌓는다. 어디에 뭐가 있는지도, 지금 뭘
     하면 되는지도 안 보인다. 주제별 화면으로 쪼개고 메뉴로 전환한다.
     실행은 각 화면 안으로 내려보낸다 — 메뉴는 이동만 하고, 누르면 화면이 바뀐다.
     (전에는 메뉴처럼 생긴 것이 누르면 수집을 돌리는 버튼이었다.) */
  #sm-bar{display:flex;align-items:center;gap:10px 14px;padding:0 22px 10px;flex-wrap:wrap}
  /* 좁은 화면에서는 메뉴가 한 줄을 다 쓴다 — 실행 줄과 나눠 쓰면 두 칸만 남는다 */
  #sm-nav{display:flex;gap:3px;overflow-x:auto;flex:1 0 100%;min-width:0;scrollbar-width:none}
  #sm-nav::-webkit-scrollbar{display:none}
  #sm-nav button{font:500 13px/1 var(--sans);color:var(--stone);background:transparent;
    border:0;border-radius:6px;padding:9px 12px;cursor:pointer;white-space:nowrap;opacity:.6}
  #sm-nav button:hover{opacity:1}
  #sm-nav button.on{opacity:1;background:var(--patina);color:var(--stone)}
  .sm-act{display:flex;align-items:center;gap:12px;flex:none}
  #sm-run{font:500 13px/1 var(--sans);cursor:pointer;border:1px solid var(--patina);
    background:var(--patina);color:var(--stone);border-radius:6px;padding:9px 15px}
  #sm-run:hover:not(:disabled){filter:brightness(1.12)}
  #sm-run:disabled{opacity:.5;cursor:default}
  .sm-act .cmd{font:400 12.5px/1 var(--sans);color:var(--stone);opacity:.62;cursor:pointer;
    text-decoration:none;border:0;background:none;padding:4px 2px}
  .sm-act .cmd:hover{opacity:1}
  .sm-act .cmd::after{content:none}   /* 원본 .cmd 는 복사 칩이라 아이콘을 달고 있다 */
  :is(#sm-bar,.opp) button:focus-visible{outline:2px solid var(--patina);outline-offset:2px}

  @media (min-width:1000px){
    body{display:grid;grid-template-columns:220px minmax(0,1fr);align-items:start}
    header{grid-column:1;position:sticky;top:0;height:100vh;overflow-y:auto;
      display:flex;flex-direction:column;      /* .sm-act 의 margin-top:auto 가 먹으려면 */
      border-bottom:0;border-right:1px solid var(--ink)}
    .hbar{flex-direction:column;align-items:stretch;gap:12px;padding:20px 16px 8px;
      max-width:none;margin:0}
    .hbar .sp{display:none}
    .tag{display:block!important;letter-spacing:.06em;font-size:10.5px;
      color:var(--slate);opacity:.5;margin-top:-8px}
    #proj{max-width:none;width:100%}
    /* 원본은 한 줄 바에 있어서 nowrap 이었다 — 세로로 세우면 잘린다. */
    #meta{font-size:11px;line-height:1.6;opacity:.65;white-space:normal;
      word-break:break-all;display:block;margin-top:2px}
    .hbar .hbtn{width:100%;text-align:left;padding-left:11px;opacity:.5;font-size:11.5px}
    .hbar .hbtn:hover{opacity:1}
    #sm-bar{flex-direction:column;align-items:stretch;gap:0;flex:1;padding:10px 12px 22px}
    #sm-nav{flex-direction:column;gap:1px;overflow:visible;flex:none}
    .sm-act{flex-direction:column;align-items:stretch;gap:9px;margin-top:auto;padding:0 2px}
    .sm-act .cmd{text-align:left}
    main{grid-column:2;max-width:1180px;margin:0;padding:26px 34px 80px}
  }

  /* ── 화면 ───────────────────────────────────────────────────
     한 화면에는 한 주제만. 괘선으로 이어 붙이던 섹션을 카드로 떼어 놓는다 —
     화면이 나뉘었으면 경계도 나뉘어야 어디까지가 한 덩어리인지 읽힌다. */
  main{padding-top:22px}
  .sm-view{display:flex;flex-direction:column;gap:16px}
  .sm-view[hidden]{display:none}   /* display:flex 가 hidden 의 display:none 을 이긴다 */
  .sm-vh{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .sm-vh h1{font:650 22px/1.25 var(--sans);letter-spacing:-.02em;margin:0;flex:1;min-width:0}
  .sm-refresh{font:500 12.5px/1 var(--sans);color:var(--patina);background:var(--card);
    border:1px solid var(--rule);border-radius:6px;padding:9px 14px;cursor:pointer;flex:none}
  .sm-refresh:hover:not(:disabled){border-color:var(--patina);background:var(--wash)}
  .sm-refresh:disabled{opacity:.5;cursor:default}
  .sm-refresh:focus-visible{outline:2px solid var(--patina);outline-offset:2px}
  .sm-view section,.sm-view > .band{background:var(--card);border:1px solid var(--rule);
    border-radius:10px;padding:20px 22px 22px;margin:0}
  .sm-view section:first-of-type{border-top:1px solid var(--rule)}
  .sm-view > .band{padding:4px 22px 6px}
  .sm-view .band .m{padding:18px 18px 16px 0}
  /* KPI 가 다섯에서 일곱으로 늘었다 — 고정 5칸이면 두 줄로 어긋난다 */
  .sm-view > .band{grid-template-columns:repeat(auto-fit,minmax(146px,1fr))}
  .sm-view .band .v{white-space:nowrap}
  .sm-view .band .d{font-size:11px;margin-left:6px}

  /* 검색 성과 — 서치콘솔 4대 지표를 같은 크기로 나란히 둔다.
     축이 서로 달라 한 그림에 겹치지 않는다(게재순위는 방향까지 반대다). */
  .sm-charts{display:grid;grid-template-columns:repeat(2,1fr);gap:44px;margin-top:4px}
  @media(max-width:760px){.sm-charts{grid-template-columns:1fr}}
  .sm-ct{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
    font:500 12.5px/1 var(--sans);color:var(--ink);margin-bottom:10px}
  /* 제목 옆 현재 값 — 선은 모양만 말한다. 지금 얼마인지는 숫자로 붙인다. */
  .sm-ct .nowv{font:500 14px/1 var(--mono);font-variant-numeric:tabular-nums;
    color:var(--ink);white-space:nowrap}
  .sm-ct .nowv .d{font-size:11px;margin-left:5px}
  /* 세로축 값은 그림 오른쪽 위·아래에 얹는다 — preserveAspectRatio:none 이라
     SVG 안에 글자를 두면 늘어난다. */
  .sm-plot{position:relative}
  .sm-gl{position:absolute;right:0;font:400 10.5px/1 var(--mono);color:var(--slate);
    background:var(--card);padding:1px 0 1px 7px;pointer-events:none}
  .sm-gl.t{top:-4px} .sm-gl.b{bottom:-4px}
  .sm-line{display:block;width:100%;height:76px;overflow:visible}
  .sm-line path{fill:none;stroke:var(--patina);stroke-width:1.2;
    vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
  .sm-line circle{fill:var(--patina);vector-effect:non-scaling-stroke}
  .sm-line line.g{stroke:var(--rule-soft);stroke-width:1;stroke-dasharray:2 4;
    vector-effect:non-scaling-stroke}
  .sm-line rect{fill:transparent}
  .sm-line rect:hover{fill:var(--wash)}
  .sm-ax{display:flex;justify-content:space-between;font:400 10.5px/1 var(--mono);
    color:var(--slate);margin-top:6px;opacity:.75}
  .sm-none{font-size:13px;color:var(--slate);margin:10px 0 2px}

  /* 분해 표 — 긴 URL 이 표 폭을 밀지 않게 첫 칸만 줄인다 */
  #sm-dim .tabs{display:flex;gap:6px;margin:2px 0 12px}
  #sm-dim .tabs button{font:400 12px/1 var(--mono);color:var(--slate);background:transparent;
    border:1px solid var(--rule);border-radius:6px;padding:6px 12px;cursor:pointer}
  #sm-dim .tabs button.on{color:var(--patina);border-color:var(--patina);background:var(--wash)}
  #sm-dim table{table-layout:fixed;width:100%}
  #sm-dim th:first-child,#sm-dim td:first-child{width:46%}
  #sm-dim .sm-k{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #sm-dim th button{font:inherit;color:inherit;background:none;border:0;padding:0;
    cursor:pointer;letter-spacing:inherit;text-transform:inherit}
  #sm-dim th button:hover{color:var(--ink)}
  #sm-dim th button.on{color:var(--patina)}
  #sm-dim th button.on::after{content:" ↓"}
  #sm-dim th button.on.asc::after{content:" ↑"}
  /* 노출 비중 막대 — 상위 몇 줄이 전부인지가 숫자보다 빨리 보인다. */
  #sm-dim .sm-share{display:block;height:2px;background:var(--bar);border-radius:2px;
    margin-top:6px;max-width:260px}
  #sm-dim .sm-share i{display:block;height:100%;border-radius:2px;background:var(--patina);
    opacity:.55}
  #sm-dim .tools{margin-bottom:10px}
  /* 붙박이 머리글은 원본에서 var(--stone) 을 깐다 — 카드 위에서는 카드색이어야 한다. */
  .sm-view .tw thead th{background:var(--card)}

  #docban{background:var(--card);border:1px solid var(--rule);
    border-left:3px solid var(--patina);border-radius:10px;padding:16px 20px;margin:0 0 16px}

  /* 분석 진행 배너 — 빈 화면의 이유를 맨 위에서 알린다. */
  #sm-wait{margin:0 0 16px;padding:13px 18px;border:1px solid var(--rule);
    border-left:3px solid var(--patina);border-radius:10px;background:var(--wash);
    color:var(--ink);font-size:13.5px;line-height:1.6}
  #sm-wait::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;
    background:var(--patina);margin-right:9px;vertical-align:middle}
  @media (prefers-reduced-motion:no-preference){
    #sm-wait::before{animation:sm-pulse 1.6s ease-in-out infinite}
    @keyframes sm-pulse{0%,100%{opacity:1}50%{opacity:.25}}
  }

  /* 원본 자간은 영문 대문자 라벨 기준(.24em)이라 한글에서는 글자가 흩어진다. */
  .eyebrow{letter-spacing:.08em}
  .tag{letter-spacing:.12em}
  th{letter-spacing:.05em}
  .opp .kind{letter-spacing:.05em}
  /* KPI 라벨은 한글이다 — mono 로 두면 폴백 서체로 떨어져 자간이 벌어진다. */
  .band .l{font-family:var(--sans);font-weight:500;letter-spacing:.03em}
  /* 기준 줄·단위도 한글이 섞인다 — 같은 이유로 sans 로 되돌린다(숫자만 등폭 자리수). */
  .band .b,.score .u,.tools .n{font-family:var(--sans);font-variant-numeric:tabular-nums}

  /* ── 백링크 ────────────────────────────────────────────────
     요약·추이·목록을 한 상자에 몰아넣으면 카드 하나가 화면 높이를 다 먹는다.
     display:contents 로 껍데기를 지워 자식 <section> 이 화면(.sm-view)의 칸이 되게
     한다 — 그러면 다른 화면과 같은 카드·같은 간격을 공짜로 받는다. */
  #sm-bl{display:contents}
  #sm-bl .sub{color:var(--slate);font-size:13px;margin:4px 0 16px}
  /* 밴드가 카드 안에 들어간다 — 카드가 이미 테를 가졌으니 밑줄은 뺀다. */
  #sm-bl .band{border-bottom:0;margin:0;
    grid-template-columns:repeat(auto-fit,minmax(148px,1fr))}
  #sm-bl .band .m{padding:14px 18px 12px 0}
  #sm-bl .band .v{white-space:nowrap}
  #sm-bl .band .d{font-size:11px;margin-left:6px}
  /* 도메인 이름은 길이가 제각각이라 첫 칸을 고정하고 넘치면 자른다(전체는 title 로). */
  #sm-bl table{table-layout:fixed}
  #sm-bl th:first-child,#sm-bl td:first-child{width:38%}
  #sm-bl .dm{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-family:var(--mono);font-size:12.5px}
  /* 최초 발견은 날짜다 — 숫자 열은 아니지만(정렬은 글자순이 맞다) 자리는 맞춘다. */
  #sm-bl th:last-child{text-align:right}
  #sm-bl td:last-child{text-align:right;font-family:var(--mono);font-size:12.5px;
    font-variant-numeric:tabular-nums}
  /* dofollow 가 0 인 도메인은 순위에 힘을 안 준다 — 산화동으로 그 사실을 말한다. */
  #sm-bl td.nf{color:var(--copper)}
  #sm-bl .sm-charts{gap:40px}

  /* 키워드 선별 — 자동은 서치콘솔 노출만 켠다. 나머지는 사람이 골라야 한다. */
  #sm-kw .sub{color:var(--slate);font-size:13px;margin:4px 0 14px}
  #sm-kw .tabs{display:flex;gap:6px;margin-bottom:10px}
  #sm-kw .tabs button{font:400 12px/1 var(--mono);color:var(--slate);background:transparent;
    border:1px solid var(--rule);border-radius:6px;padding:6px 12px;cursor:pointer}
  #sm-kw .tabs button.on{color:var(--patina);border-color:var(--patina);background:var(--wash)}
  #sm-kw .list{max-height:340px;overflow:auto;border:1px solid var(--rule-soft);
    border-radius:6px;overflow-x:hidden}
  /* flex 로 두면 자식이 넘칠 때 .kw 의 flex-basis:0 이 0px 으로 굳어 글자가 사라진다.
     grid 의 1fr 은 넘쳐도 자기 몫을 지킨다. */
  #sm-kw label{display:grid;grid-template-columns:auto minmax(0,1fr) auto;
    align-items:center;gap:10px;padding:7px 12px;cursor:pointer;
    border-bottom:1px solid var(--rule-soft);font-size:13.5px}
  #sm-kw label:hover{background:var(--bar)}
  #sm-kw label input{accent-color:var(--patina);flex:none;margin:0}
  /* 원본 어딘가의 text-transform 이 상속돼 검색어가 전부 대문자로 보였다.
     검색어는 사용자가 실제로 친 문자열이라 그대로 보여야 한다. */
  #sm-kw .kw{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    color:var(--ink);text-transform:none}
  #sm-kw .n{font:400 11.5px/1 var(--mono);color:var(--slate);white-space:nowrap}
  #sm-kw .bar2{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
  #sm-kw .go2{font:500 13px/1 var(--sans);color:var(--stone);background:var(--patina);
    border:0;border-radius:6px;padding:9px 16px;cursor:pointer}
  #sm-kw .go2:disabled{opacity:.4;cursor:default}
  #sm-kw .cnt{font-size:12.5px;color:var(--slate)}
  #sm-kw .warn{color:var(--copper)}

  /* 플러그인으로 넘기는 일 — 조용한 목록. 화면의 결론이 아니라 각주다. */
  #sm-cc .sub{color:var(--slate);font-size:13px;margin:4px 0 16px}
  #sm-cc ul{list-style:none;padding:0;margin:0;border-top:1px solid var(--rule-soft)}
  #sm-cc li{display:flex;align-items:center;gap:18px;padding:12px 0;
    border-bottom:1px solid var(--rule-soft)}
  #sm-cc li div{flex:1;min-width:0}
  #sm-cc li b{display:block;font-weight:600;font-size:14px}
  #sm-cc li span{color:var(--slate);font-size:12.5px}
  #sm-cc button{font:400 12px/1 var(--mono);color:var(--slate);background:transparent;
    border:1px solid var(--rule);border-radius:6px;padding:6px 10px;cursor:pointer;flex:none}
  #sm-cc button:hover{color:var(--patina);border-color:var(--patina)}
  @media(max-width:640px){#sm-cc li{flex-direction:column;align-items:flex-start;gap:8px}}

  /* 설정 — 고르면 곧바로 저장한다. 저장 버튼이 따로 없으니 결과는 옆에서 말해 준다. */
  #sm-set .sub{color:var(--slate);font-size:13px;margin:4px 0 14px}
  #sm-set .opts{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  #sm-set .opts button{font:400 12px/1 var(--mono);color:var(--slate);background:transparent;
    border:1px solid var(--rule);border-radius:6px;padding:7px 13px;cursor:pointer}
  #sm-set .opts button.on{color:var(--patina);border-color:var(--patina);background:var(--wash)}
  #sm-set .msg{font:400 11.5px/1 var(--mono);color:var(--slate);margin-left:6px}

  /* 모바일: 차트 SVG 는 720px 고정이고 부모(.logwrap)가 overflow-x:auto 로 받는다.
     스크롤이 된다는 걸 알려주지 않으면 잘린 그림으로만 보인다. */
  @media(max-width:900px){
    .logwrap{position:relative;-webkit-overflow-scrolling:touch;
      /* 오른쪽 끝에 페이드 — 끝나지 않았다는 신호 */
      -webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);
      mask-image:linear-gradient(90deg,#000 88%,transparent)}
    .logwrap.at-end{-webkit-mask-image:none;mask-image:none}
    .sm-swipe{font:400 11px/1 var(--mono);color:var(--slate);margin:6px 0 0;
      display:flex;align-items:center;gap:6px}
  }
  @media(min-width:901px){.sm-swipe{display:none}}

  /* 안내 단계의 실행 버튼 — 원본 .cmd 는 명령어를 복사하는 칩이었다. */
  .stp .cmd{font:inherit;font-size:13px;cursor:pointer;border:1px solid var(--patina);
    background:transparent;color:var(--patina);border-radius:6px;padding:5px 12px}
  .stp .cmd:hover:not(:disabled){background:var(--wash)}
  .stp .cmd:disabled{opacity:.5;cursor:default}
  .stp .cmd::after{content:none}

  /* 기회 카드: 버튼 넷이 카드마다 반복돼 소음이 된다. 평소엔 물러나 있게. */
  .opp .acts button{opacity:.72;transition:opacity .12s}
  .opp:hover .acts button,.opp .acts button:focus-visible{opacity:1}
  .opp [data-write]{color:var(--copper);border-color:var(--copper)}
</style>
<script>
(function () {
@@TERMS@@
  // 이 조각은 호스팅 대시보드에만 얹힌다(server/app.py 의 /d). 그 배포에서는 유료 키를
  // 서버가 대므로 doctor 의 준비물 명부에서도 owner 가 server 로 뒤집혀 있다
  // (SEOMINER_HOSTED). 원본 뷰가 "키를 발급하세요"라고 말하면 안 되는 자리를 이 표식
  // 하나로 판단한다 — 렌더된 한국어를 정규식으로 되짚지 않는다.
  window.SM_HOSTED = true;

  // 초기화 한 곳이 터져도 나머지는 돈다. 조용히 넘어가지도 않는다 — 콘솔에 원인을
  // 남기고 화면 맨 위에 배너를 세운다. 예전에는 여기서 throw 해서 아래
  // addEventListener 가 하나도 안 걸렸다: 사이드바도, 사이트 전환도, 실행 버튼도
  // 같이 죽었다. 어긋남을 '알리는 것'과 화면을 '못 쓰게 만드는 것'은 다르다.
  var FAILED = {};
  function fail(what, e) {
    if (FAILED[what]) return;      // MutationObserver 가 다시 부른다 — 한 번만 알린다
    FAILED[what] = 1;
    console.error("[seo-miner] " + what, e);
    var host = document.querySelector("main") || document.body;
    if (!host) return;
    var box = document.getElementById("sm-fail");
    if (!box) {
      box = document.createElement("div");
      box.id = "sm-fail";
      host.insertBefore(box, host.firstChild);
    }
    var line = document.createElement("p");
    line.textContent = what + " — " + ((e && e.message) || e);
    box.appendChild(line);
  }
  function step(what, fn) { try { fn(); } catch (e) { fail(what, e); } }

  var b = document.createElement("button");
  b.id = "sm-run"; b.textContent = "전체 분석 실행";

  function proj() {
    var p = document.getElementById("proj");
    return p ? p.value : "";
  }
  // 분석은 워커가 백그라운드로 돈다. 끝난 걸 화면이 모르면 유저는 빈 대시보드를
  // 보고 있다가 직접 새로고침해야 한다 — 첫 분석이면 그게 이탈 지점이다.
  var ran = null;
  function paint(st) {
    var r = st && st[proj()];
    if (!r) return;
    b.disabled = !!r.running;
    b.textContent = r.running ? "분석 중…" : "전체 분석 실행";
    waiting(r);
    if (ran && !r.running) { load(); loadDoctor(); perfLoad(); }   // 끝나면 스스로 채워진다
    ran = r.running;
  }

  // 도는 동안 화면은 빈 상태 문구로 뒤덮인다 — "실행하세요"라고 잘못 안내한다.
  function waiting(r) {
    var el = document.getElementById("sm-wait"), main = document.querySelector("main");
    if (!r.running) { if (el) el.remove(); return; }
    if (el || !main) return;
    el = document.createElement("p");
    el.id = "sm-wait";
    el.textContent = r.last_run_at
      ? "다시 분석하는 중입니다 — 끝나면 이 화면이 자동으로 갱신됩니다."
      : "첫 분석이 진행 중입니다 — 검색 실적부터 개선 기회까지 순서대로 수집합니다. " +
        "몇 분 걸리고, 끝나면 이 화면이 자동으로 갱신됩니다.";
    main.insertBefore(el, main.firstChild);
  }
  async function poll() {
    try { paint(await (await fetch("/api/run/status")).json()); } catch (e) {}
  }
  b.addEventListener("click", async function () {
    if (!proj()) return;
    b.disabled = true; b.textContent = "시작하는 중…";
    try {
      await fetch("/api/run", {method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({project: proj()})});
    } catch (e) {}
    poll();
  });
  var sel = document.getElementById("proj");
  if (sel) sel.addEventListener("change", poll);
  poll();
  setInterval(poll, 8000);    // 끝나면 버튼이 풀리고 화면이 스스로 채워진다

  // 기회 카드마다 '글 쓰기' — /create run 의 자리다. 리포가 안 붙어 있으면 서버가
  // 428 로 알려 주고, 그때 연결 링크를 보여 준다.
  document.addEventListener("click", async function (ev) {
    var b = ev.target.closest ? ev.target.closest("[data-write]") : null;
    if (!b) return;
    var id = b.getAttribute("data-write");
    b.disabled = true; b.textContent = "작성 중…";
    try {
      var r = await fetch("/api/create", {method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({project: proj(), opportunity_id: Number(id)})});
      var d = await r.json();
      if (r.ok && d.pr) { b.outerHTML = '<a href="' + d.pr + '" target="_blank" rel="noopener">PR 확인하기 →</a>'; return; }
      if (r.status === 428) { b.outerHTML = '<a href="/">저장소를 먼저 연결하세요 →</a>'; return; }
      b.textContent = (d.detail || "작성하지 못했습니다").slice(0, 60); b.disabled = false;
    } catch (e) { b.textContent = "서버에 연결하지 못했습니다"; b.disabled = false; }
  });

  step("용어 손질", function () { retitle(); resentence(); reempty(); });
  document.title = "SEO 대시보드 — seo-miner";   // 원본 <title> 은 애드온보다 앞에 있다

  // ── 단계 용어 한 벌 ─────────────────────────────────────────
  // 같은 단계가 계층마다 다른 이름이었다 — 안내 제목(stage.py)·실행 버튼·화면 버튼,
  // 거기에 terms.js 가 렌더된 한국어를 정규식으로 덮는 네 번째 패스까지. 이제 표는
  // 여기 하나다. 키는 stage.py 가 payload 에 실어 보내는 단계 id 라 화면 글자를
  // 되짚지 않는다 — 안내 문구를 고쳐도 이 표는 안 깨진다.
  //   t    이 단계의 이름 (호스팅 어투)
  //   run  그 화면 상단의 '다시 돌리기' 버튼 — 제목과 겹치지 않게 다르게 부른다
  //   gain 안내의 설명 한 줄
  var STAGE = {
    register: {t: "사이트 등록",
      gain: "분석할 도메인과 시드 키워드를 지정합니다."},
    gsc:      {t: "검색 실적 수집", run: "실적 다시 수집",
      gain: "서치콘솔에서 노출수·클릭수·평균 게재순위를 수집합니다. 이후 모든 분석이 " +
            "이 실측값을 기준으로 합니다."},
    index:    {t: "색인 생성 검사", run: "색인 다시 검사"},
    keywords: {t: "키워드 발굴", run: "키워드 다시 발굴",
      gain: "검색 자동완성으로 키워드 후보를 발굴해 추적 목록을 구성합니다. " +
            "추가 비용이 없습니다."},
    rank:     {t: "순위 추적", run: "순위 다시 확인"},
    ai:       {t: "AI 인용 확인", run: "AI 인용 다시 확인",
      gain: "ChatGPT·Perplexity·Gemini 답변에서 인용되는 도메인을 확인합니다. " +
            "OpenRouter 연동이 필요합니다."},
    competitors: {t: "경쟁사 역키워드", run: "경쟁사 다시 수집",
      gain: "경쟁 도메인이 이미 순위를 잡은 검색어를 수집해 추적 후보로 올립니다. " +
            "DataForSEO Labs 유료 호출입니다."},
    gaps:     {t: "개선 기회 분석", run: "기회 다시 분석",
      gain: "수집한 데이터에서 개선 기회를 산출합니다 — 순위 상승 기회, AI 인용 격차, " +
            "프로그래매틱 SEO 패턴."},
    report:   {t: "보고서 생성"},
    create:   {t: "콘텐츠 작성",
      gain: "도출된 개선 기회를 저장소의 콘텐츠 변경으로 반영합니다. 별도 브랜치와 " +
            "PR 로 제출됩니다."}
  };

  // [기록] 화면의 실행 종류 라벨도 이 표를 본다(runs.kind 는 단계 id 와 같은 말이다).
  window.SM_STAGE = STAGE;

  // 안내 단계의 이름·설명을 id 로 다시 붙인다. 모르는 id 는 손대지 않는다 —
  // stage.py 가 단계를 늘려도 payload 글자가 그대로 나오지, 빈 칸이 되지 않는다.
  // 같은 글자면 안 쓴다: 아래 MutationObserver 가 이 함수를 다시 부르므로,
  // 값이 같아도 textContent 를 넣으면 노드가 갈리며 무한히 서로를 깨운다.
  function put(el, s) { if (el && s && el.textContent !== s) el.textContent = s; }

  function restage(root) {
    (root || document).querySelectorAll("[data-stage]").forEach(function (el) {
      var g = STAGE[el.dataset.stage];
      if (!g) return;
      if (el.tagName === "B") return put(el, g.t);     // 배너·완주 줄의 단계 이름
      put(el.querySelector(".t"), g.t);
      put(el.querySelector(".gain"), g.gain);
    });
  }

  async function runStage(stage, btn) {
    var was = btn.textContent;
    btn.disabled = true; btn.textContent = "실행 중…";
    try {
      var r = await fetch("/api/run", {method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({project: proj(), stages: stage})});
      if (!r.ok) { var d = await r.json(); btn.textContent = (d.detail || "실행하지 못했습니다").slice(0, 44); }
      else { btn.textContent = "실행 시작"; }
    } catch (e) { btn.textContent = "서버에 연결하지 못했습니다"; }
    poll();
    setTimeout(function () { btn.disabled = false; btn.textContent = was; }, 4000);
  }

  // 안내의 '이 명령을 치세요' 칩을 실제 실행 버튼으로 바꾼다. 원본은 명령어를
  // 클립보드로 복사할 뿐이라, 터미널이 없는 웹에서는 막다른 길이었다.
  // 어느 단계인지는 버튼의 data-stage 가 말한다 — 예전에는 버튼 라벨(명령어 문자열)에
  // 정규식을 걸어 되짚었다.
  function wireSteps() {
    document.querySelectorAll("button.cmd").forEach(function (b) {
      if (b.dataset.smWired) return;
      b.dataset.smWired = "1";
      var st = b.dataset.stage || "";
      // data-stage 는 "이 칩이 속한 단계"일 뿐이다 — 그 칩의 명령이 그 단계를 돈다는
      // 뜻이 아니다. 질문이 0건이면 ai 단계의 명령이 `/capture add` 로 내려오고,
      // GSC 미연결이면 gsc 단계의 명령이 `GSC 로그인해줘` 다. 그 판정은 payload 를
      // 쥔 renderGuide 가 data-runnable 로 내려보낸다.
      if (b.dataset.runnable === "1" && STAGE[st] && STAGE[st].run) {
        b.textContent = STAGE[st].t + " 실행";
        b.onclick = function () { runStage(st, b); };
        return;
      }
      if (st === "create") {              // 기회는 아래 목록에 이미 있다
        b.textContent = "개선 기회 보기";
        b.onclick = function () {
          var o = document.getElementById("opps") || document.querySelector(".opp");
          if (o) o.scrollIntoView({behavior: "smooth", block: "start"});
        };
        return;
      }
      // 남는 건 웹에서 실행할 수 없는 칩이다 — 빈 상태 안의 명령 복사칩(사이트
      // 등록·구글 연동)과, 단계는 알지만 그 명령이 다른 일을 하는 칩(`/capture add`,
      // `GSC 로그인해줘`). 웹에는 명령을 칠 곳이 없고, 그 안내는 reempty()·배너가
      // 따로 한다.
      b.remove();
    });
  }

  // ── 화면 ─────────────────────────────────────────────────────
  // 섹션 열넷이 한 페이지에 세로로 쌓여 있었다 — 어디에 뭐가 있는지도, 지금 뭘
  // 하면 되는지도 안 보인다. 주제별로 나누고 좌측 메뉴로 전환한다.
  // 목록의 정본은 원본 뷰다 — 각 views/*.html 이 자기 파일에서 선언한 것을
  // dashboard.py 가 window.__VIEWS__ 로 방출한다. 여기서 다시 나열하지 않는다.
  // 없으면 옛 사본으로 조용히 되돌아가지 않는다 — 말없이 어긋난 두 표가 이 코드가
  // 생긴 이유다. 다만 어긋남을 '알리는 것'과 화면을 '못 쓰게 만드는 것'은 다르다:
  // 아래 조립이 터지면 배너로 알리고 사이드바·화면 분할만 포기한다. 원본은 한 줄
  // 스크롤로 남고(원래 그 모양이다), 사이트 전환·실행 버튼·백링크·성과·키워드는 산다.

  // ── 호스팅이 덧붙이는 것 ─────────────────────────────────────
  // 원본 뷰에는 없고 이 애드온이 런타임에 만드는 것만 여기 적는다. 덧붙이는 자리는
  // 이 두 표뿐이다 — 원본이 선언한 것은 매니페스트가 소유한다.
  // HOST_SEC: [화면 id, 요소 id, 이 요소 바로 뒤에] — perfShell()·keywords()·handoff() 가 만든다
  var HOST_SEC = [
    ["overview", "sm-perf", "daily"],
    ["overview", "sm-dim",  "sm-perf"],
    ["keywords", "sm-kw",   "log"],
    ["history",  "sm-cc",   "made-sec"]
  ];
  // HOST_VIEWS: 대응하는 원본 뷰 파일이 아예 없는 화면 — blRender()·setShell() 이 만든다.
  // [화면 id, 메뉴 이름, 담을 것, 채우는 단계, 이 화면 바로 뒤에]
  var HOST_VIEWS = [
    ["backlinks", "백링크", ["sm-bl"],  [], "site"],
    ["settings",  "설정",   ["sm-set"], [], "history"]
  ];

  function insertAfter(list, at, item) {   // at 바로 뒤 — 못 찾으면(-1) 맨 끝
    list.splice(at < 0 ? list.length : at + 1, 0, item);
  }

  // [화면 id, 메뉴 이름, 담을 것(요소 id), 이 화면을 채우는 단계]
  var VIEWS;
  try {
    if (!Array.isArray(window.__VIEWS__) || !window.__VIEWS__.length) {
      throw new Error("window.__VIEWS__ 가 없습니다 — 이 애드온은 dashboard.py 조립본 뒤에 얹힙니다");
    }
    VIEWS = window.__VIEWS__.map(function (v) {
      return [v.id, v.title, v.sections.slice(), v.stages.slice()];
    });
    HOST_SEC.forEach(function (h) {
      var v = VIEWS.filter(function (x) { return x[0] === h[0]; })[0];
      if (!v) throw new Error("호스팅 섹션이 붙을 화면이 없습니다: " + h[0] + " / " + h[1]);
      insertAfter(v[2], v[2].indexOf(h[2]), h[1]);
    });
    HOST_VIEWS.forEach(function (h) {
      insertAfter(VIEWS, VIEWS.findIndex(function (v) { return v[0] === h[4]; }),
                  h.slice(0, 4));
    });
  } catch (e) {
    VIEWS = [];       // 화면 분할을 포기한다 — nav() 는 실행 버튼만 달고 그대로 선다
    fail("화면 목록을 만들지 못했습니다 — 사이드바와 화면 분할 없이 이어갑니다", e);
  }
  var view = "overview";

  // 원본 섹션을 화면별 상자로 옮긴다. 이미 제자리면 아무것도 하지 않는다 —
  // 애드온 섹션(백링크·키워드)은 늦게 생겨서 이 함수가 여러 번 불린다.
  function place() {
    var c = document.getElementById("content");
    if (!c) return;
    VIEWS.forEach(function (v) {
      var box = document.getElementById("smv-" + v[0]);
      if (!box) {
        box = document.createElement("div");
        box.id = "smv-" + v[0];
        box.className = "sm-view";
        box.hidden = v[0] !== view;
        var h = document.createElement("div");
        h.className = "sm-vh";
        h.innerHTML = "<h1>" + v[1] + "</h1>";
        v[3].forEach(function (st) {      // 그 화면을 채우는 단계를 여기서 돌린다
          var rb = document.createElement("button");
          rb.className = "sm-refresh";
          rb.textContent = STAGE[st].run;   // 화면 제목과 겹치지 않게 다르게 부른다
          rb.title = STAGE[st].t;
          rb.onclick = function () { runStage(st, rb); };
          h.appendChild(rb);
        });
        box.appendChild(h);
        c.appendChild(box);
      }
      v[2].forEach(function (id) {
        var el = document.getElementById(id);
        if (!el) return;
        var sec = el.closest("section") || el;      // band 는 section 이 아니다
        if (sec.parentNode !== box) box.appendChild(sec);
      });
    });
    var cols = document.querySelector(".cols");     // 두 칸 틀은 빈 껍데기가 됐다
    if (cols && !cols.querySelector("section")) cols.remove();
  }

  function show(name) {
    view = name;
    VIEWS.forEach(function (v) {
      var box = document.getElementById("smv-" + v[0]);
      if (box) box.hidden = v[0] !== name;
    });
    document.querySelectorAll("#sm-nav button").forEach(function (x) {
      var on = x.dataset.v === name;
      x.classList.toggle("on", on);
      x.setAttribute("aria-current", on ? "page" : "false");
    });
    window.scrollTo(0, 0);
  }

  step("사이드바", function nav() {
    if (document.getElementById("sm-bar")) return;
    var head = document.querySelector("header");
    if (!head) return;
    var box = document.createElement("div");
    box.id = "sm-bar";
    var nv = document.createElement("nav");
    nv.id = "sm-nav";
    nv.setAttribute("aria-label", "화면");
    VIEWS.forEach(function (v) {
      var t = document.createElement("button");
      t.dataset.v = v[0]; t.dataset.smWired = "1";
      t.textContent = v[1];
      t.onclick = function () { show(v[0]); };
      nv.appendChild(t);
    });
    box.appendChild(nv);
    var act = document.createElement("div");
    act.className = "sm-act";
    act.appendChild(b);                       // 위에서 만든 '전체 분석 실행'
    var rep = document.createElement("a");
    rep.className = "cmd"; rep.textContent = "보고서 다운로드 ↓";
    rep.addEventListener("click", function () {
      rep.href = "/api/report?project=" + encodeURIComponent(proj());
    });
    act.appendChild(rep);
    box.appendChild(act);
    head.appendChild(box);
  });

  // ── 백링크 ───────────────────────────────────────────────────
  // 원본 화면에 없는 축이다. 섹션을 만들어 끼운다(원본 HTML 은 그대로).
  // 서치콘솔이 끝내 답해 주지 않는 유일한 질문이라 외부(DataForSEO)에서 사 온다 —
  // 그래서 이 화면이 제일 먼저 답해야 하는 건 "왜 비어 있나"와 "채우면 얼마인가"다.
  var BL_DONE = "", BL_DATA = null, BL_Q = "", BL_F = "";

  function blNum(n) { return Number(n || 0).toLocaleString("ko-KR"); }
  function blDay(v) { return v ? String(v).slice(0, 10) : ""; }
  function blPct(v) { return v == null ? "—" : (v * 100).toFixed(0) + "%"; }

  // 이 화면이 비는 이유는 둘뿐이다 — 아직 안 쟀거나, 잴 수단이 없거나.
  // 둘을 같은 문장으로 말하면 유저는 자기가 뭘 해야 하는지 모른다.
  function blEmpty(ok) {
    var head = '<section><p class="eyebrow">백링크</p><h2>백링크 프로필</h2>' +
      '<p class="sub">외부 사이트가 우리 도메인으로 건 링크는 서치콘솔이 제공하지 않습니다. ' +
      "웹 전체의 링크 그래프를 크롤링해야 나오는 값이라 외부 데이터 연동이 필요합니다.</p>";
    if (ok)
      return head + '<div class="empty">백링크를 아직 수집하지 않았습니다 — ' +
        "[전체 분석 실행]을 누르면 이번 회차에 함께 수집합니다. 이후로는 30일 주기로 " +
        "다시 수집합니다. 백링크는 일 단위로 변하지 않아 매일 측정해도 같은 값이 나옵니다." +
        "</div></section>";
    return head + '<div class="empty">DataForSEO 연동이 없어 백링크만 건너뜁니다 — ' +
      "나머지 분석은 그대로 동작합니다.<br><br>" +
      '1. <a href="https://dataforseo.com" target="_blank" rel="noopener">dataforseo.com</a> ' +
      "에서 계정을 만듭니다.<br>" +
      "2. 발급받은 로그인·비밀번호를 서버 환경변수 <code>DATAFORSEO_LOGIN</code>·" +
      "<code>DATAFORSEO_PASSWORD</code> 에 설정합니다.<br>" +
      "3. 다음 [전체 분석 실행]부터 이 화면이 채워집니다.<br><br>" +
      "비용은 1회 수집당 약 $0.06 입니다 — 요청당 $0.024 × 2회(요약·참조 도메인)에 " +
      "행당 $0.000036 을 더한 값입니다. 30일 주기라 사이트 1개당 월 $0.06 수준입니다." +
      "</div></section>";
  }

  var BL_HEADS = [
    "도메인?우리 도메인으로 링크를 건 외부 사이트. 한 곳에서 100개보다 100곳에서 1개씩이 강합니다",
    ">지수?DataForSEO 가 산출한 해당 도메인의 신뢰도. 높을수록 링크 1개의 가중치가 큽니다",
    ">백링크?해당 도메인이 우리 도메인으로 건 링크 수",
    ">dofollow?검색엔진에 신뢰를 전달하는 링크 수. 0이면 게재순위에 직접 기여하지 않습니다",
    "최초 발견?DataForSEO 크롤러가 해당 도메인의 링크를 처음 확인한 날"
  ];

  function blFiltered() {
    var q = BL_Q.trim().toLowerCase();
    return ((BL_DATA && BL_DATA.domains) || []).filter(function (x) {
      var df = x.dofollow || 0;
      if (BL_F === "do" && !df) return false;
      if (BL_F === "no" && df) return false;
      return !q || String(x.domain || "").toLowerCase().indexOf(q) >= 0;
    });
  }

  // 목록만 다시 그린다 — 도구줄까지 갈아치우면 타이핑 중에 찾기 칸이 포커스를 잃는다.
  function blList() {
    var box = document.getElementById("sm-bl-list");
    if (!box) return;
    var all = ((BL_DATA && BL_DATA.domains) || []).length, list = blFiltered();
    var n = document.getElementById("sm-bl-n");
    if (n) n.textContent = list.length === all
      ? all + "개" : list.length + "개 / 전체 " + all + "개";
    box.innerHTML = table(BL_HEADS, list.map(function (x) {
      var df = x.dofollow || 0;
      return '<tr><td><span class="dm" title="' + esc(x.domain) + '">' + esc(x.domain) +
        '</span></td><td class="num">' + (x.rank == null ? "—" : x.rank) +
        '</td><td class="num">' + blNum(x.backlinks) +
        '</td><td class="num' + (df ? "" : " nf") + '">' + blNum(df) +
        "</td><td>" + (esc(blDay(x.first_seen)) || "—") + "</td></tr>";
    }), list.length === all
      ? "참조 도메인이 하나도 없습니다 — 외부 사이트가 우리 도메인으로 건 링크가 확인되지 않았습니다."
      : '거른 조건에 맞는 도메인이 없습니다.<div class="acts">' +
        '<button id="sm-bl-reset">필터 지우기</button></div>');
    // 표를 다시 그릴 때마다 사라지므로 매번 다시 잇는다.
    var rs = document.getElementById("sm-bl-reset");
    if (rs) rs.addEventListener("click", function () {
      BL_Q = ""; BL_F = "";
      var q = document.getElementById("sm-bl-q"), f = document.getElementById("sm-bl-f");
      if (q) q.value = ""; if (f) f.value = "";
      blList();
    });
  }

  // 목록은 화면 밖에서도 이어진다 — 지금 걸러 놓은 것 그대로 표로 내보낸다.
  // 맨 앞 BOM 이 있어야 엑셀이 한글을 안 깬다(기회 목록 내보내기와 같은 규칙).
  function blCsv() {
    var rows = [["도메인", "지수", "백링크", "dofollow", "최초 발견"]].concat(
      blFiltered().map(function (x) {
        return [x.domain, x.rank == null ? "" : x.rank, x.backlinks || 0,
                x.dofollow || 0, blDay(x.first_seen)];
      }));
    var csv = "﻿" + rows.map(function (r) {
      return r.map(function (c) {
        return '"' + String(c).replace(/"/g, '""') + '"';
      }).join(",");
    }).join("\r\n");
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], {type: "text/csv;charset=utf-8"}));
    a.download = "seo-miner-참조도메인-" + new Date().toISOString().slice(0, 10) + ".csv";
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function blRender() {
    var host = document.querySelector("main");
    if (!host || !BL_DATA) return;
    var sec = document.getElementById("sm-bl");
    // 채우기 전에 문서에 붙인다 — 안 붙이면 아래 blList() 의 getElementById 가
    // 못 찾고 조용히 빠져나가, 첫 화면에서는 표가 비어 있다(사이트를 바꾸면 그제야
    // 이미 붙어 있는 상자를 다시 그리므로 나타난다).
    if (!sec) { sec = document.createElement("div"); sec.id = "sm-bl"; }
    if (!sec.parentNode) host.appendChild(sec);
    var d = BL_DATA, s = d.summary;
    if (!s) {
      sec.innerHTML = blEmpty(d.available);
    } else {
      // 측정 회차. 마지막 줄이 지금 값이고, 그 앞줄이 비교 대상이다.
      var h = (d.history || []).map(function (r) {
        return {d: blDay(r.checked_date), backlinks: r.backlinks,
                referring_domains: r.referring_domains};
      });
      var pv = h.length > 1 ? h[h.length - 2] : {};
      var dof = s.dofollow, nof = s.nofollow;
      var ratio = (dof == null || nof == null || dof + nof === 0) ? null : dof / (dof + nof);
      var was = function (v, f) {
        return v == null ? "비교할 직전 측정 없음" : "이전 " + f(v);
      };
      var m = function (v, label, basis) {
        return '<div class="m"><div class="v">' + v + '</div><div class="l">' + label +
          '</div><div class="b">' + basis + "</div></div>";
      };
      var band =
        m(blNum(s.referring_domains) +
            delta(s.referring_domains, pv.referring_domains, blNum, false),
          "참조 도메인 수",
          "링크를 건 외부 사이트 수 · " + was(pv.referring_domains, blNum)) +
        m(blNum(s.backlinks) + delta(s.backlinks, pv.backlinks, blNum, false),
          "총 백링크 수",
          "링크 개수 합계 · " + was(pv.backlinks, blNum)) +
        m(blPct(ratio), "dofollow 비율",
          dof == null ? "링크 유형을 수집하지 못했습니다"
            : "dofollow " + blNum(dof) + " · nofollow " + blNum(nof)) +
        m(blNum(s.broken_backlinks), "깨진 백링크",
          "링크는 살아 있으나 도착 페이지가 404") +
        m(s.rank == null ? "—" : s.rank, "도메인 지수",
          "DataForSEO 가 산출한 우리 도메인의 신뢰도");
      var out = '<section><p class="eyebrow">백링크 · ' + esc(blDay(s.checked_date)) +
        " 측정</p><h2>백링크 프로필</h2>" +
        '<p class="sub">총 백링크 수보다 참조 도메인 수가 중요합니다. 한 사이트에서 100개를 ' +
        "받는 것보다 100개 사이트에서 1개씩 받는 쪽이 게재순위에 훨씬 유리합니다. " +
        "수집 주기가 30일이라 증감은 직전 측정 대비 값입니다.</p>" +
        '<div class="band">' + band + "</div></section>";

      // 백링크는 절대값보다 기울기다 — 늘고 있는지 빠지고 있는지가 이 화면의 결론이다.
      if (h.length > 1)
        out += '<section><p class="eyebrow">측정 ' + h.length + '회 · 30일 주기</p>' +
          "<h2>백링크 추이</h2>" +
          '<p class="sub">점 하나가 측정 1회입니다(일별이 아닙니다). 선이 평평하면 새 링크가 ' +
          "유입되지 않는다는 뜻이고, 참조 도메인 수만 늘면 링크 출처가 넓어지고 있다는 뜻입니다.</p>" +
          '<div class="sm-charts">' +
          "<div>" + line(h, "referring_domains", {
            label: "참조 도메인 수", fmt: blNum, now: s.referring_domains,
            was: pv.referring_domains, dfmt: blNum}) + "</div>" +
          "<div>" + line(h, "backlinks", {
            label: "총 백링크 수", fmt: blNum, now: s.backlinks,
            was: pv.backlinks, dfmt: blNum}) + "</div>" +
          "</div></section>";

      var doms = d.domains || [];
      var kept = s.referring_domains && doms.length && s.referring_domains > doms.length
        ? "전체 " + blNum(s.referring_domains) + "개 중 지수가 높은 " + doms.length +
          "개만 저장합니다. "
        : "";
      out += '<section><p class="eyebrow">지수 높은 순 · ' + doms.length +
        "개</p><h2>참조 도메인</h2>" +
        '<p class="sub">' + kept + "지수가 높은 도메인의 링크 1개가 낮은 도메인의 링크 " +
        "10개보다 무겁습니다. dofollow 가 0인 행은 게재순위에 기여하지 않습니다 — " +
        "유입 트래픽은 그대로 발생합니다.</p>" +
        (doms.length ? '<div class="tools">' +
          '<input type="search" id="sm-bl-q" placeholder="도메인으로 찾기" ' +
          'aria-label="참조 도메인 찾기">' +
          '<select id="sm-bl-f" aria-label="링크 유형으로 거르기">' +
          '<option value="">전체</option><option value="do">dofollow 있음</option>' +
          '<option value="no">dofollow 없음</option></select>' +
          '<span class="n" id="sm-bl-n"></span><span class="sp"></span>' +
          '<button class="go sec" id="sm-bl-csv" ' +
          'title="지금 걸러 놓은 목록 그대로 내려받습니다">CSV 내보내기</button></div>' : "") +
        '<div id="sm-bl-list"></div></section>';
      sec.innerHTML = out;

      var q = document.getElementById("sm-bl-q");
      if (q) {
        q.value = BL_Q;
        q.addEventListener("input", function () { BL_Q = q.value; blList(); });
      }
      var f = document.getElementById("sm-bl-f");
      if (f) {
        f.value = BL_F;
        f.addEventListener("change", function () { BL_F = f.value; blList(); });
      }
      var cs = document.getElementById("sm-bl-csv");
      if (cs) cs.addEventListener("click", blCsv);
      blList();
    }
    place();
  }

  async function backlinks() {
    var pj = proj();
    // 표시를 fetch 앞에서 건다 — 뒤에 걸면 응답을 기다리는 사이에 다시 불려
    // 요청이 겹치고, 늦게 끝난 쪽이 먼저 그린 화면을 덮어써 표가 사라진다.
    if (!pj || BL_DONE === pj) return;
    BL_DONE = pj;
    try {
      BL_DATA = await (await fetch("/api/backlinks?project=" +
        encodeURIComponent(pj))).json();
    } catch (e) { BL_DONE = ""; return; }   // 실패는 되돌려 다음 기회에 다시 받는다
    blRender();
  }
  if (sel) sel.addEventListener("change", function () {
    BL_DONE = ""; BL_Q = ""; BL_F = ""; backlinks();
  });
  backlinks();

  // ── 설정 ─────────────────────────────────────────────────────
  // 사이트마다 다른 값이 사는 자리. 지금은 수집 주기 하나뿐이고, 항목이 늘면 여기 붙는다.
  // 프리셋 목록의 정본은 서버(app.RUN_PRESETS)다 — 화면은 받아서 그리기만 한다.
  var SET_DONE = "", SET_H = null;

  // 껍데기는 동기로 만든다 — place() 가 배치할 때 이미 있어야 한다(성과 상자와 같다).
  step("설정 상자", function setShell() {
    var host = document.querySelector("main");
    if (!host || document.getElementById("sm-set")) return;
    var sec = document.createElement("section");
    sec.id = "sm-set";
    sec.innerHTML = '<p class="eyebrow">설정</p><h2>자동 수집 주기</h2>' +
      '<p class="sub">이 사이트를 얼마나 자주 다시 측정할지 정합니다. ' +
      "끄더라도 [전체 분석 실행]과 아직 한 번도 안 잰 사이트의 첫 측정은 그대로 " +
      "동작합니다 — 자동 재측정만 멈춥니다.</p>" +
      '<div class="opts"></div>';
    // 위임 한 번만 — 다시 그릴 때마다 붙이면 한 번 누른 게 여러 번 저장된다.
    sec.addEventListener("click", function (ev) {
      var t = ev.target.closest ? ev.target.closest("[data-h]") : null;
      if (t) setSave(Number(t.dataset.h));
    });
    host.appendChild(sec);
  });

  function setRender(msg) {
    var sec = document.getElementById("sm-set");
    if (!sec || !SET_H) return;
    sec.querySelector(".opts").innerHTML = SET_H.presets.map(function (p) {
      return '<button data-h="' + p.h + '"' +
        (p.h === SET_H.run_every_hours ? ' class="on"' : "") + ">" + esc(p.label) +
        "</button>";
    }).join("") + '<span class="msg">' + esc(msg || "") + "</span>";
  }

  async function setLoad() {
    var pj = proj();
    if (!pj || SET_DONE === pj) return;
    SET_DONE = pj;
    try {
      SET_H = await (await fetch("/api/settings?project=" +
        encodeURIComponent(pj))).json();
    } catch (e) { SET_DONE = ""; return; }   // 실패는 되돌려 다음 기회에 다시 받는다
    setRender("");
  }

  async function setSave(h) {
    var pj = proj();
    if (!pj) return;
    try {
      var r = await fetch("/api/settings", {method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({project: pj, run_every_hours: h})});
      var d = await r.json();
      if (!r.ok) throw new Error(d.detail || "");
      SET_H.run_every_hours = d.run_every_hours;
      setRender("저장됨");
    } catch (e) {
      setRender("저장하지 못했습니다 — " + ((e && e.message) || "다시 시도해 주세요"));
    }
  }
  if (sel) sel.addEventListener("change", function () { SET_DONE = ""; setLoad(); });
  setLoad();

  // 좁은 화면에서 차트는 가로로 스크롤한다(원본 .logwrap 설계). 그 사실을 알린다 —
  // 모르면 잘린 그림으로만 보인다.
  function swipeHint() {
    document.querySelectorAll(".logwrap").forEach(function (w) {
      if (w.scrollWidth <= w.clientWidth + 2) return;      // 넘칠 때만
      if (!w.dataset.smHint) {
        w.dataset.smHint = "1";
        var p = document.createElement("p");
        p.className = "sm-swipe";
        p.textContent = "← 좌우로 스크롤하세요";
        w.parentNode.insertBefore(p, w.nextSibling);
        w.addEventListener("scroll", function () {
          var end = w.scrollLeft + w.clientWidth >= w.scrollWidth - 4;
          w.classList.toggle("at-end", end);
          p.style.visibility = end ? "hidden" : "";
        });
      }
    });
  }
  step("가로 스크롤 안내", swipeHint);
  window.addEventListener("resize", swipeHint);

  // ── 키워드 선별 ────────────────────────────────────────────
  // 자동 활성화는 '구글이 이미 노출시킨' 검색어만 켠다. 자동완성에서 캔 후보는
  // 관련성이 확인되지 않아 그대로 잠들어 있다 — 여기서 사람이 고른다.
  var kwMode = "candidate", kwWired = false;

  async function kwLoad() {
    var box = document.getElementById("sm-kw");
    if (!box) return;
    var list = box.querySelector(".list");
    list.innerHTML = '<p style="padding:14px;color:var(--slate);font-size:13px">불러오는 중…</p>';
    var d;
    try {
      d = await (await fetch("/api/keywords?status=" + kwMode +
                             "&project=" + encodeURIComponent(proj()))).json();
    } catch (e) { list.innerHTML = '<p style="padding:14px;color:var(--slate);font-size:13px">키워드를 불러오지 못했습니다. 새로고침해 주세요.</p>'; return; }
    var ks = d.keywords || [];
    box.querySelector(".cnt").innerHTML = "추적 키워드 " + d.active_total + " / " + d.limit +
      (d.active_total >= d.limit ? ' <b class="warn">· 한도 도달</b>' : "");
    if (!ks.length) {
      list.innerHTML = '<p style="padding:14px;color:var(--slate);font-size:13px">' +
        (kwMode === "candidate" ? "발굴된 후보가 없습니다 — 키워드 발굴을 먼저 실행하세요."
                                : "추적 중인 키워드가 없습니다.") + "</p>";
      return;
    }
    list.innerHTML = ks.map(function (k) {
      return '<label><input type="checkbox" value="' + k.id + '">' +
             '<span class="kw">' + esc(k.keyword) + "</span>" +
             '<span class="n">' + (k.imp ? "노출 " + k.imp : esc(k.source || "")) + "</span></label>";
    }).join("");
  }

  async function kwApply(on) {
    var box = document.getElementById("sm-kw");
    var ids = [...box.querySelectorAll(".list input:checked")].map(function (i) {
      return Number(i.value);
    });
    if (!ids.length) return;
    var btn = box.querySelector(".go2");
    btn.disabled = true;
    try {
      var r = await fetch("/api/keywords", {method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({project: proj(), ids: ids, active: on})});
      var d = await r.json();
      if (!r.ok) { box.querySelector(".cnt").innerHTML =
        '<b class="warn">' + esc(d.detail || "변경하지 못했습니다") + "</b>"; }
    } catch (e) {}
    btn.disabled = false;
    kwLoad();
  }

  function keywords() {
    var host = document.querySelector("main");
    if (!host || document.getElementById("sm-kw")) return;
    var sec = document.createElement("section");
    sec.id = "sm-kw";
    sec.innerHTML = '<p class="eyebrow">KEYWORDS</p><h2>추적 키워드 관리</h2>' +
      '<p class="sub">서치콘솔에 노출된 검색어는 자동으로 추적합니다. 자동완성으로 발굴한 후보는 ' +
      "관련 있는 것만 직접 선택하세요 — 추적 키워드 수만큼 순위 추적 비용이 발생합니다.</p>" +
      '<div class="tabs"><button data-m="candidate" class="on">후보</button>' +
      '<button data-m="active">추적 중</button></div>' +
      '<div class="list"></div>' +
      '<div class="bar2"><button class="go2">고른 것 추적하기</button>' +
      '<span class="cnt"></span></div>';
    host.appendChild(sec);

    sec.querySelector(".tabs").addEventListener("click", function (ev) {
      var b = ev.target.closest ? ev.target.closest("[data-m]") : null;
      if (!b) return;
      kwMode = b.getAttribute("data-m");
      sec.querySelectorAll(".tabs button").forEach(function (x) {
        x.classList.toggle("on", x === b);
      });
      sec.querySelector(".go2").textContent =
        kwMode === "candidate" ? "선택 항목 추적" : "추적 해제";
      kwLoad();
    });
    sec.querySelector(".go2").addEventListener("click", function () {
      kwApply(kwMode === "candidate");
    });
    kwLoad();
  }
  step("키워드 패널", keywords);
  if (sel) sel.addEventListener("change", function () { kwLoad(); });

  // ── Claude Code 로 넘길 일 ─────────────────────────────────
  // 웹에서 못 하는 게 분명히 있다(관련성 판단·스킬 해석·자유 질문). 없는 척하지 말고
  // 명령어를 그대로 준다 — 여기서만은 '복사'가 맞는 동작이다.
  var HANDOFF = [
    ["발굴 후보 키워드 선별",
     "관련성 판단이 필요합니다. 대시보드는 서치콘솔 노출 기준으로만 자동 선택합니다.",
     "/capture keywords "],
    ["개선 기회 심층 분석",
     "seo-audit·ai-seo 전문 지침으로 원인과 조치 방안까지 도출합니다.",
     "/capture gaps "],
    ["데이터 질의응답",
     "“클릭수 0인 검색어의 원인은?” 같은 질문에 수집 데이터를 조회해 답변합니다.",
     "/capture ask "],
    ["콘텐츠 작업 계획 수립",
     "저장소 커밋 이력과 대조해 작업 우선순위를 배치합니다.",
     "/create plan "]
  ];

  function handoff() {
    var host = document.querySelector("main");
    if (!host || document.getElementById("sm-cc")) return;
    var sec = document.createElement("section");
    sec.id = "sm-cc";
    sec.innerHTML = '<p class="eyebrow">CLAUDE CODE</p>' +
      "<h2>고급 분석</h2>" +
      '<p class="sub">해석과 판단이 필요한 작업은 Claude Code 플러그인에서 실행합니다. 명령어를 복사해 붙여 넣으세요.</p>' +
      "<ul>" + HANDOFF.map(function (h) {
        return "<li><div><b>" + esc(h[0]) + "</b><span>" + esc(h[1]) + "</span></div>" +
               '<button data-cc="' + esc(h[2]) + '">' + esc(h[2].trim()) + "</button></li>";
      }).join("") + "</ul>";
    host.appendChild(sec);
    sec.addEventListener("click", function (ev) {
      var b = ev.target.closest ? ev.target.closest("[data-cc]") : null;
      if (!b) return;
      var cmd = b.getAttribute("data-cc") + proj();
      navigator.clipboard.writeText(cmd).then(function () {
        var was = b.textContent;
        b.textContent = "복사됨 ✓";
        setTimeout(function () { b.textContent = was; }, 1400);
      });
    });
  }
  step("고급 분석 패널", handoff);

  // ── 서치콘솔 성과 ───────────────────────────────────────────
  // 화면이 쓰던 것은 클릭·노출 둘뿐이었다. CTR 과 게재순위는 gsc_snapshots 에 이미
  // 들어 있는데 아무도 읽지 않아서, 서치콘솔을 보던 사람에게는 지표 절반이 빈 화면이었다.
  var PERF = null, dimMode = "queries";
  var nf = function (n) { return Number(n || 0).toLocaleString("ko-KR"); };
  var pct = function (v) { return v == null ? "—" : (v * 100).toFixed(2) + "%"; };
  var pos = function (v) { return v == null ? "—" : v.toFixed(1); };

  // 증감. 게재순위만 방향이 반대다 — 작아지는 게 오르는 것이다.
  function delta(now, was, fmt, lowerIsBetter) {
    if (now == null || was == null) return "";
    var d = now - was;
    if (Math.abs(d) < 1e-9) return ' <span class="d muted">—</span>';
    var good = lowerIsBetter ? d < 0 : d > 0;
    var body = (d > 0 ? "+" : "−") + fmt(Math.abs(d));
    return ' <span class="d ' + (good ? "up" : "down") + '">' + body + "</span>";
  }

  // KPI 두 칸을 원본 밴드에 끼운다. render() 가 band 를 다시 그리면 사라지므로
  // MutationObserver 쪽에서 다시 부른다 — 이미 있으면 아무것도 하지 않는다.
  function kpi() {
    var band = document.getElementById("band");
    if (!band || !PERF || !PERF.totals || band.querySelector("[data-sm-kpi]")) return;
    var t = PERF.totals, pv = PERF.prev || {};
    var box = document.createElement("div");
    box.style.display = "contents";
    box.setAttribute("data-sm-kpi", "1");
    // 옆 칸들과 같은 기준 줄을 단다 — 무엇을 어떻게 잰 값이고 직전이 얼마였는지.
    var basis = function (how, was, fmt) {
      return '<div class="b">' + how + " · " +
        (was == null ? "비교할 직전 기록 없음" : "이전 " + fmt(was)) + "</div>";
    };
    box.innerHTML =
      '<div class="m"><div class="v">' + pct(t.ctr) +
        delta(t.ctr, pv.ctr, function (x) { return (x * 100).toFixed(2) + "%p"; }, false) +
        '</div><div class="l">CTR</div>' + basis("노출 대비 클릭", pv.ctr, pct) + "</div>" +
      '<div class="m"><div class="v">' + pos(t.position) +
        delta(t.position, pv.position, function (x) { return x.toFixed(1); }, true) +
        '</div><div class="l">평균 게재순위</div>' +
        basis("노출 가중 평균", pv.position, pos) + "</div>";
    band.appendChild(box);
  }

  // 꺾은선 하나. 원본 로그 차트와 같은 언어(등폭 숫자·괘선·patina)로 그린다.
  // 제목 줄에는 '지금 값 + 직전 대비', 차트에는 눈금선과 그 값 — 선만 있으면 모양만 보이고
  // "그래서 지금 얼마"를 못 읽는다. 세로축 값은 차트 오른쪽 위·아래에 붙인다.
  function line(rows, key, opt) {
    var pts = [];
    rows.forEach(function (r, i) { if (r[key] != null) pts.push([i, r[key]]); });
    var now = opt.now == null ? "" : '<span class="nowv">' + opt.fmt(opt.now) +
      delta(opt.now, opt.was, opt.dfmt, !!opt.invert) + "</span>";
    var head = function () {
      return '<div class="sm-ct"><span>' + opt.label + "</span>" + now + "</div>";
    };
    if (pts.length < 2)
      return head() +
        '<p class="sm-none">추이를 그리려면 이틀 이상의 일별 데이터가 필요합니다.</p>';
    var W = 100, H = 42, P = 3, n = rows.length;
    var vs = pts.map(function (q) { return q[1]; });
    var lo = Math.min.apply(null, vs), hi = Math.max.apply(null, vs);
    if (hi === lo) { hi = lo + (lo || 1) * 0.1; lo = lo - (lo || 1) * 0.1; }
    var X = function (i) { return P + i * (W - P * 2) / Math.max(1, n - 1); };
    var Y = function (v) {
      var t = (v - lo) / (hi - lo);
      return P + (opt.invert ? t : 1 - t) * (H - P * 2);   // 게재순위는 작을수록 위
    };
    var d = pts.map(function (q, k) {
      return (k ? "L" : "M") + X(q[0]).toFixed(2) + " " + Y(q[1]).toFixed(2);
    }).join(" ");
    var last = pts[pts.length - 1];
    // 눈금선 셋 — 위·가운데·아래. 위아래 값은 옆의 라벨이 말한다.
    var grid = [P, H / 2, H - P].map(function (y) {
      return '<line class="g" x1="' + P + '" y1="' + y + '" x2="' + (W - P) +
        '" y2="' + y + '"/>';
    }).join("");
    // 칸마다 투명한 띠 — <title> 만으로 그날 값을 읽는다(핸들러를 안 붙인다).
    var bw = (W - P * 2) / Math.max(1, n - 1);
    var hov = rows.map(function (r, i) {
      var x0 = Math.max(0, X(i) - bw / 2), x1 = Math.min(W, X(i) + bw / 2);
      return '<rect x="' + x0.toFixed(2) + '" y="0" width="' + (x1 - x0).toFixed(2) +
        '" height="' + H + '"><title>' + esc(r.d) + " — " + opt.label + " " +
        (r[key] == null ? "값 없음" : opt.fmt(r[key])) + "</title></rect>";
    }).join("");
    var mid = n > 2 ? "<span>" + esc(rows[Math.floor((n - 1) / 2)].d) + "</span>" : "";
    return head() +
      '<div class="sm-plot"><span class="sm-gl t">' +
      opt.fmt(opt.invert ? lo : hi) + '</span><span class="sm-gl b">' +
      opt.fmt(opt.invert ? hi : lo) + "</span>" +
      '<svg class="sm-line" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none"' +
      ' role="img" aria-label="' + opt.label + ' 추이 — 최고 ' +
      opt.fmt(opt.invert ? lo : hi) + ', 최저 ' + opt.fmt(opt.invert ? hi : lo) + '">' +
      grid + '<path d="' + d + '"/>' +
      '<circle cx="' + X(last[0]).toFixed(2) + '" cy="' + Y(last[1]).toFixed(2) +
      '" r="1.1"/>' + hov + "</svg></div>" +
      '<div class="sm-ax"><span>' + esc(rows[0].d) + "</span>" + mid +
      "<span>" + esc(rows[rows.length - 1].d) + "</span></div>";
  }

  function perfRender() {
    var sec = document.getElementById("sm-perf");
    if (!sec || !PERF) return;
    sec.hidden = false;
    var t = PERF.totals;
    if (!t) {
      sec.innerHTML = '<p class="eyebrow">PERFORMANCE</p><h2>검색 성과</h2>' +
        '<p class="sm-none">검색 실적을 아직 수집하지 않았습니다 — 위 [실적 다시 수집]을 누르면 채워집니다.</p>';
      return;
    }
    var dl = PERF.daily || [], pv = PERF.prev || {};
    var span = dl.length ? dl[0].d + " → " + dl[dl.length - 1].d : PERF.snapshot;
    sec.innerHTML = '<p class="eyebrow">PERFORMANCE · ' + esc(span) +
      (dl.length ? " · " + dl.length + "일" : "") + "</p>" +
      "<h2>검색 성과</h2>" +
      '<p class="sub">위 일별 추이가 클릭·노출을 그립니다. 나머지 두 지표가 여기 있습니다 — ' +
      "게재순위는 노출 가중 평균이라 서치콘솔 화면의 값과 같고, 선이 위로 갈수록 순위가 높습니다. " +
      "제목 옆 숫자는 현재 값이고 증감은 직전 분석 대비입니다.</p>" +
      '<div class="sm-charts">' +
      ['<div>' + line(dl, "ctr", {label: "CTR", fmt: pct, now: t.ctr, was: pv.ctr,
          dfmt: function (x) { return (x * 100).toFixed(2) + "%p"; }}) + "</div>",
       '<div>' + line(dl, "position", {label: "평균 게재순위", fmt: pos, invert: true,
          now: t.position, was: pv.position,
          dfmt: function (x) { return x.toFixed(1); }}) + "</div>"
      ].join("") + "</div>";
  }

  var DIMS = [["queries", "검색어"], ["pages", "페이지"], ["devices", "기기"]];
  var DEVICE = {MOBILE: "모바일", DESKTOP: "데스크톱", TABLET: "태블릿"};
  // [키, 라벨, 작은 값이 좋은가] — 게재순위만 오름차순이 '좋은 순'이다
  var COLS = [["clicks", "클릭", false], ["impressions", "노출", false],
              ["ctr", "CTR", false], ["position", "게재순위", true]];
  var dimSort = "clicks", dimAsc = false, dimQ = "";

  // 지금 보고 있는 줄들. 찾기 칸과 정렬을 함께 반영한다.
  function dimRows() {
    var q = dimQ.trim().toLowerCase();
    var rows = (PERF[dimMode] || []).filter(function (r) {
      return !q || String(r.key).toLowerCase().indexOf(q) >= 0;
    });
    return rows.sort(function (a, b) {
      var x = a[dimSort], y = b[dimSort];
      if (x == null) return 1;
      if (y == null) return -1;
      return dimAsc ? x - y : y - x;
    });
  }

  // 표만 다시 그린다 — 껍데기까지 갈아치우면 찾기 칸이 사라져 입력 도중 포커스를 잃는다.
  function dimTable() {
    var sec = document.getElementById("sm-dim");
    var box = sec && sec.querySelector(".sm-dimt");
    if (!box || !PERF) return;
    sec.querySelectorAll("[data-d]").forEach(function (b) {
      b.classList.toggle("on", b.dataset.d === dimMode);
      b.setAttribute("aria-pressed", b.dataset.d === dimMode);
    });
    var all = (PERF[dimMode] || []).length, rows = dimRows();
    var cnt = sec.querySelector(".sm-dimn");
    if (cnt) cnt.textContent = rows.length === all
      ? all + "행" : rows.length + "행 / 전체 " + all + "행";
    var head = DIMS.filter(function (x) { return x[0] === dimMode; })[0][1];
    if (!all) {
      box.innerHTML = '<p class="sm-none">' + (dimMode === "devices"
        ? "기기별 데이터를 아직 수집하지 않았습니다 — 다음 분석에서 함께 수집합니다."
        : "아직 수집된 데이터가 없습니다.") + "</p>";
      return;
    }
    if (!rows.length) {
      box.innerHTML = '<p class="sm-none">찾는 말과 맞는 줄이 없습니다.</p>';
      return;
    }
    // 노출 비중 막대 — 상위 몇 줄이 전부인지, 고르게 퍼졌는지가 숫자보다 빨리 보인다.
    var mxI = Math.max.apply(null, rows.map(function (r) { return r.impressions || 0; }).concat([1]));
    var t = '<table><thead><tr><th>' + head + "</th>" +
      COLS.map(function (c) {
        var on = c[0] === dimSort;
        return '<th class="num"><button data-s="' + c[0] + '"' +
          (on ? ' class="on' + (dimAsc ? " asc" : "") + '"' : "") +
          ' title="' + c[1] + ' 기준으로 정렬' + (on ? " — 다시 누르면 반대 순서" : "") +
          '">' + c[1] + "</button></th>";
      }).join("") + "</tr></thead><tbody>" +
      rows.map(function (r) {
        var k = r.key;
        if (dimMode === "pages") k = k.replace(/^https?:\/\/[^/]+/, "") || "/";
        if (dimMode === "devices") k = DEVICE[k] || k;
        return '<tr><td title="' + esc(r.key) + '"><span class="sm-k">' + esc(k) +
          '</span><span class="sm-share"><i style="width:' +
          ((r.impressions || 0) / mxI * 100).toFixed(1) + '%"></i></span>' +
          '</td><td class="num">' + nf(r.clicks) + '</td><td class="num">' +
          nf(r.impressions) + '</td><td class="num">' + pct(r.ctr) +
          '</td><td class="num">' + pos(r.position) + "</td></tr>";
      }).join("") + "</tbody></table>";
    box.innerHTML = rows.length >= 8 ? '<div class="tw">' + t + "</div>" : t;
  }

  // 지금 보이는 줄 그대로 표로 내보낸다. BOM 을 붙여야 엑셀이 한글을 안 깬다.
  function dimCsv() {
    var head = DIMS.filter(function (x) { return x[0] === dimMode; })[0][1];
    var rows = [[head, "클릭", "노출", "CTR", "게재순위"]].concat(
      dimRows().map(function (r) {
        return [r.key, r.clicks || 0, r.impressions || 0, pct(r.ctr), pos(r.position)];
      }));
    var csv = "\uFEFF" + rows.map(function (r) {
      return r.map(function (c) {
        return '"' + String(c).replace(/"/g, '""') + '"';
      }).join(",");
    }).join("\r\n");
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], {type: "text/csv;charset=utf-8"}));
    a.download = "seo-miner-" + dimMode + "-" + (PERF.snapshot || "") + ".csv";
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function dimRender() {
    var sec = document.getElementById("sm-dim");
    if (!sec || !PERF) return;
    // 실적 자체가 없으면 위 [검색 성과]가 이미 이유를 말한다 — 빈 표를 또 보이지 않는다.
    if (!PERF.totals) { sec.hidden = true; return; }
    sec.hidden = false;
    if (!sec.querySelector(".sm-dimt")) {
      sec.innerHTML = '<p class="eyebrow">BREAKDOWN</p><h2>무엇으로 들어오나</h2>' +
        '<p class="sub">열 이름을 누르면 그 기준으로 정렬되고, 같은 열을 다시 누르면 반대 ' +
        "순서가 됩니다. 노출은 많은데 CTR 이 낮은 줄이 제목·설명을 고칠 자리입니다. " +
        "노출 상위 25개까지 가져옵니다.</p>" +
        '<div class="tabs">' + DIMS.map(function (d) {
          return '<button data-d="' + d[0] + '">' + d[1] + "</button>";
        }).join("") + "</div>" +
        '<div class="tools"><input type="search" class="sm-dimq" ' +
        'placeholder="검색어·주소로 찾기" aria-label="분해 표에서 찾기">' +
        '<span class="n sm-dimn"></span><span class="sp"></span>' +
        '<button class="go sec sm-dimx" title="지금 보이는 줄 그대로 내려받습니다"' +
        ">CSV 내보내기</button></div>" +
        '<div class="sm-dimt"></div>';
      // 위임 한 번만 — 그릴 때마다 붙이면 핸들러가 쌓여 한 번 누른 게 여러 번 돈다.
      sec.addEventListener("click", function (ev) {
        if (ev.target.classList.contains("sm-dimx")) return dimCsv();
        var t = ev.target.closest ? ev.target.closest("[data-d],[data-s]") : null;
        if (!t) return;
        if (t.dataset.d) { dimMode = t.dataset.d; dimSort = "clicks"; dimAsc = false; }
        else if (t.dataset.s === dimSort) dimAsc = !dimAsc;
        else {
          dimSort = t.dataset.s;
          dimAsc = !!(COLS.filter(function (c) { return c[0] === dimSort; })[0] || [])[2];
        }
        dimTable();
      });
      sec.addEventListener("input", function (ev) {
        if (!ev.target.classList.contains("sm-dimq")) return;
        dimQ = ev.target.value;
        dimTable();
      });
    }
    dimTable();
  }

  // 껍데기는 동기로 만들어 둔다 — place() 가 화면에 배치할 때 이미 있어야 한다.
  // 채워지기 전까지는 감춰 둔다: 빈 상자 둘이 개요 밑에 떠 있으면 고장으로 보인다.
  step("성과 상자", function perfShell() {
    var host = document.querySelector("main");
    if (!host) return;
    ["sm-perf", "sm-dim"].forEach(function (id) {
      if (document.getElementById(id)) return;
      var sec = document.createElement("section");
      sec.id = id;
      sec.hidden = true;
      host.appendChild(sec);
    });
  });

  async function perfLoad() {
    var pj = proj();
    if (!pj) return;
    try {
      PERF = await (await fetch("/api/perf?project=" + encodeURIComponent(pj))).json();
    } catch (e) { return; }
    kpi(); perfRender(); dimRender();
  }
  if (sel) sel.addEventListener("change", function () { PERF = null; perfLoad(); });
  perfLoad();

  step("화면 배치", function () { place(); show(view); });

  // 기회 목록이 다시 그려질 때마다 버튼을 심는다. 기회 id 는 카드의 data-opp 에
  // 있다 — 예전에는 트리아지 버튼의 인라인 onclick 문자열을 정규식으로 뜯어 꺼냈다.
  var wire = function () {
    document.querySelectorAll(".opp[data-opp] .acts").forEach(function (box) {
      if (box.querySelector("[data-write]")) return;
      var w = document.createElement("button");
      w.setAttribute("data-write", box.closest(".opp").dataset.opp);
      w.textContent = "콘텐츠 작성";
      box.appendChild(w);
    });
  };
  // 화면은 비동기로 여러 번 다시 그려진다(사이트 전환·필터·분석 완료) — 그래서 이
  // 손질들은 전부 idempotent 하고, 아래 MutationObserver 가 매번 다시 부른다.
  // restage/wire/wireSteps 는 이제 id 로 찾으므로 문구가 바뀌어도 안 멈춘다.
  // retitle/resentence/reempty 는 아직 남는다 — 원본 화면 열넷의 제목·설명·빈 상태
  // 문구에는 붙일 id 가 없고, 그 파일들은 이 애드온이 손댈 수 있는 범위 밖이다.
  var all = function () {
    step("화면 손질", function () {
      wire(); wireSteps(); restage(); retitle(); resentence(); reempty(); kpi();
    });
    // 백링크는 사이트 이름이 정해진 뒤에야 부를 수 있다. 처음 한 번은 목록이 아직
    // 안 채워져 그냥 빠져나가므로(BL_DONE 이 막아 준다) 여기서 다시 시도한다 —
    // 안 그러면 사이트를 바꿀 때까지 화면이 비어 있다.
    step("백링크", backlinks);
  };
  new MutationObserver(all).observe(document.body, {childList: true, subtree: true});
  all();
})();
</script>
