
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* 본문 서체는 원본이 Pretendard 로 간다 — 여기서 덮지 않는다. 등폭만 갈아끼운다:
     원본의 Cascadia/Consolas 는 윈도우 기준이라 다른 OS 에서 폴백이 제각각이다. */
  :root{
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,monospace;
  }
  /* 원본 셸(dashboard.html)이 레일·화면 전환·괘선 체계를 다 갖는다. 여기서는
     호스팅에만 있는 것만 칠한다 — 예전에는 이 애드온이 body 격자부터 카드까지
     원본을 !important 로 덮어써서, 같은 조립본이 배포마다 다른 몸으로 섰다. */

  /* 로컬 설정(부품 설치·API 키·구글 클라이언트)은 호스팅에서 유저 몫이 아니다.
     지우지 않고 감춘다 — 원본 스크립트가 이 칸들에 이벤트를 이미 걸어 뒀다. */
  #setup { display:none; }
  #nx code{display:none}             /* 배너의 명령어 — 웹에는 칠 곳이 없다 */

  /* 초기화 한 곳이 터졌을 때의 알림. 조용히 넘어가지 않되, 화면을 죽이지도 않는다. */
  #sm-fail{border-left:2px solid var(--copper);padding:12px 0 12px 16px;
    margin:0 0 18px;color:var(--copper);font:400 13px/1.6 var(--sans)}
  #sm-fail p{margin:0}

  /* 레일 바닥 통 — 이동(메뉴)이 아니라 실행이다. 원본 .rail-foot 안에 들어간다. */
  #sm-run{font:500 13px/1 var(--sans);cursor:pointer;border:1px solid var(--patina);
    background:var(--patina);color:var(--stone);border-radius:4px;padding:9px 14px}
  #sm-run:hover:not(:disabled){filter:brightness(1.12)}
  #sm-run:disabled{opacity:.5;cursor:default}
  .rail-foot .cmd{font:400 12.5px/1 var(--sans);color:var(--on-ink-dim);
    cursor:pointer;text-decoration:none;border:0;background:none;padding:2px 0}
  .rail-foot .cmd:hover{opacity:1}
  .rail-foot .cmd::after{content:none}   /* 원본 .cmd 는 복사 칩이라 아이콘을 달고 있다 */
  @media (min-width:1000px){
    .rail-foot{flex-direction:column;align-items:stretch}
    #sm-run{width:100%}
  }

  /* 화면 제목 옆 실행 버튼 — 그 화면을 채우는 단계를 거기서 돌린다. */
  .sm-refresh{font:500 12.5px/1 var(--sans);color:var(--patina);background:transparent;
    border:1px solid var(--rule);border-radius:4px;padding:8px 13px;cursor:pointer;flex:none}
  .sm-refresh:hover:not(:disabled){border-color:var(--patina);background:var(--wash)}
  .sm-refresh:disabled{opacity:.5;cursor:default}
  .sm-refresh:focus-visible{outline:2px solid var(--patina);outline-offset:2px}

  /* 분석 진행 배너 — 빈 화면의 이유를 맨 위에서 알린다. */
  #sm-wait{margin:0 0 16px;padding:13px 0 13px 16px;border-left:2px solid var(--patina);
    background:var(--wash);color:var(--ink);font-size:13.5px;line-height:1.6}
  #sm-wait::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;
    background:var(--patina);margin-right:9px;vertical-align:middle}
  @media (prefers-reduced-motion:no-preference){
    #sm-wait::before{animation:sm-pulse 1.6s ease-in-out infinite}
    @keyframes sm-pulse{0%,100%{opacity:1}50%{opacity:.25}}
  }

  /* 검색 성과 — 서치콘솔 4대 지표를 같은 크기로 나란히 둔다.
     축이 서로 달라 한 그림에 겹치지 않는다(게재순위는 방향까지 반대다). */
  .sm-charts{display:grid;grid-template-columns:repeat(2,1fr);gap:44px;margin-top:4px}
  @media(max-width:760px){.sm-charts{grid-template-columns:1fr}}
  .sm-ct{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
    font:500 12.5px/1 var(--sans);color:var(--ink);margin-bottom:10px}
  /* 제목 옆 현재 값 — 선은 모양만 말한다. 지금 얼마인지는 숫자로 붙인다. */
  .sm-ct .nowv{font:500 14px/1 var(--mono);font-variant-numeric:tabular-nums;
    color:var(--ink);white-space:nowrap}
  .sm-ct .nowv .d{font-size:11px;margin-left:5px}
  /* 세로축 값은 그림 오른쪽 위·아래에 얹는다 — preserveAspectRatio:none 이라
     SVG 안에 글자를 두면 늘어난다. */
  .sm-plot{position:relative}
  .sm-gl{position:absolute;right:0;font:400 10.5px/1 var(--mono);color:var(--slate);
    background:var(--stone);padding:1px 0 1px 7px;pointer-events:none}
  .sm-gl.t{top:-4px} .sm-gl.b{bottom:-4px}
  .sm-line{display:block;width:100%;height:76px;overflow:visible}
  .sm-line path{fill:none;stroke:var(--patina);stroke-width:1.2;
    vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
  .sm-line circle{fill:var(--patina);vector-effect:non-scaling-stroke}
  .sm-line line.g{stroke:var(--rule-soft);stroke-width:1;stroke-dasharray:2 4;
    vector-effect:non-scaling-stroke}
  .sm-line rect{fill:transparent}
  .sm-line rect:hover{fill:var(--wash)}
  .sm-ax{display:flex;justify-content:space-between;font:400 10.5px/1 var(--mono);
    color:var(--slate);margin-top:6px;opacity:.75}
  .sm-none{font-size:13px;color:var(--slate);margin:10px 0 2px}

  /* 분해 표 — 긴 URL 이 표 폭을 밀지 않게 첫 칸만 줄인다 */
  #sm-dim .tabs{display:flex;gap:6px;margin:2px 0 12px}
  #sm-dim .tabs button{font:400 12px/1 var(--sans);color:var(--slate);background:transparent;
    border:1px solid var(--rule);border-radius:4px;padding:6px 12px;cursor:pointer}
  #sm-dim .tabs button.on{color:var(--patina);border-color:var(--patina);background:var(--wash)}
  #sm-dim table{table-layout:fixed;width:100%}
  #sm-dim th:first-child,#sm-dim td:first-child{width:46%}
  #sm-dim .sm-k{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #sm-dim th button{font:inherit;color:inherit;background:none;border:0;padding:0;
    cursor:pointer;letter-spacing:inherit;text-transform:inherit}
  #sm-dim th button:hover{color:var(--ink)}
  #sm-dim th button.on{color:var(--patina)}
  #sm-dim th button.on::after{content:" ↓"}
  #sm-dim th button.on.asc::after{content:" ↑"}
  /* 노출 비중 막대 — 상위 몇 줄이 전부인지가 숫자보다 빨리 보인다. */
  #sm-dim .sm-share{display:block;height:2px;background:var(--bar);border-radius:2px;
    margin-top:6px;max-width:260px}
  #sm-dim .sm-share i{display:block;height:100%;border-radius:2px;background:var(--patina);
    opacity:.55}
  #sm-dim .tools{margin-bottom:10px}

  /* 키워드 선별 — 자동은 서치콘솔 노출만 켠다. 나머지는 사람이 골라야 한다. */
  #sm-kw .sub{color:var(--slate);font-size:13px;margin:4px 0 14px}
  #sm-kw .tabs{display:flex;gap:6px;margin-bottom:10px}
  #sm-kw .tabs button{font:400 12px/1 var(--mono);color:var(--slate);background:transparent;
    border:1px solid var(--rule);border-radius:6px;padding:6px 12px;cursor:pointer}
  #sm-kw .tabs button.on{color:var(--patina);border-color:var(--patina);background:var(--wash)}
  #sm-kw .list{max-height:340px;overflow:auto;border:1px solid var(--rule-soft);
    border-radius:6px;overflow-x:hidden}
  /* flex 로 두면 자식이 넘칠 때 .kw 의 flex-basis:0 이 0px 으로 굳어 글자가 사라진다.
     grid 의 1fr 은 넘쳐도 자기 몫을 지킨다. */
  #sm-kw label{display:grid;grid-template-columns:auto minmax(0,1fr) auto;
    align-items:center;gap:10px;padding:7px 12px;cursor:pointer;
    border-bottom:1px solid var(--rule-soft);font-size:13.5px}
  #sm-kw label:hover{background:var(--bar)}
  #sm-kw label input{accent-color:var(--patina);flex:none;margin:0}
  /* 원본 어딘가의 text-transform 이 상속돼 검색어가 전부 대문자로 보였다.
     검색어는 사용자가 실제로 친 문자열이라 그대로 보여야 한다. */
  #sm-kw .kw{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    color:var(--ink);text-transform:none}
  #sm-kw .n{font:400 11.5px/1 var(--mono);color:var(--slate);white-space:nowrap}
  #sm-kw .bar2{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
  #sm-kw .go2{font:500 13px/1 var(--sans);color:var(--stone);background:var(--patina);
    border:0;border-radius:6px;padding:9px 16px;cursor:pointer}
  #sm-kw .go2:disabled{opacity:.4;cursor:default}
  #sm-kw .cnt{font-size:12.5px;color:var(--slate)}
  #sm-kw .warn{color:var(--copper)}

  /* AI 질문 관리 — 만들어 놓고 볼 데가 없었다. 목록이 곧 편집기다. */
  #sm-aiq .sub{color:var(--slate);font-size:13px;margin:4px 0 14px}
  #sm-aiq .list{max-height:420px;overflow:auto;border:1px solid var(--rule-soft);
    border-radius:6px}
  #sm-aiq .q{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;
    align-items:center;gap:10px;padding:7px 12px;
    border-bottom:1px solid var(--rule-soft)}
  #sm-aiq .q:last-child{border-bottom:0}
  #sm-aiq .q input[type=checkbox]{accent-color:var(--patina);margin:0}
  /* 꺼진 질문은 목록에 남지만 이번 확인에는 안 나간다 — 그 사실이 보여야 한다. */
  #sm-aiq .q.off .t,#sm-aiq .q.off .n{opacity:.45}
  #sm-aiq .t{min-width:0;font:400 13.5px/1.5 var(--sans);color:var(--ink);
    background:transparent;border:1px solid transparent;border-radius:4px;
    padding:4px 6px;text-transform:none}
  #sm-aiq .t:hover{border-color:var(--rule-soft)}
  #sm-aiq .t:focus{outline:0;border-color:var(--patina);background:var(--wash)}
  #sm-aiq select{font:400 11.5px/1 var(--mono);color:var(--slate);
    background:transparent;border:1px solid var(--rule);border-radius:6px;
    padding:5px 6px}
  #sm-aiq .n{font:400 11.5px/1 var(--mono);color:var(--slate);white-space:nowrap}
  #sm-aiq .del{font:400 15px/1 var(--mono);color:var(--slate);background:transparent;
    border:0;padding:2px 6px;cursor:pointer}
  #sm-aiq .del:hover{color:var(--copper)}
  #sm-aiq .bar2{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
  #sm-aiq .new{flex:1 1 260px;font:400 13.5px/1 var(--sans);color:var(--ink);
    background:transparent;border:1px solid var(--rule);border-radius:6px;padding:9px 10px}
  #sm-aiq .go2{font:500 13px/1 var(--sans);color:var(--stone);background:var(--patina);
    border:0;border-radius:6px;padding:9px 16px;cursor:pointer}
  #sm-aiq .go2.ghost{color:var(--slate);background:transparent;border:1px solid var(--rule)}
  #sm-aiq .go2:disabled{opacity:.4;cursor:default}
  #sm-aiq .cnt{font-size:12.5px;color:var(--slate)}
  #sm-aiq .warn{color:var(--copper)}

  /* 플러그인으로 넘기는 일 — 조용한 목록. 화면의 결론이 아니라 각주다. */
  #sm-cc .sub{color:var(--slate);font-size:13px;margin:4px 0 16px}
  #sm-cc ul{list-style:none;padding:0;margin:0;border-top:1px solid var(--rule-soft)}
  #sm-cc li{display:flex;align-items:center;gap:18px;padding:12px 0;
    border-bottom:1px solid var(--rule-soft)}
  #sm-cc li div{flex:1;min-width:0}
  #sm-cc li b{display:block;font-weight:600;font-size:14px}
  #sm-cc li span{color:var(--slate);font-size:12.5px}
  #sm-cc button{font:400 12px/1 var(--mono);color:var(--slate);background:transparent;
    border:1px solid var(--rule);border-radius:6px;padding:6px 10px;cursor:pointer;flex:none}
  #sm-cc button:hover{color:var(--patina);border-color:var(--patina)}
  @media(max-width:640px){#sm-cc li{flex-direction:column;align-items:flex-start;gap:8px}}

  /* 설정 — 고르면 곧바로 저장한다. 저장 버튼이 따로 없으니 결과는 옆에서 말해 준다. */
  #sm-set .sub{color:var(--slate);font-size:13px;margin:4px 0 14px}
  #sm-set .opts{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  #sm-set .opts button{font:400 12px/1 var(--mono);color:var(--slate);background:transparent;
    border:1px solid var(--rule);border-radius:6px;padding:7px 13px;cursor:pointer}
  #sm-set .opts button.on{color:var(--patina);border-color:var(--patina);background:var(--wash)}
  /* 여기 들어가는 건 한글 상태어·안내다 — 등폭으로 찍으면 폴백 서체로 떨어져
     자간이 벌어지고 획이 얇아진다(CLAUDE.md). 등폭은 숫자·명령·URL 에만. */
  #sm-set .msg{font:400 11.5px/1.5 var(--sans);color:var(--slate);margin-left:6px}
  #sm-set h2+h2,#sm-set .repo{margin-top:26px}
  #sm-set .repo select{font:400 12.5px/1 var(--sans);color:var(--ink);background:var(--card);
    border:1px solid var(--rule);border-radius:6px;padding:8px 10px;max-width:340px}
  #sm-set .repo input{font:400 12.5px/1 var(--mono);color:var(--ink);background:var(--card);
    border:1px solid var(--rule);border-radius:6px;padding:8px 10px;width:130px}
  #sm-set .repo .now{font:500 13px/1.5 var(--mono);color:var(--patina)}
  #sm-set .repo .none{font:400 13px/1.5 var(--sans);color:var(--slate)}
  #sm-set .repo a{color:var(--patina)}
  /* 저장소가 없으면 [콘텐츠 작성]은 못 쓴다 — 눌러 보게 하지 않고 그 자리에서 말한다 */
  .opp [data-write][data-need]{color:var(--slate);border-color:var(--rule)}

  /* 모바일: 차트 SVG 는 720px 고정이고 부모(.logwrap)가 overflow-x:auto 로 받는다.
     스크롤이 된다는 걸 알려주지 않으면 잘린 그림으로만 보인다. */
  @media(max-width:900px){
    .logwrap{position:relative;-webkit-overflow-scrolling:touch;
      /* 오른쪽 끝에 페이드 — 끝나지 않았다는 신호 */
      -webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);
      mask-image:linear-gradient(90deg,#000 88%,transparent)}
    .logwrap.at-end{-webkit-mask-image:none;mask-image:none}
    .sm-swipe{font:400 11px/1 var(--mono);color:var(--slate);margin:6px 0 0;
      display:flex;align-items:center;gap:6px}
  }
  @media(min-width:901px){.sm-swipe{display:none}}

  /* 안내 단계의 실행 버튼 — 원본 .cmd 는 명령어를 복사하는 칩이었다. */
  .stp .cmd{font:inherit;font-size:13px;cursor:pointer;border:1px solid var(--patina);
    background:transparent;color:var(--patina);border-radius:6px;padding:5px 12px}
  .stp .cmd:hover:not(:disabled){background:var(--wash)}
  .stp .cmd:disabled{opacity:.5;cursor:default}
  .stp .cmd::after{content:none}

  /* 기회 카드: 버튼 넷이 카드마다 반복돼 소음이 된다. 평소엔 물러나 있게. */
  .opp .acts button{opacity:.72;transition:opacity .12s}
  .opp:hover .acts button,.opp .acts button:focus-visible{opacity:1}
  .opp [data-write]{color:var(--copper);border-color:var(--copper)}
</style>
<script>
(function () {
  // 이 조각은 호스팅 대시보드에만 얹힌다(server/app.py 의 /d). 그 배포에서는 유료 키를
  // 서버가 대므로 doctor 의 준비물 명부에서도 owner 가 server 로 뒤집혀 있다
  // (SEOMINER_HOSTED). 원본 뷰가 "키를 발급하세요"라고 말하면 안 되는 자리를 이 표식
  // 하나로 판단한다 — 렌더된 한국어를 정규식으로 되짚지 않는다.
  // 정본은 서버다 — /d 가 첫 <script> 앞에 세운다(app.py). 여기서 세우면 늦어서,
  // 원본의 첫 렌더가 이미 지나간 뒤가 된다. 이 줄은 애드온만 따로 얹는 경로(미리보기·
  // 검사)를 위한 보험이고, 서버가 이미 세웠으면 같은 값을 다시 쓰는 것뿐이다.
  window.SM_HOSTED = true;

  // 초기화 한 곳이 터져도 나머지는 돈다. 조용히 넘어가지도 않는다 — 콘솔에 원인을
  // 남기고 화면 맨 위에 배너를 세운다. 예전에는 여기서 throw 해서 아래
  // addEventListener 가 하나도 안 걸렸다: 사이드바도, 사이트 전환도, 실행 버튼도
  // 같이 죽었다. 어긋남을 '알리는 것'과 화면을 '못 쓰게 만드는 것'은 다르다.
  var FAILED = {};
  function fail(what, e) {
    if (FAILED[what]) return;      // MutationObserver 가 다시 부른다 — 한 번만 알린다
    FAILED[what] = 1;
    console.error("[seo-miner] " + what, e);
    var host = document.querySelector("main") || document.body;
    if (!host) return;
    var box = document.getElementById("sm-fail");
    if (!box) {
      box = document.createElement("div");
      box.id = "sm-fail";
      host.insertBefore(box, host.firstChild);
    }
    var line = document.createElement("p");
    line.textContent = what + " — " + ((e && e.message) || e);
    box.appendChild(line);
  }
  function step(what, fn) { try { fn(); } catch (e) { fail(what, e); } }

  var b = document.createElement("button");
  b.id = "sm-run"; b.textContent = "전체 분석 실행";

  function proj() {
    var p = document.getElementById("proj");
    return p ? p.value : "";
  }
  // 분석은 워커가 백그라운드로 돈다. 끝난 걸 화면이 모르면 유저는 빈 대시보드를
  // 보고 있다가 직접 새로고침해야 한다 — 첫 분석이면 그게 이탈 지점이다.
  var ran = null;
  function paint(st) {
    var r = st && st[proj()];
    if (!r) return;
    b.disabled = !!r.running;
    b.textContent = !r.running ? "전체 분석 실행"
      : (typeof r.pct === "number" ? "분석 중 " + r.pct + "%" : "분석 중…");
    waiting(r);
    if (ran && !r.running) { load(); loadDoctor(); perfLoad(); }   // 끝나면 스스로 채워진다
    ran = r.running;
  }

  // 도는 동안 화면은 빈 상태 문구로 뒤덮인다 — "실행하세요"라고 잘못 안내한다.
  // 문구만 세우면 "얼마나 남았나"에 답을 못 한다. 워커가 단계마다 찍어 주는
  // 진행률(sites.stage_pct)을 그대로 보여 준다 — 8분의 1씩 뛰지만 지어낸 값이 아니다.
  function waiting(r) {
    var el = document.getElementById("sm-wait"), main = document.querySelector("main");
    if (!r.running) { if (el) el.remove(); return; }
    if (!main) return;
    if (!el) {
      el = document.createElement("p");
      el.id = "sm-wait";
      main.insertBefore(el, main.firstChild);
    }
    var s = (STAGE || {})[r.stage], now = (s && s.t) || r.stage;   // 폴링이 STAGE 보다 빠를 수 있다
    var head = typeof r.pct === "number"
      ? r.pct + "% 진행" + (now ? " — 지금 " + now : "")
      : (r.last_run_at ? "다시 분석하는 중입니다" : "첫 분석이 진행 중입니다");
    var tail = r.last_run_at
      ? " · 끝나면 이 화면이 자동으로 갱신됩니다."
      : " · 검색 실적부터 개선 기회까지 순서대로 수집합니다. 몇 분 걸리고, " +
        "끝나면 이 화면이 자동으로 갱신됩니다.";
    put(el, head + tail);
  }
  async function poll() {
    try { paint(await (await fetch("/api/run/status")).json()); } catch (e) {}
  }
  b.addEventListener("click", async function () {
    if (!proj()) return;
    b.disabled = true; b.textContent = "시작하는 중…";
    try {
      await fetch("/api/run", {method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({project: proj()})});
    } catch (e) {}
    poll();
  });
  var sel = document.getElementById("proj");
  if (sel) sel.addEventListener("change", poll);
  poll();
  setInterval(poll, 8000);    // 끝나면 버튼이 풀리고 화면이 스스로 채워진다

  // 기회 카드마다 '글 쓰기' — /create run 의 자리다. 리포가 안 붙어 있으면 서버가
  // 428 로 알려 주고, 그때 연결 링크를 보여 준다.
  //
  // **버튼 자신에 건다. document 위임으로 잡으면 안 된다** — 원본은 기회 카드의
  // .acts 에서 event.stopPropagation() 을 한다(카드가 같이 펼쳐지지 않게).
  // 그래서 위임 리스너에는 이 클릭이 영영 안 닿았고, 버튼은 떠 있는데 눌러도
  // 아무 일이 없었다. 원본 주석이 이미 답을 갖고 있다: "버튼 자신의 onclick 은
  // 이미 실행된 뒤다". wire() 가 이 함수를 w.onclick 에 건다(재할당이라 중복 없음).
  async function writeClick(b) {
    var id = b.getAttribute("data-write");
    if (b.hasAttribute("data-need")) {     // 못 쓰는 걸 아는데 서버까지 갈 이유가 없다
      show("settings");
      var sec = document.getElementById("sm-set");
      if (sec) sec.scrollIntoView({block: "start"});
      return;
    }
    b.disabled = true; b.textContent = "작성 중…";
    try {
      var r = await fetch("/api/create", {method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({project: proj(), opportunity_id: Number(id)})});
      var d = await r.json();
      if (r.ok && d.pr) { b.outerHTML = '<a href="' + d.pr + '" target="_blank" rel="noopener">PR 확인하기 →</a>'; return; }
      if (r.status === 428) {            // SET_H 가 낡았다 — 설정을 다시 읽고 그 자리로
        SET_DONE = ""; REPO_LIST = null; await setLoad(); wire();
        show("settings");
        return;
      }
      b.textContent = (d.detail || "작성하지 못했습니다").slice(0, 60); b.disabled = false;
    } catch (e) { b.textContent = "서버에 연결하지 못했습니다"; b.disabled = false; }
  }

  document.title = "SEO 대시보드 — seo-miner";   // 원본 <title> 은 애드온보다 앞에 있다

  // ── 단계 용어 한 벌 ─────────────────────────────────────────
  // 정본은 stage.STAGE_LABELS(파이썬)다 — 조립(dashboard.py._assemble)이
  // window.__STAGES__ 로 실어 보낸다. 여기서 사본을 만들지 않는다: 예전엔 여기와
  // stage.py 에 각자 있었고, 문구가 이미 갈라져 있었다(gsc.t: "검색 실적 수집" vs
  // "구글 실적 읽기" 등). 키는 단계 id 라 화면 글자를 되짚지 않는다.
  var STAGE = window.__STAGES__ || {};

  // [기록] 화면의 실행 종류 라벨도 이 표를 본다(runs.kind 는 단계 id 와 같은 말이다).
  window.SM_STAGE = STAGE;

  // 안내 단계의 이름·설명을 id 로 다시 붙인다. 모르는 id 는 손대지 않는다 —
  // stage.py 가 단계를 늘려도 payload 글자가 그대로 나오지, 빈 칸이 되지 않는다.
  // 같은 글자면 안 쓴다: 아래 MutationObserver 가 이 함수를 다시 부르므로,
  // 값이 같아도 textContent 를 넣으면 노드가 갈리며 무한히 서로를 깨운다.
  function put(el, s) { if (el && s && el.textContent !== s) el.textContent = s; }

  function restage(root) {
    (root || document).querySelectorAll("[data-stage]").forEach(function (el) {
      var g = STAGE[el.dataset.stage];
      if (!g) return;
      if (el.tagName === "B") return put(el, g.t);     // 배너·완주 줄의 단계 이름
      put(el.querySelector(".t"), g.t);
      put(el.querySelector(".gain"), g.gain);
    });
  }

  async function runStage(stage, btn) {
    var was = btn.textContent;
    btn.disabled = true; btn.textContent = "실행 중…";
    try {
      var r = await fetch("/api/run", {method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({project: proj(), stages: stage})});
      if (!r.ok) { var d = await r.json(); btn.textContent = (d.detail || "실행하지 못했습니다").slice(0, 44); }
      else { btn.textContent = "실행 시작"; }
    } catch (e) { btn.textContent = "서버에 연결하지 못했습니다"; }
    poll();
    setTimeout(function () { btn.disabled = false; btn.textContent = was; }, 4000);
  }

  // [질문 만들기] — 웹에는 `/capture add` 를 칠 채팅이 없다. 이 버튼이 그 자리다.
  // 만들기만 하고 인용 확인(유료)은 사용자가 따로 눌러야 한다.
  async function makePrompts(btn) {
    var was = btn.textContent;
    btn.disabled = true; btn.textContent = "질문 만드는 중…";
    try {
      var r = await fetch("/api/ai/prompts", {method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({project: proj(), limit: 20})});
      var d = await r.json();
      if (!r.ok) { btn.textContent = (d.detail || "만들지 못했습니다").slice(0, 60); }
      else {
        btn.textContent = "질문 " + d.added + "개 완성 — 아래 목록에서 확인하세요";
        load(); loadDoctor(); aiqLoad();
        return;                                   // 화면이 다시 그려지며 이 버튼은 사라진다
      }
    } catch (e) { btn.textContent = "서버에 연결하지 못했습니다"; }
    setTimeout(function () { btn.disabled = false; btn.textContent = was; }, 6000);
  }

  // 화면이 자기 마크업에 심어 둔 동작을 잇는다 — 렌더된 글자를 되짚지 않는다.
  function wireActs() {
    document.querySelectorAll('[data-sm-act="make-prompts"]').forEach(function (b) {
      if (b.dataset.smWired) return;
      b.dataset.smWired = "1";
      b.onclick = function () { makePrompts(b); };
    });
  }

  // 안내의 '이 명령을 치세요' 칩을 실제 실행 버튼으로 바꾼다. 원본은 명령어를
  // 클립보드로 복사할 뿐이라, 터미널이 없는 웹에서는 막다른 길이었다.
  // 어느 단계인지는 버튼의 data-stage 가 말한다 — 예전에는 버튼 라벨(명령어 문자열)에
  // 정규식을 걸어 되짚었다.
  function wireSteps() {
    document.querySelectorAll("button.cmd").forEach(function (b) {
      if (b.dataset.smWired) return;
      b.dataset.smWired = "1";
      var st = b.dataset.stage || "";
      // data-stage 는 "이 칩이 속한 단계"일 뿐이다 — 그 칩의 명령이 그 단계를 돈다는
      // 뜻이 아니다. 질문이 0건이면 ai 단계의 명령이 `/capture add` 로 내려오고,
      // GSC 미연결이면 gsc 단계의 명령이 `GSC 로그인해줘` 다. 그 판정은 payload 를
      // 쥔 renderGuide 가 data-runnable 로 내려보낸다.
      if (b.dataset.runnable === "1" && STAGE[st] && STAGE[st].run) {
        b.textContent = STAGE[st].t + " 실행";
        b.onclick = function () { runStage(st, b); };
        return;
      }
      if (st === "create") {              // 기회는 아래 목록에 이미 있다
        b.textContent = "개선 기회 보기";
        b.onclick = function () {
          var o = document.getElementById("opps") || document.querySelector(".opp");
          if (o) o.scrollIntoView({behavior: "smooth", block: "start"});
        };
        return;
      }
      // 남는 건 웹에서 실행할 수 없는 칩이다 — 빈 상태 안의 명령 복사칩(사이트
      // 등록·구글 연동)과, 단계는 알지만 그 명령이 다른 일을 하는 칩(`/capture add`,
      // `GSC 로그인해줘`). 웹에는 명령을 칠 곳이 없고, 그 안내는 화면·배너가
      // 따로 한다.
      b.remove();
    });
  }

  // ── 호스팅이 덧붙이는 화면·섹션 ───────────────────────────────
  // 화면 목록의 정본은 뷰 파일의 view-def 다 — 조립(dashboard.py)이
  // window.__VIEWS__ 로 실어 보내고, 원본 셸(dashboard.html 의 SM)이 그걸로
  // 레일과 화면 상자를 만든다. 여기서 다시 나열하지 않는다.
  //
  // 호스팅 전용 섹션(성과·분해·키워드 관리·AI 질문·고급 분석·설정)의 정적 마크업도
  // 이제 여기서 안 짓는다 — templates/sections/*.html 의 section-def 로 선언하고,
  // dashboard.py._assemble("hosted") 가 조립 시점에 원본 뷰 순서 안에 끼운다.
  // 여기 남는 건 이미 서 있는 그 요소를 찾아 데이터를 채우고 이벤트를 붙이는
  // 것뿐이다(perfLoad·kwLoad·aiqLoad·handoff·setLoad 아래). 예전에는 이 파일이
  // createElement/innerHTML 로 섹션 자체를 짓고, HOST_SEC 라는 표로 어디에
  // 붙는지를 따로 말했다 — 그 표와 실제로 만드는 것이 어긋날 수 있었다(그리고
  // 사이드바·배치·전환까지 통째로 다시 구현해 !important 로 원본을 덮어써서, 같은
  // 조립본이 배포마다 다른 몸으로 섰다). 셸도 섹션도 원본 하나뿐이다.

  step("레일 바닥", function foot() {
    var box = document.querySelector(".rail-foot");
    if (!box || document.getElementById("sm-run")) return;
    box.prepend(b);                           // 위에서 만든 '전체 분석 실행'
    var rep = document.createElement("a");
    rep.className = "cmd"; rep.textContent = "보고서 다운로드 ↓";
    rep.addEventListener("click", function () {
      rep.href = "/api/report?project=" + encodeURIComponent(proj());
    });
    box.appendChild(rep);
  });

  // 화면 제목 옆 실행 버튼 — 그 화면을 채우는 단계를 거기서 돌린다.
  // 셸이 화면 상자를 (다시) 세울 때마다 부른다. 이미 붙어 있으면 아무것도 안 한다.
  function runButtons() {
    (window.SM ? SM.views : []).forEach(function (v) {
      var head = document.querySelector("#view-" + v.id + " .vh");
      if (!head) return;
      v.stages.forEach(function (st) {
        if (!STAGE[st] || head.querySelector('[data-run="' + st + '"]')) return;
        var rb = document.createElement("button");
        rb.className = "sm-refresh";
        rb.dataset.run = st;
        rb.textContent = STAGE[st].run;       // 화면 제목과 겹치지 않게 다르게 부른다
        rb.title = STAGE[st].t;
        rb.onclick = function () { runStage(st, rb); };
        head.appendChild(rb);
      });
    });
  }
  document.addEventListener("sm:views", function () { step("실행 버튼", runButtons); });

  // ── 설정 ─────────────────────────────────────────────────────
  // 사이트마다 다른 값이 사는 자리. 지금은 수집 주기 하나뿐이고, 항목이 늘면 여기 붙는다.
  // 프리셋 목록의 정본은 서버(app.RUN_PRESETS)다 — 화면은 받아서 그리기만 한다.
  var SET_DONE = "", SET_H = null;

  // 마크업은 이미 서 있다(templates/sections/sm-set.html) — 여기서는 이벤트만
  // 한 번 건다. 위임 한 번만: 다시 부르면 한 번 누른 게 여러 번 저장된다.
  step("설정 배선", function setShell() {
    var sec = document.getElementById("sm-set");
    if (!sec || sec.dataset.smWired) return;
    sec.dataset.smWired = "1";
    sec.addEventListener("click", function (ev) {
      var t = ev.target.closest ? ev.target.closest("[data-h]") : null;
      if (t) return setSave(Number(t.dataset.h));
      var tab = ev.target.closest ? ev.target.closest("[data-cfg-tab]") : null;
      if (tab) {
        CFG_TAB = tab.dataset.cfgTab;
        return cfgRender("");
      }
      if (ev.target.closest && ev.target.closest("[data-cfg-form-save]")) return cfgFormSave();
      if (ev.target.closest && ev.target.closest("[data-cfg-yaml-save]")) return cfgYamlSave();
      if (ev.target.closest && ev.target.closest("[data-repo-pick]")) return repoPick();
      if (ev.target.closest && ev.target.closest("[data-repo-save]")) return repoSave();
      if (ev.target.closest && ev.target.closest("[data-ga4-pick]")) return ga4Pick();
      if (ev.target.closest && ev.target.closest("[data-ga4-save]")) return ga4Save();
    });
    setRender("");     // 상자가 신호보다 늦게 생겼으면 이미 받아 둔 값으로 지금 그린다
  });

  function setRender(msg) {
    var sec = document.getElementById("sm-set");
    if (!sec || !SET_H) return;
    sec.querySelector(".opts").innerHTML = SET_H.presets.map(function (p) {
      return '<button data-h="' + p.h + '"' +
        (p.h === SET_H.run_every_hours ? ' class="on"' : "") + ">" + esc(p.label) +
        "</button>";
    }).join("") + '<span class="msg">' + esc(msg || "") + "</span>";
    cfgRender();
    repoRender();
    ga4Render();
  }

  // 사이트 설정 (브랜드 별칭, 씨앗 키워드, 타사 도구, YAML 편집)
  var CFG_DATA = null, CFG_TAB = "form";
  async function cfgLoad() {
    var pj = proj();
    if (!pj) return;
    try {
      var r = await fetch("/api/project/config?project=" + encodeURIComponent(pj));
      var d = await r.json();
      if (r.ok && d.ok) {
        CFG_DATA = d;
        cfgRender("");
      }
    } catch (e) {}
  }

  function cfgRender(msg) {
    var sec = document.getElementById("sm-set");
    if (!sec) return;
    var body = sec.querySelector(".repo.cfg .body");
    if (!body) return;
    if (!CFG_DATA) {
      body.innerHTML = '<p class="none">설정을 불러오는 중…</p>';
      return;
    }
    var cfg = CFG_DATA.config || {};
    var join = function (v) { return Array.isArray(v) ? v.join(", ") : (v || ""); };
    var note = msg ? '<span class="msg" style="margin-left:8px">' + esc(msg) + '</span>' : "";

    var tabs = '<div class="tabs" style="display:flex;gap:6px;margin:2px 0 12px">' +
      '<button data-cfg-tab="form"' + (CFG_TAB === "form" ? ' class="on"' : '') + '>간편 폼</button>' +
      '<button data-cfg-tab="yaml"' + (CFG_TAB === "yaml" ? ' class="on"' : '') + '>YAML 직접 편집</button>' +
      '</div>';

    if (CFG_TAB === "yaml") {
      body.innerHTML = tabs +
        '<p class="none" style="margin-bottom:8px">YAML 설정을 직접 수정합니다. 저장 시 Brain과 즉시 동기화됩니다.</p>' +
        '<textarea class="sm-cfg-yaml" style="width:100%;font-family:var(--mono);min-height:220px;font-size:13px;line-height:1.5;box-sizing:border-box;margin-bottom:10px">' +
        esc(CFG_DATA.yaml_raw || "") + '</textarea>' +
        '<div class="opts"><button data-cfg-yaml-save>YAML 저장</button>' + note + '</div>';
      return;
    }

    body.innerHTML = tabs +
      '<div class="grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:10px">' +
      '<div><label style="display:block;font-size:12px;margin-bottom:4px;color:var(--slate)">종류 (type)</label>' +
      '<select class="sm-cfg-type" style="width:100%">' +
      ['saas', 'game', 'local_clinic', 'directory'].map(function (t) {
        return '<option value="' + t + '"' + (cfg.type === t ? ' selected' : '') + '>' + t + '</option>';
      }).join("") + '</select></div>' +
      '<div><label style="display:block;font-size:12px;margin-bottom:4px;color:var(--slate)">도메인 (domain)</label>' +
      '<input class="sm-cfg-domain" style="width:100%" value="' + esc(cfg.domain || "") + '"></div>' +
      '<div><label style="display:block;font-size:12px;margin-bottom:4px;color:var(--slate)">언어-지역 (locale)</label>' +
      '<input class="sm-cfg-locale" style="width:100%" value="' + esc(cfg.locale || "ko-KR") + '"></div>' +
      '<div><label style="display:block;font-size:12px;margin-bottom:4px;color:var(--slate)">서치콘솔 속성 (gsc_property)</label>' +
      '<input class="sm-cfg-gsc" style="width:100%" value="' + esc(cfg.gsc_property || "") + '"></div>' +
      '<div style="grid-column:1/-1"><label style="display:block;font-size:12px;margin-bottom:4px;color:var(--slate)">브랜드 표기 (brand_aliases) — 쉼표로 여러 개</label>' +
      '<input class="sm-cfg-alias" style="width:100%" value="' + esc(join(cfg.brand_aliases)) + '"></div>' +
      '</div>' +
      '<label style="display:block;font-size:12px;margin-bottom:4px;color:var(--slate)">씨앗 키워드 (seed_keywords) — 쉼표나 줄바꿈</label>' +
      '<textarea class="sm-cfg-seeds" style="width:100%;min-height:60px;margin-bottom:10px;box-sizing:border-box">' + esc(join(cfg.seed_keywords)) + '</textarea>' +
      '<label style="display:block;font-size:12px;margin-bottom:4px;color:var(--slate)">경쟁사 도메인 (competitors_manual) — 쉼표</label>' +
      '<input class="sm-cfg-comp" style="width:100%;margin-bottom:10px;box-sizing:border-box" value="' + esc(join(cfg.competitors_manual)) + '">' +
      '<label style="display:block;font-size:12px;margin-bottom:4px;color:var(--slate)">등재·경쟁 도구 이름 (tools/foreign_brands) — 쉼표</label>' +
      '<input class="sm-cfg-tools" style="width:100%;margin-bottom:12px;box-sizing:border-box" value="' + esc(join(cfg.tools)) + '">' +
      '<div class="opts"><button data-cfg-form-save>설정 저장</button>' + note + '</div>';
  }

  async function cfgFormSave() {
    var sec = document.getElementById("sm-set");
    var pj = proj();
    if (!sec || !pj) return;
    cfgRender("저장 중…");
    var form = {
      project: pj,
      type: sec.querySelector(".sm-cfg-type") ? sec.querySelector(".sm-cfg-type").value : "saas",
      domain: sec.querySelector(".sm-cfg-domain") ? sec.querySelector(".sm-cfg-domain").value : "",
      locale: sec.querySelector(".sm-cfg-locale") ? sec.querySelector(".sm-cfg-locale").value : "ko-KR",
      gsc_property: sec.querySelector(".sm-cfg-gsc") ? sec.querySelector(".sm-cfg-gsc").value : "",
      brand_aliases: sec.querySelector(".sm-cfg-alias") ? sec.querySelector(".sm-cfg-alias").value : "",
      seed_keywords: sec.querySelector(".sm-cfg-seeds") ? sec.querySelector(".sm-cfg-seeds").value : "",
      competitors_manual: sec.querySelector(".sm-cfg-comp") ? sec.querySelector(".sm-cfg-comp").value : "",
      tools: sec.querySelector(".sm-cfg-tools") ? sec.querySelector(".sm-cfg-tools").value : ""
    };
    try {
      var r = await fetch("/api/project/config", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({project: pj, form: form})
      });
      var d = await r.json();
      if (!r.ok) throw new Error(d.detail || d.error || "");
      await cfgLoad();
      cfgRender("저장됨");
    } catch (e) {
      cfgRender("저장 실패: " + ((e && e.message) || "다시 시도해 주세요"));
    }
  }

  async function cfgYamlSave() {
    var sec = document.getElementById("sm-set");
    var pj = proj();
    if (!sec || !pj) return;
    var yaml_raw = sec.querySelector(".sm-cfg-yaml") ? sec.querySelector(".sm-cfg-yaml").value : "";
    cfgRender("저장 중…");
    try {
      var r = await fetch("/api/project/config", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({project: pj, yaml_raw: yaml_raw})
      });
      var d = await r.json();
      if (!r.ok) throw new Error(d.detail || d.error || "");
      await cfgLoad();
      cfgRender("저장됨");
    } catch (e) {
      cfgRender("저장 실패: " + ((e && e.message) || "다시 시도해 주세요"));
    }
  }

  // 저장소 칸. 세 상태뿐이다 — GitHub 계정이 없다 / 계정은 있고 저장소만 없다 /
  // 붙어 있다. 셋을 한 문장으로 뭉치면 "무엇을 먼저 하라"를 말할 수 없다.
  var REPO_LIST = null;
  function repoRender(msg) {
    var sec = document.getElementById("sm-set");
    if (!sec || !SET_H) return;
    var body = sec.querySelector(".repo .body");
    if (!body) return;
    var note = msg ? '<span class="msg">' + esc(msg) + "</span>" : "";
    if (!SET_H.github_enabled) {           // 이 배포 자체가 GitHub 연동을 안 갖고 있다
      body.innerHTML = '<p class="none">이 배포에는 GitHub 연동이 꺼져 있습니다 — ' +
        '기회는 그대로 보이니, 글은 손으로 옮겨 주세요.</p>' + note;
      return;
    }
    if (!SET_H.github_connected) {
      body.innerHTML = '<p class="none">GitHub 계정이 아직 연결되지 않았습니다 — ' +
        '<a href="/auth/github">GitHub 연결하기 →</a></p>' + note;
      return;
    }
    if (REPO_LIST) {                       // [바꾸기] 를 눌러 목록을 받아 온 상태
      body.innerHTML = '<div class="opts">' +
        "<select>" + REPO_LIST.map(function (r) {
          var n = r.full_name || r;
          return '<option' + (n === SET_H.repo ? " selected" : "") + ">" + esc(n) + "</option>";
        }).join("") + "</select>" +
        '<input value="' + esc(SET_H.repo_branch || "main") + '" aria-label="브랜치">' +
        '<button data-repo-save>저장</button></div>' + note;
      return;
    }
    body.innerHTML = '<div class="opts">' +
      (SET_H.repo ? '<span class="now">' + esc(SET_H.repo) + " · " +
                    esc(SET_H.repo_branch || "main") + "</span>"
                  : '<span class="none">아직 연결된 저장소가 없습니다</span>') +
      "<button data-repo-pick>" + (SET_H.repo ? "바꾸기" : "저장소 고르기") + "</button>" +
      "</div>" + note;
  }

  // 목록은 누를 때 받는다 — GitHub API 호출이라 화면을 열 때마다 부르지 않는다.
  async function repoPick() {
    repoRender("불러오는 중…");
    try {
      var r = await fetch("/api/repos");
      var d = await r.json();
      if (!r.ok) throw new Error(d.detail || "");
      REPO_LIST = d.repos || [];
      if (!REPO_LIST.length) return repoRender("이 계정에서 쓸 수 있는 저장소가 없습니다");
    } catch (e) {
      return repoRender("저장소 목록을 불러오지 못했습니다 — " + ((e && e.message) || "다시 시도해 주세요"));
    }
    repoRender("");
  }

  async function repoSave() {
    var sec = document.getElementById("sm-set");
    var repo = sec.querySelector(".repo select").value;
    var branch = sec.querySelector(".repo input").value.trim() || "main";
    try {
      var r = await fetch("/api/repo", {method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({project: proj(), repo: repo, branch: branch})});
      var d = await r.json();
      if (!r.ok) throw new Error(d.detail || "");
      SET_H.repo = repo; SET_H.repo_branch = branch;
      REPO_LIST = null;                    // 고른 것을 보여 주는 상태로 돌아간다
      repoRender("저장됨");
      wire();                              // [콘텐츠 작성] 이 이제 쓸 수 있게 된다
    } catch (e) {
      repoRender("저장하지 못했습니다 — " + ((e && e.message) || "다시 시도해 주세요"));
    }
  }

  // GA4 칸. GSC 와 달리 속성 ID(숫자)는 도메인에서 유추가 안 돼 목록에서 사람이
  // 고른다. suggest_property 의 제안은 select 에 미리 골라만 둔다 — 저장은 사람이
  // 눌러야 확정된다(엉뚱한 속성이 붙으면 그 뒤 모든 숫자가 조용히 거짓이 된다).
  var GA4_LIST = null, GA4_SUGGESTED = [], GA4_AUTH_ERR = "";
  function ga4Render(msg) {
    var sec = document.getElementById("sm-set");
    if (!sec || !SET_H) return;
    var body = sec.querySelector(".ga4 .body");
    if (!body) return;
    if (GA4_AUTH_ERR) {           // 스코프 부족 — 재로그인 손잡이를 준다
      body.innerHTML = '<p class="none">' + esc(GA4_AUTH_ERR) + "</p>" +
        '<a href="/auth/login">다시 로그인하기 →</a>';
      return;
    }
    var note = msg ? '<span class="msg">' + esc(msg) + "</span>" : "";
    if (GA4_LIST) {                       // [연결하기]/[바꾸기] 를 눌러 목록을 받아 온 상태
      body.innerHTML = '<div class="opts"><select>' + GA4_LIST.map(function (p) {
        var sel = p.id === (SET_H.ga4_property || GA4_SUGGESTED[0] || "");
        return '<option value="' + esc(p.id) + '"' + (sel ? " selected" : "") + ">" +
          esc(p.account) + " · " + esc(p.name) + " (" + esc(p.id) + ")</option>";
      }).join("") + '</select><button data-ga4-save>저장</button></div>' +
        (GA4_SUGGESTED.length ?
          '<p class="msg">이것 같습니다 — 도메인·이름이 비슷한 속성을 먼저 골라 뒀습니다. 확인 후 저장하세요.</p>' : "") +
        note;
      return;
    }
    if (SET_H.ga4_property) {
      body.innerHTML = '<div class="opts"><span class="now">속성 ' +
        esc(SET_H.ga4_property) + ' 연결됨</span>' +
        "<button data-ga4-pick>바꾸기</button></div>" + note;
      return;
    }
    body.innerHTML = '<div class="opts"><span class="none">아직 연결되지 않았습니다 — ' +
      '세션·매출 같은 클릭 다음 실적을 보려면 연결하세요.</span>' +
      "<button data-ga4-pick>GA4 속성 연결하기</button></div>" + note;
  }

  async function ga4Pick() {
    GA4_AUTH_ERR = "";
    ga4Render("불러오는 중…");
    var r, d;
    try {
      r = await fetch("/api/ga4/properties?project=" + encodeURIComponent(proj()));
      d = await r.json();
    } catch (e) {
      return ga4Render("서버에 연결하지 못했습니다 — 다시 시도해 주세요");
    }
    if (r.status === 403) {
      GA4_AUTH_ERR = d.detail || "GA4 접근 권한이 없습니다 — 재로그인이 필요합니다";
      return ga4Render();
    }
    if (!r.ok) return ga4Render("속성 목록을 불러오지 못했습니다 — " + (d.detail || "다시 시도해 주세요"));
    GA4_LIST = d.properties || [];
    GA4_SUGGESTED = d.suggested || [];
    if (!GA4_LIST.length) return ga4Render("이 계정에서 접근 가능한 GA4 속성이 없습니다");
    ga4Render("");
  }

  async function ga4Save() {
    var sec = document.getElementById("sm-set");
    var propId = sec.querySelector(".ga4 select").value;
    try {
      var r = await fetch("/api/ga4/property", {method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({project: proj(), property_id: propId})});
      var d = await r.json();
      if (!r.ok) throw new Error(d.detail || "");
      SET_H.ga4_property = d.ga4_property;
      GA4_LIST = null;
      ga4Render("저장됨");
    } catch (e) {
      ga4Render("저장하지 못했습니다 — " + ((e && e.message) || "다시 시도해 주세요"));
    }
  }

  async function setLoad() {
    var pj = proj();
    if (!pj || SET_DONE === pj) return;
    SET_DONE = pj;
    try {
      SET_H = await (await fetch("/api/settings?project=" +
        encodeURIComponent(pj))).json();
    } catch (e) { SET_DONE = ""; return; }   // 실패는 되돌려 다음 기회에 다시 받는다
    await cfgLoad();
    setRender("");
  }

  async function setSave(h) {
    var pj = proj();
    if (!pj) return;
    try {
      var r = await fetch("/api/settings", {method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({project: pj, run_every_hours: h})});
      var d = await r.json();
      if (!r.ok) throw new Error(d.detail || "");
      SET_H.run_every_hours = d.run_every_hours;
      setRender("저장됨");
    } catch (e) {
      setRender("저장하지 못했습니다 — " + ((e && e.message) || "다시 시도해 주세요"));
    }
  }
  // 갱신 계기는 "sm:site" 하나다 — 아래 한 자리에서 같이 받는다.

  // 좁은 화면에서 차트는 가로로 스크롤한다(원본 .logwrap 설계). 그 사실을 알린다 —
  // 모르면 잘린 그림으로만 보인다.
  function swipeHint() {
    document.querySelectorAll(".logwrap").forEach(function (w) {
      if (w.scrollWidth <= w.clientWidth + 2) return;      // 넘칠 때만
      if (!w.dataset.smHint) {
        w.dataset.smHint = "1";
        var p = document.createElement("p");
        p.className = "sm-swipe";
        p.textContent = "← 좌우로 스크롤하세요";
        w.parentNode.insertBefore(p, w.nextSibling);
        w.addEventListener("scroll", function () {
          var end = w.scrollLeft + w.clientWidth >= w.scrollWidth - 4;
          w.classList.toggle("at-end", end);
          p.style.visibility = end ? "hidden" : "";
        });
      }
    });
  }
  step("가로 스크롤 안내", swipeHint);
  window.addEventListener("resize", swipeHint);

  // ── 키워드 선별 ────────────────────────────────────────────
  // 자동 활성화는 '구글이 이미 노출시킨' 검색어만 켠다. 자동완성에서 캔 후보는
  // 관련성이 확인되지 않아 그대로 잠들어 있다 — 여기서 사람이 고른다.
  var kwMode = "candidate";

  async function kwLoad() {
    var box = document.getElementById("sm-kw");
    if (!box) return;
    var list = box.querySelector(".list");
    list.innerHTML = '<p style="padding:14px;color:var(--slate);font-size:13px">불러오는 중…</p>';
    var d;
    try {
      d = await (await fetch("/api/keywords?status=" + kwMode +
                             "&project=" + encodeURIComponent(proj()))).json();
    } catch (e) { list.innerHTML = '<p style="padding:14px;color:var(--slate);font-size:13px">키워드를 불러오지 못했습니다. 새로고침해 주세요.</p>'; return; }
    var ks = d.keywords || [];
    box.querySelector(".cnt").innerHTML = "추적 키워드 " + d.active_total + " / " + d.limit +
      (d.active_total >= d.limit ? ' <b class="warn">· 한도 도달</b>' : "");
    if (!ks.length) {
      list.innerHTML = '<p style="padding:14px;color:var(--slate);font-size:13px">' +
        (kwMode === "candidate" ? "발굴된 후보가 없습니다 — 위 [키워드 다시 발굴]을 누르면 채워집니다."
                                : "추적 중인 키워드가 없습니다 — 후보 탭에서 골라 여기로 옮기세요.") + "</p>";
      return;
    }
    // 오른쪽 한 줄이 "이걸 왜 켜야 하나"에 답해야 한다. 노출이 있으면 실측이 먼저고,
    // 없으면 월 검색량(collect_metrics)이 유일한 수요 신호다 — 그것도 없으면 출처만.
    // 난이도는 켤지 말지를 가르는 값이라 검색량 옆에 붙인다.
    var kwWhy = function (k) {
      if (k.imp) return "노출 " + nf(k.imp);
      if (k.volume != null) {
        return "검색량 " + nf(k.volume) +
               (k.difficulty == null ? "" : " · 난이도 " + Math.round(k.difficulty));
      }
      return esc(k.source || "");
    };
    list.innerHTML = ks.map(function (k) {
      return '<label><input type="checkbox" value="' + k.id + '">' +
             '<span class="kw">' + esc(k.keyword) + "</span>" +
             '<span class="n">' + kwWhy(k) + "</span></label>";
    }).join("");
  }

  async function kwApply(on) {
    var box = document.getElementById("sm-kw");
    var ids = [...box.querySelectorAll(".list input:checked")].map(function (i) {
      return Number(i.value);
    });
    if (!ids.length) return;
    var btn = box.querySelector(".go2");
    btn.disabled = true;
    try {
      var r = await fetch("/api/keywords", {method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({project: proj(), ids: ids, active: on})});
      var d = await r.json();
      btn.disabled = false;
      if (!r.ok) { box.querySelector(".cnt").innerHTML =
        '<b class="warn">' + esc(d.detail || "변경하지 못했습니다") + "</b>"; return; }
    } catch (e) {
      btn.disabled = false;
      box.querySelector(".cnt").innerHTML = '<b class="warn">서버에 연결하지 못했습니다</b>';
      return;
    }
    kwLoad();
  }

  // 마크업은 이미 서 있다(templates/sections/sm-kw.html) — 여기서는 탭·버튼에
  // 이벤트만 건다.
  function keywords() {
    var sec = document.getElementById("sm-kw");
    if (!sec || sec.dataset.smWired) return;
    sec.dataset.smWired = "1";

    sec.querySelector(".tabs").addEventListener("click", function (ev) {
      var b = ev.target.closest ? ev.target.closest("[data-m]") : null;
      if (!b) return;
      kwMode = b.getAttribute("data-m");
      sec.querySelectorAll(".tabs button").forEach(function (x) {
        x.classList.toggle("on", x === b);
      });
      sec.querySelector(".go2").textContent =
        kwMode === "candidate" ? "선택 항목 추적" : "추적 해제";
      kwLoad();
    });
    sec.querySelector(".go2").addEventListener("click", function () {
      kwApply(kwMode === "candidate");
    });
    kwLoad();
  }
  step("키워드 패널", keywords);

  // ── AI 질문 관리 ───────────────────────────────────────────
  // [질문 만들기]는 있었는데 무엇이 만들어졌는지 볼 데가 없었다. 인용 확인을 한 번
  // 돌리기 전에는 목록이 화면 어디에도 안 나와서, 업종과 안 맞는 질문이 섞여도
  // 그대로 물어보는 수밖에 없었다. 목록이 곧 편집기다 — 고치고, 끄고, 지운다.
  var AIQ_CATS = ["추천", "비교", "문제해결", "브랜드", "general"];

  function aiqPaint(box, d) {
    var list = box.querySelector(".list");
    box.querySelector(".cnt").innerHTML =
      "켠 질문 " + d.active_total + " / " + d.limit +
      (d.active_total >= d.limit ? ' <b class="warn">· 상한 도달</b>' : "");
    if (!(d.prompts || []).length) {
      list.innerHTML = '<p style="padding:14px;color:var(--slate);font-size:13px">' +
        "아직 질문이 없습니다 — [AI에게 질문 만들게 하기]를 누르거나 직접 추가하세요.</p>";
      return;
    }
    list.innerHTML = d.prompts.map(function (q) {
      return '<div class="q' + (q.is_active ? "" : " off") + '" data-id="' + q.id + '">' +
        '<input type="checkbox" class="on"' + (q.is_active ? " checked" : "") +
          ' title="켜면 이번 확인에 물어봅니다">' +
        '<input class="t" value="' + esc(q.prompt) + '">' +
        '<select class="c">' + AIQ_CATS.map(function (c) {
          return '<option' + (c === q.category ? " selected" : "") + ">" + esc(c) + "</option>";
        }).join("") + "</select>" +
        '<span class="n">' + (q.checks ? q.checks + "회 · 인용 " + q.cited : "아직 안 물음") +
          "</span>" +
        '<button class="del" title="지우기 — 확인 기록도 함께 사라집니다">×</button>' +
        "</div>";
    }).join("");
  }

  function aiqSay(box, msg) {
    box.querySelector(".cnt").innerHTML = '<b class="warn">' + esc(msg) + "</b>";
  }

  async function aiqLoad() {
    var box = document.getElementById("sm-aiq");
    if (!box) return;
    box.querySelector(".list").innerHTML = '<p style="padding:14px;color:var(--slate);font-size:13px">불러오는 중…</p>';
    try {
      var r = await fetch("/api/ai/prompts?project=" + encodeURIComponent(proj()));
      var d = await r.json();
      if (!r.ok) return aiqSay(box, d.detail || "질문을 불러오지 못했습니다");
      aiqPaint(box, d);
    } catch (e) { aiqSay(box, "질문을 불러오지 못했습니다. 새로고침해 주세요"); }
  }

  async function aiqSend(body) {
    var box = document.getElementById("sm-aiq");
    try {
      var r = await fetch("/api/ai/prompts/edit", {method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(Object.assign({project: proj()}, body))});
      var d = await r.json();
      if (!r.ok) { aiqSay(box, d.detail || "저장하지 못했습니다"); return; }
      aiqPaint(box, d);
    } catch (e) { aiqSay(box, "서버에 연결하지 못했습니다"); }
  }

  // 마크업은 이미 서 있다(templates/sections/sm-aiq.html) — 여기서는 이벤트를
  // 걸고 목록을 채운다.
  function aiqPanel() {
    var sec = document.getElementById("sm-aiq");
    if (!sec || sec.dataset.smWired) return;
    sec.dataset.smWired = "1";

    var list = sec.querySelector(".list");
    var idOf = function (el) { return Number(el.closest(".q").dataset.id); };
    list.addEventListener("change", function (ev) {
      var t = ev.target;
      if (t.classList.contains("on")) {
        aiqSend({op: "active", ids: [idOf(t)], active: t.checked});
      } else if (t.classList.contains("c")) {
        aiqSend({op: "save", id: idOf(t), category: t.value,
                 prompt: t.closest(".q").querySelector(".t").value});
      }
    });
    // 문구 수정은 포커스를 뗄 때 저장한다 — 타이핑 한 글자마다 쏘지 않는다.
    list.addEventListener("focusout", function (ev) {
      var t = ev.target;
      if (!t.classList || !t.classList.contains("t")) return;
      if (t.value.trim() === t.defaultValue.trim()) return;
      aiqSend({op: "save", id: idOf(t), prompt: t.value,
               category: t.closest(".q").querySelector(".c").value});
    });
    list.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter" && ev.target.classList.contains("t")) ev.target.blur();
    });
    list.addEventListener("click", function (ev) {
      var b = ev.target.closest ? ev.target.closest(".del") : null;
      if (!b) return;
      var row = b.closest(".q");
      // 지우면 이 질문으로 쌓인 확인 기록도 같이 사라진다 — 되돌릴 수 없다.
      if (!window.confirm("이 질문과 지금까지의 확인 기록을 지웁니다. 기록을 남기려면 " +
                          "지우지 말고 체크를 꺼 주세요.\n\n" +
                          row.querySelector(".t").value)) return;
      aiqSend({op: "delete", ids: [Number(row.dataset.id)]});
    });

    var box = sec.querySelector(".new");
    var addOne = function () {
      var v = box.value.trim();
      if (!v) return;
      box.value = "";
      aiqSend({op: "save", prompt: v});
    };
    sec.querySelector(".add").addEventListener("click", addOne);
    box.addEventListener("keydown", function (ev) { if (ev.key === "Enter") addOne(); });
    sec.querySelector(".gen").addEventListener("click", function () { makePrompts(this); });
    aiqLoad();
  }
  step("AI 질문 패널", aiqPanel);

  // ── 사이트가 정해졌을 때 ─────────────────────────────────────
  // 원본(dashboard.html 의 load)이 데이터를 다 그린 뒤 한 번 쏜다. 여태 이 계층은
  // #proj 의 change 이벤트로만 그걸 알았는데, hash 로 자동 선택될 때는 change 가
  // 안 난다 — 그래서 백링크·설정·키워드가 각자 첫 로드에 비어 있었다(같은 함정에
  // 세 번 빠졌다). 계기를 한 자리로 모은다: 여기 안 걸린 것은 안 채워진다.
  document.addEventListener("sm:site", function () {
    SET_DONE = ""; REPO_LIST = null; GA4_LIST = null; GA4_SUGGESTED = []; GA4_AUTH_ERR = "";
    SET_H = null; PERF = null;
    step("설정", setLoad);
    step("성과", perfLoad);
    step("키워드", kwLoad);
    step("AI 질문", aiqLoad);
  });

  // ── Claude Code 로 넘길 일 ─────────────────────────────────
  // 웹에서 못 하는 게 분명히 있다(관련성 판단·스킬 해석·자유 질문). 없는 척하지 말고
  // 명령어를 그대로 준다 — 여기서만은 '복사'가 맞는 동작이다. 목록 자체는
  // templates/sections/sm-cc.html 에 정적으로 적혀 있다 — 여기서는 클릭(복사)만 건다.
  function handoff() {
    var sec = document.getElementById("sm-cc");
    if (!sec || sec.dataset.smWired) return;
    sec.dataset.smWired = "1";
    sec.addEventListener("click", function (ev) {
      var b = ev.target.closest ? ev.target.closest("[data-cc]") : null;
      if (!b) return;
      var cmd = b.getAttribute("data-cc") + proj();
      navigator.clipboard.writeText(cmd).then(function () {
        var was = b.textContent;
        b.textContent = "복사됨 ✓";
        setTimeout(function () { b.textContent = was; }, 1400);
      });
    });
  }
  step("고급 분석 패널", handoff);

  // ── 서치콘솔 성과 ───────────────────────────────────────────
  // 화면이 쓰던 것은 클릭·노출 둘뿐이었다. CTR 과 게재순위는 gsc_snapshots 에 이미
  // 들어 있는데 아무도 읽지 않아서, 서치콘솔을 보던 사람에게는 지표 절반이 빈 화면이었다.
  var PERF = null, dimMode = "queries";
  var nf = function (n) { return Number(n || 0).toLocaleString("ko-KR"); };
  var pct = function (v) { return v == null ? "—" : (v * 100).toFixed(2) + "%"; };
  var pos = function (v) { return v == null ? "—" : v.toFixed(1); };

  // 증감. 게재순위만 방향이 반대다 — 작아지는 게 오르는 것이다.
  // 이름은 smDelta — 셸의 delta(d, invert, base, tip)(dashboard.html)와 시그니처가
  // 달라서, 같은 이름이면 어느 걸 부르는지 헷갈린다(IIFE 안이라 실제로 덮어쓰진
  // 않지만, 읽는 사람은 그걸 모른다).
  function smDelta(now, was, fmt, lowerIsBetter) {
    if (now == null || was == null) return "";
    var d = now - was;
    if (Math.abs(d) < 1e-9) return ' <span class="d muted">—</span>';
    var good = lowerIsBetter ? d < 0 : d > 0;
    var body = (d > 0 ? "+" : "−") + fmt(Math.abs(d));
    return ' <span class="d ' + (good ? "up" : "down") + '">' + body + "</span>";
  }

  // KPI 두 칸을 원본 밴드에 끼운다. render() 가 band 를 다시 그리면 사라지므로
  // MutationObserver 쪽에서 다시 부른다 — 이미 있으면 아무것도 하지 않는다.
  function kpi() {
    var band = document.getElementById("band");
    if (!band || !PERF || !PERF.totals || band.querySelector("[data-sm-kpi]")) return;
    var t = PERF.totals, pv = PERF.prev || {};
    var box = document.createElement("div");
    box.style.display = "contents";
    box.setAttribute("data-sm-kpi", "1");
    // 옆 칸들과 같은 기준 줄을 단다 — 무엇을 어떻게 잰 값이고 직전이 얼마였는지.
    // 직전이 없는 이유가 둘이다 — 아직 두 번을 안 쟀거나, 쟀는데 기간(period_days)이
    // 달라 비교하지 않았거나. 말없이 사라지면 Δ가 그냥 없어진 것처럼 보인다
    // (views/keywords.html 의 period_mismatch 안내와 같은 말을 한다).
    var basis = function (how, was, fmt) {
      var note = was != null ? "이전 " + fmt(was)
        : PERF.period_mismatch ? "직전 기록과 기간이 달라 비교하지 않음"
        : "비교할 직전 기록 없음";
      return '<div class="b">' + how + " · " + note + "</div>";
    };
    box.innerHTML =
      '<div class="m"><div class="v">' + pct(t.ctr) +
        smDelta(t.ctr, pv.ctr, function (x) { return (x * 100).toFixed(2) + "%p"; }, false) +
        '</div><div class="l">CTR</div>' + basis("노출 대비 클릭", pv.ctr, pct) + "</div>" +
      '<div class="m"><div class="v">' + pos(t.position) +
        smDelta(t.position, pv.position, function (x) { return x.toFixed(1); }, true) +
        '</div><div class="l">평균 게재순위</div>' +
        basis("노출 가중 평균", pv.position, pos) + "</div>";
    band.appendChild(box);
  }

  // 꺾은선 하나. 원본 로그 차트와 같은 언어(등폭 숫자·괘선·patina)로 그린다.
  // 제목 줄에는 '지금 값 + 직전 대비', 차트에는 눈금선과 그 값 — 선만 있으면 모양만 보이고
  // "그래서 지금 얼마"를 못 읽는다. 세로축 값은 차트 오른쪽 위·아래에 붙인다.
  function line(rows, key, opt) {
    var pts = [];
    rows.forEach(function (r, i) { if (r[key] != null) pts.push([i, r[key]]); });
    var now = opt.now == null ? "" : '<span class="nowv">' + opt.fmt(opt.now) +
      smDelta(opt.now, opt.was, opt.dfmt, !!opt.invert) + "</span>";
    var head = function () {
      return '<div class="sm-ct"><span>' + opt.label + "</span>" + now + "</div>";
    };
    if (pts.length < 2)
      return head() +
        '<p class="sm-none">추이를 그리려면 이틀 이상의 일별 데이터가 필요합니다.</p>';
    var W = 100, H = 42, P = 3, n = rows.length;
    var vs = pts.map(function (q) { return q[1]; });
    var lo = Math.min.apply(null, vs), hi = Math.max.apply(null, vs);
    if (hi === lo) { hi = lo + (lo || 1) * 0.1; lo = lo - (lo || 1) * 0.1; }
    var X = function (i) { return P + i * (W - P * 2) / Math.max(1, n - 1); };
    var Y = function (v) {
      var t = (v - lo) / (hi - lo);
      return P + (opt.invert ? t : 1 - t) * (H - P * 2);   // 게재순위는 작을수록 위
    };
    var d = pts.map(function (q, k) {
      return (k ? "L" : "M") + X(q[0]).toFixed(2) + " " + Y(q[1]).toFixed(2);
    }).join(" ");
    var last = pts[pts.length - 1];
    // 눈금선 셋 — 위·가운데·아래. 위아래 값은 옆의 라벨이 말한다.
    var grid = [P, H / 2, H - P].map(function (y) {
      return '<line class="g" x1="' + P + '" y1="' + y + '" x2="' + (W - P) +
        '" y2="' + y + '"/>';
    }).join("");
    // 칸마다 투명한 띠 — <title> 만으로 그날 값을 읽는다(핸들러를 안 붙인다).
    var bw = (W - P * 2) / Math.max(1, n - 1);
    var hov = rows.map(function (r, i) {
      var x0 = Math.max(0, X(i) - bw / 2), x1 = Math.min(W, X(i) + bw / 2);
      return '<rect x="' + x0.toFixed(2) + '" y="0" width="' + (x1 - x0).toFixed(2) +
        '" height="' + H + '"><title>' + esc(r.d) + " — " + opt.label + " " +
        (r[key] == null ? "값 없음" : opt.fmt(r[key])) + "</title></rect>";
    }).join("");
    var mid = n > 2 ? "<span>" + esc(rows[Math.floor((n - 1) / 2)].d) + "</span>" : "";
    return head() +
      '<div class="sm-plot"><span class="sm-gl t">' +
      opt.fmt(opt.invert ? lo : hi) + '</span><span class="sm-gl b">' +
      opt.fmt(opt.invert ? hi : lo) + "</span>" +
      '<svg class="sm-line" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none"' +
      ' role="img" aria-label="' + opt.label + ' 추이 — 최고 ' +
      opt.fmt(opt.invert ? lo : hi) + ', 최저 ' + opt.fmt(opt.invert ? hi : lo) + '">' +
      grid + '<path d="' + d + '"/>' +
      '<circle cx="' + X(last[0]).toFixed(2) + '" cy="' + Y(last[1]).toFixed(2) +
      '" r="1.1"/>' + hov + "</svg></div>" +
      '<div class="sm-ax"><span>' + esc(rows[0].d) + "</span>" + mid +
      "<span>" + esc(rows[rows.length - 1].d) + "</span></div>";
  }

  function perfRender() {
    var sec = document.getElementById("sm-perf");
    if (!sec || !PERF) return;
    sec.hidden = false;
    var t = PERF.totals;
    if (!t) {
      sec.innerHTML = '<p class="eyebrow">PERFORMANCE</p><h2>검색 성과</h2>' +
        '<p class="sm-none">검색 실적을 아직 수집하지 않았습니다 — 위 [실적 다시 수집]을 누르면 채워집니다.</p>';
      return;
    }
    var dl = PERF.daily || [], pv = PERF.prev || {};
    var span = dl.length ? dl[0].d + " → " + dl[dl.length - 1].d : PERF.snapshot;
    sec.innerHTML = '<p class="eyebrow">PERFORMANCE · ' + esc(span) +
      (dl.length ? " · " + dl.length + "일" : "") + "</p>" +
      "<h2>검색 성과</h2>" +
      '<p class="sub">위 일별 추이가 클릭·노출을 그립니다. 나머지 두 지표가 여기 있습니다 — ' +
      "게재순위는 노출 가중 평균이라 서치콘솔 화면의 값과 같고, 선이 위로 갈수록 순위가 높습니다. " +
      "제목 옆 숫자는 현재 값이고 증감은 직전 분석 대비입니다." +
      (PERF.period_mismatch ? " 직전 기록과 기간이 달라 이번엔 증감을 비교하지 않았습니다 " +
        "— 같은 기간으로 한 번 더 읽으면 채워집니다." : "") + "</p>" +
      '<div class="sm-charts">' +
      ['<div>' + line(dl, "ctr", {label: "CTR", fmt: pct, now: t.ctr, was: pv.ctr,
          dfmt: function (x) { return (x * 100).toFixed(2) + "%p"; }}) + "</div>",
       '<div>' + line(dl, "position", {label: "평균 게재순위", fmt: pos, invert: true,
          now: t.position, was: pv.position,
          dfmt: function (x) { return x.toFixed(1); }}) + "</div>"
      ].join("") + "</div>";
  }

  var DIMS = [["queries", "검색어"], ["pages", "페이지"], ["devices", "기기"]];
  var DEVICE = {MOBILE: "모바일", DESKTOP: "데스크톱", TABLET: "태블릿"};
  // [키, 라벨, 작은 값이 좋은가] — 게재순위만 오름차순이 '좋은 순'이다
  var COLS = [["clicks", "클릭", false], ["impressions", "노출", false],
              ["ctr", "CTR", false], ["position", "게재순위", true]];
  var dimSort = "clicks", dimAsc = false, dimQ = "";

  // 지금 보고 있는 줄들. 찾기 칸과 정렬을 함께 반영한다.
  function dimRows() {
    var q = dimQ.trim().toLowerCase();
    var rows = (PERF[dimMode] || []).filter(function (r) {
      return !q || String(r.key).toLowerCase().indexOf(q) >= 0;
    });
    return rows.sort(function (a, b) {
      var x = a[dimSort], y = b[dimSort];
      if (x == null) return 1;
      if (y == null) return -1;
      return dimAsc ? x - y : y - x;
    });
  }

  // 표만 다시 그린다 — 껍데기까지 갈아치우면 찾기 칸이 사라져 입력 도중 포커스를 잃는다.
  function dimTable() {
    var sec = document.getElementById("sm-dim");
    var box = sec && sec.querySelector(".sm-dimt");
    if (!box || !PERF) return;
    sec.querySelectorAll("[data-d]").forEach(function (b) {
      b.classList.toggle("on", b.dataset.d === dimMode);
      b.setAttribute("aria-pressed", b.dataset.d === dimMode);
    });
    var all = (PERF[dimMode] || []).length, rows = dimRows();
    var cnt = sec.querySelector(".sm-dimn");
    if (cnt) cnt.textContent = rows.length === all
      ? all + "행" : rows.length + "행 / 전체 " + all + "행";
    var head = DIMS.filter(function (x) { return x[0] === dimMode; })[0][1];
    if (!all) {
      box.innerHTML = '<p class="sm-none">' + (dimMode === "devices"
        ? "기기별 데이터를 아직 수집하지 않았습니다 — 위 [실적 다시 수집]을 누르면 채워집니다."
        : "아직 수집된 데이터가 없습니다.") + "</p>";
      return;
    }
    if (!rows.length) {
      box.innerHTML = '<p class="sm-none">찾는 말과 맞는 줄이 없습니다.</p>';
      return;
    }
    // 노출 비중 막대 — 상위 몇 줄이 전부인지, 고르게 퍼졌는지가 숫자보다 빨리 보인다.
    var mxI = Math.max.apply(null, rows.map(function (r) { return r.impressions || 0; }).concat([1]));
    var t = '<table><thead><tr><th>' + head + "</th>" +
      COLS.map(function (c) {
        var on = c[0] === dimSort;
        return '<th class="num"><button data-s="' + c[0] + '"' +
          (on ? ' class="on' + (dimAsc ? " asc" : "") + '"' : "") +
          ' title="' + c[1] + ' 기준으로 정렬' + (on ? " — 다시 누르면 반대 순서" : "") +
          '">' + c[1] + "</button></th>";
      }).join("") + "</tr></thead><tbody>" +
      rows.map(function (r) {
        var k = r.key;
        if (dimMode === "pages") k = k.replace(/^https?:\/\/[^/]+/, "") || "/";
        if (dimMode === "devices") k = DEVICE[k] || k;
        return '<tr><td title="' + esc(r.key) + '"><span class="sm-k">' + esc(k) +
          '</span><span class="sm-share"><i style="width:' +
          ((r.impressions || 0) / mxI * 100).toFixed(1) + '%"></i></span>' +
          '</td><td class="num">' + nf(r.clicks) + '</td><td class="num">' +
          nf(r.impressions) + '</td><td class="num">' + pct(r.ctr) +
          '</td><td class="num">' + pos(r.position) + "</td></tr>";
      }).join("") + "</tbody></table>";
    box.innerHTML = rows.length >= 8 ? '<div class="tw">' + t + "</div>" : t;
  }

  // 지금 보이는 줄 그대로 표로 내보낸다 — 만드는 코드는 셸의 csv(name, rows)
  // 하나다(null 처리가 갈라졌던 자리라 사본을 안 둔다).
  function dimCsv() {
    var head = DIMS.filter(function (x) { return x[0] === dimMode; })[0][1];
    var rows = [[head, "클릭", "노출", "CTR", "게재순위"]].concat(
      dimRows().map(function (r) {
        return [r.key, r.clicks || 0, r.impressions || 0, pct(r.ctr), pos(r.position)];
      }));
    csv(dimMode + "-" + (PERF.snapshot || ""), rows);
  }

  function dimRender() {
    var sec = document.getElementById("sm-dim");
    if (!sec || !PERF) return;
    // 실적 자체가 없으면 위 [검색 성과]가 이미 이유를 말한다 — 빈 표를 또 보이지 않는다.
    if (!PERF.totals) { sec.hidden = true; return; }
    sec.hidden = false;
    if (!sec.querySelector(".sm-dimt")) {
      sec.innerHTML = '<p class="eyebrow">BREAKDOWN</p><h2>무엇으로 들어오나</h2>' +
        '<p class="sub">열 이름을 누르면 그 기준으로 정렬되고, 같은 열을 다시 누르면 반대 ' +
        "순서가 됩니다. 노출은 많은데 CTR 이 낮은 줄이 제목·설명을 고칠 자리입니다. " +
        "노출 상위 25개까지 가져옵니다.</p>" +
        '<div class="tabs">' + DIMS.map(function (d) {
          return '<button data-d="' + d[0] + '">' + d[1] + "</button>";
        }).join("") + "</div>" +
        '<div class="tools"><input type="search" class="sm-dimq" ' +
        'placeholder="검색어·주소로 찾기" aria-label="분해 표에서 찾기">' +
        '<span class="n sm-dimn"></span><span class="sp"></span>' +
        '<button class="go sec sm-dimx" title="지금 보이는 줄 그대로 내려받습니다"' +
        ">CSV 내보내기</button></div>" +
        '<div class="sm-dimt"></div>';
      // 위임 한 번만 — 그릴 때마다 붙이면 핸들러가 쌓여 한 번 누른 게 여러 번 돈다.
      sec.addEventListener("click", function (ev) {
        if (ev.target.classList.contains("sm-dimx")) return dimCsv();
        var t = ev.target.closest ? ev.target.closest("[data-d],[data-s]") : null;
        if (!t) return;
        if (t.dataset.d) { dimMode = t.dataset.d; dimSort = "clicks"; dimAsc = false; }
        else if (t.dataset.s === dimSort) dimAsc = !dimAsc;
        else {
          dimSort = t.dataset.s;
          dimAsc = !!(COLS.filter(function (c) { return c[0] === dimSort; })[0] || [])[2];
        }
        dimTable();
      });
      sec.addEventListener("input", function (ev) {
        if (!ev.target.classList.contains("sm-dimq")) return;
        dimQ = ev.target.value;
        dimTable();
      });
    }
    dimTable();
  }

  // 껍데기(#sm-perf·#sm-dim)는 이미 hidden 으로 서 있다
  // (templates/sections/sm-perf.html, sm-dim.html) — 채워지기 전까지는 감춰 둔다:
  // 빈 상자 둘이 개요 밑에 떠 있으면 고장으로 보인다.
  async function perfLoad() {
    var pj = proj();
    if (!pj) return;
    try {
      PERF = await (await fetch("/api/perf?project=" + encodeURIComponent(pj))).json();
    } catch (e) { return; }
    kpi(); perfRender(); dimRender();
  }
  // 갱신 계기는 "sm:site" 하나다 — 아래 한 자리에서 같이 받는다.

  step("화면 배치", function () { SM.sync(); runButtons(); });

  // 기회 목록이 다시 그려질 때마다 버튼을 심는다. 기회 id 는 카드의 data-opp 에
  // 있다 — 예전에는 트리아지 버튼의 인라인 onclick 문자열을 정규식으로 뜯어 꺼냈다.
  var wire = function () {
    // 저장소가 안 붙었으면 이 버튼은 못 쓴다 — 숨기지는 않는다(기능이 있다는 건
    // 알려야 한다). 대신 눌러 보게 하지 않고 그 자리에서 무엇이 필요한지 말한다.
    // SET_H 가 아직 안 왔으면 판단을 미룬다: 아래 MutationObserver 가 다시 부른다.
    if (!SET_H) return;
    var need = !SET_H.repo;
    document.querySelectorAll(".opp[data-opp] .acts").forEach(function (box) {
      var w = box.querySelector("[data-write]");
      if (!w) {
        w = document.createElement("button");
        w.setAttribute("data-write", box.closest(".opp").dataset.opp);
        w.onclick = function () { writeClick(w); };   // 위임 불가 — 위 주석 참고
        box.appendChild(w);
      } else if (w.disabled) {
        return;                            // 작성 중인 버튼은 건드리지 않는다
      }
      // 상태가 바뀌면 따라간다 — 설정에서 저장소를 붙이면 그 자리에서 쓸 수 있게 된다.
      // **값이 같으면 쓰지 않는다**: 이 함수는 MutationObserver 가 부르므로, 매번
      // DOM 에 쓰면 자기가 자기를 깨워 무한 루프가 된다(화면이 얼어붙는다).
      if (need !== w.hasAttribute("data-need")) {
        if (need) w.setAttribute("data-need", "1");
        else w.removeAttribute("data-need");
      }
      var want = need ? "저장소 연결 필요" : "콘텐츠 작성";
      if (w.textContent !== want) w.textContent = want;
      var tip = need ? "이 사이트에 저장소가 연결되지 않았습니다 — [설정]에서 연결하세요."
                     + " 지금은 아래 [AI 에게 수정 요청]으로 프롬프트를 복사해 쓰실 수 있습니다."
                     : "";
      if (w.title !== tip) w.title = tip;
    });
  };
  // 화면은 비동기로 여러 번 다시 그려진다(사이트 전환·필터·분석 완료) — 그래서 이
  // 손질들은 전부 **idempotent** 해야 한다. 아래 MutationObserver 가 매번 다시 부르는데,
  // 값이 같아도 DOM 에 쓰면 자기가 자기를 깨워 화면이 얼어붙는다.
  // (terms.js 의 reempty 가 정확히 그랬다: 자기 결과물이 자기 정규식에 다시 걸렸다.)
  // 남은 넷은 전부 id·data 속성으로 찾고, 값이 바뀔 때만 쓴다 — 문구는 이제
  // 화면이 스스로 고르므로(data-web / W) 여기서 글자를 되짚지 않는다.
  var all = function () {
    step("화면 손질", function () {
      wire(); wireSteps(); wireActs(); restage(); kpi();
    });
    // 사이트 데이터를 부르는 것들은 여기 없다 — "sm:site" 가 정확한 계기를 준다.
    // (재시도 루프로 때우면 언제 채워지는지가 운에 달린다.)
  };
  new MutationObserver(all).observe(document.body, {childList: true, subtree: true});
  all();
})();
</script>
