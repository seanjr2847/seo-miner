<!--ENTRY_HEAD-->

<header><div class="wrap hbar">
  <span class="mark">seo<b>·</b>miner</span>
  <span class="tag">사이트 관리</span>
  <span class="sp"></span>
  <!--USER-->
</div></header>

<main class="wrap">
  <!-- 머리는 한 벌이다: 물음 하나 · 그 답이 어디 있는지 한 문장 · 주 행동 하나.
       새 사이트는 온보딩(/start)에서 넣는다 — 이 화면은 목록이다. 등록 폼을 여기 다시
       두면 입구가 둘이 되고, 한쪽(서치콘솔 없이 시작)만 낡는다. 격자 끝의 추가 타일과
       이 버튼은 같은 /start 입구를 가리킬 뿐 폼이 아니다. -->
  <div class="shead">
    <div>
      <h1>어느 사이트를 열까요?</h1>
      <p>마지막 분석 시각과 다시 잴 측정을 보고, 들어갈 사이트를 고르세요.</p>
    </div>
    <a class="go" href="/start">사이트 추가</a>
  </div>

  <!-- 요약 줄 — 칸 값은 아래 스크립트가 카드와 /api/run/status 로 센다. 칸이 비어 있으면(스크립트
       전) 숨겨 둔다: 0 이라고 거짓으로 말하느니 안 말한다. 왼쪽 띠는 사이트 단위, 오른쪽 도넛은
       측정 묶음 단위다(상태 조회가 실패하면 도넛만 빠진다). -->
  <div class="sumrow">
    <div class="strip" id="sitestrip" role="group" aria-label="전체 상태" hidden>
      <div class="ch"><b>전체 상태</b><span>등록한 사이트와 지금 걸린 것</span></div>
      <div class="pcs">
        <div class="pc" data-k="sites"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg></span><span class="l">등록한 사이트</span><span class="v"><b>0</b><small>곳</small></span></div>
        <div class="pc" data-k="run"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><span class="l">첫 분석 중</span><span class="v"><b>0</b><small>곳</small></span></div>
        <div class="pc" data-k="due" hidden><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.5-5.8"/><path d="M20 4v5h-5"/></svg></span><span class="l">다시 잴 때</span><span class="v"><b>0</b><small>곳</small></span></div>
        <div class="pc" data-k="fail" hidden><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3.5 22 20H2z"/><path d="M12 10v4.5M12 17.5v.01"/></svg></span><span class="l">실패한 단계 있음</span><span class="v"><b>0</b><small>곳</small></span></div>
      </div>
      <div class="jump" id="sitejump"></div>
    </div>
    <div class="ringcard" id="sitering" hidden>
      <div class="ch"><b>측정 현황</b><span id="ringsub">모든 사이트의 측정 묶음 기준</span></div>
      <div class="rg">
        <div class="ring" id="ringbox" role="img" aria-label="측정 현황"></div>
        <ul class="leg" id="ringleg"></ul>
      </div>
    </div>
  </div>

  <!--SITES-->
</main>

<footer class="wrap">
  <span>등록한 사이트는 검색 실적을 매일, 순위·AI 인용·사이트 점검을 주 1회(설정에서 바꿈) 자동으로 다시 잽니다.</span>
</footer>

<script>
const $ = id => document.getElementById(id);

// ── 사이트 카드 ───────────────────────────────────────────────
// 서버가 그린 li(.s-id · .s-state · .go · .prog)는 그대로 두고, 그 위에 카드의 나머지를
// 얹는다: 이름 해시 색의 이니셜, 마지막 분석의 상대 시간, 측정 신선도 막대, 실패 알약.
// 이름·주소·상태·버튼 링크는 서버 마크업이 정본이다 — 여기서 다시 쓰지 않는다.
const list = document.querySelector(".sites");
const cards = () => [...document.querySelectorAll(".sites > li:not(.addtile)")];

// 색 지문: 이름 글자를 더해 다섯 색조 중 하나로. 같은 이름은 언제나 같은 색이다.
function tone(name) {
  let h = 2166136261;
  for (const ch of name) h = Math.imul(h ^ ch.codePointAt(0), 16777619) >>> 0;
  return (h >>> 8) % 5;
}
const mk = (tag, cls, text) => {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  if (text != null) el.textContent = text;
  return el;
};

// last_run_at 은 UTC 로 저장돼 있다("YYYY-MM-DD HH:MM…"). 서버가 보여 주는 16자 날짜는 그대로 두고,
// 옆에 "얼마 전"만 덧붙인다.
function ago(raw) {
  const t = Date.parse(String(raw || "").replace(" ", "T").slice(0, 16) + ":00Z");
  if (isNaN(t)) return "";
  const m = Math.max(0, (Date.now() - t) / 60000);
  if (m < 1) return "방금";
  if (m < 60) return Math.floor(m) + "분 전";
  if (m < 1440) return Math.floor(m / 60) + "시간 전";
  const d = m / 1440;
  if (d < 14) return Math.floor(d) + "일 전";
  if (d < 60) return Math.floor(d / 7) + "주 전";
  return Math.floor(d / 30) + "개월 전";
}

function decorate(li) {
  const nm = li.querySelector(".nm");
  const name = nm ? nm.textContent : "";
  const av = mk("span", "av", ([...name][0] || "?").toUpperCase());
  av.dataset.t = tone(name);
  av.setAttribute("aria-hidden", "true");
  li.prepend(av);
  const pr = li.querySelector(".pr");
  if (pr) pr.title = pr.textContent;
  // "마지막 분석 · 상대 시간 · 날짜" 한 묶음 — 서버가 그린 .when 을 옮겨 담는다(참조가 그대로다).
  const w = li.querySelector(".when");
  const last = mk("div", "lastrow");
  const v = mk("div", "v");
  last.append(mk("span", "lbl", "마지막 분석"), v);
  v.append(mk("span", "ago"));
  if (w) v.append(w);
  li.append(last, mk("div", "fresh"));
  paintAgo(li);
}
function paintAgo(li) {
  const w = li.querySelector(".when");
  const a = li.querySelector(".ago");
  if (a) a.textContent = w ? ago(w.textContent) : "";
}

// ── 측정 현황: 링 + 경과일 막대 ────────────────────────────────
// status.groups 는 {묶음 id: {running, due, last_run_at}} 다. 묶음 이름은 대시보드 페이로드(d.groups)에
// 있고 이 화면엔 없다 — 사본을 두지 않는다. 서버가 window.__GROUPS__ 로 실어 주면(id → 이름) 막대 밑에
// 이름이 붙고, 없으면 경과일만 말한다.
const GN = window.__GROUPS__ || {};
const gname = id => { const g = GN[id]; return (g && (typeof g === "string" ? g : g.name)) || ""; };
const NS = "http://www.w3.org/2000/svg";
const stamp = raw => Date.parse(String(raw || "").replace(" ", "T").slice(0, 16) + ":00Z");
const ageDays = raw => { const t = stamp(raw); return isNaN(t) ? null : Math.max(0, (Date.now() - t) / 864e5); };
const dayText = a => a == null ? "없음" : a < 1 ? "오늘" : Math.floor(a) + "일";

// 도넛 SVG — pathLength=100 이라 조각 길이가 곧 퍼센트다. 조각이 둘 이상이면 사이를 조금 띄운다.
function ring(parts) {
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 100 100");
  svg.setAttribute("aria-hidden", "true");
  const c = cls => {
    const el = document.createElementNS(NS, "circle");
    el.setAttribute("cx", 50); el.setAttribute("cy", 50); el.setAttribute("r", 44);
    el.setAttribute("pathLength", 100);
    el.setAttribute("class", cls);
    svg.append(el);
    return el;
  };
  c("trk");
  const live = parts.filter(p => p.v > 0);
  const total = live.reduce((n, p) => n + p.v, 0);
  const gap = live.length > 1 ? 3 : 0;
  let off = 0;
  live.forEach(p => {
    const len = 100 * p.v / total;
    const dash = Math.max(len - gap, 0.01);
    const el = c(p.cls);
    el.setAttribute("stroke-dasharray", dash + " " + (100 - dash));
    el.setAttribute("stroke-dashoffset", -off);
    off += len;
  });
  return svg;
}
const center = (big, small) => {
  const rc = mk("div", "rc");
  rc.append(mk("b", null, big));
  if (small) rc.append(mk("small", null, small));
  return rc;
};
// 묶음 하나의 지금 상태 — 재는 중 · 다시 잴 때 · 최신
const gstate = g => g.running ? "run" : g.due ? "due" : "up";

// 카드 하나의 측정 현황. scale 은 모든 카드가 같이 쓰는 막대 눈금(일)이라 카드끼리 견줄 수 있다.
function paintFresh(li, s, scale) {
  const box = li.querySelector(".fresh");
  if (!box) return;
  box.textContent = "";
  if (li.classList.contains("waiting")) return;
  const ents = Object.entries(s.groups || {});
  const failed = s.last_ok != null && !s.last_ok;
  if (!ents.length && !failed) return;
  if (ents.length) {
    const st = ents.map(([, g]) => gstate(g));
    const n = k => st.filter(x => x === k).length;
    const due = n("due"), run = n("run"), up = n("up");
    const sum = mk("div", "fsum");
    const rg = mk("div", "ring");
    rg.setAttribute("role", "img");
    rg.setAttribute("aria-label", "측정 " + ents.length + "개 중 " + up + "개가 최신");
    rg.append(ring([{ v: up, cls: "s-up" }, { v: due, cls: "s-due" }, { v: run, cls: "s-run" }]),
              center(up + "/" + ents.length));
    const tx = mk("div", "ftxt");
    tx.append(mk("span", "badge " + (due ? "due" : "ok"), due ? "다시 잴 " + due + "개" : "모두 최신"));
    let msg = "측정 " + ents.length + "개 중 " + up + "개가 최신입니다";
    if (run) msg += " (" + run + "개 재는 중)";
    tx.append(mk("span", "fcap", msg));
    sum.append(rg, tx);
    // 경과일 막대: 높을수록 오래됐다.
    const bars = mk("div", "bars");
    bars.setAttribute("role", "list");
    bars.setAttribute("aria-label", "측정 묶음별로 마지막에 잰 뒤 지난 날");
    ents.forEach(([id, g], k) => {
      const a = ageDays(g.last_run_at);
      const col = mk("div", "col " + st[k]);
      col.setAttribute("role", "listitem");
      const nm = gname(id);
      const state = st[k] === "run" ? "재는 중" : st[k] === "due" ? "다시 잴 때" : "최신";
      const when = a == null ? "아직 재지 않음" : dayText(a) === "오늘" ? "오늘 측정" : dayText(a) + " 전 측정";
      col.title = (nm ? nm + " · " : "") + when + " · " + state;
      const trk = mk("div", "trk");
      const fill = mk("i");
      fill.style.height = (a == null ? 100 : Math.min(100, Math.max(8, a / scale * 100))) + "%";
      trk.append(fill);
      col.append(trk);
      if (nm) col.append(mk("span", "nmg", nm));
      col.append(mk("span", "d", dayText(a)));
      bars.append(col);
    });
    box.append(sum, bars);
  }
  if (failed) {
    const line = String(s.last_error || "").split("\n")[0];
    const pill = mk("span", "badge bad", "일부 단계 실패");
    if (line) pill.title = line;
    const f = mk("div", "ferr");
    f.append(pill);
    if (line) f.append(mk("span", null, line));
    box.append(f);
  }
}
// 막대 눈금 — 가장 오래된 측정까지, 최소 7일.
function barScale(st) {
  let m = 7;
  cards().forEach(li => {
    const s = st[(li.querySelector(".nm") || {}).textContent];
    if (!s || li.classList.contains("waiting")) return;
    Object.values(s.groups || {}).forEach(g => { const a = ageDays(g.last_run_at); if (a != null && a > m) m = a; });
  });
  return m;
}

// ── 요약 줄 ──────────────────────────────────────────────────
// 사이트 수·첫 분석 중은 카드에서 센다(상태 조회가 실패해도 남는다). 재측정·실패는 status 가 있어야 안다.
function paintStrip(st) {
  const cs = cards();
  const n = {
    sites: cs.length,
    run: cs.filter(li => li.classList.contains("waiting")).length,
  };
  const tally = { up: 0, due: 0, run: 0 };
  if (st) {
    n.due = 0; n.fail = 0;
    cs.forEach(li => {
      const s = st[(li.querySelector(".nm") || {}).textContent];
      if (!s) return;
      if (!li.classList.contains("waiting")) {
        const gs = Object.values(s.groups || {});
        if (gs.some(g => g.due)) n.due++;
        gs.forEach(g => tally[gstate(g)]++);
      }
      if (s.last_ok != null && !s.last_ok) n.fail++;
    });
  }
  document.querySelectorAll("#sitestrip .pc").forEach(pc => {
    const k = pc.dataset.k;
    pc.hidden = n[k] == null;
    if (n[k] == null) return;
    pc.querySelector("b").textContent = n[k];
    pc.classList.toggle("zero", n[k] === 0 && k !== "sites");
  });
  $("sitestrip").hidden = false;
  paintRing(tally);
  paintJump(st);
}
// 손댈 곳 — 다시 잴 묶음이 있거나 실패한 사이트를 걸린 순으로. 카드 격자보다 먼저 답을 준다.
function paintJump(st) {
  const box = $("sitejump");
  box.textContent = "";
  if (!st) return;
  const rows = [];
  cards().forEach(li => {
    if (li.classList.contains("waiting")) return;
    const nm = li.querySelector(".nm");
    const go = li.querySelector(".go");
    const s = nm && st[nm.textContent];
    if (!s || !go) return;
    const due = Object.values(s.groups || {}).filter(g => g.due).length;
    const fail = s.last_ok != null && !s.last_ok;
    if (due || fail) rows.push({ name: nm.textContent, href: go.getAttribute("href"), due, fail });
  });
  if (!rows.length) {
    if (cards().some(li => !li.classList.contains("waiting")))
      box.append(mk("span", "ok", "다시 잴 측정이 있는 사이트가 없습니다."));
    return;
  }
  rows.sort((a, b) => (b.fail - a.fail) || (b.due - a.due));
  box.append(mk("span", "jl", "먼저 볼 곳"));
  rows.forEach(r => {
    const a = mk("a");
    a.href = r.href;
    const av = mk("span", "av", ([...r.name][0] || "?").toUpperCase());
    av.dataset.t = tone(r.name);
    av.setAttribute("aria-hidden", "true");
    a.append(av, mk("span", null, r.name),
             mk("small", null, r.fail ? "실패한 단계" : "다시 잴 " + r.due + "개"));
    box.append(a);
  });
}
// 전체 도넛 — 모든 사이트의 측정 묶음을 한 줄로 센다. 잴 게 하나도 없으면(첫 분석뿐) 카드째 뺀다.
function paintRing(t) {
  const total = t.up + t.due + t.run;
  const card = $("sitering");
  card.hidden = !total;
  if (!total) return;
  const box = $("ringbox");
  box.textContent = "";
  const pct = Math.round(100 * t.up / total);
  box.setAttribute("aria-label", "측정 " + total + "개 중 " + t.up + "개가 최신, " + pct + "%");
  box.append(ring([{ v: t.up, cls: "s-up" }, { v: t.due, cls: "s-due" }, { v: t.run, cls: "s-run" }]),
             center(pct + "%", "최신"));
  $("ringsub").textContent = "모든 사이트의 측정 묶음 " + total + "개 기준";
  const leg = $("ringleg");
  leg.textContent = "";
  [["up", "최신", t.up], ["due", "다시 잴 때", t.due], ["run", "재는 중", t.run]].forEach(([k, l, v]) => {
    const li = mk("li", k + (v ? "" : " z"));
    li.append(mk("span", null, l), mk("b", null, v + "개"));
    leg.append(li);
  });
}

// ── 격자 끝의 추가 타일 ──────────────────────────────────────
// 마지막 줄이 꽉 차 있으면 한 줄 전체로, 빈 칸이 남으면 그 칸 하나로 선다. 한 줄에 몇 장이 들어가는지는
// 창 폭이 정하므로 그려진 위치로 잰다.
function addTile() {
  if (!list) return;
  list.dataset.n = cards().length;
  const li = mk("li", "addtile");
  const a = mk("a");
  a.href = "/start";
  const plus = mk("span", "plus", "+");
  plus.setAttribute("aria-hidden", "true");
  const t = mk("span", "t");
  t.append(mk("b", null, "사이트 추가"), mk("span", null, "주소를 넣으면 분석을 시작합니다"));
  a.append(plus, t);
  li.append(a);
  list.append(li);
  const place = () => {
    const cs = cards();
    if (!cs.length) return;
    const top = cs[0].offsetTop;
    const perRow = cs.filter(c => c.offsetTop === top).length;
    li.dataset.fit = cs.length % perRow === 0 ? "row" : "cell";
  };
  place();
  if (window.ResizeObserver) new ResizeObserver(place).observe(list);
  else addEventListener("resize", place);
}

cards().forEach(decorate);
addTile();
paintStrip(null);

// ── 첫 분석은 몇 분 걸린다 — 지금 뭘 하는 중인지 여기서 말한다 ──────────
// 등록 직후 사용자가 보는 화면이 정확히 이것이고, 여태 "첫 분석 진행 중"에서 굳어
// 있었다. 무슨 일이 일어나는 중인지 안 보이면 빈 대시보드만 보고 떠난다.
// 단계 이름표는 서버가 실어 보낸다(stage.STAGE_LABELS) — 사본을 여기 두지 않는다.
// 상태는 처음에 한 번 읽고(띠·신선도 막대용), 진행 중인 줄이 남아 있는 동안만 5초마다 다시 읽는다.
(function () {
  const STAGES = window.__STAGES__ || {};
  async function tick() {
    let st;
    try { st = await (await fetch("/api/run/status")).json(); } catch (e) { return; }
    let left = 0;
    const scale = barScale(st);
    cards().forEach(li => {
      const nm = li.querySelector(".nm");
      const s = nm && st[nm.textContent];
      if (!s) return;
      if (li.classList.contains("waiting")) {
        if (s.last_run_at) {
          // 끝난 줄은 상태도 행동도 바뀐다 — 배지는 완료로, 링크는 주요 행동으로.
          li.classList.remove("waiting");
          li.classList.add("done");
          const b = li.querySelector(".badge");
          b.className = "badge ok"; b.textContent = "분석 완료";
          const w = li.querySelector(".when");
          if (w) w.textContent = String(s.last_run_at).slice(0, 16);
          paintAgo(li);
          const a = li.querySelector(".go");
          if (a) a.className = "go sm";
          const p = li.querySelector(".prog");
          if (p) p.remove();
        } else {
          left++;
          const t = s.stage && (STAGES[s.stage] || {}).t;
          const stg = li.querySelector(".stg");
          if (stg && t) stg.textContent = t;
          const bar = li.querySelector(".progress i");
          if (bar && s.pct) bar.style.width = Math.max(6, s.pct) + "%";
        }
      }
      paintFresh(li, s, scale);
    });
    paintStrip(st);
    if (left) return setTimeout(tick, 5000);
    // 다 끝났는데 "몇 분에 걸쳐 수집됩니다"가 남아 있으면 그 문구가 거짓이 된다.
    const note = document.querySelector(".wait-note");
    if (note) note.remove();
  }
  tick();
})();
</script>
