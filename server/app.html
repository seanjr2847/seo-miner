<!-- Pretendard — 한글 자소가 고르고 숫자가 라틴과 같은 리듬으로 선다. dynamic-subset 은
     unicode-range 로 쪼개져 있어 실제로 쓴 글자 묶음만 내려온다.
     못 받으면(오프라인·사내망) --sans 의 뒤쪽 스택으로 조용히 떨어진다 — 화면은 그대로 선다.

     **막지 않게 받는다.** 평범한 stylesheet 링크는 파서를 막아, 뒤에 오는 모든
     스크립트가 이 파일을 받을 때까지 실행되지 않는다. CDN 이 안 열리는
     환경(오프라인·사내망·검사 샌드박스)에서는 그게 곧 이 화면이 죽는 것이다:
     사이트 목록도 진행 상황도 아래 페이지 스크립트가 /api 를 불러 채우는데 그것이
     시작을 못 한다. (이 주석에 여는 스크립트 태그를 글자로 적으면 안 된다 —
     pages.data 가 "문서의 첫 script 태그 앞"에 값을 싣는데, 주석 안의 글자가 그
     자리로 잡히면 window.__SITES__ 가 통째로 주석 속에 묻힌다. 실제로 묻혔다.)
     media=print 로 받으면 이 파일은 처음부터 이 화면의 스타일이
     아니라서 아무것도 막지 않고, 다 받은 뒤 onload 가 media 를 열어 그때 글꼴이
     적용된다. 서체는 읽는 데 필요한 게 아니라 좋아지는 것이므로 늦게 와도 된다.
     (정본은 dashboard.html 의 같은 자리다.) -->
<link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<noscript><link rel="stylesheet"
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"></noscript>
<style>
/* 이 화면이 대시보드의 입구다 — 색·서체·괘선·마이크로 라벨을 dashboard.html 의
   :root 와 한 벌로 맞춘다. 정본은 그쪽이고 여기는 같은 값을 적어 둔 사본이다. */
:root {
  /* --slate 는 부제·눈금·상태 글자를 전부 칠한다. #66726D 은 --stone 위에서 4.09:1 로
     AA 를 못 넘겼다 — 대시보드가 #576259 로 옮겼고 여기도 같은 값을 쓴다. */
  --stone:#E6E9E4; --card:#F7F8F5; --ink:#121714; --slate:#576259;
  --patina:#22705F; --patina-hi:#1A5A4C; --copper:#A9491F; --btn-ink:#F7F8F5;
  --rule:rgba(18,23,20,.13); --rule-soft:rgba(18,23,20,.07);
  --wash:rgba(34,112,95,.10); --wash-copper:rgba(169,73,31,.10);
  --bar:rgba(18,23,20,.05);
  /* 헤더 배경(--ink) 위의 글자 — --slate 는 거기서 2.6:1 이라 안 읽힌다.
     다크에서 --ink 가 밝아지므로 이 셋도 같이 뒤집는다. */
  --on-ink:#E6E9E4; --on-ink-dim:rgba(230,233,228,.68);
  --on-ink-rule:rgba(230,233,228,.26);
  --mono:"Cascadia Mono","Consolas",ui-monospace,SFMono-Regular,Menlo,
         "Malgun Gothic",monospace;
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,
         system-ui,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  /* 마이크로 라벨 한 벌 — dashboard.html 의 --micro 와 같은 값. 자간은 안 벌린다. */
  --micro:500 11px/1.35 var(--sans);
}
@media (prefers-color-scheme: dark) {
  :root {
    --stone:#101513; --card:#19201D; --ink:#E4EBE7; --slate:#8B9791;
    --patina:#57B49C; --patina-hi:#6CC4AD; --copper:#DE8351; --btn-ink:#0E1412;
    --rule:rgba(228,235,231,.16); --rule-soft:rgba(228,235,231,.08);
    --wash:rgba(87,180,156,.14); --wash-copper:rgba(222,131,81,.14);
    --bar:rgba(228,235,231,.06);
    --on-ink:#101513; --on-ink-dim:rgba(16,21,19,.70);
    --on-ink-rule:rgba(16,21,19,.28);
  }
}
* { box-sizing:border-box; }
body { margin:0; background:var(--stone); color:var(--ink);
  font:15px/1.6 var(--sans); word-break:keep-all; overflow-wrap:break-word;
  -webkit-font-smoothing:antialiased; }
:focus-visible { outline:2px solid var(--patina); outline-offset:2px; border-radius:2px; }

/* 한글에 letter-spacing/uppercase 를 걸면 "사 이 트 관 리" 로 벌어진다. 그래서 이
   화면의 위계는 크기·굵기·색으로만 만든다. 트래킹이 붙은 곳은 로고(.mark) 하나뿐이고,
   거기에는 라틴 글자만 들어간다. 등폭(--mono)도 URL·날짜·식별자에만 쓴다. */

.wrap { max-width:1080px; margin:0 auto; padding:0 26px; }

/* ── 버튼: 행동은 전부 이 한 벌이다. 상태는 .badge 가 맡는다 ─── */
.go { display:inline-flex; align-items:center; justify-content:center; gap:8px;
  font:600 14px/1 var(--sans); color:var(--btn-ink); background:var(--patina);
  border:1px solid var(--patina); border-radius:3px; padding:12px 20px;
  cursor:pointer; text-decoration:none; white-space:nowrap; }
.go:hover:not(:disabled) { background:var(--patina-hi); border-color:var(--patina-hi); }
/* 비활성은 "옅은 초록"이 아니라 빈 테두리다 — 켜졌는지 껐는지가 형태로 갈린다. */
.go:disabled { background:transparent; color:var(--slate);
  border-color:var(--rule); cursor:default; }
.go.sec { background:transparent; color:var(--ink); border-color:var(--rule); }
.go.sec:hover { background:var(--wash); color:var(--patina); border-color:var(--patina); }
.go.ghost { background:transparent; color:var(--slate); border-color:transparent; }
.go.ghost:hover { background:var(--bar); color:var(--patina); border-color:var(--rule); }
.go.sm { font-size:12.5px; padding:8px 13px; }

/* ── 상태 배지: 절대 버튼 모양이 아니다 ───────────────────── */
.badge { display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  font:500 11.5px/1.35 var(--sans); border:1px solid var(--rule);
  border-radius:999px; padding:4px 10px; color:var(--slate); }
.badge::before { content:""; width:5px; height:5px; border-radius:50%;
  background:currentColor; flex:none; }
.badge.ok { color:var(--patina); border-color:rgba(34,112,95,.35); background:var(--wash); }
.badge.run { color:var(--copper); border-color:rgba(169,73,31,.35);
  background:var(--wash-copper); }
.badge.muted::before { display:none; }

/* ── 헤더: 시추공 상단 케이싱 ─────────────────────────────── */
header { background:var(--ink); color:var(--on-ink); }
.hbar { display:flex; align-items:center; flex-wrap:wrap; gap:8px 16px; padding:13px 26px; }
.mark { font:600 15px/1 var(--mono); letter-spacing:.06em; white-space:nowrap; }
.mark b { color:var(--patina); font-weight:600; }
h1.tag { font:var(--micro); color:var(--on-ink-dim); white-space:nowrap; margin:0; }
.hbar .sp { flex:1; }
.who { font:400 11.5px/1 var(--mono); color:var(--on-ink-dim); overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; min-width:0; }
.lo { margin:0; flex:0 0 auto; }
.lo button { font:400 12px/1 var(--sans); color:var(--on-ink-dim); background:transparent;
  border:1px solid transparent; border-radius:3px; padding:7px 11px; cursor:pointer; }
.lo button:hover { color:var(--on-ink); border-color:var(--on-ink-rule); }

main { padding:0 0 12px; }
section { padding:34px 0 0; }

/* ── 제목 묶음: 대시보드와 같은 문법(eyebrow → h2 → sub) ──── */
.eyebrow, .label { font:var(--micro); color:var(--slate); margin:0; }
.eyebrow { color:var(--patina); }
h2 { font:650 21px/1.35 var(--sans); letter-spacing:-.012em; margin:8px 0 5px; }
.sub { font-size:13.5px; color:var(--slate); margin:0 0 18px; max-width:62ch; }

/* ── 진행 레일: 지금 어느 걸음인지 ────────────────────────── */
.rail { padding-top:26px; }
.rail ol { list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap;
  align-items:center; gap:10px; font:400 12.5px/1 var(--sans); color:var(--slate); }
.rail li { display:flex; align-items:center; gap:8px; }
.rail li + li::before { content:""; width:22px; height:1px; background:var(--rule);
  margin-right:2px; }
.rail .n { display:inline-flex; align-items:center; justify-content:center;
  width:19px; height:19px; border-radius:50%; border:1px solid var(--rule);
  font:600 10px/1 var(--mono); color:var(--slate); }
.rail .here { color:var(--ink); font-weight:600; }
.rail .here .n { border-color:var(--patina); color:var(--patina);
  box-shadow:0 0 0 3px var(--wash); }
.rail .done { color:var(--slate); }
.rail .done .n { background:var(--patina); border-color:var(--patina); color:var(--btn-ink); }
.rail .done .n::before { content:"✓"; }
.rail .done .n b { display:none; }

/* ── 분석 중인 사이트(서버가 채운다) — 사이트가 있으면 이게 주역 ── */
.sites { list-style:none; margin:0; padding:0; background:var(--card);
  border:1px solid var(--rule); border-radius:4px; overflow:hidden; }
.sites li + li { border-top:1px solid var(--rule-soft); }
/* 이름·주소 / 상태 / 행동 세 통. 좁아지면 세 통이 세로로 쌓인다. */
.sites li { display:grid; grid-template-columns:minmax(0,1fr) auto auto;
  align-items:center; gap:10px 16px; padding:15px 16px; }
.sites li:hover { background:var(--bar); }
.s-id { min-width:0; display:grid; gap:2px; }
.nm { font:650 14.5px/1.35 var(--sans); }
.pr { font:400 11.5px/1.4 var(--mono); color:var(--slate); overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; }
.s-state { display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
/* 날짜는 등폭 — 자릿수가 줄마다 같은 자리에 선다. */
.when { font:400 11.5px/1.35 var(--mono); font-variant-numeric:tabular-nums;
  color:var(--slate); white-space:nowrap; }
/* 진행 막대는 행 아래 한 줄을 다 쓴다 — 상태 칸에 끼우면 3px 짜리 실이 된다. */
.prog { grid-column:1 / -1; display:grid; gap:6px; }
.progress { height:3px; border-radius:2px; background:var(--rule); overflow:hidden; }
.progress i { display:block; height:100%; width:6%; background:var(--patina);
  transition:width .5s ease; }
.stg { margin:0; font:400 12px/1.35 var(--sans); color:var(--slate); }
.wait-note { font-size:12.5px; color:var(--slate); margin:12px 0 0; max-width:62ch; }
@media (max-width:620px) {
  .sites li { grid-template-columns:minmax(0,1fr); }
  .sites li .go { justify-self:start; }
}

/* ── 선택 패널 ───────────────────────────────────────────── */
.panel { background:var(--card); border:1px solid var(--rule); border-radius:4px;
  overflow:hidden; }
.ptool { display:flex; align-items:center; gap:14px; padding:10px 15px;
  border-bottom:1px solid var(--rule); background:var(--bar); }
/* display:flex 가 [hidden] 의 display:none 을 이긴다 — 그래서 오류·빈 상태에서도
   "전체 선택" 줄이 남아 있었다. JS 는 hidden 을 켰는데 화면은 안 지워졌다. */
.ptool[hidden] { display:none; }
.all { display:flex; align-items:center; gap:9px; cursor:pointer;
  font:400 12.5px/1 var(--sans); color:var(--slate); }
.cnt { margin-left:auto; font:500 12.5px/1 var(--sans); color:var(--slate);
  font-variant-numeric:tabular-nums; }
.cnt b { color:var(--patina); font-weight:600; }

/* 사이트가 여럿이면 가로로 벌린다. 칸 사이 1px 틈이 그대로 괘선이 된다.
   min(300px,100%) 은 320px 화면에서 트랙이 화면보다 넓어지는 것을 막는다. */
.props { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));
  gap:1px; background:var(--rule-soft); }
/* 빈 상태·오류는 한 칸이 아니라 한 폭 */
.props > .empty, #repo-body > .empty { grid-column:1/-1; }

.prop { display:flex; flex-wrap:wrap; align-items:center; gap:9px 12px;
  padding:12px 15px; cursor:pointer; background:var(--card);
  box-shadow:inset 2px 0 0 transparent; }
/* 칸 배경이 불투명해야 괘선이 비치지 않는다 — 강조는 배경 위에 한 겹 덧칠한다. */
.prop:hover { background-image:linear-gradient(var(--bar),var(--bar)); }
.prop.on { background-image:linear-gradient(var(--wash),var(--wash));
  box-shadow:inset 2px 0 0 var(--patina); }
.prop.off { cursor:default; opacity:.62; }
input[type=checkbox] { width:16px; height:16px; flex:none; margin:0;
  accent-color:var(--patina); cursor:pointer; }
input[type=checkbox]:disabled { cursor:default; }
/* flex-basis 0 — 긴 도메인이 제 길이만큼 자리를 요구해 체크박스를 다음 줄로
   밀어내던 자리다. 줄을 넘기는 대신 말줄임으로 줄인다. */
.pname { flex:1 1 0; min-width:0; font:500 13.5px/1.4 var(--mono);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pname .pfx { color:var(--slate); font-weight:400; }
.lv { flex:0 0 auto; font:400 11.5px/1 var(--sans); color:var(--slate); }
.lv.bad { color:var(--copper); }
.tick { flex:none; width:16px; text-align:center; color:var(--patina); }

select { font:400 12.5px/1 var(--sans); color:var(--ink); background:var(--stone);
  border:1px solid var(--rule); border-radius:2px; padding:7px 9px; cursor:pointer; }
select:hover { border-color:var(--patina); }
/* 체크박스 아래로 정렬. 칸이 하나뿐이면 패널 폭만큼 늘어나므로 상한을 둔다. */
#props select { flex:1 1 100%; margin-left:28px; max-width:420px; }
.prop:not(.on) select { opacity:.6; }

/* ── 빈 상태·오류: 무엇이 없다 / 왜 / 지금 누를 것 ─────────── */
.empty { padding:20px 17px; display:grid; gap:6px; background:var(--card); }
.empty b { font:650 14.5px/1.45 var(--sans); }
.empty span { font-size:13.5px; color:var(--slate); }
.empty a { color:var(--patina); }
/* 셋째 줄이 없으면 사용자는 이 화면에서 할 일이 없다 — 행동 줄을 못 박아 둔다. */
.empty .acts { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:8px; }
.empty.err { border-left:2px solid var(--copper);
  background-image:linear-gradient(var(--wash-copper),var(--wash-copper)); }
.empty.info { border-left:2px solid var(--patina);
  background-image:linear-gradient(var(--wash),var(--wash)); }
/* `.empty a` 가 링크를 patina 로 칠한다 — 그 색이 그대로 patina 바탕 위에 얹히면
   버튼이 글자 없는 초록 사각형이 된다. 버튼은 버튼 색을 되찾아야 한다. */
.empty .acts .go { color:var(--btn-ink); }
.empty .acts .go.sec { color:var(--ink); }

/* ── 다음 한 걸음 ────────────────────────────────────────── */
.act { margin-top:18px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
/* .ptool 과 같은 함정 — display:flex 가 [hidden] 을 이긴다. 고를 것이 하나도 없는
   화면에서 꺼진 "분석 시작"이 남아 있으면 주요 행동이 둘로 보인다. */
.act[hidden] { display:none; }
.msg { font-size:13px; color:var(--slate); }
.msg.err { color:var(--copper); }
.msg.ok { color:var(--patina); }

/* ── 저장소 연결(선택 사항) ──────────────────────────────── */
#repo-sec { margin-top:34px; border-top:1px solid var(--rule-soft); }
/* 사이트마다 한 칸 — 이름 / 저장소 / 저장 상태를 쌓는다. 한 줄로 쭉 늘이면
   1440 에서 이름과 <select> 사이가 손바닥만큼 벌어진다. */
#repo-body { display:grid; gap:1px; background:var(--rule-soft);
  grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr)); }
#repo-body .prop { cursor:default; }
#repo-body .prop:hover { background-image:none; }
#repo-body .pname { flex:1 1 100%; font-family:var(--sans); font-weight:650;
  white-space:normal; }
#repo-body select { flex:1 1 100%; margin-left:0; max-width:520px; font-size:12px; }
.save { flex:1 1 100%; font:400 11.5px/1.4 var(--sans); color:var(--slate); }
.save.ok { color:var(--patina); }
.save.err { color:var(--copper); }

.skel { height:48px;
  background:linear-gradient(90deg,var(--rule-soft),var(--bar),var(--rule-soft));
  background-size:200% 100%; }
@media (prefers-reduced-motion: no-preference) {
  .skel { animation:sh 1.3s linear infinite; }
  @keyframes sh { to { background-position:-200% 0; } }
  .badge.run::before { animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.25; } }
  .prop, .go { transition:background .13s, box-shadow .13s; }
}

/* footer 는 .wrap 이기도 하다 — `.wrap { margin:0 auto }` 가 클래스라 요소 선택자보다
   세다. `footer` 로만 적으면 margin-top 이 조용히 0 이 되고, 바닥 괘선이 위 패널의
   테두리에 겹쳐 붙는다. 그래서 선택자에 클래스를 같이 적는다. */
footer.wrap { margin-top:44px; border-top:1px solid var(--rule-soft);
  padding-top:18px; padding-bottom:44px;   /* 좌우는 .wrap 것을 그대로 쓴다 */
  font:400 12.5px/1.5 var(--sans); color:var(--slate);
  display:flex; gap:20px; align-items:center; flex-wrap:wrap; }
/* display:flex 가 [hidden] 의 display:none 을 이긴다 — .ptool·.act 와 같은 함정이다. */
footer[hidden] { display:none; }
footer a { color:var(--slate); }
footer a:hover { color:var(--patina); }

@media (max-width:560px) {
  .wrap { padding:0 18px; }
  .hbar { padding:13px 18px; }
  /* 넷이 한 줄에 안 들어가면 "로그아웃"만 다음 줄로 떨어져 나간다 — 그러느니
     여백을 통째로 접어 계정 묶음을 둘째 줄 오른쪽에 세운다. */
  .hbar .sp { flex:1 0 100%; height:0; }
  .who { margin-left:auto; }
  .pname { white-space:normal; overflow-wrap:anywhere; }
}
</style>

  <nav class="rail" aria-label="진행 단계">
    <ol>
      <li id="s1" class="here"><span class="n"><b>1</b></span>사이트 선택</li>
      <li id="s2"><span class="n"><b>2</b></span>첫 분석</li>
      <li id="s3"><span class="n"><b>3</b></span>결과 확인</li>
    </ol>
  </nav>

  <!--SITES-->

  <section id="pick">
    <p class="eyebrow" id="eb">1단계 · 사이트 선택</p>
    <h2 id="h">분석할 사이트 선택</h2>
    <p class="sub" id="sub">본인이 서치콘솔에 등록한 사이트만 분석합니다.</p>

    <div class="panel">
      <div class="ptool" id="ptool" hidden>
        <label class="all"><input type="checkbox" id="all">전체 선택</label>
        <span class="cnt" id="cnt"></span>
      </div>
      <div class="props" id="props">
        <div class="skel"></div><div class="skel"></div><div class="skel"></div>
      </div>
    </div>

    <div class="act">
      <button class="go" id="btn" disabled>분석 시작</button>
      <span class="msg" id="msg">사이트를 하나 이상 고르면 시작할 수 있습니다.</span>
    </div>
  </section>

  <section id="repo-sec" hidden>
    <p class="eyebrow">선택 사항</p>
    <h2>GitHub 저장소 연결</h2>
    <p class="sub" id="repo-sub">연결하면 기회 하나를 골라 PR까지 만듭니다. 연결하지 않아도
      측정과 보고서는 그대로 돕니다.</p>
    <div class="panel" id="repo-body"></div>
  </section>
</main>

<footer class="wrap">
  <span>등록한 사이트는 주 1회 자동으로 다시 잽니다.</span>
</footer>

<script>
const $ = id => document.getElementById(id);
const TYPES = [["saas","SaaS / 웹 서비스"],["directory","디렉터리 / 목록형"],["game","게임"],
               ["local_clinic","지역 비즈니스"]];
// 언어-지역 목록은 서버가 실어 보낸다(serp_adapter.LOCALES) — 사본을 여기 두지 않는다.
const LOCALES = window.__LOCALES__ || [["ko-KR", "한국어 · 한국"]];
// 서치콘솔 권한 등급. 미확인 계정은 실적 API 가 막혀 있어 분석이 반드시 실패한다.
const LEVELS = {siteOwner:"소유자", siteFullUser:"전체 권한", siteRestrictedUser:"제한 권한"};
const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const TAKEN = new Set(window.__TAKEN__ || []);
// 로컬 플러그인이 링크로 실어 보낸 사이트 설정 — 서버가 세션에 들고 있다가
// 등록 때 그대로 쓴다. 화면이 할 일은 그 속성을 미리 골라 두는 것뿐이다.
const CARRY = window.__CARRY__ || {};
// 채운 버튼은 화면에 하나다. 사이트가 이미 있으면 그 하나는 줄마다 있는
// [대시보드 열기] 라서, 이 아래 오류·빈 상태의 복구 버튼은 테두리로 내려간다.
const FIX = (window.__SITES__ || []).length ? "go sec" : "go";

function sync() {
  const all = [...document.querySelectorAll("#props input:not(:disabled)")];
  const on = all.filter(i => i.checked);
  all.forEach(i => i.closest(".prop").classList.toggle("on", i.checked));
  $("btn").disabled = !on.length;
  $("btn").textContent = on.length > 1 ? on.length + "개 분석 시작" : "분석 시작";
  // 꺼진 버튼 옆에는 무엇을 해야 켜지는지가 있어야 한다.
  const msg = $("msg");
  if (!msg.classList.contains("err") && !msg.classList.contains("ok"))
    msg.textContent = on.length ? "고른 사이트의 첫 측정이 바로 시작합니다."
                                : "사이트를 하나 이상 고르면 시작할 수 있습니다.";
  $("cnt").innerHTML = "선택 <b>" + on.length + "</b> / " + all.length;
  $("all").checked = all.length > 0 && on.length === all.length;
  $("all").indeterminate = on.length > 0 && on.length < all.length;
}

// what: 무엇이 없다/틀어졌다 · how: 왜 그런가 · acts: 지금 누를 것.
function note(box, kind, what, how, acts, retry) {
  box.innerHTML = '<div class="empty ' + kind + '"><b>' + what + '</b><span>' + how + '</span>' +
    (acts || retry ? '<div class="acts">' + (acts || "") +
      (retry ? '<button class="go sec" type="button">다시 시도</button>' : '') + '</div>' : '') +
    '</div>';
  $("ptool").hidden = true;
  document.querySelector(".act").hidden = true;   // 고를 것이 없으면 시작 버튼도 없다
  if (retry) box.querySelector(".acts .go.sec").addEventListener("click", load);
}

// sc-domain: / https:// 접두사는 흐리게 — 사람이 훑는 건 도메인이다.
function pname(v) {
  const pre = (/^(sc-domain:|https?:\/\/)/.exec(v) || [""])[0];
  return (pre ? '<span class="pfx">' + esc(pre) + "</span>" : "") + esc(v.slice(pre.length));
}

async function load() {
  const box = $("props");
  box.innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  $("ptool").hidden = true;
  try {
    const r = await fetch("/api/properties");
    // 서버는 이유를 detail 에 담아 보낸다(미연결·스코프 부족·일시 실패). 그걸 버리고
    // "권한이 있는지 확인해 주세요"로 뭉개면, 재로그인 한 번이면 끝날 일을 사용자가
    // 서치콘솔 권한 화면에서 찾아 헤맨다 — 실제로 그랬다.
    if (!r.ok) {
      const d = await r.json().catch(() => null);
      throw new Error((d && d.detail) || "");
    }
    const { properties } = await r.json();
    if (!properties.length) {
      note(box, "err", "서치콘솔에 등록된 사이트가 없습니다",
        "서치콘솔에서 사이트를 추가하고 소유를 확인하면 여기 목록에 나타납니다.",
        '<a class="' + FIX + '" href="https://search.google.com/search-console" ' +
        'target="_blank" rel="noopener">서치콘솔 열기</a>', true);
      $("sub").textContent = "서치콘솔에 등록된 사이트가 분석 대상입니다.";
      return;
    }
    // 이미 분석 중인 것은 아래로 — 고를 수 있는 줄이 위에 모인다.
    const rows = properties.slice().sort((a, b) =>
      (TAKEN.has(a.property) ? 1 : 0) - (TAKEN.has(b.property) ? 1 : 0));
    const pickable = rows.filter(p => !TAKEN.has(p.property) && LEVELS[p.level]);
    if (!pickable.length && rows.every(p => TAKEN.has(p.property))) {
      note(box, "info", "서치콘솔 사이트를 모두 분석 중입니다",
        "서치콘솔에 새 사이트를 추가하면 이 목록에 나타납니다.",
        '<a class="go sec" href="https://search.google.com/search-console" ' +
        'target="_blank" rel="noopener">서치콘솔 열기</a>');
      return;
    }
    box.innerHTML = rows.map(p => {
      const v = esc(p.property);
      if (TAKEN.has(p.property))
        return '<div class="prop off"><span class="tick">✓</span>' +
               '<span class="pname">' + pname(p.property) + '</span>' +
               '<span class="lv">분석 중</span></div>';
      if (!LEVELS[p.level])
        return '<div class="prop off"><input type="checkbox" disabled>' +
               '<span class="pname">' + pname(p.property) + '</span>' +
               '<span class="lv bad">소유 확인 필요</span></div>';
      const opts = TYPES.map(t => '<option value="' + t[0] + '">' + t[1] + '</option>').join("");
      // 언어-지역은 사이트마다 고른다 — 어느 나라 검색 결과에서 잴지가 여기서 정해진다.
      const lopts = LOCALES.map(l => '<option value="' + esc(l[0]) + '"' +
        (l[0] === (CARRY.locale || "ko-KR") ? " selected" : "") + '>' + esc(l[1]) + '</option>').join("");
      return '<label class="prop"><input type="checkbox" value="' + v + '">' +
             '<span class="pname">' + pname(p.property) + '</span>' +
             '<span class="lv">' + LEVELS[p.level] + '</span>' +
             '<select data-for="' + v + '" aria-label="' + v + ' 사이트 종류">' + opts + '</select>' +
             '<select data-loc="' + v + '" aria-label="' + v + ' 언어-지역">' + lopts + '</select>' +
             '</label>';
    }).join("");
    $("ptool").hidden = false;
    document.querySelector(".act").hidden = false;
    // 목록이 실제로 떴을 때만 회색 줄을 가리킨다(B33).
    if (TAKEN.size)
      $("sub").textContent = "서치콘솔 사이트를 더 넣을 수 있습니다. 분석 중인 것은 회색입니다.";
    const boxes = box.querySelectorAll("input:not(:disabled)");
    if (boxes.length === 1) boxes[0].checked = true;   // 하나뿐이면 클릭 한 번을 아낀다
    if (CARRY.gsc_property) {
      const b = box.querySelector('input[value="' + CSS.escape(CARRY.gsc_property) + '"]');
      if (b) {
        boxes.forEach(i => { i.checked = false; });    // 실어 온 그것 하나만 고른다
        b.checked = true;
        const sel = b.closest(".prop").querySelector("select");
        if (sel && CARRY.type) sel.value = CARRY.type;
        $("sub").textContent = "플러그인에서 넘어온 설정으로 미리 골라 뒀습니다. " +
          "다른 사이트를 고르셔도 됩니다.";
      } else if (TAKEN.has(CARRY.gsc_property)) {
        $("sub").textContent = "플러그인에서 넘어온 사이트는 이미 분석 중입니다.";
      }
    }
    sync();
  } catch (e) {
    // 서버가 detail 에 담아 보낸 이유가 있으면 그것이 가장 정확하다 — 502 로 죽은 것을
    // "권한을 확인하라"고 뭉개면, 재로그인 한 번이면 끝날 일을 사용자가 서치콘솔
    // 권한 화면에서 찾아 헤맨다. 이유가 안 왔을 때만 흔한 원인을 추측해서 말한다.
    // 단, fetch 가 네트워크로 실패하면 브라우저가 TypeError("Failed to fetch")를 던진다 —
    // 그건 서버가 준 이유가 아니라 브라우저의 영어 문장이라 한국어 화면에 못 내보낸다.
    // 위에서 우리가 던지는 것은 Error 라 TypeError 가 아니다. 그 하나로 갈린다.
    // 두 원인(권한 없음·연결 끊김) 중 어느 쪽도 [다시 시도] 로는 안 고쳐진다 —
    // 실제로 고치는 행동이 주요 버튼이어야 한다. 그리고 처음 온 사람에게는
    // 이 화면이 오류 상자 하나뿐이므로, 고치면 무엇이 되는지도 같이 적는다.
    note(box, "err", "서치콘솔 사이트 목록을 가져오지 못했습니다",
      (e instanceof TypeError ? "" : esc(e.message)) ||
      "구글 계정을 다시 연결하면 소유한 사이트가 목록에 뜨고, 하나를 고르면 첫 측정이 시작합니다.",
      '<a class="' + FIX + '" href="/auth/login">구글 다시 연결</a>', true);
  }
}

$("props").addEventListener("change", sync);
$("all").addEventListener("change", () => {
  document.querySelectorAll("#props input:not(:disabled)")
    .forEach(i => { i.checked = $("all").checked; });
  sync();
});

load();

// ── 첫 분석은 몇 분 걸린다 — 지금 뭘 하는 중인지 여기서 말한다 ──────────
// 등록 직후 사용자가 보는 화면이 정확히 이것이고, 여태 "첫 분석 진행 중"에서 굳어
// 있었다. 무슨 일이 일어나는 중인지 안 보이면 빈 대시보드만 보고 떠난다.
// 단계 이름표는 서버가 실어 보낸다(stage.STAGE_LABELS) — 사본을 여기 두지 않는다.
(function () {
  const rows = [...document.querySelectorAll(".sites li.waiting")];
  if (!rows.length) return;
  const STAGES = window.__STAGES__ || {};
  async function tick() {
    let st;
    try { st = await (await fetch("/api/run/status")).json(); } catch (e) { return; }
    let left = 0;
    rows.forEach(li => {
      const nm = li.querySelector(".nm");
      const s = nm && st[nm.textContent];
      if (!s) return;
      if (s.last_run_at) {
        // 끝난 줄은 상태도 행동도 바뀐다 — 배지는 완료로, 링크는 주요 행동으로.
        li.classList.remove("waiting");
        const b = li.querySelector(".badge");
        b.className = "badge ok"; b.textContent = "분석 완료";
        const w = li.querySelector(".when");
        if (w) w.textContent = String(s.last_run_at).slice(0, 16);
        const a = li.querySelector(".go");
        if (a) a.className = "go sm";
        const p = li.querySelector(".prog");
        if (p) p.remove();
        return;
      }
      left++;
      const t = s.stage && (STAGES[s.stage] || {}).t;
      const stg = li.querySelector(".stg");
      if (stg && t) stg.textContent = t;
      const bar = li.querySelector(".progress i");
      if (bar && s.pct) bar.style.width = Math.max(6, s.pct) + "%";
    });
    if (left) return setTimeout(tick, 5000);
    // 다 끝났는데 "몇 분에 걸쳐 수집됩니다"가 남아 있으면 그 문구가 거짓이 된다.
    const note = document.querySelector(".wait-note");
    if (note) note.remove();
  }
  tick();
})();

// ── 사이트가 이미 있으면 이 화면은 "첫 등록"이 아니라 "추가"다 ──────────
// 머리글이 레일과 어긋나면(레일은 2단계인데 머리는 "1단계"라고 말하면) 어느 쪽을
// 믿어야 할지 알 수 없다 — 그래서 눈썹 줄도 같이 옮긴다.
(function () {
  if (!(window.__SITES__ || []).length) {
    // 사이트가 0개인데 "등록한 사이트는 주 1회 다시 잽니다" 가 서 있으면, 아직
    // 아무것도 등록하지 않은 사람에게 없는 사실을 말하는 것이 된다.
    document.querySelector("footer").hidden = true;
    return;
  }
  const waiting = document.querySelector(".sites li.waiting");
  $("s1").className = "done";
  $("s2").className = waiting ? "here" : "done";
  if (!waiting) $("s3").className = "here";
  $("eb").textContent = waiting ? "2단계 · 첫 분석" : "3단계 · 결과 확인";
  $("h").textContent = "사이트 더 추가";
  // 부제는 목록이 실제로 떴을 때만 "회색으로 표시됩니다"를 말한다 — load() 가
  // 성공 경로에서 덧붙인다. 목록을 못 불러온 화면에서 회색 줄을 가리키면 거짓말이다.
  $("sub").textContent = "서치콘솔 사이트를 더 넣을 수 있습니다.";
})();

// ── 저장소 연결 (/create) ──────────────────────────────────────────────
(async function () {
  var sites = window.__SITES__ || [];
  if (!sites.length) return;
  var sec = $("repo-sec"), body = $("repo-body");
  sec.hidden = false;

  var repos = null;
  try {
    var r = await fetch("/api/repos");
    if (r.status === 428) {
      body.innerHTML = '<div class="empty info"><b>GitHub 계정이 아직 연결되지 않았습니다</b>' +
        '<span>연결하면 기회 하나를 골라 새 브랜치와 PR까지 만듭니다.</span>' +
        '<div class="acts"><a class="go sec" href="/auth/github">GitHub 연결</a></div></div>';
      return;
    }
    repos = (await r.json()).repos || [];
  } catch (e) {
    body.innerHTML = '<div class="empty err"><b>GitHub 저장소 목록을 가져오지 못했습니다</b>' +
      '<span>GitHub 연결이 만료된 것으로 보입니다.</span>' +
      '<div class="acts"><a class="go sec" href="/auth/github">GitHub 다시 연결</a></div></div>';
    return;
  }
  if (!repos.length) {
    body.innerHTML = '<div class="empty err"><b>쓰기 권한이 있는 저장소가 없습니다</b>' +
      '<span>허용할 저장소를 고르면 목록이 돌아옵니다.</span>' +
      '<div class="acts"><a class="go sec" href="/auth/github">저장소 고르기</a></div></div>';
    return;
  }
  body.innerHTML = sites.map(function (s) {
    var opts = ['<option value="">연결 안 함</option>'].concat(repos.map(function (r) {
      return '<option value="' + esc(r.full_name) + '" data-b="' + esc(r.default_branch) +
             '"' + (s.repo === r.full_name ? " selected" : "") + '>' +
             esc(r.full_name) + (r.private ? " (비공개)" : "") + "</option>";
    })).join("");
    return '<div class="prop"><span class="pname">' + esc(s.project) + '</span>' +
           '<select data-site="' + esc(s.project) + '">' + opts + '</select>' +
           '<span class="save"></span></div>';
  }).join("");
  body.addEventListener("change", async function (ev) {
    var sel = ev.target;
    if (!sel.dataset.site) return;
    var opt = sel.selectedOptions[0];
    var st = sel.closest(".prop").querySelector(".save");
    st.className = "save"; st.textContent = "저장 중…";
    try {
      var res = await fetch("/api/repo", {method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({project: sel.dataset.site, repo: sel.value,
                              branch: opt ? (opt.dataset.b || "main") : "main"})});
      if (!res.ok) throw new Error(res.status);
      st.className = "save ok";
      st.textContent = sel.value ? "저장됨. 개선안이 이 저장소로 갑니다." : "연결 해제됨";
    } catch (e) {
      st.className = "save err"; st.textContent = "저장하지 못했습니다. 사이트를 다시 고르면 재시도합니다.";
    }
  });
})();

$("btn").addEventListener("click", async () => {
  const picked = [...document.querySelectorAll("#props input:checked")].map(i => i.value);
  if (!picked.length) return;
  const types = {}, locales = {};
  picked.forEach(v => {
    const s = document.querySelector('#props select[data-for="' + CSS.escape(v) + '"]');
    if (s) types[v] = s.value;
    const l = document.querySelector('#props select[data-loc="' + CSS.escape(v) + '"]');
    if (l) locales[v] = l.value;
  });
  const msg = $("msg"), btn = $("btn");
  msg.className = "msg"; msg.textContent = "";
  btn.disabled = true; btn.textContent = "시작하는 중";
  try {
    const r = await fetch("/api/sites", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ properties: picked, types: types, locales: locales })
    });
    const d = await r.json();
    if (r.ok && d.ok) {
      msg.className = "msg ok"; msg.textContent = "분석을 시작했습니다.";
      setTimeout(function () { location.reload(); }, 600);
      return;
    }
    msg.className = "msg err";
    msg.textContent = (d.failed && d.failed[0] && d.failed[0].error) || d.detail ||
                      "분석을 시작하지 못했습니다. 잠시 후 다시 누르십시오.";
  } catch (e) {
    msg.className = "msg err";
    msg.textContent = "서버에 연결하지 못했습니다. 새로고침하면 다시 붙습니다.";
  }
  btn.disabled = false; sync();
});
</script>
