<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F9F8; --surface:#E9EEEC; --line:#C4CDCA; --hair:#DDE3E1;
  --ink:#12232E; --muted:#5C6E74; --mark:#2D4EA8; --gain:#2E7D5B; --bad:#B3402E;
  --sans:"IBM Plex Sans KR",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  line-height:1.6;word-break:keep-all;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:0 24px}
header{border-bottom:1px solid var(--hair)}
.brandbar{display:flex;align-items:baseline;gap:12px;padding:20px 0}
.logo{font-weight:700;letter-spacing:-.02em;font-size:17px}
.tagline{font-size:13px;color:var(--muted);font-weight:300}
.label{font-size:13px;font-weight:500;color:var(--muted);margin:0 0 16px}
section{padding:40px 0}
section+section{border-top:1px solid var(--hair)}
h1{font-size:24px;font-weight:600;letter-spacing:-.02em;margin:0 0 8px}
.sub{color:var(--muted);font-weight:300;margin:0 0 24px;font-size:15px}

/* ── 측정 중인 사이트 ── */
.sites{list-style:none;padding:0;margin:0;display:grid;gap:1px;background:var(--hair);
  border:1px solid var(--hair)}
.sites li{background:var(--paper)}
.sites a{display:flex;align-items:baseline;gap:12px;padding:15px 16px;text-decoration:none;
  color:inherit;transition:background .12s}
.sites a:hover{background:var(--surface)}
.sites a:focus-visible{outline:2px solid var(--mark);outline-offset:-2px}
.nm{font-weight:600;font-size:15px}
.pr{font-family:var(--mono);font-size:12px;color:var(--muted)}
.st{font-size:12px;color:var(--muted);margin-left:auto;flex:none;text-align:right}
.st.wait{color:var(--mark)}
.st.wait::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--mark);margin-right:6px;vertical-align:middle}
.wait-note{font-size:13px;color:var(--muted);font-weight:300;margin:14px 0 0}

/* ── 속성 고르기 ── */
.props{display:grid;gap:1px;background:var(--hair);border:1px solid var(--hair)}
.prop{background:var(--paper);display:flex;align-items:center;gap:12px;padding:13px 16px;
  cursor:pointer;transition:background .12s}
.prop:hover{background:var(--surface)}
.prop input{width:17px;height:17px;accent-color:var(--mark);flex:none;margin:0;cursor:pointer}
.prop input:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
.pname{font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.prop select{font-family:inherit;font-size:12px;color:var(--muted);background:transparent;
  border:1px solid var(--line);border-radius:2px;padding:3px 6px;flex:none}
.prop select:focus{outline:2px solid var(--mark);outline-offset:1px}
.taken{background:var(--paper);display:flex;align-items:center;gap:12px;padding:13px 16px;
  color:var(--muted);font-size:15px}
.taken::before{content:"✓";color:var(--gain);width:17px;text-align:center;flex:none}

.go{margin-top:22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
button{font-family:inherit;font-size:15px;font-weight:500;color:var(--paper);
  background:var(--ink);border:0;border-radius:2px;padding:12px 22px;cursor:pointer;
  transition:background .15s}
button:hover:not(:disabled){background:var(--mark)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:2px solid var(--mark);outline-offset:3px}
.msg{font-size:14px}
.msg.err{color:var(--bad)}
.msg.ok{color:var(--gain)}
.ghbtn{display:inline-block;background:var(--ink);color:var(--paper);text-decoration:none;
  padding:11px 20px;border-radius:2px;font-weight:500;font-size:15px}
.ghbtn:hover{background:var(--mark)}
#repo-body .prop{cursor:default}
#repo-body select{font-size:14px;max-width:60%}
.skel{height:47px;background:linear-gradient(90deg,var(--surface),var(--paper),var(--surface));
  background-size:200% 100%}
@media(prefers-reduced-motion:no-preference){
  .skel{animation:sh 1.3s linear infinite}
  @keyframes sh{to{background-position:-200% 0}}
  .st.wait::before{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
}
footer{border-top:1px solid var(--hair);padding:20px 0 40px;font-size:13px;
  color:var(--muted);font-weight:300;display:flex;gap:18px}
footer a{color:var(--muted)}
@media(max-width:520px){
  .prop{flex-wrap:wrap}
  .pname{flex:1 1 100%;order:2;white-space:normal}
  .sites a{flex-wrap:wrap}
  .st{margin-left:0;flex-basis:100%;text-align:left}
}
</style>

<header><div class="wrap brandbar">
  <span class="logo">seo-miner</span>
  <span class="tagline">내 사이트</span>
</div></header>

<main class="wrap">
  <!--SITES-->

  <section>
    <h1 id="h">재고 싶은 사이트를 고르세요</h1>
    <p class="sub" id="sub">구글 계정에 연결된 서치콘솔 속성입니다. 고르면 바로 측정을 시작합니다.</p>

    <div class="props" id="props">
      <div class="skel"></div><div class="skel"></div><div class="skel"></div>
    </div>

    <div class="go">
      <button id="btn" disabled>측정 시작</button>
      <span class="msg" id="msg"></span>
    </div>
  </section>

  <section id="repo-sec" hidden>
  <h1>저장소 연결</h1>
  <p class="sub" id="repo-sub">기회를 글로 바꿔 PR 로 올리려면 사이트마다 저장소가 필요합니다.
    main 에 직접 쓰지 않습니다 — 브랜치와 PR 까지만 만들고 머지는 사람이 합니다.</p>
  <div id="repo-body"></div>
</section>
</main>

<footer class="wrap">
  <span>주 1회 자동으로 다시 잽니다</span>
  <a href="/d">대시보드</a>
</footer>

<script>
const $ = id => document.getElementById(id);
const TYPES = [["saas","서비스·도구"],["directory","목록·모음"],["game","게임"],
               ["local_clinic","지역 업장"]];
const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const TAKEN = new Set(window.__TAKEN__ || []);

function sync() {
  const n = document.querySelectorAll("#props input:checked").length;
  $("btn").disabled = !n;
  $("btn").textContent = n > 1 ? n + "개 측정 시작" : "측정 시작";
}

(async () => {
  const box = $("props");
  try {
    const r = await fetch("/api/properties");
    if (!r.ok) throw new Error(r.status);
    const { properties } = await r.json();
    if (!properties.length) {
      box.innerHTML = '<div class="taken">연결된 속성이 없습니다</div>';
      $("sub").textContent = "서치콘솔에 사이트를 먼저 등록한 뒤 이 페이지를 새로고침해 주세요.";
      return;
    }
    box.innerHTML = properties.map(p => {
      const v = esc(p.property);
      if (TAKEN.has(p.property)) return '<div class="taken">' + v + ' — 이미 측정 중</div>';
      const opts = TYPES.map(t => '<option value="' + t[0] + '">' + t[1] + '</option>').join("");
      return '<label class="prop"><input type="checkbox" value="' + v + '">' +
             '<span class="pname">' + v + '</span>' +
             '<select data-for="' + v + '" aria-label="' + v + ' 사이트 종류">' + opts + '</select>' +
             '</label>';
    }).join("");
    box.addEventListener("change", sync);
    const boxes = box.querySelectorAll("input");
    if (boxes.length === 1) boxes[0].checked = true;   // 하나뿐이면 클릭 한 번을 아낀다
    sync();
  } catch (e) {
    box.innerHTML = '<div class="taken">속성을 불러오지 못했습니다 — 새로고침해 주세요</div>';
  }
})();

// ── 저장소 연결 (/create) ──────────────────────────────────────────────
(async function () {
  var sites = window.__SITES__ || [];
  if (!sites.length) return;
  var sec = $("repo-sec"), body = $("repo-body");
  sec.hidden = false;

  var repos = null;
  try {
    var r = await fetch("/api/repos");
    if (r.status === 428) {
      body.innerHTML = '<a class="ghbtn" href="/auth/github">GitHub 연결하기</a>';
      return;
    }
    repos = (await r.json()).repos || [];
  } catch (e) {
    body.innerHTML = '<p class="hint">저장소 목록을 불러오지 못했습니다.</p>';
    return;
  }
  if (!repos.length) {
    body.innerHTML = '<p class="hint">쓰기 권한이 있는 저장소가 없습니다.</p>';
    return;
  }
  body.innerHTML = sites.map(function (s) {
    var opts = ['<option value="">연결 안 함</option>'].concat(repos.map(function (r) {
      return '<option value="' + esc(r.full_name) + '" data-b="' + esc(r.default_branch) +
             '"' + (s.repo === r.full_name ? " selected" : "") + '>' +
             esc(r.full_name) + (r.private ? " (비공개)" : "") + "</option>";
    })).join("");
    return '<div class="prop"><span class="pname">' + esc(s.project) + '</span>' +
           '<select data-site="' + esc(s.project) + '">' + opts + '</select></div>';
  }).join("");
  body.addEventListener("change", async function (ev) {
    var sel = ev.target;
    if (!sel.dataset.site) return;
    var opt = sel.selectedOptions[0];
    await fetch("/api/repo", {method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({project: sel.dataset.site, repo: sel.value,
                            branch: opt ? (opt.dataset.b || "main") : "main"})});
  });
})();

$("btn").addEventListener("click", async () => {
  const picked = [...document.querySelectorAll("#props input:checked")].map(i => i.value);
  if (!picked.length) return;
  const types = {};
  picked.forEach(v => {
    const s = document.querySelector('#props select[data-for="' + CSS.escape(v) + '"]');
    if (s) types[v] = s.value;
  });
  const msg = $("msg"), btn = $("btn");
  msg.className = "msg"; msg.textContent = "";
  btn.disabled = true; btn.textContent = "시작하는 중…";
  try {
    const r = await fetch("/api/sites", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ properties: picked, types: types })
    });
    const d = await r.json();
    if (r.ok && d.ok) {
      msg.className = "msg ok"; msg.textContent = "시작했습니다.";
      setTimeout(function () { location.reload(); }, 600);
      return;
    }
    msg.className = "msg err";
    msg.textContent = (d.failed && d.failed[0] && d.failed[0].error) || d.detail ||
                      "시작하지 못했습니다.";
  } catch (e) {
    msg.className = "msg err"; msg.textContent = "서버에 닿지 못했습니다.";
  }
  btn.disabled = false; sync();
});
</script>
