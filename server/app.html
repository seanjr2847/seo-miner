<style>
/* 이 화면이 대시보드의 입구다 — 토큰은 dashboard.html 의 tokens 블록을 통째로 복사한
   사본이다(정본은 그쪽, 마커 주석까지 글자 하나 다르지 않게). 상자 문법은 하나다:
   면 카드(반경 20px · 옅은 그림자 · 테두리 없음). 알림·빈 상태는 면의 색조로 가른다. */

/* tokens:begin */
:root {
  --canvas:#EEF1EF; --card:#FFFFFF; --sunk:#F5F7F6;
  --ink:#101613; --sub:#5A655F; --mute:#8A948E;
  --line:rgba(16,22,19,.07); --rule:rgba(16,22,19,.14);
  --accent:#1D6455; --accent-ink:#FFFFFF; --accent-wash:#E1F0EB;
  --warn:#9A3F17; --warn-wash:#F8E9E1;
  --info:#3A4F73; --info-wash:#E7ECF4;
  /* 증감은 투명도로 줄이지 않고 전용 색으로 말한다 */
  --up:#1D6455; --up-wash:#E1F0EB; --dn:#9A3F17; --dn-wash:#F8E9E1;
  --r-card:20px; --r-in:12px; --r-pill:999px;
  --shadow:0 1px 2px rgba(16,22,19,.04), 0 10px 28px -12px rgba(16,22,19,.10);

  --gap:16px;
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,

  --mono:"Cascadia Mono","Consolas",ui-monospace,SFMono-Regular,Menlo,
         "Malgun Gothic",monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --canvas:#0C110F; --card:#161D1A; --sunk:#1C2521;
    --ink:#E8EEEA; --sub:#A2AEA7; --mute:#8A978F;
    --line:rgba(232,238,234,.08); --rule:rgba(232,238,234,.16);
    --accent:#57B49C; --accent-ink:#06120E; --accent-wash:#1B2E28;
    --warn:#DE8351; --warn-wash:#33221A;
    --info:#9DB2D6; --info-wash:#1E2632;
    --up:#57B49C; --up-wash:#1B2E28; --dn:#DE8351; --dn-wash:#33221A;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -12px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  --canvas:#0C110F; --card:#161D1A; --sunk:#1C2521;
  --ink:#E8EEEA; --sub:#A2AEA7; --mute:#8A978F;
  --line:rgba(232,238,234,.08); --rule:rgba(232,238,234,.16);
  --accent:#57B49C; --accent-ink:#06120E; --accent-wash:#1B2E28;
  --warn:#DE8351; --warn-wash:#33221A;
  --info:#9DB2D6; --info-wash:#1E2632;
  --up:#57B49C; --up-wash:#1B2E28; --dn:#DE8351; --dn-wash:#33221A;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -12px rgba(0,0,0,.5);
}
/* tokens:end */

/* 이 화면 전용 — 토큰 블록 밖 */
:root {
  --micro:500 var(--fs-1)/1.35 var(--sans);
}
* { box-sizing:border-box; }
body { margin:0; background:var(--canvas); color:var(--ink);
  font:400 var(--fs-2)/1.6 var(--sans); word-break:keep-all; overflow-wrap:break-word;
  -webkit-font-smoothing:antialiased; min-height:100vh; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:8px; }

/* 한글에 letter-spacing/uppercase 를 걸지 않는다. 위계는 크기·굵기·색으로만 만든다.
   등폭(--mono)은 URL·날짜·식별자에만 쓴다. */

.wrap { max-width:1120px; margin:0; padding:0 24px; }

/* ── 버튼: 알약 두 종류(기본·ghost)뿐이다. 상태는 .badge 가 맡는다 ─── */
.go { display:inline-flex; align-items:center; justify-content:center; gap:8px;
  height:44px; padding:0 20px; font:650 var(--fs-2)/1 var(--sans);
  color:var(--accent-ink); background:var(--accent); border:0;
  border-radius:var(--r-pill); cursor:pointer; text-decoration:none; white-space:nowrap; }
.go:hover:not(:disabled) { filter:brightness(1.08); }
/* 비활성은 채운 색이 아니라 면의 색조다 — 켜졌는지 껐는지가 갈린다. */
.go:disabled { background:var(--sunk); color:var(--mute); cursor:default; }
.go.sec, .go.ghost { background:var(--card); color:var(--ink);
  box-shadow:var(--shadow), inset 0 0 0 1px var(--rule); }
.go.sec:hover:not(:disabled), .go.ghost:hover:not(:disabled) { color:var(--accent); filter:none; }

/* ── 상태 배지: 옅은 알약. 절대 버튼 모양이 아니다 ──────────── */
.badge { display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  height:24px; padding:0 10px; border-radius:var(--r-pill);
  font:600 var(--fs-1)/1 var(--sans); background:var(--sunk); color:var(--sub); }
.badge::before { content:""; width:6px; height:6px; border-radius:50%;
  background:currentColor; flex:none; }
.badge.ok { color:var(--up); background:var(--up-wash); }
.badge.run { color:var(--warn); background:var(--warn-wash); }
.badge.muted::before { display:none; }

/* ── 상단바: 로고 · 사용자 ────────────────────────────────── */
header { background:transparent; color:var(--ink); }
.hbar { display:flex; align-items:center; flex-wrap:wrap; gap:8px 16px; padding-top:16px; padding-bottom:0; min-height:60px; }
.mark { display:inline-flex; align-items:center; gap:10px; font:700 var(--fs-3)/1 var(--sans);
  letter-spacing:-.01em; white-space:nowrap; }
.mark b { width:28px; height:28px; border-radius:9px; background:var(--accent);
  color:var(--accent-ink); display:grid; place-items:center; font:700 var(--fs-3)/1 var(--sans); }
.hbar .sp { flex:1; }
.who { font:400 var(--fs-1)/1 var(--mono); color:var(--sub); overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; min-width:0; }
.lo { margin:0; flex:0 0 auto; }
.lo button { font:600 var(--fs-2)/1 var(--sans); color:var(--sub); background:var(--card);
  box-shadow:var(--shadow); border:0; border-radius:var(--r-pill); height:44px;
  padding:0 18px; cursor:pointer; }
.lo button:hover { color:var(--ink); }

main { padding:0 0 12px; }
/* 섹션 구분은 괘선이 아니라 여백이다. */
section { padding:48px 0 0; }

/* ── 페이지 제목(h1) + 제목 묶음: eyebrow → h2 → sub ───────── */
h1 { font:700 var(--fs-5)/1.25 var(--sans); letter-spacing:-.02em; margin:0;
  padding:36px 0 0; max-width:22ch; text-wrap:balance; }
.eyebrow, .label { font:var(--micro); color:var(--sub); margin:0; }
h2 { font:700 var(--fs-4)/1.35 var(--sans); letter-spacing:-.01em; margin:4px 0 4px; }
.sub { font-size:var(--fs-2); color:var(--sub); margin:0 0 16px; max-width:62ch; }

/* ── 진행 단계: 첫 사용 흐름(사이트 0~1개)에서만 서 있다 ────── */
.rail { padding-top:20px; }
.rail ol { list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap;
  align-items:center; gap:10px; font:500 var(--fs-1)/1 var(--sans); color:var(--sub); }
.rail li { display:flex; align-items:center; gap:8px; }
.rail li + li::before { content:""; width:22px; height:1px; background:var(--line);
  margin-right:2px; }
.rail .n { display:inline-flex; align-items:center; justify-content:center;
  width:24px; height:24px; border-radius:50%; background:var(--sunk);
  font:600 var(--fs-1)/1 var(--sans); font-variant-numeric:tabular-nums; color:var(--sub); }
.rail .here { color:var(--ink); font-weight:600; }
.rail .here .n { background:var(--accent-wash); color:var(--accent); }
.rail .done .n { background:var(--accent); color:var(--accent-ink); }
.rail .done .n::before { content:"✓"; }
.rail .done .n b { display:none; }

/* ── 사이트 카드(서버가 채운다) ─────────────────────────────── */
.sites { list-style:none; margin:0; padding:8px 0; background:var(--card);
  border-radius:var(--r-card); box-shadow:var(--shadow); overflow:hidden; }
.sites li + li { border-top:1px solid var(--line); }
/* 이름·주소 / 상태 / 행동 세 통. 좁아지면 세 통이 세로로 쌓인다. */
.sites li { display:grid; grid-template-columns:minmax(0,1fr) auto auto;
  align-items:center; gap:10px 16px; padding:14px 24px; }
.s-id { min-width:0; display:grid; gap:2px; }
.nm { font:650 var(--fs-3)/1.35 var(--sans); }
.pr { font:400 var(--fs-1)/1.4 var(--mono); color:var(--sub); overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; }
.s-state { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
/* 날짜는 등폭 — 자릿수가 줄마다 같은 자리에 선다. */
.when { font:400 var(--fs-1)/1.35 var(--mono); font-variant-numeric:tabular-nums;
  color:var(--sub); white-space:nowrap; }
/* 진행 막대는 행 아래 한 줄을 다 쓴다. */
.prog { grid-column:1 / -1; display:grid; gap:6px; }
.progress { height:6px; border-radius:var(--r-pill); background:var(--accent-wash); overflow:hidden; }
.progress i { display:block; height:100%; width:6%; background:var(--accent);
  border-radius:var(--r-pill); transition:width .5s ease; }
.stg { margin:0; font:400 var(--fs-1)/1.35 var(--sans); color:var(--sub); }
.wait-note { font-size:var(--fs-2); color:var(--sub); margin:12px 0 0; max-width:62ch; }
@media (max-width:620px) {
  .sites li { grid-template-columns:minmax(0,1fr); padding:14px 16px; }
  .sites li .go { justify-self:start; }
}

/* ── 선택 패널: 면 카드 하나, 행 사이는 옅은 선 ────────────── */
.panel { background:var(--card); border-radius:var(--r-card); box-shadow:var(--shadow);
  padding:8px; overflow:hidden; }
.ptool { display:flex; align-items:center; gap:14px; padding:0 16px; min-height:44px;
  background:var(--sunk); border-radius:var(--r-in); margin-bottom:4px; }
/* display:flex 가 [hidden] 의 display:none 을 이긴다 — 오류·빈 상태에서도 "전체 선택"
   줄이 남던 자리다. */
.ptool[hidden] { display:none; }
.all { display:flex; align-items:center; gap:10px; cursor:pointer;
  font:500 var(--fs-2)/1 var(--sans); color:var(--sub); min-height:44px; }
.cnt { margin-left:auto; font:500 var(--fs-2)/1 var(--sans); color:var(--sub);
  font-variant-numeric:tabular-nums; }
.cnt b { color:var(--accent); font-weight:650; }

/* 목록을 못 가져왔거나 비었을 때는 안내 자신이 면이다 — 바깥 카드를 벗겨 상자 안 상자를 없앤다. */
.panel:has(> .props > .empty:only-child) { background:transparent; box-shadow:none; padding:0; }
.props { display:grid; grid-template-columns:minmax(0,1fr); }
.props > .empty { grid-column:1/-1; }
.prop { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px;
  padding:10px 16px; min-height:56px; cursor:pointer; border-radius:var(--r-in); }
.prop + .prop { border-top:1px solid var(--line); border-radius:0; }
.prop:hover { background:var(--sunk); }
.prop.on { background:var(--accent-wash); border-radius:var(--r-in); }
.prop.off { cursor:default; opacity:.62; }
.prop.off:hover { background:transparent; }
input[type=checkbox] { width:20px; height:20px; flex:none; margin:0;
  accent-color:var(--accent); cursor:pointer; }
input[type=checkbox]:disabled { cursor:default; }
/* flex-basis 0 — 긴 도메인이 제 길이만큼 자리를 요구해 체크박스를 다음 줄로
   밀어내던 자리다. 줄을 넘기는 대신 말줄임으로 줄인다. */
.pname { flex:1 1 0; min-width:0; font:500 var(--fs-2)/1.4 var(--mono);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pname .pfx { color:var(--sub); font-weight:400; }
.lv { flex:0 0 auto; font:500 var(--fs-1)/1 var(--sans); color:var(--sub); }
.lv.bad { color:var(--warn); font-weight:600; }
.tick { flex:none; width:20px; text-align:center; color:var(--accent); }

select { font:400 var(--fs-2)/1 var(--sans); color:var(--ink); background:var(--sunk);
  border:0; border-radius:var(--r-in); height:44px; padding:0 12px; cursor:pointer; }
.prop.on select { background:var(--card); }
select:hover { color:var(--accent); }
/* 체크박스 아래로 정렬. 칸이 하나뿐이면 패널 폭만큼 늘어나므로 상한을 둔다. */
#props select { flex:1 1 100%; margin-left:32px; max-width:420px; }
.prop:not(.on) select { opacity:.7; }

/* ── 빈 상태·오류: 면의 색조 + 한 줄 + 버튼 하나 ───────────── */
.empty { padding:20px 24px; display:grid; gap:4px; background:var(--sunk);
  border-radius:var(--r-in); }
.empty b { font:650 var(--fs-3)/1.45 var(--sans); }
.empty span { font-size:var(--fs-2); color:var(--sub); }
.empty a:not(.go) { color:var(--accent); }
/* 셋째 줄이 없으면 사용자는 이 화면에서 할 일이 없다 — 행동 줄을 못 박아 둔다. */
.empty .acts { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:8px; }
.empty.err { background:var(--warn-wash); }
.empty.info { background:var(--accent-wash); }

/* ── 다음 한 걸음 ────────────────────────────────────────── */
.act { margin-top:16px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
/* .ptool 과 같은 함정 — display:flex 가 [hidden] 을 이긴다. */
.act[hidden] { display:none; }
.msg { font-size:var(--fs-2); color:var(--sub); }
.msg.err { color:var(--warn); }
.msg.ok { color:var(--accent); }

.skel { height:56px; border-radius:var(--r-in);
  background:linear-gradient(90deg,var(--sunk),var(--line),var(--sunk));
  background-size:200% 100%; }
.skel + .skel { margin-top:4px; }
@media (prefers-reduced-motion: no-preference) {
  .skel { animation:sh 1.3s linear infinite; }
  @keyframes sh { to { background-position:-200% 0; } }
  .badge.run::before { animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.25; } }
  .prop, .go { transition:background .13s, box-shadow .13s; }
}

/* footer 는 .wrap 이기도 하다 — 클래스를 같이 적어야 .wrap 의 margin 을 이긴다. */
footer.wrap { margin-top:48px; padding-top:0; padding-bottom:44px;
  font:400 var(--fs-1)/1.5 var(--sans); color:var(--sub);
  display:flex; gap:20px; align-items:center; flex-wrap:wrap; }
/* display:flex 가 [hidden] 의 display:none 을 이긴다 — .ptool·.act 와 같은 함정이다. */
footer[hidden] { display:none; }
footer a { color:var(--sub); }
footer a:hover { color:var(--accent); }

@media (max-width:999px) {
  .wrap { padding:0 16px; }
}
@media (max-width:640px) {
  h1 { font-size:var(--fs-4); }
}
@media (max-width:560px) {
  /* 넷이 한 줄에 안 들어가면 "로그아웃"만 다음 줄로 떨어져 나간다 — 그러느니
     여백을 통째로 접어 계정 묶음을 둘째 줄 오른쪽에 세운다. */
  .hbar .sp { flex:1 0 100%; height:0; }
  .who { margin-left:auto; }
  .pname { white-space:normal; overflow-wrap:anywhere; }
}
</style>

<script>
const $ = id => document.getElementById(id);
// 사이트 종류도 서버가 실어 보낸다(dashboard.PROJECT_TYPES) — 사본을 여기 두지 않는다.
// 이 화면은 라벨만 그린다: 등록하는 사람이 id 를 쓸 일이 없다(로컬 설정 화면은 반대다 —
// 거기선 사용자가 그 id 를 파일에 적으므로 `id — 라벨` 로 그린다).
const TYPES = window.__TYPES__ || [["saas", "웹 서비스 · 앱"]];
// 언어-지역 목록은 서버가 실어 보낸다(serp_adapter.LOCALES) — 사본을 여기 두지 않는다.
const LOCALES = window.__LOCALES__ || [["ko-KR", "한국어 · 한국"]];
// 서치콘솔 권한 등급. 미확인 계정은 실적 API 가 막혀 있어 분석이 반드시 실패한다.
const LEVELS = {siteOwner:"소유자", siteFullUser:"전체 권한", siteRestrictedUser:"제한 권한"};
const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const TAKEN = new Set(window.__TAKEN__ || []);
// 로컬 플러그인이 링크로 실어 보낸 사이트 설정 — 서버가 세션에 들고 있다가
// 등록 때 그대로 쓴다. 화면이 할 일은 그 속성을 미리 골라 두는 것뿐이다.
const CARRY = window.__CARRY__ || {};
// 채운 버튼은 화면에 하나다. 사이트가 이미 있으면 그 하나는 줄마다 있는
// [대시보드 열기] 라서, 이 아래 오류·빈 상태의 복구 버튼은 테두리로 내려간다.
const FIX = (window.__SITES__ || []).length ? "go sec" : "go";

function sync() {
  const all = [...document.querySelectorAll("#props input:not(:disabled)")];
  const on = all.filter(i => i.checked);
  all.forEach(i => i.closest(".prop").classList.toggle("on", i.checked));
  $("btn").disabled = !on.length;
  $("btn").textContent = on.length > 1 ? on.length + "개 분석 시작" : "분석 시작";
  // 꺼진 버튼 옆에는 무엇을 해야 켜지는지가 있어야 한다.
  const msg = $("msg");
  if (!msg.classList.contains("err") && !msg.classList.contains("ok"))
    msg.textContent = on.length ? "고른 사이트의 첫 측정이 바로 시작합니다."
                                : "사이트를 하나 이상 고르면 시작할 수 있습니다.";
  $("cnt").innerHTML = "선택 <b>" + on.length + "</b> / " + all.length;
  $("all").checked = all.length > 0 && on.length === all.length;
  $("all").indeterminate = on.length > 0 && on.length < all.length;
}

// what: 무엇이 없다/틀어졌다 · how: 왜 그런가 · acts: 지금 누를 것.
function note(box, kind, what, how, acts, retry) {
  box.innerHTML = '<div class="empty ' + kind + '"><b>' + what + '</b><span>' + how + '</span>' +
    (acts || retry ? '<div class="acts">' + (acts || "") +
      (retry ? '<button class="go sec" type="button">다시 시도</button>' : '') + '</div>' : '') +
    '</div>';
  $("ptool").hidden = true;
  document.querySelector(".act").hidden = true;   // 고를 것이 없으면 시작 버튼도 없다
  if (retry) box.querySelector(".acts .go.sec").addEventListener("click", load);
}

// sc-domain: / https:// 접두사는 흐리게 — 사람이 훑는 건 도메인이다.
function pname(v) {
  const pre = (/^(sc-domain:|https?:\/\/)/.exec(v) || [""])[0];
  return (pre ? '<span class="pfx">' + esc(pre) + "</span>" : "") + esc(v.slice(pre.length));
}

async function load() {
  const box = $("props");
  box.innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  $("ptool").hidden = true;
  try {
    const r = await fetch("/api/properties");
    // 서버는 이유를 detail 에 담아 보낸다(미연결·스코프 부족·일시 실패). 그걸 버리고
    // "권한이 있는지 확인해 주세요"로 뭉개면, 재로그인 한 번이면 끝날 일을 사용자가
    // 서치콘솔 권한 화면에서 찾아 헤맨다 — 실제로 그랬다.
    if (!r.ok) {
      const d = await r.json().catch(() => null);
      throw new Error((d && d.detail) || "");
    }
    const { properties } = await r.json();
    if (!properties.length) {
      note(box, "err", "서치콘솔에 등록된 사이트가 없습니다",
        "서치콘솔에서 사이트를 추가하고 소유를 확인하면 여기 목록에 나타납니다.",
        '<a class="' + FIX + '" href="https://search.google.com/search-console" ' +
        'target="_blank" rel="noopener">서치콘솔 열기</a>', true);
      $("sub").textContent = "서치콘솔에 등록된 사이트가 분석 대상입니다.";
      return;
    }
    // 이미 분석 중인 것은 아래로 — 고를 수 있는 줄이 위에 모인다.
    const rows = properties.slice().sort((a, b) =>
      (TAKEN.has(a.property) ? 1 : 0) - (TAKEN.has(b.property) ? 1 : 0));
    const pickable = rows.filter(p => !TAKEN.has(p.property) && LEVELS[p.level]);
    if (!pickable.length && rows.every(p => TAKEN.has(p.property))) {
      note(box, "info", "서치콘솔 사이트를 모두 등록했습니다",
        "서치콘솔에 새 사이트를 추가하면 이 목록에 나타납니다.",
        '<a class="go sec" href="https://search.google.com/search-console" ' +
        'target="_blank" rel="noopener">서치콘솔 열기</a>');
      return;
    }
    box.innerHTML = rows.map(p => {
      const v = esc(p.property);
      if (TAKEN.has(p.property))
        return '<div class="prop off"><span class="tick">✓</span>' +
               '<span class="pname">' + pname(p.property) + '</span>' +
               '<span class="lv">등록됨</span></div>';
      if (!LEVELS[p.level])
        return '<div class="prop off"><input type="checkbox" disabled>' +
               '<span class="pname">' + pname(p.property) + '</span>' +
               '<span class="lv bad">소유 확인 필요</span></div>';
      const opts = TYPES.map(t => '<option value="' + esc(t[0]) + '">' + esc(t[1]) + '</option>').join("");
      // 언어-지역은 사이트마다 고른다 — 어느 나라 검색 결과에서 잴지가 여기서 정해진다.
      const lopts = LOCALES.map(l => '<option value="' + esc(l[0]) + '"' +
        (l[0] === (CARRY.locale || "ko-KR") ? " selected" : "") + '>' + esc(l[1]) + '</option>').join("");
      return '<label class="prop"><input type="checkbox" value="' + v + '">' +
             '<span class="pname">' + pname(p.property) + '</span>' +
             '<span class="lv">' + LEVELS[p.level] + '</span>' +
             '<select data-for="' + v + '" aria-label="' + v + ' 사이트 종류">' + opts + '</select>' +
             '<select data-loc="' + v + '" aria-label="' + v + ' 언어-지역">' + lopts + '</select>' +
             '</label>';
    }).join("");
    $("ptool").hidden = false;
    document.querySelector(".act").hidden = false;
    // 목록이 실제로 떴을 때만 회색 줄을 가리킨다(B33).
    if (TAKEN.size)
      $("sub").textContent = "서치콘솔 사이트를 더 넣을 수 있습니다. 이미 등록한 것은 회색입니다.";
    const boxes = box.querySelectorAll("input:not(:disabled)");
    if (boxes.length === 1) boxes[0].checked = true;   // 하나뿐이면 클릭 한 번을 아낀다
    if (CARRY.gsc_property) {
      const b = box.querySelector('input[value="' + CSS.escape(CARRY.gsc_property) + '"]');
      if (b) {
        boxes.forEach(i => { i.checked = false; });    // 실어 온 그것 하나만 고른다
        b.checked = true;
        const sel = b.closest(".prop").querySelector("select");
        if (sel && CARRY.type) sel.value = CARRY.type;
        $("sub").textContent = "플러그인에서 넘어온 설정으로 미리 골라 뒀습니다. " +
          "다른 사이트를 고르셔도 됩니다.";
      } else if (TAKEN.has(CARRY.gsc_property)) {
        $("sub").textContent = "플러그인에서 넘어온 사이트는 이미 등록돼 있습니다.";
      }
    }
    sync();
  } catch (e) {
    // 서버가 detail 에 담아 보낸 이유가 있으면 그것이 가장 정확하다 — 502 로 죽은 것을
    // "권한을 확인하라"고 뭉개면, 재로그인 한 번이면 끝날 일을 사용자가 서치콘솔
    // 권한 화면에서 찾아 헤맨다. 이유가 안 왔을 때만 흔한 원인을 추측해서 말한다.
    // 단, fetch 가 네트워크로 실패하면 브라우저가 TypeError("Failed to fetch")를 던진다 —
    // 그건 서버가 준 이유가 아니라 브라우저의 영어 문장이라 한국어 화면에 못 내보낸다.
    // 위에서 우리가 던지는 것은 Error 라 TypeError 가 아니다. 그 하나로 갈린다.
    // 두 원인(권한 없음·연결 끊김) 중 어느 쪽도 [다시 시도] 로는 안 고쳐진다 —
    // 실제로 고치는 행동이 주요 버튼이어야 한다. 그리고 처음 온 사람에게는
    // 이 화면이 오류 상자 하나뿐이므로, 고치면 무엇이 되는지도 같이 적는다.
    note(box, "err", "서치콘솔 사이트 목록을 가져오지 못했습니다",
      (e instanceof TypeError ? "" : esc(e.message)) ||
      "구글 계정을 다시 연결하면 소유한 사이트가 목록에 뜨고, 하나를 고르면 첫 측정이 시작합니다.",
      '<a class="' + FIX + '" href="/auth/login">구글 다시 연결</a>', true);
  }
}

$("props").addEventListener("change", sync);
$("all").addEventListener("change", () => {
  document.querySelectorAll("#props input:not(:disabled)")
    .forEach(i => { i.checked = $("all").checked; });
  sync();
});

load();

// ── 첫 분석은 몇 분 걸린다 — 지금 뭘 하는 중인지 여기서 말한다 ──────────
// 등록 직후 사용자가 보는 화면이 정확히 이것이고, 여태 "첫 분석 진행 중"에서 굳어
// 있었다. 무슨 일이 일어나는 중인지 안 보이면 빈 대시보드만 보고 떠난다.
// 단계 이름표는 서버가 실어 보낸다(stage.STAGE_LABELS) — 사본을 여기 두지 않는다.
(function () {
  const rows = [...document.querySelectorAll(".sites li.waiting")];
  if (!rows.length) return;
  const STAGES = window.__STAGES__ || {};
  async function tick() {
    let st;
    try { st = await (await fetch("/api/run/status")).json(); } catch (e) { return; }
    let left = 0;
    rows.forEach(li => {
      const nm = li.querySelector(".nm");
      const s = nm && st[nm.textContent];
      if (!s) return;
      if (s.last_run_at) {
        // 끝난 줄은 상태도 행동도 바뀐다 — 배지는 완료로, 링크는 주요 행동으로.
        li.classList.remove("waiting");
        const b = li.querySelector(".badge");
        b.className = "badge ok"; b.textContent = "분석 완료";
        const w = li.querySelector(".when");
        if (w) w.textContent = String(s.last_run_at).slice(0, 16);
        const a = li.querySelector(".go");
        if (a) a.className = "go sm";
        const p = li.querySelector(".prog");
        if (p) p.remove();
        return;
      }
      left++;
      const t = s.stage && (STAGES[s.stage] || {}).t;
      const stg = li.querySelector(".stg");
      if (stg && t) stg.textContent = t;
      const bar = li.querySelector(".progress i");
      if (bar && s.pct) bar.style.width = Math.max(6, s.pct) + "%";
    });
    if (left) return setTimeout(tick, 5000);
    // 다 끝났는데 "몇 분에 걸쳐 수집됩니다"가 남아 있으면 그 문구가 거짓이 된다.
    const note = document.querySelector(".wait-note");
    if (note) note.remove();
  }
  tick();
})();

// ── 사이트가 이미 있으면 이 화면은 "첫 등록"이 아니라 "추가"다 ──────────
// 머리글이 레일과 어긋나면(레일은 2단계인데 머리는 "1단계"라고 말하면) 어느 쪽을
// 믿어야 할지 알 수 없다 — 그래서 눈썹 줄도 같이 옮긴다.
// 단, "사이트 더 추가"는 그 자체로 3단계(결과 확인)가 아니다 — 첫 분석이 끝난
// 뒤에도 새 사이트를 넣는 것은 여전히 "고르는" 동작이라, 끝났을 때는 번호를
// 떼고 그냥 "사이트 추가"라고만 말한다. 레일도 다 끝난 뒤엔 안 보여준다 —
// "1·2 완료, 3 진행 중"이 새 사이트를 고르는 화면 위에 계속 떠 있으면, 이미
// 끝난 걸 또 하라는 것처럼 읽힌다.
(function () {
  if (!(window.__SITES__ || []).length) {
    // 사이트가 0개인데 "등록한 사이트는 주 1회 다시 잽니다" 가 서 있으면, 아직
    // 아무것도 등록하지 않은 사람에게 없는 사실을 말하는 것이 된다.
    document.querySelector("footer").hidden = true;
    return;
  }
  // 단계 표시는 첫 사용 흐름(사이트 0~1개)의 것이다 — 여럿이면 어느 걸음인지가 흐려진다.
  if (window.__SITES__.length > 1) document.querySelector(".rail").hidden = true;
  const waiting = document.querySelector(".sites li.waiting");
  $("s1").className = "done";
  $("s2").className = waiting ? "here" : "done";
  if (!waiting) $("s3").className = "here";
  if (waiting) {
    $("eb").textContent = "2단계 · 첫 분석";
  } else {
    // 다 끝난 뒤의 이 섹션은 "결과 확인"이 아니라 그냥 "사이트 추가"다.
    // 결과는 대시보드에서 보고, 여기서는 새 사이트를 고를 뿐이다.
    $("eb").hidden = true;   // 아래 h2 가 "사이트 더 추가"라 같은 말을 두 번 하지 않는다
    document.querySelector(".rail").hidden = true;
  }
  $("h").textContent = "사이트 더 추가";
  // 부제는 목록이 실제로 떴을 때만 "회색으로 표시됩니다"를 말한다 — load() 가
  // 성공 경로에서 덧붙인다. 목록을 못 불러온 화면에서 회색 줄을 가리키면 거짓말이다.
  $("sub").textContent = "서치콘솔 사이트를 더 넣을 수 있습니다.";
})();

$("btn").addEventListener("click", async () => {
  const picked = [...document.querySelectorAll("#props input:checked")].map(i => i.value);
  if (!picked.length) return;
  const types = {}, locales = {};
  picked.forEach(v => {
    const s = document.querySelector('#props select[data-for="' + CSS.escape(v) + '"]');
    if (s) types[v] = s.value;
    const l = document.querySelector('#props select[data-loc="' + CSS.escape(v) + '"]');
    if (l) locales[v] = l.value;
  });
  const msg = $("msg"), btn = $("btn");
  msg.className = "msg"; msg.textContent = "";
  btn.disabled = true; btn.textContent = "시작하는 중";
  try {
    const r = await fetch("/api/sites", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ properties: picked, types: types, locales: locales })
    });
    const d = await r.json();
    if (r.ok && d.ok) {
      msg.className = "msg ok"; msg.textContent = "분석을 시작했습니다.";
      setTimeout(function () { location.reload(); }, 600);
      return;
    }
    msg.className = "msg err";
    msg.textContent = (d.failed && d.failed[0] && d.failed[0].error) || d.detail ||
                      "분석을 시작하지 못했습니다. 잠시 후 다시 누르십시오.";
  } catch (e) {
    msg.className = "msg err";
    msg.textContent = "서버에 연결하지 못했습니다. 새로고침하면 다시 붙습니다.";
  }
  btn.disabled = false; sync();
});
</script>
