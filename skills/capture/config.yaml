# capture global config (skill-level defaults; project yaml overrides)

# Surfaces are constants by design: adding one later = one line here + adapter.
surfaces_available: [gsc, chatgpt, perplexity, gemini, claude, google_serp, naver]
default_ai_engines: [chatgpt, perplexity, gemini]

# AI 크롤러 UA — robots.txt 로 막혔는지 본다 (scoring.ai_bot_blocks).
# 데이터라서 코드가 아니라 여기 있다. 벤더가 봇을 새로 내면 이 목록에 한 줄 더한다.
# 막혀 있으면 그 엔진에서는 인용될 수가 없다 — "콘텐츠가 약하다" 는 진단이
# 오진이 되는 자리다.
ai_bots:
  - GPTBot            # OpenAI 학습
  - OAI-SearchBot     # ChatGPT 검색 색인
  - ChatGPT-User      # ChatGPT 가 사용자 요청으로 페치
  - ClaudeBot         # Anthropic 학습·검색
  - Claude-User       # Claude 가 사용자 요청으로 페치
  - PerplexityBot     # Perplexity 색인
  - Google-Extended   # Gemini 학습 (일반 Googlebot 과 별개다 — 이걸 막아도 검색 색인은 산다)
  - Applebot-Extended
  - Bytespider
  - CCBot             # Common Crawl — 여러 LLM 의 학습 소스

# AI 답변의 링크를 타고 들어온 방문 — GA4 sessionSource 로 가른다(collect_ga4).
# 정규식이 아니라 호스트 목록이다: 이 호스트이거나 그 하위 도메인(www.perplexity.ai)
# 이면 그 호스트로 센다. 서비스가 도메인을 옮기거나 새 챗봇이 생기면 한 줄 더한다 —
# 코드 변경이 아니라 데이터 변경이다. 구글 AI 요약(AI Overviews)은 여기 없다: 그
# 클릭은 GA4 에서 google / organic 으로 잡혀 유기 검색과 안 갈린다.
ai_referrers:
  - chatgpt.com
  - chat.openai.com          # ChatGPT 옛 주소 — 아직 이 출처로 들어오는 세션이 있다
  - perplexity.ai
  - gemini.google.com
  - copilot.microsoft.com
  - claude.ai
  - you.com
  - poe.com
  - chat.deepseek.com
  - chat.mistral.ai

# OpenRouter model slugs drift over time. Update here, not in code.
# ':online' engages OpenRouter's web plugin -> native provider search where supported.
ai_engines:
  chatgpt: "openai/gpt-4o-mini:online"
  perplexity: "perplexity/sonar"
  gemini: "google/gemini-2.5-flash:online"
  claude: "anthropic/claude-sonnet-4.5:online"   # optional 4th engine, same key

# collector.settings() 가 읽는다: CLI > 프로젝트 yaml > 여기 > 코드 리터럴.
defaults:
  gsc_days: 28
  ai_samples: 2          # 비결정성 완화용 2회 샘플 — API 호출·비용 2배 트레이드오프. 급하면 1로.
  throttle: 0.5          # 요청 간격(초) — 자동완성·AI·SERP 공통
  serp_depth: 10
  serp_device: desktop
  # 콤마 구분 문자열이다 — 리스트가 아니다. collector.add_setting 의 type_fn 이
  # 스칼라만 다루기 때문. ""(빈 문자열)이면 분해 수집을 아예 하지 않는다.
  gsc_breakdown: "device,country"   # device|country — 둘 다 [분석] 화면이 쓴다
  page_urls: 20             # /capture pages 가 한 번에 감사할 내 URL 수 (0이면 끔)
  index_urls: 20            # /capture index 가 한 번에 검사할 URL 수 (0이면 끔)
  # /capture vitals — 한 URL 이 기기 수만큼 호출된다(5 × 2 = 10회). PageSpeed
  # Insights 는 무료지만 한 번에 20초쯤 걸려서 page_urls 보다 작게 잡는다.
  vitals_urls: 5            # 속도를 잴 URL 수 (0이면 끔)
  strategy: "mobile,desktop"   # 속도를 잴 기기 — 기기 격차를 보려면 둘 다 필요하다

serp:
  provider: auto           # auto(키 감지) | dataforseo | serper
  # DataForSEO 는 Live 엔드포인트가 **계정당 분당 12회**다. 이 리포가 부르는
  # DataForSEO 경로는 SERP·Labs·볼륨·백링크까지 전부 /live 라 전부 여기 걸린다.
  # 간격은 serp_adapter 가 자동으로 지킨다(호출당 5초) — defaults.throttle 로는
  # 못 막는다. 계정 한도를 올렸으면 SEOMINER_DFS_RPM 로 알려 준다(0 = 간격 없음).
  # dataforseo live advanced ~$0.002-0.003/query (실청구액은 응답에서 기록됨)
  # serper: 크레딧 과금, AI오버뷰 데이터 없음(aio 필드 null)
