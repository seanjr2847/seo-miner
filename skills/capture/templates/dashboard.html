<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>seo-miner 채굴 로그</title>
<!--SNAPSHOT-->
<!-- 뷰 선언표 — dashboard.py 가 뷰 파일들의 view-def 를 모아 여기 박는다.
     화면 위에 얹히는 층(호스팅판)이 화면 이름 여섯과 요소 id 열몇을 다시 나열하는
     대신 window.__VIEWS__ 를 읽으면 된다. -->
<!--MANIFEST-->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>⛏</text></svg>">
<style>
/* 시추 로그(core log) — 순위는 깊이다. 1페이지가 지표면, 20위가 암반.
   색은 광물에서: 녹청(patina)·산화동(copper)·석회(stone). 숫자는 전부 등폭. */
:root {
  --stone:#E6E9E4; --card:#F7F8F5; --ink:#121714; --slate:#66726D;
  --patina:#22705F; --copper:#A9491F; --rule:rgba(18,23,20,.13);
  --rule-soft:rgba(18,23,20,.07); --wash:rgba(34,112,95,.10);
  --wash-copper:rgba(169,73,31,.10); --bar:rgba(18,23,20,.05);
  /* 레일(헤더) 위의 글자. --slate 는 #121714 바탕에서 2.6:1 밖에 안 나온다 —
     읽으라고 적어 둔 글자가 안 읽혔다. 배경이 --ink 이므로 이 셋은 --stone 쪽,
     즉 다크에서 같이 뒤집힌다(안 뒤집으면 밝은 바탕에 밝은 글자가 된다). */
  --on-ink:#E6E9E4; --on-ink-dim:rgba(230,233,228,.66);
  --on-ink-rule:rgba(230,233,228,.26);
  --mono:"Cascadia Mono","Consolas",ui-monospace,SFMono-Regular,Menlo,
         "Malgun Gothic",monospace;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,
         "Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  /* 마이크로 라벨 한 벌 — 눈금·열 이름·배지가 같은 크기로 선다. 한글이 기본이라
     자간을 벌리지 않는다(벌리면 "아 직 안 딴 기 회"가 된다). 위계는 크기·굵기·색. */
  --micro:500 11px/1.35 var(--sans);
}
@media (prefers-color-scheme: dark) {
  :root {
    --stone:#101513; --card:#19201D; --ink:#E4EBE7; --slate:#8B9791;
    --patina:#57B49C; --copper:#DE8351; --rule:rgba(228,235,231,.16);
    --rule-soft:rgba(228,235,231,.08); --wash:rgba(87,180,156,.14);
    --wash-copper:rgba(222,131,81,.14); --bar:rgba(228,235,231,.06);
    --on-ink:#101513; --on-ink-dim:rgba(16,21,19,.68);
    --on-ink-rule:rgba(16,21,19,.28);
  }
}
/* 자간 확장·대문자 변환은 라틴 문자열에만 뜻이 있다. 문서에 실제로 라틴만 적힌
   자리(SERP·RUNS·CREATIONS…)에 이 클래스를 손으로 붙인다. :lang() 으로는 못 가른다
   — 한 요소 안에 한글과 라틴이 섞여 있으면 어느 쪽으로도 못 정한다. */
.lat { font-family:var(--mono); text-transform:uppercase; letter-spacing:.16em; }

* { box-sizing:border-box; }
html { scroll-behavior:smooth; }
body { margin:0; background:var(--stone); color:var(--ink); font:15px/1.6 var(--sans);
  word-break:keep-all; overflow-wrap:break-word; }
:focus-visible { outline:2px solid var(--patina); outline-offset:2px; border-radius:2px; }

/* ── 셸: 레일 + 화면 ──────────────────────────────────────────
   섹션 열넷이 한 페이지에 세로로 쌓여 있었다 — 어디에 뭐가 있는지도, 지금 뭘
   하면 되는지도 안 보인다. 화면 전환은 여태 호스팅 애드온만 갖고 있었고, 그래서
   같은 조립본이 배포마다 다른 몸으로 섰다: 로컬은 파일 순서로 쌓고 호스팅은
   view-def 순서로 옮겨서, 두 화면의 섹션 순서가 실제로 달랐다. 이제 셸이
   원본에 있다 — 애드온은 콘텐츠만 덧붙인다.

   레일은 세 통이다: 머리(무엇을 보고 있나) · 메뉴(어디를 보고 있나) ·
   바닥(무엇을 하나). 셋이 한 줄기로 흐르면 이동하는 것과 실행하는 것이 같은
   모양이 된다. */
header { background:var(--ink); color:var(--on-ink); position:sticky; top:0; z-index:9;
  border-bottom:1px solid var(--ink); }
.hbar { max-width:1180px; margin:0 auto; padding:11px 22px;
  display:flex; align-items:baseline; gap:18px; }
@media (max-width:860px) { .hbar { flex-wrap:wrap; gap:10px 14px; } .tag { display:none; } }

/* 화면 메뉴 — 좁은 화면에서는 가로 스크롤러, 레일에서는 세로 목록 */
#nav { display:flex; gap:2px; overflow-x:auto; scrollbar-width:none;
  max-width:1180px; margin:0 auto; padding:0 22px 9px; }
#nav::-webkit-scrollbar { display:none; }
#nav button { font:500 13px/1 var(--sans); color:var(--on-ink); background:transparent;
  border:0; border-radius:5px; padding:8px 11px; cursor:pointer; white-space:nowrap;
  opacity:.62; }
#nav button:hover { opacity:1; }
#nav button.on { opacity:1; background:var(--patina); color:var(--stone); }

/* 화면 상자 — 한 번에 하나만 선다 */
.view[hidden] { display:none; }
.vh { display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:26px 0 4px; }
.vh h1 { font:650 22px/1.3 var(--sans); letter-spacing:-.01em; margin:0; }
.vh .sp { flex:1; }
.vh + section, .view > section:first-child { border-top:0; }

@media (min-width:1000px) {
  body { display:grid; grid-template-columns:236px minmax(0,1fr); align-items:start; }
  header { grid-column:1; top:0; height:100vh; overflow-y:auto; display:flex;
    flex-direction:column; border-bottom:0; border-right:1px solid var(--ink); }
  .hbar { flex-direction:column; align-items:stretch; gap:9px; padding:18px 16px 4px;
    max-width:none; margin:0; }
  .hbar .sp { display:none; }
  .tag { display:block !important; margin-top:-4px; }
  #nav { flex-direction:column; overflow:visible; padding:14px 10px 0; margin:0;
    max-width:none; flex:1; }
  #nav button { text-align:left; padding:8px 10px; }
  main { grid-column:2; }
  /* 바닥 통 — 실행·보고서·새로고침. 애드온이 여기에 자기 버튼을 넣는다. */
  .rail-foot { margin-top:auto; padding:16px; display:flex; flex-wrap:wrap;
    gap:8px 12px; align-items:center; }
}
@media (max-width:999px) {
  .rail-foot { max-width:1180px; margin:0 auto; padding:0 22px 10px;
    display:flex; gap:8px 12px; flex-wrap:wrap; align-items:center; }
}
.mark { font:600 15px/1 var(--mono); letter-spacing:.06em; white-space:nowrap; }
.mark b { color:var(--patina); font-weight:600; }
.tag { font:var(--micro); color:var(--on-ink-dim); white-space:nowrap; }
@media (max-width:1080px) { .tag { display:none; } }   /* 좁아지면 정체성보다 기능이 먼저 */
.hbar .sp { flex:1; }
#proj, #gscdate { font:600 13px/1 var(--mono); color:var(--on-ink); background:transparent;
  border:0; border-bottom:1px solid var(--patina); padding:3px 26px 3px 2px; cursor:pointer;
  appearance:none; flex:0 0 auto; max-width:220px;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),
                   linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:right 8px center,right 4px center; background-size:4px 4px,4px 4px;
  background-repeat:no-repeat; }
#proj option, #gscdate option { color:var(--ink); background:var(--card); }
/* 과거 시점을 보고 있으면 눈에 띄어야 한다 — 최신인 줄 알고 읽으면 오독이다 */
#gscdate.past { color:var(--copper); border-bottom-color:var(--copper); }
.hbtn { font:500 12px/1 var(--sans); color:var(--on-ink); background:transparent;
  border:1px solid var(--rule); border-radius:2px; padding:6px 11px; cursor:pointer;
  white-space:nowrap; flex:0 0 auto; }
.hbtn:hover { border-color:var(--patina); color:var(--patina); }
.rail-foot .hbtn { border-color:var(--on-ink-rule); }
/* 레일에서는 잘리면 안 된다 — 어느 속성을 보고 있는지가 이 줄의 전부다. */
#meta { font:400 11px/1.5 var(--mono); color:var(--on-ink-dim); min-width:0; }
@media (max-width:999px) { #meta { overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap; } }
/* 축별 수집일 줄. 머리 바(.hbar)는 한 줄 nowrap 이라 여기 것을 거기 넣으면 잘린다 —
   잘린 경고는 경고가 아니다. 그래서 바 아래 자기 줄을 준다. */
.hax { max-width:1180px; margin:0 auto; padding:14px 0 0; display:flex; flex-wrap:wrap;
  gap:2px 14px; font:400 11px/1.5 var(--mono); color:var(--slate); }
.hax[hidden] { display:none; }
.hax b { color:var(--copper); font-weight:600; flex:0 0 100%; }

main { width:100%; max-width:1180px; margin:0 auto; padding:0 22px 80px; min-width:0; }

/* ── 인쇄 ─────────────────────────────────────────────────────
   화면은 한 번에 한 화면만 세운다 — 눌러서 옮겨 다니는 것이니까. 종이에는 누를 데가
   없다. 그래서 인쇄에서는 **숨긴 화면까지 전부 펴서** 차례대로 내보낸다(안 그러면
   보고서를 인쇄했는데 열 화면 중 한 장만 나온다).
   레일은 이동 수단이라 종이에서 빠진다 — 대신 화면 제목이 목차 노릇을 한다. */
.printhead { display:none; }
@media print {
  :root { --stone:#fff; --card:#fff; }
  .printhead { display:block; padding:0 0 14px; margin:0 0 8px;
    border-bottom:1px solid var(--rule); }
  .printhead .t { font:650 15pt/1.3 var(--sans); }
  .printhead .m { font:400 9.5pt/1.6 var(--mono); color:var(--slate); margin-top:5px; }
  body { display:block; background:#fff; font-size:10.5pt; }
  header, .rail-foot, #nav, .tools, .ask, .cmd, .hint { display:none !important; }
  main { max-width:none; padding:0; }
  /* 색으로만 말하는 것이 몇 개 있다(막대·배지·상태) — 배경을 지우면 뜻이 사라진다. */
  * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .view[hidden] { display:block; }
  .view { break-before:page; }
  .view:first-child { break-before:auto; }
  .vh h1 { font-size:17pt; }
  /* 표는 쪽을 넘길 때 머리글을 다시 찍는다 — 안 그러면 두 쪽째부터 열 이름이 없다. */
  .tw { max-height:none; overflow:visible; }
  thead { display:table-header-group; }
  tr, .opp, section { break-inside:avoid; }
  /* 링크 주소를 뒤에 펴 붙이지 않는다 — 이 자리들은 앵커 글자가 이미 URL 이라
     `주소 (주소)` 로 두 번 찍힌다. 글자가 주소와 다른 링크는 짧아서 그냥 읽힌다. */
  /* 가로 스크롤은 종이에 없다 — 넘치는 폭은 잘려 나간다. 줄여서 다 보이게 한다. */
  .logwrap, .tw { overflow:visible; }
  .log { min-width:0; width:100%; }
}
/* 표·차트는 넓어도 읽히지만 산문은 아니다 — 문장이 든 것만 폭을 재운다. */
.sub, .empty, #docban .verdict, #docban .nx, #docban ul, #guide .lead,
.donebar, .loopback { max-width:74ch; }

/* ── 측정 요약: 카드가 아니라 한 줄 계기판 ────────────────── */
.band { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  border-bottom:1px solid var(--rule); }
.band .m { padding:20px 18px 18px 0; border-right:1px solid var(--rule-soft); }
.band .m:last-child { border-right:0; }
@media (max-width:720px) {
  .band { grid-template-columns:repeat(2,1fr); }
  .band .m { padding:15px 14px 14px 0; border-top:1px solid var(--rule-soft); }
  .band .m:nth-child(2n) { border-right:0; }
  .band .m:nth-child(-n+2) { border-top:0; }
  .band .v { font-size:23px; }
}
.band .v { font:600 27px/1 var(--mono); letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
.band .l { font:var(--micro); color:var(--slate); margin-top:9px; }
.band .d { font:500 12px/1 var(--mono); margin-left:7px; letter-spacing:0; }
/* 값만 있는 숫자는 못 읽는다 — 무엇에 대한 얼마인지(기간·직전값)를 한 줄로 붙인다. */
.band .b { font:400 11px/1.4 var(--mono); color:var(--slate); margin-top:5px;
  font-variant-numeric:tabular-nums; letter-spacing:0; }
.band .d em { font-style:normal; font-size:.86em; opacity:.72; margin-left:3px; }
.up { color:var(--patina); } .down { color:var(--copper); } .muted { color:var(--slate); }
/* 스냅샷이 3개 이상 쌓이면 숫자 밑에 흐름이 생긴다 — 2점을 잇는 선은 안 그린다. */
.band .spark { margin-top:10px; }
.band .spark svg { display:block; width:96px; height:22px; }

/* ── 섹션 ───────────────────────────────────────────────── */
section { padding:34px 0 6px; border-top:1px solid var(--rule-soft); }
section:first-of-type { border-top:0; }
.eyebrow { font:var(--micro); color:var(--slate); }
h2 { font:650 19px/1.3 var(--sans); letter-spacing:-.01em; margin:9px 0 3px; }
.sub { font-size:13px; color:var(--slate); margin:0 0 16px; }

/* ── 차트 공통: 깊이 로그·일별 추이·기기 격차가 같은 언어를 쓴다 ── */
/* 좁은 화면에선 축소 대신 가로 스크롤 — 줄여 봐야 글자를 못 읽는다. */
.logwrap { overflow-x:auto; }
.log { width:100%; min-width:720px; display:block; }
.log text { font-family:var(--mono); }
.log .axis { font-size:10.5px; fill:var(--slate); font-family:var(--sans); }
@keyframes grow { from { transform:scaleX(0); } to { transform:scaleX(1); } }
.legend { font:400 12px/1.6 var(--sans); color:var(--slate); margin-top:10px; }
.legend b { color:var(--ink); font-weight:500; }

/* ── 두 칸 ──────────────────────────────────────────────── */
.cols { display:grid; grid-template-columns:1fr 1fr; gap:34px; }
@media (max-width:820px) { .cols { grid-template-columns:1fr; gap:22px; } }

/* ── 표: 상자 없이 괘선만 ───────────────────────────────── */
table { border-collapse:collapse; width:100%; font-size:13.5px; }
th { text-align:left; font:var(--micro); color:var(--slate); padding:0 12px 8px 0;
  border-bottom:1px solid var(--rule); white-space:nowrap; }
td { padding:8px 12px 8px 0; border-bottom:1px solid var(--rule-soft); vertical-align:baseline; }
tr:last-child td { border-bottom:0; }
.num, td.num, th.num { text-align:right; font-family:var(--mono);
  font-variant-numeric:tabular-nums; }
/* 오른쪽 여백을 지우는 건 숫자 열이 **마지막일 때만**이다. 가운데 있는 숫자 열에서
   지우면 다음 칸 글자와 맞붙어 `12` 와 `2026-03-02` 가 `122026-03-02` 로 읽힌다. */
td.num:last-child, th.num:last-child { padding-right:0; }
.kwcell { font-size:13px; }
.empty { font-size:13px; color:var(--slate); padding:14px 0;
  border-top:1px solid var(--rule-soft); }

/* ── 표 살림: 긴 표를 실제로 읽을 수 있게 ─────────────────────
   시추공은 깊다 — 표가 40줄을 넘으면 머리글이 화면 밖으로 나간다. 머리글을 붙박고,
   줄에 손을 얹으면 그 줄만 밝히고, 숫자 열은 눌러서 정렬한다. */
.tw { overflow:auto; max-height:min(62vh,560px); }
.tw table { min-width:100%; }
.tw thead th { position:sticky; top:0; z-index:1; background:var(--stone);
  padding-top:9px; }
tbody tr:hover { background:var(--bar); }
th[data-s] { cursor:pointer; user-select:none; }
th[data-s]:hover { color:var(--patina); }
th[data-s]::after { content:"↕"; margin-left:5px; opacity:.32; font-size:9px; }
th[data-s].asc::after { content:"↑"; opacity:1; color:var(--patina); }
th[data-s].desc::after { content:"↓"; opacity:1; color:var(--patina); }
/* 표 위 도구줄: 찾기·개수·내보내기. 표가 길 때만 붙는다. */
.tools { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:0 0 11px; }
.tools input { width:auto; flex:1 1 190px; max-width:280px; font-size:13px; }
.tools select { width:auto; flex:0 0 auto; font-size:13px; padding-right:2px; }
.tools .n { font:var(--micro); color:var(--slate); white-space:nowrap;
  font-variant-numeric:tabular-nums; }
.tools .sp { flex:1; }
.tools .go { flex:0 0 auto; }
/* 빈 화면은 막다른 길이 아니라 다음 한 걸음 — 뭘 하면 채워지는지 같이 준다. */
.empty .cmd { margin-top:9px; }
/* 열 이름 옆 근거: 이 숫자가 어디서 온 건지 그 자리에서 답한다. */
.hint { display:inline-block; width:13px; height:13px; margin-left:5px; border-radius:50%;
  border:1px solid var(--rule); font:400 9px/11px var(--mono); text-align:center;
  color:var(--slate); cursor:help; vertical-align:1px; }
.hint:hover { border-color:var(--patina); color:var(--patina); }

/* ── 기회 트리아지 ──────────────────────────────────────── */
/* 이 화면의 주인공. 줄에 손을 얹으면 그 줄만 밝힌다 — 표와 같은 문법이다. */
/* 카드는 <details> 다 — 격자는 summary 가 갖는다(자식 셋이 그 안에 있다).
   삼각 마커는 지운다: 카드 전체가 이미 누르는 자리라 마커가 뜻을 더하지 않는다. */
.opp { padding:13px 12px; margin:0 -12px; border-bottom:1px solid var(--rule-soft); }
.opp > summary { display:grid; grid-template-columns:auto 1fr auto; gap:0 14px;
  align-items:baseline; cursor:pointer; list-style:none; }
.opp > summary::-webkit-details-marker { display:none; }
.opp > summary:focus-visible { outline:2px solid var(--patina); outline-offset:3px; }
.opp:hover { background:var(--bar); }
.opp:last-child { border-bottom:0; }
.score { font:600 19px/1 var(--mono); font-variant-numeric:tabular-nums; width:44px;
  text-align:right; }
/* 숫자만 있으면 88이 뭔지 모른다 — 단위를 붙여 100점 만점임을 그 자리에서 말한다. */
.score .u { display:block; font:500 10px/1 var(--sans); color:var(--slate); margin-top:5px; }
.opp .oh { display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
/* 종류는 채워서(분류), 상태는 테를 둘러서(상태) — 두 배지가 서로 다른 말을 한다. */
.opp .kind { font:var(--micro); color:var(--patina); background:var(--wash);
  border-radius:2px; padding:4px 7px; }
.opp .dt { font:400 11px/1 var(--mono); color:var(--slate); }
.opp .target { font-family:var(--mono); font-size:13.5px; margin:7px 0 3px;
  word-break:break-word; }
/* 광맥 게이지: 결정적 점수(scoring.WEIGHTS)를 깊이 로그와 같은 막대 언어로.
   얻는 kind는 녹청, 지키는 kind(순위 하락·내부 경쟁)는 산화동 — 상승/하락과 같은 문법. */
.meter { height:3px; background:var(--bar); border-radius:2px; margin:7px 0 5px; max-width:340px; }
.meter i { display:block; height:100%; border-radius:2px; background:var(--patina); opacity:.75; }
.meter.def i { background:var(--copper); }
@media (prefers-reduced-motion: no-preference) {
  .meter i { animation:grow .5s cubic-bezier(.2,.7,.3,1) both; transform-origin:left; }
}
.opp .kind.k-def { color:var(--copper); background:var(--wash-copper); }
.opp .why { font-size:12.5px; color:var(--slate); }
/* 접힌 카드에서는 근거를 두 줄까지만 — 전문은 펼친 패널이 다시 말한다. */
.opp:not([open]) .why { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  overflow:hidden; }
/* 펼침 패널 — 점수 칸만큼 들여 본문 열과 왼쪽을 맞춘다. */
.det { padding:2px 0 6px 58px; }
@media (max-width:560px) { .det { padding-left:0; } }
.detw { font-size:12.5px; color:var(--ink); margin:10px 0 8px; }
.deta { margin:0 0 12px; padding-left:18px; font-size:12.5px; color:var(--slate); }
.deta li { margin:4px 0; }
.dett { width:100%; border-collapse:collapse; font-size:12px; }
.dett th { text-align:left; font:var(--micro); color:var(--slate); padding:6px 8px;
  border-bottom:1px solid var(--rule); }
.dett td { padding:6px 8px; border-bottom:1px solid var(--rule-soft); vertical-align:top; }
.dett td a { font-family:var(--mono); word-break:break-all; }
.dett .n { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
.detn { font-size:12px; color:var(--slate); margin:8px 0 4px; }
/* 진단 표: 심각한 것은 산화동, 권고는 회색. 색만으로 말하지 않게 첫 칸에 이름을 둔다. */
.dett.fix td:first-child { font:400 11px/1.5 var(--mono); white-space:nowrap; }
.dett.fix tr.lv-bad td:first-child { color:var(--copper); }
.dett.fix tr.lv-warn td:first-child { color:var(--slate); }
.dett.fix td:nth-child(2) { color:var(--slate); }
/* 행 펼침 — 표 안에서 쓰는 자리(순위·색인·모바일). 카드형은 .det 를 그대로 쓴다. */
tr.exp > td { background:var(--bar); padding:12px 8px 16px; }
tr.exp .det { padding-left:0; }
td.expcell { padding:0 !important; }
/* 프롬프트 상자 — 펼침 패널 안의 접이식. 손잡이는 버튼처럼 보이게 둔다. */

.ask > summary::-webkit-details-marker { display:none; }

.pb-h button { font:500 12px/1 var(--sans); color:var(--slate); background:transparent;

.pb-h button:hover { color:var(--patina); border-color:var(--patina); }
.pbox textarea { width:100%; box-sizing:border-box; resize:vertical;

.st-new { color:var(--patina); border-color:var(--patina); }
.st-acked { color:var(--copper); border-color:var(--copper); }
.st-done { color:var(--slate); }
.st-dismissed { color:var(--slate); text-decoration:line-through; }

.stp.here .state { color:var(--copper); }

.cmd { display:inline-block; font:500 12.5px/1 var(--mono); margin:11px 8px 0 0;

.runlog b { color:var(--ink); font-weight:500; }
.runlog .r { display:block; border-bottom:1px solid var(--rule-soft); padding:5px 0; }

/* ── 진단 배너 ─────────────────────────────────────────── */
#docban { border-left:2px solid var(--patina); padding:16px 18px 16px 16px; margin:26px 0 0;
  background:var(--wash); max-width:80ch; }

#docban .nx { font:400 13px/1 var(--sans); margin-top:7px; color:var(--slate); }

#docban ul.must { color:var(--copper); }
#docban details { margin-top:9px; }

#setup { padding:18px 0 22px; }
.step { padding:18px 0; border-top:1px solid var(--rule-soft); }

.step .why { font-size:12.5px; color:var(--slate); margin:0 0 12px; max-width:64ch; }
.step .why b { color:var(--ink); }

.step summary:hover { color:var(--patina); }
.step details .why { margin:12px 0 0; }
.step .why code, .stat { font-family:var(--mono); font-size:11.5px; }

.stat.ok { color:var(--patina); } .stat.todo { color:var(--copper); }
.stat.opt { color:var(--slate); }   /* 안 해도 되는 것 — 경고색으로 찍으면 할 일이 된다 */
label { display:block; font:var(--micro); color:var(--slate); margin:12px 0 5px; }
label b, label a { color:var(--patina); font-weight:500; }
label a { text-decoration:underline; text-underline-offset:2px; }
input, select, textarea { font:400 13.5px/1.4 var(--sans); width:100%; color:var(--ink);

input:focus, select:focus, textarea:focus { border-bottom-color:var(--patina); outline:0; }
input::placeholder, textarea::placeholder { color:var(--slate); opacity:.6; }
textarea { min-height:48px; resize:vertical; }
select { cursor:pointer; }
option { background:var(--card); }

@media (max-width:640px) { .grid { grid-template-columns:1fr; } }
.row { margin-top:16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.go { font:500 13px/1 var(--sans); color:var(--card);
  background:var(--ink); border:1px solid var(--ink); border-radius:2px;
  padding:8px 14px; cursor:pointer; }
.go:hover { background:var(--patina); border-color:var(--patina); }
.go[disabled] { opacity:.45; cursor:default; }
/* 이미 끝난 단계의 버튼은 물러나 있게 — 다시 누를 일이 거의 없다. */
.go.sec { background:transparent; color:var(--slate); border-color:var(--rule); }
.go.sec:hover { color:var(--patina); border-color:var(--patina); }

.msg.bad { color:var(--copper); } .msg.good { color:var(--patina); }
pre { font:400 11.5px/1.65 var(--mono); background:var(--stone); border:1px solid var(--rule);
  padding:11px 13px; max-height:210px; overflow:auto; white-space:pre-wrap; margin:14px 0 0; }

<body>
<header>
  <div class="hbar">
    <span class="mark">seo<b>·</b>miner</span>

       window.__VIEWS__ 로 실어 보낸다(문서 머리의 MANIFEST 자리). -->
  <nav id="nav" aria-label="화면"></nav>

<main>
  <!-- 종이 표지. 화면에서는 레일이 이 말을 하고 있지만 인쇄하면 레일이 빠진다 —
       누구의 무엇을 언제 잰 것인지가 어디에도 안 남는다. -->
  <div class="printhead" id="printhead" hidden></div>

  <div id="content">
    <!-- 화면별 렌더러는 자기 파일에서 VIEW(id, render) 로 등록한다 — 이 함수는 뷰
         파일들보다 먼저 있어야 한다. 조립 순서가 곧 화면 순서다.
         같은 뷰가 자기 파일에서 선언한 나머지(제목·담는 요소·채우는 단계)는
         window.__VIEWS__ 에 데이터로 실린다 — 문서 머리의 MANIFEST 자리다. -->
<script>
const VIEW_RENDER = [];
function VIEW(id, render) { VIEW_RENDER.push({id, render}); }
</script>
    <!--VIEWS-->

<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = n => (n ?? 0).toLocaleString("ko-KR");
// 배포마다 같은 것을 다르게 부른다: 플러그인은 쉬운 우리말("손댈 것"), 호스팅판은
// 마케터가 쓰는 서치콘솔 한국어 UI 표준어("개선 기회"). 화면이 **자기가 고른다**.
//
// 여태는 호스팅 애드온이 렌더된 한국어를 정규식으로 되짚어 갈아치웠다(terms.js).
// 그래서 원본이 다시 그릴 때마다 또 갈아야 했고, 그 때문에 MutationObserver 가
// 필요했으며, 거기 걸린 모든 손질이 idempotent 여야 했다 — 오늘 그걸 깨서 화면이
// 얼었다. 게다가 그 층은 이미 조용히 낡아 있었다: 규칙 셋은 원본이 문구를 바꾼 뒤
// 대상이 사라졌는데도 남아 있었고, 둘은 좌우가 같은 죽은 규칙이었다.
// 이제 두 문구가 같은 줄에 나란히 선다 — 한쪽만 낡을 수가 없다.
// 표식(SM_HOSTED)은 호스팅 애드온만 세운다(server/assets/dash.html).
const W = (local, web) => (window.SM_HOSTED ? web : local);

// 정적으로 박힌 제목·라벨은 W() 를 못 쓴다(파일에 글자로 있다). 그 자리에는 대체
// 문구를 data-web 속성으로 **나란히** 선언한다: <h2 data-web="개선 기회">다음에 손댈 것</h2>.
// 찾아다니지 않고 선언된 것만, 한 번만 바꾼다 — 속성을 지우므로 다시 훑을 이유가
// 없고, 그래서 MutationObserver 도 필요 없다.
function applyWording(root) {
  if (!window.SM_HOSTED) return;
  (root || document).querySelectorAll("[data-web]").forEach(el => {
    el.textContent = el.dataset.web;
    el.removeAttribute("data-web");
  });
}
// ── 셸: 화면 목록 · 메뉴 · 전환 ───────────────────────────────
// 목록의 정본은 뷰 파일의 view-def 다 — 조립(dashboard.py)이 window.__VIEWS__ 로
// 실어 보낸다. 여기서 이름을 다시 나열하지 않는다: 말없이 어긋난 두 표가 예전에
// 로컬과 호스팅의 섹션 순서를 서로 다르게 만든 원인이다.
// 뒤에 얹히는 층(호스팅 애드온)은 add*/drop 으로 덧붙이고 뺄 뿐이다.
const SM = {
  views: (window.__VIEWS__ || []).map(v => ({
    id: v.id, title: v.title,
    sections: (v.sections || []).slice(), stages: (v.stages || []).slice()})),
  cur: "",

  at(id) { return this.views.findIndex(v => v.id === id); },

  // 원본 뷰에 없는 섹션을 그 화면 안 제자리에 끼운다.
  addSection(viewId, secId, after) {
    const v = this.views[this.at(viewId)];
    if (!v || v.sections.indexOf(secId) >= 0) return;
    const i = v.sections.indexOf(after);
    v.sections.splice(i < 0 ? v.sections.length : i + 1, 0, secId);
    this.sync();
  },

  // 이 배포에 없는 화면을 뺀다 — 호스팅의 [설정], 박제본의 [설정]·[안내].
  drop(id) {
    const i = this.at(id);
    if (i < 0) return;
    const v = this.views.splice(i, 1)[0];
    const box = $("view-" + v.id);
    if (box) box.remove();
    if (this.cur === v.id) this.cur = "";
    this.sync();
  },

  touched: false,
  landed: 0,
  // rank 가 큰 쪽이 이긴다: 설정(2) > 안내(1). 사용자가 메뉴를 누르면 끝.
  land(id, rank) {
    if (this.touched || rank <= this.landed || this.at(id) < 0) return;
    this.landed = rank;
    this.show(id);
  },

  show(id) {
    if (this.at(id) < 0) return;
    this.cur = id;
    for (const v of this.views) {
      const box = $("view-" + v.id);
      if (box) box.hidden = v.id !== id;
    }
    document.querySelectorAll("#nav button").forEach(b => {
      const on = b.dataset.v === id;
      b.classList.toggle("on", on);
      b.setAttribute("aria-current", on ? "page" : "false");
    });
    window.scrollTo(0, 0);
  },

  // 상자를 만들고 섹션을 제자리로 옮긴다. 여러 번 불려도 공짜다 — 애드온이
  // 만드는 섹션은 늦게 생기므로 실제로 여러 번 불린다.
  sync() {
    const c = $("content");
    if (!c) return;
    if (!this.cur && this.views.length) this.cur = this.views[0].id;
    for (const v of this.views) {
      let box = $("view-" + v.id);
      if (!box) {
        box = document.createElement("div");
        box.id = "view-" + v.id;
        box.className = "view";
        box.hidden = v.id !== this.cur;
        box.innerHTML = '<div class="vh"><h1></h1><span class="sp"></span></div>';
        box.querySelector("h1").textContent = v.title;
        c.appendChild(box);
      }
      c.appendChild(box);                       // view-def 순서가 곧 화면 순서다
      for (const id of v.sections) {
        const el = $(id);
        if (!el) continue;
        const sec = el.closest("section") || el;   // band 는 section 이 아니다
        if (sec.parentNode !== box) box.appendChild(sec);
      }
    }
    const nav = $("nav");
    if (nav) {
      nav.innerHTML = "";
      for (const v of this.views) {
        const b = document.createElement("button");
        b.dataset.v = v.id;
        b.textContent = v.title;
        b.onclick = () => { SM.touched = true; SM.show(v.id); };
        nav.appendChild(b);
      }
    }
    this.show(this.at(this.cur) >= 0 ? this.cur
              : (this.views[0] ? this.views[0].id : ""));
    // 상자가 (다시) 섰다고 알린다 — 뒤에 얹히는 층이 화면 머리에 자기 버튼을 단다.
    document.dispatchEvent(new CustomEvent("sm:views"));
  },
};
// 최상위 const 는 global lexical 환경에 들어간다 — 다른 스크립트에서 이름으로는
// 보이지만 window 의 속성은 아니다. 뒤에 얹히는 층이 "셸이 있나"를 물을 자리를 준다.
window.SM = SM;

// base(직전 값)를 주면 증감률까지 같이 말한다 — +471 만으로는 큰 건지 알 수 없다.
const delta = (d, invert, base, tip) => {
  if (!Number.isFinite(d) || d === 0) return "";   // 스냅샷 0개면 NaN — 안 그린다
  const good = invert ? d < 0 : d > 0;
  const sign = d > 0 ? "+" : "−";
  const pc = Number.isFinite(base) && base > 0
    ? `<em>${sign}${(Math.abs(d) / base * 100).toFixed(Math.abs(d) / base < .1 ? 1 : 0)}%</em>`
    : "";
  return `<span class="d ${good ? "up" : "down"}"${tip ? ` title="${esc(tip)}"` : ""}>` +
         `${sign}${Math.abs(d).toLocaleString("ko-KR")}${pc}</span>`;
};
/* ── 펼침 패널 한 벌 ────────────────────────────────────────────────
   기회·키워드·순위·사이트 화면이 같은 것을 보여준다: 어느 페이지 얘기인지(표),
   그 페이지의 무엇이 잘못됐는지(진단), 그래서 뭘 하는지(할 일). 화면마다 따로
   만들면 같은 사실이 네 벌이 되고, 그중 셋은 언젠가 낡는다.
   진단 문장은 여기서 만들지 않는다 — scoring.page_advice 가 만든 것을 그린다. */
const pageTable = rows => !rows || !rows.length ? "" :
  `<table class="dett"><thead><tr><th>페이지</th><th class="n">노출</th>
     <th class="n">클릭</th><th class="n">CTR</th><th class="n">평균순위</th></tr></thead>
   <tbody>${rows.map(r => `<tr><td><a href="${esc(r.page)}" target="_blank"
       rel="noopener">${esc(r.page)}</a></td>
     <td class="n">${num(r.impressions)}</td><td class="n">${num(r.clicks)}</td>
     <td class="n">${r.ctr}%</td><td class="n">${r.position ?? "—"}</td></tr>`).join("")}
   </tbody></table>`;

// 페이지 한 장의 진단 — "지금 이렇다 / 이렇게 바꿔라". audit 이 없으면 왜 없는지 말한다.
const pageFix = (audit, url) => {
  if (!audit)
    return `<p class="detn">${esc(url || "이 페이지")}는 아직 점검하지 않았습니다 —
      [전체 분석 실행]의 <b>내 페이지 점검</b> 단계가 돌면 제목·설명·본문을 직접 읽고
      무엇을 바꿔야 하는지 여기에 적습니다.</p>`;
  const head = `<p class="detn">점검 ${esc(audit.checked_date || "")} ·
    title ${audit.title ? `<b>${esc(audit.title)}</b>` : "없음"} ·
    본문 ${num(audit.words)}단어</p>`;
  const a = audit.advice || [];
  if (!a.length)
    return head + `<p class="detn">규칙으로 잡히는 문제가 없습니다 — 제목·설명·H1·본문 길이·
      구조화 데이터는 정상입니다.</p>`;
  return head + `<table class="dett fix"><thead><tr><th>손댈 자리</th><th>지금</th>
      <th>이렇게</th></tr></thead><tbody>${a.map(x =>
      `<tr class="lv-${esc(x.level)}"><td>${esc(x.tag)}</td><td>${esc(x.now)}</td>
        <td>${esc(x.fix)}</td></tr>`).join("")}</tbody></table>`;
};

// 할 일 목록 — kind 마다 손대는 자리가 다르다. 표는 각 화면이 갖는다.
const playList = (what, acts) => (!what && !(acts || []).length) ? "" :
  `${what ? `<p class="detw">${esc(what)}</p>` : ""}
   <ol class="deta">${(acts || []).map(x => `<li>${esc(x)}</li>`).join("")}</ol>`;

/* ── AI 에게 줄 수정 요청 프롬프트 ─────────────────────────────────
   화면은 "무엇을 바꿔야 하는지"까지 말한다. 그다음 사람이 하는 일은 그것을
   다시 손으로 옮겨 적는 것이었다 — 지금 title 이 무엇이고 검색어가 무엇이고
   본문이 몇 단어인지를. 그 옮겨 적기를 없앤다: 펼친 패널이 이미 아는 사실만
   모아 프롬프트 한 장으로 세우고, 복사 버튼 하나를 둔다.
   여기서 새로 판정하지 않는다 — audit·advice·할 일은 받은 것을 그대로 옮긴다. */
function fixPrompt(c) {
  const L = [];
  L.push("아래 페이지를 검색·AI 노출 관점에서 고쳐 주세요.", "");
  L.push("## 대상");
  if (c.url) L.push(`- 페이지: ${c.url}`);
  (c.queries || []).slice(0, 5).forEach(q => L.push(
    `- 노리는 검색어: ${q.q}` + (q.note ? ` (${q.note})` : "")));
  if (c.problem) L.push(`- 지금 문제: ${c.problem}`);
  L.push("");

  const a = c.audit;
  if (a && !a.error) {
    const h1 = (() => { try { return JSON.parse(a.h1_json || "[]"); } catch (e) { return []; } })();
    const sc = (() => { try { return JSON.parse(a.schema_json || "[]"); } catch (e) { return []; } })();
    L.push(`## 지금 이 페이지 상태 (${a.checked_date || "점검일 미상"} 직접 확인)`);
    L.push(`- title: ${a.title || "(없음)"}${a.title ? ` — ${a.title.length}자` : ""}`);
    L.push(`- meta description: ${a.meta_description || "(없음)"}`);
    L.push(`- H1: ${h1.length ? h1.join(" / ") : "(없음)"}`);
    L.push(`- 본문 길이: ${a.words}단어`);
    L.push(`- 구조화 데이터: ${sc.length ? sc.join(", ") : "(없음)"}`);
    if (a.canonical) L.push(`- canonical: ${a.canonical}`);
    if (a.robots) L.push(`- meta robots: ${a.robots}`);
    L.push("");
    if ((a.advice || []).length) {
      L.push("## 진단 — 고쳐야 할 것");
      a.advice.forEach((x, i) => L.push(`${i + 1}. [${x.tag}] 지금: ${x.now} → ${x.fix}`));
      L.push("");
    }
  } else if (c.url) {
    L.push("## 지금 이 페이지 상태",
           a && a.error ? `- 점검 실패: ${a.error}`
                        : "- 아직 페이지를 직접 점검하지 않았습니다. 아래 내용을 확인하고 고쳐 주세요.",
           "");
  }

  if ((c.acts || []).length) {
    L.push("## 이 상황에서 해야 할 일");
    c.acts.forEach((x, i) => L.push(`${i + 1}. ${x}`));
    L.push("");
  }

  // 만들어 줄 것은 **상황이 정한다.** 색인이 막혔거나 내부 경쟁이거나 모바일이
  // 느린 페이지에 "새 title 3안, 목차, JSON-LD"를 시키면 필요 없는 글이 나오고,
  // 진짜 할 일(robots 한 줄, 301, 이미지 크기)은 그 밑에 묻힌다.
  const want = (c.deliver && c.deliver.length) ? c.deliver : deliverFrom(c.audit);
  L.push("## 만들어 줄 것");
  want.forEach((x, i) => L.push(`${i + 1}. ${x}`));
  L.push(`${want.length + 1}. 위 진단 항목별로 무엇을 어떻게 바꿨는지 한 줄씩`);
  L.push("",
    "규칙: 확인되지 않은 수치·후기·효능 표현은 쓰지 마세요. 사실은 이 페이지에 이미",
    "있는 내용에서만 가져오고, 모르는 것은 [확인 필요]로 남겨 주세요.",
    "위에 없는 것까지 알아서 손대지 마세요 — 요청한 것만 만듭니다.");
  return L.join("\n");
}

// 진단 tag → 그것을 고치는 데 실제로 필요한 산출물. 호출부가 deliver 를 주면
// 그쪽이 이긴다(그 화면이 상황을 더 잘 안다). 단서가 없을 때만 최소 요청.
const DELIVER = {
  "title": "새 title 3안 — 검색어를 앞에 두고, 한글 30자(로마자 60자) 이내",
  "meta description": "meta description 2안 — 한글 80자(로마자 160자) 이내, 클릭할 이유를 담아서",
  "H1": "H1 문안 하나 — title 과 같은 말을 하도록",
  "본문": "본문에 추가할 H2 목록과 각 항목에서 답할 내용 — 이미 있는 문단은 그대로 둡니다",
  "구조화 데이터": "이 페이지에 맞는 구조화 데이터(JSON-LD) 한 벌",
  "robots": "고칠 meta robots 값과 그 태그가 들어갈 위치",
  "canonical": "canonical 을 어느 URL 로 바꿀지와 그 근거",
  "이미지": "alt 가 빠진 이미지에 넣을 문안",
  "내부 링크": "어느 글에서 이 페이지로 링크를 걸지 — 앵커 텍스트까지",
  "가져오기": "이 URL 이 안 열리는 원인 후보와 확인 순서 — 콘텐츠는 손대지 않습니다",
};

function deliverFrom(audit) {
  const tags = [...new Set(((audit && audit.advice) || []).map(x => x.tag))];
  const out = tags.map(t => DELIVER[t]).filter(Boolean);
  return out.length ? out
    : ["지금 이 페이지에서 가장 먼저 고칠 것 세 가지와, 각각 무엇을 무엇으로 바꿀지"];
}

// 프롬프트 상자 — 접혀 있다가 펴면 본문이 보이고, 버튼 하나로 복사한다.
const askBlock = c => {
  const t = fixPrompt(c);
  return `<details class="ask"><summary>AI 에게 수정 요청 — 프롬프트 만들기</summary>
    <div class="pbox">
      <div class="pb-h"><span>그대로 복사해 Claude·ChatGPT 에 붙여 넣으세요</span>
        <button type="button" onclick="copyPrompt(this)">복사</button></div>
      <textarea readonly rows="14" spellcheck="false">${esc(t)}</textarea>
    </div></details>`;
};

// 박제 보고서는 file:// 로도 열린다 — 거기서는 clipboard API 가 막히므로
// execCommand 로 물러선다(둘 다 실패하면 사용자가 직접 고르게 안내한다).
window.copyPrompt = function (btn) {
  const ta = btn.closest(".pbox").querySelector("textarea");
  const done = ok => {
    btn.textContent = ok ? "복사함" : "직접 복사하세요";
    setTimeout(() => { btn.textContent = "복사"; }, 2000);
  };
  ta.select();
  ta.setSelectionRange(0, ta.value.length);
  if (navigator.clipboard && window.isSecureContext)
    return navigator.clipboard.writeText(ta.value).then(() => done(true), () => done(false));
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
  done(ok);
};

// SERP 정수 순위의 Δ — 판정(flat 여부)은 서버(scoring.rank_delta)가 하고,
// 여기서는 마크업만 만든다. 보합일 때 실제 값은 title로 남긴다.
const rankDelta = rd => {
  if (!rd) return "";
  const d = typeof rd === "object" ? rd.delta : rd;
  const flat = typeof rd === "object" ? rd.flat : (Number.isFinite(d) && Math.abs(d) < (RULES.rank_noise || 3));
  if (!Number.isFinite(d)) return "";
  if (flat)
    return `<span class="d muted" title="실제 Δ ${d > 0 ? "+" : d < 0 ? "−" : ""}` +
           `${Math.abs(d)} — ±${(RULES.rank_noise || 3) - 1}칸은 노이즈로 봅니다">보합</span>`;
  return delta(d);
};
// 머리글 표기: ">"로 시작하면 숫자 열(우측 정렬), "?"뒤는 그 열의 근거 설명.
//   ">순위?구글이 보고한 평균 게재순위"
// 줄이 SORT_MIN 을 넘으면 머리글이 정렬 손잡이가 되고 머리글 자체가 붙박인다.
const SORT_MIN = 8;
const table = (heads, rows, empty) => {
  if (!rows.length)
    return `<div class="empty">${empty || W("아직 데이터가 없습니다.", "아직 수집된 데이터가 없습니다.")}</div>`;
  const long = rows.length >= SORT_MIN;
  const th = heads.map((h, i) => {
    const num = h.startsWith(">");
    const [name, why] = h.replace(/^>/, "").split("?");
    return `<th class="${num ? "num" : ""}"${long ? ` data-s="${i}"` : ""}>` +
      `${esc(name)}${why ? `<i class="hint" title="${esc(why)}">i</i>` : ""}</th>`;
  }).join("");
  const t = `<table><thead><tr>${th}</tr></thead><tbody>${rows.join("")}</tbody></table>`;
  return long ? `<div class="tw">${t}</div>` : t;
};

// 표는 화면 밖에서도 이어진다 — 지금 걸러 놓은 목록 그대로 파일로 준다.
// 맨 앞 BOM 이 있어야 엑셀이 한글을 안 깬다. 화면마다 이 함수를 다시 만들고 있었고
// (여덟 벌) 그 사이 처리가 갈라졌다 — 한 벌만 String(c ?? "") 이고 나머지는
// String(c) 라, 빈 칸이 literal "null" 로 나갔다. 여기가 그 한 자리다.
const csv = (name, rows) => {
  const body = "\uFEFF" + rows.map(r => r.map(
    c => `"${String(c ?? "").replace(/"/g, '""')}"`).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([body], {type: "text/csv;charset=utf-8"}));
  a.download = `seo-miner-${name}-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
};

// 정렬은 위임 한 곳에서. 표를 그리는 쪽은 아무것도 안 해도 된다.
document.addEventListener("click", e => {
  const th = e.target.closest("th[data-s]");
  if (!th) return;
  const i = +th.dataset.s, tbl = th.closest("table");
  const desc = !th.classList.contains("desc");
  tbl.querySelectorAll("th[data-s]").forEach(o => o.classList.remove("asc", "desc"));
  th.classList.add(desc ? "desc" : "asc");
  const body = tbl.tBodies[0];
  // 숫자 열이면 숫자로, 아니면 글자로. "12위"·"1,204"·"+8" 같은 표기에서 수를 꺼낸다.
  const key = tr => {
    const c = tr.cells[i]; if (!c) return desc ? -Infinity : Infinity;
    const t = c.textContent.trim();
    if (!th.classList.contains("num")) return t;
    const n = parseFloat(t.replace(/[^\d.+-]/g, ""));
    return Number.isFinite(n) ? n : (desc ? -Infinity : Infinity);
  };
  [...body.rows]
    .sort((a, b) => { const x = key(a), y = key(b);
      const r = typeof x === "string" ? x.localeCompare(y, "ko") : x - y;
      return desc ? -r : r; })
    .forEach(tr => body.appendChild(tr));
});

// 브라우저는 아무 사이트에서나 127.0.0.1로 POST를 보낼 수 있어서 서버가 1회용 토큰을
// 요구한다 — 대시보드를 띄울 때 받은 주소(?t=…)에 들어 있다.
const TOKEN = new URLSearchParams(location.search).get("t") || "";
async function post(path, body) {
  const res = await fetch(path, {method:"POST", body: JSON.stringify(body),
    headers:{"Content-Type":"application/json", "X-Token": TOKEN}});
  return [res.ok, await res.json()];
}

// 임계값은 서버 payload(d.rules)에서만 온다 — JS 리터럴 기본값은 두지 않는다.
let RULES = {};

let READONLY = false;                    // 박제된 기록에서는 상태를 바꿀 수 없다

/* ── 안내: 이 도구를 쓰는 순서 ────────────────────────────────
   순서가 정보다 — 앞 단계가 없으면 뒤 단계는 재료가 없어 돌지 않는다.
   판정(done·지금 할 것·명령)은 서버가 한다(stage.state) — 여기서 다시 판정하면
   화면과 doctor·CLI가 서로 다른 다음 할 일을 말하게 된다. 이 화면은 그리기만 한다. */
// 이 칩의 명령이 정말 이 단계를 돌리는가. id 는 "이 칩이 속한 단계"일 뿐이라
// 그걸로는 못 판단한다 — stage.py 는 재료가 없으면 다른 명령을 내려보낸다
// (질문 0건이면 ai 단계에 `/capture add`, GSC 미연결이면 `GSC 로그인해줘`).
// 그 칩을 실행 버튼으로 바꾸는 층(호스팅판)이 이 값을 본다.
const runnable = s => (s.cmd || "").split(/\s+/).slice(0, 2).join(" ")
                      === `/capture ${s.id}`;

function renderGuide(d) {
  if (READONLY || !d.guide) return;      // 박제본에는 "지금 할 것"이 없다
  const steps = d.guide.steps, here = d.guide.here;
  // data-stage 는 stage.py 가 실어 보낸 단계 id 다. 이름을 다른 말로 쓰는 계층
  // (호스팅판)이 렌더된 한국어를 정규식으로 되짚지 않고 id 로 갈아끼우게 하는 자리다.
  // 제목은 .t 로 감싼다 — 텍스트 노드를 헤집지 않고 통째로 바꿀 수 있어야 한다.
  $("shaft").innerHTML = steps.map((s, i) => {
    const cls = s.done ? "done" : i === here ? "here" : "later";
    return `<div class="stp ${cls}" data-stage="${esc(s.id)}">
      <div class="rail"><div class="dot">${s.done ? "✓" : i + 1}</div></div>
      <div class="body">
        <div class="txt">
          <h3><span class="t">${esc(s.t)}</span> <span class="state">${esc(s.state)}</span>
            ${i === here ? '<span class="now" data-web="권장 조치">지금 할 것</span>' : ""}</h3>
          <p class="gain">${esc(s.gain)}</p>
        </div>
        <div>${s.cmd && !s.done
          ? `<button class="cmd" data-stage="${esc(s.id)}"${runnable(s) ? ' data-runnable="1"' : ""} onclick="copyCmd(this)"
          >${esc(s.cmd)}</button>` : ""}</div>
      </div></div>`;
  }).join("");
  // 되돌아갈 자리는 2번 단계다 — 이름을 여기 박아 두면 stage.py 와 어긋난다.
  const back = steps[1]
    ? `2. <b data-stage="${esc(steps[1].id)}">${esc(steps[1].t)}</b>` : "<b>2번 단계</b>";
  // 배너의 "지금 할 것" 채우기
  const nx = $("nx");
  if (nx) {
    nx.innerHTML = here === -1
      ? `한 바퀴 다 돌았습니다 — ${back}부터 다시 재면 그동안 고친 게 숫자로 보입니다.`
      : `${W("지금 할 것", "권장 조치")} — <b data-stage="${esc(steps[here].id)}">${esc(steps[here].t)}</b>` +
        (steps[here].cmd ? ` <code>${esc(steps[here].cmd)}</code>` : "");
  }
  const db_ = $("donebar");
  if (db_) {
    db_.hidden = here !== -1;
    if (here === -1) db_.innerHTML =
      `✓ <b>한 바퀴 완주</b> — 여섯 단계를 모두 돌았습니다. 다음은
       ${back}부터입니다. 고친 게 순위·인용에 반영됐는지는
       다시 잴 때 숫자로 나옵니다.`;
  }
  // 아직 한 바퀴도 안 돈 프로젝트면 [안내]부터 보여준다 — 개요에 그릴 숫자가 없다.
  if (here !== -1 && !d.progress.gsc_days) SM.land("guide", 1);
  // 이 함수가 방금 새로 그린 자리에도 대체 문구를 입힌다. render() 끝에서도 한 번
  // 돌지만 순서에 기대지 않는다 — applyWording 은 속성을 지우므로 두 번 돌아도 공짜다.
  applyWording($("guide"));
}

function copyCmd(el) {
  navigator.clipboard?.writeText(el.textContent.trim()).then(() => {
    el.classList.add("copied");
    setTimeout(() => el.classList.remove("copied"), 1400);
  });
}

// 화면마다 날짜 축이 다르다 — GSC 스냅샷·순위·색인·기기·AI 는 수집 주기가 따로 돈다.
// 머리말이 축별 날짜를 다 적는 이유가 그것이다: 하나만 적으면 나머지 화면의 숫자까지
// 그 날짜로 읽는다. [기준 수집일]이 되돌리는 것도 GSC 축 하나뿐이라고 여기서 말한다.
const AXES = [["순위", "rank_date"], ["색인", "index_date"],
              ["기기", "device_date"], ["AI 인용", "ai_date"]];

function renderDates(d) {
  const sel = $("gscdate"), dates = d.gsc_dates || [];
  // 박제본에는 서버가 없어 되돌릴 수 없고, 고를 게 하나뿐이면 선택지가 아니다.
  sel.hidden = READONLY || dates.length < 2;
  if (!sel.hidden) {
    sel.innerHTML = dates.map(x =>
      `<option value="${esc(x.date)}">${esc(x.date)}` +
      `${x.period ? ` · ${x.period}일치` : ""}</option>`).join("");
    sel.value = d.gsc_date || "";
  }
  // 최신이 아닌 날을 보고 있으면 눈에 띄게 한다 — 최신인 줄 알고 읽으면 오독이다.
  const past = !!(dates.length && d.gsc_date && d.gsc_date !== dates[0].date);
  sel.classList.toggle("past", past);

  $("meta").textContent = (d.project.gsc_property || d.project.domain || "") +
    ` · 구글 실적 ${d.gsc_date || "아직 없음"}` +
    (d.gsc_period ? ` (${d.gsc_period}일치)` : "");
  // 종이 표지 — 화면에서는 안 보이고 인쇄에만 선다. 값은 위 머리말과 같은 것이다.
  const ph = $("printhead");
  if (ph) {
    const when = window.__SNAPSHOT__ ? `${window.__SNAPSHOT__.exported} 기록` : "";
    ph.innerHTML = `<div class="t">${esc(d.project.name)} — 검색·AI 가시성 보고서</div>` +
      `<div class="m">${esc($("meta").textContent)}${when ? " · " + esc(when) : ""}</div>`;
  }

  const ax = AXES.filter(([, key]) => d[key])
                 .map(([name, key]) => `<span>${esc(name)} ${esc(d[key])}</span>`);
  $("axes").innerHTML = (past
    ? "<b>과거 시점 — 되돌린 것은 구글 실적뿐입니다. 아래 축은 최신 그대로입니다.</b>"
    : "") + ax.join("");
  $("axes").hidden = !ax.length && !past;
}

function render(d) {
  if (d.schema == null) {
    // schema 필드가 없는 옛 박제본 호환 분기: 박제본 호환 분기는 schema 번호 하나로 한다.
    // 옛 박제본에 없는 규칙·필드를 여기서 한 번만 채워 하위 렌더러의 임시 분기들을 대체한다.
    if (!d.rules) {
      RULES = {page1: 10, striking_lo: 4, striking_hi: 20, rank_noise: 3,
               device_gap_pos: 2, device_min_imp: 50};
    }
    if (d.trend && d.gsc_period) {
      d.trend = d.trend.filter(x => x.p == null || x.p === d.gsc_period);
    }
    if (d.striking) {
      for (const r of d.striking) {
        if (r.gap == null && r.pos != null) r.gap = Math.max(0, r.pos - (RULES.page1 || 10));
        if (r.band == null && r.pos != null) r.band = r.pos <= (RULES.page1 || 10) ? "page1" : "page2";
      }
      if (d.striking_page2 == null) {
        d.striking_page2 = d.striking.filter(r => r.band === "page2").length;
      }
    }
    if (d.opps) {
      for (const o of d.opps) {
        if (o.is_defensive == null) {
          o.is_defensive = o.kind === "rank_decay" || o.kind === "cannibalization";
        }
      }
      if (!d.opp_counts) {
        d.opp_counts = {};
        for (const o of d.opps) d.opp_counts[o.kind] = (d.opp_counts[o.kind] || 0) + 1;
      }
    }
    if (d.daily && !d.daily_stats) {
      d.daily_stats = {
        clicks_max: Math.max(...d.daily.map(r => r.clicks || 0), 1),
        impressions_max: Math.max(...d.daily.map(r => r.impressions || 0), 1),
        clicks_sum: d.daily.reduce((a, r) => a + (r.clicks || 0), 0),
        impressions_sum: d.daily.reduce((a, r) => a + (r.impressions || 0), 0),
      };
    }
    if (!d.ai_trend) d.ai_trend = [];
  }

  // KPI의 증감도 같은 기간끼리만 — 서버가 고른 비교 짝(gsc_date/gsc_prev)을 그대로 쓴다.
  // 그냥 마지막 두 줄을 빼면 28일치에서 90일치를 빼는 일이 생긴다.
  if (d.rules) RULES = {...d.rules};  // 서버가 준 경계값이 이 화면의 유일한 기준
  renderGuide(d);
  renderDates(d);
  applyWording();          // 정적 문구는 여기서 한 번 (동적 문구는 각자 W() 로 고른다)

  // 화면 하나가 던져도 나머지는 그려져야 한다 — 예전에는 조립 순서상 뒤에 오는
  // 화면이 통째로 비었고, 왜 비었는지는 아무 데도 안 남았다.
  // 공유 부품은 인자로도 건넨다: 새 뷰는 파일 스코프에서 집어 가지 말고 이걸 받는다.
  const helpers = {$, esc, num, delta, rankDelta, table, csv, post, copyCmd,
                   rules: RULES, readonly: READONLY};
  for (const v of VIEW_RENDER) {
    try { (v.render || v)(d, helpers); }
    catch (e) { console.error(`화면 [${(v && v.id) || "?"}] 을 그리지 못했습니다`, e); }
  }
}

async function loadProjects() {
  const names = await (await fetch("/api/projects")).json();
  const want = decodeURIComponent(location.hash.slice(1));
  $("proj").innerHTML = names.map(n =>
    `<option${n === want ? " selected" : ""}>${esc(n)}</option>`).join("");
  $("proj").hidden = !names.length;      // 사이트가 없으면 빈 칸을 띄우지 않는다
  return names.length ? $("proj").value : null;
}

let PINNED = "";                    // [기준 수집일]로 고정한 GSC 수집일 ("" = 최신)

async function load() {
  const name = $("proj").value;
  // 사이트가 없어도 본문은 세워 둔다 — 첫 등록을 하는 곳이 [설정] 화면이고,
  // 통째로 감추면 거기 갈 길이 없다(배너만 남아 막다른 길이 된다).
  if (!name) { SM.show(SM.at("settings") >= 0 ? "settings" : "guide"); return; }
  location.hash = encodeURIComponent(name);
  const res = await fetch("/api/data?project=" + encodeURIComponent(name) +
                          (PINNED ? "&date=" + encodeURIComponent(PINNED) : ""));
  const d = await res.json();
  if (!res.ok) { $("err").hidden = false; $("err").textContent = d.error || "로드 실패"; return; }
  // 그 사이트에 없는 날을 고정하면 서버가 빈 짝을 준다 — 고정을 풀고 최신으로 되돌린다.
  // (PINNED 를 먼저 비우므로 데이터가 아예 없는 사이트에서도 두 번 이상 돌지 않는다.)
  if (PINNED && !d.gsc_date) { PINNED = ""; return load(); }
  $("err").hidden = true;
  $("content").hidden = false;
  render(d);
  // 사이트가 확정됐다고 한 번 알린다. 뒤에 얹히는 계층(호스팅 애드온)은 자기 데이터를
  // 사이트 이름이 정해진 뒤에야 부를 수 있는데, 여태 그걸 아는 방법이 #proj 의
  // change 이벤트뿐이었다 — 그리고 hash 로 자동 선택될 때는 change 가 안 난다.
  // 그래서 백링크·설정·키워드가 각자 첫 로드에 비어 있었고(백링크는 재시도 루프로,
  // 나머지는 사용자가 탭을 한 번 눌러야 채워지는 식으로) 세 곳이 따로 때워졌다.
  document.dispatchEvent(new CustomEvent("sm:site", {detail: {project: name}}));
}

async function loadDoctor() {
  try {
    // 화면이 보고 있는 사이트를 같이 보낸다 — 안 보내면 서버가 폴더로 추론하고,
    // 추론이 안 되면(사이트 여럿 + 리포 미등록) 안내가 비어 버린다.
    const cur = $("proj") ? $("proj").value : "";
    const d = await (await fetch("/api/doctor?project=" + encodeURIComponent(cur || ""))).json();
    let h = `<div class="verdict">${esc(d.verdict)}</div>`;
    let nxHtml = "";
    if (d.no_project) {
      nxHtml = `아래 <b>2. 첫 사이트</b> 칸을 채우고 [사이트 등록]을 누르시면 됩니다.`;
    } else if (d.guide) {
      const g = d.guide, gh = g.here, gs = g.steps;
      nxHtml = gh === -1
        ? `한 바퀴 다 돌았습니다 — <b>2. 구글 실적 읽기</b>부터 다시 재면 그동안 고친 게
           숫자로 보입니다.`
        : `${W("지금 할 것", "권장 조치")} — <b>${esc(gs[gh].t)}</b>` +
          (gs[gh].cmd ? ` <code>${esc(gs[gh].cmd)}</code>` : "");
    }
    h += `<div class="nx" id="nx">${nxHtml}</div>`;
    if (d.must && d.must.length)
      h += `<ul class="must">${d.must.map(s => `<li>${esc(s.msg || s)}</li>`).join("")}</ul>`;
    if (d.extra && d.extra.length)
      h += `<details><summary>더 켜고 싶으면 ${d.extra.length}개 — 전부 선택입니다</summary>
        <ul>${d.extra.map(s => `<li>${esc(s)}</li>`).join("")}</ul></details>`;
    $("docban").innerHTML = h;
    $("docban").hidden = false;
    renderSetup(d);
  } catch (e) { /* 배너 실패는 치명이 아님 — 본문은 그대로 뜬다 */ }
}

// ── 설정 화면 ──────────────────────────────────────────────
const mark = (id, done, todo) => $(id).outerHTML =
  `<span id="${id}" class="stat ${done ? "ok" : "todo"}">${done ? "완료" : todo}</span>`;

function renderGsc(d) {
  const st = d.gsc_state || (d.gsc_ok ? "connected" : d.gsc_mode ? "pending" : "none"), sa = d.gsc_mode === "service_account";
  $("s-gsc").outerHTML = `<span id="s-gsc" class="stat ${st === "connected" ? "ok" : "todo"}">` +
    (st === "connected" ? "연결됨" : st === "pending" ? "로그인 대기" : "인증 없음") + `</span>`;
  $("why-gsc").innerHTML = st === "connected"
    ? (sa
      ? `<b>연결됐습니다</b> — 서비스 계정(무인 수집) 방식입니다. 로그인 단계가 없는
         대신, 서치콘솔 [설정 → 사용자 및 권한]에 그 계정 이메일을 추가한 속성만
         읽습니다. 확인: <code>connect_gsc.py --status</code>`
      : `<b>연결됐습니다</b> — 구글 로그인이 이미 끝났고 토큰을 보관 중입니다. 다시
         로그인하실 일은 없습니다. 벌크 수집(<code>/capture gsc</code>)과 Claude 즉석
         조회가 이 토큰 한 벌을 같이 씁니다. 내 계정이 소유한 속성은 따로
         권한을 줄 필요가 없습니다.`)
    : st === "pending"
    ? `<b>남은 건 구글 로그인 한 번뿐입니다</b> — 무료, 30초, 준비물 없음. 인증 수단은
       이미 깔려 있어서 <b>구글 클라우드 콘솔에 가실 일이 없습니다</b>.<br>
       아래 <b>[구글 로그인 열기]</b>를 누르면 브라우저 창이 한 번 열립니다 (채팅에
       <code>GSC 로그인해줘</code> 하셔도 같습니다). 로그인이 끝나면 이 칸이 저절로
       <b>[연결됨]</b>으로 바뀝니다.`
      + (d.gsc_bundled
        ? `<br>이때 <b>"확인되지 않은 앱"</b> 경고가 한 번 뜹니다 — <b>[고급] → [이동]</b>을
           누르시면 됩니다. 플러그인이 동봉한 클라이언트라 정상입니다 (경고 없이 쓰시려면
           아래 [내 OAuth 클라이언트 쓰기]).`
        : "")
    : `<b>구글 인증 수단이 없습니다</b> — 로그인에 쓸 OAuth 클라이언트 파일이 이 배포에서
       빠졌습니다. 아래 <b>[내 OAuth 클라이언트 쓰기]</b>에 두 문자열을 넣으시거나,
       콘솔에서 받은 JSON을 다운로드 폴더에 두고 [받은 인증 파일 가져오기]를 누르세요.
       실적(클릭·노출)이 이 도구의 재료라 연결 없이는 측정이 시작되지 않습니다.`;
  $("btn-gsclogin").hidden = st !== "pending";
  // 파일 가져오기는 이제 예외 경로다(직접 받은 JSON·서비스 계정 키) — 물러나 있게.
  $("btn-gsc").className = st === "pending" ? "go sec" : "go";
  // 인증이 아예 없으면 여기가 유일한 출구라 펴 준다. **닫지는 않는다** —
  // 저장 직후 loadDoctor가 다시 그리면서 방금 편 칸을 접으면 결과 문구까지 같이 숨는다.
  if (st === "none") $("own-client").open = true;
}

function renderSetup(d) {
  mark("s-deps", d.core_ok, "설치 필요");
  mark("s-proj", !d.no_project, "아직 없음");
  renderGsc(d);
  $("s-keys").outerHTML = d.nkeys
    ? `<span id="s-keys" class="stat ok">${d.nkeys}개 저장됨</span>`
    : `<span id="s-keys" class="stat opt">없어도 됨</span>`;
  // 마케팅 스킬 칸 — doctor가 빠진 게 있으면 보일 버튼만 켠다. show_setup 과 따로
  // 놀기 때문에 패널이 접혀 있어도 doctor 진단 결과로 표시가 결정된다.
  $("s-skills").outerHTML = d.show_skills_btn
    ? `<span id="s-skills" class="stat todo">일부 누락</span>`
    : `<span id="s-skills" class="stat ok">모두 설치됨</span>`;
  $("btn-skills").hidden = !d.show_skills_btn;
  $("why-skills").innerHTML = d.show_skills_btn
    ? `<b>빠진 마케팅 스킬을 제가 깔아드립니다</b> — 글의 각도와 진단을 맡는 스킬 팩입니다
       (무료). 끝나면 <b>Claude Code를 한 번 재시작</b>하셔야 그 스킬이 화면에 뜹니다.
       없어도 측정·수집은 그대로지만, 글 품질과 진단 깊이만 안 좋아집니다.`
    : `글의 각도와 진단을 맡는 스킬 팩 — 모두 설치됐습니다. (재시작 후엔 이 칸이 사라지거나
       "모두 설치됨"으로 표시됩니다.) 새로 추가하려면 Claude Code를 재시작하세요.`;
  $("btn-depsgsc").hidden = !d.show_deps_gsc_btn;
  $("btn-deps").className = d.core_ok ? "go sec" : "go";
  $("btn-deps").textContent = d.core_ok ? "다시 설치" : "설치하기";
  // 준비물이 덜 됐으면 거기서부터 — 측정 자체가 안 도는 상태다.
  // 호스팅에서는 이 단계들이 유저 몫이 아니다(서버가 키를 댄다) — 거기로 보내면
  // 할 수 있는 게 없는 화면에 떨어진다.
  if (d.show_setup && !window.SM_HOSTED) SM.land("settings", 2);
  prefillProject();
}

// 대시보드를 띄운 폴더(레포)에서 폼 초기값을 채운다 — 이름·도메인은 코드 추론,
// 씨앗 키워드·브랜드·도구는 setup 스킬(Claude)이 레포를 읽고 써 둔 판단 프리필.
// 빈 칸만 채운다 — 사용자가 적던 값을 덮지 않는다.
let PREFILLED = false;
async function prefillProject() {
  if (PREFILLED || !$("p-name")) return;
  PREFILLED = true;
  try {
    const p = await (await fetch("/api/setup/prefill")).json();
    const join = v => Array.isArray(v) ? v.join(", ") : v;
    let used = false;
    for (const [id, key] of [["p-name","name"], ["p-domain","domain"], ["p-gsc","gsc_property"],
                             ["p-locale","locale"], ["p-seeds","seed_keywords"],
                             ["p-alias","brand_aliases"], ["p-tools","tools"],
                             ["p-comp","competitors_manual"]])
      if (p[key] && (!$(id).value || $(id).value === "ko-KR" && key === "locale"))
        { $(id).value = join(p[key]); used = true; }
    if (p.type && $("p-type")) $("p-type").value = p.type;
    if (used) say("m-proj", "이 폴더의 레포에서 읽어 미리 채웠습니다 — 지우거나 고친 뒤 등록만 누르세요.", true);
  } catch (e) { /* 추론 실패는 빈 폼과 같다 */ }
}

function busy(btn, msg, on) {
  $(btn).disabled = on;
  if (on) { $(msg).className = "msg"; $(msg).textContent = "실행 중… 최대 몇 분"; }
}
function say(msg, text, ok) {
  $(msg).className = "msg " + (ok ? "good" : "bad");
  $(msg).textContent = text;
}
function showLog(log) {
  $("setup-log").hidden = !log;
  $("setup-log").textContent = log || "";
}

async function runAction(action, btn, msg, okText) {
  busy(btn, msg, true);
  const [, r] = await post("/api/setup/run", {action});
  busy(btn, msg, false);
  say(msg, r.ok ? okText : "실패했습니다 — 아래 로그를 봐 주세요.", r.ok);
  showLog(r.log);
  loadDoctor();
}

$("btn-deps").addEventListener("click", () =>
  runAction("deps", "btn-deps", "m-deps", "설치했습니다."));
// 마케팅 스킬 설치 — 끝나면 Claude Code 재시작이 필요하므로 그 점을 메시지에 박는다
// (applySkill은 다음 세션이 한다 — 현재 세션은 그 스킬을 모를 수 있다).
$("btn-skills").addEventListener("click", () =>
  runAction("skills", "btn-skills", "m-skills",
    "설치했습니다 — Claude Code를 재시작하시면 화면에 그 스킬이 뜹니다."));
$("btn-depsgsc").addEventListener("click", () =>
  runAction("deps_gsc", "btn-depsgsc", "m-gsc", "설치했습니다."));
// 인증 파일 회수 전에 구글 수집용 부품을 자동으로 깐다 — 이미 있으면 pip이 금방 끝난다.
// 사용자가 "부품 먼저"를 알 필요가 없게 버튼 하나로 잇는다.
$("btn-gsc").addEventListener("click", async () => {
  busy("btn-gsc", "m-gsc", true);
  const [, dep] = await post("/api/setup/run", {action: "deps_gsc"});
  if (!dep.ok) {
    busy("btn-gsc", "m-gsc", false);
    say("m-gsc", "부품 설치에 실패했습니다 — 아래 로그를 봐 주세요.", false);
    showLog(dep.log);
    return;
  }
  const [, r] = await post("/api/setup/run", {action: "gsc"});
  busy("btn-gsc", "m-gsc", false);
  say("m-gsc", r.ok ? "연결했습니다 — 처음 조회할 때 브라우저 로그인 창이 한 번 열립니다. "
                    + "(서비스 계정 키를 넣으셨다면 아래 로그의 남은 일을 봐 주세요.)"
                    : "실패했습니다 — 아래 로그를 봐 주세요.", r.ok);
  showLog(r.log);
  loadDoctor();
});

// 로그인 창을 여는 건 google-auth-oauthlib 이다 — 부품이 없으면 그 자리에서
// 막히므로 여기서도 먼저 깐다(이미 있으면 pip이 금방 끝난다). 버튼 하나로 잇는 이유는
// [파일 가져오기]와 같다: 사용자가 "부품 먼저"를 알 필요가 없어야 한다.
$("btn-gsclogin").addEventListener("click", async () => {
  busy("btn-gsclogin", "m-gsc", true);
  const [, dep] = await post("/api/setup/run", {action: "deps_gsc"});
  if (!dep.ok) {
    busy("btn-gsclogin", "m-gsc", false);
    say("m-gsc", "부품 설치에 실패했습니다 — 아래 로그를 봐 주세요.", false);
    return showLog(dep.log);
  }
  say("m-gsc", "브라우저 창이 열립니다 — 구글 계정으로 로그인해 주세요 " +
               "(\"확인되지 않은 앱\" 경고가 뜨면 [고급] → [이동]).", true);
  const [, r] = await post("/api/setup/run", {action: "gsc_login"});
  busy("btn-gsclogin", "m-gsc", false);
  say("m-gsc", r.ok ? "연결됐습니다 — 이제 실적을 읽을 수 있습니다."
                    : "로그인이 끝나지 않았습니다 — 아래 로그를 봐 주세요.", r.ok);
  showLog(r.log);
  loadDoctor();
});

// 자기 클라이언트 조립 — 시크릿은 보내고 나면 즉시 칸을 비운다(API 키 칸과 같은 규칙).
// 서버도 되돌려주지 않으므로 화면에 다시 뿌릴 값 자체가 없다.
$("btn-ocsave").addEventListener("click", async () => {
  busy("btn-ocsave", "m-oc", true);
  const [ok, r] = await post("/api/setup/gsc-client",
    {client_id: $("oc-id").value, client_secret: $("oc-secret").value});
  busy("btn-ocsave", "m-oc", false);
  if (!ok) return say("m-oc", r.error, false);
  $("oc-id").value = $("oc-secret").value = "";
  say("m-oc", `저장했습니다 (${r.client_id}) → ${r.path} — 클라이언트가 바뀌었으니 ` +
              `위 [구글 로그인 열기]로 한 번 더 로그인해 주세요.`, true);
  loadDoctor();
});

$("btn-keys").addEventListener("click", async () => {
  const f = [["k-or","OPENROUTER_API_KEY"], ["k-serper","SERPER_API_KEY"],
             ["k-dfsl","DATAFORSEO_LOGIN"], ["k-dfsp","DATAFORSEO_PASSWORD"]];
  const vals = {};
  for (const [id, key] of f) if ($(id).value !== "") vals[key] = $(id).value;
  if (!Object.keys(vals).length) return say("m-keys", "입력한 칸이 없습니다.", false);
  busy("btn-keys", "m-keys", true);
  const [, r] = await post("/api/setup/keys", vals);
  busy("btn-keys", "m-keys", false);
  for (const [id] of f) $(id).value = "";
  say("m-keys", `저장했습니다 → ${r.path}`, true);
  loadDoctor();
});

$("btn-proj").addEventListener("click", async () => {
  busy("btn-proj", "m-proj", true);
  const [ok, r] = await post("/api/setup/project", {
    name: $("p-name").value, type: $("p-type").value, domain: $("p-domain").value,
    locale: $("p-locale").value, gsc_property: $("p-gsc").value,
    brand_aliases: $("p-alias").value, seed_keywords: $("p-seeds").value,
    competitors_manual: $("p-comp").value, tools: $("p-tools").value});
  busy("btn-proj", "m-proj", false);
  if (!ok) return say("m-proj", r.error, false);
  say("m-proj", `${r.name} 등록 완료 — 남은 건 AI에 물어볼 질문뿐입니다: ` +
                `채팅에 /capture add ${r.name}`, true);
  loadDoctor();
  loadProjects().then(n => { if (n) load(); });
  // 등록이 끝나면 방금 만든 사이트의 개요로 간다.
  setTimeout(() => SM.show("overview"), 900);
});

$("proj").addEventListener("change", () => { PINNED = ""; load(); });
$("gscdate").addEventListener("change", () => { PINNED = $("gscdate").value; load(); });
$("refresh").addEventListener("click", () => { loadDoctor(); load(); });

SM.sync();

// 인쇄 전에 접힌 것을 편다. `<details>` 는 CSS 로 못 연다(open 은 속성이다) —
// 안 펴면 보고서를 인쇄했는데 "무엇을 할지"가 접힌 채로 나간다. 끝나면 되돌린다.
let PRINT_OPENED = [];
addEventListener("beforeprint", () => {
  PRINT_OPENED = [...document.querySelectorAll("details:not([open])")];
  PRINT_OPENED.forEach(x => { x.open = true; });
});
addEventListener("afterprint", () => {
  PRINT_OPENED.forEach(x => { x.open = false; });
  PRINT_OPENED = [];
});

// 박제된 기록(--export)이면 서버가 없다 — 페이지에 박힌 데이터를 그리고, 손댈 수
// 없는 것들(트리아지·설정·새로고침·사이트 전환)은 아예 감춘다.
if (window.__SNAPSHOT__) {
  const s = window.__SNAPSHOT__;
  READONLY = true;
  $("proj").outerHTML = `<span class="mark" style="color:var(--patina)">` +
    `${esc(s.data.project.name)}</span>`;
  for (const id of ["refresh", "gscdate"]) $(id).hidden = true;
  SM.drop("settings");                   // 남한테 보낼 수도 있는 파일이다 — 입력칸을 남기지 않는다
  SM.drop("guide");
  document.querySelector(".tag").textContent = `${s.exported} 기록`;
  if (s.actions.length) {
    $("acts").hidden = false;
    $("acts-list").innerHTML = s.actions.map(x => `<li>${esc(x)}</li>`).join("");
  }
  render(s.data);
} else {
  loadDoctor();
  loadProjects().then(load);
}
</script>
</body>
</html>
