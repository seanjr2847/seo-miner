<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>seo-miner 대시보드</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>⛏</text></svg>">
<style>
:root {
  --bg:#f6f7f9; --card:#ffffff; --fg:#1a1d21; --muted:#68707b;
  --border:#e2e5ea; --accent:#2563eb; --up:#16803c; --down:#c02626;
  --chip:#eef1f5; --warn:#b45309;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#14161a; --card:#1d2026; --fg:#e6e9ed; --muted:#8b94a1;
    --border:#2c313a; --accent:#5b8def; --up:#4ade80; --down:#f87171;
    --chip:#262b33; --warn:#f0a44a;
  }
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg);
  font:14px/1.5 system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif; }
header { display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:14px 20px; border-bottom:1px solid var(--border); background:var(--card);
  position:sticky; top:0; z-index:5; }
header h1 { font-size:16px; margin:0; }
header .sub { color:var(--muted); font-size:12px; }
select,button { font:inherit; color:var(--fg); background:var(--chip);
  border:1px solid var(--border); border-radius:6px; padding:5px 10px; cursor:pointer; }
button:hover,select:hover { border-color:var(--accent); }
main { max-width:1080px; margin:0 auto; padding:18px 20px 60px; }
.kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px; margin-bottom:16px; }
.kpi { background:var(--card); border:1px solid var(--border); border-radius:10px;
  padding:12px 14px; }
.kpi .v { font-size:22px; font-weight:650; }
.kpi .l { color:var(--muted); font-size:12px; }
.kpi .d { font-size:12px; margin-left:6px; }
section { background:var(--card); border:1px solid var(--border);
  border-radius:10px; padding:14px 16px; margin-bottom:16px; overflow-x:auto; }
section h2 { font-size:14px; margin:0 0 10px; }
section h2 .n { color:var(--muted); font-weight:400; }
table { border-collapse:collapse; width:100%; font-size:13px; }
th { text-align:left; color:var(--muted); font-weight:500;
  border-bottom:1px solid var(--border); padding:4px 10px 6px 0; white-space:nowrap; }
td { border-bottom:1px solid var(--border); padding:5px 10px 5px 0;
  vertical-align:top; }
tr:last-child td { border-bottom:none; }
.num { text-align:right; font-variant-numeric:tabular-nums; }
.up { color:var(--up); } .down { color:var(--down); } .muted { color:var(--muted); }
.chip { display:inline-block; background:var(--chip); border-radius:20px;
  padding:2px 10px; margin:2px 4px 2px 0; font-size:12px; }
.badge { font-size:11px; border-radius:4px; padding:1px 6px; background:var(--chip); }
.badge.st-new { color:var(--accent); }
.badge.st-done { color:var(--up); }
.badge.st-dismissed { color:var(--muted); text-decoration:line-through; }
.badge.st-acked { color:var(--warn); }
.opp-btns button { font-size:11px; padding:2px 8px; margin-right:4px; }
.cols { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
@media (max-width:760px) { .cols { grid-template-columns:1fr; } }
.empty { color:var(--muted); padding:8px 0; }
svg text { fill:var(--muted); font-size:10px; }
.legend { font-size:12px; color:var(--muted); margin-top:4px; }
.legend b { font-weight:500; }
.dot { display:inline-block; width:8px; height:8px; border-radius:2px;
  margin-right:4px; vertical-align:middle; }
#err { color:var(--down); padding:20px; }
</style>
</head>
<body>
<header>
  <h1>seo-miner</h1>
  <select id="proj"></select>
  <button id="refresh">새로고침</button>
  <span class="sub" id="meta"></span>
</header>
<main>
  <div id="err" hidden></div>
  <div class="kpis" id="kpis"></div>
  <section><h2>클릭·노출 추이 <span class="n" id="trend-n"></span></h2>
    <div id="trend"></div></section>
  <section><h2>조금만 밀면 1페이지 — 4~20위 <span class="n">(노출순)</span></h2>
    <div id="striking"></div></section>
  <div class="cols">
    <section><h2>오른 검색어</h2><div id="ups"></div></section>
    <section><h2>내린 검색어</h2><div id="downs"></div></section>
  </div>
  <section><h2>기회 <span class="n" id="opp-n"></span></h2><div id="opps"></div></section>
  <section><h2>AI 인용 현황</h2><div id="ai"></div></section>
  <section><h2>순위 스냅샷</h2><div id="ranks"></div></section>
  <section><h2>수집 이력</h2><div id="runs"></div></section>
</main>
<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = n => (n ?? 0).toLocaleString("ko-KR");
const delta = (d, invert) => {
  if (d == null || d === 0) return "";
  const good = invert ? d < 0 : d > 0;
  const arrow = d > 0 ? "▲" : "▼";
  return `<span class="d ${good ? "up" : "down"}">${arrow}${Math.abs(d).toLocaleString("ko-KR")}</span>`;
};
const table = (heads, rows) => rows.length
  ? `<table><tr>${heads.map(h => `<th${h.startsWith(">") ? ' class="num"' : ""}>${h.replace(/^>/,"")}</th>`).join("")}</tr>${rows.join("")}</table>`
  : `<div class="empty">아직 데이터가 없습니다.</div>`;

async function loadProjects() {
  const names = await (await fetch("/api/projects")).json();
  const want = decodeURIComponent(location.hash.slice(1));
  $("proj").innerHTML = names.map(n =>
    `<option${n === want ? " selected" : ""}>${esc(n)}</option>`).join("");
  return names.length ? ($("proj").value) : null;
}

function trendSvg(t) {
  if (t.length < 2) return `<div class="empty">스냅샷이 2개 쌓이면 선이 그려집니다 (지금 ${t.length}개).</div>`;
  const W = 640, H = 140, P = 24;
  const x = i => P + i * (W - 2 * P) / (t.length - 1);
  const y = (v, max) => H - P - (max ? v / max * (H - 2 * P) : 0);
  const mc = Math.max(...t.map(r => r.clk)), mi = Math.max(...t.map(r => r.imp));
  const line = (key, max) => t.map((r, i) =>
    `${i ? "L" : "M"}${x(i).toFixed(1)},${y(r[key], max).toFixed(1)}`).join("");
  const last = t[t.length - 1], first = t[0];
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px">
    <path d="${line("imp", mi)}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="${line("clk", mc)}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    <text x="${P}" y="${H - 6}">${esc(first.d)}</text>
    <text x="${W - P}" y="${H - 6}" text-anchor="end">${esc(last.d)}</text>
  </svg>
  <div class="legend"><span class="dot" style="background:var(--accent)"></span><b>클릭</b> 최근 ${num(last.clk)} ·
  <span class="dot" style="background:var(--muted)"></span><b>노출</b> 최근 ${num(last.imp)} · 검색어 ${num(last.q)}개</div>`;
}

const OPP_LABEL = {new:"새 기회", acked:"확인함", done:"완료", dismissed:"기각"};
function oppRow(o) {
  const btn = (st, label) =>
    `<button onclick="setOpp(${o.id},'${st}')">${label}</button>`;
  const btns = o.status === "new"
    ? btn("acked","확인") + btn("done","완료") + btn("dismissed","기각")
    : btn("new","되돌리기");
  return `<tr><td><span class="badge st-${o.status}">${OPP_LABEL[o.status] || esc(o.status)}</span></td>
    <td>${esc(o.kind)}</td><td>${esc(o.target)}<div class="muted">${esc(o.reasoning || "")}</div></td>
    <td class="num">${o.score ?? ""}</td><td class="muted">${esc(o.created || "")}</td>
    <td class="opp-btns">${btns}</td></tr>`;
}

async function setOpp(id, status) {
  await fetch("/api/opp", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({id, status})});
  load();
}

function render(d) {
  const t = d.trend, last = t[t.length - 1] || {}, prev = t[t.length - 2] || {};
  $("meta").textContent =
    `${d.project.name} · GSC 스냅샷 ${d.gsc_date || "없음"}` +
    (d.project.gsc_property ? ` · ${d.project.gsc_property}` : "");
  $("kpis").innerHTML = [
    ["클릭 (최근 스냅샷)", num(last.clk), delta(last.clk - (prev.clk ?? last.clk))],
    ["노출", num(last.imp), delta(last.imp - (prev.imp ?? last.imp))],
    ["잡힌 검색어", num(last.q), delta((last.q ?? 0) - (prev.q ?? last.q ?? 0))],
    ["활성 키워드", num(d.kw_active), ""],
    ["열린 기회", num(d.opps_total), ""],
  ].map(([l, v, dd]) =>
    `<div class="kpi"><div class="v">${v}${dd}</div><div class="l">${l}</div></div>`).join("");
  $("trend-n").textContent = t.length ? `(스냅샷 ${t.length}개)` : "";
  $("trend").innerHTML = trendSvg(t);
  $("striking").innerHTML = table(["검색어", ">순위", ">노출", ">클릭"],
    d.striking.map(r => `<tr><td>${esc(r.query)}</td><td class="num">${r.pos}</td>
      <td class="num">${num(r.imp)}</td><td class="num">${num(r.clk)}</td></tr>`));
  const mover = m => `<tr><td>${esc(m.query)}</td><td class="num">${m.pos}</td>
    <td class="num">${delta(m.dpos) || '<span class="muted">—</span>'}</td>
    <td class="num">${num(m.clk)}${delta(m.dclk)}</td></tr>`;
  $("ups").innerHTML = table(["검색어", ">순위", ">Δ순위", ">클릭"], d.ups.map(mover));
  $("downs").innerHTML = table(["검색어", ">순위", ">Δ순위", ">클릭"], d.downs.map(mover));
  $("opp-n").textContent = `(새 기회 ${d.opps_total}건)`;
  $("opps").innerHTML = table(["상태", "종류", "대상 · 근거", ">점수", "생성", ""],
    d.opps.map(oppRow));
  let ai = "";
  if (d.matrix.length) {
    ai += table(["엔진", "카테고리", ">인용", ">언급", ">체크"],
      d.matrix.map(r => `<tr><td>${esc(r.engine)}</td><td>${esc(r.category)}</td>
        <td class="num ${r.cited ? "up" : "muted"}">${r.cited}</td>
        <td class="num">${r.mentioned}</td><td class="num">${r.total}</td></tr>`));
    if (d.gap_domains.length)
      ai += `<p class="muted" style="margin:10px 0 4px">우리 대신 인용되는 곳:</p>` +
        d.gap_domains.map(g => `<span class="chip">${esc(g.domain)} ×${g.n}</span>`).join("");
    if (d.missed.length)
      ai += `<p class="muted" style="margin:10px 0 4px">어디에도 안 잡힌 질문 (${d.missed.length}):</p>` +
        d.missed.map(m => `<div>· ${esc(m.prompt)} <span class="muted">(${esc(m.engines)})</span></div>`).join("");
  } else ai = `<div class="empty">AI 인용 체크 기록이 없습니다 — /capture ai 또는 /seo-miner:browse</div>`;
  $("ai").innerHTML = ai;
  $("ranks").innerHTML = d.ranks.length
    ? table(["키워드", ">순위", ">Δ", "AI오버뷰"], d.ranks.map(r =>
        `<tr><td>${esc(r.keyword)}</td><td class="num">${r.pos ?? "—"}</td>
        <td class="num">${delta(r.dpos) || ""}</td>
        <td>${r.aio ? (r.aio_cited ? '<span class="up">인용됨</span>'
                       : '<span class="down">있는데 미인용</span>') : '<span class="muted">없음</span>'}</td></tr>`))
    : `<div class="empty">순위 데이터 없음 — SERP 키 설정 시 /capture rank 로 수집됩니다 (없어도 됩니다).</div>`;
  $("runs").innerHTML = table(["종류", "시각", ">API 호출", ">비용($)", "메모"],
    d.runs.map(r => `<tr><td>${esc(r.kind)}</td><td class="muted">${esc(r.started_at)}</td>
      <td class="num">${r.api_calls ?? 0}</td><td class="num">${r.cost_estimate_usd ?? 0}</td>
      <td class="muted">${esc(r.notes || "")}</td></tr>`));
}

async function load() {
  const name = $("proj").value;
  if (!name) { $("err").hidden = false; $("err").textContent =
    "등록된 사이트가 없습니다 — 채팅에서 /capture add <이름> 으로 먼저 등록하세요."; return; }
  location.hash = encodeURIComponent(name);
  const res = await fetch("/api/data?project=" + encodeURIComponent(name));
  const d = await res.json();
  if (!res.ok) { $("err").hidden = false; $("err").textContent = d.error || "로드 실패"; return; }
  $("err").hidden = true;
  render(d);
}

$("proj").addEventListener("change", load);
$("refresh").addEventListener("click", load);
loadProjects().then(n => n && load());
</script>
</body>
</html>
