.badge.adv { color:var(--info); background:var(--info-wash); }
/* 실제로 고친 기록이 있는 기회 — '진행 중'(산화동)보다 한 걸음 나아간 상태라
   완료(녹청)와 같은 계열이다. 완료는 아직 사람이 누른다. */
.badge.made { color:var(--accent); background:var(--accent-wash); }
.st-dismissed { color:var(--sub); text-decoration:line-through; }
/* 자동 종료 — 해결된 것만 완료 계열(녹청)이다. 나머지(중복 합침·기준 바뀌어 정리·판단 중단)는
   좋아진 게 아니라 회색 그대로 둔다 — 같은 색이면 다시 "많이 풀렸다"로 읽힌다. */
.st-tag-better { color:var(--accent); background:var(--accent-wash); }
/* 도는 중 — 점 하나가 깜빡인다. 글자("수집 중")가 정본이고 점은 거들 뿐이라
   움직임을 끄면 점은 그대로 켜져 있다. */
.badge.run { color:var(--info); background:var(--info-wash); }
.badge.run::before { content:""; width:6px; height:6px; border-radius:50%;
  background:currentColor; flex:0 0 6px; }
@keyframes blip { 0%,100% { opacity:1; } 50% { opacity:.25; } }
@media (prefers-reduced-motion: no-preference) {
  .badge.run::before { animation:blip 1.3s ease-in-out infinite; }
}
/* 좁은 화면에선 세 칸이 안 들어간다 — 상태 배지를 본문 밑으로 내린다. */
@media (max-width:560px) {
  /* 세 칸이 안 들어가면 상태 배지가 줄바꿈으로 본문 **뒤**로 밀려, 행동 버튼보다
     아래에서 읽힌다 — 무엇인지 알기 전에 무엇을 할지부터 읽는 순서가 된다.
     자리를 손으로 못 박아 상태가 늘 먼저 온다. */
  .opp > summary { grid-template-columns:auto 1fr; }
  .opp > summary > .st { grid-column:2; grid-row:1; justify-self:end; align-self:start; }
  .opp > summary > div:not(.st):not(.score) { grid-column:2; grid-row:2; }
}
.acts { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; align-items:center; }
/* 회색 글자는 비활성으로 읽힌다 — 누를 수 있는 것은 본문 색으로 세운다.
   .go(주요 버튼)·.cmd(명령 칩)는 자기 위계를 이미 갖고 있어 여기서 안 덮는다. */
.acts button:not(.go):not(.cmd) { display:inline-flex; align-items:center;
  font:600 var(--fs-1)/1 var(--sans); color:var(--ink);
  background:var(--sunk); border:0; border-radius:var(--r-pill);
  padding:0 var(--sp-4); min-height:var(--btn-h); cursor:pointer; white-space:nowrap;
  transition:color .12s, background .12s; }
.acts button:not(.go):not(.cmd):hover { color:var(--accent); background:var(--accent-wash); }
.acts button:not(.go):not(.cmd):active { transform:translateY(1px); }
.acts .cmd { margin:0; }

/* ── 칩·로그줄 ─────────────────────────────────────────────
   칩은 필터·값 알약이다. 누르는 칩(button.chip)은 옅은 면, 눌러 둔 칩(.on)은 녹청 면.
   .up·.dn·.in·.ne 는 값 칩(24px)의 색조다 — 오름·내림·정보·중립. */
.chip { display:inline-flex; align-items:center; gap:6px; font:500 var(--fs-1)/1 var(--sans);
  border:0; border-radius:var(--r-pill); padding:0 var(--sp-4);
  min-height:var(--btn-h-sm); margin:0 6px 6px 0; color:var(--sub); background:var(--sunk); }
.chip b { color:var(--ink); font-weight:600; }
.chip.up, .chip.dn, .chip.in, .chip.ne { min-height:24px; padding:0 10px; font-weight:600; }
.chip.up { color:var(--up); background:var(--up-wash); }
.chip.dn { color:var(--dn); background:var(--dn-wash); }
.chip.in { color:var(--info); background:var(--info-wash); }
.chip.ne { color:var(--sub); background:var(--sunk); }
/* kind 칩: 기회 목록 필터. 누른 칩만 보이고, 다시 누르면 전체로. */
button.chip { cursor:pointer; }
button.chip:hover { color:var(--accent); background:var(--accent-wash); }
button.chip.on { color:var(--accent); background:var(--accent-wash); font-weight:600; }
.oppchips { margin:0 0 10px; }
/* ── 안내: 시추 진행도 ─────────────────────────────────────
   6단계가 갱도다. 지금 프로젝트가 어디까지 팠는지 Brain에서 읽어 채운다. */
#guide { padding:18px 0 30px; }
#guide .lead { font-size:var(--fs-2); color:var(--sub); margin:6px 0 26px; max-width:68ch; }
#guide .lead b { color:var(--ink); font-weight:600; }
.shaft { display:grid; grid-template-columns:26px 1fr; gap:0 18px; }
.stp { display:contents; }
.stp .rail { position:relative; }
/* 갱도 벽: 위·아래로 이어지는 선. 판 데는 녹청, 안 판 데는 옅은 선. */
.stp .rail::before { content:""; position:absolute; left:12px; top:0; bottom:0;
  width:2px; background:var(--rule); }
.stp.done .rail::before, .stp.here .rail::before { background:var(--accent); }
.stp:last-child .rail::before { bottom:calc(100% - 28px); }
/* 번호 원 — 글자가 12px 이라 원은 24px 다(안쪽 20px 에 한 자리 숫자가 선다). */
.stp .dot { position:absolute; left:1px; top:3px; width:24px; height:24px;
  border-radius:50%; border:2px solid var(--rule); background:var(--card); z-index:1;
  font:600 var(--fs-1)/20px var(--sans); font-variant-numeric:tabular-nums;
  color:var(--sub); text-align:center; }
.stp.done .dot { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.stp.here .dot { border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-wash);
  color:var(--accent); }
.stp .body { padding:4px 0 28px; display:grid;
  grid-template-columns:minmax(0,62ch) auto; justify-content:start;
  gap:0 28px; align-items:start; }
.stp .body .txt { min-width:0; }
.stp:last-child .body { padding-bottom:0; }
@media (max-width:720px) { .stp .body { grid-template-columns:1fr; } }
/* 끝난 표시는 번호를 밀어내지 않는다 — 원 안이 3·4·✓·6 이 되면 몇 번째 단계인지
   세는 것이 그 자리에서 끊긴다. 번호는 원이 갖고, ✓ 는 제목 옆에 선다. */
.stp .ok { color:var(--accent); font-weight:600; margin-left:-4px; }
.stp h3 { font:650 var(--fs-2)/1.4 var(--sans); margin:0; display:flex; gap:10px;
  align-items:baseline; flex-wrap:wrap; }
.stp.later h3 { color:var(--sub); }
.stp .gain { font-size:var(--fs-2); line-height:1.7; color:var(--sub); margin:6px 0 0; max-width:62ch; }
.stp .state { font:400 var(--fs-1)/1 var(--sans); }
.stp.done .state { color:var(--accent); }
.stp.here .state { color:var(--warn); }
.stp.later .state { color:var(--sub); }
.stp .now { display:inline-flex; align-items:center; height:24px; font:600 var(--fs-1)/1 var(--sans);
  color:var(--warn); background:var(--warn-wash);
  border-radius:var(--r-pill); padding:0 10px; white-space:nowrap; }
/* 지금 할 단계가 아닌 줄에서는 명령 칩도 제목만큼 물러난다 — 흐린 제목 옆에
   선명한 칩이 서면 눈이 안 할 일부터 읽는다. */
.stp:not(.here) .cmd { color:var(--sub); }
.stp:not(.here) .cmd::after { color:var(--mute); }
.stp:not(.here) .cmd:hover { color:var(--accent); }
/* 명령 칩 — 로컬에서는 이게 버튼 자리다. 그래서 .go 와 같은 높이·반지름(알약)으로 선다
   (안 그러면 같은 줄에서 두 배포의 주요 행동이 서로 다른 크기로 읽힌다).
   글자는 명령이라 등폭이 맞다 — 한글이 안 섞인 자리다. */
.cmd { display:inline-flex; align-items:center; gap:8px; font:500 var(--fs-1)/1.35 var(--mono);
  margin:12px 8px 0 0; min-height:var(--btn-h);
  background:var(--sunk); border:0; border-radius:var(--r-pill);
  padding:0 var(--sp-4); cursor:pointer; color:var(--ink); white-space:nowrap;
  transition:color .12s, background .12s; }
.cmd:hover { color:var(--accent); background:var(--accent-wash); }
.cmd:active { transform:translateY(1px); }
/* 긴 명령(사이트 이름이 붙은 것)이 뷰포트를 넘어 잘리지 않게 — 자리가 모자라면 줄을 바꾼다. */
.cmd { max-width:100%; }
@media (max-width:999px) { .cmd { white-space:normal; overflow-wrap:anywhere; text-align:left;
  padding-top:8px; padding-bottom:8px; } }
/* 글줄 안의 글자 버튼(.gov)·상태 알약 버튼(.badge)은 눈에 보이는 크기는 그대로 두고 누르는 자리만
   44px 로 넓힌다 — 줄 높이가 변하지 않아 문장이 흐트러지지 않는다. */
@media (hover:none), (max-width:999px) {
  button.gov, button.badge, .lnk { position:relative; }
  button.gov::after, button.badge::after, .lnk::after { content:""; position:absolute;
    left:-4px; right:-4px; top:50%; height:44px; transform:translateY(-50%); }
  button.chip { min-width:44px; }
}
/* 보조 명령 칩 — 주요 행동 옆에서 물러난다(호스팅의 .go.sec 과 같은 자리).
   물러나는 것은 **바탕**이지 글자가 아니다. 글자를 흐리게 내리면 AA 를 못 넘겨
   누를 수 있는 것을 못 읽게 된다. 위계는 채운 바탕(주요) ↔ 옅은 면(보조)이 만든다. */
.cmd.sec { color:var(--ink); font-weight:500; box-shadow:inset 0 0 0 1px var(--rule); }
.cmd.sec:hover { color:var(--accent); }
/* 칩이 inline-flex 라 ::after 는 별개의 항목이 된다 — 글자 앞의 공백은 잘려 나가고
   글자에 딱 붙는다. 사이는 gap 이 벌린다. */
.cmd::after { content:"⧉"; color:var(--sub); }
.cmd.copied::after { content:"복사됨"; color:var(--accent); font:500 var(--fs-1)/1 var(--sans); }
.loopback { margin-top:22px; padding-left:44px; font-size:var(--fs-2); color:var(--sub);
  line-height:1.9; }
.loopback b { color:var(--accent); font-weight:600; }
.loopback code { font:500 var(--fs-1)/1 var(--mono); background:var(--sunk);
  border:0; border-radius:8px; padding:5px 9px; color:var(--ink); }
.runlog { font:400 var(--fs-1)/1.9 var(--sans); color:var(--sub); }
.runlog b { color:var(--ink); font-weight:500; }
.runlog .r { display:block; border-bottom:1px solid var(--line); padding:5px 0; }

/* ── 진단 배너 ─────────────────────────────────────────── */
/* 배너는 "파이프라인 전체가 어디쯤인가"를 말하고, 바로 위의 띠(.next)는 "이 화면에서
   무엇을 누르나"를 말한다. 둘이 같은 무게로 서면 한 화면에 다음 행동이 둘이 된다 —
   배너를 한 단 낮춘다: 그림자 없는 면 + 제목을 한 급 줄인다.
   면의 색조가 말한다: 안내는 옅은 녹청, 경고는 옅은 산화동. */
#docban { border:0; border-radius:var(--r-card); padding:16px 20px; margin:var(--sp-5) 0 0;
  background:var(--accent-wash); }
/* 막는 항목(ul.must)이 있으면 경고다 — banSync 가 그때만 .thin 을 뗀다.
   경고는 산화동, 안내는 녹청. 색이 상태를 말하고 글자가 그 뜻을 말한다. */
#docban:not(.thin), #docban.bad { background:var(--warn-wash); }
#docban .verdict { font:600 var(--fs-2)/1.5 var(--sans); }
/* 안내 한 줄만 남았을 때 — 상자를 두르지 않는다(위 주석의 이유는 banSync 에). */
#docban.thin { border:0; border-radius:0; padding:0; background:transparent;
  margin:24px 0 0; }
#docban.thin .nx, #docban.thin .verdict { display:none; }
#docban.thin .nx { margin-top:0; color:var(--sub); }
#docban.thin .nx b { color:var(--ink); }
/* 다음 한 걸음 — 이름표(무엇을 할 때인가)와 단계 이름(무엇을)을 갈라 놓는다.
   줄표로 잇던 자리다: 줄표는 두 문장을 붙일 뿐 위계를 만들지 못했다. */
#docban .nx { font:400 var(--fs-2)/1.6 var(--sans); margin-top:10px; color:var(--ink);
  display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
#docban .nx:empty, #docban .nx[hidden] { display:none; }
#docban .nx b { font-weight:650; }
.nxk { display:inline-flex; align-items:center; height:24px; font:600 var(--fs-1)/1 var(--sans);
  color:var(--accent); background:var(--card);
  border-radius:var(--r-pill); padding:0 10px; white-space:nowrap; }
#docban code { font:500 var(--fs-1)/1 var(--mono); background:var(--card); color:var(--ink);
  padding:5px 9px; border-radius:8px; }
#docban ul { margin:12px 0 0; padding-left:18px; font-size:var(--fs-2); line-height:1.7; }
#docban ul.must { color:var(--warn); list-style:none; padding:0; margin:0; }
/* 한 줄 + 버튼 하나: 글과 버튼이 한 줄에 서고, '자세히'는 그 아래 같은 왼쪽 선에 선다. */
#docban .must > li { display:flex; align-items:center; flex-wrap:wrap; gap:8px 14px; }
#docban .must > li > details { flex:0 0 100%; margin-top:0; }
#docban > details > ul { padding-left:18px; margin-top:0; }
/* 준비물 줄의 복사 칩 — .cmd 의 위 여백은 문단용이라 목록 안에서는 줄인다. */
#docban .must .cmd { margin:7px 0 3px; background:var(--card); }
#docban > details { margin-top:4px; }
#docban summary { display:flex; align-items:center; min-height:var(--btn-h-sm);
  font:500 var(--fs-1)/1.4 var(--sans); color:var(--accent); cursor:pointer; text-decoration:none; }
#docban summary:hover { text-decoration:underline; }

/* ── 설정 패널 ─────────────────────────────────────────── */
#setup { padding:18px 0 22px; }
.step { padding:24px 0; border-top:1px solid var(--line); }
.step:first-of-type { border-top:0; }
.step h3 { font:650 var(--fs-2)/1.35 var(--sans); margin:0 0 6px;
  display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
.step .why { font-size:var(--fs-2); line-height:1.7; color:var(--sub); margin:0 0 16px; max-width:64ch; }
.step .why b { color:var(--ink); }
/* 자기 OAuth 클라이언트를 쓰는 사람은 소수다 — 접어 두고 필요한 사람만 편다. */
.step details { margin-top:18px; border-top:1px solid var(--line); padding-top:14px; }
.step summary { font:500 var(--fs-2)/1.5 var(--sans); color:var(--sub); cursor:pointer; }
.step summary:hover { color:var(--accent); }
.step details .why { margin:12px 0 0; }
/* 근거 칸 안에 접어 둔 설명 — 섹션 직속 <details> 와 달리 괘선으로 가르지 않는다.
   바로 위에 한 줄 부제가 이미 서 있어서, 선을 하나 더 그으면 한 칸이 둘로 읽힌다. */
.why > p { margin:0; }
.why > details { margin-top:var(--sp-2); border-top:0; padding-top:0; }
.why > details > p { margin:6px 0 0; }
.step .why code, .stat { font-family:var(--mono); font-size:var(--fs-1); }
.stat { font:var(--micro); }
.stat.ok { color:var(--accent); } .stat.todo { color:var(--warn); }
.stat.opt { color:var(--sub); }   /* 안 해도 되는 것 — 경고색으로 찍으면 할 일이 된다 */
label { display:block; font:var(--micro); color:var(--sub); margin:12px 0 6px; }
label b, label a { color:var(--accent); font-weight:500; }
label a { text-decoration:underline; text-underline-offset:2px; }
/* 저장된 키 지우기 — 셸이 API 키 칸마다 단다. 위 label 은 칸의 이름이라 칸 위에
   서지만 이건 그 칸에 딸린 조작이라 아래에 붙는다. 되돌릴 수 없는 것이므로
   산화동(.go.danger 와 같은 축)으로 세워 값 입력과 섞이지 않게 한다. */
.delkey { display:flex; align-items:center; gap:6px; width:fit-content;
  margin:7px 0 0; color:var(--warn); cursor:pointer; }
.delkey input { width:auto; margin:0; accent-color:var(--warn); cursor:pointer; }
/* 화면끼리 잇는 손잡이. 여태 [개요]·[순위 추적] 은 글자였을 뿐이라 눌러도 아무 일이
   없었다 — 화면 사이를 잇는 링크가 뷰 파일에 한 개도 없었다. 문장 안에 앉으므로
   버튼 모양이 아니라 밑줄 링크처럼 보이게 한다(버튼인 이유는 라우터를 부르기 때문). */
.gov, .lnk { font:inherit; color:var(--accent); background:transparent; border:0; padding:0;
  cursor:pointer; text-decoration:underline; text-underline-offset:2px; }
.gov:hover, .lnk:hover { color:var(--ink); }
/* 본문의 맨 링크 한 벌 — 규칙이 없어 브라우저 기본 파랑·보라가 화면마다 섰다.
   :where() 로 특이도를 0 으로 둔다: 클래스를 단 링크(.go·.cmd 등)는 자기 규칙이 이긴다. */
:where(main a) { color:var(--accent); text-decoration:none; text-underline-offset:2px; }
:where(main a:hover) { text-decoration:underline; }
/* 입력 — 옅은 면(--sunk)에 반경 12px, 테두리 없음. 체크·라디오는 상자를 안 두른다. */
input, select, textarea { font:400 var(--fs-2)/1.4 var(--sans); width:100%; color:var(--ink);
  background:var(--sunk); border:0; border-radius:var(--r-in); padding:0 14px;
  min-height:var(--btn-h); }
input[type="checkbox"], input[type="radio"] { width:auto; min-height:0; padding:0;
  background:transparent; accent-color:var(--accent); }
/* 포커스 링은 전역 :focus-visible 한 벌이다 — 입력은 마우스로 눌러도 키보드처럼 링이 선다. */
input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline:2px solid var(--focus); outline-offset:0; }
input::placeholder, textarea::placeholder { color:var(--sub); opacity:.7; }
textarea { min-height:96px; padding:12px 14px; resize:vertical; }
select { cursor:pointer; }
.skiplink { position:absolute; left:-9999px; top:8px; z-index:1000; }
.skiplink:focus { left:8px; padding:8px 12px; background:var(--card); color:var(--ink);
  border-radius:var(--r-in); outline:2px solid var(--focus); outline-offset:2px; }
main:focus { outline:none; }   /* 건너뛰기 착지점 — 본문 전체에 링을 두르지 않는다 */
/* 윈도 다크에서 펼친 목록은 부모의 transparent 를 못 물려받는다 — 색을 박는다. */
select option { background:var(--card); color:var(--ink); }
option { background:var(--card); }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:0 22px; }
@media (max-width:640px) { .grid { grid-template-columns:1fr; } }
.row { margin-top:16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
#c-proj { width:auto; flex:0 0 auto; max-width:240px; }
/* 버튼은 알약 두 종류뿐이다 — 기본(채운 녹청)과 ghost(흰 면·그림자). 화면에 기본은 하나.
   누르는 것은 전부 같은 높이(--btn-h)로 선다 — .go 계열과 명령 칩(.cmd), 목록 안의
   맨 버튼이 한 줄에 섞여도 밑선이 흔들리지 않는다. .sec(옛 보조)와 .ghost 는 같은 모양이다.
   대비: --accent-ink/--accent 6.9:1 (라이트) · 7:1 (다크). */
.go { display:inline-flex; align-items:center; justify-content:center; gap:8px;
  font:650 var(--fs-2)/1 var(--sans); color:var(--accent-ink);
  background:var(--accent); border:0; border-radius:var(--r-pill);
  padding:0 20px; min-height:var(--btn-h); cursor:pointer; white-space:nowrap;
  text-decoration:none;
  transition:background .12s, color .12s; }
.go:hover { background:color-mix(in srgb, var(--accent) 84%, var(--ink)); color:var(--accent-ink); }
.go:active { transform:translateY(1px); }
.go[disabled], .go[aria-disabled="true"] { opacity:.45; cursor:default; }
.go[disabled]:hover { background:var(--accent); color:var(--accent-ink); }
/* 비활성 주 버튼은 채움을 벗는다 — 흐린 녹색 채움은 눌러도 되는 버튼으로 읽혔다(10회차 심사). */
.go:not(.sec):not(.ghost)[disabled], .go:not(.sec):not(.ghost)[disabled]:hover {
  background:var(--sunk); color:var(--sub); opacity:1; }
.go[disabled]:active { transform:none; }
/* ghost — 흰 면 + 그림자. 되돌리기·내보내기·다시 하기·표 도구줄. 카드 안에서는 그림자 대신
   옅은 면(--sunk)이다(면 위에 그림자 알약이 또 뜨지 않게). */
.go.sec, .go.ghost { background:var(--card); color:var(--ink);
  box-shadow:var(--shadow), inset 0 0 0 1px var(--rule); }
.go.sec:hover, .go.ghost:hover { color:var(--accent); background:var(--accent-wash); }
:is(.card, .opp, .tw, .det, .rail-foot) .go:is(.sec, .ghost) { background:var(--sunk);
  box-shadow:inset 0 0 0 1px var(--rule); }
:is(.card, .opp, .tw, .det, .rail-foot) .go:is(.sec, .ghost):hover { background:var(--accent-wash); }
.go.sec[disabled], .go.ghost[disabled] { color:var(--mute); opacity:1; }
.go.sec[disabled]:hover, .go.ghost[disabled]:hover { color:var(--sub); background:var(--card); }
/* 작게 — 표 줄 안·카드 머리. 터치 기기·좁은 화면에서는 --btn-h-sm 이 44px 로 오른다. */
.go.sm { min-height:var(--btn-h-sm); padding:0 14px; font-size:var(--fs-1); }
/* 되돌릴 수 없는 것 하나에만. 채워서 다른 버튼과 섞이지 않게 한다. */
.go.danger { background:var(--warn); color:var(--card); }
.go.danger:hover { background:color-mix(in srgb, var(--warn) 84%, var(--ink)); color:var(--card); }
.msg { font:400 var(--fs-2)/1.6 var(--sans); max-width:64ch; }
.msg.bad { color:var(--warn); } .msg.good { color:var(--accent); }
pre { font:400 var(--fs-1)/1.65 var(--mono); background:var(--sunk); border:0; border-radius:var(--r-in);
  padding:12px 14px; max-height:210px; overflow:auto; white-space:pre-wrap; margin:14px 0 0; }
/* 오류는 원인과 되돌릴 손잡이를 같이 낸다 — "실패했습니다"로 끝나지 않는다. */
/* 오류 상자는 배너와 같은 몸이다 — 다른 것은 면의 색조 하나다(옅은 산화동). */
#err { color:var(--ink); font:400 var(--fs-2)/1.65 var(--sans); margin:28px 0 0;
  padding:16px 20px; border:0; border-radius:var(--r-card); background:var(--warn-wash);
  max-width:74ch; }
#err b { color:var(--warn); font-weight:650; }
#err .acts { margin-top:var(--sp-3); }

/* ── hidden 은 마지막에 이긴다 ─────────────────────────────────────
   `hidden` 은 브라우저가 `display:none` 으로 구현한다 — 그냥 UA 스타일시트의 한 줄이라
   저자 규칙이면 무엇이든 이긴다. 부품이 `display:inline-flex` 를 갖는 순간(버튼·칩·
   배지가 전부 그렇다) 같은 특정도에서 뒤에 온 쪽이 이겨, 감춰야 할 요소가 다시 선다.
   실제로 설정 화면의 hidden 버튼 셋이 그렇게 살아났다.
   속성 하나를 더 얹어 특정도를 올리고 규칙들 맨 뒤에 세운다 — !important 로 싸우지
   않는다. `[class]` 는 "클래스가 있는 요소"라는 뜻일 뿐이라 무엇도 새로 감추지 않는다.

   화면에서만이다. 종이에서는 숨은 화면을 **일부러** 편다(.view[hidden]{display:block})
   — 미디어를 안 가르면 이 규칙이 그걸 이겨서, 열 화면짜리 보고서가 네 쪽으로 나온다.
   실제로 그렇게 인쇄 검사가 FAIL 했다. */
@media screen {
  [hidden], [hidden][class] { display:none; }
}

/* ── 공용 서랍 (.sdr) — 개요의 .odr 와 같은 모양, 모든 화면이 쓴다 ─────────
   body 최상위에 한 번 선다. 이름은 .sdr 계열만 — 개요의 .odr 와 겹치지 않는다. */
.sdr-bg { position:fixed; inset:0; z-index:57; background:color-mix(in srgb, var(--ink) 18%, transparent); }
.sdr { position:fixed; top:0; right:0; bottom:0; z-index:58; width:min(560px, 100%);
  display:flex; flex-direction:column; background:var(--card); box-shadow:var(--shadow-2); }
.sdr[hidden], .sdr-bg[hidden] { display:none; }
.sdr-h { padding:24px 28px 0; }
.sdr-top { display:flex; gap:14px; align-items:flex-start; padding-bottom:14px; border-bottom:1px solid var(--line); }
.sdr-tt { flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; }
.sdr-tt h2 { margin:0; font:700 var(--fs-4)/1.35 var(--sans); overflow-wrap:anywhere; }
.sdr-sub { font:400 var(--fs-2)/1.5 var(--sans); color:var(--sub); overflow-wrap:anywhere; }
.sdr-x { flex:none; width:44px; height:44px; border:0; border-radius:var(--r-in); background:var(--sunk);
  color:var(--sub); font-size:var(--fs-3); cursor:pointer; }
.sdr-x:hover { color:var(--ink); }
.sdr-b { flex:1; overflow:auto; overscroll-behavior:contain; padding:20px 28px 28px; }
.sdr-f { padding:14px 28px; border-top:1px solid var(--line); display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
@media (max-width:640px) {
  .sdr-h, .sdr-b, .sdr-f { padding-left:16px; padding-right:16px; }
}
@media print { .sdr, .sdr-bg { display:none; } }

/* ── 인쇄에서 빼는 것 ──────────────────────────────────────────────
   종이에는 누를 데가 없다 — 이동(레일·탭)·버튼·도구는 전부 뺀다. 위 [인쇄] 블록에 두면
   부품 규칙(.go·.cmd 의 display:inline-flex)이 같은 특정도에서 뒤에 와서 이긴다 — 그래서
   !important 대신 이 자리(스타일 맨 끝)에 세운다. 새 셸 부품은 여기에 올린다. */
@media print {
  header, .railcard, .navbar, #nav, #navfoot, .rail-foot, .topbar, .fold,
  .tools, .ask, .cmd, .hint, .acts, .go { display:none; }
}
</style>
</head>
<body>
<script>try { if (localStorage.getItem("sm:rail") === "min") document.documentElement.dataset.rail = "min"; } catch (e) {}</script>
<!-- 키보드로 들어오면 레일(사이트·기준일·메뉴 열여섯)을 다 지나야 본문이다 — 첫 칸에서
     건너뛴다. href 로 "#content" 를 쓰지 않는다: 이 앱은 URL hash 를 사이트 이름으로
     읽어서(location.hash), 누르는 순간 "content 라는 사이트"를 열려 한다. 포커스만
     옮기고 hash 는 건드리지 않는다. -->
<a class="skiplink" href="" onclick="event.preventDefault();
  const m=document.querySelector('main');m.focus();m.scrollIntoView()">본문으로 건너뛰기</a>
<header>
 <div class="railcard">
  <!-- 레일은 떠 있는 카드 하나다(.rail). 위에서부터 머리(로고·사이트) · 메뉴 · 바닥
       (수집 상태 카드 + 관리 화면 줄). 고른 것 위에 이름표를 세워 둔다. -->
  <div class="hbar">
    <span class="mark"><span class="t">seo<b>·</b>miner</span></span>
    <span class="tag" data-web="SEO 대시보드">검색 가시성</span>
    <!-- 접이식 레일 — 접으면 아이콘만 남는다(92px). 저장은 localStorage 에 하되 못 쓰면 그냥 넘어간다. -->
    <button class="fold" id="railfold" type="button" aria-expanded="true"
            aria-label="사이드바 접기" title="사이드바 접기"><svg viewBox="0 0 24 24"
            aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
    <div class="site">
      <span class="av" id="siteav" aria-hidden="true"></span>
      <div class="site-b"><small id="projlab">보는 사이트</small>
        <select id="proj" aria-label="사이트 선택" tabindex="-1" aria-hidden="true"></select>
        <button type="button" id="projbtn" aria-haspopup="listbox" aria-expanded="false"
                aria-controls="projmenu" title="보는 사이트 바꾸기"><span class="nm" id="projnm"></span><svg
                viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></div>
    </div>
  </div>
  <!-- 메뉴 항목은 여기 적지 않는다 — 정본은 뷰 파일의 view-def 이고, 조립이 그걸
       window.__VIEWS__ 로 실어 보낸다(문서 머리의 MANIFEST 자리). 다시 잴 게 없는
       묶음(관리 — 기록·안내·설정)은 #navfoot 에 서고, 나머지는 #nav 에 선다. -->
  <div class="navbar"><div class="navscroll"><nav id="nav" aria-label="화면"></nav><nav id="navfoot"></nav></div></div>
  <div class="rail-foot">
    <div class="rfs"><i aria-hidden="true"></i><span id="meta"></span></div>
    <button class="hbtn" id="refresh" title="다시 재지 않고, 이미 모은 결과를 다시 읽어 옵니다"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 11-3-6.7M21 4v5h-5"/></svg><span class="t">화면 다시 불러오기</span></button>
  </div>
 </div>
</header>

<main tabindex="-1">
  <div class="topbar"><label class="bar-l" id="datelab" for="gscdate" hidden>구글 실적 기준일</label><select id="gscdate" aria-label="기준 수집일" hidden></select></div>
  <!-- 종이 표지. 화면에서는 레일이 이 말을 하고 있지만 인쇄하면 레일이 빠진다 —
       누구의 무엇을 언제 잰 것인지가 어디에도 안 남는다. -->
  <div class="printhead" id="printhead" hidden></div>
  <div class="hax" id="axes" hidden></div>
  <section id="docban" hidden></section>

  <div id="err" hidden></div>

  <!-- 첫 payload 전까지의 중립 자리표. render() 가 처음 불리면 스스로 숨는다
       (아래 render 첫 줄). 제목 있는 빈 section 대신 이 셋만 보인다. -->
  <div id="sm-boot" aria-hidden="true">
    <span class="skel box"></span>
    <span class="skel box"></span>
    <span class="skel box"></span>
  </div>

  <div id="content" hidden>
    <!-- 화면별 렌더러는 자기 파일에서 VIEW(id, render) 로 등록한다 — 이 함수는 뷰
         파일들보다 먼저 있어야 한다. 조립 순서가 곧 화면 순서다.
         같은 뷰가 자기 파일에서 선언한 나머지(제목·담는 요소·채우는 단계)는
         window.__VIEWS__ 에 데이터로 실린다 — 문서 머리의 MANIFEST 자리다. -->
<script>
const VIEW_RENDER = [];
function VIEW(id, render) { VIEW_RENDER.push({id, render}); }
/* 진단(/api/doctor)을 받는 화면은 DOCTOR(id, {before, after}) 로 자기 칸을 등록한다. 진단은
   /api/data 와 다른 페이로드라 VIEW 의 render 가 못 받는다. loadDoctor 가 띠(#docban)를 쓰기
   전에 before 를, 쓴 뒤에 after 를 모두 부른다 — 화면 이름을 셸이 알 필요가 없다. */
const DOCTOR_RENDER = [];
function DOCTOR(id, hooks) { DOCTOR_RENDER.push({id, ...hooks}); }

/* 뷰 파일이 쓰는 아주 작은 것 셋은 **뷰보다 먼저** 세운다. 뷰 스크립트는 문서
   가운데(#content)에 있고 셸의 본 스크립트는 문서 끝에 있다 — 뷰가 자기 스크립트
   맨 위에서 이걸 부르면 아직 없다. 실제로 그렇게 터졌다(`$ is not defined`).
   최상위 const 는 스크립트끼리 같은 global lexical 환경을 쓰므로 아래에서 다시
   선언하면 안 된다 — 정본은 여기 한 벌이다. */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = n => (n ?? 0).toLocaleString("ko-KR");
</script>
    <!--VIEWS-->
    <!-- 배포 전용 섹션(templates/sections/*.html) — 담긴 뷰는 여기가 아니라
         자기 section-def 의 view/after 다. SM.sync() 가 view-def 순서를 보고
         제자리로 옮긴다(원본 뷰의 다른 섹션과 같은 방식). -->
    <!--SECTIONS-->
  </div>
</main>
