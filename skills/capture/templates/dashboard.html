    const runs = [...(band ? band.querySelectorAll("[data-run]") : [])];
    const at = sec => new Set(runs.filter(b => b.classList.contains("sec") === sec)
      .map(b => b.dataset.run));
    // 한 단계를 띠가 주요로도 보조로도 들고 있으면 주요가 이긴다 — 뺀 것을 다시
    // 흐리게 칠할 일이 없게 faded 에서 taken 을 덜어 낸다.
    const taken = at(false), faded = at(true);
    // 호스팅의 머리줄 버튼(.sm-refresh)은 애드온이 같은 규칙으로 직접 칠한다 —
    // 두 곳이 같은 요소를 서로 끄고 켜지 않게 여기서는 로컬 칩만 본다.
    // [안내]의 단계 목록도 같은 화면이라 같은 규칙을 받는다. 표식은 한 벌이다:
    // data-run 은 "이 버튼을 누르면 이 단계가 돈다"는 뜻이고, 안내 칩에는 서버가
    // runnable 이라고 한 줄에만 붙는다(질문 0건이면 ai 단계의 명령이 /capture add 다).
    box.querySelectorAll(".vh .vh-cmd[data-run], .stp [data-run]").forEach(b => {
      const on = taken.has(b.dataset.run);
      b.classList.toggle("taken", on);
      b.classList.toggle("faded", !on && faded.has(b.dataset.run));
    });
  }
}
// 머리줄 버튼을 다는 시점은 이 파일이 못 정한다: 로컬은 viewCmds 가, 호스팅은
// 애드온(dash.html)이 자기 초기화 중 아무 때나 단다. 이벤트 순서로 맞추려 들면
// 응답이 빠를수록 잘 지는 경합이 된다 — 늦게 붙은 버튼도 같은 규칙을 받게
// 머리줄이 바뀌는 것만 지켜본다. (바꾸는 건 class 뿐이라 되돌아 불리지 않는다.)
const HEAD_WATCH = new MutationObserver(ms => {
  if (ms.some(m => m.target.closest && m.target.closest(".vh"))) dimHead();
});
HEAD_WATCH.observe($("content"), {childList: true, subtree: true});

// base(직전 값)를 주면 증감률까지 같이 말한다 — +471 만으로는 큰 건지 알 수 없다.
const delta = (d, invert, base, tip) => {
  if (!Number.isFinite(d) || d === 0) return "";   // 스냅샷 0개면 NaN — 안 그린다
  const good = invert ? d < 0 : d > 0;
  const sign = d > 0 ? "+" : "−";
  const pc = Number.isFinite(base) && base > 0
    ? `<em>${sign}${(Math.abs(d) / base * 100).toFixed(Math.abs(d) / base < .1 ? 1 : 0)}%</em>`
    : "";
  return `<span class="d ${good ? "up" : "down"}"${tip ? ` title="${esc(tip)}"` : ""}>` +
         `${sign}${Math.abs(d).toLocaleString("ko-KR")}${pc}</span>`;
};
/* ── 펼침 패널 한 벌 ────────────────────────────────────────────────
   기회·키워드·순위·사이트 화면이 같은 것을 보여준다: 어느 페이지 얘기인지(표),
   그 페이지의 무엇이 잘못됐는지(진단), 그래서 뭘 하는지(할 일). 화면마다 따로
   만들면 같은 사실이 네 벌이 되고, 그중 셋은 언젠가 낡는다.
   진단 문장은 여기서 만들지 않는다 — scoring.page_advice 가 만든 것을 그린다. */
// 표는 좁은 화면에서 상자 안에서 넘친다 — 열이 다섯이라 390px 를 넘고, 상자가
// 없으면 펼침 패널이 아니라 페이지 전체가 옆으로 밀린다(table() 과 같은 규칙).
const pageTable = rows => !rows || !rows.length ? "" :
  `<div class="tw"><table class="dett"><thead><tr><th>페이지</th><th class="n">노출</th>
     <th class="n">클릭</th><th class="n">CTR</th><th class="n">평균순위</th></tr></thead>
   <tbody>${rows.map(r => `<tr><td><a href="${esc(r.page)}" target="_blank"
       rel="noopener">${esc(r.page)}</a></td>
     <td class="n">${num(r.impressions)}</td><td class="n">${num(r.clicks)}</td>
     <td class="n">${r.ctr}%</td><td class="n">${r.position ?? "—"}</td></tr>`).join("")}
   </tbody></table></div>`;

// 페이지 한 장의 진단 — "지금 이렇다 / 이렇게 바꿔라". audit 이 없으면 왜 없는지 말한다.
const pageFix = (audit, url) => {
  if (!audit)
    return `<p class="detn">${esc(url || "이 페이지")}는 아직 점검하지 않았습니다.
      <b>내 페이지 점검</b>이 돌면 제목·설명·본문을 직접 읽고 무엇을 바꿔야 하는지
      여기에 적습니다.</p>`;
  const head = `<p class="detn">${esc(audit.checked_date || "")} 점검 ·
    제목 ${audit.title ? `<b>${esc(audit.title)}</b>` : "없음"} ·
    본문 ${num(audit.words)}단어</p>`;
  const a = audit.advice || [];
  if (!a.length)
    return head + `<p class="detn">규칙으로 잡히는 문제가 없습니다.
      제목·설명·H1·본문 길이·구조화 데이터가 모두 기준 안입니다.</p>`;
  return head + `<div class="tw"><table class="dett fix"><thead><tr><th>손댈 자리</th>
      <th>지금 값</th><th>바꿀 값</th></tr></thead><tbody>${a.map(x =>
      `<tr class="lv-${esc(x.level)}"><td>${esc(x.tag)}</td><td>${esc(x.now)}</td>
        <td>${esc(x.fix)}</td></tr>`).join("")}</tbody></table></div>`;
};

// 할 일 목록 — kind 마다 손대는 자리가 다르다. 표는 각 화면이 갖는다.
// tail 은 이미 만든 마크업이라 esc 하지 않는다 — what 은 서버 산문이라 esc 한다.
// (둘을 한 문자열로 뭉쳐 넘기면 버튼이 글자로 나온다. 실제로 그랬다.)
const playList = (what, acts, tail) => (!what && !(acts || []).length) ? "" :
  `${what ? `<p class="detw">${esc(what)}${tail || ""}</p>` : ""}
   <ol class="deta">${(acts || []).map(x => `<li>${esc(x)}</li>`).join("")}</ol>`;

/* ── AI 에게 줄 수정 요청 프롬프트 ─────────────────────────────────
   화면은 "무엇을 바꿔야 하는지"까지 말한다. 그다음 사람이 하는 일은 그것을
   다시 손으로 옮겨 적는 것이었다 — 지금 title 이 무엇이고 검색어가 무엇이고
   본문이 몇 단어인지를. 그 옮겨 적기를 없앤다: 펼친 패널이 이미 아는 사실만
   모아 프롬프트 한 장으로 세우고, 복사 버튼 하나를 둔다.
   여기서 새로 판정하지 않는다 — audit·advice·할 일은 받은 것을 그대로 옮긴다. */
function fixPrompt(c) {
  const L = [];
  L.push("아래 페이지를 검색·AI 노출 관점에서 고쳐 주세요.", "");
  L.push("## 대상");
  if (c.url) L.push(`- 페이지: ${c.url}`);
  (c.queries || []).slice(0, 5).forEach(q => L.push(
    `- 노리는 검색어: ${q.q}` + (q.note ? ` (${q.note})` : "")));
  if (c.problem) L.push(`- 지금 문제: ${c.problem}`);
  L.push("");

  const a = c.audit;
  if (a && !a.error) {
    const h1 = (() => { try { return JSON.parse(a.h1_json || "[]"); } catch (e) { return []; } })();
    const sc = (() => { try { return JSON.parse(a.schema_json || "[]"); } catch (e) { return []; } })();
    L.push(`## 지금 이 페이지 상태 (${a.checked_date || "점검일 미상"} 직접 확인)`);
    L.push(`- title: ${a.title || "(없음)"}${a.title ? ` — ${a.title.length}자` : ""}`);
    L.push(`- meta description: ${a.meta_description || "(없음)"}`);
    L.push(`- H1: ${h1.length ? h1.join(" / ") : "(없음)"}`);
    L.push(`- 본문 길이: ${a.words}단어`);
    L.push(`- 구조화 데이터: ${sc.length ? sc.join(", ") : "(없음)"}`);
    if (a.canonical) L.push(`- canonical: ${a.canonical}`);
    if (a.robots) L.push(`- meta robots: ${a.robots}`);
    L.push("");
    if ((a.advice || []).length) {
      L.push("## 진단 — 고쳐야 할 것");
      a.advice.forEach((x, i) => L.push(`${i + 1}. [${x.tag}] 지금: ${x.now} → ${x.fix}`));
      L.push("");
    }
  } else if (c.url) {
    L.push("## 지금 이 페이지 상태",
           a && a.error ? `- 점검 실패: ${a.error}`
                        : "- 아직 페이지를 직접 점검하지 않았습니다. 아래 내용을 확인하고 고쳐 주세요.",
           "");
  }

  if ((c.acts || []).length) {
    L.push("## 이 상황에서 해야 할 일");
    c.acts.forEach((x, i) => L.push(`${i + 1}. ${x}`));
    L.push("");
  }

  // 만들어 줄 것은 **상황이 정한다.** 색인이 막혔거나 내부 경쟁이거나 모바일이
  // 느린 페이지에 "새 title 3안, 목차, JSON-LD"를 시키면 필요 없는 글이 나오고,
  // 진짜 할 일(robots 한 줄, 301, 이미지 크기)은 그 밑에 묻힌다.
  const want = (c.deliver && c.deliver.length) ? c.deliver : deliverFrom(c.audit);
  L.push("## 만들어 줄 것");
  want.forEach((x, i) => L.push(`${i + 1}. ${x}`));
  L.push(`${want.length + 1}. 위 진단 항목별로 무엇을 어떻게 바꿨는지 한 줄씩`);
  L.push("",
    "규칙: 확인되지 않은 수치·후기·효능 표현은 쓰지 마세요. 사실은 이 페이지에 이미",
    "있는 내용에서만 가져오고, 모르는 것은 [확인 필요]로 남겨 주세요.",
    "위에 없는 것까지 알아서 손대지 마세요 — 요청한 것만 만듭니다.");
  return L.join("\n");
}

// 진단 tag → 그것을 고치는 데 실제로 필요한 산출물. 호출부가 deliver 를 주면
// 그쪽이 이긴다(그 화면이 상황을 더 잘 안다). 단서가 없을 때만 최소 요청.
const DELIVER = {
  "title": "새 title 3안 — 검색어를 앞에 두고, 한글 30자(로마자 60자) 이내",
  "meta description": "meta description 2안 — 한글 80자(로마자 160자) 이내, 클릭할 이유를 담아서",
  "H1": "H1 문안 하나 — title 과 같은 말을 하도록",
  "본문": "본문에 추가할 H2 목록과 각 항목에서 답할 내용 — 이미 있는 문단은 그대로 둡니다",
  "구조화 데이터": "이 페이지에 맞는 구조화 데이터(JSON-LD) 한 벌",
  "robots": "고칠 meta robots 값과 그 태그가 들어갈 위치",
  "canonical": "canonical 을 어느 URL 로 바꿀지와 그 근거",
  "이미지": "alt 가 빠진 이미지에 넣을 문안",
  "내부 링크": "어느 글에서 이 페이지로 링크를 걸지 — 앵커 텍스트까지",
  "가져오기": "이 URL 이 안 열리는 원인 후보와 확인 순서 — 콘텐츠는 손대지 않습니다",
};

function deliverFrom(audit) {
  const tags = [...new Set(((audit && audit.advice) || []).map(x => x.tag))];
  const out = tags.map(t => DELIVER[t]).filter(Boolean);
  return out.length ? out
    : ["지금 이 페이지에서 가장 먼저 고칠 것 세 가지와, 각각 무엇을 무엇으로 바꿀지"];
}

// 프롬프트 상자 — 접혀 있다가 펴면 본문이 보이고, 버튼 하나로 복사한다.
const askBlock = c => {
  const t = fixPrompt(c);
  return `<details class="ask"><summary>요청문 만들기</summary>
    <div class="pbox">
      <div class="pb-h"><span>그대로 복사해 Claude·ChatGPT 에 붙여 넣습니다</span>
        <button type="button" onclick="copyPrompt(this)">복사</button></div>
      <textarea readonly rows="14" spellcheck="false">${esc(t)}</textarea>
    </div></details>`;
};

// 박제 보고서는 file:// 로도 열린다 — 거기서는 clipboard API 가 막히므로
// execCommand 로 물러선다(둘 다 실패하면 사용자가 직접 고르게 안내한다).
window.copyPrompt = function (btn) {
  const ta = btn.closest(".pbox").querySelector("textarea");
  const done = ok => {
    btn.textContent = ok ? "복사함" : "직접 선택";
    setTimeout(() => { btn.textContent = "복사"; }, 2000);
  };
  ta.select();
  ta.setSelectionRange(0, ta.value.length);
  if (navigator.clipboard && window.isSecureContext)
    return navigator.clipboard.writeText(ta.value).then(() => done(true), () => done(false));
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
  done(ok);
};


/* ── 기회 한 벌: 대상으로 찾아 쓰는 창구 ────────────────────────────────────
      개요만 이 기계에 물려 있었다. 나머지 화면은 숫자만 보여 주고 "뭘 먼저",
      "왜", "했다고 표시"를 못 했다 — 재료(d.opps)는 내내 같은 페이로드에 실려
      왔는데 아무도 안 읽었다. 화면은 아래 여섯만 안다:

        oppOf(대상)    한 건 (점수 높은 순 첫째)      oppsOf(대상)  전부
        oppScore(o)    점수 칸        oppMeter(o)    막대
        oppWhy(o)      종류 라벨 + 근거               oppActs(o)    확인·완료·제외
        oppPanel(o)    펼침 내용 (할 일·페이지·고칠 곳·프롬프트)

      대상 문자열은 화면마다 출처가 다르다(GSC 검색어·추적 키워드·URL·도메인).
      대소문자와 앞뒤 공백만 맞춰 찾는다 — 그 이상은 맞히려 들지 않는다.  ── */
window.OPP_LABEL = {new:"새 기회", acked:"확인함", done:"완료", dismissed:"제외함"};
window.SD_PERIOD = "";        // "28일" — 평균 게재순위라는 주석에 쓰는 기간

const oppKey = t => String(t ?? "").trim().toLowerCase();
let OPP_INDEX = {};
// render() 가 매 적재마다 다시 세운다. 같은 대상에 기회가 둘 이상 붙는다
// (검색어 하나가 striking_distance 이면서 ctr_gap 일 수 있다) — 배열로 둔다.
function oppIndex(opps) {
  OPP_INDEX = {};
  for (const o of opps || []) {
    const k = oppKey(o.target);
    (OPP_INDEX[k] || (OPP_INDEX[k] = [])).push(o);
  }
  for (const k in OPP_INDEX)
    OPP_INDEX[k].sort((a, b) => (b.score ?? 0) - (a.score ?? 0));
}
window.oppsOf = t => OPP_INDEX[oppKey(t)] || [];
window.oppOf = t => (OPP_INDEX[oppKey(t)] || [])[0] || null;

// 점수가 없는 줄(기회가 안 붙은 대상)에서는 단위도 설명도 안 붙인다 — 좁은 칸에서
// "—" 와 "점" 이 두 줄로 갈라져 고장난 것처럼 읽히고, 뜯어보면 "— 점 / 100점"이라는
// 말이 안 되는 안내가 붙어 있었다. 자리(width)는 그대로 잡아 둔다: 빼 버리면
// 옆 열이 줄마다 다른 자리에서 시작한다.
window.oppScore = o => Number.isFinite(o && o.score)
  ? `<div class="score" title="${o.score}점 / 100점. 높을수록 먼저 손댑니다.">`
    + `${Math.round(o.score)}<span class="u">점</span></div>`
  : `<div class="score none" title="이 줄에는 아직 붙은 기회가 없습니다.">—</div>`;

window.oppMeter = o => Number.isFinite(o && o.score)
  ? `<div class="meter${isDefensive(o) ? " def" : ""}" title="${o.score}점 / 100점">
       <i style="width:${Math.min(100, Math.max(0, o.score))}%"></i></div>` : "";

const isDefensive = o => o && (o.is_defensive
  ?? ["rank_decay", "cannibalization", "backlink_broken", "crawl_issue"].includes(o.kind));

// GA4 매출 잠재력 배지 — dashboard.py gather() 가 승수가 1.0이 아닐 때만 ga4_mult 를
// 얹어 보낸다(scoring.value_mult). 값이 없으면 아무것도 안 그린다 — GA4 미연결
// 프로젝트는 지금까지와 똑같다.
window.gaBadge = o => o && o.ga4_mult != null
  ? `<span class="gm lat ${o.ga4_mult > 1 ? "gm-up" : "gm-down"}"
       title="GA4 전환 반영 전 ${o.ga4_pre_score ?? "—"}점 → ${o.ga4_mult > 1 ? "전환 확인" : "전환 0 확인"} ×${o.ga4_mult}"
       >GA4 ${o.ga4_mult > 1 ? "▲" : "▼"} ×${o.ga4_mult}</span>` : "";

// 칩에 손을 얹으면 여태 `striking_distance` 같은 **내부 id** 가 떴다 — 사용자가
// 본 적 없는 말이고, 라벨이 이미 한글인데 그 옆에 영문 id 를 들이미는 셈이었다.
// 통칭표(kind_labels, 정본은 scoring.KINDS)의 한글 말로 답한다.
window.kindTip = o => (window.KIND_LABELS || {})[o.kind] || o.label || "";
window.oppWhy = o => !o ? "" : `<div class="oh">
    <span class="kind${isDefensive(o) ? " k-def" : ""}" title="${esc(window.kindTip(o))}"
      >${esc(o.label || o.kind)}</span>
    <span class="st st-${o.status}">${window.OPP_LABEL[o.status] || esc(o.status)}</span>
    ${window.gaBadge(o)}
  </div>${o.reasoning ? `<div class="why">${esc(o.reasoning)}</div>` : ""}`;

/* 상태 바꾸기. 라벨은 누른 뒤에 무엇이 보이는지로 짓는다 — "확인"은 무엇이
   달라지는지를 말하지 않는다. 누르면 카드의 상태 배지가 그 말로 바뀐다.

   접힌 줄에는 **다음 하나만** 둔다. 셋을 다 두면 두 줄짜리 목록에 버튼이 여섯 개
   서고, 그중 다섯은 지금 누를 일이 없는 것이라 목록이 버튼밭으로 읽힌다.
   나머지는 펼침 패널이 갖는다 — 거기서는 진짜 다음 행동(요청문 만들기)이
   주요고 상태 바꾸기는 보조다. */
const OPP_NEXT = {new: ["acked", "확인 표시"], acked: ["done", "완료 표시"],
                  done: ["new", "새 기회로 되돌리기"], dismissed: ["new", "새 기회로 되돌리기"]};
const OPP_SET = {acked: "확인 표시", done: "완료 표시",
                 dismissed: "목록에서 빼기", new: "새 기회로 되돌리기"};
const oppBtn = (o, st) => `<button onclick="setOpp(${o.id},'${st}')">${OPP_SET[st]}</button>`;

// 박제본에는 서버가 없다 — 누르면 저장된다는 말이 거짓이 되므로 버튼을 안 낸다.
// 콘텐츠 작성 버튼은 호스팅에만 있다(SM.host.oppBtn) — 플러그인은 Claude 채팅으로 간다.
window.oppActs = o => {
  if (!o || READONLY || o.id == null) return "";
  // 접힌 줄에는 상태를 바꾸는 다음 하나 + 콘텐츠 작성(호스팅 전용)뿐이다.
  // 작성은 상태 바꾸기와 다른 축이라 여기 남는다 — 이 기회로 실제로 할 일이다.
  const n = OPP_NEXT[o.status];
  const write = SM.host.oppBtn ? SM.host.oppBtn(o.id) : "";
  if (!n && !write) return "";
  return `<div class="acts" onclick="event.stopPropagation()"` +
    `>${n ? oppBtn(o, n[0]) : ""}${write}</div>`;
};

// 펼침 패널이 갖는 나머지 상태 — 지금 상태와 접힌 줄이 이미 낸 것은 뺀다.
const oppRest = o => {
  if (!o || READONLY || o.id == null) return "";
  const shown = (OPP_NEXT[o.status] || [])[0];
  const rest = Object.keys(OPP_SET).filter(st => st !== o.status && st !== shown);
  return rest.length
    ? `<div class="acts oppset">${rest.map(st => oppBtn(o, st)).join("")}</div>` : "";
};

window.oppPanel = o => o ? oppDetail(o) : "";

// 글자로만 "[개요]에서" 라고 말하던 자리를 실제로 눌리게 한다. 화면 이름은
// SM.views(=view-def)의 정본에서 읽는다 — 라벨을 두 벌로 만들지 않는다.
// 그 배포에 없는 화면(호스팅의 [설정], 박제본의 [안내])이면 글자로 물러선다.
window.go = (id, label) => {
  // 이름은 매니페스트(window.__VIEWS__)에서 읽는다 — SM.views 는 이 배포에서 뺀
  // 화면이 이미 빠져 있어서, 거기서 찾으면 없는 화면이 영문 id 로 찍힌다.
  const def = (window.__VIEWS__ || []).find(v => v.id === id);
  const t = label || `[${(def && def.title) || id}]`;
  return SM.at(id) >= 0
    ? `<button type="button" class="gov" onclick="SM.touched=true;SM.show('${id}')">${esc(t)}</button>`
    : esc(t);          // 이 배포에 없는 화면(호스팅의 설정, 박제본의 안내)은 글자로 물러선다
};

/* ── 차트 헬퍼(window.ch*) ─────────────────────────────────────────────
   views/overview.html 의 kpiSpark·dailyChart 와 views/ai.html 의 AI_trendChart 가
   같은 스파크라인·로그 SVG 를 각자 그리고 있었다 — 뷰가 늘수록 그 실수가 늘어난다.
   여기 한 벌로 세운다. 전부 SVG 문자열만 반환(DOM 조작 아님) — 뷰는 innerHTML 로
   꽂는다. 색은 이 파일 위쪽 토큰(--patina/--copper/--slate/--bar)만 쓴다:
   이중축 금지, 순서형에는 같은 hue 의 명암, 도넛은 on 조각만 강조, 9번째 계열에
   새 색을 만들지 않는다(그 밖으로 접는다). 글자는 전부 먹색 토큰 — 계열 색을
   글자에 쓰지 않는다. */
const CH_TONE = {patina:"var(--patina)", copper:"var(--copper)", slate:"var(--slate)", bar:"var(--bar)"};
const chTone = t => CH_TONE[t] || "var(--slate)";
const chVal = (v, unit) => `${num(v)}${unit || ""}`;

// 누적 막대 — kind:"base"|"total" 는 0 부터(기준을 다시 놓는다), "delta" 는
// 직전 누적에서 뜬다(양수 녹청·음수 산화동). 단계 사이는 점선으로 잇는다.
window.chWaterfall = (rows, opt = {}) => {
  if (!rows || !rows.length) return "";
  const W = opt.width || 760, H = opt.height || 220, unit = opt.unit || "";
  const L = 44, R = W - 12, T = 22, B = 34, n = rows.length;
  const gap = 10, bw = ((R - L) - gap * (n - 1)) / n;
  let run = 0;
  const bars = rows.map(r => {
    const isFlow = r.kind === "delta";
    const start = isFlow ? run : 0;
    run = isFlow ? run + (r.value || 0) : (r.value || 0);
    return {label: r.label, start, end: run, kind: r.kind, value: r.value};
  });
  const mx = Math.max(1, ...bars.map(b => Math.max(Math.abs(b.start), Math.abs(b.end))));
  const mn = Math.min(0, ...bars.map(b => Math.min(b.start, b.end)));
  const span = mx - mn || 1;
  const y = v => T + (mx - v) / span * (H - T - B);
  const x = i => L + i * (bw + gap);
  const rects = bars.map((b, i) => {
    const y1 = y(Math.max(b.start, b.end)), y2 = y(Math.min(b.start, b.end));
    const color = b.kind === "delta" ? (b.value >= 0 ? "var(--patina)" : "var(--copper)") : "var(--slate)";
    return `<g>
      <rect x="${x(i).toFixed(1)}" y="${y1.toFixed(1)}" width="${bw.toFixed(1)}"
        height="${Math.max(1, y2 - y1).toFixed(1)}" fill="${color}"
        opacity="${b.kind === "delta" ? .82 : .5}" rx="1.5">
        <title>${esc(b.label)} — ${b.value >= 0 && b.kind === "delta" ? "+" : ""}${chVal(b.value, unit)}</title>
      </rect>
      <text class="val" x="${(x(i) + bw / 2).toFixed(1)}" y="${(y1 - 6).toFixed(1)}" text-anchor="middle"
        >${b.value >= 0 && b.kind === "delta" ? "+" : ""}${chVal(b.value, unit)}</text>
      <text class="lbl" x="${(x(i) + bw / 2).toFixed(1)}" y="${H - 10}" text-anchor="middle"
        >${esc(b.label)}</text>
    </g>`;
  }).join("");
  const connectors = bars.slice(0, -1).map((b, i) =>
    `<line x1="${(x(i) + bw).toFixed(1)}" y1="${y(b.end).toFixed(1)}"
       x2="${x(i + 1).toFixed(1)}" y2="${y(b.end).toFixed(1)}"
       stroke="var(--rule)" stroke-dasharray="2 3"/>`).join("");
  // 눈금이 없으면 막대 높이가 값에 비례하는지를 눈으로 검산할 수 없다 — 실제로
  // 같은 높이인 두 막대가 다르게 읽혔다("+4 가 4 보다 커 보인다"). 왼쪽 여백은
  // 이미 비어 있으니 거기에 0·절반·최고 셋을 적고 옅은 가로선을 긋는다.
  // 반올림해서 같은 값이 되는 눈금은 하나만 남긴다(값 범위가 작을 때 겹친다).
  const seen = new Set();
  const grid = [mn, (mn + mx) / 2, mx].map(v => Math.round(v))
    .filter(v => !seen.has(v) && seen.add(v))
    .map(v => `<line class="grid" x1="${L}" y1="${y(v).toFixed(1)}" x2="${R}"
        y2="${y(v).toFixed(1)}"/>
      <text class="axis" x="${(L - 9).toFixed(1)}" y="${(y(v) + 3.5).toFixed(1)}"
        text-anchor="end">${chVal(v, unit)}</text>`).join("");
  const aria = `${n}단계 워터폴 — 시작 ${chVal(bars[0].end, unit)}, 끝 ${chVal(bars[n - 1].end, unit)}`;
  return `<div class="chwrap"><svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}">
    ${grid}
    <line x1="${L}" y1="${y(0).toFixed(1)}" x2="${R}" y2="${y(0).toFixed(1)}" stroke="var(--rule)"/>
    ${connectors}${rects}
  </svg></div>`;
};

// 한 줄 100% 스택 — 값이 전부 0 이면(총합 0) 회색 트랙만 그린다(안 깨진다).
window.chStackRow = (rows, opt = {}) => {
  if (!rows || !rows.length) return "";
  const W = opt.width || 640, H = opt.height || 34, unit = opt.unit || "";
  const total = rows.reduce((s, r) => s + Math.max(0, r.value || 0), 0);
  const L = 2, R = W - 2, track = R - L;
  let cx = L;
  const segs = total > 0 ? rows.map(r => {
    const w = Math.max(0, r.value || 0) / total * track;
    const seg = w > .5 ? `<rect x="${cx.toFixed(1)}" y="4" width="${w.toFixed(1)}" height="${H - 8}"
      fill="${chTone(r.tone)}"><title>${esc(r.label)} — ${chVal(r.value, unit)}
      (${(w / track * 100).toFixed(0)}%)</title></rect>` : "";
    cx += w;
    return seg;
  }).join("") : `<rect x="${L}" y="4" width="${track}" height="${H - 8}" fill="var(--bar)"/>`;
  const legend = rows.map(r => `<span><i style="background:${chTone(r.tone)}"></i>${esc(r.label)}
    ${chVal(r.value, unit)}</span>`).join("");
  const aria = total > 0 ? `구성비 — ${rows.map(r =>
    `${esc(r.label)} ${(Math.max(0, r.value || 0) / total * 100).toFixed(0)}%`).join(", ")}` : "데이터 없음";
  return `<div class="chwrap"><svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}"
    >${segs}</svg></div><div class="chleg">${legend}</div>`;
};

// 가로 막대 목록 — right 가 있으면 값 대신 그 글자를 오른쪽 열에 낸다(순위·배지 등).
// flag 는 방어형/경고 항목 표시(산화동), 아니면 기본(녹청).
window.chBarList = (rows, opt = {}) => {
  if (!rows || !rows.length) return "";
  const W = opt.width || 640, rowH = 26, pad = 6, unit = opt.unit || "";
  const H = rows.length * rowH + pad;
  const mx = Math.max(1, ...rows.map(r => Math.abs(r.value || 0)));
  const labelW = 132, rightW = 64, L = labelW, R = W - rightW, track = R - L;
  const bars = rows.map((r, i) => {
    const cy = pad + i * rowH;
    const w = Math.max(1, Math.abs(r.value || 0) / mx * track);
    return `<g>
      <text class="lbl" x="${(L - 10).toFixed(1)}" y="${(cy + rowH / 2 + 4).toFixed(1)}"
        text-anchor="end">${esc(r.label)}</text>
      <rect x="${L}" y="${(cy + 5).toFixed(1)}" width="${w.toFixed(1)}" height="${rowH - 10}"
        fill="${r.flag ? "var(--copper)" : "var(--patina)"}" opacity=".82" rx="1.5"/>
      <text class="val" x="${(R + 8).toFixed(1)}" y="${(cy + rowH / 2 + 4).toFixed(1)}"
        >${r.right != null ? esc(String(r.right)) : chVal(r.value, unit)}</text>
    </g>`;
  }).join("");
  const aria = `${rows.length}개 항목 — ` + rows.map(r => `${esc(r.label)} ${chVal(r.value, unit)}`).join(", ");
  return `<div class="chwrap"><svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}"
    >${bars}</svg></div>`;
};

// 도넛 — on 조각만 강조(녹청), 나머지는 회색 명암만 다르다(새 색 안 만든다).
// 한 조각뿐이거나 총합이 0 이어도(빈 도넛) 안 깨진다.
window.chDonut = (rows, opt = {}) => {
  if (!rows || !rows.length) return "";
  const S = opt.width || 120, cx = S / 2, cy = S / 2, ro = S / 2 - 4, ri = ro * .6, unit = opt.unit || "";
  const total = rows.reduce((s, r) => s + Math.max(0, r.value || 0), 0);
  let a0 = -Math.PI / 2;
  const arc = (r, i) => {
    const frac = total > 0 ? Math.max(0, r.value || 0) / total : 1 / rows.length;
    const a1 = a0 + Math.min(frac, .9999) * Math.PI * 2;  // frac===1 이면 원이 안 닫힌다
    const large = a1 - a0 > Math.PI ? 1 : 0;
    const p = (a, rad) => [cx + rad * Math.cos(a), cy + rad * Math.sin(a)];
    const [ox0, oy0] = p(a0, ro), [ox1, oy1] = p(a1, ro);
    const [ix1, iy1] = p(a1, ri), [ix0, iy0] = p(a0, ri);
    const color = r.on ? "var(--patina)" : "var(--slate)";
    const opacity = r.on ? 1 : .3 + (i % 3) * .12;
    a0 = a1;
    return `<path d="M${ox0.toFixed(1)},${oy0.toFixed(1)}
      A${ro.toFixed(1)},${ro.toFixed(1)} 0 ${large} 1 ${ox1.toFixed(1)},${oy1.toFixed(1)}
      L${ix1.toFixed(1)},${iy1.toFixed(1)}
      A${ri.toFixed(1)},${ri.toFixed(1)} 0 ${large} 0 ${ix0.toFixed(1)},${iy0.toFixed(1)} Z"
      fill="${color}" opacity="${opacity.toFixed(2)}"><title>${esc(r.label)} — ${chVal(r.value, unit)}
      ${total > 0 ? `(${(frac * 100).toFixed(0)}%)` : ""}</title></path>`;
  };
  const onSum = rows.filter(r => r.on).reduce((s, r) => s + Math.max(0, r.value || 0), 0);
  const centerPct = total > 0 && onSum > 0 ? `${Math.round(onSum / total * 100)}%` : "";
  const aria = total > 0 ? `도넛 — ${rows.map(r =>
    `${esc(r.label)} ${(Math.max(0, r.value || 0) / total * 100).toFixed(0)}%`).join(", ")}` : "데이터 없음";
  return `<div class="chwrap"><svg class="ch" viewBox="0 0 ${S} ${S}" role="img" aria-label="${esc(aria)}">
    ${rows.map(arc).join("")}
    ${centerPct ? `<text class="val" x="${cx}" y="${cy + 4}" text-anchor="middle" font-size="16"
      fill="var(--ink)">${centerPct}</text>` : ""}
  </svg></div>`;
};

// 단계별 감소 — 막대는 전부 같은 hue(녹청)의 명암만 달라진다(단계는 순서형이다).
// 라벨·값은 막대 밖(왼쪽·바로 옆)에 둔다 — 색 위에 글자를 얹지 않는다.
window.chFunnel = (steps, opt = {}) => {
  if (!steps || !steps.length) return "";
  const W = opt.width || 560, rowH = 34, pad = 6, unit = opt.unit || "";
  const H = steps.length * rowH + pad;
  const labelW = 120, noteW = 90, L = labelW, R = W - noteW, track = R - L;
  const mx = Math.max(1, ...steps.map(s => s.value || 0));
  const rows = steps.map((s, i) => {
    const cy = pad + i * rowH;
    const w = Math.max(2, (s.value || 0) / mx * track);
    const prev = i > 0 ? (steps[i - 1].value || 0) : null;
    const drop = prev ? Math.round((1 - (s.value || 0) / prev) * 100) : null;
    const op = (.85 - i * (.35 / Math.max(1, steps.length - 1))).toFixed(2);
    return `<g>
      <text class="lbl" x="${(L - 10).toFixed(1)}" y="${(cy + rowH / 2 + 4).toFixed(1)}"
        text-anchor="end">${esc(s.label)}</text>
      <rect x="${L}" y="${(cy + 6).toFixed(1)}" width="${w.toFixed(1)}" height="${rowH - 14}"
        fill="var(--patina)" opacity="${op}" rx="2"/>
      <text class="val" x="${(L + Math.max(w, 4) + 6).toFixed(1)}" y="${(cy + rowH / 2 + 4).toFixed(1)}"
        >${chVal(s.value, unit)}</text>
      ${drop != null ? `<text class="val" x="${(R + noteW - 4).toFixed(1)}"
        y="${(cy + rowH / 2 + 4).toFixed(1)}" text-anchor="end" fill="var(--copper)"
        >${esc(s.note || `−${drop}%`)}</text>` : ""}
    </g>`;
  }).join("");
  const first = steps[0], last = steps[steps.length - 1];
  const overall = first.value > 0 ? Math.round((1 - last.value / first.value) * 100) : 0;
  const aria = `${steps.length}단계 퍼널 — ${esc(first.label)} ${chVal(first.value, unit)}에서 `
    + `${esc(last.label)} ${chVal(last.value, unit)}까지, 총 ${overall}% 감소`;
  return `<div class="chwrap"><svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}"
    >${rows}</svg></div>`;
};

// 작은 배수 — 스케일이 다른 지표를 한 축에 욱여넣는 대신 그룹마다 자기 축(lo~hi)을
// 갖는다. items[0] 가 주인공(녹청), 나머지는 중립(회색). items 가 비어도 안 깨진다.
window.chDumbbell = (groups, opt = {}) => {
  if (!groups || !groups.length) return "";
  const W = opt.width || 560, rowH = 44, pad = 6, unit = opt.unit || "";
  const H = groups.length * rowH + pad;
  const L = 140, R = W - 16, track = R - L;
  const rows = groups.map((g, gi) => {
    const items = g.items || [];
    const vals = items.map(it => it.pos ?? it.value ?? 0);
    const lo = g.lo != null ? g.lo : Math.min(...vals, 0);
    const hi = g.hi != null ? g.hi : Math.max(...vals, 1);
    const span = hi - lo || 1;
    const cy = pad + gi * rowH + rowH / 2;
    const px = v => L + (Math.min(hi, Math.max(lo, v)) - lo) / span * track;
    const line = items.length > 1
      ? `<line x1="${px(vals[0]).toFixed(1)}" y1="${cy.toFixed(1)}"
          x2="${px(vals[vals.length - 1]).toFixed(1)}" y2="${cy.toFixed(1)}"
          stroke="var(--rule)" stroke-width="2"/>` : "";
    const dots = items.map((it, i) => `<circle cx="${px(vals[i]).toFixed(1)}" cy="${cy.toFixed(1)}"
      r="4" fill="${i === 0 ? "var(--patina)" : "var(--slate)"}"><title>${esc(it.label)} — `
      + `${chVal(vals[i], unit)}</title></circle>`).join("");
    return `<g>
      <line x1="${L}" y1="${cy.toFixed(1)}" x2="${R}" y2="${cy.toFixed(1)}" stroke="var(--bar)" stroke-width="4"/>
      <text class="lbl" x="${(L - 10).toFixed(1)}" y="${(cy + 4).toFixed(1)}"
        text-anchor="end">${esc(g.title)}</text>
      ${line}${dots}
    </g>`;
  }).join("");
  const aria = `작은 배수 ${groups.length}개 — ` + groups.map(g => esc(g.title)).join(", ");
  return `<div class="chwrap"><svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}"
    >${rows}</svg></div>`;
};

// 시계열 · 면적 + 선. mark 가 있는 점만 산화동으로 찍는다(문자열이면 title 에 얹는다).
window.chLine = (series, opt = {}) => {
  if (!series || series.length < 2) return "";
  const W = opt.width || 1000, H = opt.height || 180, unit = opt.unit || "";
  const L = 44, R = W - 16, T = 20, B = 26, n = series.length;
  const ys = series.map(p => p.y || 0);
  const mx = Math.max(...ys, 1), mn = Math.min(...ys, 0);
  const span = mx - mn || 1;
  const x = i => L + i * (R - L) / (n - 1);
  const y = v => H - B - (v - mn) / span * (H - T - B);
  const pts = series.map((p, i) => `${x(i).toFixed(1)},${y(p.y || 0).toFixed(1)}`).join(" ");
  const grid = [mn, (mn + mx) / 2, mx].map(v => `<line class="grid" x1="${L}" y1="${y(v).toFixed(1)}"
    x2="${R}" y2="${y(v).toFixed(1)}"/><text class="axis" x="${(L - 9).toFixed(1)}"
    y="${(y(v) + 3.5).toFixed(1)}" text-anchor="end">${chVal(Math.round(v), unit)}</text>`).join("");
  const step = Math.max(1, Math.ceil((n - 1) / 5)), idx = [];
  for (let i = 0; i < n; i += step) idx.push(i);
  if (idx[idx.length - 1] !== n - 1) idx.push(n - 1);
  const ticks = idx.map(i => `<text class="axis" x="${x(i).toFixed(1)}" y="${H - 6}"
    text-anchor="${i === 0 ? "start" : i === n - 1 ? "end" : "middle"}">${esc(String(series[i].x))}</text>`
  ).join("");
  const marks = series.map((p, i) => p.mark ? `<circle cx="${x(i).toFixed(1)}" cy="${y(p.y || 0).toFixed(1)}"
    r="3.4" fill="var(--copper)"><title>${esc(String(p.x))} — ${chVal(p.y, unit)}`
    + `${p.mark !== true ? ` · ${esc(String(p.mark))}` : ""}</title></circle>` : "").join("");
  const last = series[n - 1];
  const aria = `${n}개 지점 추이 — 최근 ${esc(String(last.x))} ${chVal(last.y, unit)}`;
  return `<div class="chwrap"><svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}">
    ${grid}
    <polygon points="${x(0)},${y(mn).toFixed(1)} ${pts} ${x(n - 1)},${y(mn).toFixed(1)}" fill="var(--wash)"/>
    <polyline fill="none" stroke="var(--patina)" stroke-width="1.5" stroke-linecap="round"
      stroke-linejoin="round" points="${pts}"/>
    ${marks}${ticks}
  </svg></div>`;
};

// 기회 kind 의 한국어 라벨·처방(what/acts/deliver)은 이제 파이썬(scoring.py 의
// KINDS 명부)이 정하고, dashboard.py 의 gather() 가 각 기회에 label·play 로 실어
// 보낸다 — 화면은 그리기만 한다. striking_distance(밴드)·content_gap(갈래)도
// 서버가 이미 갈라 낸 것을 받는다. 예전에는 이 산문이 여기 KIND_LABEL·SD_LABEL·
// PLAY 세 벌로 있었고, SD_BAND·GAP_KIND 곁표를 매 렌더마다 되짚었다.

window.sdAvgNote = () => `이 순위는 구글이 보고한 ${window.SD_PERIOD || "기간"} 평균 게재순위입니다.`
  + ` 노출된 순간들의 평균이라 지금 직접 검색하면 안 보일 수 있습니다.`
  + ` 실제로 검색해서 잰 순위는 ${window.go("rank")} 화면에 있습니다.`;
/* ── 펼침 패널: 무엇이 걸렸고, 어느 페이지 얘기고, 그래서 뭘 하면 되나 ──
      근거 문장은 숫자를 요약할 뿐이라 "그래서 어디를 고치냐"에 답하지 못했다.
      표(어느 URL 이 이 검색어로 걸려 있나)는 payload 의 opp_pages 가 대고,
      할 일은 o.play 가 댄다. ── */
function oppDetail(o) {
  const pages = (window.QUERY_PAGES || {})[o.target] || [];
  const p = o.play || {};
  // striking_distance 의 "무엇을" 뒤에는 평균 게재순위 안내 + [순위] 화면 버튼이
  // 이어 붙는다 — 그 버튼(window.go)은 화면에서만 만들 수 있어 서버 문구에는
  // 없다(scoring._SD_PLAY 주석 참고). 여기서만 이어 붙인다.
  const sdTail = o.kind === "striking_distance" && p.what
    ? ` ${window.sdAvgNote()}` : "";
  // 이 기회에서 실제로 손댈 페이지 — 노출이 가장 큰 것. 감사 결과가 있으면
  // "지금 title 이 무엇이고 무엇을 바꿔라"까지 나온다(없으면 왜 없는지 말한다).
  const url = o.target.startsWith("http") ? o.target : (pages[0] && pages[0].page);
  const audit = url ? (window.PAGE_AUDITS || {})[url] : null;
  // 못 찾았을 때 왜 없는지는 대상이 무엇이냐에 달렸다 — 챗봇 질문은 문장이라
  // 애초에 GSC 검색어 목록에 없고, 도메인·클러스터는 페이지 개념이 아니다.
  // 한 문장으로 뭉치면 "대상이 URL 이거나…"처럼 틀린 이유를 대게 된다.
  const NOTE = {
    ai_citation_gap: "이 질문으로 걸린 내 페이지가 아직 없습니다. 챗봇 질문은 문장이라 "
      + "구글 검색어 목록에 그대로 잡히는 일이 드뭅니다. 아래 할 일은 새로 쓸 글 기준입니다.",
    backlink_prospect: "이 대상은 남의 도메인입니다. 고칠 내 페이지가 아니라 연락할 곳입니다.",
    coverage: "이 대상은 주제 묶음입니다. 아직 이 주제를 다루는 페이지가 없다는 뜻입니다.",
  };
  const note = pages.length || o.target.startsWith("http") ? ""
    : `<p class="detn">${NOTE[o.kind] || "이 검색어로 걸린 페이지를 아직 모으지 않았습니다. "
      + "페이지별 실적을 수집하면 어느 페이지가 걸렸는지 여기에 나옵니다."}</p>`;
  // 프롬프트 재료는 여기 이미 다 있다 — 손으로 다시 옮겨 적지 않게 한 장으로 세운다.
  const ask = askBlock({
    url, audit, acts: p.acts, deliver: p.deliver,
    problem: `${o.label || o.kind} — ${o.reasoning || ""}`,
    queries: o.target.startsWith("http") ? [] : [{
      q: o.target,
      note: pages[0] ? `노출 ${num(pages[0].impressions)} · 클릭 ${num(pages[0].clicks)}`
                       + ` · CTR ${pages[0].ctr}% · 평균 ${pages[0].position ?? "—"}위` : "",
    }],
  });
  // 패널 맨 밑이 이 기회의 다음 행동이다: 요청문 만들기가 주요고, 상태 바꾸기는 보조.
  return `<div class="det">${playList(p.what, p.acts, sdTail)}${pageTable(pages)}${note}
    ${url ? `<p class="detw">고칠 페이지: <a href="${esc(url)}" target="_blank"
      rel="noopener">${esc(url)}</a></p>${pageFix(audit, url)}` : ""}${ask}${oppRest(o)}</div>`;
}

/* 상태 바꾸기. 여태 응답을 안 봤다 — 403(토큰 만료)이 와도 load() 가 돌고 화면은
   바뀐 것이 없는 채로 조용했다. 누른 사람에게는 버튼이 죽은 것으로 보인다.
   실패하면 말하고 배지는 그대로 둔다(거짓 성공을 그리지 않는다). */
async function setOpp(id, status) {
  const [ok, r] = await post("/api/opp", {id, status});
  if (!ok) return toast((r && r.error) ||
    "상태를 바꾸지 못했습니다. [새로고침] 뒤 다시 하면 됩니다.", "bad");
  toast(OPP_DONE[status] || "바꿨습니다.", "ok");
  load();
}
// 누른 뒤에 무엇이 달라졌는지로 말한다 — "저장됨"은 무엇이 저장됐는지 말하지 않는다.
const OPP_DONE = {acked: "확인했습니다.", done: "완료로 옮겼습니다.",
                  dismissed: "목록에서 뺐습니다.", new: "새 기회로 되돌렸습니다."};

// SERP 정수 순위의 Δ — 판정(flat 여부)은 서버(scoring.rank_delta)가 하고,
// 여기서는 마크업만 만든다. 보합일 때 실제 값은 title로 남긴다.
const rankDelta = rd => {
  if (!rd) return "";
  const d = typeof rd === "object" ? rd.delta : rd;
  const flat = typeof rd === "object" ? rd.flat : (Number.isFinite(d) && Math.abs(d) < (RULES.rank_noise || 3));
  if (!Number.isFinite(d)) return "";
  if (flat)
    return `<span class="d muted" title="실제 변화 ${d > 0 ? "+" : d < 0 ? "−" : ""}` +
           `${Math.abs(d)}칸. ±${(RULES.rank_noise || 3) - 1}칸까지는 흔들림으로 봅니다.">보합</span>`;
  return delta(d);
};
// 머리글 표기: ">"로 시작하면 숫자 열(우측 정렬), "?"뒤는 그 열의 근거 설명.
//   ">순위?구글이 보고한 평균 게재순위"
// 줄이 SORT_MIN 을 넘으면 머리글이 정렬 손잡이가 되고 머리글 자체가 붙박인다.
const SORT_MIN = 8;
const table = (heads, rows, empty) => {
  // 빈 표에도 다음 걸음이 있어야 한다 — 부르는 쪽이 empty 로 더 구체적인 말을
  // 주면 그쪽이 이긴다(그 화면이 무엇을 돌려야 채워지는지 안다).
  // 이 기본 문장은 배포로 안 가른다: 무엇을 누르는지는 화면 머리의 칩·버튼이 이미
  // 말하고, 여기서 "명령을 치세요 / 버튼을 누르세요"를 갈라 봐야 같은 말을 두 낱말로
  // 부르는 것뿐이다. 갈라야 할 것은 낱말이 아니라 행동이고, 행동은 empty 가 갖는다.
  if (!rows.length)
    return `<div class="empty">${empty ||
      "<b>아직 채울 자료가 없습니다</b><p>이 화면을 채우는 단계를 한 번 돌리면 표가 생깁니다.</p>"}</div>`;
  const long = rows.length >= SORT_MIN;
  const th = heads.map((h, i) => {
    const num = h.startsWith(">");
    const [name, why] = h.replace(/^>/, "").split("?");
    return `<th class="${num ? "num" : ""}"${long ? ` data-s="${i}"` : ""}>` +
      // 툴팁은 fixed 라 표 상자 안에서도 안 잘린다 — title 은 안 싣는다(실으면
      // 말풍선과 브라우저 툴팁이 같은 말을 두 번 띄운다). 키보드로도 닿아야 하므로
      // tabindex 를 주고 aria-label 로 같은 말을 갖는다.
      `${esc(name)}${why ? `<span class="hint" tabindex="0" data-tip="${esc(why)}"` +
        ` aria-label="${esc(why)}">i</span>` : ""}</th>`;
  }).join("");
  const t = `<table><thead><tr>${th}</tr></thead><tbody>${rows.join("")}</tbody></table>`;
  return `<div class="tw${long ? " long" : ""}">${t}</div>`;
};

// 표는 화면 밖에서도 이어진다 — 지금 걸러 놓은 목록 그대로 파일로 준다.
// 맨 앞 BOM 이 있어야 엑셀이 한글을 안 깬다. 화면마다 이 함수를 다시 만들고 있었고
// (여덟 벌) 그 사이 처리가 갈라졌다 — 한 벌만 String(c ?? "") 이고 나머지는
// String(c) 라, 빈 칸이 literal "null" 로 나갔다. 여기가 그 한 자리다.
const csv = (name, rows) => {
  const body = "\uFEFF" + rows.map(r => r.map(
    c => `"${String(c ?? "").replace(/"/g, '""')}"`).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([body], {type: "text/csv;charset=utf-8"}));
  a.download = `seo-miner-${name}-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
};

// 정렬은 위임 한 곳에서. 표를 그리는 쪽은 아무것도 안 해도 된다.
document.addEventListener("click", e => {
  const th = e.target.closest("th[data-s]");
  if (!th) return;
  const i = +th.dataset.s, tbl = th.closest("table");
  const desc = !th.classList.contains("desc");
  tbl.querySelectorAll("th[data-s]").forEach(o => o.classList.remove("asc", "desc"));
  th.classList.add(desc ? "desc" : "asc");
  const body = tbl.tBodies[0];
  // 숫자 열이면 숫자로, 아니면 글자로. "12위"·"1,204"·"+8" 같은 표기에서 수를 꺼낸다.
  const key = tr => {
    const c = tr.cells[i]; if (!c) return desc ? -Infinity : Infinity;
    const t = c.textContent.trim();
    if (!th.classList.contains("num")) return t;
    const n = parseFloat(t.replace(/[^\d.+-]/g, ""));
    return Number.isFinite(n) ? n : (desc ? -Infinity : Infinity);
  };
  [...body.rows]
    .sort((a, b) => { const x = key(a), y = key(b);
      const r = typeof x === "string" ? x.localeCompare(y, "ko") : x - y;
      return desc ? -r : r; })
    .forEach(tr => body.appendChild(tr));
});

// 브라우저는 아무 사이트에서나 127.0.0.1로 POST를 보낼 수 있어서 서버가 1회용 토큰을
// 요구한다 — 대시보드를 띄울 때 받은 주소(?t=…)에 들어 있다.
const TOKEN = new URLSearchParams(location.search).get("t") || "";
async function post(path, body) {
  const res = await fetch(path, {method:"POST", body: JSON.stringify(body),
    headers:{"Content-Type":"application/json", "X-Token": TOKEN}});
  return [res.ok, await res.json()];
}

// 임계값은 서버 payload(d.rules)에서만 온다 — JS 리터럴 기본값은 두지 않는다.
let RULES = {};

let READONLY = false;                    // 박제된 기록에서는 상태를 바꿀 수 없다

/* ── 안내: 이 도구를 쓰는 순서 ────────────────────────────────
   순서가 정보다 — 앞 단계가 없으면 뒤 단계는 재료가 없어 돌지 않는다.
   판정(done·지금 할 것·명령·runnable)은 서버가 한다(stage.from_progress) — 여기서
   다시 판정하면 화면과 doctor·CLI가 서로 다른 다음 할 일을 말하게 된다. 이 화면은
   그 칩을 SM.host.stepChip 에 넘겨 그리기만 한다. */
function renderGuide(d) {
  if (READONLY || !d.guide) return;      // 박제본에는 "지금 할 것"이 없다
  const steps = d.guide.steps, here = d.guide.here;
  // data-stage 는 stage.py 가 실어 보낸 단계 id 다. 이름을 다른 말로 쓰는 계층
  // (호스팅판)이 렌더된 한국어를 정규식으로 되짚지 않고 id 로 갈아끼우게 하는 자리다.
  // 제목은 .t 로 감싼다 — 텍스트 노드를 헤집지 않고 통째로 바꿀 수 있어야 한다.
  $("shaft").innerHTML = steps.map((s, i) => {
    const cls = s.done ? "done" : i === here ? "here" : "later";
    return `<div class="stp ${cls}" data-stage="${esc(s.id)}">
      <div class="rail"><div class="dot">${i + 1}</div></div>
      <div class="body">
        <div class="txt">
          <h3><span class="t">${esc(s.t)}</span>${s.done ? '<span class="ok">✓</span>' : ""}
            <span class="state">${esc(s.state)}</span>
            ${i === here ? '<span class="now">지금 할 것</span>' : ""}</h3>
          <p class="gain">${esc(s.gain)}</p>
        </div>
        <div>${s.done ? "" : SM.host.stepChip(s)}</div>
      </div></div>`;
  }).join("");
  // 되돌아갈 자리는 2번 단계다 — 이름을 여기 박아 두면 stage.py 와 어긋난다.
  const back = steps[1]
    ? `2. <b data-stage="${esc(steps[1].id)}">${esc(steps[1].t)}</b>` : "<b>2번 단계</b>";
  // 배너의 "지금 할 것" 채우기. 이름표와 단계 이름을 줄표로 잇지 않는다 —
  // 이름표는 .nxk 로 세우고 단계 이름이 문장의 주어가 된다.
  const nx = $("nx");
  if (nx) {
    // 이름표는 한 벌이다 — 두 배포가 할 수 있는 일이 다른 게 아니라 낱말만 달랐다.
    nx.innerHTML = here === -1
      ? `<span class="nxk">한 바퀴 완주</span>` +
        `<span>${back}부터 다시 재면 그동안 고친 것이 숫자로 보입니다.</span>`
      : `<span class="nxk">지금 할 것</span>` +
        `<span><b data-stage="${esc(steps[here].id)}">${esc(steps[here].t)}</b></span>` +
        // 명령은 칠 곳이 있는 배포에서만 낸다 — 웹에는 채팅이 없다. 애드온이
        // CSS 로 감추고 있었지만, 감춘 글자는 여전히 화면 글자다(복사·읽어주기).
        (!window.SM_HOSTED && steps[here].cmd
          ? ` <code>${esc(steps[here].cmd)}</code>` : "");
    banSync();          // 이제 배너에 할 말이 생겼다
  }
  const db_ = $("donebar");
  if (db_) {
    db_.hidden = here !== -1;
    // 단계 수는 여기서 세지 않는다 — stage.py 가 실어 보낸 목록 길이가 정본이다.
    if (here === -1) db_.innerHTML =
      `<b>한 바퀴를 다 돌았습니다</b> ${steps.length}단계를 모두 마쳤습니다.
       다음은 ${back}부터입니다. 고친 것이 순위와 인용에 반영됐는지는 다시 잴 때
       숫자로 나옵니다.`;
  }
  // 아직 한 바퀴도 안 돈 프로젝트면 [안내]부터 보여준다 — 개요에 그릴 숫자가 없다.
  // progress 는 /api/data 페이로드에만 있다 — 사이트가 없을 때는 doctor 가 부른다.
  if (here !== -1 && !(d.progress || {}).gsc_days) SM.land("guide", 1);
  // 이 함수가 방금 새로 그린 자리에도 대체 문구를 입힌다. render() 끝에서도 한 번
  // 돌지만 순서에 기대지 않는다 — applyWording 은 속성을 지우므로 두 번 돌아도 공짜다.
  applyWording($("guide"));
}

function copyCmd(el) {
  // 칩 안의 글자만 바뀌면 눌렀는지 놓치기 쉽다 — 토스트로 한 번 더 말한다.
  // 클립보드가 막힌 환경(권한 거부·비보안 출처)에서는 조용히 끝나면 안 된다:
  // 무엇을 하면 되는지까지 말한다.
  const p = navigator.clipboard && navigator.clipboard.writeText(el.textContent.trim());
  if (!p) return window.toast("복사하지 못했습니다. 명령 글자를 직접 선택하면 복사됩니다.", "bad");
  p.then(() => {
    el.classList.add("copied");
    setTimeout(() => el.classList.remove("copied"), 1400);
    window.toast("명령을 복사했습니다. 채팅에 붙여 넣으면 실행됩니다.", "ok");
  }, () => window.toast("복사하지 못했습니다. 명령 글자를 직접 선택하면 복사됩니다.", "bad"));
}

// 화면마다 날짜 축이 다르다 — GSC 스냅샷·순위·색인·기기·AI 는 수집 주기가 따로 돈다.
// 머리말이 축별 날짜를 다 적는 이유가 그것이다: 하나만 적으면 나머지 화면의 숫자까지
// 그 날짜로 읽는다. [기준 수집일]이 되돌리는 것도 GSC 축 하나뿐이라고 여기서 말한다.
const AXES = [["순위", "rank_date"], ["색인", "index_date"],
              ["기기", "device_date"], ["AI 인용", "ai_date"]];

function renderDates(d) {
  const sel = $("gscdate"), dates = d.gsc_dates || [];
  // 박제본에는 서버가 없어 되돌릴 수 없고, 고를 게 하나뿐이면 선택지가 아니다.
  sel.hidden = READONLY || dates.length < 2;
  if ($("datelab")) $("datelab").hidden = sel.hidden;   // 이름표는 고를 게 있을 때만
  if (!sel.hidden) {
    sel.innerHTML = dates.map(x =>
      `<option value="${esc(x.date)}">${esc(x.date)}` +
      `${x.period ? ` · ${x.period}일치` : ""}</option>`).join("");
    sel.value = d.gsc_date || "";
  }
  // 최신이 아닌 날을 보고 있으면 눈에 띄게 한다 — 최신인 줄 알고 읽으면 오독이다.
  const past = !!(dates.length && d.gsc_date && d.gsc_date !== dates[0].date);
  sel.classList.toggle("past", past);

  $("meta").textContent = (d.project.gsc_property || d.project.domain || "") +
    ` · 구글 실적 ${d.gsc_date || "아직 없음"}` +
    (d.gsc_period ? ` (${d.gsc_period}일치)` : "");
  // 종이 표지 — 화면에서는 안 보이고 인쇄에만 선다. 값은 위 머리말과 같은 것이다.
  const ph = $("printhead");
  if (ph) {
    const when = window.__SNAPSHOT__ ? `${window.__SNAPSHOT__.exported} 기록` : "";
    ph.innerHTML = `<div class="t">${esc(d.project.name)} — 검색·AI 가시성 보고서</div>` +
      `<div class="m">${esc($("meta").textContent)}${when ? " · " + esc(when) : ""}</div>`;
  }

  // 날짜만 늘어놓으면 그게 무엇의 날짜인지 안 읽힌다("AI 인용 2026-09-03" 은
  // 인용이 그날 있었다는 말처럼 보였다). 이름표 하나로 무엇의 날짜인지 못 박고,
  // 축마다 배지 하나씩 세운다 — 이름은 본문 서체, 날짜만 등폭이다.
  const ax = AXES.filter(([, key]) => d[key])
                 .map(([name, key]) =>
                   `<span class="ax">${esc(name)}<em>${esc(d[key])}</em></span>`);
  $("axes").innerHTML = (past
    ? "<b>과거 시점을 보고 있습니다. 되돌린 것은 구글 실적뿐이고 아래 날짜는 최신입니다.</b>"
    : "") + (ax.length ? `<span class="k">마지막 수집</span>` + ax.join("") : "");
  $("axes").hidden = !ax.length && !past;
}

let LAST_D = null;          // 마지막으로 그린 페이로드 — SM.repaint() 가 다시 쓴다
function render(d) {
  LAST_D = d;
  if (d.schema == null) {
    // schema 필드가 없는 옛 박제본 호환 분기: 박제본 호환 분기는 schema 번호 하나로 한다.
    // 옛 박제본에 없는 규칙·필드를 여기서 한 번만 채워 하위 렌더러의 임시 분기들을 대체한다.
    if (!d.rules) {
      RULES = {page1: 10, striking_lo: 4, striking_hi: 20, rank_noise: 3,
               device_gap_pos: 2, device_min_imp: 50};
    }
    if (d.trend && d.gsc_period) {
      d.trend = d.trend.filter(x => x.p == null || x.p === d.gsc_period);
    }
    if (d.striking) {
      for (const r of d.striking) {
        if (r.gap == null && r.pos != null) r.gap = Math.max(0, r.pos - (RULES.page1 || 10));
        if (r.band == null && r.pos != null) r.band = r.pos <= (RULES.page1 || 10) ? "page1" : "page2";
      }
      if (d.striking_page2 == null) {
        d.striking_page2 = d.striking.filter(r => r.band === "page2").length;
      }
    }
    // d.opps 는 손보지 않는다. is_defensive 는 isDefensive(o) 가 필요할 때마다
    // o.is_defensive ?? 4종 목록으로 풀어내고(예전엔 이 자리가 2종만 아는 사본이었다),
    // 종류별 개수는 화면이 지금 보고 있는 상태 묶음에서 직접 센다. label·play 는 옛
    // 박제본이면 비어 있고, playList()·oppWhy() 가 빈 처방·kind 원문으로 받아들인다.
    if (d.daily && !d.daily_stats) {
      d.daily_stats = {
        clicks_max: Math.max(...d.daily.map(r => r.clicks || 0), 1),
        impressions_max: Math.max(...d.daily.map(r => r.impressions || 0), 1),
        clicks_sum: d.daily.reduce((a, r) => a + (r.clicks || 0), 0),
        impressions_sum: d.daily.reduce((a, r) => a + (r.impressions || 0), 0),
      };
    }
    if (!d.ai_trend) d.ai_trend = [];
  }

  // KPI의 증감도 같은 기간끼리만 — 서버가 고른 비교 짝(gsc_date/gsc_prev)을 그대로 쓴다.
  // 그냥 마지막 두 줄을 빼면 28일치에서 90일치를 빼는 일이 생긴다.
  if (d.rules) RULES = {...d.rules};  // 서버가 준 경계값이 이 화면의 유일한 기준
  renderGuide(d);
  renderDates(d);
  applyWording();          // 정적 문구는 여기서 한 번 (동적 문구는 각자 W() 로 고른다)

  // 기회 한 벌은 화면 전부가 같이 본다 — 화면을 그리기 전에 대상 색인을 세운다.
  // 예전에는 개요의 VIEW 안에서 세웠고, 그래서 개요보다 먼저 그려지는 화면은
  // 같은 페이로드를 손에 쥐고도 빈손이었다.
  oppIndex(d.opps);
  window.SD_PERIOD = d.gsc_period ? `${d.gsc_period}일` : "";
  window.QUERY_PAGES = d.query_pages || {};
  window.PAGE_AUDITS = d.page_audits || {};
  window.KIND_LABELS = d.kind_labels || {};  // kind → 통칭 라벨. [기록]·필터 칩처럼
                                              // 대상 없이 kind 만 아는 자리가 쓴다.

  // 화면 하나가 던져도 나머지는 그려져야 한다 — 예전에는 조립 순서상 뒤에 오는
  // 화면이 통째로 비었고, 왜 비었는지는 아무 데도 안 남았다.
  for (const v of VIEW_RENDER) {
    try { (v.render || v)(d); }
    catch (e) { console.error(`화면 [${(v && v.id) || "?"}] 을 그리지 못했습니다`, e); }
  }
  // 뷰가 방금 그린 자리에서도 박제본의 거짓말을 뗀다 — 뷰마다 READONLY 를 물어보게
  // 하면 열한 곳이 각자 기억해야 하고, 그중 몇은 언젠가 잊는다(실제로 잊었다).
  deadSweep($("content"));
  tableFade($("content"));      // 방금 생긴 표가 넘치는지는 그린 다음에야 안다
}

// 서버 재요청 없이 다시 그린다 — 화면 렌더는 늘 페이로드 하나의 함수다. 호스팅
// 애드온이 자기만 아는 상태(예: 저장소를 막 연결했다)가 바뀌어서 이미 그려진
// 카드를 갱신해야 할 때 쓴다. **DOM 을 되짚어 고치는 대신** 같은 페이로드로 render()
// 를 다시 부른다 — oppActs() 등 렌더 함수가 SM.host 를 다시 물어 새로 그린다.
SM.repaint = () => { if (LAST_D) render(LAST_D); };

async function loadProjects() {
  const names = await (await fetch("/api/projects")).json();
  const want = decodeURIComponent(location.hash.slice(1));
  // 없는 사이트를 가리키는 주소로 들어오면 여태 조용히 첫 사이트가 열렸다 —
  // 링크를 받은 사람은 자기가 부른 사이트를 보고 있다고 믿는다. 말하고, 주소를
  // 치운다(안 치우면 hashchange 가 돌 때마다 같은 말을 다시 한다).
  if (want && !names.includes(want)) {
    if (window.toast) toast("등록되지 않은 사이트입니다. 첫 사이트를 엽니다.", "bad");
    history.replaceState(null, "", location.pathname + location.search);
  }
  $("proj").innerHTML = names.map(n =>
    `<option${n === want ? " selected" : ""}>${esc(n)}</option>`).join("");
  $("proj").hidden = !names.length;      // 사이트가 없으면 빈 칸을 띄우지 않는다
  if ($("projlab")) $("projlab").hidden = !names.length;
  return names.length ? $("proj").value : null;
}

let PINNED = "";                    // [기준 수집일]로 고정한 GSC 수집일 ("" = 최신)

async function load() {
  const name = $("proj").value;
  // 사이트가 없어도 본문은 세워 둔다 — 첫 등록을 하는 곳이 [설정] 화면이고,
  // 통째로 감추면 거기 갈 길이 없다(배너만 남아 막다른 길이 된다).
  if (!name) { SM.show(SM.at("settings") >= 0 ? "settings" : "guide"); return; }
  location.hash = encodeURIComponent(name);
  const res = await fetch("/api/data?project=" + encodeURIComponent(name) +
                          (PINNED ? "&date=" + encodeURIComponent(PINNED) : ""));
  const d = await res.json();
  if (!res.ok) {
    $("err").hidden = false;
    $("err").textContent = (d.error || "이 사이트의 자료를 불러오지 못했습니다.") +
      " [새로고침]을 누르면 다시 시도합니다.";
    return;
  }
  // 그 사이트에 없는 날을 고정하면 서버가 빈 짝을 준다 — 고정을 풀고 최신으로 되돌린다.
  // (PINNED 를 먼저 비우므로 데이터가 아예 없는 사이트에서도 두 번 이상 돌지 않는다.)
  if (PINNED && !d.gsc_date) { PINNED = ""; return load(); }
  $("err").hidden = true;
  $("content").hidden = false;
  render(d);
  // 사이트가 확정됐다고 한 번 알린다. 뒤에 얹히는 계층(호스팅 애드온)은 자기 데이터를
  // 사이트 이름이 정해진 뒤에야 부를 수 있는데, 여태 그걸 아는 방법이 #proj 의
  // change 이벤트뿐이었다 — 그리고 hash 로 자동 선택될 때는 change 가 안 난다.
  // 그래서 백링크·설정·키워드가 각자 첫 로드에 비어 있었고(백링크는 재시도 루프로,
  // 나머지는 사용자가 탭을 한 번 눌러야 채워지는 식으로) 세 곳이 따로 때워졌다.
  document.dispatchEvent(new CustomEvent("sm:site", {detail: {project: name}}));
}

// 배너는 "할 말이 있을 때만" 선다. 안에 든 것이 빈 #nx 뿐이면 감춘다.
function banSync() {
  const b = $("docban");
  if (!b) return;
  const nx = $("nx");
  // 이 배너가 얹힌 화면에 행동 띠가 있으면 "지금 할 것" 줄을 뺀다. 띠는 이 화면에서
  // 무엇을 누르라고 말하고, 이 줄은 파이프라인 전체가 어디쯤인지를 말한다 — 나란히
  // 세우면 한 화면에 다음 행동이 둘이 된다. 그 안내를 통째로 갖는 화면은 [안내]다.
  const host = b.closest(".view");
  if (nx) nx.hidden = !!(host && host.querySelector(":scope > .next"));
  // 막는 항목이 있을 때만 상자로 선다. 준비물이 다 됐는데 상자가 첫 화면을 먹으면
  // 눈이 지표보다 배너를 먼저 읽는다.
  const heavy = !!b.querySelector("ul.must");
  b.classList.toggle("thin", !heavy);
  b.hidden = !(b.querySelector(".verdict, ul, details") ||
               (nx && !nx.hidden && nx.innerHTML.trim()));
}

/* 배너 항목을 "첫 문장 + 접은 나머지"로 가른다. 다섯 문장짜리 산문이 화면 맨 위에
   서면 눈이 지표보다 그것을 먼저 읽는다.

   정본은 서버가 갈라 주는 것이다(doctor.py 가 {msg, detail} 로 돌려주면 그대로 쓴다).
   아직 안 갈라 온 항목은 여기서 합니다체 문장 경계로 자른다 — 세 문장 이상일 때만.
   두 문장은 접을 이유가 없고, 접으면 여는 수고가 읽는 수고보다 크다. */
function banSplit(s) {
  // msg 는 항상 한 문장이고 그것만 읽어도 뜻이 선다 — doctor._selfcheck 가 못 박는다.
  // detail 은 없으면 아예 안 온다(그때는 <details> 를 만들지 않는다).
  return [(s && s.msg) || s || "", (s && s.detail) || ""];
}

/* 배너 항목의 행동. 두 갈래뿐이고 **둘 다 서버가 준다.**
     cmd  로컬에만 온다 — 칠 채팅이 있는 배포다. 복사 칩.
     go   {label, href} — 갈 곳이 있는 항목에만 온다. 없으면 버튼을 안 만든다.

   셸이 doctor 의 id 를 보고 목적지를 고르지 않는다. 한 번 그렇게 짰다가 틀렸다:
   호스팅에서 실제로 뜨는 배너는 구글 재연결인데 [설정] 화면에는 구글 연결 항목이
   없어서, 눌러도 아무것도 못 하는 막다른 길로 보내고 있었다. 게다가 서버가 고칠
   문제(부품 설치·Brain 손상)는 사용자가 갈 데 자체가 없다 — 거기 버튼을 붙이면
   눌러도 아무 일이 없다. 어느 항목이 어디로 가는지는 서버만 안다. */
function banAct(s, local) {
  if (local && s.cmd)
    return ` <button class="cmd" onclick="copyCmd(this)">${esc(s.cmd)}</button>`;
  if (s.go && s.go.href)
    return ` <a class="go sm sec" href="${esc(s.go.href)}">${esc(s.go.label)}</a>`;
  return "";
}

async function loadDoctor() {
  try {
    // 화면이 보고 있는 사이트를 같이 보낸다 — 안 보내면 서버가 폴더로 추론하고,
    // 추론이 안 되면(사이트 여럿 + 리포 미등록) 안내가 비어 버린다.
    const cur = $("proj") ? $("proj").value : "";
    const d = await (await fetch("/api/doctor?project=" + encodeURIComponent(cur || ""))).json();
    // verdict·must·extra 는 이제 청중별로 갈려서 온다(doctor.py 가 SEOMINER_HOSTED
    // 로 가른다) — 호스팅 갈래에는 명령·파일 경로·"채팅에"가 안 들어가고,
    // doctor._selfcheck() 가 그걸 못 박는다. 그래서 화면이 다시 가릴 이유가 없다.
    // 오히려 가리면 호스팅에서 **유일한 사용자 몫**(구글 계정 연결)이 안 보인다 —
    // 그건 서버가 대신 로그인해 줄 수 없어 owner 가 user 이고 blocking 이다.
    // 여기서 배포로 가르는 것은 복사할 것(cmd) 하나뿐이다: 웹에는 칠 곳이 없다.
    const local = !window.SM_HOSTED;
    let h = d.verdict ? `<div class="verdict">${esc(d.verdict)}</div>` : "";
    let nxHtml = "";
    if (d.no_project) {
      nxHtml = `<span class="nxk">지금 할 것</span>` +
        `<span>아래 <b>2. 첫 사이트</b> 칸을 채우면 여기서 시작됩니다.</span>`;
    } else if (d.guide) {
      const g = d.guide, gh = g.here, gs = g.steps;
      // 돌아갈 단계 이름을 여기 옮겨 적지 않는다 — 정본은 stage.py 가 실어 보낸 목록이다.
      const back = gs[1] ? `<b>2. ${esc(gs[1].t)}</b>` : "<b>2번 단계</b>";
      nxHtml = gh === -1
        ? `<span class="nxk">한 바퀴 완주</span>` +
          `<span>${back}부터 다시 재면 그동안 고친 것이 숫자로 보입니다.</span>`
        : `<span class="nxk">지금 할 것</span>` +
          `<span><b>${esc(gs[gh].t)}</b></span>` +
          (local && gs[gh].cmd ? ` <code>${esc(gs[gh].cmd)}</code>` : "");
    }
    h += `<div class="nx" id="nx">${nxHtml}</div>`;
    // must 는 {msg, cmd} 다. 산문은 칩 없이도 혼자 읽히고, cmd 는 "그대로 복사해
    // 쓰는 것 한 줄"이라 안내 화면 단계와 같은 .cmd 칩으로 그린다(호스팅은 항상 없다).
    if (d.must && d.must.length)
      // 명령 칩은 칠 곳이 있는 배포에서만 낸다. 서버가 이미 청중별로 갈라 보내지만
      // (doctor.py 의 SEOMINER_HOSTED), 화면도 같은 선을 긋는다 — 이 한 줄이
      // 없으면 서버 쪽 분기가 한 번 새는 날 호스팅 화면에 `/create profile` 이 뜬다.
      h += `<ul class="must">${d.must.map(s => {
        const [lead, detail] = banSplit(s);
        // 행동은 접힌 곳 **밖**이다 — 접은 자리에 누를 것을 숨기지 않는다.
        return `<li>${esc(lead)}` + banAct(s, local) +
          (detail ? `<details><summary>자세히</summary><p>${esc(detail)}</p></details>` : "") +
          `</li>`;
      }).join("")}</ul>`;
    if (d.extra && d.extra.length)
      h += `<details><summary>더 켤 수 있는 기능 ${d.extra.length}개. 모두 선택입니다.</summary>
        <ul>${d.extra.map(s => `<li>${esc(s)}</li>`).join("")}</ul></details>`;
    // 사이트가 없으면 render() 가 아예 안 돈다(부를 /api/data 가 없다) — 그래서
    // 여태 [안내] 화면이 **첫 사용자에게만** 통째로 비어 있었다. 제목만 있고 6단계가
    // 없는 화면이 정확히 이 경우였다. doctor 도 같은 guide 를 실어 보내므로 여기서
    // 그린다. docban 을 쓰기 **전에** 부른다 — #nx 가 아직 없어 배너를 안 건드린다
    // (배너는 이 상태에서 [설정]의 사이트 등록 칸을 가리키는 쪽이 더 구체적이다).
    if (d.no_project) renderGuide(d);
    $("docban").innerHTML = h;
    // 할 말이 없으면 상자도 안 세운다 — 호스팅에서 준비물 목록을 뺀 뒤 빈 띠만
    // 남아 화면 맨 위에 뜻 없는 상자가 서는 일이 없게 한다. 뒤늦게 renderGuide 가
    // #nx 를 채우면 그쪽이 다시 연다.
    banSync();
    renderSetup(d);
  } catch (e) {
    // 배너 실패는 치명이 아님 — 본문은 그대로 뜬다. 다만 조용히 넘어가면 상태 배지
    // 5개(#s-*)와 조건부 버튼 3개가 영영 안 채워지는데 그 사실이 화면 어디에도
    // 안 남는다 — 그러니 실패했다는 말과 되돌릴 손잡이는 남긴다.
    // "다시 시도합니다"라고 글로 적어 두면 어디를 누르라는 말인지 화면이 안 말한다 —
    // 누를 것을 그 자리에 둔다.
    $("docban").className = "bad";
    $("docban").innerHTML = `<div class="verdict">준비 상태를 확인하지 못했습니다</div>` +
      `<p class="nx">서버가 응답하지 않았습니다. 다시 시도하면 대개 붙습니다.</p>` +
      `<div class="acts"><button class="go sec" onclick="loadDoctor()">다시 시도</button></div>`;
    $("docban").hidden = false;
  }
}

// ── 설정 화면 ──────────────────────────────────────────────
// 준비 상태는 배지다 — 버튼처럼 생긴 상태 칸이 이 화면의 원래 문제였다.
// ok=됐다 / warn=해야 한다 / muted=안 해도 된다.
const mark = (id, done, todo) => $(id).outerHTML =
  `<span id="${id}" class="badge ${done ? "ok" : "warn"}">${done ? "완료" : todo}</span>`;

/* 근거 칸 한 벌 — 한 문장으로 지금 상태를 말하고, 나머지는 접는다. 여태 이 칸이
   네댓 문장짜리 산문이라 설정 화면이 읽을 것 반 페이지로 시작했다.
   자리(settings.html)는 <p class="why"> 로 서 있지만 <details> 는 <p> 안에 못 든다 —
   #s-* 와 같은 방식으로 상자째 갈아 끼운다. 여러 번 불려도 공짜다. */
const why = (id, lead, moreLabel, more) => $(id).outerHTML =
  `<div class="why" id="${id}"><p>${lead}</p>` +
  (more ? `<details><summary>${moreLabel}</summary><p>${more}</p></details>` : "") +
  `</div>`;

function renderGsc(d) {
  const st = d.gsc_state || (d.gsc_ok ? "connected" : d.gsc_mode ? "pending" : "none"), sa = d.gsc_mode === "service_account";
  $("s-gsc").outerHTML = `<span id="s-gsc" class="badge ${st === "connected" ? "ok" : "warn"}">` +
    (st === "connected" ? "연결됨" : st === "pending" ? "로그인 대기" : "인증 없음") + `</span>`;
  // 배지가 이미 "연결됨"이라고 말한다 — 부제가 그 말을 되풀이하지 않는다.
  if (st === "connected" && sa)
    why("why-gsc", "서비스 계정으로 사람 없이 수집합니다.", "읽는 범위와 확인 방법",
      `서치콘솔 [설정 → 사용자 및 권한]에 그 계정 이메일을 추가한 속성만 읽습니다.
       확인은 <code>connect_gsc.py --status</code> 입니다.`);
  else if (st === "connected")
    why("why-gsc", "구글 로그인이 끝났고 다시 하실 일은 없습니다.", "이 토큰을 무엇이 쓰나",
      `벌크 수집(<code>/capture gsc</code>)과 Claude 즉석 조회가 토큰 한 벌을 같이 씁니다.
       내 계정이 소유한 속성에는 따로 권한을 주지 않아도 됩니다.`);
  else if (st === "pending")
    why("why-gsc", "남은 것은 구글 로그인 한 번뿐입니다.", "로그인하면 무슨 일이 일어나나",
      `무료이고 30초 걸립니다. 아래 <b>[구글 로그인 열기]</b>를 누르면 브라우저 창이 한 번
       열립니다. 채팅에 <code>GSC 로그인해줘</code> 라고 해도 같습니다. 끝나면 이 칸이
       저절로 <b>[연결됨]</b>으로 바뀝니다. 구글 클라우드 콘솔에 가실 일은 없습니다.`
      + (d.gsc_bundled
        ? ` 이때 <b>"확인되지 않은 앱"</b> 경고가 한 번 뜹니다. <b>[고급]</b> 다음
           <b>[이동]</b>을 누르면 됩니다. 플러그인이 동봉한 클라이언트라 정상입니다.
           경고 없이 쓰려면 아래 [내 OAuth 클라이언트 쓰기]를 펴면 됩니다.`
        : ""));
  else
    why("why-gsc", "연결 없이는 측정이 시작되지 않습니다.", "인증 수단을 넣는 두 가지 길",
      `아래 <b>[내 OAuth 클라이언트 쓰기]</b>에 두 문자열을 넣습니다. 또는 콘솔에서 받은
       JSON 을 다운로드 폴더에 두고 [받은 인증 파일 가져오기]를 누르면 됩니다.`);
  $("btn-gsclogin").hidden = st !== "pending";
  // 인증이 아예 없으면 여기가 유일한 출구라 펴 준다. **닫지는 않는다** —
  // 저장 직후 loadDoctor가 다시 그리면서 방금 편 칸을 접으면 결과 문구까지 같이 숨는다.
  if (st === "none") $("own-client").open = true;
}

function renderSetup(d) {
  mark("s-deps", d.core_ok, "설치 필요");
  // 「완료」는 이 칸에서 뜻이 얕다 — 사이트는 하나 등록하고 끝나는 것이 아니라
  // 늘어나는 것이다. 몇 개인지가 그 자리에서 알고 싶은 값이다.
  const np = (d.projects || []).length;
  $("s-proj").outerHTML = d.no_project
    ? `<span id="s-proj" class="badge warn">아직 없음</span>`
    : `<span id="s-proj" class="badge ok">${np ? `${np}개 등록` : "완료"}</span>`;
  renderGsc(d);
  // 안 해도 되는 것은 경고색으로 찍지 않는다 — 찍으면 할 일이 된다.
  $("s-keys").outerHTML = d.nkeys
    ? `<span id="s-keys" class="badge ok">${d.nkeys}개 저장됨</span>`
    : `<span id="s-keys" class="badge muted">없어도 됨</span>`;
  // 마케팅 스킬 칸 — doctor가 빠진 게 있으면 보일 버튼만 켠다. show_setup 과 따로
  // 놀기 때문에 패널이 접혀 있어도 doctor 진단 결과로 표시가 결정된다.
  $("s-skills").outerHTML = d.show_skills_btn
    ? `<span id="s-skills" class="badge warn">일부 누락</span>`
    : `<span id="s-skills" class="badge ok">모두 설치됨</span>`;
  $("btn-skills").hidden = !d.show_skills_btn;
  if (d.show_skills_btn)
    why("why-skills", "빠진 마케팅 스킬을 대신 깔아 드립니다.", "무엇이 달라지나",
      `글의 각도와 진단을 맡는 무료 스킬 묶음입니다. 끝나면 <b>Claude Code 를 한 번
       재시작</b>해야 그 스킬이 화면에 뜹니다. 없어도 측정과 수집은 그대로 돌고,
       글 품질과 진단 깊이만 얕아집니다.`);
  else
    why("why-skills", "글의 각도와 진단을 맡는 스킬이 모두 깔려 있습니다.", "나중에 더 깔려면",
      `새로 추가한 스킬은 <b>Claude Code 를 한 번 재시작</b>해야 화면에 뜹니다.`);
  $("btn-depsgsc").hidden = !d.show_deps_gsc_btn;
  $("btn-deps").textContent = d.core_ok ? "다시 설치" : "설치";
  setupPrimary(d);
  // 준비물이 덜 됐으면 거기서부터 — 측정 자체가 안 도는 상태다.
  // 호스팅에서는 이 단계들이 유저 몫이 아니다(서버가 키를 댄다) — 거기로 보내면
  // 할 수 있는 게 없는 화면에 떨어진다.
  if (d.show_setup && !window.SM_HOSTED) SM.land("settings", 2);
  prefillProject();
  renderCarry(d);
}

/* 설정 화면에도 채운 버튼은 하나다 — 안 끝난 **첫** 단계의 것.
   여섯 개가 다 채워져 있으면 어디서부터 시작하는지가 화면에 안 남는다: 순서가 있는
   단계인데 여섯 곳이 똑같이 "여기를 누르세요"라고 말하는 셈이다.
   순서는 이 화면의 단계 순서다(부품 → 사이트 → 구글). 키·스킬은 없어도 측정이
   도는 선택 단계라 주요가 되지 않는다 — 안 해도 되는 일을 할 일로 만들지 않는다. */
const SETUP_BTNS = ["btn-deps", "btn-proj", "btn-gsclogin", "btn-gsc",
                    "btn-depsgsc", "btn-keys", "btn-skills"];
function setupPrimary(d) {
  const st = d.gsc_state || (d.gsc_ok ? "connected" : d.gsc_mode ? "pending" : "none");
  const first = !d.core_ok ? "btn-deps"
    : d.no_project ? "btn-proj"
    : st === "pending" ? "btn-gsclogin"
    : st !== "connected" ? "btn-gsc"
    : "";
  for (const id of SETUP_BTNS) {
    const b = $(id);
    if (b) b.className = id === first ? "go" : "go sec";
  }
}

// 웹에서 이어 하기 — 로컬에 적어 둔 사이트 설정을 호스팅 등록 폼으로 실어 보낸다.
// 링크를 만드는 것은 서버다(프로젝트 yaml 을 읽어야 한다) — 화면은 고르고 연다.
function renderCarry(d) {
  const sel = $("c-proj");
  if (!sel) return;
  const names = d.projects || [];
  sel.innerHTML = names.map(p => `<option>${esc(p)}</option>`).join("");
  // 기본값은 **지금 보고 있는 사이트**다. 여태 목록 첫 줄이 잡혀서, alpha-site 를
  // 보다가 6단계로 내려오면 beta-site 를 실어 보내겠다고 서 있었다.
  const cur = ($("proj") || {}).value;
  sel.value = names.includes(cur) ? cur : (names[0] || "");
  sel.hidden = $("btn-carry").hidden = !names.length;
  if (!names.length) say("m-carry", "실어 보낼 사이트가 없습니다. 위 2번에서 사이트를 먼저 등록합니다.", false);
}

$("btn-carry").addEventListener("click", async () => {
  const a = $("c-url");
  a.hidden = true;
  const r = await (await fetch("/api/setup/carry?project=" +
    encodeURIComponent($("c-proj").value))).json();
  if (!r.ok) return say("m-carry", r.error, false);
  a.href = r.url;
  a.textContent = "웹에서 등록";
  a.hidden = false;
  try {
    await navigator.clipboard.writeText(r.url);
    say("m-carry", "링크를 복사했습니다. 다른 기기에 붙여 넣어도 열립니다.", true);
  } catch (e) {
    say("m-carry", "복사 권한이 없는 브라우저입니다. 아래 링크를 눌러 바로 열 수 있습니다.", true);
  }
});

// 대시보드를 띄운 폴더(레포)에서 폼 초기값을 채운다 — 이름·도메인은 코드 추론,
// 씨앗 키워드·브랜드·도구는 setup 스킬(Claude)이 레포를 읽고 써 둔 판단 프리필.
// 빈 칸만 채운다 — 사용자가 적던 값을 덮지 않는다.
let PREFILLED = false;
async function prefillProject() {
  if (PREFILLED || !$("p-name")) return;
  PREFILLED = true;
  try {
    const p = await (await fetch("/api/setup/prefill")).json();
    const join = v => Array.isArray(v) ? v.join(", ") : v;
    let used = false;
    for (const [id, key] of [["p-name","name"], ["p-domain","domain"], ["p-gsc","gsc_property"],
                             ["p-locale","locale"], ["p-seeds","seed_keywords"],
                             ["p-alias","brand_aliases"], ["p-tools","tools"],
                             ["p-comp","competitors_manual"]])
      if (p[key] && (!$(id).value || $(id).value === "ko-KR" && key === "locale"))
        { $(id).value = join(p[key]); used = true; }
    if (p.type && $("p-type")) $("p-type").value = p.type;
    if (used) say("m-proj", "이 폴더의 저장소를 읽어 미리 채웠습니다. 고칠 곳만 고치면 됩니다.", true);
  } catch (e) { /* 추론 실패는 빈 폼과 같다 */ }
}

function busy(btn, msg, on) {
  $(btn).disabled = on;
  if (on) { $(msg).className = "msg"; $(msg).textContent = "실행 중입니다. 최대 몇 분 걸립니다."; }
}
function say(msg, text, ok) {
  $(msg).className = "msg " + (ok ? "good" : "bad");
  $(msg).textContent = text;
}
function showLog(log) {
  $("setup-log").hidden = !log;
  $("setup-log").textContent = log || "";
}

async function runAction(action, btn, msg, okText) {
  busy(btn, msg, true);
  const [, r] = await post("/api/setup/run", {action});
  busy(btn, msg, false);
  say(msg, r.ok ? okText : "끝내지 못했습니다. 아래 로그에 멈춘 자리가 남아 있습니다.", r.ok);
  showLog(r.log);
  loadDoctor();
}

$("btn-deps").addEventListener("click", () =>
  runAction("deps", "btn-deps", "m-deps", "설치했습니다."));
// 마케팅 스킬 설치 — 끝나면 Claude Code 재시작이 필요하므로 그 점을 메시지에 박는다
// (applySkill은 다음 세션이 한다 — 현재 세션은 그 스킬을 모를 수 있다).
$("btn-skills").addEventListener("click", () =>
  runAction("skills", "btn-skills", "m-skills",
    "설치했습니다 — Claude Code를 재시작하시면 화면에 그 스킬이 뜹니다."));
$("btn-depsgsc").addEventListener("click", () =>
  runAction("deps_gsc", "btn-depsgsc", "m-gsc", "설치했습니다."));
// 인증 파일 회수 전에 구글 수집용 부품을 자동으로 깐다 — 이미 있으면 pip이 금방 끝난다.
// 사용자가 "부품 먼저"를 알 필요가 없게 버튼 하나로 잇는다.
$("btn-gsc").addEventListener("click", async () => {
  busy("btn-gsc", "m-gsc", true);
  const [, dep] = await post("/api/setup/run", {action: "deps_gsc"});
  if (!dep.ok) {
    busy("btn-gsc", "m-gsc", false);
    say("m-gsc", "구글 수집용 부품을 설치하지 못했습니다. 아래 로그에 멈춘 자리가 남아 있습니다.", false);
    showLog(dep.log);
    return;
  }
  const [, r] = await post("/api/setup/run", {action: "gsc"});
  busy("btn-gsc", "m-gsc", false);
  say("m-gsc", r.ok ? "인증 파일을 넣었습니다. 처음 조회할 때 브라우저 로그인 창이 한 번 열립니다. "
                    + "서비스 계정 키를 넣으셨다면 아래 로그에 남은 일이 적혀 있습니다."
                    : "인증 파일을 가져오지 못했습니다. 아래 로그에 멈춘 자리가 남아 있습니다.", r.ok);
  showLog(r.log);
  loadDoctor();
});

// 로그인 창을 여는 건 google-auth-oauthlib 이다 — 부품이 없으면 그 자리에서
// 막히므로 여기서도 먼저 깐다(이미 있으면 pip이 금방 끝난다). 버튼 하나로 잇는 이유는
// [파일 가져오기]와 같다: 사용자가 "부품 먼저"를 알 필요가 없어야 한다.
$("btn-gsclogin").addEventListener("click", async () => {
  busy("btn-gsclogin", "m-gsc", true);
  const [, dep] = await post("/api/setup/run", {action: "deps_gsc"});
  if (!dep.ok) {
    busy("btn-gsclogin", "m-gsc", false);
    say("m-gsc", "구글 수집용 부품을 설치하지 못했습니다. 아래 로그에 멈춘 자리가 남아 있습니다.", false);
    return showLog(dep.log);
  }
  say("m-gsc", "브라우저 창이 열립니다. 구글 계정으로 로그인하면 끝납니다. " +
               "\"확인되지 않은 앱\" 경고가 뜨면 [고급] 다음 [이동] 입니다.", true);
  const [, r] = await post("/api/setup/run", {action: "gsc_login"});
  busy("btn-gsclogin", "m-gsc", false);
  say("m-gsc", r.ok ? "연결됐습니다. 이제 구글 실적을 읽을 수 있습니다."
                    : "로그인이 끝나지 않았습니다. 아래 로그에 멈춘 자리가 남아 있습니다.", r.ok);
  showLog(r.log);
  loadDoctor();
});

// 자기 클라이언트 조립 — 시크릿은 보내고 나면 즉시 칸을 비운다(API 키 칸과 같은 규칙).
// 서버도 되돌려주지 않으므로 화면에 다시 뿌릴 값 자체가 없다.
$("btn-ocsave").addEventListener("click", async () => {
  busy("btn-ocsave", "m-oc", true);
  const [ok, r] = await post("/api/setup/gsc-client",
    {client_id: $("oc-id").value, client_secret: $("oc-secret").value});
  busy("btn-ocsave", "m-oc", false);
  if (!ok) return say("m-oc", r.error, false);
  $("oc-id").value = $("oc-secret").value = "";
  // 저장됐다는 사실은 토스트가 말하고, 칸에는 **아직 남은 일**만 남긴다 — 3초 뒤
  // 사라지는 자리에 다음 걸음을 적으면 그 걸음이 같이 사라진다.
  toast("저장했습니다.", "ok");
  say("m-oc", `클라이언트가 바뀌었습니다. 위 [구글 로그인 열기]로 한 번 더 로그인합니다.`, true);
  loadDoctor();
});

$("btn-keys").addEventListener("click", async () => {
  const f = [["k-or","OPENROUTER_API_KEY"], ["k-serper","SERPER_API_KEY"],
             ["k-dfsl","DATAFORSEO_LOGIN"], ["k-dfsp","DATAFORSEO_PASSWORD"]];
  const vals = {};
  for (const [id, key] of f) if ($(id).value !== "") vals[key] = $(id).value;
  if (!Object.keys(vals).length) return say("m-keys", "입력한 칸이 없습니다.", false);
  busy("btn-keys", "m-keys", true);
  const [, r] = await post("/api/setup/keys", vals);
  busy("btn-keys", "m-keys", false);
  for (const [id] of f) $(id).value = "";
  // 남은 일이 없다 — 칸을 비우고 토스트만 낸다(배지가 몇 개 저장됐는지 다시 말한다).
  $("m-keys").textContent = "";
  toast("저장했습니다.", "ok");
  loadDoctor();
});

$("btn-proj").addEventListener("click", async () => {
  busy("btn-proj", "m-proj", true);
  const [ok, r] = await post("/api/setup/project", {
    name: $("p-name").value, type: $("p-type").value, domain: $("p-domain").value,
    locale: $("p-locale").value, gsc_property: $("p-gsc").value,
    brand_aliases: $("p-alias").value, seed_keywords: $("p-seeds").value,
    competitors_manual: $("p-comp").value, tools: $("p-tools").value});
  busy("btn-proj", "m-proj", false);
  if (!ok) return say("m-proj", r.error, false);
  // 이 화면은 900ms 뒤 [개요]로 넘어간다 — 칸에 적은 말은 그때 같이 사라진다.
  // 화면을 넘어가서도 남는 자리는 토스트뿐이다. 다음 걸음은 [개요]의 배너가 말한다.
  // busy() 가 써 둔 "실행 중입니다"는 손으로 지운다 — say() 를 안 부르면 안 지워진다.
  $("m-proj").textContent = "";
  toast(`${r.name} 사이트를 등록했습니다.`, "ok");
  loadDoctor();
  loadProjects().then(n => { if (n) load(); });
  // 등록이 끝나면 방금 만든 사이트의 개요로 간다.
  setTimeout(() => SM.show("overview"), 900);
});

$("proj").addEventListener("change", () => { PINNED = ""; load(); });
/* 사이트 목록 → 대시보드의 이음매는 URL 의 hash 하나다(이음매 5번). 여태 그 hash 를
   **첫 적재에만** 읽었다: 대시보드를 열어 둔 채 #alpha-site → #beta-site 로 옮기면
   주소는 바뀌는데 화면은 그대로였다. 뒤로 가기도 같은 일이다.
   load() 가 다시 hash 를 쓰므로 이 핸들러가 또 돈다 — 값이 같으면 그냥 나간다. */
addEventListener("hashchange", () => {
  const want = decodeURIComponent(location.hash.slice(1));
  const sel = $("proj");
  if (!sel || !want || sel.value === want) return;
  if (![...sel.options].some(o => o.value === want)) return;   // 없는 사이트는 무시
  sel.value = want;
  PINNED = "";
  load();
});
$("gscdate").addEventListener("change", () => { PINNED = $("gscdate").value; load(); });
$("refresh").addEventListener("click", () => { loadDoctor(); load(); });

SM.sync();

// 인쇄 전에 접힌 것을 편다. `<details>` 는 CSS 로 못 연다(open 은 속성이다) —
// 안 펴면 보고서를 인쇄했는데 "무엇을 할지"가 접힌 채로 나간다. 끝나면 되돌린다.
let PRINT_OPENED = [];
addEventListener("beforeprint", () => {
  PRINT_OPENED = [...document.querySelectorAll("details:not([open])")];
  PRINT_OPENED.forEach(x => { x.open = true; });
});
addEventListener("afterprint", () => {
  PRINT_OPENED.forEach(x => { x.open = false; });
  PRINT_OPENED = [];
});

// 박제된 기록(--export)이면 서버가 없다 — 페이지에 박힌 데이터를 그리고, 손댈 수
// 없는 것들(트리아지·설정·새로고침·사이트 전환)은 아예 감춘다.
if (window.__SNAPSHOT__) {
  const s = window.__SNAPSHOT__;
  READONLY = true;
  $("proj").outerHTML = `<span class="mark" style="color:var(--patina)">` +
    `${esc(s.data.project.name)}</span>`;
  for (const id of ["refresh", "gscdate", "datelab"]) if ($(id)) $(id).hidden = true;
  SM.drop("settings");                   // 남한테 보낼 수도 있는 파일이다 — 입력칸을 남기지 않는다
  SM.drop("guide");
  document.querySelector(".tag").textContent = `${s.exported} 기록`;
  if (s.actions.length) {
    $("acts").hidden = false;
    $("acts-list").innerHTML = s.actions.map(x => `<li>${esc(x)}</li>`).join("");
  }
  render(s.data);
} else {
  loadDoctor();
  loadProjects().then(load);
}
</script>
</body>
</html>
