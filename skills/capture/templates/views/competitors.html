<!-- 이 화면이 무엇인지는 화면 자신이 말한다 — 담는 요소·채우는 단계까지.
     dashboard.py 가 이 선언들을 모아 window.__VIEWS__ 로 방출한다.

     여태 경쟁사 축은 "경쟁사가 잡은 키워드를 우리 추적 목록에 부어 넣는 것"뿐이었다
     (collect_gap). 누가 몇 위로 잡고 있고 우리는 몇 위인지가 없어서, 목록만 늘고
     무엇부터 손댈지는 여전히 화면 밖에 있었다. -->
<script type="application/json" class="view-def">
{"id": "competitors", "title": "경쟁 분석",
 "sections": ["cp-share", "cp-gap"], "stages": ["competitors", "gaps"]}
</script>

<style>
/* ── 경쟁 분석 ────────────────────────────────────────────────
   몫은 숫자보다 길이로 읽힌다. 우리 줄만 녹청, 나머지는 회색 — 색으로 "누가 우리인가"
   하나만 말하고, 크기 비교는 막대 길이가 한다. */
.cp-row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:0 14px;
  align-items:baseline; padding:9px 0; border-bottom:1px solid var(--rule-soft); }
.cp-row:last-child { border-bottom:0; }
.cp-dom { font-family:var(--mono); font-size:13px; word-break:break-all; }
.cp-row.me .cp-dom { color:var(--patina); font-weight:600; }
.cp-n { font-family:var(--mono); font-size:13px; font-variant-numeric:tabular-nums;
  white-space:nowrap; }
.cp-bar { grid-column:1 / -1; height:4px; border-radius:2px; background:var(--bar);
  margin-top:6px; }
.cp-bar i { display:block; height:100%; border-radius:2px; background:var(--slate);
  opacity:.45; }
.cp-row.me .cp-bar i { background:var(--patina); opacity:.75; }
@media (prefers-reduced-motion: no-preference) {
  .cp-bar i { animation:grow .5s cubic-bezier(.2,.7,.3,1) both; transform-origin:left; }
}
.cp-meta { font:400 11.5px/1.5 var(--sans); color:var(--slate); }
/* 우리가 아예 없는 것(missing)과 밀리는 것(weak)은 손대는 방법이 다르다 —
   전자는 새로 쓰는 일, 후자는 있는 걸 고치는 일. 배지가 그 둘을 가른다. */
.cp-kind { font:var(--micro); padding:3px 7px; border-radius:2px; white-space:nowrap; }
.cp-kind.missing { color:var(--copper); background:var(--wash-copper); }
.cp-kind.weak { color:var(--patina); background:var(--wash); }
.cp-kind.shared { color:var(--slate); border:1px solid var(--rule); }
</style>

<section id="cp-share">
  <div class="eyebrow" id="cp-share-eyebrow">유기 검색 규모</div>
  <h2 data-web="경쟁사 트래픽 점유">누가 이 주제를 먹고 있나</h2>
  <p class="sub" id="cp-share-sub"></p>
  <div id="cp-shares"></div>
</section>

<section id="cp-gap">
  <div class="eyebrow" id="cp-gap-eyebrow">키워드 격차</div>
  <h2 data-web="키워드 격차">경쟁사는 잡았고 우리는 놓친 것</h2>
  <p class="sub" id="cp-gap-sub"></p>
  <div id="cp-chips" class="oppchips"></div>
  <div id="cp-gaps"></div>
</section>

<script>
"use strict";
/* 이 화면의 이름은 전부 CP_ 로 시작한다 — 조립하면 한 문서라 최상위 이름이 겹치면
   뒤가 앞을 조용히 덮는다(dashboard._selfcheck 가 그걸 센다). */

let CP_D = null;
let CP_KIND = "";                 // "" = 전체. 칩이 거른다.

const CP_KINDS = [
  ["missing", "우리는 없음", "그 검색어에서 우리는 순위가 아예 없습니다. 새로 써야 하는 것"],
  ["weak",    "밀리는 중",   "둘 다 있는데 우리가 더 아래입니다. 있는 글을 고치는 것"],
  ["shared",  "우리가 위",   "같거나 우리가 위입니다. 지킬 자리"],
];

function CP_shares(d) {
  const rows = d.comp_metrics || [];
  if (!rows.length) return "";
  const max = rows.reduce((m, r) => Math.max(m, r.etv || 0), 0) || 1;
  return rows.map(r => {
    const w = Math.round((r.etv || 0) / max * 100);
    return `<div class="cp-row${r.is_self ? " me" : ""}">
      <div class="cp-dom">${esc(r.domain)}${r.is_self ? " ← 우리" : ""}</div>
      <div class="cp-n">${r.share == null ? "—" : Math.round(r.share * 100) + "%"}</div>
      <div class="cp-meta" style="grid-column:1">순위를 가진 검색어 ${num(r.keywords)}개` +
      `${r.top10 == null ? "" : ` · 1페이지 ${num(r.top10)}개`}</div>
      <div class="cp-meta">${r.etv == null ? "" : "추정 트래픽 " + num(Math.round(r.etv))}</div>
      <span class="cp-bar"><i style="width:${w}%"></i></span>
    </div>`;
  }).join("");
}

/* 점수가 없는 줄 — 왜 없는지를 화면이 말한다. 빈칸으로 두면 "고장인가"가 된다.
   상한의 정본은 scoring.content_gaps(limit=25) 다. missing/weak 이 뭘 해야 하는지는
   CP_KINDS(위)가 이미 갖고 있다 — 칩 툴팁에만 쓰던 것을 여기서도 그대로 읽는다. */
const CP_noOpp = r => {
  if (r.kind === "shared")
    return "우리가 같거나 위입니다. 지킬 자리라 새 작업이 붙지 않습니다.";
  const k = CP_KINDS.find(x => x[0] === r.kind);
  return `${k ? k[2] + "입니다. " : ""}점수는 검색량이 큰 25건까지만 매깁니다. ` +
    "이 줄은 그 밖이거나, 수집 뒤 점수를 아직 안 냈습니다.";
};

// 정렬 자 — 기회가 없는 줄은 맨 아래(-1). 점수가 같으면 원래 순서(검색량 큰 순)가 남는다.
const CP_rank = r => { const o = oppOf(r.keyword); return Number.isFinite(o && o.score) ? o.score : -1; };

/* 갭 한 줄 = 기회 한 건. 여태 6열 텍스트라 무엇부터 손댈지도, 왜인지도, 했다는
   표시도 없었고 유일한 출구가 CSV 였다. 점수·근거·행동·펼침은 전부 셸의 한 벌이고
   (oppScore/oppMeter/oppWhy/oppActs/oppPanel) 이 화면은 대상 문자열(검색어)만 댄다.
   할 일 목록은 PLAY.content_gap 이 갖는다 — 여기 옮겨 적지 않는다. */
function CP_card(r) {
  const o = oppOf(r.keyword);
  // 카드의 주인공은 검색어다 — 배지와 출처는 그 검색어를 설명하는 곁줄이라 밑에 둔다.
  // 여태 거꾸로라, 정작 무엇에 대한 카드인지가 맨 아래에서 읽혔다.
  const head = `<div class="target">${esc(r.keyword)}</div>
    <div class="oh">
      <span class="cp-kind ${esc(r.kind || "")}">${
        esc((CP_KINDS.find(k => k[0] === r.kind) || [, r.kind || ""])[1])}</span>
      <span class="cp-meta"><span class="cp-dom">${esc(r.domain)}</span> ${
        r.position == null ? "—" : r.position}위 · 우리 ${
        r.our_position == null ? "없음" : r.our_position + "위"}${
        // 점수가 붙은 줄은 근거 문장이 검색량까지 말한다 — 같은 숫자를 두 번 적지 않는다.
        o || r.volume == null ? "" : ` · 월 검색량 ${num(r.volume)}`}</span>
    </div>`;
  // 점수가 없어도 펼친다 — BLK_row 와 같은 어투: <details> 는 늘, 안에서만 갈린다.
  return `<details class="opp"${o ? ` data-opp="${o.id}"` : ""}><summary>${
      o ? oppScore(o) : `<div class="score"></div>`}<div>${head}
      ${o ? oppMeter(o) + oppWhy(o) + oppActs(o) : ""}</div></summary>
      ${o ? oppPanel(o) : `<div class="why">${CP_noOpp(r)}</div>`}</details>`;
}

function CP_gapRows(d) {
  const all = d.kw_gap || [];
  const rows = (CP_KIND ? all.filter(r => r.kind === CP_KIND) : all.slice())
    .sort((a, b) => CP_rank(b) - CP_rank(a));
  return `<div class="tools"><span class="n">${rows.length}개</span><span class="sp"></span>
      <button class="go sec" onclick="CP_csv()">CSV 내보내기</button></div>` +
    (rows.length ? rows.map(CP_card).join("")
      : `<div class="empty"><b>${CP_KIND ? "이 갈래에는 아직 없습니다."
          : "지금은 지킬 자리입니다."}</b>
          <p>${CP_KIND ? "칩을 다시 눌러 전체를 보세요."
            : "경쟁사가 앞선 검색어가 하나도 없습니다."}</p>
          ${CP_KIND ? `<div class="acts"><button onclick="CP_pick('')">전체 보기</button></div>`
            : CP_do("gaps", "격차 다시 재기")}</div>`);
}

function CP_chips(d) {
  const c = d.kw_gap_counts || {};
  const total = Object.values(c).reduce((a, b) => a + b, 0);
  if (!total) return "";
  const chip = (k, label, why, n) =>
    `<button class="chip${CP_KIND === k ? " on" : ""}" title="${esc(why)}"` +
    ` onclick="CP_pick('${k}')">${esc(label)} <b>${n}</b></button>`;
  return chip("", "전체", "모든 갈래", total) +
    CP_KINDS.filter(([k]) => c[k]).map(([k, l, w]) => chip(k, l, w, c[k])).join("");
}

function CP_pick(kind) {
  CP_KIND = (CP_KIND === kind) ? "" : kind;
  $("cp-chips").innerHTML = CP_chips(CP_D);
  $("cp-gaps").innerHTML = CP_gapRows(CP_D);
}

function CP_csv() {
  const all = CP_D.kw_gap || [];
  csv("keyword-gap", [["검색어", "갈래", "잡고 있는 곳", "경쟁사 순위", "우리 순위", "월 검색량"],
    ...(CP_KIND ? all.filter(r => r.kind === CP_KIND) : all).map(r =>
      [r.keyword, r.kind, r.domain, r.position, r.our_position, r.volume])]);
}

/* 빈 화면이 갈리는 자리 — 아직 안 돌렸다 / 돌렸는데 경쟁사를 못 찾았다.
   둘을 같은 "데이터 없음"으로 뭉치면 무엇을 하면 채워지는지가 화면 밖에 남는다.
   셸이 act() 를 세운 배포에서는 배포에 맞는 버튼 하나로 끝난다. */
const CP_do = (stage, label, primary = false) => READONLY ? ""
  : window.act
  ? `<div class="acts">${window.act(stage, label, primary)}</div>`
  : W(`<div class="cmd" role="button" tabindex="0" onclick="copyCmd(this)"
        onkeydown="if(event.key==='Enter'||event.key===' ')
          {event.preventDefault();copyCmd(this)}">/capture ${stage}</div>`,
      `<p class="cp-meta">화면 머리의 실행 버튼이 그 자리입니다.</p>`);

/* 데이터가 찬 뒤의 다음 명령이 없었다 — 표를 다 읽고 나면 갈 곳이 CSV 뿐이었다.
   collect_gap 은 같은 수집에서 경쟁사 키워드를 keywords 에 source='competitor_gap',
   is_active=0 으로 이미 넣어 둔다(이미 추적 중이거나 GSC 에 잡힌 것은 필터로 빠진다).
   화면이 그 사실을 한 글자도 말하지 않아서, 사용자는 같은 목록을 손으로 다시 넣고 있었다. */
/* 용어는 키워드 화면(sections/sm-kw.html)의 것을 그대로 쓴다 — 거기 탭이 [후보]와
   [추적 중]이라, 여기서만 "승인 대기 후보"·"큐레이션"이라고 부르면 같은 것이 두 이름을
   갖는다. 로컬 명령 칩은 셸의 siteArg() 로 사이트 이름을 싣는다(칩 모양 한 벌). */
const CP_cand = () => "경쟁사가 잡은 검색어는 같은 수집에서 <b>후보</b>로 이미 " +
  "들어가 있습니다. 이미 추적 중이거나 구글 실적에 잡힌 것은 빠집니다. " +
  W(`켜는 자리는 키워드 화면의 [후보] 탭입니다.
     <code class="cmd" onclick="copyCmd(this)">/capture keywords${siteArg()}</code>`,
    `${window.go("keywords")} 화면의 [후보] 탭에서 켜세요.`);

/* ── 다음 한 걸음: 이 화면의 상태는 넷이다 — 경쟁사를 안 찾았다 / 찾았는데 없다 /
      찾았고 격차는 아직 / 다 찼다. 다 찬 뒤의 행동은 다시 수집이 아니라 넘기기다:
      경쟁사 검색어는 이미 승인 대기 후보로 들어와 있고, 그걸 켜는 자리는 옆 화면이다. */
function CP_nextStep(d) {
  if (!window.nextStep || !window.act) return;
  const put = (t, acts) =>
    window.nextStep("competitors", `<p>${t}</p><div class="acts">${acts}</div>`);
  const rivals = (d.comp_metrics || []).filter(r => !r.is_self).length;
  if (!d.comp_date)
    return put("경쟁사를 아직 찾지 않았습니다. 누가 이 주제를 먹고 있는지부터 봅니다.",
      window.act("competitors", "경쟁사 찾기"));
  if (!rivals)
    return put("겹치는 경쟁 도메인을 찾지 못했습니다. 추적 검색어를 늘린 뒤 다시 찾으세요.",
      window.act("competitors", "경쟁사 다시 찾기"));
  if (!d.gap_date)
    return put(`경쟁사 ${num(rivals)}곳을 찾았습니다. 격차를 재면 어느 검색어에서 지고
      있는지 나옵니다.`, window.act("gaps", "격차 재기"));
  const c = d.kw_gap_counts || {};
  const lose = (c.missing || 0) + (c.weak || 0);
  if (!lose)
    return put(`경쟁사 ${num(rivals)}곳보다 아래인 검색어가 없습니다. 지키는 자리라
      주기적으로 다시 재세요.`, window.act("gaps", "격차 다시 재기"));
  // window.go 는 본문 글자에 섞이는 버튼(.gov)이라 띠에서는 주요 행동으로 안 읽힌다.
  // 같은 이동을 주요 톤으로 낸다. 그 화면이 이 배포에 없으면 격차 재기가 주요로 올라선다.
  const jump = SM.at("keywords") >= 0
    ? `<button type="button" class="go"
         onclick="SM.touched=true;SM.show('keywords')">후보 검색어 켜기</button>` : "";
  return put(`경쟁사가 앞선 검색어가 ${num(lose)}개입니다. 그중 ${num(c.missing || 0)}개는
    우리 순위가 아예 없어 새로 써야 합니다.`,
    jump + window.act("gaps", "격차 다시 재기", !jump));
}

/* 몫 한 줄 — 숫자 옆에 늘 견줄 상대를 놓는다. 목록을 읽기 전에 "우리가 몇 등인가"에
   먼저 답하는 자리라, 우리 몫과 1위 몫을 같은 문장에 세운다. */
function CP_standing(d) {
  const rows = d.comp_metrics || [];
  const me = rows.find(r => r.is_self), top = rows.find(r => !r.is_self);
  const pc = r => (r && r.share != null) ? Math.round(r.share * 100) + "%" : null;
  const mine = pc(me), best = pc(top);
  return (mine && best
    ? `우리 몫은 <b>${mine}</b>입니다. 가장 큰 곳은 ${esc(top.domain)} <b>${best}</b>입니다. `
    : "") +
    "몫은 추정 트래픽 기준이라 <b>실측이 아니라 추정</b>입니다. 순위를 가진 검색어 " +
    "수와 같이 읽으세요. 우리 줄이 녹청입니다.";
}

VIEW("competitors", function (d) {
  CP_D = d;
  const rivals = (d.comp_metrics || []).filter(r => !r.is_self).length;
  CP_nextStep(d);

  $("cp-share-eyebrow").textContent = d.comp_date
    ? `유기 검색 규모 · ${String(d.comp_date).slice(0, 10)} 기준` : "유기 검색 규모";
  $("cp-share-sub").innerHTML = !d.comp_date
    ? "누가 이 주제에서 얼마를 가져가는지, 우리는 그중 몇 %인지를 세는 자리입니다."
    : rivals
      ? CP_standing(d)
      : "같은 검색어에서 순위를 가진 도메인을 우리와 나란히 세우는 자리입니다.";
  $("cp-shares").innerHTML = !d.comp_date
    ? `<div class="empty"><b>경쟁사 목록이 비어 있습니다.</b>
        <p>같은 검색어에서 순위를 가진 도메인을 찾아 우리 몫과 나란히 세웁니다.</p>
        ${CP_do("competitors", "경쟁사 찾기")}</div>`
    : (CP_shares(d) || `<div class="empty"><b>겹치는 경쟁 도메인이 없습니다.</b>
        <p>주제가 좁거나 순위를 가진 검색어가 적을 때 이렇게 나옵니다. 추적 검색어를
          늘린 뒤 다시 찾으면 잡힙니다.</p>
        ${CP_do("competitors", "경쟁사 다시 찾기")}</div>`);

  $("cp-gap-eyebrow").textContent = d.gap_date
    ? `키워드 격차 · ${String(d.gap_date).slice(0, 10)} 기준` : "키워드 격차";
  $("cp-gap-sub").innerHTML = !d.gap_date
    ? "경쟁사가 순위를 가졌는데 우리는 없거나 아래인 검색어를 모으는 자리입니다."
    : "<b>우리는 없음</b>은 새로 써야 하는 것, <b>밀리는 중</b>은 있는 글을 고치는 " +
      "것입니다. 점수가 높은 것부터 놓았습니다. 검색량 순서와 다릅니다. " + CP_cand();
  $("cp-chips").innerHTML = d.gap_date ? CP_chips(d) : "";
  $("cp-gaps").innerHTML = d.gap_date ? CP_gapRows(d)
    : `<div class="empty"><b>키워드 격차를 아직 재지 않았습니다.</b>
        <p>경쟁사가 잡은 검색어를 우리 순위와 맞대어, 새로 쓸 것과 고칠 것을
          가릅니다.</p>
        ${CP_do("gaps", "격차 재기")}</div>`;
});
</script>
