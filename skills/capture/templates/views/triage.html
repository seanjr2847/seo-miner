     판정(무관·보류·작업)은 verdicts 에 남아 다음 측정에서 다시 안 올라온다.
     정본: docs/superpowers/specs/2026-09-08-keyword-triage-design.md
     이 화면이 무엇인지는 화면 자신이 말한다 — dashboard.py 가 이 선언을 window.__VIEWS__ 로 방출한다. -->

<style>
/* 심사 화면은 카드 격자다. 위에서 아래로: 현황(12) → 큐(8, 이 화면의 일이 여기서 일어난다) +

<script>
"use strict";
/* 상태: 서버가 준 행(TR_ROWS), 보는 판정(TR_FILTER: ""=미판정 | irrelevant | hold | work),
   종류 거르개, 찾는 말, 고른 키, 키보드 커서. 정규화는 서버가 한다 — 여기는 서버가 준
   key 를 그대로 돌려보낸다(사본을 두지 않는다). */
let TR_ROWS = [], TR_FILTER = "", TR_KIND = "", TR_Q = "", TR_SEL = new Set(), TR_CUR = 0, TR_PROJECT = "";
/* 언어 거르개 — 다국어 사이트는 한국어 검색어 사이에 영어·중국어가 섞여 한 줄로 심사됐다
   (theotherskin 150건). 언어는 서버가 가른다(r.lang, 규칙의 정본은 db.keyword_locale).
   섞여 있으면 처음엔 사이트 언어만 보여 주고, 거르개가 나머지 언어의 줄 수를 말한다.
   같은 사이트를 다시 받을 때(판정 뒤)는 고른 것을 둔다. */
let TR_LANG = "", TR_LANG_FOR = "", TR_SITE_LANG = "", TR_LANG_LABELS = {};
// 판정 셋 — 정본은 db.VERDICTS 다(test_seams 17 이 대조한다).
const TR_VERDICT = {irrelevant: "무관", hold: "보류", work: "작업"};
const TR_FILTER_OPT = [["", "미판정"], ["work", "작업"], ["hold", "보류"], ["irrelevant", "무관"]];
// 누른 뒤에 무엇이 달라졌는지로 말한다.
const TR_DONE = {irrelevant: "무관으로 뺐습니다. 다음 측정부터 안 올라옵니다.",
                 hold: "보류했습니다. 측정은 계속하고 기회에는 안 올립니다.",
                 work: "작업으로 보냈습니다. [개요]의 기회에 있습니다.",
                 "": "미판정으로 되돌렸습니다."};
const TR_FILTER_LABEL = v => (TR_FILTER_OPT.find(o => o[0] === v) || ["", ""])[1];

VIEW("triage", function (d) {
  TR_PROJECT = (d.project && d.project.name) || "";
  TR_SEL = new Set(); TR_CUR = 0;
  TR_fetch();
});

async function TR_fetch() {
  if (READONLY || !TR_PROJECT) return;
  const res = await fetch("/api/triage?project=" + encodeURIComponent(TR_PROJECT));
  if (!res.ok) {
    // 오류는 큐 카드 안에서 말한다 — 나머지 카드는 숫자가 없어 접는다.
    $("tr-grid").hidden = false; $("tr-grid").classList.add("solo");
    for (const id of ["tr-stat"]) $(id).hidden = true;
    document.querySelector("#tr-grid > .trside").hidden = true;
    $("triage").innerHTML = `<div class="empty err"><b>심사 목록을 불러오지 못했습니다</b>
      <p>[화면 다시 불러오기] 뒤 다시 하면 됩니다.</p></div>`;
    return;
  }
  const t = await res.json();
  TR_ROWS = t.rows || [];
  TR_SITE_LANG = t.site_lang || ""; TR_LANG_LABELS = t.lang_labels || {};
  if (TR_LANG_FOR !== TR_PROJECT) {
    TR_LANG_FOR = TR_PROJECT;
    const langs = new Set(TR_ROWS.map(r => r.lang).filter(Boolean));
    TR_LANG = langs.size > 1 && langs.has(TR_SITE_LANG) ? TR_SITE_LANG : "";
  }
  // 행이 하나도 없으면 숫자 카드는 0 만 말한다 — 큐 카드의 빈 상태 한 줄만 남긴다.
  const none = !TR_ROWS.length;
  $("tr-grid").hidden = false; $("tr-grid").classList.toggle("solo", none);
  $("tr-stat").hidden = none;
  document.querySelector("#tr-grid > .trside").hidden = none;
  TR_counts(t.counts || {});
  TR_tools();
  TR_draw();
  TR_nextStep();
}

// 셸의 [다음 행동] 띠는 이 화면에서 걷는다 — 남은 건수·다음 걸음은 현황 카드가 말하고
// [심사 시작]이 그 걸음이다. 예전 띠가 남아 있으면 지운다.
function TR_nextStep() { if (window.nextStep) nextStep("triage", ""); }

let TR_COUNTS = {};
function TR_counts(c) { TR_COUNTS = c; TR_renderCounts(); TR_stat(); }
// 판정별 전체 수는 거르기와 무관하게 그대로 둔다(요약이 거짓말하면 안 된다) — 검색·종류
// 필터가 걸려 있을 때만 뒤에 보이는 줄 수를 덧붙인다.
function TR_renderCounts() {
  const c = TR_COUNTS;
  const narrowed = TR_Q.trim() || TR_KIND || TR_LANG;
  // 「작업 178」은 [개요]의 기회 수(묶은 줄)와 다른 단위다 — 무엇을 셌는지 말한다.
  $("tr-counts").innerHTML = `미판정 <b>${c.none || 0}</b> · 작업으로 보낸 검색어 <b>${c.work || 0}</b>` +
    ` · 보류 <b>${c.hold || 0}</b> · 무관 <b>${c.irrelevant || 0}</b>` +
    (narrowed ? ` · 보이는 줄 <b>${TR_filtered().length}</b>` : "");
}

// 현황 카드 — 링(가린 비율) + 판정 네 칸. 숫자가 바뀔 때만 다시 그린다(링은 캔버스라 비싸다).
function TR_stat() {
  const c = TR_COUNTS, none = c.none || 0;
  const total = none + (c.work || 0) + (c.hold || 0) + (c.irrelevant || 0);
  const done = total - none;
  const ring = window.chDonut ? chDonut([
    {label: "작업", value: c.work || 0, on: true},
    {label: "보류", value: c.hold || 0, on: true},
    {label: "무관", value: c.irrelevant || 0, on: true},
    {label: "미판정", value: none}], {width: 132, unit: "건"}) : "";
  const pct = n => total ? Math.round(n / total * 100) + "%" : "0%";
  $("tr-statbody").innerHTML = `
    <div class="trring">${ring}
      <p><b>${none ? `${num(none)}건 남음` : "다 가렸습니다"}</b>전체 ${num(total)}건 중 ${num(done)}건(${pct(done)})을<br>가렸습니다</p></div>
    <div class="trtabs" role="group" aria-label="판정별 검색어 수 — 누르면 그 판정만 봅니다">${TR_FILTER_OPT.map(([v, l]) => {
      const n = v === "" ? none : (c[v] || 0);
      return `<button type="button" class="trtab" data-v="${v}" aria-pressed="${v === TR_FILTER}" onclick="TR_setFilter('${v}')">
        <span class="l">${l}</span><span class="v${v === "" && n ? " left" : ""}">${num(n)}</span>
        <span class="p">전체의 ${pct(n)}</span></button>`;
    }).join("")}</div>`;
  // 주 버튼 — 남은 게 있을 때만. 누르면 첫 미판정 줄로 커서를 옮긴다.
  $("tr-start").innerHTML = none && !READONLY
    ? `<button type="button" class="go" onclick="TR_start()">남은 ${num(none)}건 심사 시작</button>` : "";
}
function TR_tabs() {
  document.querySelectorAll("#tr-statbody .trtab").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.v === TR_FILTER)));
}

// 판정·언어로 거른 줄 — 종류 분해·종류 거르개가 세는 바탕이다(보이는 줄과 같은 모집단).
const TR_base = () => TR_ROWS.filter(r => (r.verdict || "") === TR_FILTER)
  .filter(r => !TR_LANG || r.lang === TR_LANG);
const TR_langName = lg => TR_LANG_LABELS[lg] || lg;
function TR_filtered() {
  const q = TR_Q.trim().toLowerCase();
  return TR_base()
    .filter(r => !TR_KIND || r.kinds.indexOf(TR_KIND) >= 0)
    .filter(r => !q || r.label.toLowerCase().includes(q));
}

// 도구줄은 데이터가 바뀔 때만 다시 그린다 — 매 키 입력마다 갈아치우면 찾기 칸이 포커스를 잃는다.
function TR_kindCounts() {
  const kinds = {};
  for (const r of TR_base())
    for (const k of r.kinds) kinds[k] = (kinds[k] || 0) + 1;
  return kinds;
}
const TR_kindLabel = k => (window.KIND_LABELS || {})[k] || k;
function TR_tools() {
  const kinds = TR_kindCounts();
  // 언어 거르개는 언어가 둘 이상일 때만 — 줄 수는 지금 보는 판정 기준이다.
  const lc = {};
  for (const r of TR_ROWS.filter(r => (r.verdict || "") === TR_FILTER))
    if (r.lang) lc[r.lang] = (lc[r.lang] || 0) + 1;
  const langs = Object.keys(lc).sort((a, b) => (b === TR_SITE_LANG) - (a === TR_SITE_LANG) || lc[b] - lc[a]);
  const all = Object.values(lc).reduce((a, b) => a + b, 0);
  const langSel = new Set(TR_ROWS.map(r => r.lang).filter(Boolean)).size > 1
    ? `<select onchange="TR_setLang(this.value)" aria-label="언어로 거르기"><option value="">모든 언어 (${all})</option>${langs.map(lg =>
        `<option value="${esc(lg)}"${lg === TR_LANG ? " selected" : ""}>${esc(TR_langName(lg))} (${lc[lg]})</option>`).join("")}</select>` : "";
  $("tr-tools").innerHTML = langSel +
    `<select onchange="TR_setKind(this.value)" aria-label="종류로 거르기"><option value="">모든 종류</option>${Object.keys(kinds).map(k =>
        `<option value="${esc(k)}"${k === TR_KIND ? " selected" : ""}>${esc(TR_kindLabel(k))} (${kinds[k]})</option>`).join("")}</select>
     <input type="search" value="${esc(TR_Q)}" oninput="TR_find(this.value)" placeholder="검색어로 찾기" aria-label="검색어로 찾기">`;
  TR_kinds(kinds);
}
// 종류 분해 카드 — 같은 개수를 select 도 갖는다(좁은 화면·키보드 폴백).
function TR_kinds(kinds) {
  kinds = kinds || TR_kindCounts();
  const keys = Object.keys(kinds).sort((a, b) => kinds[b] - kinds[a]);
  const mx = Math.max(1, ...keys.map(k => kinds[k]));
  const rows = TR_base().length;
  $("tr-kinds").innerHTML = `<div class="trh"><div><h2>어떤 진단에 걸렸나</h2>
      <p class="trsub">${TR_FILTER_LABEL(TR_FILTER)}${TR_LANG ? ` ${esc(TR_langName(TR_LANG))}` : ""} ${num(rows)}줄 기준. 누르면 그 종류만 봅니다.</p></div></div>` +
    (keys.length
      ? `<div class="trklist" role="group" aria-label="종류별 줄 수">${keys.map(k => `
        <button type="button" class="trk" data-k="${esc(k)}" aria-pressed="${k === TR_KIND}" onclick="TR_setKind(TR_KIND === this.dataset.k ? '' : this.dataset.k)">
          <span class="kl">${esc(TR_kindLabel(k))}</span><span class="kn">${num(kinds[k])}줄</span>
          <span class="kb"><i style="width:${Math.max(4, Math.round(kinds[k] / mx * 100))}%"></i></span></button>`).join("")}</div>`
      : `<div class="empty"><b>걸린 종류가 없습니다</b><p>이 판정에 해당하는 검색어가 없습니다.</p></div>`);
}
function TR_setFilter(v) { TR_FILTER = v; TR_KIND = ""; TR_SEL = new Set(); TR_CUR = 0; TR_tabs(); TR_tools(); TR_draw(); }
function TR_setKind(v) {
  TR_KIND = v; TR_CUR = 0;
  const sel = document.querySelector("#tr-tools select");
  if (sel) sel.value = v;
  document.querySelectorAll("#tr-kinds .trk").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.k === v)));
  TR_draw();
}
function TR_find(v) { TR_Q = v; TR_CUR = 0; TR_draw(); }
function TR_setLang(v) { TR_LANG = v; TR_KIND = ""; TR_SEL = new Set(); TR_CUR = 0; TR_tools(); TR_draw(); }

// 주 버튼 — 미판정으로 돌아가 첫 줄에 커서를 두고 큐로 내려간다. 새 행동은 없다(커서·스크롤뿐).
function TR_start() {
  if (TR_FILTER !== "") TR_setFilter(""); else { TR_CUR = 0; TR_draw(); }
  $("tr-q").scrollIntoView({block: "start"});
}

const TR_UNDO = () => TR_FILTER && !READONLY;
// 점수 색점 — 70 이상 진함, 40 이상 중간, 그 아래 옅음(점수는 100점 만점이다).
const TR_tier = s => s == null ? "" : s >= 70 ? "t1" : s >= 40 ? "t2" : "t3";
function TR_row(r, i) {
  const on = TR_SEL.has(r.key);
  const k = esc(r.key);
  return `<tr class="trrow${i === TR_CUR ? " cur" : ""}" data-key="${k}" data-i="${i}">
    <td><label class="trchk"><input type="checkbox"${on ? " checked" : ""} onchange="TR_toggle(this.closest('tr').dataset.key, this.checked)"
      aria-label="${esc(r.label)} 고르기"></label></td>
    <td><span class="trkw">${esc(r.label)}</span>${r.variants > 1
      ? `<span class="trvar" title="띄어쓰기·대소문자만 다른 변형 ${r.variants - 1}개를 한 줄로 묶었습니다">(+${r.variants - 1})</span>` : ""}${r.brand
      ? `<span class="st trbrand" title="사이트 이름·브랜드 표기가 들어 있는 검색어입니다. 보통 보류합니다.">브랜드</span>` : ""}${r.other_brand
      ? `<span class="st trother" title="다른 병원·가게·서비스 이름으로 보입니다. 우리 것이 아니면 무관으로 뺍니다.">남의 이름?</span>` : ""}${r.lang && r.lang !== TR_SITE_LANG && !TR_LANG
      ? `<span class="st trlang">${esc(TR_langName(r.lang))}</span>` : ""}
      <div class="trperf">${r.score == null ? "" : `점수 <span class="v">${Math.round(r.score)}</span> · `}클릭 <span class="v">${num(r.clicks)}</span> · 노출 <span class="v">${num(r.impressions)}</span></div>
      <div class="trkm">${r.kinds.map((kd, j) => `<span class="kind">${esc(r.labels[j] || kd)}</span>`).join("")}</div></td>
    <td><div class="trkinds">${r.kinds.map((kd, j) =>
      `<span class="kind">${esc(r.labels[j] || kd)}</span>`).join("")}</div></td>
    <td class="num">${r.score == null ? "—" : `<span class="trdot ${TR_tier(r.score)}" aria-hidden="true"></span>${Math.round(r.score)}`}</td>
    <td class="num">${num(r.clicks)} /&nbsp;${num(r.impressions)}</td>
    ${TR_UNDO() ? `<td><button class="go sm sec" onclick="TR_set([this.closest('tr').dataset.key], '')">미판정으로 되돌리기</button></td>` : ""}
  </tr>`;
}

// 손 볼 곳 — 지금 보는 줄에서 뽑는다(새 필드 없음). 0건이면 카드째 접는다.
const TR_FIX = {
  brand: {test: r => r.brand, head: n => `브랜드 표기 ${n}건`, note: "사이트 이름이 들어 있어 보통 보류합니다.", btn: "브랜드 줄 고르기"},
  other: {test: r => r.other_brand, head: n => `남의 이름으로 보이는 줄 ${n}건`,
          note: "다른 병원·가게·서비스 이름으로 보입니다. 우리 것이 아니면 무관입니다.", btn: "이 줄 고르기"},
  zero: {test: r => (r.impressions || 0) > 0 && !(r.clicks || 0), head: n => `노출은 있고 클릭은 0인 줄 ${n}건`,
         note: "보여도 눌리지 않는 검색어입니다.", btn: "이 줄 고르기"}};
function TR_fix() {
  const list = TR_filtered(), el = $("tr-fix");
  const items = READONLY ? [] : Object.entries(TR_FIX).map(([k, f]) => [k, f, list.filter(f.test).length]).filter(x => x[2]);
  el.hidden = !items.length;
  if (!items.length) { el.innerHTML = ""; return; }
  el.innerHTML = `<div class="trh"><div><h2>손 볼 곳</h2><p class="trsub">보이는 줄에서 모았습니다. 고른 뒤 판정은 직접 누릅니다.</p></div></div>` +
    items.map(([k, f, n]) => `<div class="trfx"><div><b>${f.head(n)}</b><span>${f.note}</span></div>
      <button type="button" class="go sm sec" onclick="TR_pick('${k}')">${f.btn}</button></div>`).join("");
}
function TR_pick(k) {
  TR_SEL = new Set(TR_filtered().filter(TR_FIX[k].test).map(r => r.key));
  TR_draw();
}

function TR_draw() {
  TR_renderCounts();
  const list = TR_filtered();
  // 언어로 거르고 있으면 가린 줄 수를 같이 말한다 — 처음부터 사이트 언어만 보여 주므로
  // 안 말하면 나머지 언어가 없는 줄로 읽힌다.
  const hid = TR_LANG ? TR_ROWS.filter(r => (r.verdict || "") === TR_FILTER && r.lang !== TR_LANG).length : 0;
  $("tr-qsub").innerHTML = `${TR_FILTER_LABEL(TR_FILTER)} 검색어 <b>${num(list.length)}</b>줄을 보고 있습니다.` +
    (TR_LANG ? ` ${esc(TR_langName(TR_LANG))}만 봅니다${hid ? `(다른 언어 ${num(hid)}줄은 위 언어 거르개에서)` : ""}.` : "");
  TR_fix();
  if (!TR_ROWS.length)
    return $("triage").innerHTML = `<div class="empty"><b>심사할 검색어가 없습니다</b>
      <p>기회 분석을 돌리면 측정이 물어온 검색어가 여기로 옵니다.</p></div>`;
  if (!list.length)
    return $("triage").innerHTML = (TR_FILTER || TR_KIND || TR_LANG || TR_Q.trim())
      ? `<div class="empty"><b>거른 조건에 맞는 검색어가 없습니다</b>
         <p>판정·언어·종류·찾는 말을 좁혀 놓았습니다. 조건을 풀면 전체가 다시 보입니다.</p>
         <div class="acts"><button class="go sec" onclick="TR_reset()">조건 지우기</button></div></div>`
      : `<div class="empty ok"><b>미판정 검색어가 없습니다</b>
         <p>전부 가렸습니다. 작업으로 보낸 것은 ${window.go ? go("overview") : "[개요]"}의 기회에 있습니다.</p></div>`;
  if (TR_CUR >= list.length) TR_CUR = list.length - 1;
  const n = TR_SEL.size;
  const bar = READONLY ? "" : `<div class="trbar">
      <label><input type="checkbox" onchange="TR_all(this.checked)"${n && n === list.length ? " checked" : ""}
        aria-label="보이는 줄 전부 고르기"> 전부</label>
      <span class="n">${n ? `선택 ${n}건 →`
        : `<span class="trkey">줄을 고르거나 <kbd>j</kbd><kbd>k</kbd>로 옮겨 <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd>으로 판정</span><span class="trtouch">줄을 고르면 판정 버튼이 켜집니다</span>`}</span>
      ${TR_btns(n)}
    </div>` + (n ? `<div class="trdock"><span class="n">선택 ${n}건</span>${TR_btns(n)}</div>` : "");
  $("triage").innerHTML = bar + table(
    ["", "검색어?띄어쓰기만 다른 변형은 한 줄로 묶습니다", "종류?이 검색어에 걸린 진단",
     ">점수?걸린 기회 중 가장 높은 점수(100점 만점). 색점은 70 이상 진함, 40 이상 중간, 그 아래 옅음",
     ">클릭 / 노출?최근 수집분의 서치콘솔 실적"]
      .concat(TR_UNDO() ? [""] : []),   // 되돌리기 칸은 판정을 거를 때만 — 빈 칸도 폭을 먹는다
    list.map(TR_row), "")
    // 표가 길면(모바일에서 20줄 넘게 스크롤하면) 필터·판정 바로 돌아갈 길이 없었다
    // (54_mobile_review_bottom.png) — 검색창까지 스크롤만 하고 포커스는 주지 않는다.
    + (list.length > 20
      ? `<div class="acts"><button class="go sec sm" onclick="TR_toTop()">맨 위로</button></div>`
      : "");
  const tbl = $("triage").querySelector("table");
  if (tbl) tbl.classList.add("trtable");
}

// 판정 버튼 셋 — 위 판정 바와 좁은 화면의 아래 막대가 같은 것을 쓴다.
const TR_btns = n => `
  <button class="go sm sec"${n ? "" : " disabled"} onclick="TR_setSel('irrelevant')"
    title="자동완성이 물어온 남의 검색어. 다음 측정부터 안 올라오고 키워드 추적에서도 빠집니다">무관<kbd>1</kbd></button>
  <button class="go sm sec"${n ? "" : " disabled"} onclick="TR_setSel('hold')"
    title="우리 검색어지만 지금은 안 함(브랜드 등). 측정은 계속하고 기회에는 안 올립니다">보류<kbd>2</kbd></button>
  <button class="go sm"${n ? "" : " disabled"} onclick="TR_setSel('work')"
    title="개요의 기회 목록으로 보냅니다">작업<kbd>3</kbd></button>`;

// 검색창으로만 스크롤한다(포커스는 안 준다) — 포커스까지 주면 모바일에서 자판이 뜬다.
function TR_toTop() {
  const el = document.querySelector("#tr-tools input[type=search]");
  if (el) el.scrollIntoView({block: "center"});   // 부드럽게는 셸의 scroll-behavior 가 정한다
}
function TR_reset() { TR_FILTER = ""; TR_KIND = ""; TR_Q = ""; TR_LANG = ""; TR_SEL = new Set(); TR_CUR = 0; TR_tabs(); TR_tools(); TR_draw(); }
function TR_toggle(key, on) { if (on) TR_SEL.add(key); else TR_SEL.delete(key); TR_draw(); }
function TR_all(on) { TR_SEL = new Set(on ? TR_filtered().map(r => r.key) : []); TR_draw(); }
function TR_setSel(v) { if (TR_SEL.size) TR_set([...TR_SEL], v); }

/* 판정 저장. 실패하면 행을 그대로 두고 말한다(거짓 성공을 그리지 않는다). */
async function TR_set(keys, verdict) {
  const [ok, r] = await post("/api/verdict", {project: TR_PROJECT, keys, verdict: verdict || null});
  if (!ok) return toast((r && (r.error || r.detail)) ||
    "판정을 저장하지 못했습니다. [화면 다시 불러오기] 뒤 다시 하면 됩니다.", "bad");
  toast(`${keys.length}건 — ${TR_DONE[verdict || ""]}`, "ok");
  TR_SEL = new Set();
  await TR_fetch();
  // 작업으로 보낸 것(또는 되돌린 것)은 기회 목록이 달라진다 — 페이로드를 다시 받는다.
  if (verdict === "work" || !verdict) load();
}

/* 키보드 — 이 화면이 보일 때, 입력칸 밖에서만. j/k 이동, 스페이스 고르기, 1/2/3 판정. */
document.addEventListener("keydown", e => {
  if (!window.SM || SM.cur !== "triage" || READONLY) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  const list = TR_filtered();
  if (!list.length) return;
  const cur = list[Math.min(TR_CUR, list.length - 1)];
  if (e.key === "j") { TR_CUR = Math.min(list.length - 1, TR_CUR + 1); TR_draw(); }
  else if (e.key === "k") { TR_CUR = Math.max(0, TR_CUR - 1); TR_draw(); }
  else if (e.key === " ") { e.preventDefault(); TR_toggle(cur.key, !TR_SEL.has(cur.key)); }
  else if (e.key === "1" || e.key === "2" || e.key === "3") {
    const v = {1: "irrelevant", 2: "hold", 3: "work"}[e.key];
    TR_set(TR_SEL.size ? [...TR_SEL] : [cur.key], v);
  } else return;
  const row = $("triage").querySelector(`.trrow[data-i="${TR_CUR}"]`);
  if (row) row.scrollIntoView({block: "nearest"});
});

/* 줄을 누르면 고른다 — 줄은 손을 얹으면 밝아지는데 누르면 아무 일도 없었다(체크박스만
   받았다). 띠도 "줄을 고르고"라고 말한다. 줄 안의 컨트롤·머리글 (i)는 제 일을 한다. */
document.addEventListener("click", e => {
  const tr = e.target.closest("#triage .trrow");
  if (!tr || READONLY || e.target.closest("input,label,button,a,.hint")) return;
  TR_CUR = +tr.dataset.i;
  TR_toggle(tr.dataset.key, !TR_SEL.has(tr.dataset.key));   // 다시 그리며 .cur 도 옮긴다
});
</script>
