 "sections": ["index", "devgap"], "stages": ["index"]}

<style>
/* ── 사이트 점검 ────────────────────────────────────────────
   크롤러가 없는 대신 구글이 URL 하나하나에 직접 답한 것만 쓴다. 그래서 이 화면의
   색은 둘뿐이다 — 구글이 색인했다(녹청) / 안 했다(산화동). 갈래별 심각도는 색을
   더 늘리는 대신 진하기로 말한다. ── */
.note { font-size:12px; line-height:1.7; color:var(--slate); margin:16px 0 0; max-width:74ch; }
.note b { color:var(--ink); font-weight:500; }

/* 색인 막대: 검사한 URL 전부를 한 줄에. 정상이 얼마나 되는지가 먼저 보여야 한다. */
.ixbar { display:flex; gap:2px; height:6px; margin:0 0 13px; }
.ixbar i { display:block; border-radius:1px; min-width:3px; }
.ixbar .b-ok { background:var(--patina); opacity:.55; }
.ixbar .b-s1 { background:var(--copper); }
.ixbar .b-s2 { background:var(--copper); opacity:.55; }
.ixbar .b-s3 { background:var(--slate); opacity:.55; }
@media (prefers-reduced-motion: no-preference) {
  .ixbar i { animation:grow .5s cubic-bezier(.2,.7,.3,1) both; transform-origin:left; }
}
/* 갈래 칩이 곧 막대의 범례다 — 같은 색 조각을 앞에 달고, 누르면 표를 거른다. */
.ixchip .sw { display:inline-block; width:7px; height:7px; border-radius:1px;
  margin-right:7px; background:var(--slate); }
.ixchip.s1 .sw { background:var(--copper); }
.ixchip.s2 .sw { background:var(--copper); opacity:.55; }
.ixchip.s3 .sw { background:var(--slate); opacity:.55; }
.ixchip.all .sw { display:none; }
.ixchips { margin:0 0 10px; }

.ixb { font:var(--micro);
  white-space:nowrap; color:var(--slate); }
.ixb.s1 { color:var(--copper); }
.ixb.s2 { color:var(--copper); opacity:.8; }
.ixurl { font-family:var(--mono); font-size:12.5px; word-break:break-all; min-width:22ch; }
.ixstate { font-family:var(--mono); font-size:11.5px; color:var(--slate); }
.ixfix { font-size:12.5px; color:var(--slate); }

/* 순위차 막대: 숫자 밑에 같은 길이의 언어를 하나 더 깔아 줄 세우기를 눈으로 만든다. */
.dgap { display:block; height:3px; margin:5px 0 0 auto; border-radius:2px;
  background:var(--copper); opacity:.5; }

/* 행을 누르면 밑이 열린다 — 표가 목록에서 끝나면 "그래서 뭘 하냐"는 화면 밖에 남는다.
   펼칠 수 있다는 사실은 첫 칸의 꺾쇠가 말한다(::before 라 정렬·CSV 에는 안 섞인다). */
tr.rw { cursor:pointer; }
tr.rw:focus-visible { outline:2px solid var(--patina); outline-offset:-2px; }
tr.rw[aria-expanded="true"] > td { background:var(--bar); }
tr.rw > td:first-child::before { content:"▸ "; color:var(--slate); }
tr.rw[aria-expanded="true"] > td:first-child::before { content:"▾ "; color:var(--patina); }
</style>

<section id="ix-sec">
  <div class="eyebrow">URL 검사</div>
  <h2 data-web="색인 생성 오류">색인 문제</h2>
  <p class="sub" id="ix-sub"></p>
  <div id="index"></div>
  <p class="note">이 화면이 답하는 건 <b>구글이 이 URL 을 색인했는가</b> 하나입니다 —
    구글 URL 검사 API 의 응답 그대로이고, 우리가 크롤해서 추정한 값이 아닙니다.

<section id="dev-sec">

  <p class="sub" id="dev-sub"></p>
  <div id="devgap"></div>
</section>

<script>
"use strict";
/* ── 기기 격차·색인 상태: 둘 다 "아직 안 수집"과 "수집했는데 문제 없음"이 같은
      빈 목록으로 온다 — 서버가 준 최신 수집일로 갈라 안내한다. 키 자체가 없으면
      이 기능 이전의 박제본이므로 섹션을 통째로 감춘다. ── */

/* ── 행 펼침 한 벌 ──────────────────────────────────────────
   두 표가 같은 몸짓을 쓴다: 행을 누르면 바로 밑에 <tr class="exp"> 하나가 끼어든다.
   목록은 innerHTML 로 통째 갈리지만 그릇(#index·#devgap)은 남으므로 위임으로 한 번만 묶는다.
   정렬은 tbody 를 통째로 재배치한다 — 펼친 줄이 부모와 떨어지므로 머리글을 누르면 먼저 접는다. */
function stExpClose(host) {
  host.querySelectorAll("tr.exp").forEach(t => t.remove());
  host.querySelectorAll('tr.rw[aria-expanded="true"]')
      .forEach(t => t.setAttribute("aria-expanded", "false"));
}

function stExpToggle(tr, detail) {
  const nx = tr.nextElementSibling;
  if (nx && nx.classList.contains("exp")) {
    nx.remove();
    return tr.setAttribute("aria-expanded", "false");
  }
  tr.setAttribute("aria-expanded", "true");
  tr.insertAdjacentHTML("afterend",
    `<tr class="exp"><td colspan="${tr.cells.length}">
       <div class="det">${detail(tr.dataset.k)}</div></td></tr>`);
}

function stExpBind(host, detail) {
  host.addEventListener("click", e => {
    if (e.target.closest("th[data-s]")) return stExpClose(host);
    const tr = e.target.closest("tr.rw");
    if (tr) stExpToggle(tr, detail);
  });
  host.addEventListener("keydown", e => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const tr = e.target.closest("tr.rw");
    if (!tr) return;
    e.preventDefault();                 // Space 가 페이지를 스크롤하지 않게
    stExpToggle(tr, detail);
  });
}

// 행 하나가 여는 손잡이 — 표를 그리는 쪽은 이 속성만 달면 된다.
const stRw = k => `class="rw" tabindex="0" role="button" aria-expanded="false"` +
  ` data-k="${esc(k)}" title="눌러서 무엇을 어떻게 고칠지 보기"`;

/* ── 색인 상태 ──────────────────────────────────────────── */
// bucket 라벨·심각도·고칠 곳. 원문 bucket 은 title 로 남긴다(scoring.index_issues 와 대조용).
// sev 1 = 막혀서 절대 색인 안 됨, 2 = 색인은 되는데 엉뚱한 URL 로, 3 = 아직 안 됨.
// 순서는 scoring 이 정렬해 준 순서 그대로다 — 손대는 차례가 곧 심각도다.
const ST_IX = {
  robots_blocked: {label:"robots.txt 차단", sev:1},
  fetch_error: {label:"가져오기 실패", sev:1},
  canonical_mismatch: {label:"대표 URL 엇갈림", sev:2},
  not_indexed: {label:"색인 안 됨", sev:3},
};
const ST_IX_ORDER = ["robots_blocked", "fetch_error", "canonical_mismatch", "not_indexed"];

let ST_IX_ROWS = [], ST_IX_B = "", ST_IX_Q = "", ST_IX_TOTAL = null;

// 검사한 URL 총수 — 판정 payload 에는 '문제 있는 URL' 만 온다. 분모가 없으면
// "7건"이 나쁜 건지 알 수가 없다. 색인 수집기가 runs.notes 에 남긴
// "urls=17/20 checked=2026-08-20" 에서 같은 날짜인 것만 읽는다. 못 찾으면 null.
function stIxChecked(d) {
  for (const r of (d.runs || [])) {
    if (r.kind !== "index") continue;
    const m = /urls=(\d+)\/\d+\s+checked=(\d{4}-\d{2}-\d{2})/.exec(r.notes || "");
    if (!m || m[2] !== d.index_date) continue;
    // 같은 날 배치를 나눠 돌리면 마지막 배치 수만 남는다 — 문제 수보다 작으면 안 쓴다.
    return +m[1] >= ST_IX_ROWS.length ? +m[1] : null;
  }
  return null;
}

function stIxBar(counts, ok) {
  const seg = [];
  if (ok > 0) seg.push(`<i class="b-ok" style="flex:${ok}" title="정상 ${ok}건"></i>`);
  for (const b of ST_IX_ORDER) {
    if (!counts[b]) continue;
    seg.push(`<i class="b-s${ST_IX[b].sev}" style="flex:${counts[b]}"
      title="${esc(ST_IX[b].label)} ${counts[b]}건"></i>`);
  }
  const n = ST_IX_ROWS.length;
  return `<div class="ixbar" role="img" aria-label="검사한 URL ${ok + n}개 중 정상 ${ok}개, 문제 ${n}개"
    >${seg.join("")}</div>`;
}

function stIxFiltered() {
  const q = ST_IX_Q.trim().toLowerCase();
  return ST_IX_ROWS.filter(r =>
    (!ST_IX_B || r.bucket === ST_IX_B) &&
    (!q || `${r.url} ${r.coverage_state || ""} ${r.detail || ""}`.toLowerCase().includes(q)));
}

// 칩은 다시 그리지 않고 상태만 뒤집는다 — 갈아치우면 방금 누른 칩이 포커스를 잃는다.
function stIxChip(el) {
  ST_IX_B = el.dataset.b || "";
  el.parentNode.querySelectorAll(".ixchip").forEach(c => {
    const on = (c.dataset.b || "") === ST_IX_B;
    c.classList.toggle("on", on);
    c.setAttribute("aria-pressed", on);
  });
  stIxList();
}
function stIxFind(v) { ST_IX_Q = v; stIxList(); }
function stIxReset() {
  ST_IX_B = ""; ST_IX_Q = "";
  stIxHead();
}

function stIxCsv() {
  csv("색인문제", [["갈래", "URL", "구글 판정", "verdict", "진단·처방"]].concat(
    stIxFiltered().map(r => [(ST_IX[r.bucket] || {}).label || r.bucket, r.url,
      r.coverage_state || "", r.verdict || "", r.detail || ""])));
}

// 도구줄·칩은 데이터가 바뀔 때만 그린다. 거르기는 아래 목록만 다시 그린다(stIxList).
function stIxHead() {
  const counts = {};
  for (const r of ST_IX_ROWS) counts[r.bucket] = (counts[r.bucket] || 0) + 1;
  const ok = ST_IX_TOTAL == null ? 0 : ST_IX_TOTAL - ST_IX_ROWS.length;
  const chips = ST_IX_ORDER.filter(b => counts[b]).map(b =>
    `<button class="chip ixchip s${ST_IX[b].sev}${ST_IX_B === b ? " on" : ""}"
       data-b="${esc(b)}" onclick="stIxChip(this)" title="${esc(b)}"
       aria-pressed="${ST_IX_B === b}"><em class="sw"></em>${esc(ST_IX[b].label)}
       <b>${counts[b]}</b></button>`).join("");
  $("index").innerHTML = stIxBar(counts, ok) +
    `<div class="ixchips">
       <button class="chip ixchip all${ST_IX_B ? "" : " on"}" data-b=""
         onclick="stIxChip(this)" aria-pressed="${!ST_IX_B}"><em class="sw"></em>전체
         <b>${ST_IX_ROWS.length}</b></button>${chips}</div>
     <div class="tools">
       ${ST_IX_ROWS.length >= SORT_MIN ? `<input type="search" value="${esc(ST_IX_Q)}"
         oninput="stIxFind(this.value)" placeholder="주소·판정으로 찾기"
         aria-label="색인 문제 찾기">` : ""}
       <span class="n" id="ixn"></span>
       <span class="sp"></span>
       <button class="go sec" onclick="stIxCsv()"
         title="지금 걸러 놓은 목록 그대로 내려받습니다">CSV 내보내기</button>
     </div><div id="ixlist"></div>`;
  stIxList();
}

function stIxList() {
  const list = stIxFiltered(), n = ST_IX_ROWS.length;
  $("ixn").textContent = list.length === n ? `${n}건` : `${list.length}건 / 전체 ${n}건`;
  if (!list.length)
    return $("ixlist").innerHTML = `<div class="empty">거른 조건에 맞는 URL이 없습니다.
      <div class="acts"><button onclick="stIxReset()">필터 지우기</button></div></div>`;
  $("ixlist").innerHTML = table(
    ["갈래?robots·가져오기·대표 URL 순으로 원인 하나에 접은 것 — 위 갈래부터 손대야 아래가 풀린다",
     "URL",
     "구글 판정?URL 검사 API 가 보고한 coverageState 원문 — 구글이 이 주소를 어떻게 다루는지",
     "진단 · 처방?원인별로 무엇을 고치면 되는지"],
    list.map(r => {
      const b = ST_IX[r.bucket] || {label:r.bucket, sev:3};
      return `<tr ${stRw(r.url)}>
        <td class="ixb s${b.sev}" title="${esc(r.bucket)}">${esc(b.label)}</td>
        <td class="ixurl">${esc(r.url)}</td>
        <td class="ixstate">${esc(r.coverage_state || r.verdict || "—")}</td>
        <td class="ixfix">${esc(r.detail)}</td></tr>`;
    }));
}

// 갈래마다 손대는 자리가 다르다 — 여기 없는 갈래는 구글 응답 원문만 보여준다.
const ST_IX_PLAY = {
  robots_blocked: {
    what: "내 사이트가 스스로 막고 있습니다 — 이걸 풀기 전에는 무엇을 고쳐도 색인되지 않습니다.",
    acts: ["robots.txt 를 열어 이 경로를 막는 Disallow 가 어느 줄인지 찾습니다.",
           '페이지 <head> 에 <meta name="robots" content="noindex"> 나 X-Robots-Tag 응답 헤더가 있는지 봅니다.',
           "막을 의도였으면 그대로 둡니다 — 문제가 아닙니다. 아니면 그 규칙만 지웁니다.",
           "지운 뒤 서치 콘솔 URL 검사에서 색인 생성을 요청합니다(재크롤은 며칠 걸립니다)."]},
  fetch_error: {
    what: "구글이 이 주소를 가져오다 실패했습니다 — 서버가 답을 못 줬거나 너무 늦게 줬습니다.",
    acts: ["시크릿 창으로 직접 열어 사람 눈에 정상인지 먼저 봅니다.",
           "응답 코드를 확인합니다 — 5xx·403·429 면 서버·방화벽·봇 차단 쪽입니다.",
           "리다이렉트를 끝까지 따라갑니다 — 단계가 길거나 루프면 그 자리에서 끊깁니다.",
           "느려서 끊긴 것이면(타임아웃) 그 시각 서버 로그와 부하를 봅니다.",
           "고친 뒤 색인 생성을 요청합니다."]},
  canonical_mismatch: {
    what: "구글이 고른 대표 URL 이 내가 지정한 canonical 과 다릅니다 — 실적이 다른 주소로 쌓입니다.",
    acts: ["구글이 고른 주소와 내 canonical 을 나란히 놓고 어느 쪽이 원본인지 정합니다.",
           "같은 내용이 여러 주소로 있으면 하나로 합치고 나머지는 301 로 보냅니다.",
           "구글이 고른 쪽이 맞으면 내 canonical 태그를 그쪽으로 맞춥니다.",
           "사이트맵·내부 링크도 같은 주소만 가리키게 통일합니다."]},
  not_indexed: {
    what: "막힌 것도 실패한 것도 아닌데 아직 안 들어갔습니다 — 못 찾았거나, 담을 값이 모자란 것으로 본 것입니다.",
    acts: ["사이트맵에 이 주소가 들어 있는지 확인합니다.",
           "이 페이지로 들어오는 내부 링크가 하나라도 있는지 봅니다 — 없으면 고아 페이지입니다.",
           "본문이 얇으면 실제로 답이 되는 내용을 채웁니다 — 얇은 페이지는 뒤로 밀립니다.",
           "그다음 색인 생성을 요청합니다."]},
};

// 색인이 막힌 페이지에 글을 시키지 않는다 — 색인 전에는 본문을 고쳐도 소용이 없다.
const ST_IX_DELIVER = {
  robots_blocked: ["막고 있는 robots.txt 줄 또는 meta robots 값을 어떻게 고칠지와 적용 위치",
                   "고친 뒤 색인 요청·확인 절차 순서"],
  fetch_error: ["이 URL 이 안 열리는 원인 후보와 확인 순서(응답 코드·리다이렉트 체인·타임아웃)",
                "서버·인프라 쪽에서 확인할 항목"],
  canonical_mismatch: ["canonical 을 어느 URL 로 맞출지와 그 근거",
                       "중복 페이지를 합칠지 남길지 판단과 처리 계획(301 대상)"],
  not_indexed: ["사이트맵 등록·내부 링크·색인 요청 중 무엇부터 할지 순서",
                "이 페이지로 링크를 걸 글과 앵커 텍스트"],
  _: ["색인을 막는 원인 후보와 확인 순서"],
};

function stIxDetail(url) {
  const r = ST_IX_ROWS.find(x => x.url === url);
  if (!r) return "";
  const p = ST_IX_PLAY[r.bucket] || {};
  const said = [r.coverage_state, r.verdict].filter(Boolean).map(esc).join(" · ");
  return `<p class="detn">구글 응답: ${said || "—"}</p>
    ${r.detail ? `<p class="detw">${esc(r.detail)}</p>` : ""}
    ${playList(p.what, p.acts)}
    <p class="detw">고칠 페이지: <a href="${esc(url)}" target="_blank"
      rel="noopener">${esc(url)}</a></p>
    ${pageFix(ST_AUDITS[url], url)}
    ${askBlock({url, audit: ST_AUDITS[url], acts: p.acts, queries: [],
                deliver: ST_IX_DELIVER[r.bucket] || ST_IX_DELIVER._,
                problem: `색인 문제(${esc(r.bucket)}) — ${r.detail || p.what || ""}`})}`;
}

function renderIndex(d) {
  if (!d.index_issues) return $("ix-sec").hidden = true;
  $("ix-sec").hidden = false;
  ST_IX_ROWS = d.index_issues;
  ST_IX_B = ""; ST_IX_Q = "";
  ST_IX_TOTAL = d.index_date ? stIxChecked(d) : null;
  if (!d.index_date) {
    $("ix-sub").textContent = "";
    // 웹에는 명령을 칠 곳이 없다 — 복사 칩 없이 화면 안의 버튼을 가리킨다.
    return $("index").innerHTML = W(
      `<div class="empty">색인 점검을 아직 안 했습니다 —
        구글에 URL 하나씩 물어 색인 여부를 받아 옵니다(노출 상위 페이지부터).
        <button class="cmd" onclick="copyCmd(this)">/capture index</button></div>`,
      `<div class="empty">색인 생성을 아직 확인하지 않았습니다 — 이 화면의 ` +
      `[색인 다시 검사]를 누르면 채워집니다.</div>`);
  }
  const total = ST_IX_TOTAL, n = ST_IX_ROWS.length;
  const scope = total == null ? "" : `URL ${num(total)}개 중 `;
  if (!n) {
    // 개수·축하는 위 sub 가 맡는다.
    $("ix-sub").innerHTML = `${esc(d.index_date)} 점검` +
      (total == null ? "" : ` · URL ${num(total)}개`) +
      ` — 구글이 하나하나 색인했다고 답했습니다.`;
    return $("index").innerHTML = stIxBar({}, total || 1) +
      `<div class="empty">${W("검사한 URL이 전부 색인돼 있습니다.",
                             "검사한 URL 이 모두 색인 생성됐습니다.")}</div>`;
  }
  $("ix-sub").innerHTML = `${esc(d.index_date)} 점검 · ${scope}<b>${n}건</b>이 색인에 못 들어갔습니다` +
    (total == null ? "" : ` · 정상 ${num(total - n)}개`) +
    ` — 위 갈래부터 손대세요(막힌 것 → 못 가져온 것 → 대표 URL 엇갈림 → 색인 안 됨).`;
  stIxHead();
}

/* ── 모바일 격차 ───────────────────────────────────────── */
let ST_DEV_ROWS = [], ST_DEV_Q = "";
// 순위는 소수 1자리로 고정 — 15.0이 15로 오면 등폭 열의 자릿수가 어긋난다.
const stP1 = v => Number(v).toFixed(1);

function stDevFiltered() {
  const q = ST_DEV_Q.trim().toLowerCase();
  return ST_DEV_ROWS.filter(r => !q || r.query.toLowerCase().includes(q));
}
function stDevFind(v) { ST_DEV_Q = v; stDevList(); }
function stDevReset() { ST_DEV_Q = ""; stDevHead(); }
function stDevCsv() {
  csv("모바일격차", [["검색어", "모바일 순위", "데스크톱 순위", "순위차",
    "모바일 노출", "모바일 CTR(%)", "데스크톱 CTR(%)"]].concat(
    stDevFiltered().map(r => [r.query, stP1(r.mobile_pos), stP1(r.desktop_pos),
      stP1(r.dpos), r.mobile_imp, r.mobile_ctr, r.desktop_ctr])));
}

function stDevHead() {
  $("devgap").innerHTML = `<div class="tools">
      ${ST_DEV_ROWS.length >= SORT_MIN ? `<input type="search" value="${esc(ST_DEV_Q)}"
        oninput="stDevFind(this.value)" placeholder="검색어로 찾기"
        aria-label="검색어 찾기">` : ""}
      <span class="n" id="devn"></span>
      <span class="sp"></span>
      <button class="go sec" onclick="stDevCsv()"
        title="지금 걸러 놓은 목록 그대로 내려받습니다">CSV 내보내기</button>
    </div><div id="devlist"></div>`;
  stDevList();
}

function stDevList() {
  const list = stDevFiltered(), n = ST_DEV_ROWS.length;
  $("devn").textContent = list.length === n ? `${n}건` : `${list.length}건 / 전체 ${n}건`;
  if (!list.length)
    return $("devlist").innerHTML = `<div class="empty">거른 조건에 맞는 검색어가 없습니다.
      <div class="acts"><button onclick="stDevReset()">필터 지우기</button></div></div>`;
  const mx = Math.max(...list.map(r => r.dpos), 1);
  // th 가 nowrap 이라 7열이면 좁은 화면에서 표가 본문 밖으로 삐져나간다 —
  // 깊이 로그와 같은 .logwrap 에 넣어 페이지가 아니라 표 안에서 가로로 스크롤시킨다.
  $("devlist").innerHTML = `<div class="logwrap">` + table(
    ["검색어", ">모바일?모바일 평균 게재순위", ">데스크톱?데스크톱 평균 게재순위",
     ">순위차?모바일 평균 게재순위 − 데스크톱 평균 게재순위. 클수록 모바일에서만 밀린다",
     ">모바일 노출?이 검색어의 모바일 노출 수 — 큰 것부터 고쳐야 이득이 크다",
     ">모바일 CTR", ">데스크톱 CTR?같은 검색어인데 기기에 따라 클릭률이 얼마나 갈리는지"],
    list.map(r => `<tr ${stRw(r.query)}><td class="kwcell">${esc(r.query)}</td>
      <td class="num down">${stP1(r.mobile_pos)}</td>
      <td class="num">${stP1(r.desktop_pos)}</td>
      <td class="num down">${stP1(r.dpos)}
        <i class="dgap" style="width:${(r.dpos / mx * 100).toFixed(0)}%"></i></td>
      <td class="num">${num(r.mobile_imp)}</td>
      <td class="num">${r.mobile_ctr}%</td>
      <td class="num">${r.desktop_ctr}%</td></tr>`)) + `</div>`;
}

// 모바일 격차는 검색어가 달라도 고치는 자리가 같다 — 글이 아니라 화면이다.
const ST_DEV_PLAY = {
  what: "순위가 아니라 모바일 화면이 문제입니다 — 같은 글인데 모바일에서만 밀립니다.",
  acts: ["폰으로 직접 열어 첫 화면에 무엇이 보이는지 봅니다 — 본문이 아니라 배너·동의창이면 그게 원인입니다.",
         "LCP·CLS 를 봅니다 — 이미지에 width·height 를 박고 광고·배너·위젯은 나중에 불러옵니다.",
         "표·코드 블록이 화면 밖으로 삐져나가지 않는지 봅니다 — 가로 스크롤은 그 블록 안에서만.",
         "전면 팝업(인터스티셜)을 없앱니다 — 모바일에서 특히 크게 깎입니다.",
         "탭·아코디언 뒤에 본문을 숨겼는지 봅니다 — 접힌 채로 두면 덜 읽힙니다."]
};

function stDevDetail(q) {
  const r = ST_DEV_ROWS.find(x => x.query === q);
  if (!r) return "";
  const pages = ST_QPAGES[q] || [];
  const url = pages[0] && pages[0].page;   // 노출이 가장 큰 페이지가 곧 손댈 페이지
  return `<p class="detw">모바일 ${stP1(r.mobile_pos)}위 vs 데스크톱 ${stP1(r.desktop_pos)}위
      (${stP1(r.dpos)}칸 아래) · 모바일 CTR ${r.mobile_ctr}% vs 데스크톱 ${r.desktop_ctr}% ·
      모바일 노출 ${num(r.mobile_imp)}</p>
    ${pageTable(pages)}
    ${pages.length ? "" : `<p class="detn">이 검색어로 걸린 페이지가 스냅샷에 없습니다 —
      페이지별 분해를 아직 수집하지 않았습니다.</p>`}
    ${playList(ST_DEV_PLAY.what, ST_DEV_PLAY.acts)}
    ${url ? `<p class="detw">고칠 페이지: <a href="${esc(url)}" target="_blank"
      rel="noopener">${esc(url)}</a></p>${pageFix(ST_AUDITS[url], url)}` : ""}
    ${askBlock({url, audit: ST_AUDITS[url], acts: ST_DEV_PLAY.acts,
                deliver: ["모바일에서 고칠 것 목록 — 레이아웃·이미지 크기 지정·지연 로드·전면 팝업(코드/설정 수준)",
                          "첫 화면에 무엇이 보여야 하는지",
                          "가로로 넘치는 표·코드 블록 처리 방법"],
                problem: `모바일 격차 — 모바일 ${stP1(r.mobile_pos)}위 vs 데스크톱 `
                         + `${stP1(r.desktop_pos)}위, 모바일 CTR ${r.mobile_ctr}%`,
                queries: [{q, note: `모바일 노출 ${num(r.mobile_imp)}`}]})}`;
}

function renderDevice(d) {
  if (!d.device_gap) return $("dev-sec").hidden = true;
  $("dev-sec").hidden = false;
  ST_DEV_ROWS = d.device_gap;
  ST_DEV_Q = "";
  if (!d.device_date) {
    $("dev-sub").textContent = "";
    return $("devgap").innerHTML = W(
      `<div class="empty">기기별 실적을 아직 안 읽었습니다 —
        설정에 <code>gsc_breakdown: device</code> 를 넣고 실적을 다시 읽으면 채워집니다.
        <button class="cmd" onclick="copyCmd(this)">/capture gsc</button></div>`,
      `<div class="empty">기기별 데이터를 아직 수집하지 않았습니다 — ` +
      `[전체 분석 실행]을 누르면 채워집니다.</div>`);
  }
  if (!ST_DEV_ROWS.length) {
    $("dev-sub").textContent = `${d.device_date} 기준`;
    return $("devgap").innerHTML = `<div class="empty">` + W(
      "모바일이 크게 밀리는 검색어가 없습니다. 콘텐츠 문제지 화면 문제는 아닙니다.",
      "모바일 게재순위가 크게 낮은 검색어가 없습니다 — 콘텐츠 문제이지 모바일 화면 문제는 아닙니다."
      ) + `</div>`;
  }
  const imp = ST_DEV_ROWS.reduce((a, r) => a + (r.mobile_imp || 0), 0);
  const worst = Math.max(...ST_DEV_ROWS.map(r => r.dpos));
  $("dev-sub").innerHTML = `${esc(d.device_date)} 기준 <b>${ST_DEV_ROWS.length}개</b> ` +
    `— 모바일 평균순위가 데스크톱보다 ${RULES.device_gap_pos}칸 이상 아래이고 모바일 노출 ` +
    `${num(RULES.device_min_imp)} 이상인 검색어. 걸린 모바일 노출 ${num(imp)}, 최대 격차 ` +
    `${stP1(worst)}칸. 고칠 곳은 글이 아니라 모바일 화면입니다.`;
  stDevHead();
}

// 펼침이 읽는 재료 — 표 행에는 없고 payload 에만 있다.
let ST_AUDITS = {}, ST_QPAGES = {};

VIEW("site", function (d) {
  ST_AUDITS = d.page_audits || {};
  ST_QPAGES = d.query_pages || {};
  renderDevice(d);
  renderIndex(d);
});

stExpBind(document.getElementById("index"), stIxDetail);
stExpBind(document.getElementById("devgap"), stDevDetail);
</script>
