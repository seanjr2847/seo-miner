<script>
"use strict";
/* 이 파일의 전역은 전부 KW_ — 조립하면 형제 화면들과 한 문서가 된다. */
let KW_ROWS = [], KW_SORT = "imp", KW_BAND = "", KW_PERIOD = "", KW_BRAND_EMPTY = false;
// 기회 상태 거르개 — 기본은 「남은 것」이다(정본은 셸의 oppStMatch — 기회가 안 붙은 줄은 그대로 서고 끝낸 것·관찰 중은 빠진다).
let KW_ST = "";
let KW_MV = [], KW_MQ = "", KW_MDIR = "";
let KW_PAGES = {}, KW_AUDITS = {};      // 검색어 → 걸린 내 페이지들, url → 점검 결과
/* 첫째가 기본값이다 — 노출이 많은 순은 "큰 것"을 말할 뿐 "먼저 할 것"을 못 말한다.
   순서는 셸의 기회 점수(scoring.WEIGHTS)가 정한다 — 이 화면이 다시 매기지 않는다. */
const KW_SORTS = [["opp", "먼저 할 순"], ["imp", "노출 많은 순"],
                  ["pos", "1페이지에 가까운 순"], ["clk", "클릭 많은 순"]];
// 오름차순으로 세우므로 점수는 음수로 뒤집는다. 기회가 없는 행은 1 로 두어 뒤로 민다.
const KW_score = q => { const o = oppOf(q); return Number.isFinite(o && o.score) ? -o.score : 1; };

/* ── 다음 행동 띠 ────────────────────────────────────────────────
   문장은 화면 머리 아래 한 자리(.next)에만 선다 — 셸이 심는다(window.nextStep).
   셸 스크립트는 이 파일보다 뒤에 조립되므로 렌더 시점에만 부른다.
   행동 버튼도 셸이 배포에 맞게 고른다(window.act): 로컬은 명령 칩, 호스팅은 버튼. */
const KW_next = (msg, acts) => window.nextStep &&
  nextStep("keywords", `<p>${msg}</p>` + (acts ? `<div class="acts">${acts}</div>` : ""));
// 명령 칩의 정본은 셸의 window.act 한 벌이다 — 그것만 사이트 이름을 싣는다(siteArg).
// 예전에 여기 있던 폴백은 이름 없는 `/capture gsc` 를 찍어서, 박제본을 받은 사람이
// 복사하면 doctor 가 어느 사이트냐고 되묻는 명령이 됐다. 셸이 없으면 아무것도 안 낸다.
const KW_act = (stage, label, primary) =>
  window.act ? window.act(stage, label, primary) : "";
// 띠의 주요 행동 — 띠가 이름을 부른 검색어를 그 자리에서 펼친다. 목록을 훑는 대신
// "제일 먼저 할 것"이 바로 열린다. 검색어를 선택자로 쓰지 않는다(따옴표에서 어긋난다).
let KW_TOP = "";
const KW_logRows = () => $("log") ? [...$("log").querySelectorAll("tr[data-kwq]")] : [];
const KW_logRow = q => KW_logRows().find(x => x.dataset.kwq === q);
const KW_open = tr => {
  if (!tr) return;
  if (tr.getAttribute("aria-expanded") !== "true") KW_toggle(tr);
  tr.scrollIntoView({behavior: "smooth", block: "center"});
};
function KW_openTop() { KW_open(KW_logRow(KW_TOP) || KW_logRows()[0]); }
// 아래 표의 펼침 줄에서 위 표의 같은 검색어로 건너간다 — 검색어는 그 줄이 들고 있다.
function KW_jump(btn) {
  const exp = btn.closest("tr.exp"), tr = exp && exp.previousElementSibling;
  KW_open(tr && KW_logRow(tr.dataset.kwq));
}

const KW_band = r => r.band || (Number.isFinite(r.pos) && r.pos <= (RULES.page1 || 10) ? "page1" : "page2");
const KW_gap = r => Number.isFinite(r.gap) ? r.gap : Math.max(0, r.pos - RULES.page1);
// 이니셜 아바타 — 색은 구간이다(문턱=산화동 w, 1페이지 안=녹청 a, 이 목록에 없는 검색어=정보색).
const KW_tone = q => { const r = KW_ROWS.find(x => x.query === q);
  return r ? (KW_band(r) === "page2" ? "w" : "a") : ""; };
const KW_av = (q, tone) => `<span class="kwav ${tone === undefined ? KW_tone(q) : tone}"
  aria-hidden="true">${esc(String(q).trim().charAt(0).toUpperCase() || "·")}</span>`;
// 눌린 칩 표시 — 칩을 다시 그리지 않고 켜짐만 옮긴다(키보드 초점이 안 사라진다).
function KW_pressed(sel, v) {
  document.querySelectorAll(sel).forEach(b => {
    const on = b.dataset.v === v;
    b.classList.toggle("on", on);
    b.setAttribute("aria-pressed", on ? "true" : "false");
  });
}
// 그림 폭 — 그림은 자기 카드 폭 그대로 그린다(viewBox 를 줄여 쓰면 글자가 12px 밑으로 내려간다).
let KW_FIGW = 0;

/* ── 순위 사다리: 순위 축(1위 왼쪽 → 20위 오른쪽), 10위가 1페이지 경계.
      막대는 "1페이지까지 밀어야 하는 거리" — 이 화면이 파는 바로 그 값. ── */
function depthFig(rows, period, w) {
  // 폭은 WIDTH 다 — W 는 뼈대의 문구 고르개(W(로컬, 웹))라 여기서 가리면 안 된다.
  const WIDTH = Math.max(520, w || 720), LANE = 32, PAD_T = 54;
  // 줄이 길어지면 위쪽 눈금이 화면 밖으로 나간다 — 아래에도 같은 눈금을 깐다.
  const botAxis = rows.length >= 8, PAD_B = botAxis ? 30 : 12;
  const L = Math.round(Math.min(330, Math.max(170, WIDTH * .34))), R = WIDTH - 72,
    EDGE = RULES.striking_hi;                        // 라벨은 축 바로 왼쪽에 붙인다
  const H = PAD_T + rows.length * LANE + PAD_B;
  const x = p => L + Math.min(p, EDGE) / EDGE * (R - L);
  const x10 = x(RULES.page1);
  const ticks = [1, 5, RULES.page1, 15, EDGE];
  const top = PAD_T - 8, bot = PAD_T + rows.length * LANE + 4;
  // 라벨은 칸에 들어갈 만큼만 — 한글은 12px 안팎, 라틴은 그 절반쯤이다.
  const tw = s => [...s].reduce((a, c) => a + (c.charCodeAt(0) > 127 ? 12.4 : 6.8), 0);
  const fit = (s, mx) => {
    if (tw(s) <= mx) return s;
    let o = "";
    for (const c of s) { if (tw(o + c + "…") > mx) break; o += c; }
    return o + "…";
  };

  const lanes = rows.map((r, i) => {
    const y = PAD_T + i * LANE + LANE / 2;
    const px = x(r.pos), onPage1 = KW_band(r) === "page1";
    const c = onPage1 ? "var(--accent)" : "var(--warn)";
    const x1 = Math.min(px, x10), x2 = Math.max(px, x10);
    // 2페이지 검색어는 1페이지 경계까지 되밀어야 할 거리를 막대로 — 이 화면이 파는 값.
    const dist = onPage1 ? "" :
      `<rect class="grow" x="${x1}" y="${y - 4}" width="${x2 - x1}" height="8" rx="4"
             fill="var(--warn)" opacity=".38" style="transform-origin:${x2}px 0;
             animation-delay:${i * 16}ms"/>`;
    // 거리는 서버가 계산해 준다(scoring.gap_to_page1).
    const gap = onPage1 ? "이미 1페이지"
      : `1페이지까지 ${KW_gap(r).toFixed(1)}칸`;
    // data-lane 은 아래 표의 몇 번째 줄인가다 — 검색어 문자열로 되짚지 않는다(따옴표·
    // 대소문자에서 어긋난다). 표는 같은 rows 를 같은 순서로 그리므로 번호가 정본이다.
    return `<g class="lane" data-lane="${i}">
      <rect class="lane-bg" x="0" y="${y - LANE / 2}" width="${WIDTH}" height="${LANE}" rx="8" fill="none"/>
      <text class="kw" x="${L - 16}" y="${y + 4}" text-anchor="end">${esc(fit(r.query, L - 22))}</text>
      <line class="track" x1="${L}" y1="${y}" x2="${R}" y2="${y}" stroke-width="1"/>
      ${dist}
      <circle cx="${px}" cy="${y}" r="5.5" fill="${c}" stroke="var(--card)" stroke-width="2"/>
      <text class="num" x="${px + (onPage1 ? 0 : 11)}" y="${y - 10}"
            text-anchor="${onPage1 ? "middle" : "start"}">${r.pos}</text>
      <text class="num" x="${WIDTH}" y="${y + 4}" text-anchor="end">${num(r.imp)}</text>
      <title>${esc(r.query)} · ${r.pos}위 · 노출 ${num(r.imp)} · 클릭 ${num(r.clk)} · ${gap}</title>
    </g>`;
  }).join("");

  // 경계선은 따로 그리므로 눈금선에서는 뺀다 — 같은 자리에 선이 둘 겹친다.
  const grid = ticks.filter(t => t !== RULES.page1).map(t =>
    `<line class="vgrid" x1="${x(t)}" y1="${top}" x2="${x(t)}" y2="${bot}"
           stroke-width="1"/>`).join("");
  // 마지막 눈금은 축 끝(R)에 서므로 가운데 정렬이면 오른쪽 노출 라벨과 겹친다 —
  // 그 하나만 축 안쪽으로 붙인다.
  const tick = y => ticks.map((t, i) => `<text class="axis" x="${x(t)}" y="${y}"
      text-anchor="${i === ticks.length - 1 ? "end" : "middle"}"
      >${t}${t === EDGE ? "위+" : ""}</text>`).join("");

  const p1 = rows.filter(r => KW_band(r) === "page1").length;
  const impLabel = period ? `${period} 노출` : "노출";
  return `<div class="logwrap"><svg class="log" viewBox="0 0 ${WIDTH} ${H}" width="${WIDTH}"
      style="display:block;width:100%;min-width:0;height:auto" role="img"
      aria-label="검색어 ${rows.length}개의 평균 순위와 1페이지까지 남은 거리. 1페이지 안 ${p1}개, 문턱 ${rows.length - p1}개">
    <rect x="${L}" y="${top}" width="${x10 - L}" height="${bot - top}" rx="10" fill="var(--accent-wash)"/>
    ${grid}
    <line x1="${x10}" y1="${top}" x2="${x10}" y2="${bot}"
          stroke="var(--accent)" stroke-width="1"/>
    <text class="axis" x="${L}" y="${PAD_T - 36}">평균 순위 →</text>
    <text class="axis" x="${x10 - 6}" y="${PAD_T - 36}" text-anchor="end"
          fill="var(--accent)">1페이지 경계</text>
    ${tick(PAD_T - 15)}
    <text class="axis" x="${WIDTH}" y="${PAD_T - 15}" text-anchor="end">${esc(impLabel)}</text>
    ${lanes}
    ${botAxis ? tick(H - 9) : ""}
  </svg></div>`;
}

// 그림이 답 못 하는 것(정확한 값·키보드·낭독기)은 같은 데이터를 표로 낸다.
// 여기가 이 화면의 할 일 목록이다 — 줄마다 점수·왜·펼치면 무엇을 고칠지가 붙는다.
function KW_logTable(rows, brandCatalogEmpty, period) {
  // 목록이 남의 브랜드로 오염됐다는 것은 상태다 — 배지로 말하고 고치러 갈 자리를
  // 옆에 둔다. 설정이 없는 배포(호스팅)에서는 window.go 가 글자로 물러선다.
  const warn = brandCatalogEmpty
    ? `<p class="kwwarn"><span class="badge warn">타사 섞임</span>
        <span>경쟁사 이름을 채우면 남의 브랜드 검색어가 목록에서 빠집니다.</span>
        ${window.SM && SM.at("settings") >= 0
          ? window.go("settings", "설정 열기") : ""}</p>`
    : "";
  const hasScore = KW_hasScore(rows);
  const impLabel = period ? `${period} 노출` : "노출";
  // "평균 순위"·"클릭"은 열 이름 그대로라 ⓘ가 없어도 읽힌다 — 정말 처음 보면
  // 모를 것("1페이지까지"의 계산 기준, 노출이 왜 기회인지)만 남긴다.
  const tbl = table([
    "검색어",
    ...(hasScore ? [KW_SCORE_TH] : []),
    ">평균 순위",
    `>1페이지까지?${RULES.page1}위 경계까지 올려야 할 칸 수입니다. 이미 1페이지면 빈 칸입니다`,
    `>${impLabel}?${period || "기간"} 합계 노출입니다. 순위를 올리면 클릭으로 바뀔 몫입니다`,
    ">클릭"],
    rows.map(r => `<tr ${KW_rowAttr(r.query, "log")}>${KW_qcell(r.query, hasScore)}
      <td class="num"><span class="kwrk${KW_band(r) === "page2" ? " w" : ""}">${r.pos}</span></td>
      <td class="num">${KW_gap(r) > 0 ? KW_gap(r).toFixed(1) : '<span class="muted">—</span>'}</td>
      <td class="num">${num(r.imp)}</td>
      <td class="num">${num(r.clk)}</td></tr>`), "", "cards");
  return warn + tbl;
}

// 거르기·정렬은 화면에서 한다 — 서버가 준 15개가 이 화면이 가진 전부다.
function KW_filtered() {
  const rows = KW_ROWS.filter(r =>
    (!KW_BAND || r.band === KW_BAND) && window.oppStMatch(oppOf(r.query), KW_ST));
  const key = {opp: r => KW_score(r.query), imp: r => -(r.imp || 0),
               pos: r => r.pos, clk: r => -(r.clk || 0)}[KW_SORT];
  return rows.sort((a, b) => key(a) - key(b));
}
function KW_setSort(v) { KW_SORT = v; KW_drawLog(); }
function KW_setBand(v) { KW_BAND = v; KW_pressed("#log-tools .kwchips .chip", v); KW_drawLog(); }
function KW_setSt(v) { KW_ST = v; KW_drawLog(); }
function KW_reset() { KW_BAND = ""; KW_ST = ""; KW_tools(); KW_drawLog(); }
function KW_stAll() { KW_ST = "all"; KW_tools(); KW_drawLog(); }

// 도구줄은 데이터가 바뀔 때만 그린다 — 거르기는 아래 그림·표만 다시 그린다(KW_drawLog).
function KW_tools() {
  const cnt = b => b ? KW_ROWS.filter(r => r.band === b).length : KW_ROWS.length;
  const bands = [["", "전체"],
    ["page2", `1페이지 문턱 ${RULES.page1 + 1}~${RULES.striking_hi}위`],
    ["page1", `1페이지 안 ${RULES.striking_lo}~${RULES.page1}위`]];
  // #log-tools 가 곧 도구줄이다 — 안에 .tools 를 한 겹 더 두면 여백이 두 번 선다.
  $("log-tools").innerHTML = `
    <div class="kwchips" role="group" aria-label="구간으로 거르기">${bands.map(([v, l]) =>
      `<button type="button" class="chip${v === KW_BAND ? " on" : ""}" data-v="${v}"
        aria-pressed="${v === KW_BAND}" onclick="KW_setBand('${v}')">${l} <b>${cnt(v)}</b></button>`
      ).join("")}</div>
    <select onchange="KW_setSort(this.value)" aria-label="정렬 기준">${KW_SORTS.map(
      ([v, l]) => `<option value="${v}"${v === KW_SORT ? " selected" : ""}>${l}</option>`
      ).join("")}</select>
    ${window.oppStSelect(KW_ST, "KW_setSt",
      s2 => KW_ROWS.filter(r => window.oppStMatch(oppOf(r.query), s2)).length)}
    <span class="n" id="logn"></span>
    <span class="sp"></span>
    <button class="go sm sec" onclick="KW_csvLog()"
      title="지금 걸러 놓은 목록 그대로 내려받습니다">CSV 내려받기</button>`;
}

// 그림만 다시 그린다 — 카드 폭이 바뀌면(창 크기·레일 접기) 폭을 새로 재서 그린다.
function KW_drawFig(rows) {
  const box = $("log-fig");
  if (!box || !KW_ROWS.length) return;
  rows = rows || KW_filtered();
  KW_FIGW = Math.round(box.clientWidth);
  box.innerHTML = rows.length ? depthFig(rows, KW_PERIOD, KW_FIGW)
    : `<p class="kwnone">표 위의 조건에 맞는 검색어가 없어 그림도 비었습니다.</p>`;
}

function KW_drawLog() {
  const rows = KW_filtered();
  $("logn").textContent = rows.length === KW_ROWS.length
    ? `${rows.length}개` : `${rows.length}개 / 전체 ${KW_ROWS.length}개`;
  KW_drawFig(rows);
  $("log").innerHTML = rows.length
    ? KW_logTable(rows, KW_BRAND_EMPTY, KW_PERIOD)
    // 기본값(남은 것)이 전부 걸렀으면 [전체 보기](조건 지우기)는 헛바퀴다 — 다 처리했다고 말한다
    : window.oppLeftDone(KW_ST, KW_ROWS, r => oppOf(r.query))
    ? window.oppLeftEmpty("검색어", KW_ROWS.length, "KW_stAll()")
    : `<div class="empty"><b>거른 조건에 맞는 검색어가 없습니다</b>
        <p>조건을 풀면 ${KW_ROWS.length}개가 있습니다.</p>
        <div class="acts"><button onclick="KW_reset()">전체 보기</button></div></div>`;
}
// 카드 폭이 달라지면 그림을 다시 잰다. 숨은 화면(폭 0)에서 보이는 순간도 여기서 잡힌다.
function KW_watchFig() {
  const box = $("log-fig");
  if (!box || box.dataset.kwRo || !window.ResizeObserver) return;
  box.dataset.kwRo = "1";
  new ResizeObserver(() => {
    const w = Math.round(box.clientWidth);
    if (w && Math.abs(w - KW_FIGW) > 6 && KW_ROWS.length) KW_drawFig();
  }).observe(box);
}

/* ── 위쪽 카드들: 세 질문(얼마나 걸렸나·얼마 놓치나·움직였나)과 먼저 할 3개 ── */
// 계산은 전부 이 화면이 이미 가진 KW_ROWS·KW_MV 에서 한다 — 새 필드가 없다.
function KW_kpis(d, p2) {
  const box = $("kw-kpis");
  if (!KW_ROWS.length) { box.innerHTML = ""; return; }
  const n = KW_ROWS.length, per = KW_PERIOD || "기간";
  const totImp = KW_ROWS.reduce((s, r) => s + (r.imp || 0), 0);
  const gate = KW_ROWS.filter(r => KW_band(r) === "page2");
  const gImp = gate.reduce((s, r) => s + (r.imp || 0), 0);
  const gClk = gate.reduce((s, r) => s + (r.clk || 0), 0);
  const share = totImp ? Math.round(gImp / totImp * 100) : 0;
  // ① 문턱 검색어 수 + 검색어별 노출 막대(순위 순, 색은 구간)
  const sorted = [...KW_ROWS].sort((a, b) => a.pos - b.pos);
  const mx = Math.max(1, ...sorted.map(r => r.imp || 0));
  const bars = sorted.map((r, i) => {
    const h = Math.max(4, Math.round((r.imp || 0) / mx * 30));
    return `<rect x="${i * 12}" y="${32 - h}" width="8" height="${h}" rx="3"
      fill="${KW_band(r) === "page2" ? "var(--warn)" : "var(--accent)"}"><title>${esc(r.query)} · ${r.pos}위 · 노출 ${num(r.imp)}</title></rect>`;
  }).join("");
  const k1 = `<div class="card kwk">
    <div class="kwkh"><span class="kwkt">1페이지 문턱 검색어</span>
      <span class="chip ne">${RULES.page1 + 1}~${RULES.striking_hi}위</span></div>
    <div class="kwkv"><b>${p2}</b><span>/ ${n}개</span></div>
    <p class="kwks">이 목록의 검색어 ${n}개 중 문턱에 걸린 것입니다.</p>
    <div class="kwkz"><svg viewBox="0 0 ${n * 12 - 4} 32" width="${n * 12 - 4}" role="img"
      aria-label="검색어 ${n}개의 노출 막대. 문턱 ${p2}개, 1페이지 안 ${n - p2}개">${bars}</svg></div></div>`;
  // ② 문턱에 묶인 노출 — 순위를 올리면 클릭으로 바뀔 몫
  const k2 = `<div class="card kwk">
    <div class="kwkh"><span class="kwkt">문턱에 묶인 ${esc(per)} 노출</span>
      <span class="chip ${gImp ? "dn" : "ne"}">전체의 ${share}%</span></div>
    <div class="kwkv"><b>${num(gImp)}</b><span>노출</span></div>
    <p class="kwks">${p2 ? `문턱 ${p2}개의 합 · 클릭 ${num(gClk)}` : "문턱에 걸린 검색어가 없습니다"}
      · 이 목록 ${n}개 기준</p>
    <div class="kwkz"><div class="kwmeter" role="img"
      aria-label="목록 노출 ${num(totImp)} 중 문턱 ${share}%"><i class="w" style="width:${share}%"></i></div></div></div>`;
  // ③ 움직임 — 직전 기록과 같은 기간끼리 견준 것
  const nUp = (d.ups || []).length, nDown = (d.downs || []).length, nMv = nUp + nDown;
  const cmp = d.gsc_prev
    ? `<span class="kwd">${esc(d.gsc_prev)}</span> → <span class="kwd">${esc(d.gsc_date)}</span>`
    : "";
  const k3 = `<div class="card kwk">
    <div class="kwkh"><span class="kwkt">순위 움직임</span>
      ${nMv ? `<span class="chip ne">${esc(String(d.gsc_period || ""))}일치끼리</span>` : ""}</div>
    ${nMv
      ? `<div class="kwkv"><b class="up">▲ ${nUp}</b><b class="dn">▼ ${nDown}</b><span>개</span></div>
         <p class="kwks">직전 기록 대비 ${cmp}</p>
         <div class="kwkz"><div class="kwmeter" role="img"
           aria-label="오른 것 ${nUp}개, 내린 것 ${nDown}개">
           <i class="a" style="width:${nUp / nMv * 100}%"></i><i class="w" style="width:${nDown / nMv * 100}%"></i></div></div>`
      : `<div class="kwkv"><b>${d.gsc_prev && !d.period_mismatch ? "0" : "—"}</b>${
           d.gsc_prev && !d.period_mismatch ? "<span>개</span>" : ""}</div>
         <p class="kwks">${d.period_mismatch ? "직전 기록과 기간이 달라 견주지 않았습니다."
           : d.gsc_prev ? "직전 기록과 견줘 움직인 검색어가 없습니다."
           : "실적을 두 번 이상 수집하면 채워집니다."}</p>`}</div>`;
  box.innerHTML = k1 + k2 + k3;
}

// 먼저 할 3개 — 이름이 붙은 우선순위. 순서는 셸의 기회 점수가 정한다(이 화면이 다시 매기지 않는다).
let KW_TOP3 = [];
function KW_openAt(i) {
  const r = KW_TOP3[i];
  if (!r) return;
  let tr = KW_logRow(r.query);
  if (!tr) { KW_reset(); tr = KW_logRow(r.query); }   // 거르기에 가려졌으면 조건부터 푼다
  KW_open(tr);
}
function KW_topCard(p2, top) {
  const box = $("kw-top");
  if (!KW_ROWS.length) { KW_TOP3 = []; box.innerHTML = ""; return; }
  const shut = r => { const o = oppOf(r.query); return !!o && !window.oppStMatch(o, "open"); };
  const rest = KW_ROWS.filter(r => !shut(r) && (!top || r.query !== top.query))
    .sort((a, b) => (p2 ? (KW_band(b) === "page2") - (KW_band(a) === "page2") : 0)
      || KW_score(a.query) - KW_score(b.query) || (b.imp || 0) - (a.imp || 0));
  KW_TOP3 = (top ? [top, ...rest] : rest).slice(0, 3);
  const head = `<div class="kwch"><div><h2>먼저 할 3개</h2>
    <p class="sub">${KW_ROWS.some(r => oppOf(r.query)) ? "기회 점수가 높은 순, 아직 처리하지 않은 것" : "노출이 많은 순, 아직 처리하지 않은 것"}</p></div></div>`;
  if (!KW_TOP3.length) {
    box.innerHTML = head + `<div class="empty ok"><b>이 목록의 검색어는 모두 처리했습니다</b>
      <p><span class="live">다음 수집에서 새로 걸린 검색어가 여기 섭니다.</span></p></div>`;
    return;
  }
  box.innerHTML = head + `<ol class="kwtop">${KW_TOP3.map((r, i) => {
    const o = oppOf(r.query), page2 = KW_band(r) === "page2";
    return `<li>${KW_av(r.query)}
      <div style="min-width:0"><div class="q" title="${esc(r.query)}">${esc(r.query)}</div>
        <div class="m">${o && Number.isFinite(o.score)
          ? `<span class="kwsc" title="기회 점수 ${o.score}점 / 100점">${Math.round(o.score)}점</span>` : ""}
          <span>${KW_pos(r.pos)}위${page2 ? ` · 1페이지까지 ${KW_gap(r).toFixed(1)}칸` : " · 1페이지 안"}</span></div></div>
      <button class="go sm sec" onclick="KW_openAt(${i})"
        aria-label="${esc(r.query)} 열기">열기</button></li>`;
  }).join("")}</ol>`;
}

// 문턱 비중 — 개수만 말하는 보조 도넛이다. 녹청이 1페이지 안(그림의 점과 같은 색)이고 회색이 문턱이다.
function KW_donutCard() {
  const box = $("kw-donut");
  if (!KW_ROWS.length) { box.innerHTML = ""; return; }
  const n = KW_ROWS.length, a = KW_ROWS.filter(r => KW_band(r) === "page1").length, w = n - a;
  const ring = window.chDonut
    ? window.chDonut([{label: "1페이지 안", value: a, on: true},
                      {label: "1페이지 문턱", value: w}], {width: 124, unit: "개"}) : "";
  box.innerHTML = `<div class="kwch"><div><h2>문턱 비중</h2>
    <p class="sub">검색어 ${n}개를 1페이지 안팎으로 나눴습니다.</p></div></div>
    <div class="kwdn">${ring}<ul>
      <li><i></i>1페이지 안 <b>${a}개</b></li>
      <li><i class="g"></i>1페이지 문턱 <b>${w}개</b></li></ul></div>`;
}

// ── 움직인 검색어 ────────────────────────────────────────────
function KW_mvFiltered() {
  const q = KW_MQ.trim().toLowerCase();
  return KW_MV.filter(m => (!KW_MDIR || m.dir === KW_MDIR) &&
    (!q || m.query.toLowerCase().includes(q)));
}
function KW_mvFind(v) { KW_MQ = v; KW_mvList(); }
function KW_mvDir(v) { KW_MDIR = v; KW_pressed("#movers .kwchips .chip", v); KW_mvList(); }
function KW_mvReset() { KW_MQ = ""; KW_MDIR = ""; KW_mvRender(); }

// 변동 분해 — 가장 크게 움직인 검색어 위 3·아래 3의 Δ순위. 값은 페이로드의 dpos 그대로다.
function KW_mvDiv() {
  const grid = $("kw-mvgrid"), box = $("mv-div");
  grid.classList.toggle("nomv", !KW_MV.length);
  $("mv-card").classList.toggle("wide", !KW_MV.length);
  if (!KW_MV.length) { box.innerHTML = ""; return; }
  const val = m => Number.isFinite(m.dpos) ? (m.dir === "down" ? -Math.abs(m.dpos) : Math.abs(m.dpos)) : 0;
  const cut = s => s.length > 12 ? s.slice(0, 11) + "…" : s;
  const ups = KW_MV.filter(m => m.dir === "up").sort((a, b) => val(b) - val(a)).slice(0, 3);
  const dns = KW_MV.filter(m => m.dir === "down").sort((a, b) => val(a) - val(b)).slice(0, 3);
  const rows = [...ups, ...dns].map(m => ({label: cut(m.query), value: +val(m).toFixed(1)}));
  const fmt = v => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(1);
  box.innerHTML = `<div class="kwch"><div><h2>가장 크게 움직인 검색어</h2>
    <p class="sub">직전 기록 대비 순위가 움직인 칸 수입니다. 오른쪽이 올라온 것입니다.</p></div></div>
    ${window.chDiverge ? window.chDiverge(rows, {fmt})
      : `<p class="kwnone">${rows.map(r => `${esc(r.label)} ${fmt(r.value)}`).join(", ")}</p>`}
    <div class="chleg"><span><i style="background:var(--accent)"></i>올라온 것 ${ups.length}개</span>
      <span><i style="background:var(--warn)"></i>내려간 것 ${dns.length}개</span></div>`;
}

function KW_mvRender() {
  const cnt = d => d ? KW_MV.filter(m => m.dir === d).length : KW_MV.length;
  const dirs = [["", "전체"], ["up", "오른 것"], ["down", "내린 것"]];
  $("movers").innerHTML = `<div class="tools kwtools">
      <input type="search" value="${esc(KW_MQ)}" oninput="KW_mvFind(this.value)"
        placeholder="검색어로 찾기" aria-label="검색어 찾기">
      <div class="kwchips" role="group" aria-label="방향으로 거르기">${dirs.map(([v, l]) =>
        `<button type="button" class="chip${v === KW_MDIR ? " on" : ""}" data-v="${v}"
          aria-pressed="${v === KW_MDIR}" onclick="KW_mvDir('${v}')">${l} <b>${cnt(v)}</b></button>`
        ).join("")}</div>
      <span class="n" id="mvn"></span>
      <span class="sp"></span>
      <button class="go sm sec" onclick="KW_csvMv()"
        title="지금 걸러 놓은 목록 그대로 내려받습니다">CSV 내려받기</button>
    </div><div id="mv-list"></div>`;
  KW_mvList();
}

function KW_mvList() {
  const list = KW_mvFiltered();
  $("mvn").textContent = list.length === KW_MV.length
    ? `${KW_MV.length}개` : `${list.length}개 / 전체 ${KW_MV.length}개`;
  if (!list.length)
    return $("mv-list").innerHTML = `<div class="empty"><b>이 조건에 맞는 검색어가 없습니다</b>
      <p>움직인 검색어는 모두 ${KW_MV.length}개입니다.</p>
      <div class="acts"><button onclick="KW_mvReset()">전체 보기</button></div></div>`;
  const per = KW_PERIOD || "기간", hasScore = KW_hasScore(list);
  // "평균 순위"·"클릭"은 옆 위 표와 같은 이유로 ⓘ를 뗐다 — "Δ순위"(부호가 무슨
  // 뜻인지)와 "노출"(적으면 순위가 왜 흔들리는지)만 처음 보면 모를 내용이라 남긴다.
  $("mv-list").innerHTML = table([
    "검색어",
    ...(hasScore ? [KW_SCORE_TH] : []),
    ">평균 순위",
    ">Δ순위?직전 기록 대비 움직인 칸수입니다. 양수면 위로 올라온 것입니다",
    ">클릭",
    `>노출?${per} 합계 노출입니다. 노출이 적으면 순위도 크게 흔들립니다`],
    list.map(m => `<tr ${KW_rowAttr(m.query, "mv")}>${KW_qcell(m.query, hasScore)}
      <td class="num">${Number.isFinite(m.pos) ? m.pos.toFixed(1) : "—"}</td>
      <td class="num">${delta(m.dpos) || '<span class="muted">—</span>'}</td>
      <td class="num">${num(m.clk)} ${delta(m.dclk)}</td>
      <td class="num">${num(m.imp)}</td></tr>`), "", "cards");
}

/* ── 행 펼침 ────────────────────────────────────────────────────────
   두 표의 줄은 "몇 위인가"까지만 말한다. 그 다음 질문("그래서 어느 페이지를
   뭘 고치나")은 펼친 줄이 답한다 — 뼈대의 pageTable/pageFix/playList 를 그대로
   쓴다. 같은 패널을 화면마다 다시 만들면 언제 하나는 낡는다. */
// 눌러도 되는 줄임은 첫 칸의 셰브론(CSS ::before)과 손 커서가 말한다 — 표 위에
// "줄을 누르면 …" 한 줄을 따로 세우던 자리를 그 표식이 가져갔다.
const KW_rowAttr = (q, src) =>
  `data-kwq="${esc(q)}" data-kwsrc="${src}" tabindex="0" role="button" aria-expanded="false"
   title="누르면 이 검색어로 고칠 것이 펼쳐집니다"`;

/* 두 표의 앞 두 칸은 같은 것을 묻는다: 어느 검색어이고, 이걸 먼저 해야 하나.
   점수·막대·종류·근거는 전부 셸의 한 벌(oppScore/oppMeter/oppWhy)이다 — 접힌
   줄에서도 "왜"가 보여야 목록이 훑어진다. 기회가 없는 줄은 빈 칸으로 둔다:
   숫자가 없다는 말과 "아직 안 캤다"는 말은 펼친 패널이 한 번만 한다. */
// 열 이름은 그 칸에 든 값의 이름이다 — 「먼저」는 정렬 의도였지 값의 이름이 아니었다.
const KW_SCORE_TH = ">점수?기회 점수 100점 만점입니다. 높을수록 먼저 손댈 자리입니다."
  + " 빈 칸은 아직 기회 목록에 없는 검색어입니다";
function KW_qcell(q, showScore = true) {
  const o = oppOf(q);
  return `<td class="kwcell"><div class="kwl">${KW_av(q)}<div class="kwm"><span class="kwq">${esc(q)}</span>${
    o ? oppMeter(o) + oppWhy(o) : ""}</div></div></td>` +
    (showScore ? `<td class="num">${o ? oppScore(o) : '<span class="muted">—</span>'}</td>` : "");
}
// 점수 열은 보이는 줄 전부에 점수가 없으면 뺀다 — "—"만 줄줄이 선 열은 읽어도
// 뜻이 없다(정렬 th[data-s] 인덱스가 셀과 어긋나지 않게 헤더·행 양쪽에서 같이 뺀다).
const KW_hasScore = rows => rows.some(r => oppOf(r.query));
const KW_find = tr => (tr.dataset.kwsrc === "mv" ? KW_MV : KW_ROWS)
  .find(r => r.query === tr.dataset.kwq);
const KW_pos = p => Number.isFinite(p) ? String(+p.toFixed(1)) : "—";

// 지금 상태 한 줄 — 표에 이미 있는 숫자지만, 펼친 줄만 봐도 판단이 되게 되풀이한다.
function KW_state(r) {
  const p1 = RULES.page1 || 10;
  const gap = Number.isFinite(r.gap) ? r.gap : Math.max(0, (r.pos || 0) - p1);
  const bits = [`지금 ${KW_pos(r.pos)}위`,
    gap > 0 ? `1페이지까지 ${gap.toFixed(1)}칸` : "이미 1페이지 안",
    `노출 ${num(r.imp)}`, `클릭 ${num(r.clk)}`];
  if (Number.isFinite(r.dpos) && r.dpos !== 0) bits.push(`Δ순위 ${delta(r.dpos)}`);
  if (Number.isFinite(r.dclk) && r.dclk !== 0) bits.push(`Δ클릭 ${delta(r.dclk)}`);
  // Δ는 부호만으로는 안 읽힌다 — 무슨 뜻인지 문장으로 한 번 더 말한다.
  const mean = !Number.isFinite(r.dpos) || r.dpos === 0 ? ""
    : `. 직전 기록보다 ${Math.abs(r.dpos).toFixed(1)}칸 ` +
      `${r.dpos > 0 ? "올라왔습니다" : "내려갔습니다"}` +
      (Number.isFinite(r.dclk) && r.dclk !== 0
        ? `. 같은 기간 클릭은 ${num(Math.abs(r.dclk))} ` +
          `${r.dclk > 0 ? "늘었습니다" : "줄었습니다"}.` : ".");
  return bits.join(" · ") + mean;
}

// 할 일은 상황이 정한다 — 내린 검색어와 1페이지 목전 검색어는 손대는 자리가 다르다.
function KW_plan(r) {
  const q = r.query, p1 = RULES.page1 || 10, hi = RULES.striking_hi || 20;
  const down = r.dir === "down" || (Number.isFinite(r.dpos) && r.dpos < 0);
  const up = r.dir === "up" || (Number.isFinite(r.dpos) && r.dpos > 0);
  if (down) return [
    `"${q}" 검색어의 순위가 내려갔습니다. 새로 쓰기 전에 무엇이 달라졌는지부터 봅니다.`, [
    "아래 페이지를 마지막으로 언제 손댔는지 확인합니다. 최근 수정이 제목·H1·본문을 " +
      "건드렸다면 그 변경부터 되짚습니다.",
    "구글에서 이 검색어를 직접 검색해 지금 그 자리를 가져간 페이지를 열고, 목차(H2)를 " +
      "내 것과 나란히 놓고 저쪽에만 있는 항목을 적습니다.",
    "본문을 실제로 갱신합니다. 날짜만 고치지 말고 숫자·예시·화면을 지금 것으로 바꿉니다.",
    "이 페이지로 들어오던 내부 링크가 사라지지 않았는지 확인하고, 끊겼으면 되살립니다."],
    ["본문에 다시 채울 H2 목록. 지금 그 자리를 가져간 페이지에는 있고 내게 없는 것",
     "갱신할 숫자·예시 항목 목록", "다시 걸 내부 링크 위치와 앵커 텍스트"]];
  if (up) return [
    `"${q}" 검색어가 올라왔습니다. 새 글보다 이 페이지를 넓히는 쪽이 싸게 먹힙니다.`, [
    `"${q} 방법"·"${q} 가격"·"${q} 후기" 같은 하위 검색어를 H2로 덧붙여 같은 페이지를 넓힙니다.`,
    "이미 순위가 있는 다른 글에서 이 페이지로 내부 링크를 겁니다. 오른 자리를 굳히는 " +
      "가장 싼 수입니다.",
    "제목·설명에 이 검색어가 그대로 들어가 있는지 확인합니다."],
    ["같은 페이지를 넓힐 하위 H2 목록과 각 항목에서 답할 내용",
     "내부 링크를 걸 글과 앵커 텍스트"]];
  const band = r.band || (Number.isFinite(r.pos) && r.pos <= p1 ? "page1" : "page2");
  if (band === "page2") return [
    `"${q}" 검색어는 지금 1페이지 문턱(${p1 + 1}~${hi}위)입니다. 노출은 이미 나오는데 ` +
      "클릭이 안 되는 자리입니다. 새 글 한 편보다 이 페이지 한 장을 미는 게 빠릅니다.", [
    "title 과 H1 이 이 검색어가 묻는 것을 정면으로 말하게 고칩니다 — 본문이 다루는 말로, " +
      "검색어를 글자 그대로 박는 게 아니라.",
    `구글에서 "${q}" 1페이지를 열어 상위 페이지들이 공통으로 답하는 하위 질문을 ` +
      "추리고, 내 페이지에 빠진 것을 H2 로 채웁니다.",
    "이미 순위가 있는 내 글에서 이 페이지로 내부 링크를 겁니다. 앵커 텍스트에 " +
      "이 검색어를 씁니다.",
    "답을 표·번호 목록으로 정리합니다. 스니펫으로 뽑히면 순위 그대로도 클릭이 늡니다."],
    ["새 title 과 H1 문안. 검색 의도를 앞에 두고 — 안 바꾸는 게 답이면 그렇게 쓰고 이유",
     "본문에 추가할 H2 목록(상위 페이지가 공통으로 답하는데 내게 없는 것)",
     "스니펫을 노릴 표 또는 번호 목록 하나",
     "내부 링크를 걸 글과 앵커 텍스트"]];
  return [
    `"${q}" 검색어는 이미 1페이지(${KW_pos(r.pos)}위)입니다. 남은 문제는 순위가 아니라 ` +
      "클릭입니다.", [
    "제목·설명을 클릭 기준으로 다시 씁니다. 숫자·연도·결과를 넣어 옆 결과와 다르게 보이게 합니다.",
    "첫 문단에서 검색어의 질문에 바로 답합니다. 두세 줄 안에 답이 있어야 합니다.",
    "답을 표·번호 목록·Q&A 형태로 정리해 스니펫 자리를 노립니다."],
    ["새 title 3안과 meta description 2안. 클릭 기준으로",
     "첫 문단에 넣을 두세 줄 직답 문안",
     "스니펫을 노릴 표·목록·Q&A 블록 하나"]];
}

/* 기회가 있으면 셸의 패널이 더 넓다 — 할 일·고칠 URL·프롬프트가 kind 마다 갈린다
   (셸의 PLAY 한 벌). 그래서 있을 때는 그쪽을 쓰고, 없을 때만 아래 KW_plan 으로
   물러선다. 두 벌을 겹쳐 내면 같은 검색어에 서로 다른 할 일이 두 장 나온다.
   행동 기록(확인·완료·제외)은 패널 끝에 — 무엇을 할지 읽은 다음에 누르는 것이다. */
function KW_det(r, src) {
  // 같은 검색어가 두 표에 다 서면 펼침 본문도 두 벌이 된다 — 아래 표는 본문을 안 갖고
  // 위 표의 그 줄로 데려간다. 위에 그 줄이 없을 때만(예: 필터로 빠졌을 때) 직접 그린다.
  if (src === "mv" && KW_logRow(r.query))
    return `<div class="det"><p class="detn">이 검색어의 페이지와 할 일은
      위 [순위 상승 기회]에 있습니다.
      <button class="go sm sec" onclick="KW_jump(this)">그 줄 열기</button></p></div>`;
  const o = oppOf(r.query);
  if (o) return oppPanel(o, oppActs(o));
  const pages = KW_PAGES[r.query] || [];
  const url = pages.length ? pages[0].page : "";
  const [what, acts, deliver] = KW_plan(r);
  return `<div class="det">
    <p class="detw">${KW_state(r)}</p>
    ${pages.length ? pageTable(pages)
      : `<p class="detn">이 검색어로 어느 페이지가 노출됐는지는 아직 모릅니다.
         실적을 한 번 더 수집하면 페이지별로 채워집니다.</p>`}
    ${playList(what, acts)}
    ${url ? pageFix(KW_AUDITS[url], url) : ""}
    ${askBlock({shape: url ? "fix_page" : "new_content",
                url, audit: KW_AUDITS[url], acts, deliver, problem: what,
                queries: [{q: r.query, note: KW_state(r).replace(/<[^>]+>/g, "")}]})}
    ${KW_noOpp()}
  </div>`;
}
// 점수도 확인·완료 버튼도 없는 이유를 그 자리에서 말한다 — 빈 칸만 두면 고장으로 읽힌다.
// 단계 이름은 조립이 실어 보낸 정본(window.__STAGES__)에서 온다 — 글자로 옮겨 적으면
// 파이썬이 이름을 바꿀 때 이 문장만 낡는다.
const KW_stage = id => ((window.__STAGES__ || {})[id] || {}).t || id;
// 재실행 버튼 라벨도 같은 정본에서 온다(STAGE_LABELS 의 run).
const KW_run = id => window.stageRun ? stageRun(id)
  : ((window.__STAGES__ || {})[id] || {}).run || id;
const KW_noOpp = () => `<p class="detn">이 검색어는 아직 기회 목록에 없습니다.
  ${esc(KW_stage("gaps"))} 단계를 한 번 돌리면 점수가 붙습니다.</p>`;

function KW_toggle(tr) {
  const nx = tr.nextElementSibling;
  if (nx && nx.classList.contains("exp")) {
    nx.remove();
    return tr.setAttribute("aria-expanded", "false");
  }
  const r = KW_find(tr);
  if (!r) return;
  const row = document.createElement("tr");
  row.className = "exp";
  row.innerHTML = `<td class="expcell" colspan="${tr.cells.length}">${KW_det(r, tr.dataset.kwsrc)}</td>`;
  tr.after(row);
  tr.setAttribute("aria-expanded", "true");
}
function KW_closeAll() {
  ["log", "mv-list"].forEach(id => ($(id) || document.createElement("div"))
    .querySelectorAll("tr.exp").forEach(x => {
      const p = x.previousElementSibling;
      if (p) p.setAttribute("aria-expanded", "false");
      x.remove();
    }));
}

document.addEventListener("click", e => {
  const tr = e.target.closest && e.target.closest("tr[data-kwq]");
  if (tr) return KW_toggle(tr);
  // 그림에서 찍은 점과 할 일 사이가 두 번 클릭만큼 떨어져 있었다 — 레인을 누르면
  // 아래 표의 같은 줄이 펼쳐진다. 펼침 줄(tr.exp)에는 data-kwq 가 없으므로
  // data-lane 번호와 이 목록의 순서가 계속 맞는다.
  const g = e.target.closest && e.target.closest("g[data-lane]");
  if (!g) return;
  const row = $("log").querySelectorAll("tr[data-kwq]")[+g.dataset.lane];
  if (!row) return;
  KW_toggle(row);
  if (row.getAttribute("aria-expanded") === "true")
    row.scrollIntoView({block: "nearest"});
});
document.addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const tr = e.target.closest && e.target.closest("tr[data-kwq]");
  if (!tr) return;
  e.preventDefault();                     // Space 로 화면이 밀리지 않게
  KW_toggle(tr);
});
// 머리글 정렬(뼈대)은 tbody 행을 재배치한다 — 펼친 줄이 제 부모와 떨어지므로
// 그 정렬이 돌기 전(캡처 단계)에 먼저 접는다.
document.addEventListener("click", e => {
  if (e.target.closest && e.target.closest("th[data-s]")) KW_closeAll();
}, true);

// 빈 상태의 행동 — 배포에 맞는 것을 셸이 고른다(로컬은 명령 칩, 호스팅은 버튼).
// 바로 위 띠가 같은 단계를 주요 버튼으로 들고 있으므로 여기서는 보조 톤으로 물러난다
// (화면에 주요 버튼은 하나다).
const KW_cmd = (stage, label) => `<div class="acts">${KW_act(stage, label, false)}</div>`;

// ── 내보내기: 지금 걸러 놓은 목록 그대로. 파일로 만드는 일은 뼈대의 csv() 몫이다.
function KW_csvLog() {
  // 화면이 점수 순으로 서 있는데 파일에 점수가 없으면 순서가 이유 없는 것이 된다.
  csv("1페이지까지",
    [["검색어", "기회점수", "종류", "평균순위", "1페이지까지", "노출", "클릭", "구간"]].concat(
    KW_filtered().map(r => {
      const o = oppOf(r.query);
      return [r.query, o && o.score != null ? o.score : "", o ? (o.label || o.kind) : "", r.pos,
        Number.isFinite(r.gap) ? r.gap : Math.max(0, r.pos - RULES.page1),
        r.imp, r.clk, r.band === "page1" ? "1페이지" : "2페이지"];
    })));
}
function KW_csvMv() {
  csv("순위변동", [["검색어", "순위", "Δ순위", "클릭", "Δ클릭", "노출"]].concat(
    KW_mvFiltered().map(m => [m.query, Number.isFinite(m.pos) ? m.pos.toFixed(1) : "",
      m.dpos, m.clk, m.dclk, m.imp])));
}

// 「추적 중 N / 100」은 호스팅 애드온(kwLoad)이 .cnt 에 글자로 쓴다 — 그 글자에서 숫자를 읽어
// 진행 막대만 그린다. 글자를 여기서 다시 짓지 않는다(숫자의 정본은 서버 응답 한 벌).
function KW_wireTrack() {
  const box = document.getElementById("sm-kw");
  if (!box || box.dataset.kwProg) return;
  const cnt = box.querySelector(".cnt"), bar = box.querySelector(".kwprog");
  if (!cnt || !bar) return;
  box.dataset.kwProg = "1";
  const paint = () => {
    const m = /(\d+)\s*\/\s*(\d+)/.exec(cnt.textContent);
    const p = m && +m[2] ? Math.min(100, +m[1] / +m[2] * 100) : 0;
    bar.hidden = !m;
    bar.firstElementChild.style.width = p + "%";
    bar.classList.toggle("full", p >= 100);
    bar.setAttribute("aria-label", m ? `추적 ${m[1]}개, 한도 ${m[2]}개` : "");
  };
  new MutationObserver(paint).observe(cnt, {childList: true, characterData: true, subtree: true});
  paint();
}

VIEW("keywords", function (d) {
  KW_ROWS = d.striking || [];
  KW_PAGES = d.query_pages || {};
  KW_AUDITS = d.page_audits || {};
  KW_PERIOD = d.gsc_period ? `${d.gsc_period}일` : "";
  KW_BRAND_EMPTY = !!d.brand_catalog_empty;
  // 기본은 "먼저 할 순" — 다만 아직 아무것도 안 캤으면 전부 무점수라 그 이름이
  // 거짓이 된다. 그때만 예전 기본(노출 많은 순)으로 물러선다.
  KW_SORT = KW_ROWS.some(r => oppOf(r.query)) ? "opp" : "imp";
  KW_BAND = "";                                   // 사이트를 바꾸면 필터도 처음으로
  const p2 = d.striking_page2 ?? KW_ROWS.filter(r => r.band === "page2").length;
  $("kw-grid").classList.toggle("kw0", !KW_ROWS.length);
  KW_watchFig();
  // 범례는 그림 위에 선다 — 색이 무슨 뜻인지 모른 채로 그림을 먼저 읽게 두지 않는다.
  $("log-leg").innerHTML = `<span><i class="dot"></i>1페이지 안</span>
    <span><i class="dot w"></i>1페이지 문턱</span>
    <span><i class="bar"></i>1페이지까지 남은 거리</span>
    <span><i class="zone"></i>1페이지 영역(1~${RULES.page1}위)</span>`;
  /* 이 화면의 상태 판정은 **한 번만** 한다. 여태 화면 부제·눈썹·섹션 부제·띠가
     각자 판정해서, 부제는 "문턱에 걸린 검색어를 봅니다"라고 하고 띠는 "문턱에 걸린
     검색어가 없습니다"라고 하는 화면이 나왔다. 아래 세 값이 그 한 판정이다. */
  // 화면 부제는 상태를 말하지 않는다 — 어느 상태에서도 참인 "여기가 무엇을 보여주나".
  viewSub("keywords", "검색어를 기회 점수 순으로 놓고 무엇부터 손댈지 봅니다.");
  // 눈썹은 데이터에서 온다 — 상수(4~20)를 적어 두면 목록이 전부 1페이지 안일 때도
  // 「4~20위 구간」이라고 말해 내용과 반대가 된다. 결론은 넣지 않는다.
  // 이건 이 목록의 **최소~최대 평균 순위**다 — 「4~11위 구간」이라고 적으면 정해 둔
  // 구간(1페이지 문턱·순위 추적의 11~20위)처럼 읽혔다. 반올림해 넓히지 않고, 무엇의
  // 범위인지(평균 순위, 검색어 몇 개)를 같이 말한다.
  const poss = KW_ROWS.map(r => r.pos).filter(Number.isFinite);
  const lo = poss.length && KW_pos(Math.min(...poss));
  const hi = poss.length && KW_pos(Math.max(...poss));
  // 검색어가 하나뿐이거나 전부 같은 순위면 범위가 아니다 — 그때는 눈썹을 비운다.
  $("log-eb").textContent = poss.length && lo !== hi
    ? `평균 순위 ${lo}~${hi}위 검색어 ${poss.length}개` : "";
  // 제목은 상태를 따라간다 — 문턱(11~20위)에 하나도 안 걸렸으면 "순위 상승
  // 기회"라는 제목 자체가 띠의 "남은 문제는 순위가 아니라 클릭입니다"와
  // 부딪힌다(QA 8회차). 그때는 지금 이 표가 실제로 보여주는 것("1페이지 안
  // 검색어")으로 제목을 바꾼다.
  $("log-h2").textContent = KW_ROWS.length && !p2 ? "1페이지 안 검색어" : "순위 상승 기회";
  // 섹션 부제는 한 문장, 지금 상태만. 무엇을 하라는 말은 띠가 한다.
  // "1개가 전부 1페이지 안입니다"는 단수에 "전부"가 붙어 어색하다 — 한 개일
  // 때는 그 검색어를 그대로 가리키는 문장으로 가른다.
  $("log-sub").textContent = !KW_ROWS.length ? ""
    : p2 ? `${KW_ROWS.length}개 중 ${p2}개가 1페이지 문턱(${RULES.page1 + 1}~${RULES.striking_hi}위)입니다.`
    : KW_ROWS.length === 1 ? "이 검색어는 이미 1페이지 안입니다."
    : `${KW_ROWS.length}개 모두 1페이지 안입니다.`;
  if (!KW_ROWS.length) {
    // 빈 이유가 둘이다 — 아직 안 수집했다 / 수집했는데 이 구간에 걸린 게 없다.
    $("log-tools").innerHTML = "";
    $("log").innerHTML = "";
    $("log-fig").innerHTML = d.gsc_date
      ? `<div class="empty">
          <b>이번 수집에서 ${RULES.striking_lo}~${RULES.striking_hi}위에 걸린 검색어가 없습니다</b>
          <p>${esc(d.gsc_date)} 수집분 기준입니다.
            <span class="live">추적할 검색어를 더 캐면 여기부터 채워집니다.</span></p>
          ${KW_cmd("keywords")}</div>`
      : `<div class="empty"><b>실적을 아직 수집하지 않았습니다</b>
          <p><span class="live">수집하면 1페이지 문턱에 걸린 검색어부터
            채워집니다.</span></p>
          ${KW_cmd("gsc")}</div>`;
  } else {
    KW_tools();
    KW_drawLog();
  }

  // 다음 행동 띠 — 화면 하나에 하나. 상태(빈 화면·문턱 있음·전부 1페이지)마다 문장이
  // 갈리고, 그 문장이 가리키는 것을 그 자리에서 누를 수 있어야 한다.
  // 띠가 부르는 이름은 그 띠가 말한 묶음 안에서 고른다 — 문턱 이야기를 해 놓고
  // 1페이지 검색어 이름을 부르면 문장과 목록이 서로 다른 것을 가리킨다.
  // 이미 닫힌 기회(완료·제외·저절로 풀림)가 걸린 줄은 부르지 않는다 — 풀린 검색어를
  // 이 화면의 1순위로 세우면 끝난 일을 다시 하라는 말이 된다. 기회가 없는 줄은 남긴다.
  const shut = r => { const o = oppOf(r.query); return !!o && !window.oppStMatch(o, "open"); };
  const sorted = KW_ROWS.length ? KW_filtered().filter(r => !shut(r)) : [];
  const top = (p2 ? sorted.find(r => r.band === "page2") : null) || sorted[0] || null;
  KW_TOP = top ? top.query : "";
  KW_topCard(p2, top);
  KW_donutCard();
  /* 띠 문장은 [지금 상태] + [누르면 무엇이 되나] 두 토막이다. 뒤 토막은 누를 것이
     있어야 참이므로 .live 로 감싼다 — 박제본에는 서버가 없어 셸이 그 토막과 버튼을
     함께 떼고, 남는 앞 토막만으로 "지금 상태"가 읽힌다. */
  const live = s => `<span class="live">${s}</span>`;
  if (!KW_ROWS.length) {
    // 실적을 이미 읽었는데 이 구간이 비었으면 다시 읽어도 같다 — 그때는 추적할
    // 검색어를 더 캐는 쪽이 다음 걸음이다.
    // 띠는 행동 하나만 든다 — 다시 재는 손잡이는 화면 머리의 [이 묶음 다시 재기]다.
    KW_next(d.gsc_date
      ? "실적은 들어와 있는데 문턱 구간이 비었습니다. " +
        live("검색어를 더 캐면 여기부터 채워집니다.")
      : "실적을 아직 수집하지 않았습니다. " +
        live("수집하면 1페이지 문턱에 걸린 검색어부터 나옵니다."),
      KW_act(d.gsc_date ? "keywords" : "gsc"));
  } else if (!top) {
    KW_next("이 목록의 검색어는 모두 처리했습니다. " +
      live("다음 수집에서 새로 걸린 검색어가 여기 섭니다."));
  } else {
    // 검색어 이름은 <b> 한 벌이다 — 따옴표로 감싸면 화면마다 강조가 달라진다.
    // "무엇부터 할지"는 [개요] 한 곳이 말한다 — 여기는 이 화면의 1순위만 짚는다.
    const lead = `<b>${esc(top.query)}</b>`;
    KW_next(p2
      ? `1페이지 문턱에 ${p2}개가 있습니다. 이 화면의 1순위는 ${lead}입니다.`
      : `문턱에 걸린 검색어가 없어 남은 문제는 순위가 아니라 클릭입니다. ` +
        `이 화면의 1순위는 ${lead}입니다.`,
      `<button class="go" onclick="KW_openTop()">검색어 열기</button>`);
  }

  // 비교 짝은 서버가 고른다 — 같은 기간(period_days)끼리만. 28일치와 90일치를 빼면
  // Δ가 전부 거짓이라, 짝을 못 찾으면 비교를 접고 그 이유를 여기에 적는다.
  KW_MV = (d.ups || []).map(m => ({...m, dir: "up"}))
    .concat((d.downs || []).map(m => ({...m, dir: "down"})));
  KW_MQ = ""; KW_MDIR = "";
  // 비교 기간(날짜 둘)은 눈썹에, 이 표로 할 일은 부제에. 한 문장에 섞으면 둘 다 안 읽힌다.
  const nUp = (d.ups || []).length, nDown = (d.downs || []).length;
  $("mv-eb").textContent = d.gsc_prev ? `${d.gsc_prev} → ${d.gsc_date}` : "";
  $("mv-sub").textContent = KW_MV.length
    ? `${d.gsc_period}일치끼리 견줘 오른 것 ${nUp}개, 내린 것 ${nDown}개입니다.`
    : d.period_mismatch
    ? `직전 기록과 기간이 달라 견주지 않았습니다.`
    : d.gsc_prev
    ? `직전 기록과 견줘 움직인 검색어가 없습니다.`
    : `실적을 두 번 이상 수집하면 채워집니다.`;
  KW_kpis(d, p2);
  KW_mvDiv();
  KW_wireTrack();
  if (KW_MV.length) return KW_mvRender();
  $("movers").innerHTML = d.period_mismatch
    ? `<div class="empty"><b>기간이 달라 견주지 않았습니다</b>
        <p>지금은 ${d.gsc_period}일치입니다. <span class="live">같은 기간으로 한 번 더
          수집하면 검색어마다 Δ순위가 붙습니다.</span></p>
        ${KW_cmd("gsc", KW_run("gsc"))}</div>`
    : d.gsc_prev
    ? `<div class="empty ok"><b>움직인 검색어가 없습니다</b>
        <p>직전 기록과 견줬고, 변동이 전부 노이즈 범위 안입니다.</p></div>`
    : `<div class="empty"><b>견줄 직전 기록이 없습니다</b>
        <p><span class="live">한 번 더 수집하면 그때부터 오른 검색어와 내린 검색어가
          갈립니다.</span></p>
        ${KW_cmd("gsc", KW_run("gsc"))}</div>`;
});
</script>
