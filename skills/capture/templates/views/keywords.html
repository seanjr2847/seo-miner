<!-- 이 화면이 무엇인지는 화면 자신이 말한다 — 담는 요소·채우는 단계까지.
     dashboard.py 가 이 선언들을 모아 window.__VIEWS__ 로 방출한다. -->
<script type="application/json" class="view-def">
{"id": "keywords", "title": "키워드",
 "sections": ["log", "movers"], "stages": ["gsc", "gaps"]}
</script>

<style>
/* ── 깊이 로그(시그니처) ─────────────────────────────────── */
.log .lane:hover .lane-bg { fill:var(--bar); }
/* 레인을 누르면 아래 표의 그 줄이 펼쳐진다 — 그림에서 찍은 점과 할 일이 이어진다.
   칠하지 않은 배경 사각형(fill:none)은 기본값으로 포인터를 안 받으므로 여기서 연다. */
.log .lane { cursor:pointer; }
.log .lane-bg { pointer-events:all; }
.log .kw { font-size:12.5px; fill:var(--ink); }
.log .num { font-size:11.5px; fill:var(--slate); }
.log .track { stroke:var(--rule-soft); }
.log .dist { stroke-linecap:round; }
/* 눈금선 — 축 숫자만 있으면 15줄 아래에서 그 점이 몇 위인지 못 읽는다.
   일별 추이(overview)의 .grid 와 같은 점선 언어를 세로로 쓴다. */
.log .vgrid { stroke:var(--rule-soft); stroke-dasharray:2 4; }
@media (prefers-reduced-motion: no-preference) {
  .log .grow { animation:grow .5s cubic-bezier(.2,.7,.3,1) both; }
}
/* 표는 그림의 각주가 아니라 이 화면의 할 일 목록이다 — 점수·근거·행동이 줄마다
   붙으면서 여기가 답이 됐다. 그래서 접지 않는다(펼침은 depthLog 이 open 으로 낸다). */
.kwtable { margin-top:14px; }
.kwtable summary { font:500 12.5px/1 var(--sans); color:var(--slate); cursor:pointer; }
.kwtable summary:hover { color:var(--patina); }
.kwtable table { margin-top:12px; }
/* 표의 줄은 그 자체로 답이 아니다 — 눌러야 "어느 페이지를 뭘 고치나"가 나온다.
   눌러도 되는 줄임을 커서와 첫 칸의 표식으로 말한다(색만으로 말하지 않는다). */
tr[data-kwq] { cursor:pointer; }
tr[data-kwq] .kwcell::before { content:"▸ "; color:var(--slate); }
tr[data-kwq][aria-expanded="true"] .kwcell::before { content:"▾ "; color:var(--patina); }
tr[data-kwq]:hover > td { background:var(--bar); }
tr[data-kwq]:focus { outline:none; }
tr[data-kwq]:focus-visible > td { background:var(--bar); }
tr[data-kwq]:focus-visible > td:first-child { box-shadow:inset 2px 0 var(--patina); }
</style>

<section>
  <!-- 호스팅판 문구는 data-web 으로 나란히 선다 — applyWording() 이 한 번 갈아 끼운다.
       지금 무엇으로 정렬 중인지는 아래 도구줄의 정렬 칸이 말한다. -->
  <div class="eyebrow" data-web="11~20위 구간">4~20위 구간</div>
  <h2 data-web="순위 상승 기회">1페이지까지 남은 거리</h2>
  <p class="sub" id="log-sub"></p>
  <div id="log-tools"></div>
  <div id="log"></div>
</section>

<section>
  <div class="eyebrow">지난번 대비</div>
  <h2 data-web="순위 변동">움직인 검색어</h2>
  <p class="sub" id="mv-sub"></p>
  <div id="movers"></div>
</section>

<script>
"use strict";
/* 이 파일의 전역은 전부 KW_ — 조립하면 형제 화면들과 한 문서가 된다. */
let KW_ROWS = [], KW_SORT = "imp", KW_BAND = "", KW_PERIOD = "", KW_BRAND_EMPTY = false;
let KW_MV = [], KW_MQ = "", KW_MDIR = "";
let KW_PAGES = {}, KW_AUDITS = {};      // 검색어 → 걸린 내 페이지들, url → 점검 결과
/* 첫째가 기본값이다 — 노출이 많은 순은 "큰 것"을 말할 뿐 "먼저 할 것"을 못 말한다.
   순서는 셸의 기회 점수(scoring.WEIGHTS)가 정한다 — 이 화면이 다시 매기지 않는다. */
const KW_SORTS = [["opp", "먼저 할 순"], ["imp", "노출 많은 순"],
                  ["pos", "1페이지에 가까운 순"], ["clk", "클릭 많은 순"]];
// 오름차순으로 세우므로 점수는 음수로 뒤집는다. 기회가 없는 행은 1 로 두어 뒤로 민다.
const KW_score = q => { const o = oppOf(q); return Number.isFinite(o && o.score) ? -o.score : 1; };

/* ── 깊이 로그: 순위 축(1위 왼쪽 → 20위 오른쪽), 10위가 1페이지 경계.
      막대는 "1페이지까지 밀어야 하는 거리" — 이 섹션이 파는 바로 그 값. ── */
function depthLog(rows, brandCatalogEmpty, period) {
  // 폭은 WIDTH 다 — W 는 뼈대의 문구 고르개(W(로컬, 웹))라 여기서 가리면 안 된다.
  const WIDTH = 1000, LANE = 30, PAD_T = 44;
  // 줄이 길어지면 위쪽 눈금이 화면 밖으로 나간다 — 아래에도 같은 눈금을 깐다.
  const botAxis = rows.length >= 8, PAD_B = botAxis ? 26 : 10;
  const L = 330, R = WIDTH - 74, EDGE = RULES.striking_hi;  // 라벨은 축 바로 왼쪽에 붙인다
  const H = PAD_T + rows.length * LANE + PAD_B;
  const x = p => L + Math.min(p, EDGE) / EDGE * (R - L);
  const x10 = x(RULES.page1);
  const ticks = [1, 5, RULES.page1, 15, EDGE];
  const top = PAD_T - 8, bot = PAD_T + rows.length * LANE + 4;
  const gap1 = r => Number.isFinite(r.gap) ? r.gap : Math.max(0, r.pos - RULES.page1);

  const lanes = rows.map((r, i) => {
    const y = PAD_T + i * LANE + LANE / 2;
    const px = x(r.pos), onPage1 = r.band ? r.band === "page1" : r.pos <= (RULES.page1 || 10);
    const c = onPage1 ? "var(--patina)" : "var(--copper)";
    const x1 = Math.min(px, x10), x2 = Math.max(px, x10);
    // 2페이지 검색어는 1페이지 경계까지 되밀어야 할 거리를 막대로 — 이 화면이 파는 값.
    const dist = onPage1 ? "" :
      `<rect class="grow" x="${x1}" y="${y - 4}" width="${x2 - x1}" height="8" rx="4"
             fill="var(--copper)" opacity=".38" style="transform-origin:${x2}px 0;
             animation-delay:${i * 16}ms"/>`;
    // 거리는 서버가 계산해 준다(scoring.gap_to_page1).
    const gap = onPage1 ? "이미 1페이지"
      : `1페이지까지 ${gap1(r).toFixed(1)}칸`;
    // data-lane 은 아래 표의 몇 번째 줄인가다 — 검색어 문자열로 되짚지 않는다(따옴표·
    // 대소문자에서 어긋난다). 표는 같은 rows 를 같은 순서로 그리므로 번호가 정본이다.
    return `<g class="lane" data-lane="${i}">
      <rect class="lane-bg" x="0" y="${y - LANE / 2}" width="${WIDTH}" height="${LANE}" fill="none"/>
      <text class="kw" x="${L - 18}" y="${y + 4}" text-anchor="end">${esc(r.query.length > 36
        ? r.query.slice(0, 35) + "…" : r.query)}</text>
      <line class="track" x1="${L}" y1="${y}" x2="${R}" y2="${y}" stroke-width="1"/>
      ${dist}
      <circle cx="${px}" cy="${y}" r="4.5" fill="${c}"/>
      <text class="num" x="${px + (onPage1 ? 0 : 10)}" y="${y - 9}"
            text-anchor="${onPage1 ? "middle" : "start"}">${r.pos}</text>
      <text class="num" x="${WIDTH}" y="${y + 4}" text-anchor="end">${num(r.imp)}</text>
      <title>${esc(r.query)} — ${r.pos}위, 노출 ${num(r.imp)}, 클릭 ${num(r.clk)} (${gap})</title>
    </g>`;
  }).join("");

  // 경계선은 따로 그리므로 눈금선에서는 뺀다 — 같은 자리에 선이 둘 겹친다.
  const grid = ticks.filter(t => t !== RULES.page1).map(t =>
    `<line class="vgrid" x1="${x(t)}" y1="${top}" x2="${x(t)}" y2="${bot}"
           stroke-width="1"/>`).join("");
  // 마지막 눈금은 축 끝(R)에 서므로 가운데 정렬이면 오른쪽 노출 라벨과 겹친다 —
  // 그 하나만 축 안쪽으로 붙인다.
  const tick = y => ticks.map((t, i) => `<text class="axis" x="${x(t)}" y="${y}"
      text-anchor="${i === ticks.length - 1 ? "end" : "middle"}"
      >${t}${t === EDGE ? "위+" : ""}</text>`).join("");

  const p1 = rows.filter(r => (r.band || (r.pos <= RULES.page1 ? "page1" : "page2")) === "page1")
    .length;
  const impLabel = period ? `${period} 노출` : "노출";
  const warn = brandCatalogEmpty
    ? `\n  <div class="legend">${W(
        `남의 브랜드 필터가 비어 있습니다 — ${window.go("settings")}의 도구 이름을 채우면 이 목록이 정확해집니다.`,
        "경쟁사 브랜드 필터가 비어 있어 타사 브랜드 검색어가 섞일 수 있습니다.")}</div>`
    : "";
  // 그림이 답 못 하는 것(정확한 값·키보드·낭독기)은 같은 데이터를 표로 낸다.
  // 여기가 이 화면의 할 일 목록이다 — 줄마다 점수·왜·펼치면 무엇을 고칠지가 붙는다.
  const tbl = table([
    "검색어",
    KW_SCORE_TH,
    `>순위?구글이 보고한 ${period || "기간"} 평균 게재순위`,
    `>1페이지까지?${RULES.page1}위 경계까지 되밀어야 할 칸 수 — 이미 1페이지면 —`,
    `>${impLabel}?기간 합계 노출 — 순위를 밀면 클릭으로 바뀔 몫`,
    ">클릭?기간 합계 클릭"],
    rows.map(r => `<tr ${KW_rowAttr(r.query, "log")}>${KW_qcell(r.query)}
      <td class="num">${r.pos}</td>
      <td class="num">${gap1(r) > 0 ? gap1(r).toFixed(1) : '<span class="muted">—</span>'}</td>
      <td class="num">${num(r.imp)}</td>
      <td class="num">${num(r.clk)}</td></tr>`));

  return `<div class="logwrap"><svg class="log" viewBox="0 0 ${WIDTH} ${H}" role="img"
      aria-label="검색어 ${rows.length}개의 평균 순위와 1페이지까지 남은 거리 — 1페이지 안 ${p1}개, 2페이지 ${rows.length - p1}개">
    <rect x="${L}" y="${top}" width="${x10 - L}" height="${bot - top}" fill="var(--wash)"/>
    ${grid}
    <line x1="${x10}" y1="${top - 6}" x2="${x10}" y2="${bot}"
          stroke="var(--patina)" stroke-width="1"/>
    <text class="axis" x="${L}" y="${PAD_T - 26}">평균 게재순위 →</text>
    <text class="axis" x="${x10 - 6}" y="${PAD_T - 26}" text-anchor="end"
          fill="var(--patina)">1페이지 경계</text>
    ${tick(PAD_T - 14)}
    <text class="axis" x="${WIDTH}" y="${PAD_T - 14}" text-anchor="end">${esc(impLabel)}</text>
    ${lanes}
    ${botAxis ? tick(H - 7) : ""}
  </svg></div>
  <div class="legend">
    <b style="color:var(--patina)">●</b> 점 = 지금 평균 순위 ·
    <b style="color:var(--copper)">▬</b> 막대 = 1페이지까지 밀 거리 ·
    오른쪽 숫자 = ${esc(impLabel)}<br>
    <b style="color:var(--patina)">1페이지 안 ${p1}개</b> ·
    <b style="color:var(--copper)">2페이지 ${rows.length - p1}개</b> — ${
      W("막대만큼 밀면 1페이지입니다", "막대만큼 올리면 1페이지입니다")}
  </div>${warn}
  <details class="kwtable" open><summary>줄을 누르면 그 검색어로 무엇을 고칠지 나옵니다
    (${rows.length}개)</summary>${tbl}</details>`;
}

// 거르기·정렬은 화면에서 한다 — 서버가 준 15개가 이 화면이 가진 전부다.
function KW_filtered() {
  const rows = KW_BAND ? KW_ROWS.filter(r => r.band === KW_BAND) : KW_ROWS.slice();
  const key = {opp: r => KW_score(r.query), imp: r => -(r.imp || 0),
               pos: r => r.pos, clk: r => -(r.clk || 0)}[KW_SORT];
  return rows.sort((a, b) => key(a) - key(b));
}
function KW_setSort(v) { KW_SORT = v; KW_drawLog(); }
function KW_setBand(v) { KW_BAND = v; KW_drawLog(); }
function KW_reset() { KW_BAND = ""; KW_tools(); KW_drawLog(); }

// 도구줄은 데이터가 바뀔 때만 그린다 — 거르기는 아래 그림만 다시 그린다(KW_drawLog).
function KW_tools() {
  const cnt = b => b ? KW_ROWS.filter(r => r.band === b).length : KW_ROWS.length;
  const bands = [["", "전체"],
    ["page2", `2페이지 ${RULES.page1 + 1}~${RULES.striking_hi}위`],
    ["page1", `1페이지 안 ${RULES.striking_lo}~${RULES.page1}위`]];
  $("log-tools").innerHTML = `<div class="tools">
    <select onchange="KW_setSort(this.value)" aria-label="정렬 기준">${KW_SORTS.map(
      ([v, l]) => `<option value="${v}"${v === KW_SORT ? " selected" : ""}>${l}</option>`
      ).join("")}</select>
    <select onchange="KW_setBand(this.value)" aria-label="구간으로 거르기">${bands.map(
      ([v, l]) => `<option value="${v}"${v === KW_BAND ? " selected" : ""}>${l} ` +
        `(${cnt(v)})</option>`).join("")}</select>
    <span class="n" id="logn"></span>
    <span class="sp"></span>
    <button class="go sec" onclick="KW_csvLog()"
      title="지금 걸러 놓은 목록 그대로 내려받습니다">CSV 내보내기</button>
  </div>`;
}

function KW_drawLog() {
  const rows = KW_filtered();
  $("logn").textContent = rows.length === KW_ROWS.length
    ? `${rows.length}개` : `${rows.length}개 / 전체 ${KW_ROWS.length}개`;
  $("log").innerHTML = rows.length
    ? depthLog(rows, KW_BRAND_EMPTY, KW_PERIOD)
    : `<div class="empty">거른 구간에 걸린 검색어가 없습니다.
        <div class="acts"><button onclick="KW_reset()">필터 지우기</button></div></div>`;
}

// ── 움직인 검색어 ────────────────────────────────────────────
function KW_mvFiltered() {
  const q = KW_MQ.trim().toLowerCase();
  return KW_MV.filter(m => (!KW_MDIR || m.dir === KW_MDIR) &&
    (!q || m.query.toLowerCase().includes(q)));
}
function KW_mvFind(v) { KW_MQ = v; KW_mvList(); }
function KW_mvDir(v) { KW_MDIR = v; KW_mvList(); }
function KW_mvReset() { KW_MQ = ""; KW_MDIR = ""; KW_mvRender(); }

function KW_mvRender() {
  const cnt = d => d ? KW_MV.filter(m => m.dir === d).length : KW_MV.length;
  const dirs = [["", "전체"], ["up", "오른 것"], ["down", "내린 것"]];
  $("movers").innerHTML = `<div class="tools">
      <input type="search" value="${esc(KW_MQ)}" oninput="KW_mvFind(this.value)"
        placeholder="검색어로 찾기" aria-label="검색어 찾기">
      <select onchange="KW_mvDir(this.value)" aria-label="방향으로 거르기">${dirs.map(
        ([v, l]) => `<option value="${v}"${v === KW_MDIR ? " selected" : ""}>${l} ` +
          `(${cnt(v)})</option>`).join("")}</select>
      <span class="n" id="mvn"></span>
      <span class="sp"></span>
      <button class="go sec" onclick="KW_csvMv()"
        title="지금 걸러 놓은 목록 그대로 내려받습니다">CSV 내보내기</button>
    </div><div id="mv-list"></div>`;
  KW_mvList();
}

function KW_mvList() {
  const list = KW_mvFiltered();
  $("mvn").textContent = list.length === KW_MV.length
    ? `${KW_MV.length}개` : `${list.length}개 / 전체 ${KW_MV.length}개`;
  if (!list.length)
    return $("mv-list").innerHTML = `<div class="empty">거른 조건에 맞는 검색어가 없습니다.
      <div class="acts"><button onclick="KW_mvReset()">필터 지우기</button></div></div>`;
  const per = KW_PERIOD || "기간";
  $("mv-list").innerHTML = table([
    "검색어",
    KW_SCORE_TH,
    `>순위?구글이 보고한 ${per} 평균 게재순위`,
    ">Δ순위?직전 기록 대비 — 양수면 위로 올라온 것입니다",
    `>클릭?${per} 합계 클릭 · 옆 숫자는 직전 기록 대비 증감`,
    `>노출?${per} 합계 노출 — 노출이 적으면 순위도 크게 흔들립니다`],
    list.map(m => `<tr ${KW_rowAttr(m.query, "mv")}>${KW_qcell(m.query)}
      <td class="num">${Number.isFinite(m.pos) ? m.pos.toFixed(1) : "—"}</td>
      <td class="num">${delta(m.dpos) || '<span class="muted">—</span>'}</td>
      <td class="num">${num(m.clk)} ${delta(m.dclk)}</td>
      <td class="num">${num(m.imp)}</td></tr>`));
}

/* ── 행 펼침 ────────────────────────────────────────────────────────
   두 표의 줄은 "몇 위인가"까지만 말한다. 그 다음 질문("그래서 어느 페이지를
   뭘 고치나")은 펼친 줄이 답한다 — 뼈대의 pageTable/pageFix/playList 를 그대로
   쓴다. 같은 패널을 화면마다 다시 만들면 언제 하나는 낡는다. */
const KW_rowAttr = (q, src) =>
  `data-kwq="${esc(q)}" data-kwsrc="${src}" tabindex="0" role="button" aria-expanded="false"`;

/* 두 표의 앞 두 칸은 같은 것을 묻는다: 어느 검색어이고, 이걸 먼저 해야 하나.
   점수·막대·종류·근거는 전부 셸의 한 벌(oppScore/oppMeter/oppWhy)이다 — 접힌
   줄에서도 "왜"가 보여야 목록이 훑어진다. 기회가 없는 줄은 빈 칸으로 둔다:
   숫자가 없다는 말과 "아직 안 캤다"는 말은 펼친 패널이 한 번만 한다. */
const KW_SCORE_TH = ">먼저?기회 점수 100점 만점 — 높을수록 먼저 합니다."
  + " 빈 칸은 아직 기회 목록에 없는 검색어입니다";
function KW_qcell(q) {
  const o = oppOf(q);
  return `<td class="kwcell">${esc(q)}${o ? oppMeter(o) + oppWhy(o) : ""}</td>
    <td class="num">${o ? oppScore(o) : '<span class="muted">—</span>'}</td>`;
}
const KW_find = tr => (tr.dataset.kwsrc === "mv" ? KW_MV : KW_ROWS)
  .find(r => r.query === tr.dataset.kwq);
const KW_pos = p => Number.isFinite(p) ? String(+p.toFixed(1)) : "—";

// 지금 상태 한 줄 — 표에 이미 있는 숫자지만, 펼친 줄만 봐도 판단이 되게 되풀이한다.
function KW_state(r) {
  const p1 = RULES.page1 || 10;
  const gap = Number.isFinite(r.gap) ? r.gap : Math.max(0, (r.pos || 0) - p1);
  const bits = [`지금 ${KW_pos(r.pos)}위`,
    gap > 0 ? `1페이지까지 ${gap.toFixed(1)}칸` : "이미 1페이지 안",
    `노출 ${num(r.imp)}`, `클릭 ${num(r.clk)}`];
  if (Number.isFinite(r.dpos) && r.dpos !== 0) bits.push(`Δ순위 ${delta(r.dpos)}`);
  if (Number.isFinite(r.dclk) && r.dclk !== 0) bits.push(`Δ클릭 ${delta(r.dclk)}`);
  // Δ는 부호만으로는 안 읽힌다 — 무슨 뜻인지 문장으로 한 번 더 말한다.
  const mean = !Number.isFinite(r.dpos) || r.dpos === 0 ? ""
    : ` — 직전 기록보다 ${Math.abs(r.dpos).toFixed(1)}칸 ` +
      `${r.dpos > 0 ? "올라왔습니다" : "내려갔습니다"}` +
      (Number.isFinite(r.dclk) && r.dclk !== 0
        ? `. 같은 기간 클릭은 ${num(Math.abs(r.dclk))} ` +
          `${r.dclk > 0 ? "늘었습니다" : "줄었습니다"}` : "");
  return bits.join(" · ") + mean;
}

// 할 일은 상황이 정한다 — 내린 검색어와 1페이지 목전 검색어는 손대는 자리가 다르다.
function KW_plan(r) {
  const q = r.query, p1 = RULES.page1 || 10, hi = RULES.striking_hi || 20;
  const down = r.dir === "down" || (Number.isFinite(r.dpos) && r.dpos < 0);
  const up = r.dir === "up" || (Number.isFinite(r.dpos) && r.dpos > 0);
  if (down) return [
    `"${q}" — 순위가 내려갔습니다. 새로 쓰기 전에 무엇이 달라졌는지부터 봅니다.`, [
    "아래 페이지를 마지막으로 언제 손댔는지 확인합니다 — 최근 수정이 제목·H1·본문을 " +
      "건드렸다면 그 변경부터 되짚습니다.",
    "구글에서 이 검색어를 직접 검색해 지금 그 자리를 가져간 페이지를 열고, 목차(H2)를 " +
      "내 것과 나란히 놓고 저쪽에만 있는 항목을 적습니다.",
    "본문을 실제로 갱신합니다 — 날짜만 고치는 것 말고 숫자·예시·화면을 지금 것으로 바꿉니다.",
    "이 페이지로 들어오던 내부 링크가 사라지지 않았는지 확인하고, 끊겼으면 되살립니다."],
    ["본문에 다시 채울 H2 목록 — 지금 그 자리를 가져간 페이지에는 있고 내게 없는 것",
     "갱신할 숫자·예시 항목 목록", "다시 걸 내부 링크 위치와 앵커 텍스트"]];
  if (up) return [
    `"${q}" — 순위가 올라왔습니다. 새 글보다 이 페이지를 넓히는 쪽이 싸게 먹힙니다.`, [
    `"${q} 방법"·"${q} 가격"·"${q} 후기" 같은 하위 검색어를 H2로 덧붙여 같은 페이지를 넓힙니다.`,
    "이미 순위가 있는 다른 글에서 이 페이지로 내부 링크를 겁니다 — 오른 자리를 굳히는 " +
      "가장 싼 수입니다.",
    "제목·설명에 이 검색어가 그대로 들어가 있는지 확인합니다."],
    ["같은 페이지를 넓힐 하위 H2 목록과 각 항목에서 답할 내용",
     "내부 링크를 걸 글과 앵커 텍스트"]];
  const band = r.band || (Number.isFinite(r.pos) && r.pos <= p1 ? "page1" : "page2");
  if (band === "page2") return [
    `"${q}" — 지금 ${p1 + 1}~${hi}위 구간입니다. 노출은 이미 나오는데 클릭이 안 되는 ` +
      "자리라, 새 글 한 편보다 이 페이지 한 장을 미는 게 빠릅니다.", [
    "title 과 H1 에 검색어를 그대로 넣습니다 — 비슷한 말로 돌려 쓰지 않습니다.",
    `구글에서 "${q}" 1페이지를 열어 상위 페이지들이 공통으로 답하는 하위 질문을 ` +
      "추리고, 내 페이지에 빠진 것을 H2 로 채웁니다.",
    "이미 순위가 있는 내 글에서 이 페이지로 내부 링크를 겁니다 — 앵커 텍스트에 " +
      "이 검색어를 씁니다.",
    "답을 표·번호 목록으로 정리합니다 — 스니펫으로 뽑히면 순위 그대로도 클릭이 늡니다."],
    ["새 title 과 H1 문안 — 검색어를 그대로 넣어서",
     "본문에 추가할 H2 목록(상위 페이지가 공통으로 답하는데 내게 없는 것)",
     "스니펫을 노릴 표 또는 번호 목록 하나",
     "내부 링크를 걸 글과 앵커 텍스트"]];
  return [
    `"${q}" — 이미 1페이지(${KW_pos(r.pos)}위)입니다. 순위보다 "눌리는가"가 남은 문제입니다.`, [
    "제목·설명을 클릭 기준으로 다시 씁니다 — 숫자·연도·결과를 넣어 옆 결과와 다르게 보이게 합니다.",
    "첫 문단에서 검색어의 질문에 바로 답합니다 — 두세 줄 안에 답이 있어야 합니다.",
    "답을 표·번호 목록·Q&A 형태로 정리해 스니펫 자리를 노립니다."],
    ["새 title 3안과 meta description 2안 — 클릭 기준으로",
     "첫 문단에 넣을 두세 줄 직답 문안",
     "스니펫을 노릴 표·목록·Q&A 블록 하나"]];
}

/* 기회가 있으면 셸의 패널이 더 넓다 — 할 일·고칠 URL·프롬프트가 kind 마다 갈린다
   (셸의 PLAY 한 벌). 그래서 있을 때는 그쪽을 쓰고, 없을 때만 아래 KW_plan 으로
   물러선다. 두 벌을 겹쳐 내면 같은 검색어에 서로 다른 할 일이 두 장 나온다.
   행동 기록(확인·완료·제외)은 패널 끝에 — 무엇을 할지 읽은 다음에 누르는 것이다. */
function KW_det(r) {
  const o = oppOf(r.query);
  if (o) {
    const acts = oppActs(o);
    return oppPanel(o) + (acts ? `<div class="det">${acts}</div>` : "");
  }
  const pages = KW_PAGES[r.query] || [];
  const url = pages.length ? pages[0].page : "";
  const [what, acts, deliver] = KW_plan(r);
  return `<div class="det">
    <p class="detw">${KW_state(r)}</p>
    ${pages.length ? pageTable(pages)
      : `<p class="detn">이 검색어로 어느 페이지가 걸렸는지는 아직 모릅니다 —
         구글 실적을 한 번 더 읽으면 페이지별로 채워집니다.</p>`}
    ${playList(what, acts)}
    ${url ? pageFix(KW_AUDITS[url], url) : ""}
    ${askBlock({url, audit: KW_AUDITS[url], acts, deliver, problem: what,
                queries: [{q: r.query, note: KW_state(r).replace(/<[^>]+>/g, "")}]})}
    ${KW_noOpp()}
  </div>`;
}
// 점수도 확인·완료 버튼도 없는 이유를 그 자리에서 말한다 — 빈 칸만 두면 고장으로 읽힌다.
// 명령은 로컬에만 있다(웹에는 칠 곳이 없어 버튼이 대신한다) — 문구는 W 가 가른다.
const KW_noOpp = () => `<p class="detn">이 검색어는 아직 기회 목록에 없습니다 — ${W(
  "<code>/capture gaps</code> 를 돌리면", "[전체 분석 실행]을 누르면")} 채워집니다.</p>`;

function KW_toggle(tr) {
  const nx = tr.nextElementSibling;
  if (nx && nx.classList.contains("exp")) {
    nx.remove();
    return tr.setAttribute("aria-expanded", "false");
  }
  const r = KW_find(tr);
  if (!r) return;
  const row = document.createElement("tr");
  row.className = "exp";
  row.innerHTML = `<td colspan="${tr.cells.length}">${KW_det(r)}</td>`;
  tr.after(row);
  tr.setAttribute("aria-expanded", "true");
}
function KW_closeAll() {
  ["log", "mv-list"].forEach(id => ($(id) || document.createElement("div"))
    .querySelectorAll("tr.exp").forEach(x => {
      const p = x.previousElementSibling;
      if (p) p.setAttribute("aria-expanded", "false");
      x.remove();
    }));
}

document.addEventListener("click", e => {
  const tr = e.target.closest && e.target.closest("tr[data-kwq]");
  if (tr) return KW_toggle(tr);
  // 그림에서 찍은 점과 할 일 사이가 두 번 클릭만큼 떨어져 있었다 — 레인을 누르면
  // 아래 표의 같은 줄이 펼쳐진다. 펼침 줄(tr.exp)에는 data-kwq 가 없으므로
  // data-lane 번호와 이 목록의 순서가 계속 맞는다.
  const g = e.target.closest && e.target.closest("g[data-lane]");
  if (!g) return;
  const row = $("log").querySelectorAll("tr[data-kwq]")[+g.dataset.lane];
  if (!row) return;
  KW_toggle(row);
  if (row.getAttribute("aria-expanded") === "true")
    row.scrollIntoView({block: "nearest"});
});
document.addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const tr = e.target.closest && e.target.closest("tr[data-kwq]");
  if (!tr) return;
  e.preventDefault();                     // Space 로 화면이 밀리지 않게
  KW_toggle(tr);
});
// 머리글 정렬(뼈대)은 tbody 행을 재배치한다 — 펼친 줄이 제 부모와 떨어지므로
// 그 정렬이 돌기 전(캡처 단계)에 먼저 접는다.
document.addEventListener("click", e => {
  if (e.target.closest && e.target.closest("th[data-s]")) KW_closeAll();
}, true);

// 빈 상태의 명령어 복사 칩 — 로컬 플러그인에만. 웹에는 명령을 칠 곳이 없다.
const KW_cmd = () => W(
  `<div><button class="cmd" onclick="copyCmd(this)">/capture gsc</button></div>`, "");

// ── 내보내기: 지금 걸러 놓은 목록 그대로. 파일로 만드는 일은 뼈대의 csv() 몫이다.
function KW_csvLog() {
  // 화면이 점수 순으로 서 있는데 파일에 점수가 없으면 순서가 이유 없는 것이 된다.
  csv("1페이지까지",
    [["검색어", "기회점수", "종류", "평균순위", "1페이지까지", "노출", "클릭", "구간"]].concat(
    KW_filtered().map(r => {
      const o = oppOf(r.query);
      return [r.query, o && o.score != null ? o.score : "", o ? (o.label || o.kind) : "", r.pos,
        Number.isFinite(r.gap) ? r.gap : Math.max(0, r.pos - RULES.page1),
        r.imp, r.clk, r.band === "page1" ? "1페이지" : "2페이지"];
    })));
}
function KW_csvMv() {
  csv("순위변동", [["검색어", "순위", "Δ순위", "클릭", "Δ클릭", "노출"]].concat(
    KW_mvFiltered().map(m => [m.query, Number.isFinite(m.pos) ? m.pos.toFixed(1) : "",
      m.dpos, m.clk, m.dclk, m.imp])));
}

VIEW("keywords", function (d) {
  KW_ROWS = d.striking || [];
  KW_PAGES = d.query_pages || {};
  KW_AUDITS = d.page_audits || {};
  KW_PERIOD = d.gsc_period ? `${d.gsc_period}일` : "";
  KW_BRAND_EMPTY = !!d.brand_catalog_empty;
  // 기본은 "먼저 할 순" — 다만 아직 아무것도 안 캤으면 전부 무점수라 그 이름이
  // 거짓이 된다. 그때만 예전 기본(노출 많은 순)으로 물러선다.
  KW_SORT = KW_ROWS.some(r => oppOf(r.query)) ? "opp" : "imp";
  KW_BAND = "";                                   // 사이트를 바꾸면 필터도 처음으로
  const p2 = d.striking_page2 ?? KW_ROWS.filter(r => r.band === "page2").length;
  $("log-sub").textContent = KW_ROWS.length
    ? W(`${KW_ROWS.length}개 중 ${p2}개가 2페이지에 있습니다. 노출은 이미 나오는 검색어라, ` +
        `순위만 밀면 클릭으로 바뀝니다.`,
        `${KW_ROWS.length}개 중 ${p2}개가 2페이지(${RULES.page1 + 1}위 이하)에 있습니다. ` +
        `이미 노출되는 검색어이므로 게재순위만 올리면 클릭으로 이어집니다.`)
    : "";
  if (!KW_ROWS.length) {
    // 빈 이유가 둘이다 — 아직 안 읽었다 / 읽었는데 이 구간에 걸린 게 없다.
    // 명령어 칩은 로컬에만 — 웹에는 명령을 칠 곳이 없다(버튼이 대신한다).
    $("log-tools").innerHTML = "";
    $("log").innerHTML = `<div class="empty">${d.gsc_date
      ? W(`${esc(d.gsc_date)} 실적까지 읽었지만 ${RULES.striking_lo}~${RULES.striking_hi}위 ` +
          `구간에 노출이 잡힌 검색어가 없습니다. 노출이 쌓이면 여기부터 채워집니다.`,
          "아직 순위 상승 기회로 잡힌 검색어가 없습니다 — 노출이 쌓이면 여기부터 채워집니다.")
      : W("구글 실적을 아직 안 읽었습니다 — 읽으면 여기가 채워집니다.",
          "검색 실적을 아직 수집하지 않았습니다 — [전체 분석 실행]을 누르면 채워집니다.")}
      ${KW_cmd()}</div>`;
  } else {
    KW_tools();
    KW_drawLog();
  }

  // 비교 짝은 서버가 고른다 — 같은 기간(period_days)끼리만. 28일치와 90일치를 빼면
  // Δ가 전부 거짓이라, 짝을 못 찾으면 비교를 접고 그 이유를 여기에 적는다.
  $("mv-sub").textContent = d.gsc_prev
    ? `${d.gsc_prev} → ${d.gsc_date} (${d.gsc_period}${W("일치끼리", "일 기준")})`
    : d.period_mismatch
    ? `직전 기록과 기간이 달라 비교하지 않았습니다 — 지금은 ${d.gsc_period}일치입니다. ` +
      `같은 기간으로 한 번 더 읽으면 채워집니다.`
    : "구글 실적을 두 번 이상 읽으면 채워집니다.";
  KW_MV = (d.ups || []).map(m => ({...m, dir: "up"}))
    .concat((d.downs || []).map(m => ({...m, dir: "down"})));
  KW_MQ = ""; KW_MDIR = "";
  if (KW_MV.length) return KW_mvRender();
  // (같은 기간으로 다시 읽으라는 안내는 바로 위 #mv-sub 가 이미 하고 있다.)
  $("movers").innerHTML = d.period_mismatch
    ? `<div class="empty">${W("기간이 다른 기록끼리는 비교하지 않습니다.",
        "기간이 다른 분석 결과는 비교하지 않습니다.")}</div>`
    : `<div class="empty">${d.gsc_prev
      ? W("직전 기록과 견줘 움직인 검색어가 없습니다 — 전부 노이즈 범위 안입니다.",
          "직전 분석과 견줘 게재순위가 움직인 검색어가 없습니다 — 전부 노이즈 범위입니다.")
      : W("비교할 직전 기록이 없습니다 — 한 번 더 읽으면 그때부터 변동이 잡힙니다.",
          "비교할 직전 분석이 없습니다 — [전체 분석 실행]을 한 번 더 누르면 " +
          "그때부터 변동이 잡힙니다.")}
      ${KW_cmd()}</div>`;
});
</script>
