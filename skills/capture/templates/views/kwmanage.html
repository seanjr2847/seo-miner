<!-- [키워드 관리] — 어떤 검색어의 순위를 잴지(추적)를 정하는 화면.

     2026-10-16 [순위 상승 기회]에서 떼어 냈다. 그 화면 맨 아래에 [추적할 검색어](sections/sm-kw.html)가
     붙어 있었는데, [순위 상승 기회]는 "1페이지까지 얼마나 남았나·무엇부터 밀까"를 읽는 화면이고
     추적 목록은 시장 탭·후보 고르기·시장 옮기기를 하는 **편집기**다 — 둘이 한 화면에 있으니
     편집기가 순위 변동 표 밑으로 밀려 스크롤 끝에서만 보였다.

     같은 날 메뉴 A안으로 이 화면에 모은 것: 편집기(sections/sm-kw.html)와 씨앗 키워드
     (sections/sm-seeds.html — [설정]의 사이트 프로필에서 옮김). 둘 다 **두 배포 공통**이다 — 예전엔
     편집기가 웹 전용이라 로컬에서는 이 화면이 "채팅에서 /capture keywords 를 치세요" 안내뿐이었다.
     그래서 이 화면은 자기 원본 섹션이 없다(섹션 둘이 맨 앞부터 붙는다).

     메뉴에서는 검색 성과 묶음 끝이다 — 묶음은 함께 다시 재는 단위라, 목록을 고친 뒤 머리의
     [이 묶음 다시 재기]가 곧 "바꾼 목록으로 다시 재기"다. 손볼 것이 생기면 [개요]가 끌어온다
     (sections/sm-kwnudge.html). 박제본에서는 뺀다(dashboard.html 의 SM.drop) — 바꿀 수 없는
     기록에 관리 화면을 남기지 않는다([설정]·[심사]와 같은 이유). -->
<script type="application/json" class="view-def">
{"id": "kwmanage", "group": "search", "title": "키워드 관리",
 "sub": "어떤 검색어의 순위를 잴지 정합니다.",
 "sections": [], "stages": ["keywords"]}
</script>

<style>
#view-kwmanage > section { margin-top:var(--gap); }
</style>

<script>
"use strict";
/* 이 파일의 전역은 전부 KM_ — 조립하면 형제 화면들과 한 문서가 된다. */

// 편집기(sm-kw.html 의 kwLoad)가 .cnt 에 서버 숫자를 data-n(추적 수)·data-limit(한도)로 싣는다 —
// 막대는 그 두 값만 읽는다. 화면에 찍힌 「추적 중 N / M개」 글자를 정규식으로 되읽지 않는다
// (문구를 바꾸거나 천 단위 쉼표를 넣어도 막대가 말없이 숨지 않게). 편집기가 목록을 못 읽어
// 상자가 .dead 가 되면 앞 사이트 숫자가 남아 있어도 막대를 숨긴다.
// [순위 상승 기회] 화면(keywords.html 의 KW_wireTrack)에서 이 화면으로 옮겨 왔다 — 막대는 편집기의 일부다.
function KM_wireTrack(box) {
  if (!box || box.dataset.kwProg) return;
  const cnt = box.querySelector(".cnt"), bar = box.querySelector(".kwprog");
  if (!cnt || !bar) return;
  box.dataset.kwProg = "1";
  const num = v => v !== undefined && v !== "" && Number.isFinite(+v);
  const paint = () => {
    const n = cnt.dataset.n, lim = cnt.dataset.limit;
    const ok = num(n) && num(lim) && !box.classList.contains("dead");
    const p = ok && +lim ? Math.min(100, +n / +lim * 100) : 0;
    bar.hidden = !ok;
    bar.firstElementChild.style.width = p + "%";
    bar.classList.toggle("full", p >= 100);
    bar.setAttribute("aria-label", ok ? `추적 ${+n}개, 한도 ${+lim}개` : "");
    bar.setAttribute("aria-valuenow", String(Math.round(p)));
  };
  new MutationObserver(paint).observe(cnt, {attributes: true, attributeFilter: ["data-n", "data-limit"]});
  new MutationObserver(paint).observe(box, {attributes: true, attributeFilter: ["class"]});
  paint();
}

VIEW("kwmanage", function () {
  // 박제본은 이 화면을 뺀다(SM.drop) — 그래서 편집기 상자가 없다면 박제본 탓이 아니라 조립이 빠진 것이다.
  // 말없이 빈 화면을 두지 않고 이유를 한 줄 말한다.
  const box = $("sm-kw");
  if (!box) {
    const v = $("view-kwmanage");
    if (v) v.insertAdjacentHTML("afterbegin", `<div class="empty err" data-render-err><b>추적 목록 편집기를 불러오지 못했습니다</b>
      <p>화면을 새로 고쳐 보세요. 계속 이러면 대시보드를 다시 만들어야 합니다.</p></div>`);
    return;
  }
  KM_wireTrack(box);
});
</script>
