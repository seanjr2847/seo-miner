<style>

   상태는 셸의 .badge 한 벌을 쓴다(여기서 배지를 또 만들지 않는다).
   이 화면의 질문은 "지금 다시 재야 할 종류가 무엇이고 지난 실행은 문제없었나"다 —
   그래서 히어로는 종류별 신선도 보드(경과 막대)이고, 나머지는 그 답을 받치는 카드다.

/* ── 신선도 보드(히어로): 막대 길이 = 마지막 실행 뒤 경과일, 세로 눈금 = 14일 ── */
#lastby .lb { display:grid; gap:var(--sp-4); --rr:0px; }

#lastby .row { display:grid; grid-template-columns:32px minmax(0,168px) minmax(48px,1fr) 136px var(--rr);

#runs .when .muted { font-family:var(--sans); font-variant-numeric:normal; }

#made .from { font:400 var(--fs-1)/1.6 var(--sans); color:var(--accent); margin-top:8px;

<script>
"use strict";
/* 조립하면 형제 화면들과 한 문서가 된다 — 이 파일의 전역은 전부 HS_ 로 시작한다. */

// runs.kind 는 이제 전부 단계 id 와 같은 말이다(run_all.STAGES 정본, db._migrate 가
// 옛 값 gap/analysis 를 competitors/gaps 로 옮겼다) — 라벨은 단계 용어표
// (window.__STAGES__ = stage.STAGE_LABELS, dashboard.py._assemble 이 세 변형
// local/hosted/frozen 전부에 싣는다) 하나만 따른다. SM_STAGE 가 아니라 __STAGES__ 를
// 직접 본다 — 별칭(SM_STAGE)은 두 벌이 되므로 걷어냈다.
// full 은 단계가 아니라 "전체 실행" 요약 kind 라 여기 사본으로 남긴다 — 안 그러면
// 같은 단계가 [안내]에서는 "검색 실적 수집", 여기서는 "서치콘솔"로 나와 같은
// 것인지 알 수 없는 사고가 다시 난다.
const HS_RUN_LABEL = {full:"전체"};
const HS_kind = k => ((window.__STAGES__ || {})[k] || {}).t || HS_RUN_LABEL[k] || k;
// 수집기가 notes 에 남기는 key=value 를 사람 말로. 모르는 키는 숨긴다 — 영문 필드명
// (resolved·ai_ref …)이 그대로 서면 사람 말이 아니다. 원문은 CSV(기록 열)에 그대로 있다.
const HS_NOTE_LABEL = {rows:"행", window:"기간", pages:"페이지", provider:"공급자",
  device:"기기", errors:"오류", skipped:"건너뜀", harvest_kw:"수확 키워드",
  harvest_comp:"수확 경쟁사", engines:"엔진", samples:"샘플", opps:"기회",
  domains:"도메인", inserted:"신규", candidates:"후보", mode:"방식", urls:"주소",
  checked:"검사", striking:"밀면 오를 검색어", pseo:"pSEO",
  // 운영 기록에 실제로 남아 있던 키(2026-09-14 전수) — 없으면 영문 필드명이 그대로 보였다.
  anchors:"앵커", backlinks:"백링크", intersect:"겹친 도메인", referring_domains:"참조 도메인",
  summary:"요약", intents_filled:"검색 의도 분류", first_error:"첫 오류", volumes_filled:"검색량 채움",
  auto_new:"새 경쟁사", metrics:"지표", gap_rows:"빈틈 행", seed:"시드", links:"링크",
  issues:"문제", keywords:"키워드", chunks:"묶음", updated:"갱신", calls:"호출",
  daily:"일별", country:"나라",
  // 사이트가 이 서버를 막아(무응답·403·429) 못 본 주소 수 — collect_crawl 이 적는다.
  blocked:"막힌 주소",
  // 경쟁사 비브랜드 발견·역할 판정(collect_gap D·E)
  nonbrand_new:"비브랜드로 찾은 경쟁사", judged:"역할 판정",
  // 검색량 API 가 못 재는 검색어(빈 문자열·길이 초과·안 받는 지역). 실패가 아니라
  // "안 보냈다"라서 errors 와 따로 센다(collect_metrics 의 unsendable). 브라우저로
  // 기록 화면을 열었을 때 이 키만 영문 그대로 서 있었다.
  unsendable:"못 잰 검색어",
  // 기회 분석(scoring.load)이 남기는 닫힘 수 — 셸의 상태 이름(OPP_ST_OPT)과 같은 말.
  resolved:"저절로 풀림", done:"작업 후 풀림",
  // GA4 수집(collect_ga4)이 남기는 부가 조회 — 값은 개수이거나 ok/skip 이다.
  sessions_all:"전체 세션", newvsreturning:"신규·재방문", ai_ref:"AI 유입",
  // 순위(collect_serp)·속도(collect_vitals)가 남기는 것.
  queue_reused:"이어 받은 결과", timeout:"시간 초과", outlines:"상위 글 목차",
  deep:"깊게 본 검색어", demoted:"추적에서 내린 검색어",
  outline_errors:"목차 못 읽음", strategies:"기기", quota:"한도",
  // 페이지 점검(collect_page) — 막혀서 DataForSEO 로 대신 읽은 수, 막혔지만 최근 값을 둔 수,
  // 최근 404 라 건너뛴 수. 속도(collect_vitals) — 구글 측정기가 화면을 못 본(NO_FCP 등) 수.
  dfs:"대신 읽음", kept:"지난 값 유지", gone_skipped:"없는 페이지 건너뜀",
  unmeasurable:"측정 불가"};
// 부가 조회 결과의 값 — 받았다/건너뛰었다.
const HS_NOTE_VAL = {ok:"받음", skip:"건너뜀"};
// 마지막 수집이 이만큼 지났으면 다시 돌릴 때다. 화면 표시용 기준이지 판정이 아니다.
const HS_STALE_DAYS = 14;

// 이 화면의 명령 칩은 셸의 act() 로 못 만든다 — run 은 단계가 아니라 일괄 실행이고
// /create plan 은 다른 스킬이다. 그래도 사이트 이름은 실어야 한다: 사이트가 여럿인
// 로컬에서 이름 없는 명령은 doctor 가 어느 사이트냐고 되묻는다. 이름을 붙이는 규칙은
// 셸의 siteArg() 한 벌을 그대로 쓴다 — act() 가 만드는 칩과 같은 모양이 나온다.
const HS_cmd = (c, primary = true) =>
  `<button class="cmd${primary ? "" : " sec"}" onclick="copyCmd(this)"
    >${c}${siteArg()}</button>`;

/* 이 화면은 선언한 단계가 없다(view-def 의 stages 가 비었다) — 다음 걸음은 늘
   "전부 다시 돌리기" 하나다. 그 손잡이는 셸의 act() 가 배포에 맞춰 만든다:
   로컬은 /capture run 칩, 호스팅은 data-run="run" 버튼이고 애드온이 그걸
   runAll() 에 잇는다(stages 를 안 보내는 것이 곧 전체 실행이다). */
const HS_runAll = (primary = true) => act("run", "전체 다시 재기", primary);

/* 한 종류를 다시 돌리는 손잡이. 라벨은 단계 용어표(stageRun)에서 오고 이름을 글자로
   옮겨 적지 않는다. full 은 단계가 아니라 일괄 실행이라 그쪽으로 보낸다. */
const HS_rerun = (kind, primary = false) =>
  kind === "full" ? HS_runAll(primary)
    : (window.__STAGES__ || {})[kind] ? act(kind, stageRun(kind), primary) : "";

function HS_ago(iso) {
  const t = Date.parse(iso);
  if (!Number.isFinite(t)) return "";
  const s = (Date.now() - t) / 1000;
  if (s < 0) return "";
  if (s < 90) return "방금";
  if (s < 3600) return `${Math.round(s / 60)}분 전`;
  if (s < 86400) return `${Math.round(s / 3600)}시간 전`;
  return `${Math.round(s / 86400)}일 전`;
}
const HS_days = iso => (Date.now() - Date.parse(iso)) / 86400000;
/* 섹션 눈썹은 범위·기간만 적는다(개수·상태·결론은 부제와 배지가 갖는다) — 이 목록이
   실제로 덮는 기간을 가장 오래된 줄에서 잰다. 잴 것이 없으면 눈썹도 없다. */
function HS_eyebrow(id, rows, key) {
  const el = $(id);
  if (!el) return;
  const ds = rows.map(r => Date.parse(r[key])).filter(Number.isFinite);
  const d = ds.length ? Math.round((Date.now() - Math.min(...ds)) / 86400000) : -1;
  el.textContent = d < 0 ? "" : d < 1 ? "오늘" : `최근 ${d}일`;
}
// 소요는 초로 적는다 — 로그의 단위이고, 표 정렬(숫자 열)이 그대로 성립한다.
function HS_secs(r) {
  const s = (Date.parse(r.finished_at) - Date.parse(r.started_at)) / 1000;
  return Number.isFinite(s) && s >= 0 ? Math.round(s) : null;
}
const HS_mmss = s => s < 60 ? `${s}초` : `${Math.floor(s / 60)}분 ${s % 60}초`;
// 비용은 늘 소수 둘째 자리까지만 — 합계 "$2.922"(셋째 자리)와 행 "$0.1222"(넷째 자리)가
// 섞이면 천 단위 구분처럼 읽힌다(30-desk-10-기록-1440.png). 0보다 크고 1센트 미만이면
// "<$0.01"로 뭉뚱그린다. 합계·행이 이 한 함수를 같이 쓴다.
const HS_usd = v => v > 0 && v < 0.01 ? "<$0.01" : `$${(v || 0).toFixed(2)}`;

/* ── 결과 판정 ─────────────────────────────────────────────
      판정은 셸의 window.runVerdict 한 벌이다 — 이 화면이 정본이었는데 [개요]·애드온이
      같은 정규식을 각자 갖게 되면서 셸로 올라갔다. 여기서 사본을 들면 두 벌이 된다. ── */
const HS_verdict = r => window.runVerdict(r);
// 상태는 배지 한 벌(셸의 .badge)로 말한다: 완료=녹청, 문제=채운 산화동, 건너뜀=회색.
const HS_BADGE = {ok:"ok", bad:"bad", skip:"muted"};
const HS_badge = v =>
  `<span class="badge ${HS_BADGE[v.cls]}" title="${esc(v.why)}">${esc(v.label)}</span>`;

// 첫 오류(first_error)는 수집기가 남긴 HTTP 상태줄 원문이다
// ("500 Server Error: Internal Server Error for url: https://api.dataforseo.com/…") —
// 등폭 빨간 글자로 그대로 나오면 무섭게 읽힌다(10_aitierlist_기록_desktop.png).
// 상태 앞자리(5xx/4xx)로만 사람 말로 옮기고, 원문은 title 로 남긴다. 서비스 이름은
// 새 목록을 두지 않고 URL 호스트명에서 도메인 라벨을 뽑아 쓴다.
function HS_errHost(v) {
  const m = /https?:\/\/([^/\s]+)/.exec(v);
  if (!m) return "";
  // 도메인 그대로(dataforseo.com) — 라벨만 떼면 소문자 상호처럼 읽힌다.
  return m[1].split(":")[0].split(".").slice(-2).join(".");
}
// 상태 코드 없이 공급사 문장만 남은 옛 기록 — 알려진 것만 사람 말로 옮긴다(원문은
// title·접힘에 남는다). 지금 수집기는 이미 사람 말로 남긴다(serp_adapter._task_error_text).
const HS_KNOWN = [
  [/Invalid Field:\s*'(language_code|location_name|location_code)'/i,
    "외부 서비스가 언어·지역 설정을 거절했습니다 — 사이트의 언어·지역을 확인하세요"],
  [/Invalid Field/i, "외부 서비스가 요청 형식을 거절했습니다 — 다시 돌려도 같으면 알려 주세요"],
  [/Payment Required|Insufficient funds/i, "외부 서비스 잔액이 부족합니다 — 충전한 뒤 다시 수집하면 됩니다"],
  [/rates? limit/i, "분당 호출 한도를 넘었습니다 — 잠시 뒤 다시 수집하면 됩니다"],
  [/Quota exceeded|RESOURCE_EXHAUSTED|\b429\b/i, "외부 서비스의 하루 한도를 다 썼습니다 — 내일 다시 수집하면 됩니다"],
  [/Internal (Server )?Error/i, "외부 서비스 서버 오류 — 잠시 뒤 다시 수집하면 됩니다"],
];
// 옛 수정 기록의 메모 — createdb 가 예전에 「손으로 이미 실행: <해시>」로 남겼다(지금은 사람
// 말로 남긴다). 이미 저장된 행은 여기서 같은 말로 읽는다.
const HS_noteText = s => String(s).replace(/^손으로 이미 실행:\s*([0-9a-f]{7,40})/i,
  "이미 적용된 수정(커밋 $1)");   // createdb 가 지금 남기는 말과 같다
function HS_errMsg(v) {
  const m = /^(\d)\d\d\b/.exec(v.trim());
  const svc = HS_errHost(v);
  const who = `외부 서비스${svc ? `(${svc})` : ""}`;
  if (m && m[1] === "5") return `${who} 서버 오류 — 잠시 뒤 다시 수집하면 됩니다`;
  if (m && m[1] === "4") return `${who} 요청이 거절됐습니다 — 키·권한·잔액을 확인하세요`;
  const k = HS_KNOWN.find(([re]) => re.test(v));
  if (k) return k[1];
  // 옛 기록은 표시 없이 100자에서 끊겼다(collector._clip 이전) — 딱 그 길이면 잘린 것이다.
  return v.length >= 99 && !v.endsWith("…") ? v + "…" : v;
}

// 배지 밑(좁은 화면)에 올릴 실패 원인 한 줄 — 판정 이유("도중에 예외로 멈췄습니다")는
// 무엇을 하면 되는지 안 말한다. 수집기가 남긴 중단 사유·첫 오류가 그 답이다.
// 중단 사유는 db.run 이 "중단: <예외 이름>: <메시지>" 로 남긴다 — 예외 이름·영문 원문은
// 사람에게 할 말이 아니다. 아는 것은 옮기고, 모르는 예외는 멈췄다고만 말한다.
function HS_stopMsg(stop) {
  const m = /^[A-Z]\w*(?:Error|Exception|Fatal)\w*:\s*([\s\S]*)$/.exec(stop);
  const body = m ? m[1] : stop, said = HS_errMsg(body);
  return said !== body ? said : m ? "수집 도중 오류로 멈췄습니다" : stop;
}
function HS_cause(n) {
  const s = HS_legacy(n), i = s.indexOf("중단:");
  if (i >= 0) return HS_stopMsg(s.slice(i + 3).trim());
  const m = /first_error=(.*?)(?=\s+[A-Za-z_]+=|$)/.exec(s);
  return m && m[1].trim() ? HS_errMsg(m[1].trim()) : "";
}

// 옛 기록 되읽기 — 분당 한도(402)를 「잔액 없음」으로 적던 때가 있다(serp_adapter.fatal 은
// 이제 응답 문장을 믿어 「분당 호출 한도 초과」로 적는다). 남은 기록은 그대로라 결제
// 페이지로 헛걸음시키지 않게 화면에서만 같은 판정으로 읽는다.
const HS_legacy = n => String(n || "").replace(
  /잔액 없음\(402\)([^[]*)\[([^\]]*rates? limit[^\]]*)\]/i,
  "분당 호출 한도 초과(402) — 잠시 뒤 다시 조회하면 됩니다 [$2]");

function HS_notes(n) {
  if (!n) return "";
  const s = HS_legacy(n), i = s.indexOf("중단:");
  // "scoring load: opps=…" — 앞의 모듈 이름표는 사람에게 할 말이 아니다.
  const head = (i < 0 ? s : s.slice(0, i)).replace(/^scoring load:\s*/, "").replace(/[|\s]+$/, "");
  const stop = i < 0 ? "" : s.slice(i + 3).trim();
  const parts = [];
  // 값에 공백이 든 것이 있다(engines=['a', 'b']) — 다음 key= 직전까지가 한 값이다.
  const rest = head.replace(/([A-Za-z_]+)=(.*?)(?=\s+[A-Za-z_]+=|$)/g, (_, k, v) => {
    if (!v.trim()) return "";   // first_error= 처럼 빈 값은 이름만 덩그러니 남는다
    const val = v.trim().replace(/[,;]$/, "");
    if (k === "first_error") {
      // msg = 값이 숫자가 아니라 사람 말인 자리(등폭을 뺀다).
      parts.push(`<span class="p bad msg" title="${esc(val)}">${esc(HS_NOTE_LABEL[k])} ` +
                 `<b>${esc(HS_errMsg(val))}</b></span>`);
      return "";
    }
    // 공급사 이름은 사람이 할 일을 바꾸지 않는다 — 화면에서는 빼고 CSV 에만 남긴다.
    if (!HS_NOTE_LABEL[k] || k === "provider") return "";
    const bad = (k === "errors" || k === "skipped") && +v > 0;
    parts.push(`<span class="p${bad ? " bad" : ""}">${esc(HS_NOTE_LABEL[k])} ` +
               `<b>${esc(HS_NOTE_VAL[val] || val)}</b></span>`);
    return "";
  }).trim();
  if (rest) parts.push(`<span class="p free">${esc(rest)}</span>`);
  if (stop) {
    const said = HS_stopMsg(stop);
    parts.push(`<span class="p bad msg">중단 <b>${esc(said)}</b></span>` + (said !== stop
      ? `<details class="hs-raw"><summary>원문</summary><code>${esc(stop)}</code></details>` : ""));
  }
  return `<span class="hs-nt">${parts.join("")}</span>`;
}

/* ── 수집 이력 ─────────────────────────────────────────────── */
let HS_RUNS = [], HS_RQ = "", HS_RRES = "", HS_RKIND = null, HS_RN = 12;
const HS_RES_OPT = [["", "전체"], ["ok", "완료"], ["bad", "문제"], ["skip", "건너뜀"]];

function HS_runFiltered() {
  const q = HS_RQ.trim().toLowerCase();
  return HS_RUNS.filter(r =>
    (!HS_RKIND || r.kind === HS_RKIND) &&
    (!HS_RRES || HS_verdict(r).cls === HS_RRES) &&
    (!q || `${r.kind} ${HS_kind(r.kind)} ${r.notes || ""} ${r.started_at || ""}`
             .toLowerCase().includes(q)));
}
function HS_runFind(v) { HS_RQ = v; HS_RN = 12; HS_runList(); }
function HS_runRes(v) { HS_RRES = v; HS_RN = 12; HS_runList(); HS_donutLegend(); }
function HS_runMore(n) { HS_RN = n; HS_runList(); }
function HS_runReset() { HS_RQ = ""; HS_RRES = ""; HS_RKIND = null; HS_runTools(); }
function HS_runKind(el) {
  HS_RKIND = HS_RKIND === el.dataset.k ? null : el.dataset.k;
  HS_runTools();
}

// 종류별 마지막 수집. runs 는 최신순으로 온다 — 처음 만난 kind 가 그 종류의 마지막이다.
// 낡은 것을 앞으로, 그 안에서는 오래 묵은 것부터. Object.keys 순서(=처음 나온 순)로 두면
// 다시 돌려야 할 종류가 멀쩡한 종류들 사이에 흩어진다.
function HS_lastBy() {
  const last = {};
  HS_RUNS.forEach(r => { if (!last[r.kind]) last[r.kind] = r; });
  return Object.keys(last)
    .map(k => ({k, r: last[k], stale: HS_days(last[k].started_at) >= HS_STALE_DAYS}))
    .sort((a, b) => (b.stale - a.stale) ||
                    (Date.parse(a.r.started_at) - Date.parse(b.r.started_at)));
}

// 종류 아바타 — 이름 첫 글자. 색은 이름에서 정해 같은 종류가 늘 같은 색이다(장식이라 aria-hidden).
const HS_av = (k, warn) => {
  const n = HS_kind(k);
  const h = Array.from(String(k)).reduce((a, c) => a + c.charCodeAt(0), 0) % 3;
  return `<span class="hs-av ${warn ? "w" : "a" + h}" aria-hidden="true">${
    esc(Array.from(n)[0] || "?")}</span>`;
};

// 하루 단위 집계 — KPI 스파크의 재료. 새 페이로드는 없다: d.runs 를 날짜로 묶을 뿐이다.
function HS_byDay() {
  const m = {};
  HS_RUNS.forEach(r => {
    const d = (r.started_at || "").slice(0, 10);
    if (!d) return;
    const o = m[d] || (m[d] = {d, n: 0, bad: 0, calls: 0, cost: 0});
    o.n++; o.calls += r.api_calls || 0; o.cost += r.cost_estimate_usd || 0;
    if (HS_verdict(r).cls === "bad") o.bad++;
  });
  return Object.values(m).sort((a, b) => a.d < b.d ? -1 : 1).slice(-14);
}
// 스파크 두 벌 — 막대(하루 몫)와 선(추정 비용). 하루가 둘 미만이면 흐름이 아니라 안 그린다.
function HS_sparkBars(days, key, label, badKey) {
  if (days.length < 2) return "";
  const vals = days.map(x => x[key]), mx = Math.max(...vals, 1), W = 120, H = 40, g = 3;
  const bw = (W - g * (days.length - 1)) / days.length;
  const bars = vals.map((v, i) => {
    const h = Math.max(2, v / mx * (H - 2));
    return `<rect class="${badKey && days[i][badKey] ? "w " : ""}${i === vals.length - 1 ? "last" : ""}"
      x="${(i * (bw + g)).toFixed(1)}" y="${(H - h).toFixed(1)}" width="${bw.toFixed(1)}"
      height="${h.toFixed(1)}" rx="1.5"/>`;
  }).join("");
  return `<div class="sp1"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img"
    aria-label="${esc(`${label} — 최근 ${days.length}일, 하루 최대 ${num(mx)}`)}">${bars}</svg></div>`;
}
function HS_sparkLine(days, key, label, fmt) {
  if (days.length < 2) return "";
  const vals = days.map(x => x[key]), mx = Math.max(...vals), mn = Math.min(...vals);
  if (!(mx > 0)) return "";
  const W = 120, H = 40, pts = vals.map((v, i) =>
    [i / (vals.length - 1) * W, H - 5 - (mx === mn ? .5 : (v - mn) / (mx - mn)) * (H - 12)]);
  let p = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], cx = (x0 + x1) / 2;
    p += ` C${cx.toFixed(1)} ${y0.toFixed(1)} ${cx.toFixed(1)} ${y1.toFixed(1)} ${x1.toFixed(1)} ${y1.toFixed(1)}`;
  }
  return `<div class="sp1"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img"
    aria-label="${esc(`${label} — 최근 ${days.length}일, 하루 최대 ${fmt(mx)}`)}">
    <defs><linearGradient id="hsg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--accent)" stop-opacity=".28"/>
      <stop offset="1" style="stop-color:var(--accent)" stop-opacity="0"/></linearGradient></defs>
    <path d="${p} L${W} ${H} L0 ${H} Z" fill="url(#hsg)"/><path class="ln" d="${p}"/></svg></div>`;
}

// 결과 도넛 — 완료·문제·건너뜀. 범례 칩이 표의 결과 거르개를 겸하고, 숫자가 캔버스의 글자 대체다.
const HS_RES_TONE = {ok: "--accent", bad: "--warn", skip: "--mute"};
function HS_resCount() {
  const c = {ok: 0, bad: 0, skip: 0};
  HS_RUNS.forEach(r => { c[HS_verdict(r).cls]++; });
  return c;
}
function HS_donutLegend() {
  const box = document.querySelector("#hs-donut .dl");
  if (!box) return;
  const c = HS_resCount();
  box.innerHTML = HS_RES_OPT.filter(([v]) => v && c[v]).map(([v, l]) =>
    `<button class="chip${HS_RRES === v ? " on" : ""}" onclick="HS_runResBtn('${v}')"
      aria-pressed="${HS_RRES === v}" title="누르면 실행 기록이 ${l}만 보입니다. 한 번 더 누르면 풀립니다."
      ><i style="background:var(${HS_RES_TONE[v]})"></i>${l} <b>${c[v]}</b></button>`).join("");
}
function HS_runResBtn(v) {
  HS_RRES = HS_RRES === v ? "" : v;
  HS_RN = 12;
  HS_runTools();
  document.getElementById("hs-runcard").scrollIntoView({behavior: "smooth", block: "start"});
}
function HS_donut() {
  const c = HS_resCount(), total = HS_RUNS.length;
  const order = ["ok", "bad", "skip"].filter(v => c[v]);
  const label = {ok: "완료", bad: "문제", skip: "건너뜀"};
  const aria = `결과 분포 — ${order.map(v => `${label[v]} ${c[v]}회`).join(", ")}`;
  const cv = chMount(T => {
    const st = getComputedStyle(document.documentElement), col = v => st.getPropertyValue(v).trim();
    return {type: "doughnut",
      data: {labels: order.map(v => label[v]), datasets: [{data: order.map(v => c[v]),
        backgroundColor: order.map(v => col(HS_RES_TONE[v])), borderColor: T.card, borderWidth: 3,
        hoverOffset: 4, borderRadius: 6}]},
      options: {responsive: true, maintainAspectRatio: false, cutout: "68%",
        plugins: {legend: {display: false},
          tooltip: chTip(T, {callbacks: {title: x => x[0].label,
            label: x => `${x.parsed}회 (${Math.round(x.parsed / total * 100)}%)`}}),
          chText: {T, items: [{text: String(total), at: "center", big: true}]}}}};
  }, aria, "width:136px;height:136px;flex:none");
  $("hs-donut").innerHTML = `<div class="hs-ch"><div><h2>결과 분포</h2>
      <p class="hs-cs">이 목록 ${total}회의 결과입니다. 눌러서 표를 거릅니다.</p></div></div>
    <div class="dn">${cv}<div class="dl"></div></div>`;
  HS_donutLegend();
}

// 요약·마지막 수집은 거르기와 무관하게 전체를 말한다 — 걸러 놓고 "총액"을 읽으면 거짓말이 된다.
function HS_runSummary() {
  // 한 번도 안 돈 로그가 "0회 · $0.000" 이라고 말하면 안 된다 — 빈 상태에 자리를 내준다.
  if (!HS_RUNS.length)
    return void ($("runsum").className = "", $("runsum").innerHTML = "",
                 $("lastby").innerHTML = "", $("hs-donut").innerHTML = "");
  const bad = HS_RUNS.filter(r => HS_verdict(r).cls === "bad").length;
  const skip = HS_RUNS.filter(r => HS_verdict(r).cls === "skip").length;
  const calls = HS_RUNS.reduce((a, r) => a + (r.api_calls || 0), 0);
  const cost = HS_RUNS.reduce((a, r) => a + (r.cost_estimate_usd || 0), 0);
  const days = HS_byDay();
  // 증감 알약은 안 만든다 — 비교할 직전 값이 없다. 알약은 사실(문제·건너뜀 수)만 말한다.
  const pills = (bad
      ? `<span class="d down" title="중단·미완·오류로 끝난 실행 수">문제 ${bad}</span>`
      : `<span class="d up" title="중단·미완·오류로 끝난 실행이 없습니다">문제 없음</span>`) +
    (skip ? `<span class="d muted" title="보통 한도·키 없음">건너뜀 ${skip}</span>` : "");
  const met = [
    [HS_RUNS.length, "실행", "최근 40회까지 담습니다 · 막대 하나가 하루", pills,
      HS_sparkBars(days, "n", "일별 실행 수", "bad")],
    [num(calls), "외부 호출", "이 목록의 합계 · 막대 하나가 하루", "",
      HS_sparkBars(days, "calls", "일별 외부 호출 수")],
    [HS_usd(cost), "비용", "수집기가 적어 둔 추정치 · 선은 일별", "",
      HS_sparkLine(days, "cost", "일별 추정 비용", HS_usd)]];
  $("runsum").className = "band";
  $("runsum").innerHTML = met.map(([v, l, b, p, sp]) =>
    `<div class="m"><div class="v">${v}${p}</div><div class="l">${l}</div>
      <div class="b">${b}</div>${sp}</div>`).join("");

  // 낡은 종류는 여기서 문장으로 또 말하지 않는다 — 그 말은 [다음 행동] 한 자리가
  // 갖고, 여기서는 어느 종류가 묵었는지를 막대 색과 배지로만 짚는다.
  const rows = HS_lastBy(), stale = rows.filter(x => x.stale).length;
  const maxd = Math.max(HS_STALE_DAYS, ...rows.map(x => Math.max(0, HS_days(x.r.started_at) || 0)));
  const tick = HS_STALE_DAYS / maxd * 100;
  const rr = rows.map(({k, r, stale: st}) => st && !READONLY ? HS_rerun(k, false) : "");
  $("lastby").innerHTML = `<div class="hs-ch"><div><h2>종류별 마지막 실행</h2>
      <p class="hs-cs">막대가 길수록 오래 묵었습니다. 세로 눈금이 ${HS_STALE_DAYS}일 기준선입니다.</p></div>
      ${stale ? `<span class="badge warn">${stale}종류 묵음</span>` : `<span class="badge ok">모두 최근</span>`}
    </div>
    <div class="lb${rr.some(Boolean) ? " has-rr" : ""}">${rows.map(({k, r, stale: st}, i) => {
      const d = Math.max(0, HS_days(r.started_at) || 0);
      return `<div class="row${st ? " stale" : ""}">${HS_av(k, st)}
        <div class="top"><span class="k">${esc(HS_kind(k))}</span>${st
          ? `<span class="badge warn" title="${HS_STALE_DAYS}일 넘게 안 돌았습니다 — 다시 돌릴 때입니다.">${
              HS_STALE_DAYS}일 지남</span>` : ""}
          </div>
        <div class="v">${esc((r.started_at || "").slice(0, 10))}
          <span class="ago" title="마지막으로 이 종류를 돌린 때입니다.">${HS_ago(r.started_at)}</span></div>
        <div class="tr" role="img" aria-label="마지막 실행 뒤 ${Math.floor(d)}일 지남"><i style="width:${
          Math.max(2, d / maxd * 100).toFixed(1)}%"></i><span class="tk" style="left:${
          tick.toFixed(1)}%"></span></div>
        <div class="rr">${rr[i] ? `<div class="acts">${rr[i]}</div>` : ""}</div></div>`;
    }).join("")}</div>`;
  HS_donut();
}

// 몇 종류가 묵었는지 한 문장으로. 요약 줄과 [다음 행동]이 같은 자리를 두 번 말하지
// 않도록 문구는 여기 한 벌만 둔다 — 화면에는 [다음 행동] 쪽으로만 나간다.
function HS_staleMsg() {
  const s = HS_lastBy().filter(x => x.stale);
  if (!s.length) return null;
  return {say: `${s.length}종류가 ${HS_STALE_DAYS}일 넘게 안 돌았습니다.` +
      `<span class="live"> 다시 재야 그동안 고친 게 숫자에 섞입니다.</span>`,
    act: p => HS_runAll(p)};
}

// 도구줄·칩은 데이터가 바뀔 때만 다시 그린다 — 매 키 입력마다 갈아치우면 찾기 칸이
// 사라져 포커스를 잃는다. 거르기는 아래 목록만 다시 그린다(HS_runList).
function HS_runTools() {
  // 버튼을 여기 또 두지 않는다 — 실행할 게 없을 때 HS_acts()가 세우는 머리의
  // [다음 행동] 띠가 이미 같은 전체 다시 재기를 주요 버튼으로 든다. 같은 화면
  // 위아래에 같은 이름의 버튼이 둘 서면(하나는 채운 녹청, 하나는 여기) 어느
  // 쪽을 눌러야 하는지보다 "왜 두 개인지"부터 눈에 든다 — 문구만 남긴다.
  if (!HS_RUNS.length)
    return $("runs").innerHTML = `<div class="empty">
      <b>아직 실행한 적이 없습니다</b>
      <p>위에서 전체 다시 재기를 누르면 무엇을 언제 얼마에 수집했는지가 여기
        줄로 남습니다.</p></div>`;
  const counts = {};
  HS_RUNS.forEach(r => { counts[r.kind] = (counts[r.kind] || 0) + 1; });
  if (HS_RKIND && !counts[HS_RKIND]) HS_RKIND = null;   // 사이트 전환 시 잔존 필터
  const kinds = Object.keys(counts);
  const resn = c => HS_RUNS.filter(r => !c || HS_verdict(r).cls === c).length;
  const chips = kinds.length > 1
    ? `<div class="oppchips">${kinds.map(k =>
        `<button class="chip${HS_RKIND === k ? " on" : ""}" data-k="${esc(k)}"
           onclick="HS_runKind(this)"
           aria-pressed="${HS_RKIND === k}">${esc(HS_kind(k))}
           <b>${counts[k]}</b></button>`).join("")}</div>`
    : "";
  $("runs").innerHTML = `<div class="tools">
      <input type="search" value="${esc(HS_RQ)}" oninput="HS_runFind(this.value)"
        placeholder="종류·기록으로 찾기" aria-label="수집 이력 찾기">
      <select onchange="HS_runRes(this.value)" aria-label="결과로 거르기">${HS_RES_OPT.map(
        ([v, l]) => `<option value="${v}"${v === HS_RRES ? " selected" : ""}>${l} ` +
          `(${resn(v)})</option>`).join("")}</select>
      <span class="n" id="runn"></span>
      <span class="sp"></span>
      <button class="go sec sm" onclick="HS_runCsv()"
        title="지금 걸러 놓은 목록 그대로 내려받습니다">CSV 내려받기</button>
    </div>${chips}<div id="runlist"></div>`;
  HS_runList();
  HS_donutLegend();
}

function HS_runList() {
  const list = HS_runFiltered();
  // 개수를 두 번 적지 않는다 — 결과 거르개가 이미 "완료 (12)" 로 말한다. 그 위에
  // 무엇이 더 걸렸을 때(찾는 말·종류 칩)만 몇 회가 남았는지 적는다.
  const byRes = HS_RUNS.filter(r => !HS_RRES || HS_verdict(r).cls === HS_RRES).length;
  $("runn").textContent = list.length !== byRes
    ? `${list.length}회 / 전체 ${HS_RUNS.length}회` : "";
  if (!list.length)
    return $("runlist").innerHTML = `<div class="empty"><b>맞는 실행이 없습니다</b>
      <p>종류나 결과를 좁혀 놓았습니다. 조건을 풀면 전체가 다시 보입니다.</p>
      <div class="acts"><button class="go sec sm" onclick="HS_runReset()">조건 지우기</button>
      </div></div>`;
  const rows = list.slice(0, HS_RN).map(r => {
    const s = HS_secs(r), v = HS_verdict(r);
    // 실패는 배지 글자("오류 3")만으로는 무슨 일인지 안 읽힌다 — 이유를 항상 펴고,
    // 그 아래에 그 종류를 다시 돌리는 손잡이를 둔다(박제본에서는 셸이 뗀다).
    const fix = v.cls === "bad" && !READONLY ? HS_rerun(r.kind, false) : "";
    return `<tr>
      <td class="when" title="${esc(r.started_at || "")}">${
        esc((r.started_at || "").replace("T", " ").slice(0, 16))}
        <span class="muted">${HS_ago(r.started_at)}</span>${v.cls === "bad"
          ? `<div class="why why-m">${esc(HS_cause(r.notes) || v.why)}</div>` : ""}</td>
      <td class="kwcell"><span class="kn">${HS_av(r.kind, false)}${esc(HS_kind(r.kind))}</span></td>
      <td>${HS_badge(v)}</td>
      <td class="num"${s !== null && s >= 60 ? ` title="${HS_mmss(s)}"` : ""}>${
        s === null ? "—" : s}</td>
      <td class="num">${num(r.api_calls || 0)}</td>
      <td class="num">${r.cost_estimate_usd ? HS_usd(r.cost_estimate_usd) : "—"}</td>
      <td>${HS_notes(r.notes)}${
        v.cls === "bad" ? `<div class="why">${esc(v.why)}</div>` : ""}${
        fix ? `<div class="acts">${fix}</div>` : ""}</td>
    </tr>`;
  });
  const rest = list.length - HS_RN;
  $("runlist").innerHTML = `${table(
    ["시각", "종류", "결과?완료·건너뜀·문제는 수집기가 남긴 기록으로만 가릅니다",
     ">소요(초)?시작과 끝의 차이입니다. 1분이 넘으면 칸에 손을 얹어 분·초로 봅니다",
     ">호출?그 실행이 부른 외부 API 횟수",
     ">비용?수집기가 적어 둔 추정치입니다 — 청구서가 아닙니다",
     "기록?수집기가 남긴 key=value 를 옮긴 것입니다"], rows)}` + (rest > 0
    ? `<div class="acts">
         <button class="go sec sm" onclick="HS_runMore(${HS_RN + 20})">${Math.min(20, rest)}건 더 보기 (남은 ${rest}건)</button></div>`
    : "");
}

function HS_runCsv() {
  csv("수집이력", [["시각", "종류", "결과", "소요(초)", "호출", "비용(USD)", "기록"]]
    .concat(HS_runFiltered().map(r => [r.started_at, HS_kind(r.kind),
      HS_verdict(r).label, HS_secs(r) ?? "", r.api_calls || 0,
      r.cost_estimate_usd || 0, r.notes || ""])));
}

/* ── 고친 것 ──────────────────────────────────────────────── */
let HS_MADE = [], HS_MQ = "", HS_MM = "", HS_DAILY = [];
// 빈 상태의 [기회 열기]가 뜰 조건 — 남은 기회가 있을 때만이다(payload d.opps_total,
// HS_todo 가 [다음 행동]에 쓰는 것과 같은 수). 0건인데 "기회 열기"를 누르면 [개요]에
// 아무것도 없어 방금 누른 버튼이 거짓말을 한 게 된다.
let HS_OPPS = 0;
// 그 수는 [개요]의 [아직 안 함] 거르개와 같은 기준으로 센다 — 같은 지면끼리 묶은 줄
// (d.opp_groups) 중 열린 것. 여태 d.opps_total(묶기 전, status new 만)을 적어 기록은
// 206, 개요는 170 으로 같은 것을 다르게 셌다. 옛 박제본(줄 없음)만 전수로 물러선다.
const HS_openOpps = d => d.opp_groups
  ? d.opp_groups.filter(g => window.oppStMatch(g, "open")).length : (d.opps_total || 0);

/* ── 좋아졌나 ──────────────────────────────────────────────
      이 화면은 회고인데 결론이 없었다: 고친 목록을 늘어놓고 "숫자로 돌아왔는지는
      [개요]가 답합니다"라며 남에게 넘겼다. 재료는 같은 페이로드에 이미 실려 온다
      (d.daily — 일별 클릭·노출). 고친 날 앞뒤 하루 평균 클릭을 그 줄에 붙인다.
      새 SQL 은 없다.
      인과가 아니다: 같은 기간에 다른 것도 바뀐다. 그래서 "덕분에"라고 쓰지 않고,
      전후 어느 쪽이든 날이 모자라면 숫자를 지어내지 않고 모자라다고 말한다. ── */
const HS_EFF_WIN = 7;   // 앞뒤로 볼 날 수 — 7일이면 요일 편차가 한 바퀴 돌아 상쇄된다
const HS_EFF_MIN = 3;   // 이보다 짧은 쪽이 있으면 평균이라 부를 수 없다

function HS_effect(created) {
  const day = String(created || "").slice(0, 10);
  if (!day || !HS_DAILY.length) return null;
  if (day < HS_DAILY[0].date) return {old: true};   // 일별 기록이 닿지 않는 옛날 수정
  const before = HS_DAILY.filter(r => r.date < day).slice(-HS_EFF_WIN);
  const after = HS_DAILY.filter(r => r.date >= day).slice(0, HS_EFF_WIN);
  if (before.length < HS_EFF_MIN || after.length < HS_EFF_MIN) return {short: true};
  const avg = a => a.reduce((s, r) => s + (r.clicks || 0), 0) / a.length;
  const b = avg(before), f = avg(after);
  return {b, f, d: f - b, nb: before.length, nf: after.length};
}

function HS_effLine(c) {
  const e = HS_effect(c.created_at);
  if (!e) return "";
  if (e.old)
    return `<div class="eff" title="일별 클릭은 최근 ${HS_DAILY.length}일치만 남습니다."
      >일별 기록이 닿지 않는 날입니다 — 전후를 못 잽니다</div>`;
  if (e.short)
    return `<div class="eff" title="고친 날 앞뒤로 각각 ${HS_EFF_MIN}일 이상 있어야 잽니다."
      >아직 판단할 날이 모자랍니다</div>`;
  const one = n => n.toFixed(1);
  return `<div class="eff${e.d > 0 ? " up" : e.d < 0 ? " down" : ""}"
    title="고친 날 앞 ${e.nb}일과 뒤 ${e.nf}일의 하루 평균 클릭입니다 — 같은 기간에 다른 것도
바뀌므로 이 수정만의 몫이라는 뜻은 아닙니다."
    >고친 뒤 하루 평균 클릭 <b>${one(e.b)}</b> → <b>${one(e.f)}</b>
    (${e.d >= 0 ? "+" : "−"}${one(Math.abs(e.d))})</div>`;
}

/* 루프의 반대쪽 끝 — 이 수정을 낳은 기회 카드로 데려간다. 기회 id 는 페이로드에 이미
   실려 온다(opportunity_id). 대상 문자열은 data- 로 넘긴다: onclick 문자열에 박으면
   따옴표 든 검색어에서 깨진다. 개요는 점수 높은 순 8건만 펼쳐 두므로 대상으로 먼저
   걸러야 그 카드가 목록에 남는다. */
function HS_toOpp(el) {
  SM.show("overview");
  if (window.oppReset) oppReset();      // 남아 있던 거르기가 그 카드를 숨길 수 있다
  const t = el.dataset.t || "";
  const box = document.querySelector("#opps input[type=search]");
  if (box && window.oppFind) { box.value = t; oppFind(t); }
  // 같은 지면의 변형은 대표 줄 하나에 묶여 있다 — 카드의 data-ids 가 묶인 id 전부다.
  const card = document.querySelector(`#opplist [data-ids~="${+el.dataset.o}"]`);
  if (!card) return;                    // 지운 기회·옛 박제본이면 카드가 없다 — 개요까지만
  card.open = true;
  card.scrollIntoView({behavior: "smooth", block: "center"});
}

// 병합 전만 남기고 그 자리로 데려간다 — 목록 위 칩과 [다음 행동]이 같은 손잡이를 쓴다.
function HS_showUnmerged() {
  HS_MM = "n";
  HS_madeTools();                       // 거르개(select)도 같이 "사이트 반영 전"으로 맞춰진다
  $("hs-madecard").scrollIntoView({behavior: "smooth", block: "start"});
}

function HS_madeFiltered() {
  const q = HS_MQ.trim().toLowerCase();
  return HS_MADE.filter(c =>
    (!HS_MM || (HS_MM === "y") === !!c.merged) &&
    (!q || `${c.file_path} ${c.branch || ""} ${c.note || ""} ${c.opp_target || ""}`
             .toLowerCase().includes(q)));
}
function HS_madeFind(v) { HS_MQ = v; HS_madeList(); }
function HS_madeMerged(v) { HS_MM = v; HS_madeList(); }
function HS_madeReset() { HS_MQ = ""; HS_MM = ""; HS_madeTools(); }

function HS_madeRow(c) {
  // kind 한국어 라벨의 정본은 scoring.py(KINDS 명부) — payload 의 kind_labels 로 온다.
  // 여기는 대상 없이 kind 만 아는 자리라 통칭을 쓴다(밴드별 라벨은 못 낸다).
  const label = (window.KIND_LABELS || {})[c.kind] || c.kind || "수동 작업";
  // 브랜치·파일 경로는 식별자다 — 겉에는 몇 개를 고쳤는지만, 경로는 접힘 안에.
  // file_path 는 여러 파일이면 쉼표로 이어 온다.
  const files = String(c.file_path || "").split(",").map(f => f.trim()).filter(Boolean);
  return `<div class="mk">
    <div>
      <div class="mh">
        <span class="kind">${esc(label)}</span>
        <span class="mn">파일 ${files.length}개 수정</span>
        <span class="dt">${esc((c.created_at || "").slice(0, 10))}</span>
      </div>
      <details class="mfiles"><summary>수정한 파일${c.branch ? "·브랜치" : ""}</summary>
        ${c.branch ? `<div class="br">${esc(c.branch)}</div>` : ""}
        ${files.map(f => `<div class="path">${esc(f)}</div>`).join("")}</details>
      ${c.opp_target
        ? `<button class="from" data-o="${esc(c.opportunity_id)}"
             data-t="${esc(c.opp_target)}" onclick="HS_toOpp(this)"
             title="이 수정을 낳은 기회입니다 (기회 #${esc(c.opportunity_id)}) — 누르면 [개요]의 그 카드로 갑니다"
             >← ${esc(c.opp_target)}</button>` : ""}
      ${c.note ? (c.note.startsWith("http")
        ? `<div class="why"><a href="${esc(c.note)}" target="_blank" rel="noopener">${esc(c.note)}</a></div>`
        : `<div class="why">${esc(HS_noteText(c.note))}</div>`) : ""}
      ${HS_effLine(c)}
    </div>
    <span class="badge ${c.merged ? "ok" : "warn"}" title="${c.merged
      ? "사이트에 반영됐습니다. 다음 수집부터 이 수정이 숫자에 섞입니다."
      : "아직 사이트에 반영되지 않았습니다. 반영해야 검색엔진이 이 수정을 봅니다."}"
      >${c.merged ? "사이트 반영됨" : "사이트 반영 전"}</span>
  </div>`;
}

function HS_madeTools() {
  if (!HS_MADE.length) {
    HS_loop();
    // 화면 이동은 대괄호 글자가 아니라 버튼이다 — 아래 기회 열기가 그 손잡이다.
    // 다만 그 손잡이는 열 기회가 있을 때만 선다 — 0건에서 누르면 [개요]에 아무것도
    // 없어 방금 누른 버튼이 거짓말을 한 셈이 된다(HS_OPPS, VIEW 가 채운다).
    const plan = W(HS_cmd("/create plan", false), "");
    const opp = HS_OPPS
      ? `<button class="go sm sec" onclick="SM.touched=true;SM.show('overview')"
          >기회 열기</button>` : "";
    const acts = !READONLY && (plan || opp) ? `<div class="acts">${plan}${opp}</div>` : "";
    return $("made").innerHTML = `<div class="empty">
      <b>아직 고친 기록이 없습니다</b>
      <p>고른 기회를 콘텐츠로 옮기면 여기 쌓이고, 고친 뒤 클릭이 어떻게 됐는지가
        줄마다 붙습니다.</p>${acts}</div>`;
  }
  const mn = v => HS_MADE.filter(c => !v || (v === "y") === !!c.merged).length;
  // 병합 전 건수는 거르개 옵션 라벨 안에만 있었다 — 이 화면에서 지금 당장 할 수 있는
  // 유일한 일인데 드롭다운을 열어야 보였다. 머리로 올린다.
  const un = mn("n");
  $("made").innerHTML = (un ? `<div class="oppchips"><button class="chip"
      onclick="HS_showUnmerged()"
      title="아직 사이트에 반영되지 않았습니다. 반영해야 검색엔진이 봅니다. 눌러서 그것만 봅니다."
      >사이트 반영 전 <b>${un}건</b></button></div>` : "") + `<div class="tools">
      <input type="search" value="${esc(HS_MQ)}" oninput="HS_madeFind(this.value)"
        placeholder="파일·기회·근거로 찾기" aria-label="고친 것 찾기">
      <select onchange="HS_madeMerged(this.value)" aria-label="사이트 반영 여부로 거르기">${
        [["", "전체"], ["n", "사이트 반영 전"], ["y", "사이트 반영됨"]].map(([v, l]) =>
          `<option value="${v}"${v === HS_MM ? " selected" : ""}>${l} (${mn(v)})</option>`
        ).join("")}</select>
      <span class="n" id="maden"></span>
      <span class="sp"></span>
      <button class="go sec sm" onclick="HS_madeCsv()"
        title="지금 걸러 놓은 목록 그대로 내려받습니다">CSV 내려받기</button>
    </div><div id="madelist"></div>`;
  HS_madeList();
  HS_loop();
}

// 한 바퀴 카드 — 고친 건마다 전후 하루 평균 클릭을 짝 막대로, 그 밑에 결론 한 단락.
// 걸러 놓은 목록과 무관하게 전체 고친 것을 말한다(결론이 필터를 따라 바뀌면 거짓말이 된다).
function HS_loop() {
  const card = $("hs-loopcard");
  if (!HS_MADE.length) { card.hidden = true; $("hs-loop").innerHTML = ""; return; }
  card.hidden = false;
  const linked = HS_MADE.filter(c => c.opportunity_id).length;
  // 회고의 결론은 이 화면이 낸다 — 줄마다 붙인 전후 델타를 여기서 합쳐 말한다.
  const eff = HS_MADE.map(c => HS_effect(c.created_at));
  const up = eff.filter(e => e && e.d > 0).length;
  const down = eff.filter(e => e && e.d < 0).length;
  const same = eff.filter(e => e && e.d === 0).length;
  const cant = eff.filter(e => !e || e.old || e.short).length;
  // 잰 것과 못 잰 것을 갈라 적는다 — 합이 안 맞으면 어느 쪽이 빠졌는지 읽는 사람이 못 센다.
  const bits = [`오른 것 ${up}건`, `내린 것 ${down}건`];
  if (same) bits.push(`그대로 ${same}건`);
  const verdict = !HS_DAILY.length
    ? "일별 클릭 기록이 아직 없어 전후를 못 잽니다 — 실적을 한 번 더 수집하면 " +
      "줄마다 붙습니다."
    : (up + down + same)
      ? `고친 날 앞뒤 ${HS_EFF_WIN}일 하루 평균 클릭으로 보면 잴 수 있는 ${
          up + down + same}건 중 ${bits.join(", ")}입니다${cant
          ? `. 나머지 ${cant}건은 아직 잴 날이 없습니다` : ""}. ` +
        "같은 기간에 다른 것도 바뀌므로 이 수정들만의 몫은 아닙니다."
      : `아직 전후를 잰 건이 없습니다 — 고친 날 앞뒤로 각각 ${HS_EFF_MIN}일 이상 ` +
        "일별 기록이 있어야 잽니다.";
  // 잰 건만 막대로 — 최근 것부터 여섯 건. 못 잰 건은 결론 문장이 숫자로 말한다.
  const meas = HS_MADE.map(c => ({c, e: HS_effect(c.created_at)}))
    .filter(x => x.e && x.e.b !== undefined)
    .sort((a, b) => String(b.c.created_at).localeCompare(String(a.c.created_at))).slice(0, 6);
  let chart = "";
  if (meas.length) {
    const name = c => `${String(c.created_at || "").slice(5, 10)} ${(window.KIND_LABELS || {})[c.kind] || c.kind || "수동 작업"}`;
    const one = n => n.toFixed(1);
    const aria = "고친 날 앞뒤 하루 평균 클릭 — " + meas.map(({c, e}) =>
      `${name(c)} ${one(e.b)}에서 ${one(e.f)}`).join(", ");
    chart = chMount(T => {
      const mute = getComputedStyle(document.documentElement).getPropertyValue("--mute").trim();
      return {type: "bar",
        data: {labels: meas.map(x => name(x.c)),
          datasets: [{label: "고치기 전", data: meas.map(x => x.e.b), backgroundColor: mute,
            borderRadius: 4, borderSkipped: false, maxBarThickness: 10},
            {label: "고친 뒤", data: meas.map(x => x.e.f), borderRadius: 4, borderSkipped: false,
              maxBarThickness: 10,
              backgroundColor: meas.map(x => x.e.d < 0 ? T.copper : T.patina)}]},
        options: {responsive: true, maintainAspectRatio: false, indexAxis: "y",
          categoryPercentage: .8, barPercentage: .9,
          scales: {y: chCat(T),
            x: {beginAtZero: true, grid: {color: T.soft}, border: {display: false},
              ticks: {color: T.slate, font: {family: T.mono, size: 12}, maxTicksLimit: 4}}},
          plugins: {legend: {display: false},
            tooltip: chTipSays(T, {callbacks: {title: x => x[0].label,
              label: x => `${x.dataset.label} 하루 평균 ${one(x.parsed.x)}클릭`}})}}};
    }, aria, `height:${meas.length * 44 + 28}px`) +
      `<div class="chleg"><span><i class="pre"></i>고치기 전 7일 평균</span>
        <span><i class="post"></i>고친 뒤 7일 평균</span><span>단위: 하루 클릭</span></div>`;
  }
  $("hs-loop").innerHTML = chart +
    `<div class="loop"><b>한 바퀴</b> — 실적을 수집하고, 기회로 뽑고, 이 ${
      HS_MADE.length}건을 고쳤습니다${linked
      ? ` (그중 ${linked}건은 뽑아 둔 기회에서 곧장 왔습니다)`
      : ""}. ${verdict}</div>`;
}

function HS_madeList() {
  const list = HS_madeFiltered();
  $("maden").textContent = list.length === HS_MADE.length
    ? `${HS_MADE.length}건` : `${list.length}건 / 전체 ${HS_MADE.length}건`;
  if (!list.length)
    return $("madelist").innerHTML = `<div class="empty"><b>맞는 기록이 없습니다</b>
      <p>파일이나 사이트 반영 여부를 좁혀 놓았습니다. 조건을 풀면 전체가 다시 보입니다.</p>
      <div class="acts"><button class="go sec sm" onclick="HS_madeReset()">조건 지우기</button>
      </div></div>`;
  $("madelist").innerHTML = list.map(HS_madeRow).join("");
}

function HS_madeCsv() {
  csv("고친것", [["작성일", "종류", "파일", "브랜치", "사이트 반영", "기회", "근거"]]
    .concat(HS_madeFiltered().map(c => [c.created_at,
      (window.KIND_LABELS || {})[c.kind] || c.kind || "", c.file_path, c.branch || "",
      c.merged ? "사이트 반영됨" : "사이트 반영 전", c.opp_target || "",
      (c.note || "").replace(/\s+/g, " ")])));
}

/* ── 다음 행동 ─────────────────────────────────────────────
      맨 앞 하나는 화면 머리의 [다음 행동] 띠가 가져가고, 아래 #acts 목록은 그 뒤에
      남은 것만 받는다. 둘 다 같은 문장을 읽으면 어느 쪽이 지금 할 일인지 알 수 없다.
      (#acts 는 한동안 라이브에서 영영 hidden 이었다 — 여는 코드가 셸의 __SNAPSHOT__
      분기 하나뿐이었다. 지금은 HS_acts 가 두 배포 모두에서 연다.)
      새 판정은 만들지 않는다: 안 한 단계는 안내(stage.py)가 이미 고른 것을 그대로 쓰고
      (d.guide.here), 명령도 그 단계가 들고 있는 cmd 를 가리킨다. ── */
function HS_todo(d) {
  const out = [];
  // 마지막 실행이 실패로 끝났으면 그것이 이 화면의 첫 걸음이다 — 실패한 종류를
  // 그대로 다시 돌린다. 이유는 짧게 툴팁에 두고 문장은 다음 걸음으로 끝낸다.
  const last = HS_RUNS[0], lv = last && HS_verdict(last);
  if (lv && lv.cls === "bad")
    out.push({say: `지난 <b>${esc(HS_kind(last.kind))}</b> 실행이 실패했습니다.` +
        `<span class="live"> 다시 돌리면 이어서 채워집니다.</span>` +
        `<span class="hint" tabindex="0" data-tip="${esc(lv.why)}" title="${esc(lv.why)}"
          aria-label="${esc(lv.why)}">i</span>`,
      act: p => HS_rerun(last.kind, p), dot: "bad"});
  const g = d.guide || {}, steps = g.steps || [];
  const next = g.here >= 0 ? steps[g.here] : null;
  if (next)
    // 그 단계의 지금 상태(next.state)는 괄호로 달지 않는다 — 「(아직 없음)」이 단계
    // 상태인지 결과 개수인지 문장만 봐서는 못 읽는다. 이름을 붙여 툴팁으로 내린다.
    // "다음은 X"(전역 우선순위)는 [개요] 한 곳이 말한다 — 이 화면은 실행 기록이라
    // 아직 안 끝난 단계라는 사실만 적는다.
    out.push({dot: "warn", say: `아직 끝나지 않은 단계가 있습니다: <b>${esc(next.t)}</b>.${next.state
        ? `<span class="hint" tabindex="0" data-tip="지금 상태: ${esc(next.state)}"
             title="지금 상태: ${esc(next.state)}"
             aria-label="지금 상태: ${esc(next.state)}">i</span>` : ""}`,
      // 그 단계가 그대로 돌 수 있으면 두 배포가 같은 일을 한다 — act() 한 벌로 낸다
      // (로컬은 그 단계의 명령 칩, 호스팅은 그 단계의 실행 버튼). 못 도는 단계
      // (사이트 등록·콘텐츠 작성)만 갈린다: 로컬은 안내가 든 명령, 호스팅은 일괄 실행.
      // 아직 한 번도 안 돈 단계다 — 라벨은 재실행(stageRun)이 아니라 단계 이름(t)이다.
      act: p => next.runnable
        ? act(next.id, HS_kind(next.id), p)
        : W(next.cmd
            ? `<button class="cmd${p ? "" : " sec"}" onclick="copyCmd(this)"
                >${esc(next.cmd)}</button>`
            : "", HS_runAll(p))});
  const stale = HS_staleMsg();          // 문구 한 벌 — 요약 줄은 배지로만 짚는다
  if (stale) out.push({...stale, dot: "warn"});
  const un = HS_MADE.filter(c => !c.merged).length;
  if (un)
    out.push({dot: "warn", say: `${un}건이 아직 사이트에 반영되지 않았습니다.` +
        `<span class="live"> 반영해야 검색엔진이 그 수정을 봅니다.</span>`,
      act: p => `<button class="go${p ? "" : " sec"}"
        onclick="HS_showUnmerged()">반영 전만 보기</button>`});
  // 화면을 넘기는 손잡이도 버튼 계약을 따른다 — window.go 는 문장 안에 섞이는
  // 밑줄 링크(.gov)라 .acts 안에서는 버튼이 아닌 것으로 읽힌다.
  const open = HS_openOpps(d);
  if (open)
    out.push({dot: "info", say: `[개요]에 아직 안 한 기회가 ${num(open)}건 있습니다.` +
        `<span class="live"> 점수가 높은 것부터 고릅니다.</span>`,
      act: p => `<button class="go${p ? "" : " sec"}"
        onclick="SM.touched=true;SM.show('overview')">기회 열기</button>`});
  return out;
}

function HS_acts(d) {
  const out = HS_todo(d);
  // 맨 앞 하나는 머리의 띠가 가져간다. 띠가 없는 조립본에서는 목록이 전부 받는다.
  const rest = window.nextStep ? out.slice(1) : out;
  // 박제본이라고 띠를 지우지 않는다 — 문장은 종이에서도 읽을 값이 있고, 누를 수
  // 없는 것만 떼는 일은 셸의 nextStep 이 한 벌로 한다(.acts 를 뗀다).
  if (window.nextStep) {
    if (out.length) {
      const top = out[0].act(true);              // 띠의 것만 주요 버튼이다
      nextStep("history", `<p>${out[0].say}</p>` +
        (top ? `<div class="acts">${top}</div>` : ""));
    } else {
      // 할 일이 없으면 마지막 실행이 언제 문제없이 끝났는지를 말하고, 다시 재는
      // 손잡이를 준다 — "할 일 없음"으로 끝나는 화면을 남기지 않는다.
      const last = HS_RUNS[0];
      nextStep("history", `<p>${last
        ? `마지막 실행은 <b>${esc(HS_ago(last.started_at))}</b> 문제없이 끝났습니다.` +
          `<span class="live"> 다시 재면 그동안 고친 것이 숫자에 섞입니다.</span>`
        : `아직 실행한 기록이 없습니다.` +
          `<span class="live"> 한 번 돌리면 여기부터 채워집니다.</span>`}</p>` +
        `<div class="acts">${HS_runAll(true)}</div>`);
    }
  }
  // 아래 목록은 다르다: 박제본에서는 그때 정한 것을 셸이 이미 채웠다. 지금 상태로
  // 다시 계산해 덮으면 "그때의 기록"이 아니게 된다.
  if (READONLY) return;
  $("acts").hidden = !rest.length;
  if (!rest.length) return;
  // 「다음 행동 다음으로 남은 것입니다」는 같은 낱말이 두 자리에서 다른 품사로 쓰여
  // (앞은 띠의 이름, 뒤는 순서) 읽다 끊긴다. 카피 정본 27c 의 정정을 따르되, 띠에는
  // 화면에 보이는 이름표가 없어서 「[다음 행동]」 대신 위치로 가리킨다.
  $("acts-title").textContent = "남은 일";
  $("acts-sub").textContent = "맨 위에 나온 것을 뺀 나머지를 위에서부터 처리합니다.";
  // 목록의 행동은 전부 보조다 — 주요 버튼은 화면에 하나(머리의 띠)뿐이다.
  $("acts-list").innerHTML = rest.map(x => {
    const a = x.act(false);
    return `<li${x.dot ? ` data-t="${x.dot}"` : ""}>${x.say}${a ? `<div class="acts">${a}</div>` : ""}</li>`;
  }).join("");
}

VIEW("history", function (d) {
  viewSub("history", "무엇이 언제 돌았고 무엇을 고쳤는지 봅니다.");
  HS_RUNS = d.runs || [];
  HS_RQ = ""; HS_RRES = ""; HS_RKIND = null; HS_RN = 12;
  HS_eyebrow("runs-eb", HS_RUNS, "started_at");
  HS_runSummary();
  HS_runTools();

  // 없는 것(옛 박제본)과 빈 것(아직 아무것도 안 고침)을 화면에서 갈라 말하지 않는다 —
  // 둘 다 "여기 쌓입니다"가 맞는 다음 걸음이다.
  HS_MADE = d.creations || [];
  HS_MQ = ""; HS_MM = "";
  HS_OPPS = HS_openOpps(d);
  // 전후 델타의 재료. 옛 박제본에는 없을 수 있다 — 그때는 못 잰다고 말한다.
  HS_DAILY = d.daily || [];
  HS_eyebrow("made-eb", HS_MADE, "created_at");
  HS_madeTools();

  // 목록이 다 선 뒤에 부른다 — 무엇이 남았는지는 위 두 목록에서 세기 때문이다.
  HS_acts(d);
});
</script>
