   등폭을 뺀 이유: 여기 담기는 건 대부분 한글 검색어다(등폭은 숫자·URL·날짜·식별자만). */

<script>
"use strict";
/* 조립하면 형제 화면들과 한 문서가 된다 — 이 파일의 전역은 전부 HS_ 로 시작한다. */

const HS_RUN_LABEL = {gsc:"서치콘솔", rank:"순위", ai:"AI 인용", keywords:"키워드",
  analysis:"기회 분석", gap:"경쟁 공백", index:"색인", report:"보고서", full:"전체"};
// runs.kind 는 대부분 단계 id 와 같은 말이다. 단계 용어표를 얹은 화면(호스팅판)에서는
// 그 한 벌을 따른다 — 안 그러면 같은 단계가 [안내]에서는 "검색 실적 수집",
// 여기서는 "서치콘솔"로 나와 같은 것인지 알 수 없다.
const HS_kind = k => ((window.SM_STAGE || {})[k] || {}).t || HS_RUN_LABEL[k] || k;
// 수집기가 notes 에 남기는 key=value 를 사람 말로. 모르는 키는 원문 그대로 둔다 —
// 새 수집기가 새 키를 남겨도 화면이 그걸 삼키면 안 된다.
const HS_NOTE_LABEL = {rows:"행", window:"기간", pages:"페이지", provider:"공급자",
  device:"기기", errors:"오류", skipped:"건너뜀", harvest_kw:"수확 키워드",
  harvest_comp:"수확 경쟁사", engines:"엔진", samples:"샘플", opps:"기회",
  domains:"도메인", inserted:"신규", candidates:"후보", mode:"방식", urls:"주소",
  checked:"검사", striking:"밀면 오를 검색어", pseo:"pSEO"};
// 마지막 수집이 이만큼 지났으면 다시 돌릴 때다. 화면 표시용 기준이지 판정이 아니다.
const HS_STALE_DAYS = 14;

// 이 화면의 명령 칩은 셸의 act() 로 못 만든다 — run 은 단계가 아니라 일괄 실행이고
// /create plan 은 다른 스킬이다. 그래도 사이트 이름은 실어야 한다: 사이트가 여럿인
// 로컬에서 이름 없는 명령은 doctor 가 어느 사이트냐고 되묻는다. 이름을 붙이는 규칙은
// 셸의 siteArg() 한 벌을 그대로 쓴다 — act() 가 만드는 칩과 같은 모양이 나온다.
const HS_cmd = (c, primary = true) =>
  `<button class="cmd${primary ? "" : " sec"}" onclick="copyCmd(this)"
    >${c}${siteArg()}</button>`;

/* 이 화면은 선언한 단계가 없다(view-def 의 stages 가 비었다) — 다음 걸음은 늘
   "전부 다시 돌리기" 하나다. 그 손잡이는 셸의 act() 가 배포에 맞춰 만든다:
   로컬은 /capture run 칩, 호스팅은 data-run="run" 버튼이고 애드온이 그걸
   runAll() 에 잇는다(stages 를 안 보내는 것이 곧 전체 실행이다). */
const HS_runAll = (primary = true) => act("run", "전체 분석 실행", primary);

function HS_ago(iso) {
  const t = Date.parse(iso);
  if (!Number.isFinite(t)) return "";
  const s = (Date.now() - t) / 1000;
  if (s < 0) return "";
  if (s < 90) return "방금";
  if (s < 3600) return `${Math.round(s / 60)}분 전`;
  if (s < 86400) return `${Math.round(s / 3600)}시간 전`;
  return `${Math.round(s / 86400)}일 전`;
}
const HS_days = iso => (Date.now() - Date.parse(iso)) / 86400000;
// 소요는 초로 적는다 — 로그의 단위이고, 표 정렬(숫자 열)이 그대로 성립한다.
function HS_secs(r) {
  const s = (Date.parse(r.finished_at) - Date.parse(r.started_at)) / 1000;
  return Number.isFinite(s) && s >= 0 ? Math.round(s) : null;
}
const HS_mmss = s => s < 60 ? `${s}초` : `${Math.floor(s / 60)}분 ${s % 60}초`;

/* ── 결과 판정: Brain 이 남긴 흔적만 읽는다. 여기서 새 사실을 만들지 않는다.
      중단은 db.run 컨텍스트가 예외를 만나면 notes 끝에 "중단: …" 로 붙여 둔 것이고,
      finished_at 이 없다는 건 그 컨텍스트조차 못 닫혔다는 뜻이다. ── */
function HS_verdict(r) {
  const n = String(r.notes || "");
  // 이유를 "기록 칸에 있다"고 가리키지 않는다 — 이제 그 칸에 이 문장과 나란히 편다.
  if (n.includes("중단:"))
    return {cls:"bad", label:"중단", why:"도중에 예외로 멈췄습니다."};
  if (r.finished_at === null)
    return {cls:"bad", label:"미완", why:"끝난 기록이 없습니다 — 프로세스가 도중에 죽었을 수 있습니다."};
  const e = +((n.match(/\berrors=(\d+)/) || [])[1] || 0);
  const k = +((n.match(/\bskipped=(\d+)/) || [])[1] || 0);
  if (e) return {cls:"bad", label:`오류 ${e}`, why:`${e}건이 실패했습니다.`};
  if (k) return {cls:"skip", label:`건너뜀 ${k}`, why:`${k}건을 건너뛰었습니다 — 보통 한도·키 없음입니다.`};
  return {cls:"ok", label:"완료", why:"끝까지 돌았고 오류가 없습니다."};
}
const HS_badge = v => `<span class="hs-r ${v.cls}" title="${esc(v.why)}">${esc(v.label)}</span>`;

function HS_notes(n) {
  if (!n) return "";
  const s = String(n), i = s.indexOf("중단:");
  const head = (i < 0 ? s : s.slice(0, i)).replace(/[|\s]+$/, "");
  const stop = i < 0 ? "" : s.slice(i + 3).trim();
  const parts = [];
  // 값에 공백이 든 것이 있다(engines=['a', 'b']) — 다음 key= 직전까지가 한 값이다.
  const rest = head.replace(/([A-Za-z_]+)=(.*?)(?=\s+[A-Za-z_]+=|$)/g, (_, k, v) => {
    const bad = (k === "errors" || k === "skipped") && +v > 0;
    parts.push(`<span class="p${bad ? " bad" : ""}">${esc(HS_NOTE_LABEL[k] || k)} ` +
               `<b>${esc(v.trim())}</b></span>`);
    return "";
  }).trim();
  if (rest) parts.push(`<span class="p free">${esc(rest)}</span>`);
  if (stop) parts.push(`<span class="p bad">중단 <b>${esc(stop)}</b></span>`);
  return `<span class="hs-nt">${parts.join("")}</span>`;
}

/* ── 수집 이력 ─────────────────────────────────────────────── */
let HS_RUNS = [], HS_RQ = "", HS_RRES = "", HS_RKIND = null, HS_RN = 12;
const HS_RES_OPT = [["", "전체"], ["ok", "완료"], ["bad", "문제"], ["skip", "건너뜀"]];

function HS_runFiltered() {
  const q = HS_RQ.trim().toLowerCase();
  return HS_RUNS.filter(r =>
    (!HS_RKIND || r.kind === HS_RKIND) &&
    (!HS_RRES || HS_verdict(r).cls === HS_RRES) &&
    (!q || `${r.kind} ${HS_kind(r.kind)} ${r.notes || ""} ${r.started_at || ""}`
             .toLowerCase().includes(q)));
}
function HS_runFind(v) { HS_RQ = v; HS_RN = 12; HS_runList(); }
function HS_runRes(v) { HS_RRES = v; HS_RN = 12; HS_runList(); }
function HS_runMore(n) { HS_RN = n; HS_runList(); }
function HS_runReset() { HS_RQ = ""; HS_RRES = ""; HS_RKIND = null; HS_runTools(); }
function HS_runKind(el) {
  HS_RKIND = HS_RKIND === el.dataset.k ? null : el.dataset.k;
  HS_runTools();
}

// 종류별 마지막 수집. runs 는 최신순으로 온다 — 처음 만난 kind 가 그 종류의 마지막이다.
// 낡은 것을 앞으로, 그 안에서는 오래 묵은 것부터. Object.keys 순서(=처음 나온 순)로 두면
// 다시 돌려야 할 종류가 멀쩡한 종류들 사이에 흩어진다.
function HS_lastBy() {
  const last = {};
  HS_RUNS.forEach(r => { if (!last[r.kind]) last[r.kind] = r; });
  return Object.keys(last)
    .map(k => ({k, r: last[k], stale: HS_days(last[k].started_at) >= HS_STALE_DAYS}))
    .sort((a, b) => (b.stale - a.stale) ||
                    (Date.parse(a.r.started_at) - Date.parse(b.r.started_at)));
}

// 요약·마지막 수집은 거르기와 무관하게 전체를 말한다 — 걸러 놓고 "총액"을 읽으면 거짓말이 된다.
function HS_runSummary() {
  // 한 번도 안 돈 로그가 "0회 · $0.000" 이라고 말하면 안 된다 — 빈 상태에 자리를 내준다.
  if (!HS_RUNS.length) return void ($("runsum").innerHTML = $("lastby").innerHTML = "");
  const bad = HS_RUNS.filter(r => HS_verdict(r).cls === "bad").length;
  const skip = HS_RUNS.filter(r => HS_verdict(r).cls === "skip").length;
  const calls = HS_RUNS.reduce((a, r) => a + (r.api_calls || 0), 0);
  const cost = HS_RUNS.reduce((a, r) => a + (r.cost_estimate_usd || 0), 0);
  const chip = (l, v, t) => `<span class="chip" title="${esc(t)}">${l} <b>${v}</b></span>`;
  $("runsum").innerHTML =
    chip("실행", `${HS_RUNS.length}회`, "이 목록에 담긴 실행 수입니다 (최근 40회까지).") +
    chip("문제", `${bad}회`, "중단·미완·오류가 있던 실행입니다.") +
    (skip ? chip("건너뜀", `${skip}회`, "일부를 건너뛴 실행입니다 — 보통 한도·키 없음입니다.") : "") +
    chip("호출", num(calls), "이 실행들이 부른 외부 API 횟수 합계입니다.") +
    chip("비용", `$${cost.toFixed(3)}`, "수집기가 적어 둔 추정치의 합계입니다 — 청구서가 아닙니다.") +
    (HS_RUNS.length ? chip("마지막", HS_ago(HS_RUNS[0].started_at),
      HS_RUNS[0].started_at) : "") + HS_staleLine();

  $("lastby").innerHTML = HS_lastBy().map(({k, r, stale}) =>
    `<div><div class="k" title="${esc(k)}">${esc(HS_kind(k))}</div>
      <div class="v">${esc((r.started_at || "").slice(0, 10))}
        <span class="ago${stale ? " stale" : ""}" title="${stale
          ? `${HS_STALE_DAYS}일 넘게 안 돌았습니다 — 다시 돌릴 때입니다.`
          : "마지막으로 이 종류를 돌린 때입니다."}">${HS_ago(r.started_at)}</span></div></div>`)
    .join("");
}

// 몇 종류가 묵었는지 한 문장으로. 요약 줄과 [다음 행동]이 같은 자리를 두 번 말하므로
// 문구는 여기 한 벌만 둔다. 웹에는 명령을 칠 곳이 없다 — 화면 위 실행 버튼을 가리킨다.
function HS_staleMsg() {
  const s = HS_lastBy().filter(x => x.stale);
  if (!s.length) return null;
  return {say: `${s.length}종류가 ${HS_STALE_DAYS}일 넘게 안 돌았습니다 (${
      s.map(x => esc(HS_kind(x.k))).join(", ")}). ` +
      "다시 재야 그동안 고친 게 숫자에 섞입니다.",
    act: p => HS_runAll(p)};
}
const HS_staleLine = () => {
  const m = HS_staleMsg();
  // 요약 줄의 칩은 늘 보조다 — 이 화면의 주요 행동은 머리의 띠가 들고 있다.
  return m ? `<div class="stale">${m.say} ${READONLY ? "" : m.act(false)}</div>` : "";
};

// 도구줄·칩은 데이터가 바뀔 때만 다시 그린다 — 매 키 입력마다 갈아치우면 찾기 칸이
// 사라져 포커스를 잃는다. 거르기는 아래 목록만 다시 그린다(HS_runList).
function HS_runTools() {
  if (!HS_RUNS.length)
    return $("runs").innerHTML = `<div class="empty">
      <b>${W("아직 수집한 적이 없습니다", "아직 실행한 적이 없습니다")}</b>
      <p>${W("한 번 돌리면 무엇을 언제 얼마에 수집했는지가 여기 줄로 남습니다.",
        "한 번 실행하면 무엇을 언제 얼마에 수집했는지가 여기 줄로 남습니다.")}</p>
      ${READONLY ? "" : `<div class="acts">${HS_runAll(false)}</div>`}</div>`;
  const counts = {};
  HS_RUNS.forEach(r => { counts[r.kind] = (counts[r.kind] || 0) + 1; });
  if (HS_RKIND && !counts[HS_RKIND]) HS_RKIND = null;   // 사이트 전환 시 잔존 필터
  const kinds = Object.keys(counts);
  const resn = c => HS_RUNS.filter(r => !c || HS_verdict(r).cls === c).length;
  const chips = kinds.length > 1
    ? `<div class="oppchips">${kinds.map(k =>
        `<button class="chip${HS_RKIND === k ? " on" : ""}" data-k="${esc(k)}"
           onclick="HS_runKind(this)" title="${esc(k)}"
           aria-pressed="${HS_RKIND === k}">${esc(HS_kind(k))}
           <b>${counts[k]}</b></button>`).join("")}</div>`
    : "";
  $("runs").innerHTML = `<div class="tools">
      <input type="search" value="${esc(HS_RQ)}" oninput="HS_runFind(this.value)"
        placeholder="종류·기록으로 찾기" aria-label="수집 이력 찾기">
      <select onchange="HS_runRes(this.value)" aria-label="결과로 거르기">${HS_RES_OPT.map(
        ([v, l]) => `<option value="${v}"${v === HS_RRES ? " selected" : ""}>${l} ` +
          `(${resn(v)})</option>`).join("")}</select>
      <span class="n" id="runn"></span>
      <span class="sp"></span>
      <button class="go sec" onclick="HS_runCsv()"
        title="지금 걸러 놓은 목록 그대로 내려받습니다">CSV 내보내기</button>
    </div>${chips}<div id="runlist"></div>`;
  HS_runList();
}

function HS_runList() {
  const list = HS_runFiltered();
  // 개수를 두 번 적지 않는다 — 결과 거르개가 이미 "완료 (12)" 로 말한다. 그 위에
  // 무엇이 더 걸렸을 때(찾는 말·종류 칩)만 몇 회가 남았는지 적는다.
  const byRes = HS_RUNS.filter(r => !HS_RRES || HS_verdict(r).cls === HS_RRES).length;
  $("runn").textContent = list.length !== byRes
    ? `${list.length}회 / 전체 ${HS_RUNS.length}회` : "";
  if (!list.length)
    return $("runlist").innerHTML = `<div class="empty"><b>거른 조건에 맞는 실행이 없습니다</b>
      <p>종류나 결과를 좁혀 놓았습니다. 조건을 풀면 전체가 다시 보입니다.</p>
      <div class="acts"><button class="go sec" onclick="HS_runReset()">조건 지우기</button>
      </div></div>`;
  const rows = list.slice(0, HS_RN).map(r => {
    const s = HS_secs(r), v = HS_verdict(r);
    return `<tr>
      <td class="when" title="${esc(r.started_at || "")}">${
        esc((r.started_at || "").replace("T", " ").slice(0, 16))}
        <span class="muted">${HS_ago(r.started_at)}</span></td>
      <td class="kwcell" title="${esc(r.kind)}">${esc(HS_kind(r.kind))}</td>
      <td>${HS_badge(v)}</td>
      <td class="num"${s !== null && s >= 60 ? ` title="${HS_mmss(s)}"` : ""}>${
        s === null ? "—" : s}</td>
      <td class="num">${num(r.api_calls || 0)}</td>
      <td class="num">${(r.cost_estimate_usd || 0) ? "$" + r.cost_estimate_usd : "—"}</td>
      <td>${HS_notes(r.notes)}${
        // 실패는 배지 글자("오류 3")만으로는 무슨 일인지 안 읽힌다 — 이유를 항상 편다.
        v.cls === "bad" ? `<div class="why">${esc(v.why)}</div>` : ""}</td>
    </tr>`;
  });
  const rest = list.length - HS_RN;
  $("runlist").innerHTML = table(
    ["시각", "종류", "결과?완료·건너뜀·문제는 수집기가 남긴 기록으로만 가릅니다",
     ">소요(초)?시작과 끝의 차이입니다. 1분이 넘으면 칸에 손을 얹어 분·초로 봅니다",
     ">호출?그 실행이 부른 외부 API 횟수",
     ">비용?수집기가 적어 둔 추정치입니다 — 청구서가 아닙니다",
     "기록?수집기가 남긴 key=value 를 옮긴 것입니다"], rows) + (rest > 0
    ? `<div class="acts" style="margin-top:14px">
         <button onclick="HS_runMore(${HS_RN + 20})">${rest}회 더 보기</button></div>`
    : "");
}

function HS_runCsv() {
  csv("수집이력", [["시각", "종류", "결과", "소요(초)", "호출", "비용(USD)", "기록"]]
    .concat(HS_runFiltered().map(r => [r.started_at, HS_kind(r.kind),
      HS_verdict(r).label, HS_secs(r) ?? "", r.api_calls || 0,
      r.cost_estimate_usd || 0, r.notes || ""])));
}

/* ── 고친 것 ──────────────────────────────────────────────── */
let HS_MADE = [], HS_MQ = "", HS_MM = "", HS_DAILY = [];

/* ── 좋아졌나 ──────────────────────────────────────────────
      이 화면은 회고인데 결론이 없었다: 고친 목록을 늘어놓고 "숫자로 돌아왔는지는
      [개요]가 답합니다"라며 남에게 넘겼다. 재료는 같은 페이로드에 이미 실려 온다
      (d.daily — 일별 클릭·노출). 고친 날 앞뒤 하루 평균 클릭을 그 줄에 붙인다.
      새 SQL 은 없다.
      인과가 아니다: 같은 기간에 다른 것도 바뀐다. 그래서 "덕분에"라고 쓰지 않고,
      전후 어느 쪽이든 날이 모자라면 숫자를 지어내지 않고 모자라다고 말한다. ── */
const HS_EFF_WIN = 7;   // 앞뒤로 볼 날 수 — 7일이면 요일 편차가 한 바퀴 돌아 상쇄된다
const HS_EFF_MIN = 3;   // 이보다 짧은 쪽이 있으면 평균이라 부를 수 없다

function HS_effect(created) {
  const day = String(created || "").slice(0, 10);
  if (!day || !HS_DAILY.length) return null;
  if (day < HS_DAILY[0].date) return {old: true};   // 일별 기록이 닿지 않는 옛날 수정
  const before = HS_DAILY.filter(r => r.date < day).slice(-HS_EFF_WIN);
  const after = HS_DAILY.filter(r => r.date >= day).slice(0, HS_EFF_WIN);
  if (before.length < HS_EFF_MIN || after.length < HS_EFF_MIN) return {short: true};
  const avg = a => a.reduce((s, r) => s + (r.clicks || 0), 0) / a.length;
  const b = avg(before), f = avg(after);
  return {b, f, d: f - b, nb: before.length, nf: after.length};
}

function HS_effLine(c) {
  const e = HS_effect(c.created_at);
  if (!e) return "";
  if (e.old)
    return `<div class="eff" title="일별 클릭은 최근 ${HS_DAILY.length}일치만 남습니다."
      >일별 기록이 닿지 않는 날입니다 — 전후를 못 잽니다</div>`;
  if (e.short)
    return `<div class="eff" title="고친 날 앞뒤로 각각 ${HS_EFF_MIN}일 이상 있어야 잽니다."
      >아직 판단할 날이 모자랍니다</div>`;
  const one = n => n.toFixed(1);
  return `<div class="eff${e.d > 0 ? " up" : e.d < 0 ? " down" : ""}"
    title="고친 날 앞 ${e.nb}일과 뒤 ${e.nf}일의 하루 평균 클릭입니다 — 같은 기간에 다른 것도
바뀌므로 이 수정만의 몫이라는 뜻은 아닙니다."
    >고친 뒤 하루 평균 클릭 <b>${one(e.b)}</b> → <b>${one(e.f)}</b>
    (${e.d >= 0 ? "+" : "−"}${one(Math.abs(e.d))})</div>`;
}

/* 루프의 반대쪽 끝 — 이 수정을 낳은 기회 카드로 데려간다. 기회 id 는 페이로드에 이미
   실려 온다(opportunity_id). 대상 문자열은 data- 로 넘긴다: onclick 문자열에 박으면
   따옴표 든 검색어에서 깨진다. 개요는 점수 높은 순 8건만 펼쳐 두므로 대상으로 먼저
   걸러야 그 카드가 목록에 남는다. */
function HS_toOpp(el) {
  SM.show("overview");
  if (window.oppReset) oppReset();      // 남아 있던 거르기가 그 카드를 숨길 수 있다
  const t = el.dataset.t || "";
  const box = document.querySelector("#opps input[type=search]");
  if (box && window.oppFind) { box.value = t; oppFind(t); }
  const card = document.querySelector(`#opplist [data-opp="${+el.dataset.o}"]`);
  if (!card) return;                    // 지운 기회·옛 박제본이면 카드가 없다 — 개요까지만
  card.open = true;
  card.scrollIntoView({behavior: "smooth", block: "center"});
}

// 병합 전만 남기고 그 자리로 데려간다 — 목록 위 칩과 [다음 행동]이 같은 손잡이를 쓴다.
function HS_showUnmerged() {
  HS_MM = "n";
  HS_madeTools();                       // 거르개(select)도 같이 "병합 전"으로 맞춰진다
  $("made-sec").scrollIntoView({behavior: "smooth", block: "start"});
}

function HS_madeFiltered() {
  const q = HS_MQ.trim().toLowerCase();
  return HS_MADE.filter(c =>
    (!HS_MM || (HS_MM === "y") === !!c.merged) &&
    (!q || `${c.file_path} ${c.branch || ""} ${c.note || ""} ${c.opp_target || ""}`
             .toLowerCase().includes(q)));
}
function HS_madeFind(v) { HS_MQ = v; HS_madeList(); }
function HS_madeMerged(v) { HS_MM = v; HS_madeList(); }
function HS_madeReset() { HS_MQ = ""; HS_MM = ""; HS_madeTools(); }

function HS_madeRow(c) {
  // kind 한국어 라벨의 정본은 scoring.py(KINDS 명부) — payload 의 kind_labels 로 온다.
  // 여기는 대상 없이 kind 만 아는 자리라 통칭을 쓴다(밴드별 라벨은 못 낸다).
  const label = (window.KIND_LABELS || {})[c.kind] || c.kind || "수동 작업";
  return `<div class="mk">
    <div>
      <div class="mh">
        <span class="kind" title="${esc(c.kind || "수동 브리프")}">${esc(label)}</span>
        <span class="dt">${esc((c.created_at || "").slice(0, 10))}</span>
        ${c.branch ? `<span class="br">${esc(c.branch)}</span>` : ""}
      </div>
      <div class="path">${esc(c.file_path)}</div>
      ${c.opp_target
        ? `<button class="from" data-o="${esc(c.opportunity_id)}"
             data-t="${esc(c.opp_target)}" onclick="HS_toOpp(this)"
             title="이 수정을 낳은 기회입니다 (기회 #${esc(c.opportunity_id)}) — 누르면 [개요]의 그 카드로 갑니다"
             >← ${esc(c.opp_target)}</button>` : ""}
      ${c.note ? (c.note.startsWith("http")
        ? `<div class="why"><a href="${esc(c.note)}" target="_blank" rel="noopener">${esc(c.note)}</a></div>`
        : `<div class="why">${esc(c.note)}</div>`) : ""}
      ${HS_effLine(c)}
    </div>
    <span class="hs-r ${c.merged ? "ok" : "skip"}" title="${c.merged
      ? "사이트에 반영됐습니다. 다음 수집부터 이 수정이 숫자에 섞입니다."
      : "아직 사이트에 반영되지 않았습니다. 반영해야 검색엔진이 이 수정을 봅니다."}"
      >${c.merged ? "병합됨" : "병합 전"}</span>
  </div>`;
}

function HS_madeTools() {
  if (!HS_MADE.length)
    return $("made").innerHTML = `<div class="empty">
      <b>${W("아직 고친 기록이 없습니다", "아직 반영된 콘텐츠 변경이 없습니다")}</b>
      <p>${W(`${window.go("overview")}에서 고른 기회를 실제 파일 수정으로 옮기면 ` +
        "여기 쌓이고, 고친 뒤 클릭이 어떻게 됐는지가 줄마다 붙습니다.",
        `${window.go("overview")}에서 기회 카드를 펼쳐 [콘텐츠 작성]을 누르면 ` +
        "여기 쌓이고, 반영 뒤 클릭이 어떻게 됐는지가 줄마다 붙습니다.")}</p>
      ${READONLY ? "" : `<div class="acts">${W(HS_cmd("/create plan", false),
        `<button class="go sec" onclick="SM.touched=true;SM.show('overview')"
          >개선 기회 보기</button>`)}</div>`}</div>`;
  const mn = v => HS_MADE.filter(c => !v || (v === "y") === !!c.merged).length;
  // 병합 전 건수는 거르개 옵션 라벨 안에만 있었다 — 이 화면에서 지금 당장 할 수 있는
  // 유일한 일인데 드롭다운을 열어야 보였다. 머리로 올린다.
  const un = mn("n");
  $("made").innerHTML = (un ? `<div class="oppchips"><button class="chip"
      onclick="HS_showUnmerged()"
      title="아직 사이트에 반영되지 않았습니다. 반영해야 검색엔진이 봅니다. 눌러서 그것만 봅니다."
      >병합 전 <b>${un}건</b></button></div>` : "") + `<div class="tools">
      <input type="search" value="${esc(HS_MQ)}" oninput="HS_madeFind(this.value)"
        placeholder="파일·기회·근거로 찾기" aria-label="고친 것 찾기">
      <select onchange="HS_madeMerged(this.value)" aria-label="병합 상태로 거르기">${
        [["", "전체"], ["n", "병합 전"], ["y", "병합됨"]].map(([v, l]) =>
          `<option value="${v}"${v === HS_MM ? " selected" : ""}>${l} (${mn(v)})</option>`
        ).join("")}</select>
      <span class="n" id="maden"></span>
      <span class="sp"></span>
      <button class="go sec" onclick="HS_madeCsv()"
        title="지금 걸러 놓은 목록 그대로 내려받습니다">CSV 내보내기</button>
    </div><div id="madelist"></div>`;
  HS_madeList();
}

function HS_madeList() {
  const list = HS_madeFiltered();
  $("maden").textContent = list.length === HS_MADE.length
    ? `${HS_MADE.length}건` : `${list.length}건 / 전체 ${HS_MADE.length}건`;
  if (!list.length)
    return $("madelist").innerHTML = `<div class="empty"><b>거른 조건에 맞는 기록이 없습니다</b>
      <p>파일이나 병합 상태를 좁혀 놓았습니다. 조건을 풀면 전체가 다시 보입니다.</p>
      <div class="acts"><button class="go sec" onclick="HS_madeReset()">조건 지우기</button>
      </div></div>`;
  const linked = HS_MADE.filter(c => c.opportunity_id).length;
  // 회고의 결론은 이 화면이 낸다 — 줄마다 붙인 전후 델타를 여기서 합쳐 말한다.
  const eff = HS_MADE.map(c => HS_effect(c.created_at));
  const up = eff.filter(e => e && e.d > 0).length;
  const down = eff.filter(e => e && e.d < 0).length;
  const same = eff.filter(e => e && e.d === 0).length;
  const cant = eff.filter(e => !e || e.old || e.short).length;
  // 잰 것과 못 잰 것을 갈라 적는다 — 합이 안 맞으면 어느 쪽이 빠졌는지 읽는 사람이 못 센다.
  const bits = [`오른 것 ${up}건`, `내린 것 ${down}건`];
  if (same) bits.push(`그대로 ${same}건`);
  const verdict = !HS_DAILY.length
    ? "일별 클릭 기록이 아직 없어 전후를 못 잽니다 — 서치콘솔을 한 번 더 읽으면 " +
      "줄마다 붙습니다."
    : (up + down + same)
      ? `고친 날 앞뒤 ${HS_EFF_WIN}일 하루 평균 클릭으로 보면 잴 수 있는 ${
          up + down + same}건 중 ${bits.join(", ")}입니다${cant
          ? `. 나머지 ${cant}건은 아직 잴 날이 없습니다` : ""}. ` +
        "같은 기간에 다른 것도 바뀌므로 이 수정들만의 몫은 아닙니다."
      : `아직 전후를 잰 건이 없습니다 — 고친 날 앞뒤로 각각 ${HS_EFF_MIN}일 이상 ` +
        "일별 기록이 있어야 잽니다.";
  $("madelist").innerHTML = list.map(HS_madeRow).join("") +
    `<div class="loop"><b>한 바퀴</b> — 서치콘솔에서 재고, 기회로 뽑고, 이 ${
      HS_MADE.length}건을 고쳤습니다${linked
      ? ` (그중 ${linked}건은 뽑아 둔 기회에서 곧장 왔습니다)`
      : ""}. ${verdict}</div>`;
}

function HS_madeCsv() {
  csv("고친것", [["작성일", "종류", "파일", "브랜치", "병합", "기회", "근거"]]
    .concat(HS_madeFiltered().map(c => [c.created_at,
      (window.KIND_LABELS || {})[c.kind] || c.kind || "", c.file_path, c.branch || "",
      c.merged ? "병합됨" : "병합 전", c.opp_target || "",
      (c.note || "").replace(/\s+/g, " ")])));
}

/* ── 다음 행동 ─────────────────────────────────────────────
      이 섹션은 view-def 가 화면 구성요소로 선언해 놓고도 라이브에서는 영영 hidden
      이었다 — 여는 코드가 셸의 __SNAPSHOT__ 분기 하나뿐이라, 박제본에만 보이고 정작
      매일 여는 대시보드에는 안 나왔다. 같은 #acts-list 를 여기서 채운다.
      새 판정은 만들지 않는다: 안 한 단계는 안내(stage.py)가 이미 고른 것을 그대로 쓰고
      (d.guide.here), 명령도 그 단계가 들고 있는 cmd 를 가리킨다.
      역할을 가른다: 맨 앞 하나는 화면 머리의 [다음 행동] 띠가 가져가고, 이 목록은
      그 뒤에 남은 것만 받는다. 둘 다 같은 문장을 읽으면 어느 쪽이 지금 할 일인지
      알 수 없다. ── */
function HS_todo(d) {
  const out = [];
  const g = d.guide || {}, steps = g.steps || [];
  const next = g.here >= 0 ? steps[g.here] : null;
  if (next)
    out.push({say: `${W("아직 안 한 단계가 있습니다", "아직 실행하지 않은 단계가 있습니다")}. ` +
      `다음은 <b>${esc(next.t)}</b>입니다${next.state ? ` (${esc(next.state)})` : ""}.`,
      act: p => W(next.cmd
        ? `<button class="cmd${p ? "" : " sec"}" onclick="copyCmd(this)"
            >${esc(next.cmd)}</button>`
        : "", HS_runAll(p))});
  const stale = HS_staleMsg();          // 문구 한 벌 — 요약 줄과 여기가 같은 것을 쓴다
  if (stale) out.push(stale);
  const un = HS_MADE.filter(c => !c.merged).length;
  if (un)
    out.push({say: `${un}건이 아직 사이트에 반영되지 않았습니다(병합 전). ` +
        "반영해야 검색엔진이 그 수정을 봅니다.",
      act: p => `<button class="go${p ? "" : " sec"}"
        onclick="HS_showUnmerged()">병합 전만 보기</button>`});
  // 화면을 넘기는 손잡이도 버튼 계약을 따른다 — window.go 는 문장 안에 섞이는
  // 밑줄 링크(.gov)라 .acts 안에서는 버튼이 아닌 것으로 읽힌다.
  if (d.opps_total)
    out.push({say: `${W("아직 안 한 기회", "미처리 개선 기회")} ${num(d.opps_total)}건이 ` +
        "남아 있습니다. 점수가 높은 것부터 고릅니다.",
      act: p => `<button class="go${p ? "" : " sec"}"
        onclick="SM.touched=true;SM.show('overview')"
        >${W("기회 고르기", "개선 기회 보기")}</button>`});
  return out;
}

function HS_acts(d) {
  const out = HS_todo(d);
  // 맨 앞 하나는 머리의 띠가 가져간다. 띠가 없는 조립본에서는 목록이 전부 받는다.
  const rest = window.nextStep ? out.slice(1) : out;
  // 박제본이라고 띠를 지우지 않는다 — 문장은 종이에서도 읽을 값이 있고, 누를 수
  // 없는 것만 떼는 일은 셸의 nextStep 이 한 벌로 한다(.acts 를 뗀다).
  if (window.nextStep) {
    const top = out[0] && out[0].act(true);     // 띠의 것만 주요 버튼이다
    nextStep("history", out.length
      ? `<p>${out[0].say}</p>${top ? `<div class="acts">${top}</div>` : ""}`
      : `<p>${W("지금 이 화면에서 할 일은 없습니다. 아래는 여태 돌린 기록입니다.",
          "지금 이 화면에서 할 일은 없습니다. 아래는 여태 실행한 기록입니다.")}</p>`);
  }
  // 아래 목록은 다르다: 박제본에서는 그때 정한 것을 셸이 이미 채웠다. 지금 상태로
  // 다시 계산해 덮으면 "그때의 기록"이 아니게 된다.
  if (READONLY) return;
  $("acts").hidden = !rest.length;
  if (!rest.length) return;
  $("acts-eyebrow").textContent = W("그다음에 남은 것", "이어서 남은 조치");
  $("acts-title").textContent = W("이 기록이 말하는 남은 일", "남은 조치");
  $("acts-sub").textContent = W("띠가 가리키는 것 다음으로 남은 일입니다. 위에서부터 처리합니다.",
    "권장 조치 다음으로 남은 항목입니다. 위에서부터 처리합니다.");
  // 목록의 행동은 전부 보조다 — 주요 버튼은 화면에 하나(머리의 띠)뿐이다.
  $("acts-list").innerHTML = rest.map(x => {
    const a = x.act(false);
    return `<li>${x.say}${a ? `<div class="acts">${a}</div>` : ""}</li>`;
  }).join("");
}

VIEW("history", function (d) {
  HS_RUNS = d.runs || [];
  HS_RQ = ""; HS_RRES = ""; HS_RKIND = null; HS_RN = 12;
  HS_runSummary();
  HS_runTools();

  // 없는 것(옛 박제본)과 빈 것(아직 아무것도 안 고침)을 화면에서 갈라 말하지 않는다 —
  // 둘 다 "여기 쌓입니다"가 맞는 다음 걸음이다.
  HS_MADE = d.creations || [];
  HS_MQ = ""; HS_MM = "";
  // 전후 델타의 재료. 옛 박제본에는 없을 수 있다 — 그때는 못 잰다고 말한다.
  HS_DAILY = d.daily || [];
  HS_madeTools();

  // 목록이 다 선 뒤에 부른다 — 무엇이 남았는지는 위 두 목록에서 세기 때문이다.
  HS_acts(d);
});
</script>
