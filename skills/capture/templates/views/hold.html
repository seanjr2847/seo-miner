"use strict";
/* ── 고치기 전 → 지금 ──────────────────────────────────────────
      관찰 중에 볼 것은 "고친 뒤 달라졌나"다. 전·후는 서버가 한 벌로 고른다
      (db.before_after — 완료 후 관찰 표와 같다): 고친 날까지의 마지막 수집분과 그 뒤 최신
      수집분. 지금 값의 실적 창에 고치기 전 날이 며칠 섞였는지(pre_days)를 같이 말한다 —
      그게 0 이 되기 전의 비교는 반쪽이다. */
let HD_PER = null;            // 실적 창 길이(일) — 페이로드의 gsc_period
let HD_OBS = null;            // 관찰 기간(일) — 페이로드의 observe_days
let HD_CTX = { hs: [], byId: {}, sort: {} };
let HD_BOUND = false;
const HD_md = s => String(s || "").slice(5);
// 알약 안은 한 덩어리다 — 칩이 flex 라 자식마다 사이가 벌어진다.
const HD_pill = (cls, html) => `<span class="chip ${cls}"><span>${html}</span></span>`;
// 변화 알약 — 순위는 작을수록 좋다. 올랐으면 up, 내렸으면 dn, 같거나 흔들리면(thin — 서버 판정) ne.
function HD_posPill(b, a, thin) {
  const d = Math.round((b - a) * 10) / 10;
  if (!d) return HD_pill("ne", "그대로");
  return HD_pill(thin ? "ne" : d > 0 ? "up" : "dn",
    `<span class="v">${d > 0 ? "▲" : "▼"} ${Math.abs(d)}</span>칸 ${d > 0 ? "올라감" : "내려감"}`);
}
function HD_numPill(b, a, unit) {
  const d = a - b;
  if (!d) return HD_pill("ne", "그대로");
  return HD_pill(d > 0 ? "up" : "dn", `<span class="v">${d > 0 ? "+" : "−"}${num(Math.abs(d))}</span>${unit || ""}`);

// 접힌 줄의 한 줄 — 순위·클릭만.
function HD_baLine(x) {
  if (!x || !x.after) return `<div class="hd-ba1">고친 뒤 수집한 실적이 아직 없습니다.</div>`;
  const b = x.before, a = x.after;
  const m = v => v ? `<span class="v">${v.position}</span>위 · 클릭 <span class="v">${num(v.clicks)}</span>` : "—";
  return `<div class="hd-ba1"><span>고치기 전 ${m(b)} → 지금 ${m(a)}</span>${b ? HD_posPill(b.position, a.position, x.thin) : ""}${
    x.thin ? `<span>노출이 적어 순위는 흔들립니다</span>` : ""}</div>`;
}
// 전·후 비교 아래의 주석 — 어느 쪽이 비었는지, 실적 창에 고치기 전 날이 며칠 섞였는지, 흔들림.
function HD_note(x) {
  const b = x.before, a = x.after;
  const note = !a ? "고친 뒤 수집한 실적이 아직 없습니다 — 다음 수집부터 '지금'이 찹니다."
    : !b ? "고치기 전 수집분에 이 대상이 없습니다(노출이 없었거나 수집 전) — '지금'만 봅니다."
    : x.pre_days > 0 ? `'지금'의 실적${HD_PER ? `(${HD_PER}일)` : ""} 중 ${x.pre_days}일이 고치기 전입니다 — 관찰이 끝날 때쯤 온전한 비교가 됩니다.`
    : `'지금'의 실적${HD_PER ? `(${HD_PER}일)` : ""}이 전부 고친 뒤입니다.`;
  const thin = x.thin ? " 노출이 적은 쪽이 있어 순위 변화는 흔들림일 수 있습니다 — 노출·클릭을 먼저 봅니다." : "";
  return note + thin;

// 순위 자 — 작을수록 좋아서 막대 길이로 그리면 거꾸로 읽힌다. 1위가 왼쪽인 자 위에 전·후 점 둘.
// 눈금 끝은 10위 또는 두 값 중 큰 쪽.
function HD_scale(pb, pa, thin) {
  const end = Math.max(10, Math.ceil(Math.max(pb || 0, pa || 0)));
  const at = p => Math.min(100, Math.max(0, (p - 1) / (end - 1) * 100));
  const d = pb != null && pa != null ? Math.round((pb - pa) * 10) / 10 : 0;
  const seg = d ? `<span class="sg ${thin ? "ne" : d > 0 ? "" : "dn"}" style="left:${Math.min(at(pb), at(pa))}%;width:${Math.abs(at(pb) - at(pa))}%"></span>` : "";
  return `<div class="hd-scale" aria-hidden="true">${seg}${pb != null ? `<i style="left:${at(pb)}%"></i>` : ""}${
    pa != null ? `<i class="now" style="left:${at(pa)}%"></i>` : ""}</div>
    <div class="hd-sc-t" aria-hidden="true"><span>1위</span><span>${end}위</span></div>`;
}
// 전·후 비교의 몸 — 노출·클릭·클릭률은 쌍 막대, 순위는 자 위의 두 점. 표 시맨틱은 role 로 둔다.
function HD_cmp(x, what) {
  if (!x || (!x.before && !x.after)) return `<p class="none">${esc(what)}의 실적이 수집분에 없습니다.</p>`;
  const b = x.before, a = x.after;
  const tip = (t, why) => `${esc(t)}<span class="hint" tabindex="0" data-tip="${esc(why)}" aria-label="${esc(why)}">i</span>`;
  const head = `<div class="hd-cr hd-hd" role="row"><span role="columnheader">항목</span>
    <div class="lg"><span class="k" role="columnheader">${tip(`고치기 전 (${b ? HD_md(b.date) : "없음"})`, "고친 날까지의 마지막 수집분")}</span>
    <span class="k" role="columnheader">${tip(`지금 (${a ? HD_md(a.date) : "없음"})`, "고친 뒤 최신 수집분")}</span></div>
    <span class="chg" role="columnheader">변화</span></div>`;
  const pair = (name, get, fmt, chg) => {
    const vb = b ? get(b) : null, va = a ? get(a) : null;
    const mx = Math.max(vb || 0, va || 0) || 1;
    const one = (cls, tag, val) => `<div class="hd-br ${cls}"><span class="t">${tag}</span>
      <span class="tr"><i style="width:${val == null ? 0 : Math.max(2, val / mx * 100)}%"></i></span>
      <span class="n">${val == null ? "—" : fmt(val)}</span></div>`;
    return `<div class="hd-cr" role="row"><span class="nm" role="rowheader">${name}</span>
      <div class="hd-vis" role="cell">${one("was", "전", vb)}${one("now", "지금", va)}</div>
      <span class="chg" role="cell">${b && a ? chg() : ""}</span></div>`;
  };
  const rank = () => {
    const pb = b ? b.position : null, pa = a ? a.position : null;
    return `<div class="hd-cr" role="row"><span class="nm" role="rowheader">평균 순위</span>
      <div class="hd-vis" role="cell"><div class="hd-rk"><span class="was">${pb != null ? `<span class="v">${pb}</span>위` : "—"}</span>
        <span class="now">${pa != null ? `지금 <span class="v">${pa}</span>위` : "—"}</span></div>${HD_scale(pb, pa, x.thin)}</div>
      <span class="chg" role="cell">${b && a ? HD_posPill(b.position, a.position, x.thin) : ""}</span></div>`;
  };
  const rate = m => m.impressions ? m.clicks * 100 / m.impressions : null;
  const rows = rank()
    + pair("노출", m => m.impressions, n => num(n), () => HD_numPill(b.impressions, a.impressions))
    + pair("클릭", m => m.clicks, n => num(n), () => HD_numPill(b.clicks, a.clicks))
    + pair("클릭률", rate, n => n.toFixed(1) + "%", () => {
        const d = Math.round(((rate(a) || 0) - (rate(b) || 0)) * 10) / 10;
        return !d ? HD_pill("ne", "그대로")
          : HD_pill(d > 0 ? "up" : "dn", `<span class="v">${d > 0 ? "+" : "−"}${Math.abs(d)}</span>%p`);
      });
  return `<div class="hd-cmp" role="table" aria-label="${esc(what)} 고치기 전과 지금">${head}${rows}</div>
    <p class="hd-nt">${HD_note(x)}</p>`;
}
// 화면에 그릴 수 있는 뺀 기회 — 페이로드에 실린 것(d.opps) 중 셸의 [관찰 중] 묶음. 띠·카드·[개요]가
// 같은 수를 말하도록 세는 곳도 이 하나다.
const HD_shown = (h, byId) => (h.opp_ids || []).map(id => byId[id]).filter(o => window.oppStMatch(o, "hold"));
// 순위 변화 — 올라간 칸(클수록 좋다). 전·후 중 하나라도 없으면 맨 뒤.

function HD_rows(list, mode) {
  const ord = list.slice();

  else ord.sort((p, q) => (q.score || 0) - (p.score || 0));
  // 줄은 한 줄 요약뿐이다. 누르면 펼쳐지지 않고 오른쪽 서랍(SM.drawer)이 열린다 — 개요와 같다.
  // <details> 를 그대로 둔 건 접힌 줄의 격자·칩 CSS 를 빌리기 위해서고, 토글은 HD_bind 가 막는다.

      <summary>${oppScore(o)}<div>${window.oppWhy(o)}${HD_baLine(o.hold)}</div></summary></details>`).join("");

// 서랍 — 줄 하나의 전·후 비교와 할 일 패널. 기회가 [관찰 중] 묶음에서 빠지면(상태를 바꿨다) 닫는다.

function HD_drOpen(id, from) {

    HD_DR = null;
    document.querySelectorAll("#holds .hd-ol .opp.hd-on").forEach(row => row.classList.remove("hd-on"));
    // 상태를 바꿨으면 목록이 다시 그려져 연 줄이 없다 — 같은 줄을 다시 찾아 초점을 돌려준다.

// 다시 그려진 화면에 맞춘다 — 같은 기회가 아직 [관찰 중]이면 새 값으로 칠하고, 아니면 닫는다.
function HD_drSync() {
  if (HD_DR == null) return;
  const o = HD_CTX.byId[HD_DR];

const HD_av = (page, i, sm) => {
  const t = urlPath(page).replace(/^\/+/, "").match(/[^\W_]/u);
  return `<span class="hd-av a${i % 3}${sm ? " sm" : ""}" aria-hidden="true">${esc(t ? t[0].toUpperCase() : "/")}</span>`;
};
const HD_days = (s, u) => Math.round((Date.parse(u) - Date.parse(s)) / 864e5);
const HD_left = h => Number.isFinite(h.days_left) ? h.days_left : null;
// 관찰 길이(일)와 지난 비율 — 서버가 준 observe_days, 없으면 시작~끝 날짜.
function HD_prog(h) {
  const total = HD_OBS || (h.since && h.until ? HD_days(h.since, h.until) : 0);
  const left = HD_left(h);
  const pct = left != null && total > 0 ? Math.min(100, Math.max(0, (total - left) / total * 100)) : null;
  return { total, left, pct };
}
// 현황판 한 덩어리 — 누구 · 며칠 남았나 · 순위와 클릭이 어느 쪽인가, 그 아래 관찰 트랙(주 단위 눈금).
function HD_row(h, i, byId) {

    : b ? `${HD_posPill(b.position, a.position, x.thin).replace("<span>", "<span>순위 ")}${

  const nw = (h.works || []).length, no = HD_shown(h, byId).length;

  const ticks = total > 0 ? Array.from({ length: Math.floor((total - 1) / 7) }, (_, k) =>
    `<i class="tk" style="left:${((k + 1) * 7 / total * 100).toFixed(2)}%"></i>`).join("") : "";
  const at = pct == null ? 0 : Math.min(92, Math.max(8, pct));
  return `<div class="hd-row" data-hd-go="${i}">${HD_av(h.page, i)}
    <div class="hd-who"><button type="button" class="hd-jump" data-hd-go="${i}"
      aria-label="${esc(urlPath(h.page))} 상세로 이동">${esc(urlPath(h.page))}</button>
      <span class="hd-meta">작업 ${nw}건${no ? ` · 뺀 기회 ${no}건` : ""}</span></div>
    <div class="hd-chg">${chg}</div>
    <div class="hd-left">${left != null ? `<span class="v">${left}</span>일 남음` : "—"}</div>
    <div class="hd-track"${label ? ` role="img" aria-label="${esc(label)}"` : ""}>
      <div class="hd-bar">${pct == null ? "" : `<i class="f" style="width:${pct.toFixed(1)}%"></i>`}${ticks}</div>
      <div class="hd-ax"><span>${esc(HD_md(h.since))} 시작</span>${pct == null ? "" : `<span class="mk" style="left:${at}%">오늘</span>`}
        <span class="hd-day">${esc(HD_md(h.until))} 종료</span></div></div></div>`;

// 페이지 상세 — [전·후 비교 | 한 작업] 아래에 [뺀 기회 표].
function HD_card(h, byId, i) {

    <div class="hd-g hdp-g">

        <p class="hd-cs">이 페이지 전체의 검색 실적${HD_PER ? ` · 구글 실적 ${HD_PER}일 기준` : ""}</p></div></div>${HD_cmp(h.perf, "이 페이지")}</article>
      <article class="card c5"><div class="hd-ch"><div><h3 class="hd-ct">한 작업</h3>
        <p class="hd-cs">이 페이지에 기록한 수정 ${(h.works || []).length}건</p></div></div>
        <ol class="hd-wk">${works}</ol>
        <p class="hd-wf"><b>${esc(HD_md(h.until))}에 관찰이 끝납니다</b>마지막으로 고친 ${esc(HD_md(h.since))}부터 ${total ? `${total}일 동안` : ""} 지켜보고, 끝나면 이 페이지의 기회가 할 일 목록으로 돌아옵니다.</p></article>
      <article class="card c12"><div class="hd-ch"><div><h3 class="hd-ct">지켜보는 동안 뺀 기회 ${opps.length}건${more > 0 ? ` · 화면 목록 밖 ${more}건` : ""}</h3>
        <p class="hd-cs">관찰이 끝나면 할 일 목록으로 돌아옵니다.</p></div>${sortBar}</div>

      </article>
    </div></div>`;
}

/* ── 위쪽 카드: 모든 페이지를 한 줄로 요약한다 ──────────────────────
   페이지가 여러 곳이면 순위는 페이지 평균, 클릭·노출은 합이다. 전·후가 다 있는 페이지만 센다. */
function HD_agg(hs, byId) {
  const A = { n: hs.length, opps: 0, ps: [], cb: 0, ca: 0, ib: 0, ia: 0, thin: false, both: 0,
    post: 0, pre: 0, win: 0, first: null, per: [] };
  for (const pg of hs) {
    A.opps += HD_shown(pg, byId).length;
    if (!A.first || (HD_left(pg) ?? 1e9) < (HD_left(A.first) ?? 1e9)) A.first = pg;
    const pf = pg.perf, pb = pf && pf.before, pa = pf && pf.after;
    if (pb && pa) {
      A.both++; A.ps.push([pb.position, pa.position]);
      A.cb += pb.clicks; A.ca += pa.clicks; A.ib += pb.impressions; A.ia += pa.impressions;
      if (pf.thin) A.thin = true;
    }
    if (HD_PER && pa && Number.isFinite(pf.pre_days)) {
      const pre = Math.min(HD_PER, Math.max(0, pf.pre_days));
      A.pre += pre; A.post += HD_PER - pre; A.win += HD_PER;
      A.per.push({ pg, pre, post: HD_PER - pre });
    }
  }
  const mean = k => Math.round(A.ps.reduce((s, p) => s + p[k], 0) / A.ps.length * 10) / 10;
  A.pos = A.ps.length ? [mean(0), mean(1)] : null;
  return A;
}
function HD_kpiCard(title, chip, big, unit, vis, sub) {

    <div class="hd-kv"><b>${big}</b>${unit ? `<span>${unit}</span>` : ""}</div>
    <div class="hd-kx">${vis}</div><p class="hd-cs">${sub}</p></article>`;
}
function HD_kpis(A) {

  const end = HD_kpiCard(multi ? "가장 먼저 끝나는 관찰" : "관찰 끝까지",
    HD_pill("ne", `<span class="hd-day">${esc(HD_md(f.until))}</span> 종료`),
    pr.left != null ? pr.left : "—", pr.left != null ? "일 남음" : "",
    pr.pct == null ? "" : `<div class="hd-bar" role="img" aria-label="관찰 ${pr.total}일 중 ${Math.round(pr.total - pr.left)}일 지남"><i class="f" style="width:${pr.pct.toFixed(1)}%"></i></div>`,
    pr.pct == null ? who : `${who} · ${pr.total}일 관찰 중 ${Math.round(pr.total - pr.left)}일 지남`);
  const rk = A.pos ? HD_kpiCard("평균 순위", HD_posPill(A.pos[0], A.pos[1], A.thin),
      A.pos[1], "위", HD_scale(A.pos[0], A.pos[1], A.thin),
      `고치기 전 ${A.pos[0]}위${multi ? " · 페이지 평균" : ""}${A.thin ? " · 노출이 적어 흔들립니다" : ""}`)
    : HD_kpiCard("평균 순위", HD_pill("ne", "비교 전"), "—", "", "", "고친 뒤 수집한 실적이 아직 없습니다.");
  const mx = Math.max(A.cb, A.ca) || 1;
  const mini = (cls, t, v) => `<div class="hd-mini ${cls}"><span>${t}</span><span class="tr"><i style="width:${Math.max(2, v / mx * 100)}%"></i></span></div>`;
  const ck = A.both ? HD_kpiCard("클릭", HD_numPill(A.cb, A.ca, ""), num(A.ca), "회",
      mini("was", "전", A.cb) + mini("now", "지금", A.ca),
      `고치기 전 ${num(A.cb)}회 · 노출 ${num(A.ib)} → ${num(A.ia)}`)
    : HD_kpiCard("클릭", HD_pill("ne", "비교 전"), "—", "", "", "고친 뒤 수집한 실적이 아직 없습니다.");
  const avs = A.opps ? `<div class="hd-avs">${hsAvs(A)}</div>` : "";
  const oc = HD_kpiCard("뺀 기회", HD_pill("ne", `페이지 ${A.n}곳`), A.opps, "건", avs,
    "관찰이 끝나면 할 일 목록으로 돌아옵니다.");
  return end + rk + ck + oc;
}
// 뺀 기회 카드의 시각 — 페이지마다 아바타와 건수.
function hsAvs(A) {
  return HD_CTX.hs.map((pg, i) => `<span class="q">${HD_av(pg.page, i, true)}<span class="v">${
    HD_shown(pg, HD_CTX.byId).length}</span></span>`).join("");
}
function HD_donut(A) {
  const head = `<div class="hd-ch"><div><h3 class="hd-ct">고친 뒤 실적의 몫</h3>
    <p class="hd-cs">${HD_PER ? `지금 실적 ${HD_PER}일 중 고친 뒤에 쌓인 날` : "지금 실적의 창 길이가 없습니다"}${A.n > 1 ? " · 페이지 합산" : ""}</p></div></div>`;
  if (!A.win) return head + `<p class="none">고친 뒤 수집한 실적이 아직 없습니다 — 다음 수집부터 채워집니다.</p>`;
  const ring = window.chDonut ? window.chDonut([
    { label: `고친 뒤 ${A.post}일`, value: A.post, on: true },
    { label: `고치기 전 ${A.pre}일`, value: A.pre }], { width: 132, unit: "일" }) : "";
  const per = A.per.length > 1 || A.n > 1 ? `<div class="hd-pl">${A.per.map(r => `<div class="r">${
    HD_av(r.pg.page, HD_CTX.hs.indexOf(r.pg), true)}<span class="p">${esc(urlPath(r.pg.page))}</span>
    <span class="v">${r.post}/${HD_PER}일</span></div>`).join("")}</div>` : "";
  return head + `<div class="hd-dn">${ring}<div class="hd-dl">
      <span class="k"><i></i><span><span class="v">${A.post}</span>일 고친 뒤</span></span>
      <span class="k pre"><i></i><span><span class="v">${A.pre}</span>일 고치기 전</span></span></div></div>${per}
    <p class="hd-cs" style="margin-top:var(--sp-4)">${A.pre > 0
      ? `고치기 전 ${A.pre}일이 섞여 있습니다. 고친 뒤가 ${A.win}일이 되면 온전한 비교입니다.`
      : "전부 고친 뒤의 실적이라 온전한 비교입니다."}</p>`;
}
// 현황판 행 → 상세로 스크롤 · 정렬 칩. 한 번만 단다(화면은 다시 그려져도 sec 는 그대로다).
function HD_bind() {
  if (HD_BOUND) return;
  HD_BOUND = true;
  $("hold-sec").addEventListener("click", e => {
    const sum = e.target.closest && e.target.closest("#holds .hd-ol details.opp > summary");
    if (sum) {
      e.preventDefault();   // 제자리로 펼치지 않는다 — 서랍으로 연다
      HD_drOpen(+sum.parentElement.dataset.opp, sum);
      return;
    }
    const t =e.target.closest && e.target.closest("[data-hd-sort]");
    if (t) {
      const i = +t.dataset.hdSort, h = HD_CTX.hs[i];
      if (!h) return;
      HD_CTX.sort[i] = t.dataset.mode;
      const box = $("holds").querySelector(`[data-hd-list="${i}"]`);
      if (box) box.innerHTML = HD_rows(HD_shown(h, HD_CTX.byId), t.dataset.mode);
      t.parentNode.querySelectorAll(".chip").forEach(c => {
        const on = c === t; c.classList.toggle("on", on); c.setAttribute("aria-pressed", on);
      });
      return;
    }
    const g = e.target.closest && e.target.closest("[data-hd-go]");
    const dest = g && $("hdp-" + g.dataset.hdGo);
    if (!dest) return;
    const calm = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    dest.scrollIntoView({ behavior: calm ? "auto" : "smooth", block: "start" });
  });
}

VIEW("hold", function (d) {
  const hs = d.holds || [];
  const days = d.observe_days;
  HD_PER = d.gsc_period || HD_PER;
  HD_OBS = days || null;
  $("hold-sub").textContent = days
    ? `마지막으로 고친 날부터 ${days}일 동안 지켜봅니다. 그동안 같은 페이지에 선 기회는 할 일 목록에서 빠지고, 기간이 끝나면 저절로 돌아옵니다.`
    : "";
  const byId = {};
  for (const o of d.opps || []) byId[o.id] = o;
  HD_CTX = { hs, byId, sort: HD_CTX.sort };
  const A = hs.length ? HD_agg(hs, byId) : null;
  $("hd-top").hidden = !hs.length;
  $("hd-board").hidden = !hs.length;
  $("hd-kpis").hidden = !hs.length;
  $("hd-sum").innerHTML = hs.length ? `페이지 ${hs.length}곳 · 뺀 기회 ${A.opps}건` : "";
  $("hd-kpis").innerHTML = A ? HD_kpis(A) : "";
  $("hd-rows").innerHTML = hs.map((h, i) => HD_row(h, i, byId)).join("");
  $("hd-donut").innerHTML = A ? HD_donut(A) : "";
  $("holds").innerHTML = hs.length ? hs.map((h, i) => HD_card(h, byId, i)).join("")
    : `<div class="card hd-empty"><div class="empty"><b>관찰 중인 페이지가 없습니다</b>
        <p>기회로 페이지를 고치고 작업을 기록하면, 효과를 재는 동안 여기서 지켜봅니다.</p></div>
        <button type="button" class="go sm" onclick="SM.touched=true;SM.show('triage')">심사에서 기회 보기</button></div>`;
  HD_bind();
  HD_drSync();
  if (!window.nextStep) return;
  nextStep("hold", A
    ? `<p>지금은 고치지 않고 기다립니다. 가장 먼저 끝나는 곳은
        <b>${esc(urlPath(A.first.page))}</b>(<span class="hd-day">${esc(A.first.until)}</span>)입니다.</p>`
    : "");
});
</script>
