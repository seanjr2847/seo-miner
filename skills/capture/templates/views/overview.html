<!-- 이 화면이 무엇인지는 화면 자신이 말한다 — 담는 요소·채우는 단계까지.
     dashboard.py 가 이 선언들을 모아 window.__VIEWS__ 로 방출한다. -->
<script type="application/json" class="view-def">
{"id": "overview", "group": "todo", "title": "개요",
 "sub": "지금 상태와 다음에 손댈 것을 한자리에서 봅니다.",
 "sections": ["docban", "band", "plays", "opps", "watch", "daily"], "stages": ["gsc", "gaps", "plays"]}
</script>

<style>
/* ── 개요는 12열 카드 격자다 ─────────────────────────────────────────
   주 질문은 "지금 무엇부터 손대면 되고, 지난번보다 나아졌나"다. 그래서 첫 화면에
   성적(띠) → 1순위 기회와 [기회 열기](스포트라이트) → 대기열 줄이 차례로 선다. 추이
   차트는 확인용이라 그 아래 12열로 내려간다. 격자는 화면 폭이 아니라 이 섹션의 폭을
   본다(@container) — 레일이 폭을 얼마나 먹는지와 상관없이 4열 카드가 좁아지지 않는다.
   카드는 제목(16px 650)·보조 설명(12px)·우측 도구 한 벌(.ovh)이다. */
#ov-grid { margin-top:var(--sp-4); container-type:inline-size; }
.ov-in { display:grid; grid-template-columns:minmax(0,1fr); gap:var(--gap); align-items:start; }
.ov-side { display:grid; grid-template-columns:minmax(0,1fr); gap:var(--gap); align-content:start; min-width:0; }
#ov-grid .ov-in > .card, #ov-grid .ov-side > .card { margin:0; }
@container (min-width:880px) {
  .ov-in { grid-template-columns:repeat(12, minmax(0,1fr)); }
  .ov-hero { grid-column:1 / span 8; }
  .ov-side { grid-column:9 / span 4; }
  .ov-daily, .ov-plays, .ov-health { grid-column:1 / -1; }
  /* 보드는 칸이 셋이라 8열로는 좁다 — 보드일 때만 대기열이 전폭이 되고 옆 카드는 아래로 나란히 선다. */
  #ov-grid.ovb .ov-hero { grid-column:1 / -1; }
  #ov-grid.ovb .ov-side { grid-column:1 / -1; grid-template-columns:repeat(2, minmax(0,1fr)); }
  #ov-grid.ovb .ov-side > .card[hidden] + .card { grid-column:1 / -1; }
}
@container (max-width:760px) { .kboard { grid-template-columns:minmax(0,1fr); } .kcol { min-height:0; } }

/* 카드 머리 한 벌 — 제목·보조 설명은 왼쪽, 도구는 오른쪽. 도구가 안 들어가면 아래로 내려선다. */
.ovh { display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap;
  gap:var(--sp-3) var(--sp-4); margin:0 0 var(--sp-4); }
.ovh-t { flex:1 1 200px; min-width:0; }
.ovh h2 { font:650 var(--fs-3)/1.4 var(--sans); margin:0; }
.ovh .sub { font-size:var(--fs-1); line-height:1.5; margin:2px 0 0; max-width:none; }
.ovh .tools { margin:0; flex:0 1 auto; justify-content:flex-end; }
.ovh .tools input { flex:1 1 140px; max-width:200px; }
@media (max-width:640px) {
  .ovh .tools { flex:1 1 100%; justify-content:flex-start; }
  .ovh .tools input { flex:1 1 100%; max-width:none; }
}
.nw { white-space:nowrap; }              /* 날짜 범위·기준 캡션은 중간에서 꺾이지 않는다 */

/* ── KPI 띠: 스파크라인을 카드 폭으로 키운다(스냅샷 3개 이상·변동이 있을 때만 선다) ── */
#band .spark { margin-top:auto; padding-top:var(--sp-3); }
#band .spark svg { display:block; width:100%; max-width:220px; height:auto; aspect-ratio:160 / 36; }

/* ── 스포트라이트: 1순위 기회 하나와 그걸 여는 버튼. 목록 맨 위 줄과 같은 기회다. ── */
.ovs { --ovc:var(--accent); --ovw:var(--accent-wash);
  display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:var(--sp-4); align-items:center;
  margin:0 0 var(--sp-3); padding:var(--sp-4) var(--sp-5) var(--sp-4) var(--sp-4);
  border-radius:var(--r-in); background:var(--ovw); }
.ovs[hidden] { display:none; }
.ovs.def { --ovc:var(--warn); --ovw:var(--warn-wash); }
.ovs-ring { position:relative; width:64px; height:64px; flex:none; }
.ovs-ring svg { display:block; width:64px; height:64px; transform:rotate(-90deg); }
.ovs-ring .trk { stroke:color-mix(in srgb, var(--ovc) 18%, transparent); }
.ovs-ring .arc { stroke:var(--ovc); }
.ovs-ring b { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:2px; font:650 var(--fs-3)/1 var(--sans);
  font-variant-numeric:tabular-nums; color:var(--ink); }
.ovs-ring b i { font:500 var(--fs-1)/1 var(--sans); font-style:normal; color:var(--sub); }
.ovs-k { font:600 var(--fs-1)/1.3 var(--sans); color:var(--ovc); }
.ovs-t { font:650 var(--fs-4)/1.3 var(--sans); margin:2px 0 var(--sp-2); overflow-wrap:anywhere; }
.ovs-m { display:flex; flex-wrap:wrap; gap:var(--sp-1) 6px; }
.ovs-w { margin:var(--sp-2) 0 0; font-size:var(--fs-2); line-height:1.55; color:var(--ink);
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.ovs-a { align-self:center; }
/* 알약이 스포트라이트 면과 같은 색이면 사라진다 — 흰 면을 깐다. */
#ov-spot .kind, #ov-spot .badge { background:var(--card); }
@media (max-width:560px) {
  .ovs { grid-template-columns:auto minmax(0,1fr); padding:var(--sp-4); }
  .ovs-a { grid-column:1 / -1; }
  .ovs-a .go { width:100%; justify-content:center; }
}

/* ── 대기열: 카드 안의 줄이다(카드 속 카드가 아니라 카드 폭을 쓴다) ── */
.opp-more { margin-top:var(--sp-4); }
.opp-held { display:flex; flex-wrap:wrap; align-items:center; gap:6px var(--sp-3);
  margin:var(--sp-4) 0 0; font-size:var(--fs-1); color:var(--sub); }
.opp .vars { font-size:var(--fs-1); color:var(--sub); margin:2px 0 0; }
.opp:not([open]) .vars { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.opp > summary > div { min-width:0; }     /* 안 그러면 잘라야 할 한 줄이 격자 칸을 민다 */
/* 줄은 카드 가장자리까지 뻗는다 — hover 면이 카드 끝에서 끝까지 차야 줄로 읽힌다. */
.ovrows { margin:0 calc(-1 * var(--sp-5)); }
#opplist .opp { margin:0; padding:12px var(--sp-5); border:0; border-radius:0;
  border-top:1px solid var(--line); background:transparent; box-shadow:none; }
#opplist .opp:hover { background:var(--sunk); }
/* 펼친 줄은 면 색을 그대로 둔다 — 안의 보조 버튼·표가 --sunk 면이라 같은 색 위에 서면 사라진다. */
#opplist .opp[open] { background:var(--card); }
#opplist .opp > summary { align-items:center; }
#opplist .opp > summary::before { align-self:center; margin:0; }
#opplist .score { font-size:var(--fs-3); width:34px; }
#opplist .score .u { display:none; }
.opp .ovt { display:flex; align-items:baseline; gap:4px 10px; flex-wrap:wrap; min-width:0; }
#opplist .opp .target { margin:0; }
#opplist .opp .why { margin-top:2px; }
#opplist .opp:not([open]) .why { -webkit-line-clamp:1; }
#opplist .det { padding-left:48px; }
@media (max-width:560px) {
  #opplist .opp > summary { grid-template-columns:auto 1fr auto; }
  #opplist .opp > summary::before { display:none; }
  #opplist .opp > summary > * { grid-column:auto; grid-row:auto; }
  #opplist .det { padding-left:0; }
}

/* ── 보드: 같은 기회를 상태 칸(할 일·진행 중·완료)으로 나눠 본다 ─────────
   칸 머리의 수가 곧 "얼마나 남았나"다. 카드를 다른 칸으로 끌어 놓으면 그 상태로 옮긴다
   (/api/opp). 끌기는 터치에서 안 되므로 카드마다 다음 행동 버튼이 그대로 선다.
   칸은 카드 안의 한 단 가라앉은 면(--sunk)이고, 그 안의 기회 카드는 흰 면(--card)이다. */
.kseg { display:inline-flex; gap:var(--sp-1); }
.kseg .chip { margin:0; }
.kboard { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:var(--gap); align-items:start; }
.kcol { background:var(--sunk); border:0; border-radius:var(--r-in); box-shadow:none;
  padding:var(--sp-3); min-height:180px; }
.kcol.over { background:var(--accent-wash); }
.kc-top { display:flex; align-items:center; gap:var(--sp-2); padding:var(--sp-1) var(--sp-2) var(--sp-3); }
.kc-top h3 { margin:0; font-size:var(--fs-3); font-weight:600; color:var(--ink); }
.kc-n { display:inline-flex; align-items:center; justify-content:center; min-width:24px; height:24px;
  padding:0 var(--sp-2); border-radius:var(--r-pill); background:var(--card);
  font:600 var(--fs-1)/1 var(--sans); font-variant-numeric:tabular-nums; color:var(--sub); }
.kcol-acked .kc-n { color:var(--warn); background:var(--warn-wash); }
.kcol-new .kc-n { color:var(--accent); background:var(--accent-wash); }
.kc-list { display:flex; flex-direction:column; gap:var(--sp-2); }
.kcard { background:var(--card); border:0; border-radius:var(--r-in); box-shadow:var(--shadow);
  padding:var(--sp-3); cursor:grab; }
.kcard:hover { background:var(--accent-wash); }
.kcard.dragging { opacity:.45; cursor:grabbing; }
.kc-h { display:flex; align-items:baseline; gap:10px; min-width:0; }
.kcard .score { font-size:var(--fs-3); width:auto; flex:none; }
.kcard .score .u { display:none; }
.kcard .target { margin:0; font-weight:600; font-size:var(--fs-2); overflow-wrap:anywhere; }
.kc-k { display:flex; flex-wrap:wrap; gap:var(--sp-1) 6px; margin-top:6px; }
.kcard .why { margin-top:6px; display:-webkit-box; -webkit-line-clamp:2;
  -webkit-box-orient:vertical; overflow:hidden; }
.kcard .acts { margin-top:10px; gap:6px; }
/* 카드 안 요청문 손잡이 — 좁은 칸이라 꼴 이름은 접고(펴면 안에 나온다). 카드 면이 흰색이라
   손잡이는 한 단 가라앉은 면을 깐다. */
.kcard .ask, .kcard .ask + .askcopy { margin:0; }
.kcard .ask > summary { background:var(--sunk); min-height:var(--btn-h-sm); }
.kcard .ask > summary .micro { display:none; }
.kcard .ask[open] { flex:1 1 100%; }
.kc-empty { margin:0; padding:14px var(--sp-2); font-size:var(--fs-2); color:var(--sub); }
.kc-more { margin-top:var(--sp-2); }
.kc-foot { margin:var(--sp-3) 0 0; font-size:var(--fs-2); color:var(--sub); }
@media (max-width:820px) { .kboard { grid-template-columns:1fr; } .kcol { min-height:0; } }

/* ── 종류별 기회: 도넛은 종류 칩의 그림판이다. 범례 한 줄이 곧 칩(누르면 그 종류만) ── */
.ovk-body { display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
  gap:var(--sp-4); }
.ovk-donut { position:relative; width:136px; height:136px; flex:none; }
.ovk-c { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:2px; pointer-events:none; }
.ovk-c b { font:650 var(--fs-4)/1 var(--sans); font-variant-numeric:tabular-nums; color:var(--ink); }
.ovk-c span { font:500 var(--fs-1)/1.2 var(--sans); color:var(--sub); }
#oppchips { flex:1 1 200px; min-width:0; margin:0; display:flex; flex-direction:column; gap:2px; }
#oppchips .chip { display:grid; grid-template-columns:10px minmax(0,1fr) auto; align-items:center;
  gap:2px var(--sp-2); width:100%; margin:0; padding:var(--sp-2) var(--sp-2);
  border-radius:var(--r-in); background:transparent; color:var(--ink); text-align:left;
  font:500 var(--fs-2)/1.35 var(--sans); min-height:0; }
#oppchips .chip:hover { background:var(--sunk); color:var(--ink); }
#oppchips .chip.on { background:var(--accent-wash); color:var(--ink); font-weight:600; }
#oppchips .chip b { font-variant-numeric:tabular-nums; color:var(--sub); font-weight:600;
  font-size:var(--fs-1); }
#oppchips .chip .dot { width:10px; height:10px; border-radius:3px; }
#oppchips .chip .nm { min-width:0; overflow-wrap:anywhere; }
#oppchips .chip .bar { grid-column:2 / -1; height:4px; border-radius:var(--r-pill);
  background:var(--sunk); overflow:hidden; }
#oppchips .chip.on .bar { background:var(--card); }
#oppchips .chip .bar em { display:block; height:100%; border-radius:var(--r-pill); }
#oppchips .ovk-all { align-self:flex-start; margin-top:var(--sp-1); }

/* ── 고친 뒤 달라졌나: 이름과 그때 → 지금이 한 행이고, 변화는 오른쪽 알약이다 ── */
.ovw { display:flex; flex-direction:column; gap:2px; margin:0 calc(-1 * var(--sp-2)); }
.ovw-r { display:grid; grid-template-columns:32px minmax(0,1fr) auto; gap:0 var(--sp-3);
  align-items:center; padding:var(--sp-3) var(--sp-2); border-radius:var(--r-in); }
.ovw-r:hover { background:var(--sunk); }
.ov-av { display:grid; place-items:center; width:32px; height:32px; border-radius:10px;
  background:var(--accent-wash); color:var(--accent); font:700 var(--fs-2)/1 var(--sans); }
.ovw-n { font:600 var(--fs-2)/1.4 var(--sans); overflow-wrap:anywhere; }
.ovw-m { margin-top:2px; font:400 var(--fs-1)/1.5 var(--sans); color:var(--sub);
  font-variant-numeric:tabular-nums; }
.ovw-m .nw { color:var(--ink); }
.ovw-s { align-self:start; }
.ovw-st { margin-top:var(--sp-2); }
.ovw-st:empty { display:none; }
.ovw-more { margin:var(--sp-3) 0 0; }
#watch .empty { padding:var(--sp-2) 0; }

/* ── 이번 달 할 일(plays): 페이지 하나 = 한 줄. 줄을 누르면 기회와 같은 오른쪽 서랍이 열린다 ──
   줄은 대기열 줄과 같은 결(카드 가장자리까지 뻗는 hover 면)이다. 페이지 경로·날짜만 등폭이다. */
.ovp-list { list-style:none; margin:0 calc(-1 * var(--sp-5)); padding:0; }
.ovp { display:grid; grid-template-columns:28px minmax(0,1fr) auto; gap:4px var(--sp-3); align-items:start;
  width:100%; box-sizing:border-box; margin:0; padding:12px var(--sp-5); border:0; border-top:1px solid var(--line);
  border-radius:0; background:transparent; color:var(--ink); text-align:left; font:inherit; }
button.ovp { cursor:pointer; }
button.ovp:hover, .ovp.odr-on { background:var(--sunk); }
.ovp-n { display:grid; place-items:center; width:28px; height:28px; border-radius:50%;
  background:var(--accent-wash); color:var(--accent); font:700 var(--fs-1)/1 var(--sans);
  font-variant-numeric:tabular-nums; }
.ovp-b { min-width:0; display:flex; flex-direction:column; gap:6px; }
.ovp-t { font:600 var(--fs-2)/1.45 var(--sans); overflow-wrap:anywhere; }
.ovp-m { display:flex; flex-wrap:wrap; align-items:center; gap:4px 6px; font-size:var(--fs-1); color:var(--sub); }
.ovp-u { font-family:var(--mono); font-size:var(--fs-1); color:var(--sub); overflow-wrap:anywhere; }
.ovp-k { display:inline-flex; align-items:center; height:24px; padding:0 8px; border-radius:var(--r-pill);
  background:var(--sunk); color:var(--ink); font:500 var(--fs-1)/1 var(--sans); white-space:nowrap; }
button.ovp:hover .ovp-k { background:var(--card); }
.ovp-s { display:flex; flex-direction:column; align-items:flex-end; gap:4px; }
.ovp-d { font:400 var(--fs-1)/1.3 var(--mono); color:var(--sub); font-variant-numeric:tabular-nums; }
@media (max-width:560px) {
  .ovp { grid-template-columns:28px minmax(0,1fr); }
  .ovp-s { grid-column:2; flex-direction:row; align-items:center; }
}

/* ── 데이터 점검: 접힌 띠 한 줄(이상 N건 · 등급 배지) → 펼치면 등급·영역·내용 목록 ──
   할 일보다 먼저 읽힐 것이 아니라 카드 크기를 줄이고(여백 14px) 접어 둔다. 등급 색은 공용
   배지(.badge.bad·.warn·.adv) 한 벌이고, 글자(높음·중간·낮음)가 정본이다. */
.ov-health { padding:14px 24px; }
.ov-health > summary { display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px;
  min-height:var(--btn-h-sm); cursor:pointer; font:600 var(--fs-2)/1.4 var(--sans); color:var(--ink); }
.ov-health > summary::before { margin-right:0; }
.ovhl-t b { font-variant-numeric:tabular-nums; }
.ovhl-sev { display:inline-flex; flex-wrap:wrap; gap:6px; }
.ovhl-h { font:400 var(--fs-1)/1.5 var(--sans); color:var(--sub); }
.ovhl-list { list-style:none; margin:10px 0 0; padding:0; display:flex; flex-direction:column; }
.ovhl-list li { display:grid; grid-template-columns:56px minmax(0,1fr); gap:10px; align-items:start;
  padding:10px 0; border-top:1px solid var(--line); }
.ovhl-list .badge { justify-content:center; }
.ovhl-list b { display:block; font:600 var(--fs-1)/1.5 var(--sans); color:var(--sub); }
.ovhl-list p { margin:2px 0 0; font:400 var(--fs-2)/1.6 var(--sans); color:var(--ink); overflow-wrap:anywhere; }
@media (max-width:560px) { .ov-health { padding:12px 16px; } }

/* ── 일별 추이: 한 번에 하나만(클릭 | 노출) — 자릿수가 다른 두 선을 한 축에 겹치지 않는다 ── */
.ovd-leg { font:400 var(--fs-1)/1.6 var(--sans); color:var(--sub); margin-top:var(--sp-3); }
.ovd-leg b { color:var(--ink); font-weight:600; }
.ovalt { margin-top:var(--sp-3); }
.ovalt > summary { display:inline-flex; align-items:center; cursor:pointer; min-height:var(--btn-h-sm);
  font:500 var(--fs-1)/1.4 var(--sans); color:var(--sub); }
.ovalt > summary:hover { color:var(--accent); }
.ovalt .tw { max-height:260px; margin-top:var(--sp-2); }

/* ── 기회 상세 — 오른쪽 서랍 ───────────────────────────────────────────
   줄을 누르면 목록 안에서 펼치지 않고 오른쪽에 서랍이 열린다. 목록 자리를 잃지 않고
   다음 줄로 넘겨 보기 위해서다. 내용은 셸의 펼침 조각(oppParts)을 근거·할 일·요청문
   세 탭으로 나눠 놓은 것이고, 상태·요청문 복사는 아래 발판에 고정된다.
   박제본·인쇄는 여전히 제자리 펼침이다(<details> 그대로 — 서랍은 화면에서만). */
.odr-bg { position:fixed; inset:0; z-index:57; background:color-mix(in srgb, var(--ink) 18%, transparent); }

           나란히 놓는다(서버 db.watch_rows). 두 번 이상 쟀는데 안 올랐으면 [다시 열기]. -->

            tabindex="0" data-tip="위 숫자의 증감은 수집을 돌린 간격만큼 성깁니다. 여기는 성과일 기준이라 하루가 점 하나입니다."
            title="위 숫자의 증감은 수집을 돌린 간격만큼 성깁니다. 여기는 성과일 기준이라 하루가 점 하나입니다."
            aria-label="위 숫자의 증감은 수집을 돌린 간격만큼 성깁니다. 여기는 성과일 기준이라 하루가 점 하나입니다."

<script>
"use strict";
/* 단계 하나를 돌리는 손잡이는 셸이 배포에 맞춰 고른다(로컬은 명령 칩, 호스팅은 실행
   버튼). 셸 스크립트가 뷰보다 뒤에 있어도 렌더 시점에는 서 있지만, 조립이 반쯤
   나간 상태에서도 화면이 서게 없으면 빈 문자열로 물러난다. */
const OV_act = (stage, label, primary) =>
  (READONLY || !window.act) ? "" : act(stage, label, primary);
// 박제본에는 누를 서버가 없다 — 손잡이가 없으면 상자도 만들지 않는다.
const OV_acts = html => html ? `<div class="acts">${html}</div>` : "";

/* ── 일별 추이: gsc_daily 의 date 는 성과일(수집일이 아니다)이라 하루가 점 하나다.
      클릭과 노출은 자릿수가 달라 한 번에 하나만 그린다 — 두 선을 한 카드에 겹치면 서로 상관이
      있어 보인다. 토글은 카드 머리의 [클릭|노출]이고, 나머지 값(클릭률·평균 순위)은 점에
      올리면 나오는 말풍선이 말한다. 차트는 셸의 chMount 로 세운다(Chart.js, 직접 세우지 않는다). ── */
const LEG_TIP = "클릭과 노출은 자릿수가 달라 한 번에 하나씩 봅니다. 위 띠의 합계는 검색어별로 더한 값이라 "
  + "구글이 가린 검색어가 빠지고, 기준일도 달라 여기보다 작습니다.";
let OV_DM = "clicks", OV_DAILY = {rows: [], stats: null};
const OV_DM_OPT = [["clicks", "클릭"], ["impressions", "노출"]];
function OV_dailyMode(m) { OV_DM = m; OV_dailyDraw(); }
function OV_dailyDraw() {
  const rows = OV_DAILY.rows;
  $("daily-tools").innerHTML = rows.length < 2 ? ""
    : `<span class="kseg" role="group" aria-label="보는 지표">${OV_DM_OPT.map(([v, l]) =>
        `<button type="button" class="chip${OV_DM === v ? " on" : ""}" aria-pressed="${OV_DM === v}"
          onclick="OV_dailyMode('${v}')">${l}</button>`).join("")}</span>`;
  $("daily").innerHTML = dailyChart(rows, OV_DAILY.stats);
}

function dailyChart(rows, stats) {
  if (rows.length < 2)
    // 여기에 명령 칩을 또 놓지 않는다 — 같은 `/capture gsc` 가 화면 머리에 이미
    // 있고, 띠도 수집 전이면 그것을 주요 행동으로 든다(한 화면에 세 번이었다).
    return `<div class="empty"><b>일별 실적이 아직 없습니다</b>
      <p class="live">실적을 한 번 더 수집하면 최근 28일이 하루 단위로 채워집니다.</p></div>`;
  const n = rows.length, key = OV_DM, label = key === "clicks" ? "클릭" : "노출";
  // 범례의 「하루 최고」는 실제 값이다(척도는 차트가 알아서 0 부터 잡는다).
  const topC = stats?.clicks_max ?? Math.max(...rows.map(r => r.clicks || 0));
  const topI = stats?.impressions_max ?? Math.max(...rows.map(r => r.impressions || 0));
  const sumC = stats?.clicks_sum ?? rows.reduce((a, r) => a + (r.clicks || 0), 0);
  const sumI = stats?.impressions_sum ?? rows.reduce((a, r) => a + (r.impressions || 0), 0);
  // 이 합계는 위 띠의 합계와 **같은 28일이 아니다** — 여기는 성과일(gsc_daily,
  // 08-03~08-30), 띠는 기준일 스냅샷(gsc_snapshots, 08-06~09-02)이고 출처도 다르다
  // (날짜별 vs 검색어별). 둘 다 "28일 합계"라고만 적어 두면 한 화면에서 736 과 980
  // 이 나란히 서서 무엇이 고장 났나 싶어진다. 이 자리는 자기 날짜를 말한다.
  const span = `${String(rows[0].date).slice(5)}~${String(rows[n - 1].date).slice(5)}`;
  const aria = `최근 ${n}일 ${label} 추이 — 클릭 합계 ${num(sumC)}, 노출 합계 ${num(sumI)}`;
  const chart = chMount(T => {
    const S = getComputedStyle(document.documentElement);
    const col = key === "clicks" ? T.patina : S.getPropertyValue("--info").trim();
    return {type: "line",
      data: {labels: rows.map(r => String(r.date).slice(5)),
        datasets: [{data: rows.map(r => r[key] || 0), borderColor: col, borderWidth: 2.5,
          tension: .35, fill: true, borderCapStyle: "round", borderJoinStyle: "round",
          // 위→아래로 옅어지는 면 — 색은 선과 같은 토큰이다(새 색을 안 만든다).
          backgroundColor: c => {
            const a = c.chart.chartArea;
            if (!a) return chA(col, .12);
            const g = c.chart.ctx.createLinearGradient(0, a.top, 0, a.bottom);
            g.addColorStop(0, chA(col, .26)); g.addColorStop(1, chA(col, 0));
            return g;
          },
          pointRadius: c => c.dataIndex === n - 1 ? 4 : 0, pointHoverRadius: 5,
          pointBackgroundColor: col, pointBorderColor: T.card, pointBorderWidth: 2}]},
      options: {responsive: true, maintainAspectRatio: false,
        interaction: {mode: "index", intersect: false},
        scales: {
          x: {grid: {display: false}, border: {display: false},
            ticks: {color: T.slate, font: {family: T.mono, size: 12}, maxTicksLimit: 6,
              maxRotation: 0, autoSkipPadding: 12}},
          y: {beginAtZero: true, grid: {color: T.soft}, border: {display: false},
            ticks: {color: T.slate, font: {family: T.mono, size: 12}, maxTicksLimit: 4,
              callback: v => num(v)}}},
        plugins: {legend: {display: false},
          tooltip: chTipSays(T, {callbacks: {title: c => rows[c[0].dataIndex].date,
            label: c => {
              const r = rows[c.dataIndex];
              return [`클릭 ${num(r.clicks)} · 노출 ${num(r.impressions)}`,
                `클릭률 ${r.ctr}% · 평균 ${r.position ?? "—"}위`];
            }}}),
          chText: {T, cross: true}}}};
  }, aria, "height:clamp(200px, 24vw, 280px)");
  // 캔버스는 스크린리더가 값을 못 읽는다 — 같은 값을 표로도 둔다(접혀 있다).
  const alt = `<details class="ovalt"><summary>날짜별 값을 표로 보기</summary>${table(
    ["날짜", ">클릭", ">노출", ">클릭률", ">평균 순위"],
    rows.slice().reverse().map(r => `<tr><td class="num">${esc(r.date)}</td><td class="num">${num(r.clicks)}</td>
      <td class="num">${num(r.impressions)}</td><td class="num">${r.ctr}%</td>
      <td class="num">${r.position ?? "—"}</td></tr>`), "")}</details>`;
  return `${chart}
  <div class="ovd-leg"><b>클릭</b> <span class="nw">${esc(span)}</span> 사이트 전체 합계 ${num(sumC)}
    (하루 최고 ${num(topC)}) · <b>노출</b> 합계 ${num(sumI)}
    (하루 최고 ${num(topI)})<span class="hint" tabindex="0"
      data-tip="${esc(LEG_TIP)}" title="${esc(LEG_TIP)}" aria-label="${esc(LEG_TIP)}"
      >i</span></div>${alt}`;
}

/* ── KPI 마이크로 추이: 스냅샷 3개부터, 변동이 있을 때만. 축·라벨 없이 흐름만 —
      정확한 값은 위의 큰 숫자가 이미 말하고 있다. 선 밑에 옅은 면을 깔고 끝점에 점을 찍는다. ── */
function kpiSpark(vals, dates, color) {
  if (vals.length < 3) return "";
  const mx = Math.max(...vals), mn = Math.min(...vals);
  if (mx === mn) return "";
  const W = 160, H = 36, P = 3;
  const x = i => P + i * (W - 2 * P) / (vals.length - 1);
  const y = v => H - P - (v - mn) / (mx - mn) * (H - 2 * P);
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  return `<div class="spark"><svg viewBox="0 0 ${W} ${H}" role="img"
      aria-label="스냅샷 ${vals.length}회 추이">
    <title>${esc(dates[0])} → ${esc(dates[dates.length - 1])} · ${vals.length}회</title>
    <polygon fill="${color}" fill-opacity=".10" points="${x(0)},${H} ${pts} ${x(vals.length - 1)},${H}"/>
    <polyline fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round"
      stroke-linejoin="round" points="${pts}"/>
    <circle cx="${x(vals.length - 1).toFixed(1)}" cy="${y(vals[vals.length - 1]).toFixed(1)}"
      r="3" fill="${color}"/>
  </svg></div>`;
}

// 카드 자체가 <details> 다 — 어디를 눌러도 펼쳐지고, 키보드·스크린리더가 공짜로
// 따라온다. 점수·트리아지·펼침·배지는 셸의 한 벌(oppScore/oppMeter/oppActs/
// oppPanel/gaBadge)이다 — 다른 화면도 같은 부품으로 같은 카드를 만든다.
// 근거 줄만 oppWhy 를 안 쓰고 직접 짠다: 이 카드는 날짜(.dt)를 라벨 옆에 두고
// 상태(.st)를 오른쪽 끝에 세우는데 oppWhy 는 상태를 라벨 옆에 넣기 때문이다.
// 그래서 셸에 부품이 늘면 여기도 손대야 한다 — GA4 배지가 실제로 그랬다.
// id 는 페이로드에 이미 있다 — data- 로 내보낸다(호스팅 애드온이 onclick 문자열을
// 정규식으로 되짚던 자리다).
//
// 묶인 줄(o.group — 같은 지면의 변형 검색어)은 대표 검색어를 표제로 세우고 나머지를
// 그 밑에 한 줄로 흘린다. 전부와 "왜 한 줄인지"는 펼침 패널(셸 oppGroup)이 말한다.
// data-ids 는 묶인 id 전부다 — [기록]이 변형 쪽 id 로 이 카드를 찾아온다.
const OV_VARS_SHOWN = 4;
// 같은 검색어의 여러 종류도 한 줄로 묶인다(g.kinds) — 그때 변형 목록에 같은 검색어가
// 종류 수만큼 들어 있다. 검색어 수·「함께」는 겹친 것을 한 번만 센다.
const OV_targets = o => o.group ? [...new Set(o.group.variants.map(v => v.target))] : [o.target];
// 줄의 종류 — 서버가 준 순서(최고 점수 먼저) 그대로. 옛 페이로드는 대표 하나.
const OV_kinds = o => o.group && o.group.kinds && o.group.kinds.length
  ? o.group.kinds.map((k, i) => [k, o.group.labels[i] || k]) : [[o.kind, o.label || o.kind]];
function OV_vars(o) {
  const rest = OV_targets(o).filter(t => t !== o.target);
  if (!rest.length) return "";
  const more = rest.length - OV_VARS_SHOWN;
  return `<div class="vars">함께: ${rest.slice(0, OV_VARS_SHOWN).map(esc).join(" · ")}${
    more > 0 ? ` 외 ${more}개` : ""}</div>`;
}
// 접힌 줄에는 「할 일」 배지를 안 단다 — 기본 거르개(아직 안 함)에서는 거의 모든 줄이
// 같은 말이라 읽을 것만 늘린다. 다른 상태일 때만 선다. 상태를 바꾸는 손잡이와 실행
// 자리(oppActs), 원래 화면으로 가는 길(OV_see)은 셸 패널의 행동 줄(맨 위)에 넘긴다 —
// 스무 줄에 버튼 마흔 개가 서지 않게, 그러면서 펼치면 맨 먼저 손에 닿게.
function oppRow(o) {
  const n = OV_targets(o).length;
  return `<details class="opp" data-opp="${o.id}" data-ids="${(o.group ? o.group.ids : [o.id]).join(" ")}">
    <summary>
      ${oppScore(o)}
      <div>
        <div class="ovt">
          <div class="target">${esc(targetLabel(o.target))}</div>
          ${OV_kinds(o).map(([k, l]) => `<span class="kind${isDefensive(k === o.kind ? o : {kind: k})
            ? " k-def" : ""}">${esc(l)}</span>`).join("")}
          ${n > 1 ? `<span class="badge" title="같은 지면이라 한 줄로 묶었습니다. 펼치면 전부와 묶은 이유가 나옵니다."
            >검색어 ${n}개</span>` : ""}
          ${window.gaBadge(o)}
          ${window.madeBadge(o)}
          ${window.holdBadge(o)}
        </div>
        ${OV_vars(o)}
        ${o.reasoning ? `<div class="why">${esc(o.reasoning)}</div>` : ""}
        ${window.oppClosedWhy(o)}
      </div>
      ${o.status === "new" ? "" : `<div class="st st-${o.status}">${window.OPP_LABEL[o.status] || esc(o.status)}</div>`}
    </summary>
    ${oppPanel(o, oppActs(o) + (OV_see(o) ? `<div class="acts">${OV_see(o)}</div>` : ""))}${OV_more(o)}
  </details>`;
}
/* 한 줄에 묶인 나머지 종류의 근거·할 일 — 대표 종류는 위 패널이 말한다. 종류마다 그
   종류에서 점수가 가장 높은 기회(이 화면에 실려 온 것)를 차례로 든다. */
let OV_BYID = {};
function OV_more(o) {
  const ks = OV_kinds(o).slice(1);
  if (!ks.length) return "";
  const members = o.group.ids.map(id => OV_BYID[id]).filter(Boolean);
  return ks.map(([k, l]) => {
    const m = members.find(x => x.kind === k);
    if (!m) return "";
    const p = m.play || {};
    return `<div class="det"><p class="detw"><b>${esc(l)}</b>${m.reasoning
      ? ` · ${esc(m.reasoning)}` : ""}</p>${playList(p.what, p.acts, "")}</div>`;
  }).join("");
}

/* 개요는 여러 화면을 모아 보는 곳이다 — 모은 줄마다 그 검색어를 자세히 보는 원래 자리로
   가는 길이 있어야 한다. 어느 화면·어느 섹션인지는 서버가 준 표(kind_views, 정본은
   scoring.KINDS 의 see)를 그대로 읽는다. 여기 옮겨 적으면 화면 목록이 두 벌이 된다.
   따로 볼 화면이 없는 종류이거나, 이 배포(박제본·호스팅)에 그 화면이 없으면 링크를 안 단다. */
function OV_see(o) {
  const see = (window.KIND_VIEWS || {})[o.kind];
  if (!see || SM.at(see[0]) < 0) return "";
  const v = SM.views[SM.at(see[0])];
  return `<button class="go sm ghost" onclick="OV_goSee('${esc(see[0])}','${esc(see[1] || "")}')"
    >${esc(v.title)} 화면에서 자세히 보기 →</button>`;
}
function OV_goSee(view, sec) {
  SM.touched = true;
  // show() 는 화면 맨 위로 올리는데, 문서가 scroll-behavior:smooth 라 그 애니메이션이
  // 뒤이은 섹션 이동을 덮어쓴다(실측: 다음 프레임에 옮겨도 섹션 위 300~1,200px 에서
  // 제각각 섰다). 이 한 번만 부드러운 스크롤을 끄고 옮긴다.
  // 섹션이 비어 숨었으면 show() 가 올려 둔 화면 맨 위가 답이다.
  const root = document.documentElement.style, prev = root.scrollBehavior;
  root.scrollBehavior = "auto";
  SM.show(view);
  const el = sec && $(sec);
  if (el && el.offsetParent !== null) el.scrollIntoView({block: "start"});
  root.scrollBehavior = prev;
}


// OPP_ST 가 null 이면 아직 안 정한 것 — 첫 적재 때 정한다. 여기서 READONLY 를 못
// 읽는다(뷰는 셸 스크립트보다 위에 꽂혀서 아직 선언 전이다).
// 처음 펼쳐 두는 줄 수 — 줄이 얇아져(카드 → 목록) 한 화면에 열 줄이 들어간다.
const OV_PAGE = 10;
let OPPS = [], KIND_FILTER = null, OPP_Q = "", OPP_ST = null, OPP_N = OV_PAGE;
// 상태 묶음의 정본은 셸의 OPP_ST_GROUP·OPP_ST_OPT 한 벌이다 — 기회를 보여 주는 화면이
// 여덟이라 여기 베껴 두면 새 상태가 생길 때 몇 벌만 늙는다(test_seams 44).
// open 은 "이 둘이면"이다("done 이 아니면"이 아니다) — 저절로 풀린 기회처럼 새 상태가
// 생겨도 [아직 안 함]으로 새지 않는다(test_seams 23).

// 상태로 먼저 가른다 — 칩 개수도 이 묶음을 세야 "CTR 미달 12" 를 눌렀는데 8건이
// 나오는 일이 없다.
// 보드에서는 상태 거르개 대신 칸이 상태를 가른다 — 칸에 오르는 상태만 센다.
// 관찰 중(o.hold)은 칸에 안 올린다 — 목록 기본값과 같은 규칙(oppStMatch 의 "")이고,
// 몇 건을 뺐는지는 보드 밑 OV_holdLine 이 말한다.
function oppByStatus() {
  return OPPS.filter(o => OV_isBoard() ? OV_COLS.includes(o.status) && window.oppStMatch(o, "")
                                        : window.oppStMatch(o, OPP_ST));
}
function oppFiltered() {
  const q = OPP_Q.trim().toLowerCase();
  return oppByStatus().filter(o =>
    (!KIND_FILTER || OV_kinds(o).some(([k]) => k === KIND_FILTER)) &&
    (!q || `${o.target} ${o.reasoning || ""} ${OV_varText(o)}`.toLowerCase().includes(q)));
}
// 묶인 줄은 변형 검색어로도 찾힌다 — 대표가 아닌 검색어를 쳤는데 안 나오면 없는 줄 안다.
const OV_varText = o => o.group ? o.group.variants.map(v => v.target).join(" ") : "";

// 서버가 접어 보낸 줄(d.opp_groups)을 카드 객체로 편다. 줄 하나 = 대표 기회 + 묶음.
// 대표 객체는 복사해서 점수·상태만 묶음 것으로 갈아 끼운다 — 원본(d.opps)은 다른
// 화면이 검색어 하나로 찾아 쓰는 것(oppOf)이라 건드리지 않는다.
// 옛 박제본에는 opp_groups 가 없다 — 그때처럼 기회 하나가 한 줄이다.
function OV_lines(d) {
  const byId = {};
  for (const o of d.opps || []) byId[o.id] = o;
  OV_BYID = byId;
  if (!d.opp_groups) return d.opps || [];
  return d.opp_groups.filter(g => byId[g.lead]).map(g => g.ids.length > 1
    ? Object.assign({}, byId[g.lead], {score: g.score, status: g.status, group: g})
    : byId[g.lead]);
}
function oppFind(v) { OPP_Q = v; OPP_N = OV_PAGE; oppList(); }
function oppStatus(v) { OPP_ST = v; OPP_N = OV_PAGE; oppList(); }
function oppMore(n) { OPP_N = n; oppList(); }
// [필터 지우기]는 말 그대로 전부 보여 준다 — 첫 화면의 기본값(아직 안 함)이 아니다.
function oppReset() { OPP_Q = ""; OPP_ST = "all"; KIND_FILTER = null; renderOpps(OV_PAGE); }
// 거르개까지 다시 그린다 — oppStatus 는 목록만 그려서 <select> 의 선택이 안 따라온다.
function oppClosed(st) { OPP_ST = st || "closed"; KIND_FILTER = null; renderOpps(OV_PAGE); }
/* 심사 대기 — 이 목록은 심사에서 [작업]으로 보낸 것만 싣는다(서버 db.gate_sql). 목록이 비었는데
   심사에 쌓여 있으면 "다 처리했다"가 아니라 "고를 차례"다 — aitierlist 는 미판정 113건을 두고
   "남은 기회가 없습니다 · 쌓인 것을 전부 처리했습니다"를 봤다. 수는 서버가 센다
   (d.triage_pending). 없거나 0 이면(옛 박제본·다 판정함) 빈 문자열 — 원래 빈 상태로 물러선다. */
function OV_triageBox() {
  const t = (OV_D || {}).triage_pending;
  if (!t || !t.n) return "";
  const hot = t.hot ? `그중 점수 ${num(t.hot_min)}점 이상이 ${num(t.hot)}건입니다. ` : "";
  return `<div class="empty"><b>심사할 검색어가 ${num(t.n)}건 남았습니다</b>
    <p>${hot}심사에서 [작업]으로 보낸 검색어가 여기 개선 기회로 섭니다.</p>
    ${READONLY ? "" : `<div class="acts"><button class="go" onclick="SM.touched=true;SM.show('triage')">심사하기</button></div>`}</div>`;
}
// 다 처리한 뒤의 빈 상자 — 끝난 것이 실제로 있는 상태 묶음으로 보낸다. 전부 「저절로 풀림」인
// 사이트에서 [완료·제외]으로 보내면 거기서 또 빈 목록을 만났다. 이름은 거르개와 같은 말(OPP_ST_OPT).
function OV_doneBox() {
  const tri = OV_triageBox();
  if (tri) return tri;
  const n = st => OPPS.filter(o => window.oppStMatch(o, st)).length;
  const st = ["closed", "resolved"].find(s => n(s) > 0);
  const name = st && (window.OPP_ST_OPT.find(([v]) => v === st) || [, st])[1];
  return `<div class="empty ok"><b>남은 기회가 없습니다</b>
    <p>쌓인 것을 전부 처리했습니다.${name ? ` 끝난 것은 [${esc(name)}]에 그대로 있습니다.` : ""}</p>
    ${name ? `<div class="acts"><button class="go sec" onclick="oppClosed('${st}')">${esc(name)} 보기</button></div>` : ""}</div>`;
}
function filterKind(el) {
  const k = el.dataset.k;
  KIND_FILTER = KIND_FILTER === k ? null : k;
  renderOpps(OV_PAGE);
}

// 도구줄·칩은 데이터가 바뀔 때만 다시 그린다 — 매 키 입력마다 갈아치우면 찾기 칸이
// 사라져 포커스를 잃는다. 거르기는 아래 목록만 다시 그린다(oppList).
function renderOpps(n) {
  OPP_N = n;
  const tbox = $("opp-tools");
  if (!OPPS.length) {
    if (tbox) tbox.innerHTML = "";
    $("ov-grid").classList.remove("ovb");
    $("ov-kinds").hidden = true; OV_KSIG = "";
    $("ov-spot").hidden = true;
    // 칩은 놓지 않는다 — 이 상태에서는 띠가 [기회 분석]을 주요 행동으로 들고 있고,
    // 화면 머리에도 같은 명령이 있다(D14: 한 화면에 같은 칩 세 번).
    return $("opps").innerHTML = OV_triageBox() ||
      `<div class="empty"><b>아직 기회가 없습니다</b>
        <p>수집한 숫자에서 손댈 곳을 점수 순으로 찾습니다.</p></div>`;
  }
  const stn = s => OPPS.filter(o => window.oppStMatch(o, s)).length;
  // 박제본은 손댈 수 없는 기록이다 — 찾기·거르기는 그때 그 사람이 쓰던 손잡이고,
  // 종이로 나가면 뜻이 없다. CSV 는 남긴다(브라우저 안에서 끝나는 일이다).
  // 한 번에 다 보이는 목록(첫 화면에 다 들어가는)에는 찾기 칸과 종류 칩을 안 세운다 — 네 줄을
  // 거르려고 손잡이 다섯 개를 먼저 읽게 된다. 상태 거르개는 남긴다: 끝낸 것을 보는
  // 길이 그것뿐이다.
  const few = OPPS.length <= OV_PAGE;
  // 손잡이가 없는데 거른 조건이 남으면 풀 길이 없다(많던 사이트에서 옮겨 온 경우).
  if (few && !READONLY) { OPP_Q = ""; KIND_FILTER = null; }
  if (tbox) tbox.innerHTML = READONLY
    ? `<span class="n" id="oppn"></span>
       <button class="go sm sec" onclick="oppCsv()">CSV 내려받기</button>`
    : OV_viewSeg() + (few ? "" : `<input type="search" value="${esc(OPP_Q)}" oninput="oppFind(this.value)"
        placeholder="검색어·주소로 찾기" aria-label="기회 찾기">`) + `
      ${OV_isBoard() ? "" : window.oppStSelect(OPP_ST, "oppStatus", stn)}
      <span class="n" id="oppn"></span>
      <button class="go sm sec" onclick="oppCsv()"
        title="지금 걸러 놓은 목록 그대로 내려받습니다">CSV 내려받기</button>`;
  // 종류 칩(#oppchips)은 이제 종류별 기회 카드가 갖는다 — 목록 위에 두 줄로 서 있지 않다.
  // 보드는 칸이 셋이라 대기열 카드가 전폭이 된다(격자의 .ovb).
  $("ov-grid").classList.toggle("ovb", OV_isBoard());
  $("opps").innerHTML = `<div id="opplist"></div><div id="opphold"></div>`;
  oppList();
}

/* 관찰 중이라 뺀 기회 — 목록에서 조용히 사라지면 "어디 갔지"가 된다. 몇 건을 왜 뺐는지와
   모아 보는 곳을 목록 바로 아래 한 줄로 말한다. 판정은 서버(o.hold, d.holds)가 했다.
   [관찰 중] 화면이 이 배포에 없으면(옛 박제본) 거르개를 그 묶음으로 돌린다. */
let OV_HELD = 0, OV_HELD_PAGES = 0;
function OV_holdLine() {
  const el = $("opphold");
  if (!el) return;
  // 세는 단위는 [관찰 중] 화면과 같다 — 묶은 줄이 아니라 페이로드에 실린 기회 하나하나.
  const n = OV_HELD;
  if (!n || OPP_ST === "hold" || OPP_ST === "all") return el.innerHTML = "";
  const pages = OV_HELD_PAGES;
  const go = SM.at("hold") >= 0 ? `SM.show('hold')` : `oppClosed('hold')`;
  // 거르개의 [관찰 중 (N)]은 이 목록의 줄(같은 지면끼리 묶음) 수라 기회 수와 다르다 — 둘을 같이 적는다.
  const lines = OPPS.filter(o => window.oppStMatch(o, "hold")).length;
  el.innerHTML = `<p class="opp-held">고친 지 얼마 안 된 페이지${pages ? ` ${pages}곳` : ""}에 걸린 기회
    ${n}건${lines && lines !== n ? `(이 목록에서 ${lines}줄)` : ""}은 효과를 지켜보는 동안 이 목록에서 뺐습니다.
    ${READONLY ? "" : `<button class="go sm ghost" onclick="${go}">관찰 중인 기회 보기 →</button>`}</p>`;
}

/* 종류별 기회 카드 — 도넛은 장식이 아니라 종류 칩(filterKind)의 그림판이다. 범례 한 줄이 칩이고
   (data-k·aria-pressed 그대로), 누르면 목록이 그 종류만 남는다. 열일곱 종류를 다 조각내면 안 읽히므로
   조각은 많은 순 다섯 + 기타이고, 범례는 여섯 줄에 [모두 보기]가 나머지를 편다.
   개수는 지금 보고 있는 상태 묶음 기준이다(한 줄이 여러 종류일 수 있어 합이 줄 수보다 클 수 있다).
   색은 순서를 말할 뿐 뜻이 없다 — 방어형(산화동)은 목록의 종류 알약이 이미 말한다. */
const OV_TONES = [["--accent", 1], ["--info", 1], ["--accent", .5], ["--info", .5], ["--sub", .5], ["--sub", .26]];
const OV_toneCss = ([v, a]) => a === 1 ? `var(${v})` : `color-mix(in srgb, var(${v}) ${a * 100}%, var(--card))`;
let OV_KALL = false, OV_KSIG = "";
function OV_kindsAll() { OV_KALL = !OV_KALL; oppChips(); }
function oppChips() {
  const el = $("oppchips"), card = $("ov-kinds");
  if (!el || !card) return;
  const counts = {};
  for (const o of oppByStatus()) for (const [k] of OV_kinds(o)) counts[k] = (counts[k] || 0) + 1;
  if (KIND_FILTER && !counts[KIND_FILTER]) KIND_FILTER = null;  // 상태·사이트 전환 시 잔존 필터
  const kinds = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
  // 박제본·한 번에 다 보이는 목록·종류 하나뿐인 목록에는 카드를 안 세운다.
  card.hidden = READONLY || OPPS.length <= OV_PAGE || kinds.length < 2;
  if (card.hidden) { el.innerHTML = ""; OV_KSIG = ""; return; }
  const name = k => (window.KIND_LABELS || {})[k] || k;
  const tone = i => OV_TONES[Math.min(i, OV_TONES.length - 1)];
  const idx = k => kinds.indexOf(k);
  const rows = kinds.filter((k, i) => OV_KALL || i < 6 || k === KIND_FILTER);
  const mx = counts[kinds[0]] || 1;
  el.innerHTML = rows.map(k => `<button type="button" class="chip${KIND_FILTER === k ? " on" : ""}"
      data-k="${esc(k)}" onclick="filterKind(this)" aria-pressed="${KIND_FILTER === k}">
      <i class="dot" style="background:${OV_toneCss(tone(idx(k)))}"></i><span class="nm">${esc(name(k))}</span>
      <b>${counts[k]}</b><span class="bar"><em style="width:${Math.max(4, counts[k] / mx * 100).toFixed(0)}%;background:${
        OV_toneCss(tone(idx(k)))}"></em></span></button>`).join("")
    + (kinds.length > 6 ? `<button type="button" class="gov ovk-all" onclick="OV_kindsAll()">${
        OV_KALL ? "접기" : `모두 보기 (${kinds.length}종)`}</button>` : "");
  // 도넛은 조각이 달라질 때만 다시 세운다 — 찾기 칸에 글자를 칠 때마다 갈아치우지 않는다.
  const head = kinds.slice(0, 5), tail = kinds.slice(5);
  const data = head.map(k => counts[k]).concat(tail.length ? [tail.reduce((s, k) => s + counts[k], 0)] : []);
  const names = head.map(name).concat(tail.length ? [`기타 ${tail.length}종`] : []);
  const on = KIND_FILTER == null ? -1 : (idx(KIND_FILTER) < 5 ? idx(KIND_FILTER) : 5);
  const sig = data.join(",") + "#" + on;
  const dn = $("ov-donut");
  if (sig !== OV_KSIG || !dn.firstElementChild) {
    OV_KSIG = sig;
    const total = data.reduce((s, v) => s + v, 0);
    dn.innerHTML = chMount(T => {
      const S = getComputedStyle(document.documentElement);
      return {type: "doughnut",
        data: {labels: names, datasets: [{data,
          backgroundColor: data.map((_, i) => {
            const [v, a] = tone(i);
            return chA(S.getPropertyValue(v).trim(), on < 0 || on === i ? a : a * .3);
          }),
          borderColor: T.card, borderWidth: 2}]},
        options: {responsive: true, maintainAspectRatio: false, cutout: "68%",
          plugins: {legend: {display: false},
            tooltip: chTipSays(T, {callbacks: {title: c => c[0].label,
              label: c => `${num(c.raw)}건 (${(c.raw / total * 100).toFixed(0)}%)`}})}}};
    }, `종류별 기회 — ${names.map((n, i) => `${n} ${data[i]}건`).join(", ")}`, "width:136px;height:136px")
      + `<div class="ovk-c"><b></b><span>줄</span></div>`;
  }
  dn.querySelector(".ovk-c b").textContent = num(oppFiltered().length);
}

function oppList() {
  OV_drawerSync();
  oppChips();
  OV_holdLine();
  OV_spot();
  const list = oppFiltered();
  // 개수를 두 번 적지 않는다 — 상태 거르개가 이미 "아직 안 함 (2)" 로 말한다.
  // 그 위에 무엇이 더 걸렸을 때(찾는 말·종류 칩)만 몇 건이 남았는지 적는다.
  // 박제본에는 거르개가 없다 — 거기서는 이 자리가 개수를 말하는 유일한 곳이다.
  const narrowed = list.length !== oppByStatus().length;
  $("oppn").textContent = narrowed ? `${list.length}건 / 전체 ${OPPS.length}건`
    : READONLY ? `${OPPS.length}건` : "";
  // 보드는 비어도 칸을 세운다 — 칸이 곧 끌어 놓을 자리다.
  if (OV_isBoard()) return OV_board(list);
  // 기본 상태(아직 안 함)만 걸린 채로 비었으면 그건 거른 탓이 아니라 다 처리한
  // 것이다 — 여기서 "조건을 풀라"고 하면 안 건 조건을 풀라는 말이 된다.
  if (!list.length)
    return $("opplist").innerHTML = (OPP_Q.trim() || KIND_FILTER || (OPP_ST && OPP_ST !== "open"))
      ? `<div class="empty"><b>거른 조건에 맞는 기회가 없습니다</b>
        <p>찾는 말이나 상태를 좁혀 놓았습니다. 조건을 풀면 전체가 다시 보입니다.</p>
        <div class="acts"><button class="go sec" onclick="oppReset()">조건 지우기</button></div></div>`
      : OV_doneBox();
  const rest = list.length - OPP_N;
  $("opplist").innerHTML = `<div class="ovrows">${list.slice(0, OPP_N).map(oppRow).join("")}</div>` + (rest > 0
    ? `<div class="acts opp-more">
         <button onclick="oppMore(${OPP_N + 12})">${Math.min(12, rest)}건 더 보기 (남은 ${rest}건)</button></div>`
    : "");
}

/* ── 보드: 같은 기회를 상태 칸으로 ─────────────────────────────────────
      목록은 "무엇부터"에 답하고, 보드는 "얼마나 남았고 무엇이 진행 중인가"에 답한다.
      재료는 목록과 같은 OPPS(묶인 줄)고, 거르기(찾는 말·종류 칩)도 같은 것을 쓴다 —
      상태 거르개만 칸이 대신한다. 칸 이름은 OPP_LABEL 한 벌에서 온다.
      카드를 다른 칸에 놓으면 그 상태로 옮긴다: 묶인 줄이면 묶인 id 전부(oppIdsTo) —
      상태 버튼·열기·복사와 같은 범위라야 새로고침 뒤 한 줄이 둘로 갈라지지 않는다.
      [(도구)로 열기]·[요청문 복사]는 목록과 같은 함수라, 누르면 진행 중으로 옮기고
      load() 가 다시 그리면서 카드가 진행 중 칸으로 간다.
      제외·저절로 풀림은 칸을 안 만든다 — 할 일 흐름 밖이라 목록에서 본다. 관찰 중인
      기회도 칸에 안 오른다(목록 기본값과 같다) — 보드 밑 한 줄(OV_holdLine)이 말한다. */
const OV_COLS = ["new", "acked", "done"];
const OV_BOARD_PAGE = 12;
let OV_COL_N = {};
let OPP_VIEW = (() => {
  try { return localStorage.getItem("sm:oppview") === "board" ? "board" : "list"; }
  catch (e) { return "list"; }
})();
// 박제본은 손댈 수 없는 기록이라 끌 곳이 없다 — 늘 목록이다.
const OV_isBoard = () => OPP_VIEW === "board" && !READONLY;
const OV_viewSeg = () => `<span class="kseg" role="group" aria-label="보기 방식">${
  [["list", "목록"], ["board", "보드"]].map(([v, l]) =>
    `<button type="button" class="chip${OPP_VIEW === v ? " on" : ""}" aria-pressed="${OPP_VIEW === v}"
      onclick="OV_setView('${v}')">${l}</button>`).join("")}</span>`;
function OV_setView(v, quiet) {
  OPP_VIEW = v;
  try { localStorage.setItem("sm:oppview", v); } catch (e) { /* 사생활 창 — 이번만 */ }
  if (!quiet) renderOpps(OV_PAGE);
}
function OV_colMore(st) { OV_COL_N[st] = (OV_COL_N[st] || OV_BOARD_PAGE) + OV_BOARD_PAGE; oppList(); }

// 칸이 비었을 때 — 어떻게 채워지는지를 말한다. 넘기는 행동의 이름은 배포마다 다르다.
const OV_COL_EMPTY = {
  new: () => "남은 할 일이 없습니다.",
  acked: () => `진행 중인 기회가 없습니다. 할 일 카드에서 ${window.SM_HOSTED
    ? "[요청문 복사]를 누르거나" : "도구로 열거나"} 이 칸으로 끌어 놓으면 여기로 옵니다.`,
  done: () => "끝낸 기회를 이 칸으로 끌어 놓으면 완료로 옮깁니다.",
};

// 카드의 행동 — 할 일·진행 중이면 일을 도구에 넘기는 손잡이(로컬 [(도구)로 열기],
// 호스팅 [요청문 복사]), 그다음 상태 하나(OPP_NEXT). 둘 다 목록 줄과 같은 함수다.
function OV_cardActs(o) {
  if (o.id == null) return "";
  const n = OPP_NEXT[o.status];
  const next = n ? oppBtn(o, n[0]) : "";
  const hand = o.status === "new" || o.status === "acked"
    ? (window.SM_HOSTED
        ? askBlock({brief: o.brief, ack: o.status === "new" ? oppIdsTo(o, "acked") : []})
        : (SM.host.oppBtn ? SM.host.oppBtn(o) : ""))
    : "";
  return hand + next;
}
function OV_card(o) {
  const n = OV_targets(o).length;
  return `<article class="kcard" draggable="true" data-card="${o.id}"
      ondragstart="OV_drag(event)" ondragend="OV_dragEnd(event)">
    <div class="kc-h">${oppScore(o)}<div class="target">${esc(targetLabel(o.target))}</div></div>
    <div class="kc-k">${OV_kinds(o).map(([k, l]) => `<span class="kind${isDefensive(k === o.kind
        ? o : {kind: k}) ? " k-def" : ""}">${esc(l)}</span>`).join("")}${n > 1
      ? `<span class="badge" title="같은 지면이라 한 장으로 묶었습니다">검색어 ${n}개</span>` : ""}${
      window.madeBadge(o)}</div>
    ${o.reasoning ? `<div class="why">${esc(o.reasoning)}</div>` : ""}
    <div class="acts">${OV_cardActs(o)}<button type="button" class="go sm ghost"
      onclick="OV_boardOpen(${o.id})">자세히</button></div>
  </article>`;
}
function OV_board(list) {
  const cols = OV_COLS.map(st => {
    const rows = list.filter(o => o.status === st);
    const shown = OV_COL_N[st] || OV_BOARD_PAGE, rest = rows.length - shown;
    const label = window.OPP_LABEL[st] || st;
    return `<div role="group" class="kcol kcol-${st}" data-st="${st}" aria-label="${esc(label)} ${rows.length}건"
        ondragover="OV_over(event)" ondragleave="OV_leave(event)" ondrop="OV_drop(event)">
      <div class="kc-top"><h3>${esc(label)}</h3><span class="kc-n">${num(rows.length)}</span></div>
      <div class="kc-list">${rows.length ? rows.slice(0, shown).map(OV_card).join("")
        : `<p class="kc-empty">${esc(OV_COL_EMPTY[st]())}</p>`}</div>
      ${rest > 0 ? `<div class="acts kc-more"><button type="button" onclick="OV_colMore('${st}')"
        >${Math.min(OV_BOARD_PAGE, rest)}건 더 보기 (남은 ${rest}건)</button></div>` : ""}
    </div>`;
  }).join("");
  // 칸에 안 오르는 상태도 있다고 말한다 — 안 말하면 개수가 목록과 안 맞아 보인다.
  const off = ["dismissed", "resolved"].map(st => [st, OPPS.filter(o => o.status === st).length])
    .filter(([, c]) => c);
  $("opplist").innerHTML = `<div class="kboard">${cols}</div>` + (off.length
    ? `<p class="kc-foot">${off.map(([st, c]) => `${esc(window.OPP_LABEL[st] || st)} ${num(c)}건`)
        .join(" · ")}은 보드에 올리지 않습니다. <button type="button" class="gov"
        onclick="OV_listAt('')">목록에서 전체 보기</button></p>` : "");
}

// 끌어 놓기 — 놓는 순간 카드를 그 칸으로 먼저 옮겨 두고(기다리는 동안 제자리로 튀지
// 않게), 서버가 답하면 load() 가 다시 그린다. 실패하면 setOpp 가 말하고 여기서 원래
// 칸으로 되돌려 그린다(거짓 성공을 남기지 않는다). 묶인 줄(setOpps)은 성패와 상관없이
// load() 가 서버에 실제로 남은 상태로 다시 그린다.
let OV_DRAG = null;
function OV_drag(e) {
  const c = e.currentTarget;
  OV_DRAG = Number(c.dataset.card);
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", String(OV_DRAG));
  c.classList.add("dragging");
}
function OV_dragEnd(e) {
  e.currentTarget.classList.remove("dragging");
  document.querySelectorAll(".kcol.over").forEach(x => x.classList.remove("over"));
  OV_DRAG = null;
}
function OV_over(e) {
  if (OV_DRAG == null) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = "move";
  e.currentTarget.classList.add("over");
}
function OV_leave(e) {
  if (!e.currentTarget.contains(e.relatedTarget)) e.currentTarget.classList.remove("over");
}
function OV_drop(e) {
  e.preventDefault();
  const col = e.currentTarget, st = col.dataset.st, id = OV_DRAG;
  col.classList.remove("over");
  OV_DRAG = null;
  const o = OPPS.find(x => x.id === id);
  if (!o || o.status === st) return;
  const card = document.querySelector(`.kcard[data-card="${id}"]`);
  const box = col.querySelector(".kc-list");
  if (card && box) {
    const empty = box.querySelector(".kc-empty");
    if (empty) empty.remove();
    box.prepend(card);
  }
  OV_move(o, st);
}
async function OV_move(o, st) {
  const ids = oppIdsTo(o, st);
  if (!ids.length) return oppList();
  if (ids.length > 1) return setOpps(ids, st);
  if (!(await setOpp(ids[0], st))) oppList();
}

// [자세히] — 보드 카드에는 펼침 패널을 안 넣는다(좁은 칸에 표·요청문이 끼면 칸이
// 무너진다). 화면에서는 오른쪽 서랍으로 연다. 서랍이 없는 자리(박제본)만 목록으로 돌아가
// 그 줄을 펴서 보여 준다 — 상태 거르개는 그 줄이 드는 묶음으로.
function OV_listAt(st) { OV_setView("list", true); OPP_ST = st; KIND_FILTER = null; renderOpps(OV_PAGE); }
function OV_boardOpen(id) {
  const o = OPPS.find(x => x.id === id);
  if (!o) return;
  // 화면에서는 보드 그대로 서랍을 연다 — 목록으로 옮겨 펼칠 까닭이 사라졌다(서랍은 칸을 안 무너뜨린다).
  if (!READONLY) return OV_drawer(id, document.querySelector(`.kcard[data-card="${id}"] .acts .ghost`));
  OV_setView("list", true);
  OPP_Q = ""; KIND_FILTER = null;
  OPP_ST = ["open", "closed", "resolved"].find(s => window.oppStMatch(o, s)) || "";
  const at = oppFiltered().indexOf(o);
  renderOpps(Math.max(OV_PAGE, at + 1));
  const row = document.querySelector(`#opplist details.opp[data-opp="${id}"]`);
  if (!row) return;
  row.open = true;
  row.scrollIntoView({behavior: "smooth", block: "center"});
}

// 트리아지는 화면 밖에서도 이어진다 — 지금 거른 목록 그대로 표로 내보낸다.
// 파일로 만드는 일은 뼈대의 csv() 한 벌이 한다 — 여기는 무엇을 담을지만 정한다.
function oppCsv() {
  csv("기회", [["점수", "종류", "상태", "대상", "함께 묶인 검색어", "근거", "생성일"]].concat(
    oppFiltered().map(o => [o.score ?? "", OV_kinds(o).map(([, l]) => l).join(" · "),
      window.OPP_LABEL[o.status] || o.status, o.target,
      OV_targets(o).filter(t => t !== o.target).join(" · "),
      (o.reasoning || "").replace(/\s+/g, " "), o.created || ""])));
}

/* ── 다음 행동 띠 ───────────────────────────────────────────
      이 화면은 첫 화면이다 — 세 상태(수집 전 · 뽑기 전 · 찬 화면) 어디서든 "그래서
      뭘 하나"가 머리 바로 아래 한 문장으로 서야 한다. 여태는 찬 화면일 때만 말이
      없었다: 기회가 스무 건 쌓여 있어도 어느 것부터 여는지는 아무 데도 안 적혔다.
      새 판정을 만들지 않는다 — 목록 맨 위가 곧 점수 1등이다(서버가 정렬해 보낸다). */
function OV_openTop() {
  if (OV_isBoard()) {
    const top = OPPS.find(o => o.status === "new") || OPPS.find(o => window.oppStMatch(o, "open"));
    return top && OV_boardOpen(top.id);
  }
  const card = document.querySelector("#opplist details.opp");
  if (!card) return;
  card.open = true;
  card.scrollIntoView({behavior: "smooth", block: "center"});
}


/* ── 기회 상세 서랍 ─────────────────────────────────────────────────────
   목록 줄(<details class="opp">)을 여는 모든 길 — 누르기·[기회 열기]·보드 [자세히]·[기록]의
   되돌아가기 — 이 여기로 온다: 여는 쪽은 여전히 row.open = true 만 하고, toggle 을 받아 줄은
   다시 접고 서랍을 연다. 그래서 여는 쪽 네 곳을 고치지 않는다. 박제본(READONLY)과 인쇄는
   손대지 않는다 — 거기서는 제자리 펼침이 맞다(종이에 서랍은 없다). */
let OV_D = {}, OV_DR = null, OV_DR_TAB = "ev", OV_DR_FROM = null, OV_PRINTING = false;
// 같은 서랍에 [이번 달 할 일]도 칠한다(OV_play) — 둘 중 하나만 선다: OV_DR(기회) 또는 OV_PL(할 일).
let OV_PL = null, OV_PL_TAB = "fix";
// 이 뷰는 셸 스크립트보다 위에 꽂힌다 — 문서의 <details open> 은 셸이 READONLY 를 선언하기
// 전에 toggle 을 쏜다. 그래서 대상부터 거르고, READONLY 는 선언됐는지 보고 읽는다.
const OV_RO = () => typeof READONLY === "undefined" || READONLY;
addEventListener("beforeprint", () => { OV_PRINTING = true; });
addEventListener("afterprint", () => { setTimeout(() => { OV_PRINTING = false; }, 0); });
document.addEventListener("click", e => {
  const sum = e.target.closest && e.target.closest("#opplist details.opp > summary");
  if (!sum || OV_RO()) return;
  e.preventDefault();
  OV_drawer(+sum.parentElement.dataset.opp, sum);
});
document.addEventListener("toggle", e => {
  const el = e.target;
  if (!el.matches || !el.matches("#opplist details.opp") || !el.open || OV_PRINTING || OV_RO()) return;
  el.open = false;
  OV_drawer(+el.dataset.opp, el.querySelector("summary"));
}, true);

function OV_drawerEls() {
  const box = $("view-overview");
  let dr = $("ov-drawer");
  if (!dr && box) {
    box.insertAdjacentHTML("beforeend", `<div class="odr-bg" id="ov-drawer-bg" hidden
      onclick="OV_drawerClose()"></div><aside class="odr" id="ov-drawer" role="dialog"
      aria-labelledby="odr-t" hidden onkeydown="if(event.key==='Escape')OV_drawerClose()"></aside>`);
    dr = $("ov-drawer");
  }
  return dr;
}
function OV_drawer(id, from) {
  const o = OPPS.find(x => x.id === id);
  const dr = OV_drawerEls();
  if (!o || !dr) return;
  if (OV_DR !== id) OV_DR_TAB = "ev";
  // 할 일 서랍이 떠 있었으면 그 자리를 내준다 — 되돌아갈 곳도 이제 이 줄이다.
  if (OV_PL != null) { OV_playMark(null); OV_PL = null; OV_DR_FROM = null; }
  OV_DR = id;
  if (from) OV_DR_FROM = from;
  OV_drawerPaint(o);
  dr.hidden = false;
  $("ov-drawer-bg").hidden = false;
  const x = dr.querySelector(".odr-x");
  if (x) x.focus({preventScroll: true});
}
function OV_drawerClose() {
  const dr = $("ov-drawer");
  if (!dr || dr.hidden) return;
  dr.hidden = true;
  $("ov-drawer-bg").hidden = true;
  document.querySelectorAll("#opplist details.opp.odr-on").forEach(x => x.classList.remove("odr-on"));
  OV_playMark(null);
  // 연 줄로 초점을 돌려준다 — 상태를 바꿨으면 목록이 다시 그려져 그 요소는 없다. 같은 줄을 다시 찾는다.
  const back = OV_DR_FROM && OV_DR_FROM.isConnected ? OV_DR_FROM
    : OV_PL != null ? document.querySelector(`#plays .ovp[data-play="${OV_PL}"]`)
    : document.querySelector(`#opplist details.opp[data-opp="${OV_DR}"] > summary`);
  OV_DR = null;
  OV_PL = null;
  OV_DR_FROM = null;
  if (back) back.focus({preventScroll: true});
}
// 다시 그려진 목록에 맞춘다 — 상태를 바꾸면 load() 가 화면을 새로 그린다. 같은 줄이 아직
// 있으면 새 값으로 다시 칠하고(보던 탭 그대로), 없어졌으면(사이트를 바꿨다) 닫는다.
function OV_drawerSync() {
  if (OV_DR == null) return;
  const o = OPPS.find(x => x.id === OV_DR);
  if (!o) return OV_drawerClose();
  OV_drawerPaint(o);
}
function OV_drawerTab(t) {
  if (OV_PL != null) OV_PL_TAB = t; else OV_DR_TAB = t;
  const dr = $("ov-drawer");
  dr.querySelectorAll(".odr-tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.t === t));
  dr.querySelectorAll("[data-panel]").forEach(p => { p.hidden = p.dataset.panel !== t; });
}
// 근거 칸 — 순위 조회가 잰 그 행(rank_by_kw)과 키워드 표의 검색량(o.volume, 묶인 줄이면 대표
// 변형의 것)에서 읽는다. 없는 수는 칸째 뺀다(빈 칸에 "—"를 세우지 않는다).
function OV_drTiles(o) {
  const r = (OV_D.rank_by_kw || {})[o.target];
  const vol = o.volume || (o.group && o.group.variants[0] && o.group.variants[0].volume);
  const t = [];
  if (r) t.push(["", `실제 순위${OV_D.rank_date ? ` · ${esc(OV_D.rank_date.slice(5))}` : ""}`,
    r.pos != null ? `${r.pos}위` : "잰 범위 밖"]);
  if (vol) t.push(["", "월 검색량", num(vol)]);
  if (r && r.aio != null) t.push(r.aio
    // 출처를 못 받은 줄(aio_cited NULL)은 '안 됨'이 아니라 모른다 — 빠짐으로 칠하지 않는다.
    ? (r.aio_cited == null ? ["", "구글 AI 요약", "있음 · 출처 모름"]
       : r.aio_cited ? ["ok", "구글 AI 요약", "우리 인용됨"] : ["warn", "구글 AI 요약", "우리 인용 안 됨"])
    : ["", "구글 AI 요약", "없음"]);
  return t.length ? `<div class="odr-tiles">${t.map(([c, l, v]) => `<div class="odr-tile${c ? " " + c : ""}">
    <span>${l}</span><b${v.length > 5 ? ` class="s"` : ""}>${esc(v)}</b></div>`).join("")}</div>` : "";
}
// 이 검색어의 검색 결과 상위 — 순위 조회가 남긴 그대로(serp_top). 우리 줄을 칠한다.
function OV_drSerp(o) {
  const rows = ((OV_D.serp_top || {})[o.target] || []).slice(0, 5);
  if (!rows.length) return "";
  return `<h3 class="odr-h3">검색 결과 상위 ${rows.length}${OV_D.rank_date
      ? ` · ${esc(OV_D.rank_date.slice(5))}` : ""}</h3>
    <ol class="odr-serp">${rows.map(x => `<li${x.is_own ? ` class="own"` : ""}>
      <span class="p">${x.position}</span><span class="t" title="${esc(x.title || x.url)}">${
        esc(x.title || x.url)}</span><span class="d">${x.is_own ? "우리" : esc(x.domain || "")}</span></li>`
      ).join("")}</ol>`;
}
function OV_drawerSet(st) {
  const o = OPPS.find(x => x.id === OV_DR);
  if (!o || o.status === st) return;
  const ids = oppIdsTo(o, st);
  if (!ids.length) return;
  ids.length > 1 ? setOpps(ids, st) : setOpp(ids[0], st);
}
// 발판의 [요청문 복사] — 요청문 탭 안의 복사 손잡이(askBlock)를 그대로 누른다. 복사하면서
// '진행 중'으로 옮기는 규칙이 그 버튼에 있다 — 여기서 다시 짜면 두 벌이다.
function OV_drawerCopy(btn) {
  const c = $("ov-drawer").querySelector(".askcopy");
  if (!c) return;
  c.click();
  btn.textContent = "복사함";
  setTimeout(() => { btn.textContent = "요청문 복사"; }, 2000);
}
function OV_drawerPaint(o) {
  const dr = $("ov-drawer");
  const P = window.oppParts(o);
  const p = o.play || {};
  const n = OV_targets(o).length;
  const hosted = !!window.SM_HOSTED;
  const ask = hosted && P.ask && P.ask.includes('class="ask"')
    ? P.ask.replace('<details class="ask">', '<details class="ask" open>') : "";
  const deliver = (p.deliver || []).length ? `<h3 class="odr-h3" style="margin-top:0">요청문으로 받을 것</h3>
    <ol class="odr-deliver">${p.deliver.map(x => `<li><span>${esc(x)}</span></li>`).join("")}</ol>` : "";
  const see = OV_see(o);
  const tabs = [["ev", "근거"], ["do", "할 일"]].concat(ask ? [["ask", "요청문"]] : []);
  if (!tabs.some(([t]) => t === OV_DR_TAB)) OV_DR_TAB = "ev";
  const seg = (o.status === "resolved" ? `<span class="st st-resolved">${window.OPP_LABEL.resolved}</span>` : "")
    + `<div class="odr-seg" role="group" aria-label="상태">${["new", "acked", "done", "dismissed"].map(st =>
      `<button type="button" aria-pressed="${o.status === st}" onclick="OV_drawerSet('${st}')"${
        o.group && o.group.ids.length > 1 ? ` title="이 줄에 묶인 기회 ${o.group.ids.length}개에 모두 적용합니다"` : ""
      }>${window.OPP_LABEL[st]}</button>`).join("")}</div>`;
  const main = hosted ? (ask ? `<button type="button" class="go" onclick="OV_drawerCopy(this)">요청문 복사</button>` : "")
    : (SM.host.oppBtn ? SM.host.oppBtn(o) : "");
  document.querySelectorAll("#opplist details.opp").forEach(x =>
    x.classList.toggle("odr-on", +x.dataset.opp === o.id));
  dr.innerHTML = `<div class="odr-h">
      <div class="odr-top">
        <div class="odr-ring${isDefensive(o) ? " def" : ""}" title="${Number.isFinite(o.score)
          ? `${o.score}점 / 100점. 높을수록 먼저 손댑니다.` : ""}">${Number.isFinite(o.score) ? Math.round(o.score) : "—"}</div>
        <div class="odr-tt"><h2 id="odr-t">${esc(targetLabel(o.target))}</h2>
          <div class="odr-chips">${OV_kinds(o).map(([k, l]) => `<span class="kind${isDefensive(k === o.kind
              ? o : {kind: k}) ? " k-def" : ""}">${esc(l)}</span>`).join("")}${n > 1
            ? `<span class="badge" title="${esc(OV_targets(o).join(" · "))}">검색어 ${n}개</span>` : ""}${
            window.gaBadge(o)}${window.madeBadge(o)}${window.holdBadge(o)}</div></div>
        <button type="button" class="odr-x" aria-label="닫기" onclick="OV_drawerClose()">✕</button>
      </div>
      <div class="odr-tabs" role="tablist">${tabs.map(([t, l]) => `<button type="button" role="tab" data-t="${t}"
        aria-selected="${t === OV_DR_TAB}" onclick="OV_drawerTab('${t}')">${l}</button>`).join("")}</div>
    </div>
    <div class="odr-b">
      <div class="det" role="tabpanel" data-panel="ev"${OV_DR_TAB === "ev" ? "" : " hidden"}>
        ${o.reasoning ? `<p class="odr-why">${esc(o.reasoning)}</p>` : ""}${window.oppClosedWhy(o)}
        ${OV_drTiles(o)}${P.stat}${OV_drSerp(o)}
        ${P.page}${P.note}
        ${P.group}${P.rel}
        ${see ? `<div class="acts">${see}</div>` : ""}
      </div>
      <div class="det" role="tabpanel" data-panel="do"${OV_DR_TAB === "do" ? "" : " hidden"}>
        ${deliver}${P.play}${OV_more(o)}${P.works}
      </div>
      ${ask ? `<div class="det odr-ask" role="tabpanel" data-panel="ask"${OV_DR_TAB === "ask" ? "" : " hidden"}>
        ${ask}${SM.host.oppBtn ? SM.host.oppBtn(o) : ""}</div>` : ""}
    </div>
    <div class="odr-f">${seg}<span class="sp"></span>${main}</div>`;
  deadSweep(dr);
  applyWording(dr);
}

/* ── 이번 달 할 일(plays) ────────────────────────────────────────────────
   도구가 고른 우리 페이지 하나 = 한 줄: 그 페이지를 어떻게 고치면 검색어 여러 개가 같이
   움직이는지, 실제로 읽은 증거, 바로 쓸 수정안. 재료·수정안은 엔진(plays 단계)이 페이로드
   d.plays 로 싣는다 — 화면은 그리기만 한다(새 판정을 만들지 않는다). 옛 박제본·옛 페이로드
   에는 이 키가 없다 — 그때는 빈 목록이다.
   줄을 누르면 기회와 **같은 서랍 상자**(#ov-drawer)에 칠한다. 서랍은 한 번에 하나라 기회와
   할 일이 겹쳐 열리지 않고, 닫기(Esc·바깥·✕)와 초점 되돌리기도 한 벌(OV_drawerClose)이다.
   박제본은 줄을 문장으로만 남긴다 — 서랍·만들기 버튼이 없다(누를 서버가 없다). */
const OV_PLAYS_N = 5, OV_PLAY_KW = 3;
const OV_PLAY_ST = {new: ["", "할 일"], applied: ["made", "PR 만듦"], dismissed: ["muted", "뺌"]};
let OV_PLAYS = [];
const OV_playOf = id => OV_PLAYS.find(p => p.id === id);
const OV_playSt = p => {
  const [c, l] = OV_PLAY_ST[p.status] || ["", p.status || "할 일"];
  return `<span class="badge${c ? " " + c : ""}">${esc(l)}</span>`;
};
// 검색어 칩 — 앞의 몇 개만, 나머지는 「외 N」(전부는 서랍의 증거가 말한다).
const OV_playKws = (ks, n = OV_PLAY_KW) => {
  const a = (ks || []).filter(Boolean);
  return a.slice(0, n).map(k => `<span class="ovp-k">${esc(k)}</span>`).join("")
    + (a.length > n ? `<span class="ovp-k" title="${esc(a.slice(n).join(" · "))}">외 ${a.length - n}</span>` : "");
};
const OV_playDate = p => p.created_at ? `<span class="ovp-d" title="${esc(p.created_at)}">${
  esc(String(p.created_at).slice(5, 10))}</span>` : "";
// 줄·서랍 머리의 강조 — 서랍이 보고 있는 할 일 한 줄만.
function OV_playMark(id) {
  document.querySelectorAll("#plays .ovp").forEach(x => x.classList.toggle("odr-on", id != null && +x.dataset.play === id));
}

function OV_plays(d) {
  OV_PLAYS = (Array.isArray(d.plays) ? d.plays : []).filter(p => p && p.id != null && p.status !== "dismissed")
    .sort((a, b) => (b.score || 0) - (a.score || 0)).slice(0, OV_PLAYS_N);
  const at = d.plays_at ? String(d.plays_at).slice(0, 10) : "";
  $("plays-sub").innerHTML = (READONLY
      ? "이 기록을 남긴 시점에 도구가 페이지를 읽고 만든 수정안입니다."
      : "도구가 우리 페이지와 상위 결과를 직접 읽고 만든 수정안입니다. 페이지 하나를 고치면 검색어 여러 개가 같이 움직입니다.")
    + (at && OV_PLAYS.length ? ` <span class="nw">${esc(at)}</span> 기준.` : "");
  // 다시 만드는 손잡이는 머리 오른쪽 하나 — 비었을 때는 빈 상태가 주요 행동으로 든다.
  $("plays-tools").innerHTML = OV_PLAYS.length ? OV_act("plays", null, false) : "";
  if (!OV_PLAYS.length) {
    $("plays").innerHTML = READONLY
      ? `<div class="empty"><b>이 기록에는 이번 달 할 일이 없습니다</b>
          <p>기록을 남길 때 도구가 만든 수정안이 없었습니다.</p></div>`
      : `<div class="empty"><b>이번 달 할 일이 아직 없습니다</b>
          <p>도구가 기회를 페이지별로 묶고, 그 페이지와 상위 결과를 직접 읽어 고칠 곳 3~5개를 수정안까지 만들어 둡니다.</p>
          ${OV_acts(OV_act("plays"))}</div>`;
  } else {
    const row = (p, i) => {
      const inner = `<span class="ovp-n" aria-hidden="true">${i + 1}</span>
        <span class="ovp-b"><span class="ovp-t">${esc(p.title || urlPath(p.page))}</span>
          <span class="ovp-m"><span class="ovp-u">${esc(urlPath(p.page))}</span>${OV_playKws(p.keywords)}</span></span>
        <span class="ovp-s">${OV_playSt(p)}${OV_playDate(p)}</span>`;
      return READONLY ? `<li><div class="ovp">${inner}</div></li>`
        : `<li><button type="button" class="ovp" data-play="${Number(p.id)}" aria-haspopup="dialog"
            onclick="OV_play(${Number(p.id)}, this)">${inner}</button></li>`;
    };
    $("plays").innerHTML = `<ol class="ovp-list">${OV_PLAYS.map(row).join("")}</ol>`;
  }
  // 다시 그려졌다(사이트 전환·재적재) — 보던 할 일이 아직 있으면 새 값으로 다시 칠하고, 없으면 닫는다.
  if (OV_PL != null) {
    const p = OV_playOf(OV_PL);
    if (p) { OV_playPaint(p); OV_playMark(p.id); } else OV_drawerClose();
  }
}

function OV_play(id, from) {
  const p = OV_playOf(id), dr = OV_drawerEls();
  if (!p || !dr || OV_RO()) return;
  const bad = OV_playErr(p);
  if (OV_PL !== id) OV_PL_TAB = bad ? "ev" : "fix";
  // 기회 서랍이 떠 있었으면 그 자리를 내준다 — 서랍은 한 번에 하나다.
  document.querySelectorAll("#opplist details.opp.odr-on").forEach(x => x.classList.remove("odr-on"));
  OV_DR = null;
  OV_PL = id;
  OV_DR_FROM = from || null;
  OV_playPaint(p);
  OV_playMark(id);
  dr.hidden = false;
  $("ov-drawer-bg").hidden = false;
  const x = dr.querySelector(".odr-x");
  if (x) x.focus({preventScroll: true});
}
// 수정안을 못 만든 할 일 — 엔진이 result = {error} 를 남긴다. 빈 result 도 같은 뜻이다.
function OV_playErr(p) {
  const r = p.result || {};
  if (r.error) return String(r.error);
  return Object.keys(r).length ? "" : "이유가 남지 않았습니다.";
}

// 수정안 탭 — 요약·근거, 제목·설명·H1 지금 → 새로, 넣을 소제목과 초안, 내부 링크, 신뢰 요소, 기대 효과.
function OV_playFix(r) {
  const ba = [["title", "제목"], ["meta", "설명"], ["h1", "H1"]].filter(([k]) => r[k] && (r[k].new || r[k].now))
    .map(([k, l]) => `<div class="odr-ba"><span>${l}</span><div>
        <div class="now"><i>지금</i> ${r[k].now ? esc(r[k].now) : "없음"}</div>
        <div class="new"><i>새로</i> ${esc(r[k].new || r[k].now || "")}</div></div></div>`).join("");
  const sec = (r.sections || []).filter(s => s && (s.h2 || s.draft));
  const links = (r.links || []).filter(l => l && (l.from || l.anchor));
  const list = xs => `<ul class="odr-list">${xs.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
  const lk = s => /^https?:\/\//.test(String(s || "")) ? `<span class="odr-u">${esc(urlPath(s))}</span>` : esc(s || "");
  return `${r.summary ? `<p class="odr-why">${esc(r.summary)}</p>` : ""}
    ${(r.why || []).length ? list(r.why) : ""}
    ${ba ? `<h3 class="odr-h3">제목·설명·H1</h3>${ba}` : ""}
    ${sec.length ? `<h3 class="odr-h3">넣을 소제목 ${sec.length}개</h3>${sec.map(s => `<div class="odr-sec">
        <b>${esc(s.h2 || "")}</b>${s.draft ? `<p>${esc(s.draft)}</p>` : ""}${(s.for || []).length
          ? `<div class="odr-chips">${OV_playKws(s.for, 6)}</div>` : ""}</div>`).join("")}` : ""}
    ${links.length ? `<h3 class="odr-h3">내부 링크</h3><ul class="odr-list">${links.map(l =>
        `<li>${lk(l.from)}${l.anchor ? ` → 앵커 「${esc(l.anchor)}」` : ""}</li>`).join("")}</ul>` : ""}
    ${(r.trust || []).length ? `<h3 class="odr-h3">신뢰 요소</h3>${list(r.trust)}` : ""}
    ${r.expected ? `<h3 class="odr-h3">기대 효과 · 추정</h3><p class="odr-why">${esc(r.expected)}</p>` : ""}`;
}
// 증거 탭 — 실제로 읽은 것: 우리 페이지 점검값, 검색어별 상위 결과(우리 줄 칠함·소제목), AI 요약, 빠진 주제.
function OV_playEv(ev) {
  const our = ev.our || {};
  const via = {direct: ["", "직접 읽음"], dataforseo: ["", "대신 읽음"], none: ["warn", "못 읽음"]}[our.fetched_via];
  const tiles = [];
  if (Number.isFinite(our.words)) tiles.push(["", "본문 단어", num(our.words)]);
  if (via) tiles.push([via[0], "페이지 읽기", via[1]]);
  const ours = (our.title || our.h1 || our.url) ? `<h3 class="odr-h3" style="margin-top:0">우리 페이지</h3>
    ${our.url ? `<p class="odr-u odr-note">${esc(our.url)}</p>` : ""}
    <div class="odr-ba"><span>제목</span><div class="now">${our.title ? esc(our.title) : "없음"}</div></div>
    <div class="odr-ba"><span>H1</span><div class="now">${our.h1 ? esc(our.h1) : "없음"}</div></div>` : "";
  const byKw = new Map();
  for (const s of ev.serp || []) {
    if (!byKw.has(s.keyword)) byKw.set(s.keyword, []);
    byKw.get(s.keyword).push(s);
  }
  const serp = [...byKw].map(([kw, rows]) => `<h3 class="odr-h3">「${esc(kw || "")}」 검색 결과 상위 ${rows.length}</h3>
    <ol class="odr-serp">${rows.map(sr => {
      const hd = (sr.headings || []).slice(0, 6).map(esc).join(" · ");
      const w = Number.isFinite(sr.words) ? `본문 단어 ${num(sr.words)}` : "";
      return `<li${sr.is_own ? ` class="own"` : ""}><span class="p">${sr.position ?? "—"}</span>
        <span class="t" title="${esc(sr.title || sr.url || "")}">${esc(sr.title || sr.url || "")}</span>
        <span class="d">${sr.is_own ? "우리" : esc(sr.domain || "")}</span>${hd || w
          ? `<div class="h">${[hd && `소제목: ${hd}`, w].filter(Boolean).join(" · ")}</div>` : ""}</li>`;
    }).join("")}</ol>`).join("");
  const aio = (ev.aio || []).map(ai => `<li>${esc(ai.keyword || "")} — ${ai.present
      ? (ai.cited == null ? "AI 요약이 뜨는데 출처를 못 받아 인용 여부는 모름"
         : ai.cited ? "AI 요약에 우리가 인용됨" : "AI 요약이 뜨는데 우리 인용 없음") : "AI 요약 없음"}${(ai.domains || []).length
      ? ` · 인용된 곳 <span class="odr-u">${esc(ai.domains.slice(0, 4).join(", "))}</span>` : ""}</li>`).join("");
  const gaps = (ev.gaps || []).filter(Boolean);
  const body = `${ours}${tiles.length ? `<div class="odr-tiles">${tiles.map(([c, l, v]) => `<div class="odr-tile${
      c ? " " + c : ""}"><span>${l}</span><b class="s">${esc(v)}</b></div>`).join("")}</div>` : ""}${serp}
    ${aio ? `<h3 class="odr-h3">구글 AI 요약</h3><ul class="odr-list">${aio}</ul>` : ""}
    ${gaps.length ? `<h3 class="odr-h3">상위엔 있고 우리엔 없는 것</h3><ul class="odr-list">${
      gaps.map(g => `<li>${esc(g)}</li>`).join("")}</ul>` : ""}`;
  return body.trim() ? body : `<div class="empty"><b>읽어 온 증거가 없습니다</b>
    <p>페이지와 상위 결과를 읽지 못한 채 끝났습니다. 다시 만들면 다시 읽습니다.</p></div>`;
}

function OV_playPaint(p) {
  const dr = $("ov-drawer");
  const r = p.result || {}, ev = p.evidence || {}, bad = OV_playErr(p);
  const tabs = (bad ? [] : [["fix", "수정안"]]).concat([["ev", "증거"], ["doc", "문서"]]);
  if (!tabs.some(([t]) => t === OV_PL_TAB)) OV_PL_TAB = tabs[0][0];
  const n = OV_PLAYS.indexOf(p) + 1;
  const kws = (p.keywords || []).filter(Boolean);
  const pb = SM.host.playBtn ? SM.host.playBtn(p) : "";
  const doc = p.markdown
    ? `<div class="pbox"><textarea readonly rows="18" spellcheck="false" aria-label="할 일 문서 전문">${
        esc(p.markdown)}</textarea></div>
      <div class="acts"><button type="button" class="go sm sec" onclick="OV_playCopy(this)">복사</button>
        <button type="button" class="go sm sec" onclick="OV_playDown()">.md 내려받기</button></div>`
    : `<div class="empty"><b>문서가 없습니다</b><p>수정안을 못 만들면 문서도 만들지 않습니다.</p></div>`;
  dr.innerHTML = `<div class="odr-h">
      <div class="odr-top">
        <div class="odr-ring" title="이번 달 할 일 ${n}번째 — 기대 이득이 큰 순서입니다">${n || "—"}</div>
        <div class="odr-tt"><h2 id="odr-t">${esc(p.title || urlPath(p.page))}</h2>
          <div class="odr-u">${esc(urlPath(p.page))}</div>
          <div class="odr-chips">${OV_playSt(p)}${kws.slice(0, 6).map(k => `<span class="ovp-k">${esc(k)}</span>`).join("")}${
            kws.length > 6 ? `<span class="ovp-k" title="${esc(kws.slice(6).join(" · "))}">외 ${kws.length - 6}</span>` : ""}</div></div>
        <button type="button" class="odr-x" aria-label="닫기" onclick="OV_drawerClose()">✕</button>
      </div>
      <div class="odr-tabs" role="tablist">${tabs.map(([t, l]) => `<button type="button" role="tab" data-t="${t}"
        aria-selected="${t === OV_PL_TAB}" onclick="OV_drawerTab('${t}')">${l}</button>`).join("")}</div>
    </div>
    <div class="odr-b">
      ${bad ? "" : `<div class="det" role="tabpanel" data-panel="fix"${OV_PL_TAB === "fix" ? "" : " hidden"}>${OV_playFix(r)}</div>`}
      <div class="det" role="tabpanel" data-panel="ev"${OV_PL_TAB === "ev" ? "" : " hidden"}>
        ${bad ? `<div class="empty err odr-note"><b>수정안을 못 만들었습니다</b><p>${esc(bad)}</p><p>아래는 그때 읽어 온 증거입니다.</p></div>` : ""}
        ${OV_playEv(ev)}
      </div>
      <div class="det odr-doc" role="tabpanel" data-panel="doc"${OV_PL_TAB === "doc" ? "" : " hidden"}>${doc}</div>
    </div>
    <div class="odr-f">${p.created_at ? `<span class="ovp-m">만든 날 ${OV_playDate(p)}</span>` : ""}<span class="sp"></span>${p.markdown
      ? `<button type="button" class="go${pb ? " sec" : ""}" onclick="OV_playCopy(this)">문서 복사</button>` : ""}${pb}</div>`;
  deadSweep(dr);
  applyWording(dr);
}

// [복사] — 박제본·비보안 출처(file://)에서는 clipboard API 가 막혀 임시 입력칸으로 물러선다.
async function OV_playCopy(btn) {
  const p = OV_playOf(OV_PL);
  if (!p || !p.markdown) return;
  const was = btn.textContent;
  let ok = false;
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(p.markdown); ok = true; }
  } catch (e) { ok = false; }
  if (!ok) {
    const ta = document.createElement("textarea");
    ta.value = p.markdown;
    ta.setAttribute("readonly", "");
    ta.className = "ovp-clip";
    btn.after(ta);
    ta.select();
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    ta.remove();
    btn.focus({preventScroll: true});
  }
  btn.textContent = ok ? "복사함" : "직접 선택";
  setTimeout(() => { btn.textContent = was; }, 2000);
  if (!ok && window.toast) window.toast("복사하지 못했습니다. 문서 탭의 글을 직접 선택해 복사하세요.", "bad");
}
// [.md 내려받기] — 파일 이름은 페이지 경로에서 짓는다(/women/bags → play-women-bags.md).
const OV_playSlug = u => {
  const s = urlPath(u).split(/[?#]/)[0].replace(/^\/+|\/+$/g, "");
  let t;
  try { t = decodeURIComponent(s); } catch (e) { t = s; }
  return "play-" + (t.replace(/[^\w가-힣.-]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 80) || "home");
};
function OV_playDown() {
  const p = OV_playOf(OV_PL);
  if (!p || !p.markdown) return;
  saveFile(`${OV_playSlug(p.page)}.md`, p.markdown, "text/markdown;charset=utf-8");
}

/* ── 스포트라이트: 이 화면의 답 ────────────────────────────────────────
      "지금 무엇부터 손대나"에 대한 답이 첫 화면에 한 장으로 선다 — 1순위 기회와 그걸 여는
      버튼. 새 판정을 만들지 않는다: 목록 맨 위가 곧 점수 1등이다(서버가 정렬해 보낸다).
      보드에서는 첫 「할 일」 카드(OV_openTop 과 같은 규칙)다. 이미 끝낸 것이 맨 위에 서는
      상태(전체·완료 보기)에서는 "먼저 손댈 것"이 아니므로 세우지 않는다. */
function OV_topOpp() {
  if (OV_isBoard())
    return OPPS.find(o => o.status === "new") || OPPS.find(o => window.oppStMatch(o, "open")) || null;
  return oppFiltered()[0] || null;
}
function OV_spot() {
  const el = $("ov-spot");
  if (!el) return;
  const top = OPPS.length ? OV_topOpp() : null;
  if (!top || !window.oppStMatch(top, "open")) { el.hidden = true; el.innerHTML = ""; return; }
  const sc = Number.isFinite(top.score) ? Math.round(top.score) : null;
  const C = 2 * Math.PI * 26, n = OV_targets(top).length;
  el.classList.toggle("def", !!isDefensive(top));
  el.hidden = false;
  el.innerHTML = `<div class="ovs-ring" role="img"
      aria-label="${sc == null ? "점수 없음" : `${sc}점, 100점 만점`}">
      <svg viewBox="0 0 64 64" aria-hidden="true"><circle class="trk" cx="32" cy="32" r="26" fill="none" stroke-width="6"/>
        <circle class="arc" cx="32" cy="32" r="26" fill="none" stroke-width="6" stroke-linecap="round"
          stroke-dasharray="${(sc == null ? 0 : Math.min(100, sc) / 100 * C).toFixed(1)} ${C.toFixed(1)}"/></svg>
      <b>${sc == null ? "—" : sc}<i>점</i></b></div>
    <div class="ovs-b">
      <div class="ovs-k">지금 가장 먼저 손댈 기회</div>
      <div class="ovs-t">${esc(targetLabel(top.target))}</div>
      <div class="ovs-m">${OV_kinds(top).map(([k, l]) => `<span class="kind${isDefensive(k === top.kind
        ? top : {kind: k}) ? " k-def" : ""}">${esc(l)}</span>`).join("")}${n > 1
        ? `<span class="badge" title="같은 지면이라 한 줄로 묶었습니다.">검색어 ${n}개</span>` : ""}</div>
      ${top.reasoning ? `<p class="ovs-w">${esc(top.reasoning)}</p>` : ""}
    </div>
    ${READONLY ? "" : `<div class="ovs-a"><button class="go" onclick="OV_openTop()">기회 열기</button></div>`}`;
}

/* 고친 뒤 달라졌나 — 이름 밑에 그때 → 지금, 오른쪽에 변화 알약. 표로 자르면 4열 카드에서 숫자
   열이 무너져 행 카드로 짰다. 순위는 낮을수록 좋다: 숫자가 줄면 오른 것이다. */
let OV_WATCH_ROWS = [], OV_WATCH_N = 6;
function OV_watchMore() { OV_WATCH_N += 12; OV_watchDraw(); }
function OV_watch(d) { OV_WATCH_ROWS = d.watch || []; OV_watchDraw(); }
function OV_watchDraw() {
  const rows = OV_WATCH_ROWS;
  if (!rows.length)
    return $("watch").innerHTML = `<div class="empty"><b>완료한 검색어가 아직 없습니다</b>
      <p>기회를 완료로 옮기면 여기서 그때와 지금을 나란히 봅니다.</p></div>`;
  const pos = m => m && Number.isFinite(Number(m.position)) ? Number(m.position) : null;
  const f = v => String(Math.round(v * 10) / 10);
  const cell = m => m ? `${m.position}위 · 클릭 ${num(m.clicks)}` : "측정 전";
  const move = w => {
    const b = pos(w.before), a = pos(w.after);
    if (b == null || a == null) return `<span class="chip ne">비교 전</span>`;
    if (a < b) return `<span class="chip up" title="순위가 ${f(b - a)}계단 올랐습니다">↑ ${f(b - a)}위</span>`;
    if (a > b) return `<span class="chip dn" title="순위가 ${f(a - b)}계단 내려갔습니다">↓ ${f(a - b)}위</span>`;
    return `<span class="chip ne">변동 없음</span>`;
  };
  $("watch").innerHTML = `<div class="ovw">${rows.slice(0, OV_WATCH_N).map(w => `<div class="ovw-r">
      <div class="ov-av" aria-hidden="true">${esc([...String(w.target || "?")][0])}</div>
      <div>
        <div class="ovw-n">${esc(w.target)}</div>
        <div class="ovw-m">그때 <span class="nw">${cell(w.before)}</span></div>
        <div class="ovw-m">지금 <span class="nw">${cell(w.after)}</span></div>
        <div class="ovw-m">완료 <span class="nw" title="${esc((w.done_at || "").slice(0, 10))}">${
          esc((w.done_at || "").slice(5, 10))}</span> · 그 뒤 ${w.runs_since}회 측정</div>
        <div class="ovw-st">${w.stalled ? (READONLY ? `<span class="st st-acked">안 올랐음</span>`
        : `<button class="go sm sec" onclick="setOpp(${w.id},'new')" title="두 번 이상 쟀는데 순위가 안 올랐습니다">다시 열기</button>`)
        // 관찰 기간 안 — '지금' 칸의 실적 창에 아직 고치기 전 날이 섞여 있다(db.watch_rows).
        : w.until ? `<span class="badge adv" title="실적이 고친 뒤 날로 찰 때까지 판단을 미룹니다">관찰 중 · ${
            esc(String(w.until).slice(5))}까지</span>` : ""}</div>
      </div>
      <div class="ovw-s">${move(w)}</div>
    </div>`).join("")}</div>` + (rows.length > OV_WATCH_N
    ? `<div class="acts ovw-more"><button type="button" onclick="OV_watchMore()">${
        Math.min(12, rows.length - OV_WATCH_N)}건 더 보기 (남은 ${rows.length - OV_WATCH_N}건)</button></div>` : "");
}

/* 데이터 점검 — 서버(audit_data)가 낸 이상 목록(d.health)을 그리기만 한다. 판정도 등급 이름도
   서버 것이다(d.health_sev). 배지 색은 등급 id 로 고른다 — 색은 거들 뿐 글자가 정본이다.
   없으면(이상 0건·옛 페이로드) 띠째 안 선다 — "이상 없음"을 매번 한 줄 읽힐 까닭이 없다. */
const OV_SEV_CLS = {high: "bad", mid: "warn", low: "adv"};
function OV_health(d) {
  const box = $("ov-health");
  if (!box) return;
  const rows = d.health || [], lab = d.health_sev || {};
  box.hidden = !rows.length;
  if (!rows.length) return;
  const cls = s => OV_SEV_CLS[s] || "muted";
  const n = {};
  for (const f of rows) n[f.sev] = (n[f.sev] || 0) + 1;
  $("ov-health-n").textContent = num(rows.length);
  $("ov-health-sev").innerHTML = Object.keys(n)
    .map(s => `<span class="badge ${cls(s)}">${esc(lab[s] || s)} ${num(n[s])}</span>`).join("");
  $("ov-health-list").innerHTML = rows.map(f => `<li title="${esc(f.code || "")}">
    <span class="badge ${cls(f.sev)}">${esc(lab[f.sev] || f.sev)}</span>
    <div><b>${esc(f.area || "")}</b><p>${esc(f.msg || "")}</p></div></li>`).join("");
}

function OV_next(d) {
  if (!window.nextStep) return;
  // 박제본이라고 여기서 띠를 지우지 않는다 — 문장은 종이에서도 읽을 값이 있고,
  // 누를 수 없는 것만 떼는 일은 셸의 nextStep 이 한 벌로 한다(.acts 를 뗀다).
  const top = oppFiltered()[0];
  // 걸러 놓은 게 있나 — 있으면 "조건을 풀라"가 맞고, 없으면 정말로 다 처리한 것이다.
  const filtered = !!(OPP_Q.trim() || KIND_FILTER || (OPP_ST && OPP_ST !== "open"));
  let html;
  if (!d.gsc_date)
    html = `<p>실적을 아직 수집하지 않았습니다. 이 화면의 숫자가 전부 그 위에서 나옵니다.</p>
      <div class="acts">${OV_act("gsc")}</div>`;
  // 목록이 빈 채 심사에 쌓여 있으면 다음 걸음은 [심사하기] 하나다 — 그 손잡이는 목록 카드의
  // 빈 상태(OV_triageBox)가 든다. 띠가 [기회 분석]이나 "다 처리했다"를 또 말하지 않게 걷는다.
  else if (!top && !filtered && OV_triageBox())
    return nextStep("overview", "");
  else if (!OPPS.length)
    html = `<p>실적은 수집했습니다.
      <span class="live">이제 그 숫자에서 손댈 곳을 뽑을 차례입니다.</span></p>
      <div class="acts">${OV_act("gaps")}</div>`;
  // 다시 뽑는 손잡이는 머리줄이 이미 들고 있다 — 띠에 보조로 또 달면 같은 행동이
  // 한 화면에 둘이다. 띠의 주요 행동은 [기회 열기] 하나다.
  // 찬 화면의 "가장 큰 기회는 …" 문장은 스포트라이트(OV_spot)가 대신 말한다 — 같은 말이
  // 띠와 카드에 둘이 서지 않게 띠를 걷는다. 스포트라이트가 못 서는 상태(끝낸 것이 맨 위인
  // 전체 보기)에서만 띠가 이 문장을 든다.
  else if (top && window.oppStMatch(top, "open"))
    return nextStep("overview", "");
  else if (top) {
    const sc = Number.isFinite(top.score) ? `, ${Math.round(top.score)}점` : "";
    const nq = OV_targets(top).length, kl = OV_kinds(top).map(([, l]) => l);
    const bunch = nq > 1 ? ` (같은 지면의 검색어 ${nq}개를 묶은 줄)` : "";
    html = `<p>가장 큰 기회는 <b>${esc(targetLabel(top.target))}</b>${bunch}입니다.
      ${esc(kl.join(" · "))}${sc}으로 맨 위입니다.</p>
      <div class="acts"><button class="go" onclick="OV_openTop()">기회 열기</button></div>`;
  } else if (filtered)
    html = `<p>걸러 놓은 조건에 남은 기회가 없습니다.
      <span class="live">조건을 풀면 전체가 보입니다.</span></p>
      <div class="acts"><button class="go" onclick="oppReset()">조건 지우기</button></div>`;
  // 쌓인 것을 전부 처리한 상태. 여기서 "조건을 풀라"고 하면 안 건 조건이 없는데도
  // 사용자를 필터로 보내게 된다 — 다음 걸음은 다시 재는 것이다. 그 손잡이는 화면 머리의
  // [이 묶음 다시 재기] 하나다 — 띠에 재실행 버튼을 또 달면 "다시"가 한 화면에 둘이다.
  else
    html = `<p>남은 기회를 모두 처리했습니다.
      <span class="live">다시 수집하면 그 사이 달라진 숫자에서 새 기회가 나옵니다.</span></p>`;
  nextStep("overview", html);
}

VIEW("overview", function (d) {
  const t = d.trend || [];
  const last = t.find(x => x.d === d.gsc_date) || t[t.length - 1] || {};
  // 증감의 기준은 지금 창과 **겹치지 않는** 직전 같은 길이 구간이다(d.gsc_prev_period —
  // 서버가 검색어별 합으로 KPI 와 같은 기준으로 준다). 없으면 바로 앞 수집분(d.gsc_prev)
  // 과 견주는데, 그건 창이 대부분 겹친 28일이라 그렇다고 라벨에 적는다.
  const pp = d.gsc_prev_period;
  const snap = (d.gsc_prev && t.find(x => x.d === d.gsc_prev)) || {};
  const prev = pp ? {clk: pp.clicks, imp: pp.impressions,
    q: (t.find(x => x.d === pp.date) || {}).q} : snap;
  const dates = t.map(x => x.d);
  // 숫자 옆에 기준을 붙인다 — 며칠치인지, 무엇과 비교한 Δ인지 말하지 않으면 못 읽는다.
  const per = d.gsc_period ? `${d.gsc_period}일` : "";
  const md = s => String(s || "").slice(5);
  const gap = d.gsc_prev && d.gsc_date
    ? Math.round((new Date(d.gsc_date) - new Date(d.gsc_prev)) / 864e5) : 0;
  const vs = pp ? `직전 ${per || "기간"}(<span class="nw">${md(pp.from)}~${md(pp.to)}</span>)`
    : gap > 0 ? `${gap === 1 ? "하루" : `${gap}일`} 전 ${per || "수집분"} 대비` : "직전";
  const cmp = pp ? `${pp.from}~${pp.to} 과 비교`
    : d.gsc_prev && d.gsc_date ? `${d.gsc_prev} → ${d.gsc_date}${per ? ` · 같은 ${per} 기준` : ""}` : "";
  // 띠의 합은 검색어별 행을 더한 것이다(gsc_snapshots) — 구글이 가린 검색어는 빠진다.
  // 아래 일별 차트(날짜별 합)보다 작게 나오는 게 정상이라, 출처를 라벨에 싣는다.
  // 안 실으면 한 화면에 "28일 합계 6"과 "합계 19"가 나란히 서서 고장으로 읽혔다.
  // 「노출된 검색어」는 합이 아니라 개수다 — 거기엔 기간만 붙인다.
  const was = k => {
    const base = per && (k === "q" ? `${per} 동안` : `검색어별 ${per} 합계`);
    return [base, Number.isFinite(prev[k]) ? `${vs} ${num(prev[k])}` : "견줄 직전 기록 없음"]
      .filter(Boolean).join(" · ");
  };
  $("band").innerHTML = [
    ["클릭", num(last.clk), delta(last.clk - prev.clk, false, prev.clk, cmp),
      kpiSpark(t.map(x => x.clk), dates, "var(--accent)"), was("clk")],
    ["노출", num(last.imp), delta(last.imp - prev.imp, false, prev.imp, cmp),
      kpiSpark(t.map(x => x.imp), dates, "var(--sub)"), was("imp")],
    ["노출된 검색어", num(last.q),
      delta(last.q - prev.q, false, prev.q, cmp),
      kpiSpark(t.map(x => x.q), dates, "var(--info)"), was("q")],
    // 「추적 검색어」와 「개선 기회」 칸은 두지 않는다. 앞의 것은 [순위 추적]의 숫자이고
    // 칸 안의 [추적에 넣기]가 위 띠의 행동과 겨뤘다. 뒤의 것은 검색어 수라 바로 아래
    // 목록의 줄 수와 달라 "목록에서는 4줄"이라는 설명을 달아야 읽혔다 — 개수는 목록의
    // 상태 거르개가 목록과 같은 단위로 이미 말한다. 호스팅은 여기에 클릭률·평균 순위
    // 두 칸을 붙인다(dash.html kpi) — 칸이 일곱이면 증감이 값 밑으로 떨어졌다.
  ].map(([l, v, dd, sp, b]) => `<div class="m"><div class="v">${v}${dd}</div>
    <div class="l">${l}</div>${b ? `<div class="b">${b}</div>` : ""}${sp}</div>`).join("");

  // 호스팅은 이 자리의 자료(/api/perf 의 daily)를 애드온이 따로 받아 「클릭률과
  // 순위」로 이미 그린다. 그런데 그 자료가 페이로드(d.daily)에는 안 실려 와서,
  // 같은 화면이 "일별 실적이 없습니다"라고 써 놓고 그 아래에서 23일치를 그렸다.
  // 줄이 없는데 호스팅이면 이 섹션을 아예 안 세운다 — 없는 것을 없다고 두 번
  // 말하는 대신, 그 자료를 실제로 가진 섹션 하나만 남긴다.
  const dl = d.daily || [];
  $("daily-sec").hidden = !dl.length && !!window.SM_HOSTED;
  OV_DAILY = {rows: dl, stats: d.daily_stats};
  OV_dailyDraw();

  // 이 절의 눈썹에 "2026-06-01 기준"을 적던 자리를 뗐다 — 레일(#datelab/#gscdate)이
  // 이 화면을 보는 내내 같은 날짜를 이미 보여준다. 여기서 또 적으면 스크롤할 때마다
  // 같은 숫자를 다시 읽는다(QA 8회차). 범위처럼 새 정보가 있을 때만 눈썹에 남긴다
  // (analysis 의 "05-01 → 06-01"이 그 예다) — 단일 날짜 반복은 안 남긴다.
  // 설명 산문은 부제 한 줄로 줄이고 나머지는 툴팁으로 내린다. 박제본에서
  // "누르면 저장됩니다"는 거짓말이다 — 서버가 없어 상태를 못 바꾼다.
  const tip = READONLY
    ? "카드를 펼치면 어느 페이지가 걸렸는지와 할 일이 나옵니다. 막대는 점수(100점 만점)이고, " +
      "확인·완료·제외 표시는 이 기록을 남긴 시점의 상태라 여기서는 바꿀 수 없습니다."
    : "카드를 펼치면 어느 페이지가 걸렸는지와 할 일이 나옵니다. 막대는 점수(100점 만점)이고, " +
      "길수록 먼저 손댑니다.";
  // 서버는 점수 상위 N 건만 싣는다(dashboard._axis_opps 의 limit). 위 띠의 「개선
  // 기회」는 전수(opps_total)라 말이 안 맞는다 — 283 인데 목록·칩·거르개는 전부
  // 200 이고 [더 보기] 를 끝까지 눌러도 200 에서 끝난다. 잘렸으면 잘렸다고 적는다.
  // 그 200 은 같은 지면끼리 한 줄로 접혀 칩에서는 99 로 선다 — 218·200·99 가 한 화면에
  // 설명 없이 섰다(6회차). 접혔으면 몇 줄이 됐는지까지 이어 말한다.
  const gs = d.opp_groups || [];
  const capped = (d.opps || []).length < (d.opps_total || 0)
    ? ` 기회 ${num(d.opps_total)}건 중 점수 높은 ${num(d.opps.length)}개까지 이 화면에 ` +
      // 줄 수는 적지 않는다 — 띠는 처리 안 한 줄만(98), 칩은 상태별로 세서 여기 전체(99)를
      // 또 적으면 300px 안에 세 번째 수가 선다(8회차). 묶인다는 사실만 말한다.
      (gs.some(g => g.ids.length > 1) ? "오고, 같은 지면끼리는 한 줄로 묶입니다." : "옵니다.")
    : "";
  $("opp-sub").innerHTML = (READONLY
      ? "이 기록을 남긴 시점의 기회입니다."
      : "점수가 높은 것부터 봅니다.")
    + `<span class="hint" tabindex="0" data-tip="${esc(tip)}" title="${esc(tip)}"
        aria-label="${esc(tip)}">i</span>` + esc(capped);
  // 한 번에 손대는 건 몇 건뿐이다 — 나머지는 접어 둔다(점수 높은 순, 새 기회 먼저).
  // 같은 지면의 변형 검색어는 서버가 한 줄로 접어 보낸다(d.opp_groups).
  OV_D = d;
  OPPS = OV_lines(d);
  const held = (d.opps || []).filter(o => window.oppStMatch(o, "hold"));
  OV_HELD = held.length;
  OV_HELD_PAGES = new Set(held.map(o => o.hold.page)).size;
  // 첫 적재에서만 기본값을 정한다 — 사람이 고른 필터를 재적재로 되돌리지 않는다.
  // 완료·제외는 끝난 일이라 목록에 안 낀다(윗줄 "아직 안 한 기회 N건"과 같은 몫).
  // 박제본은 그때의 트리아지 기록 자체가 볼거리라 전부 남긴다.
  if (OPP_ST === null) OPP_ST = READONLY ? "" : "open";
  // 데이터 이상 — 있을 때만 서는 접힌 띠(격자 맨 위).
  OV_health(d);
  // 이번 달 할 일 — 지표 바로 아래 카드. 옛 페이로드(plays 없음)면 빈 상태로 선다.
  OV_plays(d);
  // 검색어별 페이지 표·밴드·기회 색인은 셸의 render() 가 화면 전부를 위해 먼저 세운다.
  renderOpps(OV_PAGE);
  OV_watch(d);
  OV_next(d);
});
</script>
