<!-- 이 화면이 무엇인지는 화면 자신이 말한다 — 담는 요소·채우는 단계까지.
     dashboard.py 가 이 선언들을 모아 window.__VIEWS__ 로 방출한다. -->
<script type="application/json" class="view-def">
{"id": "overview", "title": "개요",
 "sub": "지금 상태와 다음에 손댈 것을 한자리에서 봅니다.",
 "sections": ["docban", "band", "opps", "daily"], "stages": ["gsc", "gaps"]}
</script>

<style>
/* 눈금선과 세로 조준선 — 값을 읽으려면 축이 있어야 한다. 조준선은 CSS 로만 켠다
   (칸마다 이벤트 핸들러를 붙이면 90일치에 핸들러가 90개 붙는다). */
.log .grid { stroke:var(--rule-soft); stroke-dasharray:2 4; }
.log .hov line { stroke:var(--slate); stroke-width:1; opacity:0; }
.log .hov circle { opacity:0; }
.log .hov:hover line, .log .hov:focus line { opacity:.5; }
.log .hov:hover circle, .log .hov:focus circle { opacity:1; }
/* 범례 표식과 [더 보기] — 인라인 style 로 흩어져 있던 자리를 이름 붙인 자리로 모은다. */
.legend .sw-clk { color:var(--patina); }
.legend .sw-imp { color:var(--slate); }
.opp-more { margin-top:14px; }
/* 도구줄이 섹션 머리 오른쪽에 설 때는 한 줄로 선다 — 두 줄이 되면 격자가
   그만큼 키를 키워서 왼쪽의 제목이 도구줄보다 아래로 내려앉는다. 좁아지면
   찾기 칸이 먼저 줄고, 640px 밑에서는 셸이 도구줄을 제목 아래로 내린다. */
.sh > .tools { flex-wrap:nowrap; }
.sh > .tools input { flex:1 1 160px; min-width:0; }
@media (max-width:640px) { .sh > .tools { flex-wrap:wrap; } }
</style>

<div class="band" id="band"></div>

<section id="daily-sec">
  <div class="sh">
    <p class="eyebrow">성과일 기준</p>
    <h2>일별 클릭 추이</h2>
    <p class="sub">클릭이 어느 날 늘고 줄었는지 하루 단위로 봅니다.<span class="hint"
      tabindex="0" data-tip="위 숫자의 증감은 수집을 돌린 간격만큼 성깁니다. 여기는 성과일 기준이라 하루가 점 하나입니다."
      title="위 숫자의 증감은 수집을 돌린 간격만큼 성깁니다. 여기는 성과일 기준이라 하루가 점 하나입니다."
      aria-label="위 숫자의 증감은 수집을 돌린 간격만큼 성깁니다. 여기는 성과일 기준이라 하루가 점 하나입니다."
      >i</span></p>
  </div>
  <div id="daily"></div>
</section>

<!-- 도구줄(찾기·상태·CSV)은 섹션 머리 오른쪽에 선다 — 목록 위에 따로 떠 있으면
     "무엇을 보고 있나"와 "어떻게 걸렀나"가 두 줄로 갈라진다. 안을 채우는 것은
     renderOpps 다(상태에 따라 달라진다). -->
<section>
  <div class="sh">
    <p class="eyebrow" id="opp-eyebrow" hidden></p>
    <h2>기회</h2>
    <p class="sub" id="opp-sub"></p>
    <div class="tools" id="opp-tools"></div>
  </div>
  <div id="opps"></div>
</section>

<script>
"use strict";
/* 단계 하나를 돌리는 손잡이는 셸이 배포에 맞춰 고른다(로컬은 명령 칩, 호스팅은 실행
   버튼). 셸 스크립트가 뷰보다 뒤에 있어도 렌더 시점에는 서 있지만, 조립이 반쯤
   나간 상태에서도 화면이 서게 없으면 빈 문자열로 물러난다. */
const OV_act = (stage, label, primary) =>
  (READONLY || !window.act) ? "" : act(stage, label, primary);
// 박제본에는 누를 서버가 없다 — 손잡이가 없으면 상자도 만들지 않는다.
const OV_acts = html => html ? `<div class="acts">${html}</div>` : "";

/* ── 일별 추이: gsc_daily 의 date 는 성과일(수집일이 아니다)이라 하루가 점 하나다.
      클릭과 노출은 자릿수가 달라 각자 축을 쓴다 — 여기서 읽는 건 모양이고,
      값은 점 위에 올리면 나온다. 깊이 로그와 같은 .log/.logwrap 을 그대로 쓴다
      (좁은 화면에선 축소 대신 가로 스크롤). ── */
function dailyChart(rows, stats) {
  if (rows.length < 2)
    // 여기에 명령 칩을 또 놓지 않는다 — 같은 `/capture gsc` 가 화면 머리에 이미
    // 있고, 띠도 수집 전이면 그것을 주요 행동으로 든다(한 화면에 세 번이었다).
    return `<div class="empty"><b>일별 실적이 아직 없습니다</b>
      <p class="live">실적을 한 번 더 수집하면 최근 28일이 하루 단위로 채워집니다.</p></div>`;
  // 가로폭은 VW 다.
  const VW = 1000, H = 214, L = 52, R = VW - 62, T = 26, B = 28, n = rows.length;
  const x = i => L + i * (R - L) / (n - 1);
  const mxC = stats?.clicks_max ?? Math.max(...rows.map(r => r.clicks || 0), 1);
  const mxI = stats?.impressions_max ?? Math.max(...rows.map(r => r.impressions || 0), 1);
  const y = (v, mx) => H - B - (v || 0) / mx * (H - T - B);
  const pts = (k, mx) => rows.map((r, i) =>
    `${x(i).toFixed(1)},${y(r[k], mx).toFixed(1)}`).join(" ");
  // 눈금 셋(0·절반·최고). 왼쪽 축은 클릭, 오른쪽 축은 노출 — 자릿수가 달라 축이 둘이다.
  const grid = [0, .5, 1].map(f => {
    const yy = y(f * mxC, mxC).toFixed(1), ty = (+yy + 3.5).toFixed(1);
    return `<line class="grid" x1="${L}" y1="${yy}" x2="${R}" y2="${yy}" stroke-width="1"/>
      <text class="axis" x="${L - 9}" y="${ty}" text-anchor="end"
        fill="var(--patina)">${num(Math.round(f * mxC))}</text>
      <text class="axis" x="${R + 9}" y="${ty}">${num(Math.round(f * mxI))}</text>`;
  }).join("");
  const bw = (R - L) / n;
  // 칸마다 투명한 띠 + 조준선. 켜고 끄는 건 CSS(:hover)라 핸들러가 하나도 없다.
  const hov = rows.map((r, i) => {
    const cx = x(i).toFixed(1);
    return `<g class="hov">
      <line x1="${cx}" y1="${T - 8}" x2="${cx}" y2="${H - B}"/>
      <circle cx="${cx}" cy="${y(r.clicks, mxC).toFixed(1)}" r="3.2" fill="var(--patina)"/>
      <circle cx="${cx}" cy="${y(r.impressions, mxI).toFixed(1)}" r="3.2" fill="var(--slate)"/>
      <rect x="${(x(i) - bw / 2).toFixed(1)}" y="${T - 12}" width="${bw.toFixed(1)}"
        height="${H - B - T + 12}" fill="transparent"/>
      <title>${esc(r.date)} — 클릭 ${num(r.clicks)} · 노출 ${num(r.impressions)} · 클릭률 ${r.ctr}%` +
    ` · 평균 ${r.position ?? "—"}위</title></g>`;
  }).join("");
  // 날짜 눈금은 다섯 개까지 — 28일이든 90일이든 같은 간격으로 읽힌다.
  const step = Math.max(1, Math.ceil((n - 1) / 4));
  const idx = [];
  for (let i = 0; i < n; i += step) idx.push(i);
  if (idx[idx.length - 1] !== n - 1) idx.push(n - 1);
  const tick = i => `<text class="axis" x="${x(i).toFixed(1)}" y="${H - 8}"
    text-anchor="${i === 0 ? "start" : i === n - 1 ? "end" : "middle"}"
    >${esc(String(rows[i].date).slice(5))}</text>`;
  const sumC = stats?.clicks_sum ?? rows.reduce((a, r) => a + (r.clicks || 0), 0);
  const sumI = stats?.impressions_sum ?? rows.reduce((a, r) => a + (r.impressions || 0), 0);
  return `<div class="logwrap"><svg class="log" viewBox="0 0 ${VW} ${H}" role="img"
      aria-label="최근 ${n}일 클릭·노출 추이 — 클릭 합계 ${num(sumC)}, 노출 합계 ${num(sumI)}">
    <text class="axis" x="${L - 9}" y="${T - 12}" text-anchor="end"
      fill="var(--patina)">클릭</text>
    <text class="axis" x="${R + 9}" y="${T - 12}">노출</text>
    ${grid}
    <polygon points="${x(0)},${H - B} ${pts("clicks", mxC)} ${x(n - 1)},${H - B}"
      fill="var(--wash)"/>
    <polyline fill="none" stroke="var(--slate)" stroke-width="1" stroke-dasharray="2 4"
      stroke-linejoin="round" points="${pts("impressions", mxI)}"/>
    <polyline fill="none" stroke="var(--patina)" stroke-width="1.5" stroke-linecap="round"
      stroke-linejoin="round" points="${pts("clicks", mxC)}"/>
    ${hov}${idx.map(tick).join("")}
  </svg></div>
  <div class="legend"><b class="sw-clk">■</b> 클릭 ${n}일 합계 ${num(sumC)}
    (하루 최고 ${num(mxC)}) · <b class="sw-imp">■</b> 노출 ${num(sumI)}
    (하루 최고 ${num(mxI)})<span class="hint" tabindex="0"
      data-tip="클릭과 노출은 자릿수가 달라 세로축을 따로 씁니다. 왼쪽이 클릭, 오른쪽이 노출입니다."
      title="클릭과 노출은 자릿수가 달라 세로축을 따로 씁니다. 왼쪽이 클릭, 오른쪽이 노출입니다."
      aria-label="클릭과 노출은 자릿수가 달라 세로축을 따로 씁니다. 왼쪽이 클릭, 오른쪽이 노출입니다."
      >i</span></div>`;
}

/* ── KPI 마이크로 추이: 스냅샷 3개부터, 변동이 있을 때만. 축·라벨 없이 흐름만 —
      정확한 값은 위의 큰 숫자가 이미 말하고 있다. ── */
function kpiSpark(vals, dates, color) {
  if (vals.length < 3) return "";
  const mx = Math.max(...vals), mn = Math.min(...vals);
  if (mx === mn) return "";
  const W = 96, H = 22, P = 2;
  const x = i => P + i * (W - 2 * P) / (vals.length - 1);
  const y = v => H - P - (v - mn) / (mx - mn) * (H - 2 * P);
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  return `<div class="spark"><svg viewBox="0 0 ${W} ${H}" role="img"
      aria-label="스냅샷 ${vals.length}회 추이">
    <title>${esc(dates[0])} → ${esc(dates[dates.length - 1])} · ${vals.length}회</title>
    <polyline fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round"
      stroke-linejoin="round" points="${pts}"/>
    <circle cx="${x(vals.length - 1).toFixed(1)}" cy="${y(vals[vals.length - 1]).toFixed(1)}"
      r="2.2" fill="${color}"/>
  </svg></div>`;
}


// 카드 자체가 <details> 다 — 어디를 눌러도 펼쳐지고, 키보드·스크린리더가 공짜로
// 따라온다. 점수·트리아지·펼침·배지는 셸의 한 벌(oppScore/oppMeter/oppActs/
// oppPanel/gaBadge)이다 — 다른 화면도 같은 부품으로 같은 카드를 만든다.
// 근거 줄만 oppWhy 를 안 쓰고 직접 짠다: 이 카드는 날짜(.dt)를 라벨 옆에 두고
// 상태(.st)를 오른쪽 끝에 세우는데 oppWhy 는 상태를 라벨 옆에 넣기 때문이다.
// 그래서 셸에 부품이 늘면 여기도 손대야 한다 — GA4 배지가 실제로 그랬다.
// id 는 페이로드에 이미 있다 — data- 로 내보낸다(호스팅 애드온이 onclick 문자열을
// 정규식으로 되짚던 자리다).
function oppRow(o) {
  return `<details class="opp" data-opp="${o.id}">
    <summary>
      ${oppScore(o)}
      <div>
        <div class="oh">
          <span class="kind${isDefensive(o) ? " k-def" : ""}" title="${esc(o.kind)}"
            >${esc(o.label || o.kind)}</span>
          ${window.gaBadge(o)}
          <span class="dt">${esc(o.created || "")}</span>
        </div>
        <div class="target">${esc(o.target)}</div>
        ${oppMeter(o)}
        ${o.reasoning ? `<div class="why">${esc(o.reasoning)}</div>` : ""}
        ${oppActs(o)}
      </div>
      <div class="st st-${o.status}">${window.OPP_LABEL[o.status] || esc(o.status)}</div>
    </summary>
    ${oppPanel(o)}
  </details>`;
}


// OPP_ST 가 null 이면 아직 안 정한 것 — 첫 적재 때 정한다. 여기서 READONLY 를 못
// 읽는다(뷰는 셸 스크립트보다 위에 꽂혀서 아직 선언 전이다).
let OPPS = [], KIND_FILTER = null, OPP_Q = "", OPP_ST = null, OPP_N = 8;
// 상태 묶음 — 트리아지는 "아직 안 한 것"과 "닫은 것"으로 갈라 보는 일이 대부분이다.
const ST_GROUP = {open:["new", "acked"], new:["new"], acked:["acked"],
  closed:["done", "dismissed"]};
const ST_OPT = [["", "전체"], ["open", "아직 안 함"], ["new", "새 기회"],
  ["acked", "확인함"], ["closed", "완료·제외"]];

// 상태로 먼저 가른다 — 칩 개수도 이 묶음을 세야 "CTR 미달 12" 를 눌렀는데 8건이
// 나오는 일이 없다.
function oppByStatus() {
  const st = ST_GROUP[OPP_ST];
  return OPPS.filter(o => !st || st.indexOf(o.status) >= 0);
}
function oppFiltered() {
  const q = OPP_Q.trim().toLowerCase();
  return oppByStatus().filter(o =>
    (!KIND_FILTER || o.kind === KIND_FILTER) &&
    (!q || `${o.target} ${o.reasoning || ""}`.toLowerCase().includes(q)));
}
function oppFind(v) { OPP_Q = v; OPP_N = 8; oppList(); }
function oppStatus(v) { OPP_ST = v; OPP_N = 8; oppList(); }
function oppMore(n) { OPP_N = n; oppList(); }
// [필터 지우기]는 말 그대로 전부 보여 준다 — 첫 화면의 기본값(아직 안 함)이 아니다.
function oppReset() { OPP_Q = ""; OPP_ST = ""; KIND_FILTER = null; renderOpps(8); }
// 거르개까지 다시 그린다 — oppStatus 는 목록만 그려서 <select> 의 선택이 안 따라온다.
function oppClosed() { OPP_ST = "closed"; KIND_FILTER = null; renderOpps(8); }
function filterKind(el) {
  const k = el.dataset.k;
  KIND_FILTER = KIND_FILTER === k ? null : k;
  renderOpps(8);
}

// 도구줄·칩은 데이터가 바뀔 때만 다시 그린다 — 매 키 입력마다 갈아치우면 찾기 칸이
// 사라져 포커스를 잃는다. 거르기는 아래 목록만 다시 그린다(oppList).
function renderOpps(n) {
  OPP_N = n;
  const tbox = $("opp-tools");
  if (!OPPS.length) {
    if (tbox) tbox.innerHTML = "";
    // 칩은 놓지 않는다 — 이 상태에서는 띠가 [기회 분석]을 주요 행동으로 들고 있고,
    // 화면 머리에도 같은 명령이 있다(D14: 한 화면에 같은 칩 세 번).
    return $("opps").innerHTML =
      `<div class="empty"><b>아직 기회가 없습니다</b>
        <p>수집한 숫자에서 손댈 곳을 점수 순으로 찾습니다.</p></div>`;
  }
  const stn = s => OPPS.filter(o => !ST_GROUP[s] || ST_GROUP[s].indexOf(o.status) >= 0).length;
  // 박제본은 손댈 수 없는 기록이다 — 찾기·거르기는 그때 그 사람이 쓰던 손잡이고,
  // 종이로 나가면 뜻이 없다. CSV 는 남긴다(브라우저 안에서 끝나는 일이다).
  if (tbox) tbox.innerHTML = READONLY
    ? `<span class="n" id="oppn"></span>
       <button class="go sm sec" onclick="oppCsv()">CSV 내려받기</button>`
    : `<input type="search" value="${esc(OPP_Q)}" oninput="oppFind(this.value)"
        placeholder="검색어·주소로 찾기" aria-label="기회 찾기">
      <select onchange="oppStatus(this.value)" aria-label="상태로 거르기">${ST_OPT.map(
        ([v, l]) => `<option value="${v}"${v === OPP_ST ? " selected" : ""}>${l} ` +
          `(${stn(v)})</option>`).join("")}</select>
      <span class="n" id="oppn"></span>
      <button class="go sm sec" onclick="oppCsv()"
        title="지금 걸러 놓은 목록 그대로 내려받습니다">CSV 내려받기</button>`;
  $("opps").innerHTML = (READONLY ? "" : `<div class="oppchips" id="oppchips"></div>`)
    + `<div id="opplist"></div>`;
  oppList();
}

// kind가 2종 이상이면 칩으로 거른다 — 트리아지는 보통 같은 종류끼리 몰아서 한다.
// 개수는 지금 보고 있는 상태 묶음 기준이다.
function oppChips() {
  const el = $("oppchips");
  if (!el) return;                       // 박제본에는 칩이 없다
  const counts = {};
  for (const o of oppByStatus()) counts[o.kind] = (counts[o.kind] || 0) + 1;
  if (KIND_FILTER && !counts[KIND_FILTER]) KIND_FILTER = null;  // 상태·사이트 전환 시 잔존 필터
  const kinds = Object.keys(counts);
  el.innerHTML = kinds.length > 1 ? kinds.map(k =>
    `<button class="chip${KIND_FILTER === k ? " on" : ""}" data-k="${esc(k)}"
       onclick="filterKind(this)" title="${esc(k)}"
       aria-pressed="${KIND_FILTER === k}">${esc((window.KIND_LABELS || {})[k] || k)}
       <b>${counts[k]}</b></button>`).join("") : "";
}

function oppList() {
  oppChips();
  const list = oppFiltered();
  // 개수를 두 번 적지 않는다 — 상태 거르개가 이미 "아직 안 함 (2)" 로 말한다.
  // 그 위에 무엇이 더 걸렸을 때(찾는 말·종류 칩)만 몇 건이 남았는지 적는다.
  // 박제본에는 거르개가 없다 — 거기서는 이 자리가 개수를 말하는 유일한 곳이다.
  const narrowed = list.length !== oppByStatus().length;
  $("oppn").textContent = narrowed ? `${list.length}건 / 전체 ${OPPS.length}건`
    : READONLY ? `${OPPS.length}건` : "";
  // 기본 상태(아직 안 함)만 걸린 채로 비었으면 그건 거른 탓이 아니라 다 처리한
  // 것이다 — 여기서 "조건을 풀라"고 하면 안 건 조건을 풀라는 말이 된다.
  if (!list.length)
    return $("opplist").innerHTML = (OPP_Q.trim() || KIND_FILTER || (OPP_ST && OPP_ST !== "open"))
      ? `<div class="empty"><b>거른 조건에 맞는 기회가 없습니다</b>
        <p>찾는 말이나 상태를 좁혀 놓았습니다. 조건을 풀면 전체가 다시 보입니다.</p>
        <div class="acts"><button class="go sec" onclick="oppReset()">조건 지우기</button></div></div>`
      : `<div class="empty ok"><b>남은 기회가 없습니다</b>
        <p>쌓인 것을 전부 처리했습니다. 처리한 것은 [완료·제외]에 그대로 있습니다.</p>
        <div class="acts"><button class="go sec" onclick="oppClosed()">완료·제외 보기</button></div></div>`;
  const rest = list.length - OPP_N;
  $("opplist").innerHTML = list.slice(0, OPP_N).map(oppRow).join("") + (rest > 0
    ? `<div class="acts opp-more">
         <button onclick="oppMore(${OPP_N + 12})">${rest}건 더 보기</button></div>`
    : "");
}

// 트리아지는 화면 밖에서도 이어진다 — 지금 거른 목록 그대로 표로 내보낸다.
// 파일로 만드는 일은 뼈대의 csv() 한 벌이 한다 — 여기는 무엇을 담을지만 정한다.
function oppCsv() {
  csv("기회", [["점수", "종류", "상태", "대상", "근거", "생성일"]].concat(
    oppFiltered().map(o => [o.score ?? "", o.label || o.kind,
      window.OPP_LABEL[o.status] || o.status, o.target,
      (o.reasoning || "").replace(/\s+/g, " "), o.created || ""])));
}

/* ── 다음 행동 띠 ───────────────────────────────────────────
      이 화면은 첫 화면이다 — 세 상태(수집 전 · 뽑기 전 · 찬 화면) 어디서든 "그래서
      뭘 하나"가 머리 바로 아래 한 문장으로 서야 한다. 여태는 찬 화면일 때만 말이
      없었다: 기회가 스무 건 쌓여 있어도 어느 것부터 여는지는 아무 데도 안 적혔다.
      새 판정을 만들지 않는다 — 목록 맨 위가 곧 점수 1등이다(서버가 정렬해 보낸다). */
function OV_openTop() {
  const card = document.querySelector("#opplist details.opp");
  if (!card) return;
  card.open = true;
  card.scrollIntoView({behavior: "smooth", block: "center"});
}

function OV_next(d) {
  if (!window.nextStep) return;
  // 박제본이라고 여기서 띠를 지우지 않는다 — 문장은 종이에서도 읽을 값이 있고,
  // 누를 수 없는 것만 떼는 일은 셸의 nextStep 이 한 벌로 한다(.acts 를 뗀다).
  const top = oppFiltered()[0];
  // 걸러 놓은 게 있나 — 있으면 "조건을 풀라"가 맞고, 없으면 정말로 다 처리한 것이다.
  const filtered = !!(OPP_Q.trim() || KIND_FILTER || (OPP_ST && OPP_ST !== "open"));
  let html;
  if (!d.gsc_date)
    html = `<p>실적을 아직 수집하지 않았습니다. 이 화면의 숫자가 전부 그 위에서 나옵니다.</p>
      <div class="acts">${OV_act("gsc", "실적 수집")}</div>`;
  else if (!OPPS.length)
    html = `<p>실적은 수집했습니다.
      <span class="live">이제 그 숫자에서 손댈 곳을 뽑을 차례입니다.</span></p>
      <div class="acts">${OV_act("gaps", "기회 분석")}</div>`;
  // 다시 뽑는 손잡이는 머리줄이 이미 들고 있다 — 띠에 보조로 또 달면 같은 행동이
  // 한 화면에 둘이다. 띠의 주요 행동은 [기회 열기] 하나다.
  else if (top) {
    const sc = Number.isFinite(top.score) ? `, ${Math.round(top.score)}점` : "";
    html = `<p>가장 큰 기회는 <b>${esc(top.target)}</b>입니다.
      ${esc(top.label || top.kind)}${sc}으로 맨 위입니다.</p>
      <div class="acts"><button class="go" onclick="OV_openTop()">기회 열기</button></div>`;
  } else if (filtered)
    html = `<p>걸러 놓은 조건에 남은 기회가 없습니다.
      <span class="live">조건을 풀면 전체가 보입니다.</span></p>
      <div class="acts"><button class="go" onclick="oppReset()">조건 지우기</button></div>`;
  // 쌓인 것을 전부 처리한 상태. 여기서 "조건을 풀라"고 하면 안 건 조건이 없는데도
  // 사용자를 필터로 보내게 된다 — 다음 걸음은 다시 재는 것이다.
  else
    html = `<p>남은 기회를 모두 처리했습니다.
      <span class="live">다시 수집하면 그 사이 달라진 숫자에서 새 기회가 나옵니다.</span></p>
      <div class="acts">${OV_act("gsc", window.stageRun ? stageRun("gsc") : "실적 수집")}</div>`;
  nextStep("overview", html);
}

VIEW("overview", function (d) {
  const t = d.trend || [];
  const last = t.find(x => x.d === d.gsc_date) || t[t.length - 1] || {};
  const prev = (d.gsc_prev && t.find(x => x.d === d.gsc_prev)) || {};
  const dates = t.map(x => x.d);
  // 숫자 옆에 기준을 붙인다 — 며칠치인지, 무엇과 비교한 Δ인지 말하지 않으면 못 읽는다.
  const per = d.gsc_period ? `${d.gsc_period}일` : "";
  const cmp = d.gsc_prev && d.gsc_date
    ? `${d.gsc_prev} → ${d.gsc_date}${per ? ` · 같은 ${per} 기준` : ""}` : "";
  const was = k => Number.isFinite(prev[k])
    ? [per && `${per} 합계`, `직전 ${per || "기간"} ${num(prev[k])}`].filter(Boolean).join(" · ")
    : [per && `${per} 합계`, "견줄 직전 기록 없음"].filter(Boolean).join(" · ");
  // 비어 있는 KPI 는 숫자만 두면 막다른 길이다 — 그 자리에서 채우러 갈 곳을 준다.
  const kwHint = d.kw_active ? "순위와 AI 인용을 확인하는 대상"
    : window.go ? go("keywords", "추적에 넣기") : "아직 고른 대상이 없습니다";
  $("band").innerHTML = [
    ["클릭", num(last.clk), delta(last.clk - prev.clk, false, prev.clk, cmp),
      kpiSpark(t.map(x => x.clk), dates, "var(--patina)"), was("clk")],
    ["노출", num(last.imp), delta(last.imp - prev.imp, false, prev.imp, cmp),
      kpiSpark(t.map(x => x.imp), dates, "var(--slate)"), was("imp")],
    ["노출된 검색어", num(last.q),
      delta(last.q - prev.q, false, prev.q, cmp), "", was("q")],
    ["추적 검색어", num(d.kw_active), "", "", kwHint],
    // 이 화면에서 이 낱말이 처음 나오는 자리다 — 여기만 「개선 기회」로 쓰고
    // 아래 섹션 제목은 「기회」로 받는다(용어표: 처음 한 번만 「개선 기회」).
    ["개선 기회", num(d.opps_total), "", "", "아직 처리 안 한 것만"],
  ].map(([l, v, dd, sp, b]) => `<div class="m"><div class="v">${v}${dd}</div>
    <div class="l">${l}</div>${b ? `<div class="b">${b}</div>` : ""}${sp}</div>`).join("");

  // 호스팅은 이 자리의 자료(/api/perf 의 daily)를 애드온이 따로 받아 「클릭률과
  // 순위」로 이미 그린다. 그런데 그 자료가 페이로드(d.daily)에는 안 실려 와서,
  // 같은 화면이 "일별 실적이 없습니다"라고 써 놓고 그 아래에서 23일치를 그렸다.
  // 줄이 없는데 호스팅이면 이 섹션을 아예 안 세운다 — 없는 것을 없다고 두 번
  // 말하는 대신, 그 자료를 실제로 가진 섹션 하나만 남긴다.
  const dl = d.daily || [];
  $("daily-sec").hidden = !dl.length && !!window.SM_HOSTED;
  $("daily").innerHTML = dailyChart(dl, d.daily_stats);

  // eyebrow 는 범위·기간만 적는다 — 개수는 KPI 띠(남은 기회)와 상태 거르개가
  // 이미 말하고 있었다(같은 2건을 네 이름으로 불렀다).
  const eb = $("opp-eyebrow");
  eb.textContent = d.gsc_date ? `${d.gsc_date} 기준` : "";
  eb.hidden = !d.gsc_date;
  // 설명 산문은 부제 한 줄로 줄이고 나머지는 툴팁으로 내린다. 박제본에서
  // "누르면 저장됩니다"는 거짓말이다 — 서버가 없어 상태를 못 바꾼다.
  const tip = READONLY
    ? "카드를 펼치면 어느 페이지가 걸렸는지와 할 일이 나옵니다. 막대는 점수(100점 만점)이고, " +
      "확인·완료·제외 표시는 이 기록을 남긴 시점의 상태라 여기서는 바꿀 수 없습니다."
    : "카드를 펼치면 어느 페이지가 걸렸는지와 할 일이 나옵니다. 막대는 점수(100점 만점)이고, " +
      "길수록 먼저 손댑니다.";
  $("opp-sub").innerHTML = (READONLY
      ? "이 기록을 남긴 시점의 기회입니다."
      : "점수가 높은 것부터 봅니다.")
    + `<span class="hint" tabindex="0" data-tip="${esc(tip)}" title="${esc(tip)}"
        aria-label="${esc(tip)}">i</span>`;
  // 한 번에 손대는 건 몇 건뿐이다 — 나머지는 접어 둔다(점수 높은 순, 새 기회 먼저).
  OPPS = d.opps || [];
  // 첫 적재에서만 기본값을 정한다 — 사람이 고른 필터를 재적재로 되돌리지 않는다.
  // 완료·제외는 끝난 일이라 목록에 안 낀다(윗줄 "아직 안 한 기회 N건"과 같은 몫).
  // 박제본은 그때의 트리아지 기록 자체가 볼거리라 전부 남긴다.
  if (OPP_ST === null) OPP_ST = READONLY ? "" : "open";
  // 검색어별 페이지 표·밴드·기회 색인은 셸의 render() 가 화면 전부를 위해 먼저 세운다.
  renderOpps(8);
  OV_next(d);
});
</script>
