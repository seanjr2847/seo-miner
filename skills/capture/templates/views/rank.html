<style>
/* ── 순위 추적: 시추 코어의 단면 ──────────────────────────────
   순위는 깊이다. 1위가 지표면, 10위가 1페이지 바닥, 20위 아래는 암반,
   못 찾은 건 그보다 더 아래다. 지층 막대가 그 단면이고, 표가 시추 기록이다. */
/* 등폭은 숫자에만 건다 — 글자를 등폭으로 찍으면 한글이 폴백 서체로 떨어진다. */
.rk-strata .n { font-family:var(--mono); font-size:13px; font-weight:600;
  font-variant-numeric:tabular-nums; }
.rk-strata .lb { font-size:10.5px; fill:var(--slate); font-family:var(--sans); }
.rk-strata .edge { font-size:10.5px; fill:var(--patina); font-family:var(--sans); }
@keyframes rk-fade { from { opacity:0; } to { opacity:1; } }
@media (prefers-reduced-motion: no-preference) {
  .rk-strata .bar { animation:grow .55s cubic-bezier(.2,.7,.3,1) both; transform-origin:left; }
  .rk-strata .lbl { animation:rk-fade .55s .2s both; }
}
/* 칩 앞 색 조각 — 막대의 어느 지층인지 눈으로 잇는다. */
.rk-sw { display:inline-block; width:9px; height:9px; border-radius:1px; margin-right:7px; }
.rk-sw.hatch { background:var(--bar); border:1px solid var(--rule); }
/* 한 화면 안의 칸막이 — 화면이 카드 하나라 안에서 층을 나눈다. 각 층의 머리는
   섹션 머리와 같은 부품(.sh)을 쓴다: 눈썹 + 한 줄 부제, 도구는 오른쪽. */
.rk-part { border-top:1px solid var(--rule-soft); margin-top:26px; padding-top:20px; }
.rk-note { font-size:12.5px; color:var(--slate); margin:10px 0 0; }
.rk-note b { color:var(--ink); font-weight:500; }
/* 빈 상태의 셋째 문장은 접는다 — 비용은 눌러 보기 전에 알아야 하지만, 두 문장을
   읽고 나서 알아도 늦지 않다. */
.rk-more { margin:10px 0 0; }
.rk-more > summary { font:500 12.5px/1.6 var(--sans); color:var(--slate); cursor:pointer; }
.rk-more > summary:hover { color:var(--patina); }
.rk-more p { margin:6px 0 0; }
.rk-gap { margin-top:8px; }
/* .score 는 폭 44px 블록이라 오른쪽 정렬 칸에서도 왼쪽에 붙는다 — 머리글과 40px
   어긋나 보였다. 셸 CSS 를 건드리는 대신 이 칸에서만 상자를 오른쪽으로 민다.
   막대도 같은 폭으로 잘려 숫자 바로 밑에 선다. */
.rk-sc { width:44px; margin-left:auto; }
/* 가로로 넘치는 일은 셸의 table() 이 늘 두르는 .tw 가 맡는다 — 여기서 또 두르면
   스크롤 상자가 둘 겹친다. */
/* 검색어는 낱말째로 읽는다 — 좁은 화면에서 하이픈 뒤가 갈려 이름이 반토막 났다.
   한 낱말이 칸보다 길 때만 낱말 안에서 끊는다. .kwcell 은 다른 화면도 쓰므로 여기서만. */
#rk-list .kwcell { word-break:keep-all; overflow-wrap:break-word; }
/* 검색어 자체는 아예 안 쪼갠다 — keep-all 은 한글 어절만 지킨다. 이름보다 칸이 좁으면
   목록이 자기 상자 안에서 가로로 민다. */
#rk-list .kwq { white-space:nowrap; }
/* 행 자체가 펼침 손잡이 — 표 안이라 <details> 를 못 쓴다(tr 사이에 넣을 자리가 없다). */
#rk-list tbody tr[role="button"] { cursor:pointer; }
#rk-list tbody tr[role="button"]:hover { background:var(--bar); }
#rk-list tbody tr[role="button"]:focus-visible { outline:2px solid var(--patina); outline-offset:-2px; }
/* 표식은 이름과 한 덩어리다 — 칸에 걸면 좁은 화면에서 화살표만 윗줄에 남는다. */
#rk-list tbody tr[aria-expanded="false"] .kwq::before { content:"▸ "; color:var(--slate); }
#rk-list tbody tr[aria-expanded="true"] .kwq::before { content:"▾ "; color:var(--patina); }
</style>

  <div class="sh">
    <p class="eyebrow lat">SERP</p>

    <p class="sub" id="rk-sub"></p>

<script>
"use strict";
/* 이 화면이 쓰는 건 d.ranks / d.rank_date / d.rank_prev / d.aio_gap 뿐이다.
   직전 순위는 지어낸 값이 아니라 역산이다 — 서버(scoring.rank_delta)가 보낸
   Δ가 "이전 − 지금"이라 이전 = 지금 + Δ 로 정확히 되돌아온다.
   추이 선은 그리지 않는다: 확인일이 최대 두 개라 2점을 잇는 선이 된다. */
let RK_ROWS = [], RK_Q = "", RK_BAND = null, RK_AIO = "", RK_HAS_PREV = false;

/* ── 다음 행동 띠 ────────────────────────────────────────────────
   문장은 화면 머리 아래 한 자리(.next)에만 선다 — 셸이 심는다(window.nextStep).
   셸 스크립트는 이 파일보다 뒤에 조립되므로 렌더 시점에만 부른다.
   행동 버튼도 셸이 배포에 맞게 고른다(window.act): 로컬은 명령 칩, 호스팅은 버튼. */
const RK_next = (msg, acts) => window.nextStep &&
  nextStep("rank", `<p>${msg}</p>` + (acts ? `<div class="acts">${acts}</div>` : ""));
// 명령 칩의 정본은 셸의 window.act 한 벌이다 — 그것만 사이트 이름을 싣는다(siteArg).
// 예전에 여기 있던 폴백은 이름 없는 `/capture rank` 를 찍었고, 박제본을 받은 사람이
// 그걸 복사하면 doctor 가 어느 사이트냐고 되묻는 명령이 됐다.
const RK_act = (stage, label, primary) =>
  window.act ? window.act(stage, label, primary) : "";
/* 연결로 보내는 버튼 — **로컬에서만** 낸다. 호스팅은 키를 서버가 대고 설정 화면
   자체가 없어서, 이 버튼이 설정으로 보내 봐야 그 항목이 없는 막다른 길이었다.
   호스팅에서는 조회 버튼이 그 자리를 그대로 대신한다. */
const RK_hasSetup = () => !window.SM_HOSTED && window.SM && SM.at("settings") >= 0;
const RK_setup = (primary = true) => RK_hasSetup()
  ? `<button class="go${primary ? "" : " sec"}" onclick="SM.touched=true;SM.show('settings')"
      >순위 제공자 연결</button>`
  : "";
// 다른 화면으로 보내는 보조 버튼 — 대괄호 링크(`[키워드]`)는 눌러도 되는 것처럼
// 안 보였다. 그 화면이 없는 배포(박제본)에서는 아무것도 안 낸다.
const RK_goKw = () => window.SM && SM.at("keywords") >= 0
  ? `<button class="go sm sec" onclick="SM.touched=true;SM.show('keywords')"
      >키워드 열기</button>` : "";
// 단계 이름·재실행 라벨의 정본은 조립이 실어 보낸 window.__STAGES__ 다.
const RK_run = id => window.stageRun ? stageRun(id)
  : ((window.__STAGES__ || {})[id] || {}).run || id;
// 띠가 말한 묶음을 그 자리에서 남긴다 — 문장과 목록이 같은 것을 가리켜야 한다.
function RK_only(k) {
  RK_BAND = k;
  RK_paint();
  $("rk-list").scrollIntoView({behavior: "smooth", block: "center"});
}

const RK_d = r => {
  const v = r.delta && typeof r.delta === "object" ? r.delta.delta : r.dpos;
  return Number.isFinite(v) ? v : null;
};
const RK_prevPos = r => (r.pos != null && RK_d(r) != null) ? r.pos + RK_d(r) : null;
// 보합인지는 서버가 판정해 준다(delta.flat). 옛 박제본은 숫자만 주므로 그때만
// RULES 의 노이즈 폭으로 되짚는다 — 이 판정은 이 파일에서 한 벌이다.
const RK_flat = r => {
  const rd = r.delta, v = RK_d(r);
  if (rd && typeof rd === "object") return !!rd.flat;
  return v != null && Math.abs(v) < (RULES.rank_noise || 3);
};
/* 순위가 움직인 것은 상태다 — 배지로 세운다. 글자(부호·보합·근거 툴팁)는 셸의
   rankDelta 한 벌이 정하고, 이 화면은 그 글자에 배지 테를 두를 뿐이다. */
const RK_dCell = r => {
  const v = RK_d(r);
  if (v == null) return `<span class="muted">—</span>`;
  const inner = rankDelta(r.delta ?? r.dpos);
  if (!inner) return `<span class="muted">—</span>`;
  return `<span class="gm${RK_flat(r) ? "" : v > 0 ? " gm-up" : " gm-down"}">${inner}</span>`;
};

// 지층 정의. 경계값은 서버가 준 것만 쓴다(RULES) — 여기서 다시 정하지 않는다.
function RK_bands() {
  const p1 = RULES.page1 || 10, edge = RULES.striking_hi || 20;
  return [
    {k:"top3",  t:"1~3위",              c:"var(--patina)", o:1,
     hit:r => r.pos != null && r.pos <= 3},
    {k:"page1", t:`4~${p1}위`,          c:"var(--patina)", o:.42,
     hit:r => r.pos != null && r.pos > 3 && r.pos <= p1},
    {k:"page2", t:`${p1 + 1}~${edge}위`, c:"var(--slate)",  o:.5,
     hit:r => r.pos != null && r.pos > p1 && r.pos <= edge},
    {k:"deep",  t:`${edge}위 밖`,        c:"var(--copper)", o:.55,
     hit:r => r.pos != null && r.pos > edge},
    {k:"none",  t:"못 찾음",             c:"url(#rk-hatch)", o:1,
     hit:r => r.pos == null},
  ];
}

/* ── 지층 단면: 확인한 키워드를 깊이별로 가른 한 줄. 왼쪽이 지표면(1위),
      오른쪽이 암반(미검출). 칸 너비가 그대로 비율이라 개수 축이 필요 없다. ── */
function RK_strata(bs, total) {
  const W = 1000, BH = 44, T = 30, H = T + BH + 24;
  let x = 0;
  const segs = [];
  for (const b of bs) {
    if (!b.n) continue;
    const w = b.n / total * W;
    segs.push({...b, x, w});
    x += w;
  }
  const p1w = segs.filter(s => s.k === "top3" || s.k === "page1")
                  .reduce((a, s) => a + s.w, 0);
  // 막대는 자라고 글자는 스며든다 — 글자를 같이 늘리면 애니메이션 동안 찌그러진다.
  const bars = segs.map(s =>
    `<g><rect x="${s.x.toFixed(1)}" y="${T}" width="${(s.w - 1.5).toFixed(1)}"
        height="${BH}" fill="${s.c}" opacity="${s.o}"/>
      <title>${esc(s.t)} · ${s.n}개 (${(s.n / total * 100).toFixed(0)}%)</title></g>`).join("");
  const marks = segs.map(s => {
    const cx = (s.x + s.w / 2).toFixed(1);
    return (s.w >= 52
      ? `<text class="n" x="${cx}" y="${T + BH / 2 + 5}" text-anchor="middle"
           fill="${s.k === "none" ? "var(--slate)" : "var(--card)"}">${s.n}</text>` : "")
      + (s.w >= 88
      ? `<text class="lb" x="${cx}" y="${T + BH + 16}" text-anchor="middle"
           >${esc(s.t)}</text>` : "");
  }).join("");
  // 1페이지 경계선 — 깊이 로그(키워드 화면)와 같은 문법이다.
  const edge = p1w > 0 && p1w < W - 1
    ? `<line x1="${p1w.toFixed(1)}" y1="${T - 10}" x2="${p1w.toFixed(1)}" y2="${T + BH + 4}"
         stroke="var(--patina)" stroke-width="1"/>
       <text class="edge" x="${(p1w - 7).toFixed(1)}" y="${T - 15}" text-anchor="end"
         >1페이지 경계</text>` : "";
  const label = bs.filter(b => b.n).map(b => `${b.t} ${b.n}개`).join(", ");
  return `<div class="logwrap"><svg class="rk-strata log" viewBox="0 0 ${W} ${H}" role="img"
      aria-label="확인한 ${total}개를 순위 구간별로 가른 띠. ${esc(label)}">
    <defs><pattern id="rk-hatch" width="6" height="6" patternUnits="userSpaceOnUse"
        patternTransform="rotate(45)">
      <rect width="6" height="6" fill="var(--bar)"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="var(--rule)" stroke-width="1.4"/>
    </pattern></defs>
    <text class="lb" x="0" y="${T - 15}">1위</text>
    <text class="lb" x="${W}" y="${T - 15}" text-anchor="end">순위가 뒤로 →</text>
    <g class="bar">${bars}</g><g class="lbl">${marks}</g>${edge}
  </svg></div>`;
}

// 지층 칩 = 목록 필터. 기회 화면의 kind 칩과 같은 부품·같은 동작이다.
function RK_chips(bs) {
  return `<div class="oppchips">${bs.filter(b => b.n).map(b =>
    `<button class="chip${RK_BAND === b.k ? " on" : ""}" onclick="RK_setBand('${b.k}')"
       aria-pressed="${RK_BAND === b.k}" title="${esc(b.t)}만 보기">
       <i class="rk-sw${b.k === "none" ? " hatch" : ""}"${b.k === "none" ? "" :
         ` style="background:${b.c};opacity:${b.o}"`}></i>${esc(b.t)}
       <b>${b.n}</b></button>`).join("")}</div>`;
}

// 고르개 이름은 표의 칸 글자와 같은 말을 쓴다 — 다르면 무엇을 걸렀는지 되짚어야 한다.
const RK_AIO_OPT = [["", "전체"], ["on", "AI 요약 뜸"], ["gap", "남의 링크만"],
                    ["off", "요약 없음"]];
const RK_aioHit = (r, v) => v === "on" ? r.aio === 1
  : v === "gap" ? (r.aio === 1 && !r.aio_cited)
  : v === "off" ? r.aio === 0 : true;

// 기회 점수 — 없는 행은 −1 로 뒤로 민다. 색인은 셸의 render() 가 이미 세워 뒀다.
const RK_score = r => { const o = oppOf(r.keyword); return o ? (o.score ?? 0) : -1; };

function RK_filtered() {
  const q = RK_Q.trim().toLowerCase();
  const b = RK_bands().find(x => x.k === RK_BAND);
  // 기본 정렬은 점수 내림차순이다. 순위 오름차순은 "잘 되는 것부터"라 할 일 목록으로는
  // 정확히 거꾸로였다 — 1위부터 읽어 내려가면 손댈 자리가 맨 밑에 있다. 순위순이
  // 필요하면 열 이름을 눌러 되돌린다. 같은 점수끼리는 받은 순서(순위 오름차순)를
  // 그대로 둔다 — Array.sort 가 안정적이라 따로 2차 키를 둘 필요가 없다.
  return RK_ROWS.filter(r =>
    (!b || b.hit(r)) && RK_aioHit(r, RK_AIO) &&
    (!q || String(r.keyword).toLowerCase().includes(q)))
    .sort((a, b2) => RK_score(b2) - RK_score(a));
}
function RK_find(v) { RK_Q = v; RK_list(); }
function RK_setAio(v) {
  RK_AIO = v;
  // 칩에서 불릴 때도 도구줄의 고르개가 같은 값을 가리켜야 한다 — 화면이 두 말을 하면
  // 무엇이 걸러졌는지 알 수 없다. 도구줄을 통째로 다시 그리면 찾기 칸의 포커스를 잃는다.
  const sel = $("rk-tools") && $("rk-tools").querySelector("select");
  if (sel) sel.value = v;
  RK_list();
}
// 아래 [AI 요약] 칸의 칩이 부른다 — 거르는 목록이 화면 위쪽이라, 눌렀는데 눈앞이
// 그대로면 안 눌린 것으로 읽힌다. 목록까지 데려간다.
function RK_gapOnly() {
  RK_setAio("gap");
  $("rk-list").scrollIntoView({behavior: "smooth", block: "center"});
}
function RK_setBand(k) { RK_BAND = RK_BAND === k ? null : k; RK_paint(); }
function RK_reset() { RK_Q = ""; RK_AIO = ""; RK_BAND = null; RK_paint(); }

function RK_aioCell(r) {
  if (r.aio == null)
    return `<span class="muted" title="이번 조회는 AI 요약이 떴는지 재지 않았습니다">—</span>`;
  if (!r.aio) return `<span class="muted">요약 없음</span>`;
  return r.aio_cited ? `<span class="up" title="AI 요약이 내 페이지를 출처로 실었습니다">내 링크 실림</span>`
                     : `<span class="down" title="AI 요약이 떴는데 출처는 전부 남의 사이트입니다">남의 링크만</span>`;
}

/* ── 행 펼침: "몇 위"에서 "그래서 뭘 고치나"까지 한 자리에서 ─────────────
   표 안이라 <details> 를 못 쓴다 — tr 을 버튼으로 만들고 바로 밑에 tr.exp 를 끼운다.
   이미 기회로 채굴된 검색어는 셸의 oppPanel 이 그대로 그린다. 아직 안 잡힌 것만
   이 화면의 순위 구간별 처방(pageTable·playList·pageFix)으로 물러선다. */
let RK_VIEW = [];                  // 지금 그려진 순서 — 행의 data-i 가 이 배열을 가리킨다
let RK_PAGES = {}, RK_AUDITS = {};

// SERP 피처는 제공자가 영문 키로 준다. 아는 것만 옮기고 모르는 값은 원문 그대로 —
// 여기서 못 알아본 피처를 감추면 화면이 거짓말을 한다.
const RK_FEAT = {
  ai_overview: "AI 오버뷰", people_also_ask: "관련 질문", featured_snippet: "강조 스니펫",
  video: "동영상", images: "이미지", image: "이미지", local_pack: "지역 팩",
  shopping: "쇼핑", knowledge_graph: "지식 패널", top_stories: "뉴스",
  sitelinks: "사이트링크", reviews: "리뷰", faq: "FAQ", twitter: "소셜",
  related_searches: "연관 검색어", discussions_and_forums: "커뮤니티 글",
};

const RK_aioText = r => r.aio == null ? "AI 요약은 이번에 재지 않음"
  : !r.aio ? "AI 요약 안 뜸"
  : r.aio_cited ? "AI 요약에 내 페이지가 실림"
  : "AI 요약에 남의 링크만 실림";

// 순위 구간마다 손댈 자리가 다르다 — 3위와 30위에 같은 할 일을 적으면 둘 다 안 한다.
// 경계값은 RULES(서버)만 쓴다. 문구는 [개선 기회]의 PLAY 와 같은 어투다.
// 화면과 프롬프트가 같은 한 벌을 본다 — 문구를 두 곳에 적으면 한쪽이 낡는다.
function RK_playParts(r) {
  const p1 = RULES.page1 || 10, edge = RULES.striking_hi || 20, pos = r.pos;
  let what, acts, deliver;
  if (pos == null) {
    what = "이번 조회에서 찾지 못했습니다. 순위 경쟁 이전의 문제입니다.";
    acts = ["이 검색어를 정면으로 다루는 페이지가 실제로 있는지 확인합니다.",
            "있다면 색인됐는지 봅니다. noindex·canonical·robots.txt 순으로 확인합니다.",
            "없다면 대표 글 한 장부터 씁니다. 여러 장을 한 번에 찍지 않습니다.",
            "경쟁이 너무 세면 롱테일 변형(질문형·지역·비교)부터 잡습니다."];
    deliver = ["이 검색어를 정면으로 다루는 페이지가 있는지 판단할 확인 순서",
               "없다면 새 글 한 장의 제목과 목차. 여러 장을 한 번에 쓰지 않습니다",
               "있는데 색인이 안 됐다면 무엇을 고칠지(설정 수준)"];
  } else if (pos <= 3) {
    what = "이미 상단입니다. 더 올리는 것보다 지키는 쪽이 남는 자리입니다.";
    acts = ["title·설명을 클릭이 나오게 다듬습니다. 순위가 같아도 클릭은 늡니다.",
            "본문의 숫자·날짜를 갱신합니다. 낡은 글부터 자리를 내줍니다.",
            "이 페이지로 들어오는 내부 링크를 끊지 않습니다.",
            "다음 확인 때 순위가 떨어지면 그날 바로 봅니다."];
    deliver = ["클릭을 늘릴 title 3안과 meta description 2안. 본문은 그대로 둡니다",
               "본문에서 갱신할 숫자·날짜 항목 목록"];
  } else if (pos <= p1) {
    what = `1페이지 안 ${pos}위입니다. 남은 문제는 순위가 아니라 클릭입니다.`;
    acts = ["title 앞쪽에 검색어를 두고 숫자나 연도를 붙입니다.",
            "meta description 을 검색 의도에 대한 한 문장 답으로 바꿉니다.",
            "질문 바로 아래 40~60자 직답 블록을 둡니다. 강조 스니펫이 거기서 나옵니다.",
            "표·목록처럼 결과에 그대로 실리는 블록을 하나 만듭니다."];
    deliver = ["새 title 3안. 검색어를 앞에 두고 숫자나 연도를 붙여서",
               "meta description 2안",
               "질문 바로 아래 넣을 40~60자 직답 블록 문안",
               "결과에 그대로 실릴 표나 목록 하나"];
  } else if (pos <= edge) {
    what = `1페이지 문턱입니다. 1페이지까지 ${pos - p1}칸 남았습니다. 가장 적은 손으로 가장 크게 움직이는 자리입니다.`;
    acts = ["title 과 H1 에 검색어를 그대로 넣습니다.",
            "상위 페이지가 답하는 하위 질문 중 빠진 것을 H2 로 채웁니다.",
            "관련 글 서너 곳에서 이 페이지로 내부 링크를 겁니다.",
            "본문을 갱신하고 갱신 날짜를 드러냅니다."];
    deliver = ["새 title 과 H1 문안. 검색어를 그대로 넣어서",
               "본문에 추가할 H2 목록(상위 페이지가 답하는데 내게 없는 질문)",
               "내부 링크를 걸 글 서너 곳과 앵커 텍스트"];
  } else {
    what = `${pos}위입니다. 검색에는 잡히지만 여기까지 내려오는 사람이 없습니다.`;
    acts = ["검색 의도(알아보기·비교·구매)와 페이지 종류가 맞는지 먼저 봅니다.",
            "맞다면 그 검색어 하나만 정면으로 다루도록 페이지를 다시 씁니다.",
            "안 맞으면 새 페이지를 만들고 기존 글은 그쪽으로 링크합니다.",
            "같은 주제 글이 여러 장이면 하나로 합칩니다. 서로 순위를 갉아먹습니다."];
    deliver = ["이 페이지가 검색 의도에 맞는지 판단과 그 근거",
               "맞다면 이 검색어 하나만 다루도록 다시 쓴 제목·목차",
               "안 맞다면 새 페이지 제안과 기존 글에서 걸 링크"];
  }
  // AI 오버뷰가 자리를 차지했는데 우리만 빠진 경우 — 순위 구간과 무관하게 더 붙는다.
  if (r.aio === 1 && !r.aio_cited)
    acts = acts.concat([
      "검색어(질문) 그대로를 H2 로 두고 바로 아래에 2~3문장으로 직답합니다.",
      "숫자·출처·갱신 날짜를 본문에 남깁니다. 인용은 검증 가능한 문장에서 나옵니다."]);
  if (r.aio === 1 && !r.aio_cited)
    deliver = deliver.concat(["검색어 그대로를 쓴 H2 와 그 아래 2~3문장 직답"]);
  return [what, acts, deliver];
}
const RK_play = r => playList(...RK_playParts(r));

function RK_detail(r) {
  const prev = r.prev_pos ?? RK_prevPos(r);
  const d = rankDelta(r.delta ?? r.dpos);
  const feats = (r.features || []).map(f => esc(RK_FEAT[f] || f));
  const line = [
    r.pos != null ? `지금 <b>${r.pos}위</b>` : "이번 조회에서 <b>못 찾았습니다</b>",
    prev != null ? `직전 ${prev}위${d ? " " + d : ""}` : "직전 확인 없음",
    RK_aioText(r),
    feats.length ? `SERP 피처 ${feats.join(" · ")}` : "SERP 피처 없음",
  ].join(" · ");
  const urlp = r.url
    ? `<p class="detw">순위에 걸린 페이지: <a href="${esc(r.url)}" target="_blank"
         rel="noopener">${esc(r.url)}</a></p>`
    : `<p class="detn">이 조회는 순위에 걸린 페이지 URL 을 주지 않았습니다.</p>`;
  // 이 검색어가 이미 기회로 채굴됐으면 펼침 내용은 셸의 한 벌(oppPanel)을 쓴다 —
  // 같은 할 일을 이 화면에서 다시 적으면 두 벌이 되고 그중 한쪽이 낡는다.
  // 아직 안 잡힌 검색어만 아래 순위 구간별 처방으로 물러선다.
  const o = oppOf(r.keyword);
  // 단계 이름은 조립이 실어 보낸 정본(window.__STAGES__)에서 온다.
  const none = `<p class="detn">이 검색어는 아직 기회 목록에 없습니다.
    ${esc(((window.__STAGES__ || {}).gaps || {}).t || "gaps")} 단계를 한 번 돌리면
    점수가 붙습니다.</p>`;
  return `<div class="det"><p class="detn">${line}</p>${urlp}${o ? oppActs(o) : none}</div>`
    + (o ? oppPanel(o) : RK_fallback(r));
}

// 기회 목록에 없는 검색어의 펼침 — 순위 구간별 처방·페이지 점검·프롬프트 한 벌.
function RK_fallback(r) {
  const pages = RK_PAGES[r.keyword] || [];
  // 점검 대상은 순위에 걸린 페이지가 우선, 없으면 이 검색어로 노출이 가장 큰 페이지.
  const fix = r.url || (pages[0] && pages[0].page) || "";
  const [what, acts, deliver] = RK_playParts(r);
  const ask = askBlock({
    shape: fix ? "fix_page" : "new_content",
    url: fix, audit: RK_AUDITS[fix], acts, deliver,
    problem: `순위 ${r.pos != null ? r.pos + "위" : "못 찾음"}. ${what}`,
    queries: [{q: r.keyword, note: r.pos != null ? `현재 ${r.pos}위` : "순위 미검출"}],
  });
  return `<div class="det">${pageTable(pages)}
    ${RK_play(r)}${fix ? pageFix(RK_AUDITS[fix], fix) : ""}${ask}</div>`;
}

function RK_toggle(tr) {
  const nx = tr.nextElementSibling;
  if (nx && nx.classList.contains("exp")) {
    nx.remove();
    return tr.setAttribute("aria-expanded", "false");
  }
  const r = RK_VIEW[+tr.dataset.i];
  if (!r) return;
  const row = document.createElement("tr");
  row.className = "exp";
  row.innerHTML = `<td class="expcell" colspan="${tr.cells.length}">${RK_detail(r)}</td>`;
  tr.after(row);
  tr.setAttribute("aria-expanded", "true");
}
// 버튼 노릇을 하니 버튼처럼 굴어야 한다 — Enter·Space 로도 열린다.
function RK_key(e, tr) {
  if (e.key !== "Enter" && e.key !== " ") return;
  e.preventDefault();                 // Space 가 화면을 스크롤하지 않게
  RK_toggle(tr);
}
// 뼈대의 정렬은 tbody 행을 통째로 재배열한다 — 펼친 줄을 그냥 두면 엉뚱한 행 밑에
// 붙는다. 위임보다 먼저 받아서(capture) 접는다.
function RK_collapse() {
  const l = $("rk-list");
  if (!l) return;
  l.querySelectorAll("tr.exp").forEach(t => t.remove());
  l.querySelectorAll("tr[aria-expanded]").forEach(t =>
    t.setAttribute("aria-expanded", "false"));
}
document.addEventListener("click", e => {
  if (e.target.closest && e.target.closest("#rk-list th[data-s]")) RK_collapse();
}, true);

function RK_row(r, i) {
  const p = RK_prevPos(r);
  const o = oppOf(r.keyword);
  const top = (RK_PAGES[r.keyword] || [])[0];
  // 종류·근거를 접힌 행에도 둔다 — 펼쳐야만 "왜"가 나오면 목록에서 고를 수가 없다.
  const cells = [`<td class="kwcell"><span class="kwq">${esc(r.keyword)}</span>${
      oppWhy(o)}</td>`,
    `<td class="num">${o ? `<div class="rk-sc">${oppScore(o)}${oppMeter(o)}</div>`
      : `<span class="muted" title="아직 기회 목록에 없는 검색어입니다">—</span>`}</td>`,
    `<td class="num">${r.pos != null ? r.pos
      : `<span class="muted" title="이번 조회에서 못 찾았습니다">밖</span>`}</td>`];
  if (RK_HAS_PREV)
    cells.push(`<td class="num muted">${p != null ? p : "—"}</td>`,
      `<td class="num">${RK_dCell(r)}</td>`);
  // 규모 — 같은 12위라도 노출 3만과 30은 다른 일이다. 펼침에서만 쓰던 값을 앞으로 낸다.
  cells.push(`<td class="num">${top && top.impressions != null ? num(top.impressions)
    : `<span class="muted" title="이 검색어로 걸린 페이지가 스냅샷에 없습니다">—</span>`}</td>`);
  cells.push(`<td>${RK_aioCell(r)}</td>`);
  // class="opp" 는 장식이 아니라 스코프다 — 셸의 .kind/.why 는 .opp 아래에서만 산다.
  // tr 에는 padding·margin 이 안 먹고 border 는 td 것과 같아서 겹쳐도 달라지는 게 없다.
  return `<tr class="opp" tabindex="0" role="button" aria-expanded="false" data-i="${i}"
    onclick="RK_toggle(this)" onkeydown="RK_key(event,this)"
    title="누르면 이 검색어의 페이지와 할 일이 펼쳐집니다">${cells.join("")}</tr>`;
}

function RK_list() {
  const list = RK_VIEW = RK_filtered();     // 행의 data-i 는 이 배열을 가리킨다
  $("rk-n").textContent = list.length === RK_ROWS.length
    ? `${RK_ROWS.length}개` : `${list.length}개 / 전체 ${RK_ROWS.length}개`;
  if (!list.length)
    return $("rk-list").innerHTML = `<div class="empty"><b>이 조건에 맞는 검색어가 없습니다</b>
      <p>확인한 검색어는 모두 ${RK_ROWS.length}개입니다.</p>
      <div class="acts"><button onclick="RK_reset()">조건 지우기</button></div></div>`;
  const heads = ["검색어",
    ">점수?기회 점수입니다. 높을수록 먼저 손댈 자리이고, 이 목록의 기본 정렬입니다",
    ">순위?조회 시점의 구글 결과에서 우리 페이지가 실제로 있던 자리입니다"];
  if (RK_HAS_PREV)
    heads.push(">이전?직전 확인일의 순위입니다. 지금 순위에 Δ를 되돌린 값입니다",
      `>Δ?올라간 칸수입니다. ±${(RULES.rank_noise || 3) - 1}칸까지는 노이즈로 보고 보합으로 적습니다`);
  heads.push(">노출?이 검색어로 노출이 가장 큰 페이지의 노출 수입니다. 같은 순위라도 규모는 다릅니다");
  heads.push("AI 요약?구글이 검색 결과 맨 위에 붙이는 AI 답변입니다. 떴는지, 거기 내 페이지가 출처로 실렸는지를 적습니다");
  $("rk-list").innerHTML = `<div class="card">${table(heads, list.map(RK_row))}</div>`;
}

// 목록·칩·도구줄을 한 번에 다시 그린다. 찾기 칸을 갈아치우면 포커스를 잃으므로
// 글자를 칠 때는(RK_find) 아래 목록만 다시 그린다.
function RK_paint() {
  const bs = RK_bands().map(b => ({...b, n: RK_ROWS.filter(b.hit).length}));
  $("rk-strata").innerHTML = RK_strata(bs, RK_ROWS.length) + RK_chips(bs);
  $("rk-tools").innerHTML = `
    <input type="search" value="${esc(RK_Q)}" oninput="RK_find(this.value)"
      placeholder="검색어로 찾기" aria-label="검색어 찾기">
    <select onchange="RK_setAio(this.value)" aria-label="AI 요약으로 거르기">${
      RK_AIO_OPT.map(([v, l]) => `<option value="${v}"${v === RK_AIO ? " selected" : ""}>${l}
        (${RK_ROWS.filter(r => RK_aioHit(r, v)).length})</option>`).join("")}</select>
    <span class="n" id="rk-n"></span>
    <span class="sp"></span>
    <button class="go sm sec" onclick="RK_csv()"
      title="지금 걸러 놓은 목록 그대로 내려받습니다">CSV 내려받기</button>`;
  RK_list();
}

// 순위 회의는 화면 밖에서도 이어진다 — 지금 거른 목록 그대로 표로 내보낸다.
// 파일로 만드는 일은 뼈대의 csv() 한 벌이 한다(기회 목록과 같은 자리).
function RK_csv() {
  const bs = RK_bands();
  // 화면이 점수 순으로 놓였으니 점수·노출도 같이 나간다 — 없으면 파일 속 줄 순서가
  // 아무 근거 없어 보인다.
  const head = ["검색어", "점수", "종류", "순위", "이전", "Δ", "노출", "구간", "AI 요약"];
  const rows = [head].concat(RK_filtered().map(r => {
    const b = bs.find(x => x.hit(r));
    const o = oppOf(r.keyword);
    const top = (RK_PAGES[r.keyword] || [])[0];
    return [r.keyword, o && o.score != null ? o.score : "", o ? (o.label || o.kind) : "",
      r.pos ?? "밖", RK_prevPos(r) ?? "", RK_d(r) ?? "",
      top && top.impressions != null ? top.impressions : "",
      b ? b.t : "", r.aio == null ? "" : !r.aio ? "요약 없음"
        : r.aio_cited ? "내 링크 실림" : "남의 링크만"];
  }));
  csv("순위", rows);
}

VIEW("rank", function (d) {
  RK_ROWS = d.ranks || [];
  // 펼침 패널의 재료 — 다른 화면이 window 에 걸어 두길 기다리지 않는다(그리는 순서에
  // 기대면 조립 순서가 바뀔 때 조용히 빈다).
  RK_PAGES = d.query_pages || {};
  RK_AUDITS = d.page_audits || {};
  RK_HAS_PREV = !!d.rank_prev && RK_ROWS.some(r => RK_d(r) != null);
  RK_Q = ""; RK_AIO = ""; RK_BAND = null;      // 사이트를 바꾸면 필터도 따라가면 안 된다

  // 조회 조건은 숫자만큼 중요하다 — 어느 기기로, 어느 제공자로 잰 값인지 말한다.
  // 실행 기록(runs.notes)에 적혀 있는 것만 읽는다.
  const run = (d.runs || []).find(r => r.kind === "rank");
  const nt = (run && run.notes) || "";
  const grab = k => (nt.match(new RegExp(k + "=([\\w.-]+)")) || [])[1] || "";
  const DEV = {desktop: "데스크톱", mobile: "모바일"};
  const errN = +grab("errors") || 0;
  // 직전 확인일은 계기판의 [내린 것]이 이미 이름으로 말한다 — 여기서 또 적지 않는다.
  const cond = [d.rank_date && `${d.rank_date} 조회`,
    grab("provider"), DEV[grab("device")] || grab("device")].filter(Boolean).join(" · ");
  /* 누를 것이 있어야 참인 구절은 .live 로 감싼다 — 박제본에는 서버가 없어 셸이
     그 구절과 버튼을 함께 뗀다. 남는 문장만으로 "지금 상태"가 읽혀야 한다. */
  const live = s => `<span class="live">${s}</span>`;
  // 실패는 조건 줄에 끼워 넣을 것이 아니다 — 무엇이 실패했고 무엇을 하면 되는지를
  // 오류 상태(.empty.err)가 제 모양으로 말하고, 그 자리에서 다시 걸 수 있게 한다.
  const errBox = errN
    ? `<div class="empty err"><b>지난 조회에서 ${errN}건이 실패했습니다</b>
        <p>${live("다시 확인하면 실패한 검색어부터 이어서 채워집니다.")}</p>
        <div class="acts">${RK_act("rank", RK_run("rank"), false)}</div></div>`
    : "";

  viewSub("rank", "추적 검색어가 구글 결과에서 지금 몇 위인지 봅니다.");

  if (!RK_ROWS.length) {
    $("rk-sub").textContent = cond;
    // 빈 화면도 다음 걸음을 말한다. 다만 한 번도 조회한 적이 없으면 순위 제공자가
    // 아직 없다는 뜻이라, 조회부터 권하면 눌러도 실패한다 — 그때는 연결을 가리킨다.
    // 조회 기록(runs)이 이 화면이 연결 여부를 알 수 있는 유일한 자리다.
    // 설정 화면이 없는 배포에서는 키를 서버가 대므로 조회가 그 자리를 대신한다.
    /* 다음 걸음을 말하는 자리는 띠 하나다. 여태 띠와 빈 상태가 같은 문장("연결하면
       … 채워집니다")과 같은 버튼([순위 제공자 연결])을 각각 들고 있어서, 한 화면에
       같은 말이 세 번 섰다. 빈 상태는 이제 **지금 상태**만 말한다. */
    if (run)
      RK_next("지난 조회에서 잡힌 순위가 없습니다. " +
        live("다시 확인하면 검색어마다 지금 몇 위인지, AI 요약에 내 링크가 실렸는지 잡힙니다."),
        RK_act("rank", RK_run("rank")));
    else
      RK_next("구글 결과의 실제 순위는 아직 재지 않았습니다. " +
        live(RK_hasSetup()
          ? "순위 제공자를 연결하면 추적 검색어마다 지금 몇 위인지 채워집니다."
          : "한 번 확인하면 추적 검색어마다 지금 몇 위인지 채워집니다."),
        RK_setup() || RK_act("rank", "순위 확인"));
    $("ranks").innerHTML = errBox + `<div class="empty">
      <b>${run ? "이번 조회에서 잡힌 순위가 없습니다" : "순위를 아직 확인하지 않았습니다"}</b>
      <p>서치콘솔이 준 평균 순위는 키워드 화면에 이미 있습니다.</p>
      <details class="rk-more"><summary>조회 비용은 어떻게 되나</summary>
        <p>조회는 추적 검색어 수만큼 제공자 요금이 붙습니다${
          d.kw_active ? `. 지금 추적 중인 검색어는 ${num(d.kw_active)}개입니다` : ""}.
          재지 않아도 기회 목록까지는 그대로 채워집니다.</p></details>
      <div class="acts">${RK_goKw()}</div></div>`;
    return;
  }

  // 조회 조건(어느 날, 어느 제공자, 어느 기기)은 섹션 부제에 선다.
  // 평균 순위는 여기 산다 — 계기판 자리는 손댈 묶음(문턱·오른 것·내린 것)이 가져간다.
  const RANKED = RK_ROWS.filter(r => r.pos != null);
  const AVG = RANKED.length
    ? (RANKED.reduce((a, r) => a + r.pos, 0) / RANKED.length).toFixed(1) : null;
  $("rk-sub").textContent = [`검색어 ${RK_ROWS.length}개`,
    AVG && `순위에 잡힌 ${RANKED.length}개 평균 ${AVG}위`, cond].filter(Boolean).join(" · ");
  $("ranks").innerHTML = errBox + `
    <div class="band" id="rk-band"></div>
    <div class="rk-part">
      <div class="sh">
        <p class="eyebrow">순위 구간</p>
        <p class="sub" id="rk-trend"></p>
      </div>
      <div class="card" id="rk-strata"></div>
    </div>
    <div class="rk-part">
      <div class="sh">
        <p class="eyebrow">검색어별 기록</p>
        <p class="sub" id="rk-cap"></p>
      </div>
      <div class="tools" id="rk-tools"></div>
      <div id="rk-list"></div>
    </div>
    <div class="rk-part" id="rk-aio-part">
      <div class="sh">
        <p class="eyebrow">AI 요약</p>
        <p class="sub" id="rk-aio-sub"></p>
      </div>
      <div id="rk-aio"></div>
    </div>`;

  const ranked = RANKED;
  const p1 = RULES.page1 || 10, edge = RULES.striking_hi || 20;
  const onP1 = ranked.filter(r => r.pos <= p1).length;
  const nEdge = ranked.filter(r => r.pos > p1 && r.pos <= edge).length;   // 1페이지 문턱
  const nDeep = ranked.filter(r => r.pos > edge).length;
  const nNone = RK_ROWS.length - ranked.length;
  const moved = f => RK_ROWS.filter(r => {
    const v = RK_d(r);
    return v != null && !RK_flat(r) && f(v);
  }).length;
  const up = moved(v => v > 0), down = moved(v => v < 0);
  const noPrev = "견줄 직전 확인 없음";
  // 계기판은 "손댈 묶음"으로 세운다 — 문턱·오른 것·내린 것이 먼저 보여야 한다.
  $("rk-band").innerHTML = [
    ["1페이지 안", num(onP1), `${p1}위 안 · 확인한 ${RK_ROWS.length}개 중`],
    ["1페이지 문턱", num(nEdge), `${p1 + 1}~${edge}위 · 한 걸음이면 1페이지`],
    ["오른 것", RK_HAS_PREV ? `<span class="up">${up}</span>` : "—",
      RK_HAS_PREV ? `±${(RULES.rank_noise || 3) - 1}칸은 보합으로 셉니다` : noPrev],
    ["내린 것", RK_HAS_PREV ? `<span class="down">${down}</span>` : "—",
      RK_HAS_PREV ? `${esc(d.rank_prev)} 대비` : noPrev],
    [`${edge}위 밖·못 찾음`, num(nDeep + nNone), "페이지가 있는지부터 봅니다"],
  ].map(([l, v, b]) => `<div class="m"><div class="v">${v}</div>
    <div class="l">${l}</div><div class="b">${b}</div></div>`).join("");

  RK_paint();

  // 다음 행동 띠 — 화면 하나에 하나. 내려간 것이 있으면 그 사실을 먼저 말하고,
  // 그다음에 지금 가장 크게 움직일 묶음을 가리킨다(그 묶음만 남기는 버튼과 함께).
  const fell = down ? `직전 확인보다 ${down}개가 내려갔습니다. ` : "";
  if (nEdge) {
    RK_next(fell +
      `1페이지 문턱에 ${nEdge}개가 있습니다. 가장 적은 손으로 움직이는 자리입니다.`,
      `<button class="go" onclick="RK_only('page2')">문턱 ${nEdge}개 보기</button>` +
      RK_act("rank", RK_run("rank"), false));
  } else if (nDeep + nNone) {
    const k = nDeep >= nNone ? "deep" : "none";
    RK_next(fell + `${nDeep + nNone}개가 ${edge}위 밖이거나 검색에 안 잡혔습니다. ` +
      "그 자리는 순위보다 페이지가 있는지부터 봅니다.",
      `<button class="go" onclick="RK_only('${k}')">${
        k === "deep" ? `${edge}위 밖 ${nDeep}개` : `못 찾은 ${nNone}개`} 보기</button>` +
      RK_act("rank", RK_run("rank"), false));
  } else {
    RK_next(fell +
      `확인한 ${RK_ROWS.length}개가 전부 1페이지 안입니다. 남은 문제는 순위가 아니라 클릭입니다.`,
      RK_act("rank", RK_run("rank")));
  }

  // 추이 선은 확인일이 3회는 쌓여야 그린다 — 2점을 잇는 선은 추세가 아니다.
  $("rk-trend").textContent = RK_HAS_PREV
    ? "추이 그래프는 확인일이 3회 쌓이면 그립니다."
    : "확인일이 1회뿐이라 아직 변화가 없습니다.";

  // 둘째 문장(펼침이 쓰는 점검 기준일)은 툴팁으로 접는다 — 목록을 훑는 데 필요한
  // 말이 아니라, 펼쳐 본 뒤에 궁금해지는 말이다.
  const capped = RK_ROWS.length >= 30 && (d.kw_active || 0) > RK_ROWS.length;
  $("rk-cap").innerHTML = esc(capped
    ? `추적 검색어 ${num(d.kw_active)}개 중 ${RK_ROWS.length}개까지 이 화면에 옵니다.`
    : `기회 점수가 높은 것부터 봅니다.`)
    + (d.page_audit_date ? (tip => `<span class="hint" tabindex="0" data-tip="${tip}"
        title="${tip}" aria-label="${tip}">i</span>`)(
        `펼친 줄의 페이지 점검은 ${esc(d.page_audit_date)} 기준입니다.`) : "");

  // AI 요약(구글 AI Overview): 순위와 같은 조회에서 같이 걷어 온 값이라 이 화면에 산다.
  // 요약이 떴는데 내 링크만 빠진 검색어는 aio_exposure 기회로 적재된다(scoring) —
  // 그래서 아래 칩은 목록을 그 행들로 거른다. 점수·할 일은 위 표에서 바로 보인다.
  const known = RK_ROWS.filter(r => r.aio != null);
  const on = known.filter(r => r.aio === 1);
  const cited = on.filter(r => r.aio_cited).length;
  const gap = d.aio_gap || [];
  // 부제가 "지금 상태 한 줄"을 맡고, 본문은 누를 것만 남긴다.
  if (!known.length) {
    $("rk-aio-sub").textContent = "";
    $("rk-aio").innerHTML = `<div class="empty">
      <b>이번 조회는 AI 요약을 재지 않았습니다</b>
      <p>${grab("provider") === "serper"
        ? "지금 쓰는 제공자가 이 값을 주지 않습니다. 다른 제공자로 조회하면 채워집니다."
        : "다음 조회부터 검색어마다 요약이 떴는지, 거기 내 링크가 실렸는지 붙습니다."}</p>
      </div>`;
  } else if (!on.length) {
    // 재 봤는데 문제가 없는 상태다 — 자료가 없는 것(.empty)과 갈라 세운다.
    $("rk-aio-sub").textContent = "";
    $("rk-aio").innerHTML = `<div class="empty ok">
      <b>AI 요약에 자리를 뺏긴 검색어가 없습니다</b>
      <p>확인한 ${known.length}개 어디에도 요약이 뜨지 않았습니다.</p></div>`;
  } else {
    $("rk-aio-sub").textContent =
      `AI 요약이 뜬 ${on.length}개 중 ${cited}개에 내 페이지가 출처로 실렸습니다.`;
    $("rk-aio").innerHTML = (on.length - cited
      ? `<p class="rk-note">나머지 <b>${on.length - cited}개</b>는 요약이 맨 위 자리를
          차지하는데 거기 내 링크가 없습니다. 순위가 그대로여도 클릭이 줄어듭니다.</p>`
      : "") +
      (gap.length ? `<p class="rk-note">내 링크가 빠진 검색어입니다. 누르면 위 목록이
        그 검색어만 남깁니다.</p>
        <div class="oppchips rk-gap">${gap.map(k =>
        `<button class="chip" onclick="RK_gapOnly()"
           title="AI 요약에 내 링크가 빠진 검색어만 위 목록에 남깁니다">${esc(k)}</button>`
        ).join("")}</div>` : "");
  }
});
</script>
