     여기 한 벌이면 로컬·호스팅·박제본이 전부 같은 것을 본다. -->
<script type="application/json" class="view-def">
{"id": "backlinks", "title": "백링크",
 "sections": ["bl-profile", "bl-broken", "bl-intersect", "bl-links"], "stages": ["backlinks", "competitors"]}
</script>

<style>
/* ── 백링크 ──────────────────────────────────────────────────
   이 화면의 결론은 총수가 아니라 **참조 도메인 수와 그 기울기**다. 한 사이트에서
   100개보다 100개 사이트에서 1개씩이 낫고, 절대값보다 늘고 있나가 먼저다. */
.blk-dom { font-family:var(--mono); font-size:12.5px; word-break:break-all; min-width:18ch; }
.blk-url { font-family:var(--mono); font-size:12px; word-break:break-all; }
.blk-anchor { font-size:12.5px; word-break:break-word; }
/* 깨진 링크는 잃은 게 아니라 **되찾을 수 있는 것**이다 — 눈에 띄어야 손을 댄다. */
.blk-broken { color:var(--copper); }
.blk-nofollow { color:var(--slate); }
/* 앵커 분포 막대: 한 앵커가 전부를 먹고 있으면 그 자체가 신호다(과최적화). */
.blk-bar { display:block; height:3px; border-radius:2px; background:var(--bar);
  margin-top:6px; max-width:220px; }
.blk-bar i { display:block; height:100%; border-radius:2px; background:var(--patina);
  opacity:.6; }
/* 링크를 뗀 도메인도 깨진 링크와 같은 대접 — 눌러서 펼치는 줄이다(BLK_domToggle). */
#blk-domains tbody tr[role="button"] { cursor:pointer; }
#blk-domains tbody tr[role="button"]:hover { background:var(--bar); }
#blk-domains tbody tr[role="button"]:focus-visible { outline:2px solid var(--patina); outline-offset:-2px; }
#blk-domains tbody tr[aria-expanded="false"] .blk-dom::before { content:"▸ "; color:var(--slate); }
#blk-domains tbody tr[aria-expanded="true"] .blk-dom::before { content:"▾ "; color:var(--patina); }
</style>

<section id="bl-profile">

<!-- 되찾을 링크가 교집합보다 앞이다 — 이미 번 링크라 늘 더 싸고 확실하다. -->

  <!-- 되찾는 방법은 위 [되찾을 링크]가 말한다 — 같은 문장을 두 번 두지 않는다. -->
  <p class="sub">앵커 하나가 전부를 먹고 있으면 과최적화 신호입니다. 여기는 수집한
    링크 전부입니다. 끊긴 것은 위 <b>되찾을 링크</b>에 따로 모았습니다.</p>

<script>
"use strict";
/* 이 화면의 이름은 전부 BLK_ 로 시작한다 — 조립하면 한 문서라 최상위 이름이 겹치면
   뒤가 앞을 조용히 덮는다(dashboard._selfcheck 가 그걸 센다). */

let BLK_D = null;                 // 마지막 payload — CSV 버튼이 지금 보이는 것을 그대로 낸다
let BLK_DOMS = [];                // 마지막으로 그린 참조 도메인 목록 — 펼침이 data-i 로 찾는다

const BLK_pct = v => (v == null ? "—" : Math.round(v * 100) + "%");
const BLK_day = v => (v ? String(v).slice(0, 10) : "");
// URL 은 읽으라고 있는 게 아니라 열어 보라고 있다 — 여태 esc() 한 글자라 못 눌렀다.
const BLK_a = u => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`;

/* ── 되찾을 링크·교집합은 같은 카드다 ─────────────────────────────────────
   둘 다 "무엇을 대상으로 삼느냐"만 다르고 나머지는 셸의 한 벌이다: 점수(oppScore·
   oppMeter)·이유(oppWhy)·할 일(oppPanel)·행동 기록(oppActs). 표로 두면 행을 펼칠
   수 없어 그 넷이 갈 자리가 없다 — 그래서 행 자체를 <details> 로 만든다.
   기회가 안 붙은 행도 같은 모양으로 남긴다: 지우면 "왜 이 행만 버튼이 없나"가
   화면 밖에 남는다. head·meta 는 부르는 쪽이 만든 HTML 이다(링크가 들어간다). */
function BLK_row(target, head, meta, none) {
  const o = oppOf(target);
  // 점수가 없는 줄에 "—" 만 홀로 뜨면 뜻 없는 글자다 — 자리 폭만 남기고 안 그린다.
  return `<details class="opp">
    <summary>${o ? oppScore(o) : `<div class="score"></div>`}<div>
      ${oppWhy(o)}
      <div class="target">${head}</div>
      <div class="detn">${meta}</div>
      ${oppMeter(o)}${oppActs(o)}
    </div></summary>
    ${o ? oppPanel(o) : `<div class="det"><p class="detn">${esc(none)}</p></div>`}
  </details>`;
}
// 점수 순으로 세운다 — 기회가 없는 행은 뒤로(−1).
const BLK_sc = t => { const o = oppOf(t); return Number.isFinite(o && o.score) ? o.score : -1; };
// 카드가 없을 때는 표의 빈 줄이 아니라 빈 상태 상자다 — 무엇이 없는지와 무엇을
// 하면 되는지를 같이 줘야 한다(BLK_empty 가 그 한 벌이다).
const BLK_cards = (rows, empty) => rows.length ? rows.join("") : empty;

// 링크를 뗀 도메인 — rank.html 의 RK_toggle 과 같은 문법이다: 누른 줄 다음에
// 펼침 행을 끼워 넣는다(BLK_row 를 그대로 쓴다 — 카드를 다시 그리지 않는다).
function BLK_domToggle(tr) {
  const nx = tr.nextElementSibling;
  if (nx && nx.classList.contains("exp")) {
    nx.remove();
    return tr.setAttribute("aria-expanded", "false");
  }
  const r = BLK_DOMS[+tr.dataset.i];
  if (!r) return;
  const row = document.createElement("tr");
  row.className = "exp";
  row.innerHTML = `<td class="expcell" colspan="${tr.cells.length}">${BLK_row(r.domain,
    `<span class="blk-dom">${esc(r.domain)}</span>`,
    `지수 ${r.rank == null ? "—" : r.rank} · 이 도메인에서 온 링크 ${num(r.backlinks)}개 · ` +
    `최초 발견 ${esc(BLK_day(r.first_seen))} · 잃은 날 ${esc(BLK_day(r.lost_date))}`,
    "이 도메인이 링크를 뗐습니다. 개별 링크가 끊긴 것이면 위 되찾을 링크에서 따로 잡힙니다. " +
    "그 도메인에 지금도 관련 페이지가 있는지 확인하고, 있으면 다시 링크해 달라고 요청하세요.")}</td>`;
  // BLK_row 는 <details> 라 그냥 두면 두 번 눌러야 본문이 나온다 — 이미 한 번
  // 눌러서 편 줄이니 열어 둔다.
  const det = row.querySelector("details");
  if (det) det.open = true;
  tr.after(row);
  tr.setAttribute("aria-expanded", "true");
}
function BLK_domKey(e, tr) {
  if (e.key !== "Enter" && e.key !== " ") return;
  e.preventDefault();
  BLK_domToggle(tr);
}
// 표 정렬은 tbody 행을 통째로 재배열한다(셸의 위임 리스너) — 펼친 도메인 줄을
// 그냥 두면 엉뚱한 행 밑에 붙는다(rank.html 의 RK_collapse 와 같은 문제).
// 정렬 클릭보다 먼저(capture) 받아서 접는다.
function BLK_domCollapse() {
  const l = $("blk-domains");
  if (!l) return;
  l.querySelectorAll("tr.exp").forEach(t => t.remove());
  l.querySelectorAll("tr[aria-expanded]").forEach(t => t.setAttribute("aria-expanded", "false"));
}
document.addEventListener("click", e => {
  if (e.target.closest && e.target.closest("#blk-domains th[data-s]")) BLK_domCollapse();
}, true);

// 요약 밴드 — 다른 화면의 계기판과 같은 문법을 쓴다(.band/.m/.v/.l/.b).
function BLK_band(d) {
  const s = d.bl_summary || {};
  const t = d.bl_trend || [];
  // 절대값보다 기울기다 — 직전 측정 대비 참조 도메인 증감을 값 옆에 붙인다.
  const prev = t.length > 1 ? t[t.length - 2] : null;
  const dof = s.dofollow, nof = s.nofollow;
  const ratio = (dof == null || nof == null || dof + nof === 0)
    ? null : dof / (dof + nof);
  /* 이 화면의 결론은 참조 도메인 수와 **그 기울기**인데, 여태 시계열을 받아 놓고
     직전 1개만 꺼내 Δ 를 만들고 버렸다. 스파크라인은 개요가 세운 한 벌(kpiSpark)을
     그대로 부른다 — 복사하면 두 벌이 되고 그중 하나가 언젠가 낡는다. */
  const m = (v, l, b, dd, sp) =>
    `<div class="m"><div class="v">${v}${dd || ""}</div><div class="l">${esc(l)}</div>` +
    `<div class="b">${esc(b)}</div>${sp || ""}</div>`;
  const dates = t.map(x => BLK_day(x.d));
  /* 숫자 옆에는 늘 기준이 붙는다 — 언제 잰 것인지, 무엇과 견준 것인지. 증감이 붙는
     값은 직전 측정과 견준 것이므로 그 날짜를 적고, 나머지는 측정일을 적는다.
     추이(bl_trend)가 참조 도메인·총 백링크 둘만 실어 와서 나머지 셋은 증감이 없다. */
  const day = BLK_day(d.bl_date), pday = prev ? BLK_day(prev.d) : "";
  const on = cmp => `${cmp && pday ? `${pday} 대비` : `${day} 측정`} · `;
  const tip = (was, unit) => pday ? `직전 측정 ${pday} 의 ${num(was)}${unit} 대비` : "";
  return `<div class="band">
    ${m(num(s.referring_domains), "참조 도메인 수",
        on(prev) + "한 도메인에서 100개보다 이쪽이 낫습니다",
        prev ? delta((s.referring_domains || 0) - (prev.rd || 0), false, prev.rd,
                     tip(prev.rd || 0, "곳")) : "",
        kpiSpark(t.map(x => x.rd || 0), dates, "var(--patina)"))}
    ${m(num(s.backlinks), "총 백링크 수", on(prev) + "같은 도메인에서 여러 개가 겹칩니다",
        prev ? delta((s.backlinks || 0) - (prev.bl || 0), false, prev.bl,
                     tip(prev.bl || 0, "개")) : "")}
    ${m(BLK_pct(ratio), "dofollow 비율", on() + "nofollow 는 순위로 잘 안 넘어갑니다")}
    ${m(num(s.broken_backlinks), "깨진 백링크", on() + "되살리면 그대로 돌아옵니다")}
    ${m(s.rank == null ? "—" : s.rank, "도메인 지수", on() + "DataForSEO 0~1000")}
  </div>`;
}

function BLK_domains(d) {
  // lost_date 는 여태 payload 에만 있고 화면에 한 글자도 안 나왔다. 링크를 뗀
  // 도메인도 깨진 링크와 같은 대접이다 — 눌러서 펼치면 위 되찾을 링크와 같은
  // 점수·근거·할 일(BLK_row)이 나온다. 잃은 게 아니라 되찾을 것이라 색도 가른다.
  const doms = d.bl_domains || [];
  BLK_DOMS = doms;
  // 날짜 두 열은 수집원이 안 주면 통째로 빈다 — 빈 열은 "값이 없다"가 아니라
  // "고장인가"로 읽히므로 아예 세우지 않는다. 한 줄이라도 값이 있으면 남긴다.
  const hasSeen = doms.some(r => r.first_seen), hasLost = doms.some(r => r.lost_date);
  const rows = doms.map((r, i) => {
    const cells = `<td class="blk-dom">${esc(r.domain)}</td>` +
      `<td class="num">${r.rank == null ? "—" : r.rank}</td>` +
      `<td class="num">${num(r.backlinks)}</td>` +
      `<td class="num">${num(r.dofollow)}</td>` +
      (hasSeen ? `<td>${esc(BLK_day(r.first_seen))}</td>` : "") +
      (hasLost ? `<td>${esc(BLK_day(r.lost_date))}</td>` : "");
    return r.lost_date
      ? `<tr class="blk-broken" tabindex="0" role="button" aria-expanded="false" data-i="${i}"
          onclick="BLK_domToggle(this)" onkeydown="BLK_domKey(event,this)"
          title="누르면 이 도메인의 상세와 할 일이 펼쳐집니다">${cells}</tr>`
      : `<tr>${cells}</tr>`;
  });
  const head = [">참조 도메인?우리에게 링크를 건 도메인", ">지수?DataForSEO 도메인 지수",
                ">링크 수?그 도메인에서 온 링크 개수", ">dofollow"]
    .concat(hasSeen ? [">최초 발견"] : [])
    .concat(hasLost ? [">잃은 날?링크를 뗀 날. 비어 있으면 아직 걸려 있습니다. " +
                       "적동으로 표시한 줄이 링크를 뗀 곳입니다. 누르면 펼쳐집니다"] : []);
  return `<div class="tools">
      <span class="n">${rows.length}개</span><span class="sp"></span>
      <button class="go sec" onclick="BLK_csvDomains()">CSV 내보내기</button>
    </div>` +
    (hasLost ? `<p class="detn">적동으로 표시한 줄은 링크를 뗀 도메인입니다.</p>` : "") +
    table(head.map((h, i) => (i === 0 ? h.slice(1) : h)), rows,
      "참조 도메인이 아직 없습니다.");
}

/* 깨진 백링크는 개별 링크 300줄 안에 ⚠ 한 글자로 섞여 있었다 — 가장 싸고 확실한
   행동인데 가장 안 보였다. 여기로 꺼낸다. rank(링크를 건 페이지 지수)는 여태
   정렬에만 쓰고 보여 주지 않았다 — 어느 것부터 되살릴지는 그 숫자가 정한다. */
function BLK_broken(d) {
  const rows = (d.bl_links || []).filter(r => r.is_broken)
    .sort((a, b) => BLK_sc(b.url_to) - BLK_sc(a.url_to) || (b.rank || 0) - (a.rank || 0))
    .map(r => BLK_row(r.url_to, BLK_a(r.url_to),
      `<span class="blk-url">${BLK_a(r.url_from)}</span> · 지수 ` +
      `${r.rank == null ? "—" : r.rank}` +
      (r.anchor ? ` · 앵커 <span class="blk-anchor">${esc(r.anchor)}</span>` : ""),
      "기회 목록에는 지수가 높은 것부터 일부만 올립니다. 이 링크는 그 아래라 " +
      "점수와 행동 기록이 없습니다. 되살리는 방법은 위 설명과 같습니다."));
  return BLK_cards(rows, BLK_empty("끊긴 링크가 없습니다.",
    "받아 온 링크는 전부 살아 있습니다. 백링크는 주 단위로 움직이니 그때 다시 재세요.",
    BLK_do("backlinks", "백링크 다시 수집", false)));
}

// 교집합은 "남은 것이 곧 할 일 목록"이라고 말해 놓고 도메인 이름만 줬다 —
// 그 할 일을 행마다 붙인다(펼치면 무엇을 어떻게 할지가 나온다).
function BLK_intersect(d, rivals) {
  const rows = (d.bl_intersect || []).slice()
    .sort((a, b) => BLK_sc(b.domain) - BLK_sc(a.domain) || (b.hits || 0) - (a.hits || 0))
    .map(r => BLK_row(r.domain, `<span class="blk-dom">${esc(r.domain)}</span>`,
      `지수 ${r.rank == null ? "—" : r.rank} · 경쟁사 ${num(r.hits)}곳` +
      (r.targets ? ` · <span class="blk-anchor">${esc(r.targets)}</span>` : ""),
      "기회 목록에는 경쟁사가 많은 곳부터 일부만 올립니다. 이 도메인은 그 아래라 " +
      "점수와 행동 기록이 없습니다."));
  // 비는 이유가 둘이다: 견줄 경쟁사가 모자라거나, 다 견줬는데 우리만 빠진 곳이 없거나.
  return BLK_cards(rows, rivals >= 2
    ? BLK_empty("우리만 빠진 링크처가 없습니다.",
        "경쟁사들이 공통으로 받는 곳은 우리도 이미 받고 있습니다. 지킬 자리입니다.")
    : BLK_empty("견줄 경쟁사가 모자랍니다.",
        "등록된 경쟁사가 둘 미만이라 맞댈 대상이 없습니다.",
        BLK_do("competitors", "경쟁사 찾기")));
}

// 과최적화 기준 — CSS·sub 문구는 "한 앵커가 전부를 먹고 있으면"이라고만 하고
// 숫자를 안 준다. 문구에 없는 숫자라 보수적으로 절반(50%)을 넘을 때만 신호로 본다.
const BLK_ANCHOR_MAX = 0.5;

function BLK_anchors(d) {
  const a = d.bl_anchors || [];
  const total = a.reduce((s, r) => s + (r.backlinks || 0), 0) || 1;
  const max = a.reduce((m, r) => Math.max(m, r.backlinks || 0), 0) || 1;
  const top = a.reduce((t, r) => (r.backlinks || 0) > (t.backlinks || 0) ? r : t, a[0] || {});
  const over = (top.backlinks || 0) / total > BLK_ANCHOR_MAX;
  const rows = a.map(r =>
    `<tr${over && r === top ? ' class="blk-broken"' : ""}><td class="blk-anchor">${esc(r.anchor || "(빈 앵커)")}` +
    `<span class="blk-bar"><i style="width:${Math.round((r.backlinks || 0) / max * 100)}%"></i></span></td>` +
    `<td class="num">${num(r.backlinks)}</td>` +
    `<td class="num">${num(r.referring_domains)}</td></tr>`);
  // 색만으로 뜻을 말하지 않는다 — 적동이 무엇을 가리키는지 표 위에서 글자로 말한다.
  const warn = over
    ? `<p class="detn" style="color:var(--copper)">앵커 <b>${esc(top.anchor || "(빈 앵커)")}</b>가 ` +
      `전체 링크의 ${Math.round(top.backlinks / total * 100)}%를 차지합니다. 과최적화 신호입니다. ` +
      `새로 받는 링크는 다른 문구로 요청하세요. 아래에서 적동으로 표시한 줄이 그 앵커입니다.</p>`
    : "";
  return `<div class="eyebrow" style="margin-bottom:10px">앵커 텍스트</div>${warn}` +
    table(["앵커?링크에 실제로 적힌 글자", ">링크 수", ">도메인 수"], rows,
          "앵커를 아직 수집하지 않았습니다.");
}

function BLK_links(d) {
  const rows = (d.bl_links || []).map(r =>
    `<tr class="${r.is_broken ? "blk-broken" : ""}">` +
    `<td class="blk-url">${BLK_a(r.url_from || "")}</td>` +
    `<td class="blk-anchor">${esc(r.anchor || "")}</td>` +
    `<td class="blk-url">${BLK_a(r.url_to || "")}${r.is_broken ? " ⚠" : ""}</td>` +
    `<td class="${r.dofollow ? "" : "blk-nofollow"}">${r.dofollow ? "dofollow" : "nofollow"}</td>` +
    `</tr>`);
  return `<div class="eyebrow" style="margin-bottom:10px">개별 링크</div>
    <div class="tools"><span class="n">${rows.length}개</span><span class="sp"></span>
      <button class="go sec" onclick="BLK_csvLinks()">CSV 내보내기</button></div>` +
    table(["링크 건 페이지", "앵커", "우리 페이지?⚠ 는 그 URL 이 지금 안 열린다는 뜻",
           "속성"], rows, "개별 링크를 아직 수집하지 않았습니다.");
}

function BLK_csvDomains() {
  csv("referring-domains", [["도메인", "지수", "링크 수", "dofollow", "최초 발견", "잃은 날"],
    ...(BLK_D.bl_domains || []).map(r =>
      [r.domain, r.rank, r.backlinks, r.dofollow, BLK_day(r.first_seen),
       BLK_day(r.lost_date)])]);
}

function BLK_csvLinks() {
  csv("backlinks", [["링크 건 페이지", "앵커", "우리 페이지", "속성", "깨짐"],
    ...(BLK_D.bl_links || []).map(r =>
      [r.url_from, r.anchor, r.url_to, r.dofollow ? "dofollow" : "nofollow",
       r.is_broken ? "Y" : ""])]);
}

/* 빈 화면은 막다른 길이 아니라 다음 한 걸음이다. 여기서 갈리는 것은 셋:
   아직 안 샀다 / 살 수 없다(키 없음) / 샀는데 경쟁사가 없어 교집합만 비었다.
   셋을 같은 "데이터 없음"으로 뭉치면 무엇을 하면 채워지는지가 화면 밖에 남는다.
   셸이 act() 를 세운 배포에서는 배포에 맞는 버튼 하나로 끝난다. */
const BLK_do = (stage, label, primary = false) => READONLY ? ""
  : window.act
  ? `<div class="acts">${window.act(stage, label, primary)}</div>`
  : W(`<div class="cmd" role="button" tabindex="0" onclick="copyCmd(this)"
        onkeydown="if(event.key==='Enter'||event.key===' ')
          {event.preventDefault();copyCmd(this)}">/capture ${stage}</div>`,
      `<p class="detn">화면 머리의 실행 버튼이 그 자리입니다.</p>`);

const BLK_empty = (title, why, acts) =>
  `<div class="empty"><b>${title}</b><p>${why}</p>${acts || ""}</div>`;

// 띠의 주요 버튼이 가리키는 자리로 내린다 — 백링크 화면은 길어서 "아래에 있다"는
// 말만으로는 못 찾는다.
function BLK_jump(id) {
  const el = $(id);
  if (el) el.scrollIntoView({behavior: "smooth", block: "start"});
}
const BLK_seeBtn = (id, label) =>
  `<button class="go" onclick="BLK_jump('${id}')">${label}</button>`;

/* ── 다음 한 걸음: 이 화면에서 값이 큰 순서는 늘 같다 — 이미 번 링크를 되찾는 것,
      그다음 경쟁사가 받는 곳에서 새로 얻는 것. 띠는 그 둘 중 지금 있는 쪽을 세운다. */
function BLK_nextStep(d) {
  if (!window.nextStep || !window.act) return;
  const put = (t, acts) =>
    window.nextStep("backlinks", `<p>${t}</p><div class="acts">${acts}</div>`);
  if (!d.bl_date)
    return put("백링크를 아직 수집하지 않았습니다. 누가 우리를 링크하는지부터 봅니다.",
      window.act("backlinks", "백링크 수집"));
  const broken = (d.bl_links || []).filter(r => r.is_broken).length;
  const lost = (d.bl_domains || []).filter(r => r.lost_date).length;
  const ix = (d.bl_intersect || []).length;
  const rivals = (d.comp_metrics || []).filter(r => !r.is_self).length;
  if (broken)
    return put(`끊긴 링크 ${num(broken)}개는 되살리면 그대로 돌아옵니다. 새로 얻는 것보다
      늘 쌉니다.`, BLK_seeBtn("bl-broken", `되찾을 링크 ${num(broken)}개 보기`) +
      window.act("backlinks", "백링크 다시 수집", false));
  if (lost)
    return put(`링크를 뗀 도메인이 ${num(lost)}곳입니다. 그쪽에 지금도 관련 페이지가 있으면
      다시 링크해 달라고 요청하세요.`,
      BLK_seeBtn("bl-profile", `잃은 도메인 ${num(lost)}곳 보기`) +
      window.act("backlinks", "백링크 다시 수집", false));
  if (ix)
    return put(`경쟁사는 받는데 우리는 못 받는 곳이 ${num(ix)}곳입니다. 지수가 높은 곳부터
      링크를 요청하세요.`, BLK_seeBtn("bl-intersect", `링크 확보 기회 ${num(ix)}곳 보기`) +
      window.act("backlinks", "백링크 다시 수집", false));
  if (rivals < 2)
    return put("경쟁사가 둘 이상이어야 우리만 빠진 링크처를 가려낼 수 있습니다.",
      window.act("competitors", "경쟁사 찾기"));
  return put("지금 되찾을 링크도 새로 얻을 자리도 없습니다. 백링크는 주 단위로 움직입니다.",
    window.act("backlinks", "백링크 다시 수집"));
}

VIEW("backlinks", function (d) {
  BLK_D = d;
  const has = !!d.bl_date;
  BLK_nextStep(d);
  $("blk-eyebrow").textContent = has ? `백링크 프로필 · ${BLK_day(d.bl_date)} 측정`
                                     : "백링크 프로필";
  $("blk-sub").innerHTML = has
    ? "총 백링크 수보다 <b>참조 도메인 수</b>가 중요합니다. 백링크는 하루 단위로 " +
      "움직이지 않아 매일 재도 같은 값이 나옵니다. 주 단위로 봅니다."
    : "우리를 링크한 도메인과 그 지수를 모으는 자리입니다. 순위로 넘어가는 신뢰가 " +
      "여기서 나옵니다.";
  $("blk-band").innerHTML = has ? BLK_band(d) : "";
  $("blk-domains").innerHTML = has ? BLK_domains(d)
    : BLK_empty("참조 도메인 목록이 비어 있습니다.",
        "누가 우리를 링크했는지, 그중 몇 곳이 링크를 뗐는지를 한 번에 받아 옵니다.",
        BLK_do("backlinks", "백링크 수집"));

  // 되찾을 링크 — 이 화면에서 가장 싼 행동이라 교집합보다 먼저 말한다. 잃은 것을
  // 먼저 세고(끊긴 링크 · 링크를 뗀 도메인) 그다음에 방법을 말한다.
  const broken = (d.bl_links || []).filter(r => r.is_broken).length;
  const lost = (d.bl_domains || []).filter(r => r.lost_date).length;
  // 요약의 깨진 수는 전체 측정치고, 아래 목록은 지수가 높은 것부터 일부만 받아 온다 —
  // 둘이 어긋나면 "0건인데 왜 계기판은 17이냐"가 화면 밖에 남는다.
  const summaryBroken = (d.bl_summary || {}).broken_backlinks || 0;
  const capped = !broken && summaryBroken
    ? `<span class="detn"> 요약의 깨진 백링크 ${num(summaryBroken)}건은 이번에 받은 링크
       목록 안에 없습니다. 목록은 지수가 높은 것부터 일부만 받아 옵니다.</span>` : "";
  // 되찾을 것이 0이면 되찾는 방법을 설명할 이유가 없다 — 셀 것이 없다고만 말한다.
  $("blk-recover-sub").innerHTML = !has
    ? "남이 걸어 준 링크 중 지금 안 열리는 주소를 모으는 자리입니다."
    : broken || lost
      ? `끊긴 링크 <b>${num(broken)}개</b>, 링크를 뗀 도메인 <b>${num(lost)}곳</b>입니다.
         이미 번 링크라 그 주소를 되살리거나 지금 살아 있는 페이지로 301 리다이렉트하면
         그대로 돌아옵니다. 새로 얻는 것보다 늘 쌉니다.`
      : `끊긴 링크도 링크를 뗀 도메인도 없습니다.${capped}`;
  $("blk-recover").innerHTML = has ? BLK_broken(d) : "";

  // 교집합은 경쟁사가 둘 이상이어야 성립한다 — 비어 있는 이유가 그것일 수 있다.
  const rivals = (d.comp_metrics || []).filter(r => !r.is_self).length;
  const ix = (d.bl_intersect || []).length;
  $("blk-ix-sub").innerHTML = !has
    ? "여러 경쟁사가 공통으로 링크를 받는 곳 중 우리만 빠진 도메인을 모으는 자리입니다."
    : ix
      ? `우리만 빠진 링크처가 <b>${num(ix)}곳</b>입니다. 우리가 이미 받고 있는 도메인은
         뺐으므로 남은 것이 곧 할 일 목록입니다. 지수가 높은 곳부터 우리 자료를 근거로
         링크를 요청하세요.`
      : rivals >= 2
        ? "경쟁사들이 공통으로 링크를 받는 곳 중 우리만 빠진 도메인은 없습니다."
        : "경쟁사가 둘 이상이어야 교집합이 나옵니다.";
  $("blk-intersect").innerHTML = has ? BLK_intersect(d, rivals) : "";

  $("blk-anchors").innerHTML = has ? BLK_anchors(d) : "";
  $("blk-links").innerHTML = has ? BLK_links(d) : "";
});
</script>
