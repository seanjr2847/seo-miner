<script>
"use strict";
/* 이 화면의 이름은 전부 BLK_ 로 시작한다 — 조립하면 한 문서라 최상위 이름이 겹치면
   뒤가 앞을 조용히 덮는다(dashboard._selfcheck 가 그걸 센다). */

let BLK_D = null;                 // 마지막 payload — CSV 버튼이 지금 보이는 것을 그대로 낸다
let BLK_DOMS = [];                // 마지막으로 그린 참조 도메인 목록 — 펼침이 data-i 로 찾는다
let BLK_TOP = "";                 // 가장 많이 겹치는 링크처 — 띠의 주요 행동이 여는 줄
// 표 거르개(칩) — 클라이언트에서 줄을 숨길 뿐이라 data-i(원본 인덱스)는 그대로다.
let BLK_DOMF = "all", BLK_LKF = "all";
// 기회 상태 거르개 — [되찾을 링크]와 [교집합] 두 목록이 각자 하나씩 갖는다.
// 목록의 정본은 셸의 OPP_ST_OPT 한 벌이고, 기본은 「남은 것」이다(정본은 셸의 oppStMatch — 기회가 안 붙은 줄은 그대로 서고 끝낸 것·관찰 중은 빠진다).
let BLK_BR_ST = "", BLK_IX_ST = "";
const BLK_stOk = (t, st) => window.oppStMatch(oppOf(t), st);
// 박제본에서는 셸이 빈 문자열을 준다 — 그때 빈 도구 상자를 남기지 않는다.
const BLK_stBar = (rows, key, cur, fn) =>
  window.oppStSelect(cur, fn, v => rows.filter(r => BLK_stOk(key(r), v)).length) || "";
const BLK_brBar = d => {
  const all = (d.bl_links || []).filter(r => r.is_broken);
  return all.length ? BLK_stBar(all, r => r.url_to, BLK_BR_ST, "BLK_brSt") : "";
};
const BLK_ixBar = d => {
  const all = d.bl_intersect || [];
  return all.length ? BLK_stBar(all, r => r.domain, BLK_IX_ST, "BLK_ixSt") : "";
};
// 거르개는 자기 목록만 다시 그린다 — VIEW 를 다시 돌리면 화면 전체가 깜빡인다.
function BLK_brSt(v) {
  BLK_BR_ST = v;
  if (!BLK_D) return;
  $("blk-recover-bar").innerHTML = BLK_brBar(BLK_D);
  $("blk-recover").innerHTML = BLK_broken(BLK_D);
}
function BLK_ixSt(v) {
  BLK_IX_ST = v;
  if (!BLK_D) return;
  $("blk-ix-bar").innerHTML = BLK_ixBar(BLK_D);
  $("blk-intersect").innerHTML = BLK_intersect(BLK_D, BLK_rivals(BLK_D));
}

/* 견줄 경쟁사 수 — 경쟁 분석 화면과 같은 기준(CP_rivals: 몫을 잰 곳 + 격차를 맞댄 곳)을
   그대로 부른다. 몫(comp_metrics)만 세던 때, 경쟁 분석은 「경쟁사 3곳과 맞댄 결과」인데
   여기는 「등록된 경쟁사가 둘 미만」이라고 했다(10회차). 화면은 조립하면 한 문서다. */
const BLK_rivals = d => CP_rivals(d || {}).all;
const BLK_pct = v => (v == null ? "—" : Math.round(v * 100) + "%");
const BLK_day = v => (v ? String(v).slice(0, 10) : "");
// URL 은 읽으라고 있는 게 아니라 열어 보라고 있다 — 여태 esc() 한 글자라 못 눌렀다.
const BLK_a = (u, shown) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(shown == null ? u : shown)}</a>`;
// 좁은 칸의 표시 글자에서는 프로토콜을 뗀다(href 는 그대로) — 「https://」가 칸 폭을 먹어 주소가 반토막 났다.
const BLK_bare = u => String(u || "").replace(/^https?:\/\//, "");

/* 이름표 — 도메인이 주인공인 자리(표·링크처·링크 건 페이지)에만 단다. 이니셜은 CSS 가
   data-ch 로 그린다(글자가 셀 텍스트에 안 섞인다). 색상환 값은 도메인 글자에서 정한다. */
const BLK_host = u => {
  try { return new URL(u).hostname.replace(/^www\./, ""); }
  catch (e) { return String(u || "").replace(/^https?:\/\//, "").split("/")[0]; }
};
const BLK_hue = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const BLK_av = dom => {
  const s = String(dom || "").replace(/^www\./, "");
  const ch = (s.match(/[A-Za-z0-9가-힣]/) || ["·"])[0].toUpperCase();
  return `<span class="blk-av" aria-hidden="true" data-ch="${esc(ch)}" style="--h:${BLK_hue(s)}"></span>`;
};

/* 단계 이름·설명은 stage.STAGE_LABELS 한 벌이고 조립이 window.__STAGES__ 로 실어
   보낸다. t 는 단계 이름(버튼 라벨), gain 은 "무엇을 얻고 무엇이 드는가" 한 문단인데
   유료 키 문장이 배포마다 갈린다(로컬은 DataForSEO 키, 호스팅은 서버가 냄) — 그 갈림도
   파이썬이 이미 했다. 그래서 빈 상태는 W() 를 쓰지 않는다. */
const BLK_name = s => ((window.__STAGES__ || {})[s] || {}).t || "";
const BLK_gain = s => ((window.__STAGES__ || {})[s] || {}).gain || "";

/* 부제는 한 문장이다 — 두 문장째부터는 이 (i) 안으로 접는다. */
const BLK_tip = t =>
  `<span class="hint" tabindex="0" data-tip="${esc(t)}" title="${esc(t)}"
     aria-label="${esc(t)}">i</span>`;

// 카드 머리 한 벌 — 제목·보조 설명·오른쪽 도구. 정적 카드(되찾을 링크·링크처)는 같은 모양을 마크업에 갖는다.
const BLK_bh = (title, sub, tools) =>
  `<div class="bh"><div class="bt"><h2>${title}</h2>${sub ? `<p class="bs">${sub}</p>` : ""}</div>` +
  (tools ? `<div class="btools">${tools}</div>` : "") + `</div>`;
// 거르개 칩 — 누른 칩은 aria-pressed. fn 은 값을 받는다.
const BLK_chip = (v, label, n, cur, fn) =>
  `<button type="button" class="chip${cur === v ? " on" : ""}" aria-pressed="${cur === v}"
     data-f="${v}" onclick="${fn}('${v}')">${label} <b>${num(n)}</b></button>`;

/* ── 되찾을 링크·교집합은 같은 카드다 ─────────────────────────────────────
   둘 다 "무엇을 대상으로 삼느냐"만 다르고 나머지는 셸의 한 벌이다: 점수(oppScore·
   oppMeter)·이유(oppWhy)·할 일(oppPanel)·행동 기록(oppActs). 표로 두면 행을 펼칠
   수 없어 그 넷이 갈 자리가 없다 — 그래서 행 자체를 <details> 로 만든다.
   기회가 안 붙은 행도 같은 모양으로 남긴다: 지우면 "왜 이 행만 버튼이 없나"가
   화면 밖에 남는다. head·meta 는 부르는 쪽이 만든 HTML 이다(링크가 들어간다).
   key 는 띠의 주요 행동이 이 줄을 도로 찾는 손잡이다 — 도메인 글자를 onclick 에
   실으면 따옴표 하나에 깨지므로, 찾는 쪽이 dataset 으로 맞춘다. */
function BLK_row(target, head, meta, none, key, acts) {
  const o = oppOf(target);
  // 점수가 없는 줄에 "—" 만 홀로 뜨면 뜻 없는 글자다 — 자리 폭만 남기고 안 그린다.
  return `<details class="opp"${key ? ` data-key="${esc(key)}"` : ""}>
    <summary>${o ? oppScore(o) : `<div class="score"></div>`}<div>
      ${oppWhy(o)}
      <div class="target">${head}</div>
      <div class="detn">${meta}</div>
      ${oppMeter(o)}${oppActs(o)}
    </div></summary>
    ${o ? oppPanel(o)
        : `<div class="det"><p class="detn">${esc(none)}</p>${acts || ""}</div>`}
  </details>`;
}
// 점수 순으로 세운다 — 기회가 없는 행은 뒤로(−1).
const BLK_sc = t => { const o = oppOf(t); return Number.isFinite(o && o.score) ? o.score : -1; };
// 카드가 없을 때는 표의 빈 줄이 아니라 빈 상태 상자다 — 무엇이 없는지와 무엇을
// 하면 되는지를 같이 줘야 한다(BLK_empty 가 그 한 벌이다).
// 다섯 줄까지만 펴 놓고 나머지는 한 번에 연다 — 안쪽 스크롤로 자르면 마지막 줄이 반쯤 걸렸다.
const BLK_SHOW = 5;
const BLK_cards = (rows, empty) => !rows.length ? empty
  : rows.length <= BLK_SHOW + 1 ? rows.join("")
  : rows.slice(0, BLK_SHOW).join("") +
    `<details class="bx-more"><summary>나머지 ${num(rows.length - BLK_SHOW)}개 보기</summary>${
      rows.slice(BLK_SHOW).join("")}</details>`;

// 링크를 뗀 도메인 — rank.html 의 RK_toggle 과 같은 문법이다: 누른 줄 다음에
// 펼침 행을 끼워 넣는다(BLK_row 를 그대로 쓴다 — 카드를 다시 그리지 않는다).
function BLK_domToggle(tr) {
  const nx = tr.nextElementSibling;
  if (nx && nx.classList.contains("exp")) {
    nx.remove();
    return tr.setAttribute("aria-expanded", "false");
  }
  const r = BLK_DOMS[+tr.dataset.i];
  if (!r) return;
  const row = document.createElement("tr");
  row.className = "exp";
  row.innerHTML = `<td class="expcell" colspan="${tr.cells.length}">${BLK_row(r.domain,
    `<span class="blk-id">${BLK_av(r.domain)}<span class="blk-dom">${esc(r.domain)}</span></span>`,
    `지수 ${r.rank == null ? "—" : r.rank} · 이 도메인에서 온 링크 ${num(r.backlinks)}개 · ` +
    `최초 발견 ${esc(BLK_day(r.first_seen))} · 잃은 날 ${esc(BLK_day(r.lost_date))}`,
    "이 도메인이 링크를 뗐습니다. 개별 링크가 끊긴 것이면 위 되찾을 링크에서 따로 잡힙니다. " +
    "그 도메인에 지금도 관련 페이지가 있으면 다시 링크해 달라고 요청합니다.")}</td>`;
  // BLK_row 는 <details> 라 그냥 두면 두 번 눌러야 본문이 나온다 — 이미 한 번
  // 눌러서 편 줄이니 열어 둔다.
  const det = row.querySelector("details");
  if (det) det.open = true;
  tr.after(row);
  tr.setAttribute("aria-expanded", "true");
}
function BLK_domKey(e, tr) {
  if (e.key !== "Enter" && e.key !== " ") return;
  e.preventDefault();
  BLK_domToggle(tr);
}
// 표 정렬은 tbody 행을 통째로 재배열한다(셸의 위임 리스너) — 펼친 도메인 줄을
// 그냥 두면 엉뚱한 행 밑에 붙는다(rank.html 의 RK_collapse 와 같은 문제).
// 정렬 클릭보다 먼저(capture) 받아서 접는다.
function BLK_domCollapse() {
  const l = $("blk-domains");
  if (!l) return;
  l.querySelectorAll("tr.exp").forEach(t => t.remove());
  l.querySelectorAll("tr[aria-expanded]").forEach(t => t.setAttribute("aria-expanded", "false"));
}
document.addEventListener("click", e => {
  if (e.target.closest && e.target.closest("#blk-domains th[data-s]")) BLK_domCollapse();
}, true);

/* 표 거르개(칩)는 줄을 지우지 않고 hidden 만 건다 — 셸의 정렬이 tbody 줄을 통째로
   재배열하므로, 줄 자신이 조건(data-lost·data-broken·data-nofollow)을 들고 있어야
   정렬 뒤에도 거르개가 유지된다. 칩·개수도 여기서 같이 맞춘다. */
function BLK_applyFilter(boxId, cardId, cur, test, nId) {
  const box = $(boxId), card = $(cardId);
  if (!box || !card) return;
  let shown = 0;
  box.querySelectorAll("tbody > tr:not(.exp)").forEach(tr => {
    const show = test(tr, cur);
    tr.hidden = !show;
    if (show) shown++;
  });
  card.querySelectorAll(".btools .chip[data-f]").forEach(c => {
    const on = c.dataset.f === cur;
    c.classList.toggle("on", on);
    c.setAttribute("aria-pressed", String(on));
  });
  const n = $(nId);
  if (n) n.textContent = `${num(shown)}개`;
}
const BLK_domTest = (tr, v) => v !== "lost" || tr.dataset.lost === "1";
const BLK_lkTest = (tr, v) => v === "all" || (v === "broken" ? tr.dataset.broken === "1"
                                                             : tr.dataset.nofollow === "1");
function BLK_domFilter(v) {
  BLK_DOMF = v;
  BLK_domCollapse();
  BLK_applyFilter("blk-domains", "blk-domcard", v, BLK_domTest, "blk-dom-n");
}
function BLK_lkFilter(v) {
  BLK_LKF = v;
  BLK_applyFilter("blk-links-tbl", "blk-links", v, BLK_lkTest, "blk-lk-n");
}

/* ── 히어로: 링크 기울기 ──────────────────────────────────────────────────
   이 화면의 결론은 참조 도메인 수와 **그 기울기**인데, 여태 시계열을 받아 놓고
   22px 스파크라인과 직전 1개와의 차이로만 말했다. 이제 선 차트가 그 자리다.
   총 백링크는 단위가 달라(한 도메인에서 여러 개) 같은 축에 안 얹는다 — 숫자로만 말한다. */
function BLK_trendChart(t) {
  const pts = t.map(x => ({x: BLK_day(x.d).slice(5), y: x.rd || 0}));
  if (pts.length < 2) return "";
  const ys = pts.map(p => p.y), lo = Math.min(...ys), hi = Math.max(...ys);
  const pad = Math.max(1, Math.round((hi - lo) * .4));
  const last = pts[pts.length - 1];
  const aria = `참조 도메인 추이 ${pts.length}회 — ${pts[0].x} ${num(pts[0].y)}곳에서 ` +
    `${last.x} ${num(last.y)}곳`;
  // 셸의 차트 부품(chMount)이 없는 배포(박제본 등)는 셸의 기본 선 차트로 물러선다.
  if (typeof chMount !== "function")
    return window.chLine ? window.chLine(pts, {unit: "곳", height: 200}) : "";
  return chMount(T => ({type: "line",
    data: {labels: pts.map(p => p.x), datasets: [{data: ys,
      borderColor: T.patina, borderWidth: 2.5, tension: .38, fill: "start",
      backgroundColor: c => {
        const a = c.chart.chartArea;
        if (!a) return chA(T.patina, .12);
        const g = c.chart.ctx.createLinearGradient(0, a.top, 0, a.bottom);
        g.addColorStop(0, chA(T.patina, .28)); g.addColorStop(1, chA(T.patina, 0));
        return g;
      },
      borderCapStyle: "round", borderJoinStyle: "round",
      pointRadius: pts.map((p, i) => i === pts.length - 1 ? 5 : 0), pointHoverRadius: 5,
      pointBackgroundColor: T.patina, pointBorderColor: T.card, pointBorderWidth: 2}]},
    options: {responsive: true, maintainAspectRatio: false,
      interaction: {mode: "index", intersect: false}, layout: {padding: {top: 6, right: 6}},
      scales: {
        x: {grid: {display: false}, border: {display: false},
          ticks: {color: T.slate, font: {family: T.mono, size: 12}, maxTicksLimit: 6,
            maxRotation: 0, autoSkipPadding: 12}},
        // 선 차트는 0 에서 시작할 이유가 없다 — 기울기가 이 화면의 결론이라 값 범위에 맞춘다.
        y: {min: Math.max(0, lo - pad), max: hi + pad,
          grid: {color: T.soft, lineWidth: 1}, border: {display: false},
          ticks: {color: T.slate, font: {family: T.mono, size: 12}, maxTicksLimit: 4,
            callback: v => Number.isInteger(v) ? chVal(v, "") : ""}}},
      plugins: {legend: {display: false},
        tooltip: chTipSays(T, {callbacks: {title: c => c[0].label,
          label: c => `참조 도메인 ${chVal(ys[c.dataIndex], "곳")}`}}),
        chText: {T, cross: true}}}}), aria, "height:200px");
}

function BLK_hero(d) {
  const s = d.bl_summary || {};
  const t = d.bl_trend || [];
  // 절대값보다 기울기다 — 직전 측정 대비 참조 도메인 증감을 값 옆에 붙인다.
  const prev = t.length > 1 ? t[t.length - 2] : null;
  const day = BLK_day(d.bl_date), pday = prev ? BLK_day(prev.d) : "";
  const dd = v => `<span class="blk-day">${esc(v)}</span>`;
  const tip = (was, unit) => pday ? `직전 측정 ${pday} 의 ${num(was)}${unit} 대비` : "";
  const chg = (now, was, unit) => {
    if (!prev) return "";
    const x = delta((now || 0) - (was || 0), false, was, tip(was || 0, unit));
    return x || `<span class="d">변화 없음</span>`;
  };
  const chart = BLK_trendChart(t);
  // 차트가 못 서는 이유(회차 부족)를 말한다 — 빈 칸이 고장으로 읽히지 않게.
  const side = chart ||
    `<p class="blk-note">추이는 측정이 두 번 쌓이면 여기에 그려집니다. 백링크는 주 단위로 움직이니
     다음 주에 다시 재면 기울기가 보입니다.</p>`;
  // 차트는 캔버스라 값이 글자로 안 남는다 — 같은 값을 표로 접어 둔다(대체 텍스트).
  const alt = t.length > 1
    ? `<details class="bx-alt"><summary>회차별 값 보기</summary>
        <div class="tw"><table class="dett"><thead><tr><th>측정일</th><th class="n">참조 도메인</th>
        <th class="n">총 백링크</th></tr></thead><tbody>${t.map(x =>
          `<tr><td class="blk-day">${esc(BLK_day(x.d))}</td><td class="n">${num(x.rd || 0)}곳</td>
           <td class="n">${num(x.bl || 0)}개</td></tr>`).join("")}</tbody></table></div></details>`
    : "";
  return BLK_bh("링크 기울기",
      `${dd(day)} 측정${pday ? ` · 직전 ${dd(pday)} 대비` : ""}` +
      BLK_tip("백링크는 하루 단위로 움직이지 않습니다. 매일 재도 같은 값이라 주 단위로 봅니다.")) +
    `<div class="hero-b">
      <div class="hero-n">
        <div><p class="hl">참조 도메인${BLK_tip("한 도메인에서 100개를 받는 것보다 100개 도메인에서 " +
          "하나씩 받는 쪽이 낫습니다.")}</p>
          <p class="hv">${num(s.referring_domains)}<small>곳</small></p>
          ${chg(s.referring_domains, prev && prev.rd, "곳")}</div>
        <div><p class="hl">총 백링크${BLK_tip("같은 도메인에서 온 링크가 여기서는 여러 개로 겹쳐 셉니다.")}</p>
          <p class="hv sm">${num(s.backlinks)}<small>개</small></p>
          ${chg(s.backlinks, prev && prev.bl, "개")}</div>
      </div>
      <div class="hero-c">${side}</div>
    </div>${alt}`;
}

/* ── 링크 건강: 순위 반영 비율(도넛) · 깨진 링크 · 도메인 지수 ── */
function BLK_health(d) {
  const s = d.bl_summary || {};
  const dof = s.dofollow, nof = s.nofollow;
  const ratio = (dof == null || nof == null || dof + nof === 0) ? null : dof / (dof + nof);
  const donut = ratio != null && window.chDonut
    ? window.chDonut([{label: "순위 반영", value: dof, on: true},
                      {label: "반영 안 됨", value: nof}], {width: 124, unit: "개"})
    : "";
  const leg = ratio == null ? "" : `<ul class="hl-leg">
      <li><i></i>순위 반영 <b>${num(dof)}</b>개</li>
      <li class="off"><i></i>반영 안 됨 <b>${num(nof)}</b>개</li></ul>`;
  const broken = s.broken_backlinks || 0;
  const rank = s.rank;
  return BLK_bh("링크 건강", "순위로 넘어가는 링크의 비율과 손볼 링크입니다.") +
    `<div class="hl-body">
      <div class="hl-top">${donut}${leg}</div>
      <div class="hl-rows">
        <div class="hl-row"><span>순위 반영 비율${BLK_tip("순위로 잘 안 넘어가는 링크는 이 비율에서 빠집니다. " +
            "업계 용어로 dofollow · nofollow 입니다.")}</span>
          <span class="v">${BLK_pct(ratio)}</span></div>
        <div class="hl-row"><span>깨진 백링크${BLK_tip("주소를 되살리거나 살아 있는 페이지로 301 로 넘기면 " +
            "그대로 돌아옵니다.")}</span>
          <span>${broken ? `<button type="button" class="chip dn"
              onclick="BLK_jump('bl-broken')">되찾을 링크 보기</button> ` : ""}<span class="v">${num(broken)}<small>개</small></span></span></div>
        <div class="hl-row"><span>도메인 지수${BLK_tip("0~1000 으로 매기는 도메인 지수입니다. 높을수록 힘 있는 도메인입니다.")}</span>
          <span class="v">${rank == null ? "—" : rank}<small> / 1,000</small></span>
          ${rank == null ? "" : `<span class="blk-meter" role="img"
            aria-label="도메인 지수 ${rank} / 1000"><i style="width:${Math.max(1, Math.min(100, rank / 10))}%"></i></span>`}</div>
      </div>
    </div>`;
}

/* ── 참조 도메인 표 ── */
function BLK_domains(d) {
  // lost_date 는 여태 payload 에만 있고 화면에 한 글자도 안 나왔다. 링크를 뗀
  // 도메인도 깨진 링크와 같은 대접이다 — 눌러서 펼치면 위 되찾을 링크와 같은
  // 점수·근거·할 일(BLK_row)이 나온다. 잃은 게 아니라 되찾을 것이라 색도 가른다.
  const doms = d.bl_domains || [];
  BLK_DOMS = doms;
  const lost = doms.filter(r => r.lost_date).length;
  if (BLK_DOMF === "lost" && !lost) BLK_DOMF = "all";
  // 날짜 두 열은 수집원이 안 주면 통째로 빈다 — 빈 열은 "값이 없다"가 아니라
  // "고장인가"로 읽히므로 아예 세우지 않는다. 한 줄이라도 값이 있으면 남긴다.
  const hasSeen = doms.some(r => r.first_seen), hasLost = doms.some(r => r.lost_date);
  const mx = Math.max(1, ...doms.map(r => r.rank || 0));
  const rows = doms.map((r, i) => {
    // 지수 0(또는 없음)은 흐리게 찍는다 — 정렬은 이미 지수 DESC 라 위쪽에 몰리는
    // 실제 값과, 대다수인 0 이 같은 굵기로 서면 어느 줄이 중요한지 안 갈린다.
    const rk = !r.rank ? `<span class="muted">${r.rank == null ? "—" : 0}</span>` : r.rank;
    const cells = `<td class="blk-dom"><span class="blk-id">${BLK_av(r.domain)}<span>${esc(r.domain)}</span></span></td>` +
      `<td class="num"><span class="blk-rk"><span class="blk-mini" aria-hidden="true"><i style="width:${Math.round((r.rank || 0) / mx * 100)}%"></i></span>${rk}</span></td>` +
      `<td class="num">${num(r.backlinks)}</td>` +
      `<td class="num">${num(r.dofollow)}</td>` +
      (hasSeen ? `<td class="blk-day">${esc(BLK_day(r.first_seen))}</td>` : "") +
      (hasLost ? `<td class="blk-day">${esc(BLK_day(r.lost_date))}</td>` : "") +
      `<td>${r.lost_date ? `<span class="badge warn">링크 뗌</span>` : `<span class="badge muted">유지</span>`}</td>`;
    const hid = BLK_DOMF === "lost" && !r.lost_date ? " hidden" : "";
    return r.lost_date
      ? `<tr class="blk-broken" tabindex="0" role="button" aria-expanded="false" data-i="${i}" data-lost="1"${hid}
          onclick="BLK_domToggle(this)" onkeydown="BLK_domKey(event,this)"
          title="누르면 이 도메인의 상세와 할 일이 펼쳐집니다">${cells}</tr>`
      : `<tr data-i="${i}"${hid}>${cells}</tr>`;
  });
  const head = ["참조 도메인?우리에게 링크를 건 도메인", ">지수?0~1000 으로 매긴 도메인 지수",
                ">링크 수?그 도메인에서 온 링크 개수",
                ">순위 반영?순위로 넘어가는 링크 수. 업계 용어로 dofollow 입니다"]
    .concat(hasSeen ? ["최초 발견"] : [])
    .concat(hasLost ? ["잃은 날?링크를 뗀 날. 비어 있으면 아직 걸려 있습니다. " +
                       "‘링크 뗌’ 줄을 누르면 펼쳐집니다"] : [])
    .concat(["상태"]);
  const title = "참조 도메인";
  const sub = "우리에게 링크를 건 도메인입니다. 총 백링크 수보다 <b>참조 도메인 수</b>가 중요합니다." +
    (hasLost ? " ‘링크 뗌’ 줄은 누르면 펼쳐집니다." : "");
  if (!rows.length)
    return BLK_bh(title, sub) + BLK_empty("참조 도메인이 아직 없습니다",
      "받아 온 목록이 비었습니다. 백링크는 주 단위로 움직이니 그때 다시 수집하면 채워집니다.",
      BLK_do("backlinks", "", false));
  const shown = BLK_DOMF === "lost" ? lost : doms.length;
  const chips = lost
    ? `<div role="group" aria-label="도메인 거르기">${BLK_chip("all", "전체", doms.length, BLK_DOMF, "BLK_domFilter")}` +
      `${BLK_chip("lost", "링크 뗀 것", lost, BLK_DOMF, "BLK_domFilter")}</div>` : "";
  return BLK_bh(title, sub,
      chips + `<span class="n" id="blk-dom-n">${num(shown)}개</span>` +
      `<button class="go sm sec" onclick="BLK_csvDomains()">CSV 내려받기</button>`) +
    `<div id="blk-domains">${table(head, rows)}</div>`;
}

// 표 위 도구줄은 카드 머리 오른쪽 한 자리다 — 개수와 내보내기.
const BLK_tools = (n, fn, nId) =>
  `<span class="n"${nId ? ` id="${nId}"` : ""}>${num(n)}개</span>` +
  `<button class="go sm sec" onclick="${fn}()">CSV 내려받기</button>`;

/* 깨진 백링크는 개별 링크 300줄 안에 ⚠ 한 글자로 섞여 있었다 — 가장 싸고 확실한
   행동인데 가장 안 보였다. 여기로 꺼낸다. rank(링크를 건 페이지 지수)는 여태
   정렬에만 쓰고 보여 주지 않았다 — 어느 것부터 되살릴지는 그 숫자가 정한다. */
function BLK_broken(d) {
  const all = (d.bl_links || []).filter(r => r.is_broken);
  const rows = all.filter(r => BLK_stOk(r.url_to, BLK_BR_ST))
    .sort((a, b) => BLK_sc(b.url_to) - BLK_sc(a.url_to) || (b.rank || 0) - (a.rank || 0))
    .map(r => BLK_row(r.url_to, BLK_a(r.url_to),
      `<span class="blk-id">${BLK_av(BLK_host(r.url_from))}<span class="blk-url">${BLK_a(r.url_from)}</span></span> · 지수 ` +
      `${r.rank == null ? "—" : r.rank}` +
      (r.anchor ? ` · 앵커 <span class="blk-anchor">${esc(r.anchor)}</span>` : ""),
      "기회 목록에는 지수가 높은 것부터 일부만 올립니다. 이 링크는 그 아래라 " +
      "점수와 행동 기록이 없습니다. 되살리는 방법은 위 설명과 같습니다."));
  return BLK_cards(rows, all.length
    ? (window.oppLeftDone(BLK_BR_ST, all, r => oppOf(r.url_to))
      ? window.oppLeftEmpty("링크", all.length, "BLK_brSt('all')")
      : BLK_empty("거른 상태에 맞는 링크가 없습니다",
        `거르개를 「전체」로 바꾸면 ${all.length}개가 있습니다.`))
    : BLK_ok("끊긴 링크가 없습니다",
        "받아 온 링크는 전부 살아 있습니다. 백링크는 주 단위로 움직입니다."));
}

// 교집합은 "남은 것이 곧 할 일 목록"이라고 말해 놓고 도메인 이름만 줬다 —
// 그 할 일을 행마다 붙인다(펼치면 무엇을 어떻게 할지가 나온다).
function BLK_intersect(d, rivals) {
  const all = (d.bl_intersect || []).slice();
  const rows = all.filter(r => BLK_stOk(r.domain, BLK_IX_ST))
    .sort((a, b) => BLK_sc(b.domain) - BLK_sc(a.domain) || (b.hits || 0) - (a.hits || 0))
    .map(r => BLK_row(r.domain,
      `<span class="blk-id">${BLK_av(r.domain)}<span class="blk-dom">${esc(r.domain)}</span></span>`,
      `<span class="hits">경쟁사 ${num(r.hits)}곳</span> 지수 ${r.rank == null ? "—" : r.rank}` +
      (r.targets ? ` · <span class="blk-anchor">${esc(r.targets)}</span>` : ""),
      "기회 목록에는 경쟁사가 많은 곳부터 일부만 올립니다. 이 도메인은 그 아래라 " +
      "점수와 행동 기록이 없습니다.", r.domain,
      // 띠가 이 줄을 가리키는데 줄 안에 누를 것이 없으면 막다른 길이다. 링크를
      // 요청하려면 그 사이트를 먼저 열어야 한다 — 그 한 걸음을 여기 둔다.
      BLK_site(r.domain)));
  // 비는 이유가 둘이다: 견줄 경쟁사가 모자라거나, 다 견줬는데 우리만 빠진 곳이 없거나.
  if (all.length && !rows.length)
    return window.oppLeftDone(BLK_IX_ST, all, r => oppOf(r.domain))
      ? window.oppLeftEmpty("링크처", all.length, "BLK_ixSt('all')")
      : BLK_empty("거른 상태에 맞는 링크처가 없습니다",
      `거르개를 「전체」로 바꾸면 ${all.length}곳이 있습니다.`);
  return BLK_cards(rows, rivals >= 2
    ? BLK_ok("우리만 빠진 링크처가 없습니다",
        "경쟁사들이 공통으로 받는 곳은 우리도 이미 받고 있습니다. 지킬 자리입니다.")
    : BLK_empty("견줄 경쟁사가 모자랍니다",
        `찾은 경쟁사가 ${num(rivals)}곳이라 맞댈 대상이 모자랍니다. 둘 이상이면 우리만 빠진 곳이 갈립니다.`,
        BLK_do("competitors", BLK_name("competitors"))));
}

// 과최적화 기준 — 부제가 "절반을 넘으면"이라고 말하고 이 상수가 그 절반이다.
// 두 벌이 되지 않게 문구 쪽이 이 숫자를 읽는다(BLK_ANCHOR_MAX 를 글자로 쓴다).
const BLK_ANCHOR_MAX = 0.5;

// 막대 이름표 — 스팸 앵커는 150자씩이라 캔버스 축에 그대로 못 싣는다. 전문은 아래 표가 갖는다.
const BLK_cut = (s, n) => { const t = String(s || "(빈 앵커)"); return t.length > n ? t.slice(0, n - 1) + "…" : t; };

function BLK_anchors(d) {
  const a = d.bl_anchors || [];
  const total = a.reduce((s, r) => s + (r.backlinks || 0), 0) || 1;
  const max = a.reduce((m, r) => Math.max(m, r.backlinks || 0), 0) || 1;
  const top = a.reduce((t, r) => (r.backlinks || 0) > (t.backlinks || 0) ? r : t, a[0] || {});
  const over = (top.backlinks || 0) / total > BLK_ANCHOR_MAX;
  const head = BLK_bh("앵커 텍스트",
    `링크에 실제로 적힌 글자입니다. 한 문구가 전체의 ${Math.round(BLK_ANCHOR_MAX * 100)}%를 넘으면 과최적화 신호입니다.` +
    BLK_tip("여기는 수집한 링크 전부입니다. 끊긴 것은 위 되찾을 링크에 따로 모았습니다."));
  if (!a.length)
    return head + BLK_empty("앵커를 아직 수집하지 않았습니다",
      "수집하면 어떤 문구로 링크가 걸렸는지, 한 문구가 몰려 있는지 보입니다.",
      BLK_do("backlinks", "", false));
  // 어느 줄이 문제인지를 **색으로만** 말하지 않는다 — 그 줄에 배지를 단다.
  const rows = a.map(r =>
    `<tr${over && r === top ? ' class="blk-broken"' : ""}><td class="blk-anchor"><span class="blk-clamp" title="${esc(r.anchor || "")}">${esc(r.anchor || "(빈 앵커)")}</span>` +
    (over && r === top ? ' <span class="badge warn">과최적화</span>' : "") +
    `<span class="blk-bar"><i style="width:${Math.round((r.backlinks || 0) / max * 100)}%"></i></span></td>` +
    `<td class="num">${num(r.backlinks)}</td>` +
    `<td class="num">${num(r.referring_domains)}</td></tr>`);
  // 곁줄은 한 문장이다 — 왜 문제이고 무엇을 하면 되는지는 (i) 안으로 내린다.
  // 위치를 색 이름으로 가리키지 않는다: 그 줄에 배지가 붙어 있고,
  // 색 이름은 색각 이상 사용자에게 아무것도 안 알려 준다.
  const warn = over
    ? `<p class="blk-note"><span class="badge warn">과최적화</span> 앵커 <b>${esc(top.anchor || "(빈 앵커)")}</b>가 전체 링크의
       ${Math.round(top.backlinks / total * 100)}%입니다.` +
      BLK_tip(`한 문구가 ${Math.round(BLK_ANCHOR_MAX * 100)}%를 넘으면 과최적화 신호입니다. ` +
        "우리가 받은 링크라면 새로 받는 링크는 다른 문구로 요청합니다. 모르는 곳이 " +
        "판매·광고 문구로 건 링크라면 스팸일 수 있으니 서치콘솔의 링크 거부(disavow)를 검토합니다.") + `</p>`
    : "";
  // 막대는 상위 10개만 — 나머지와 전문은 접힌 표가 갖는다.
  const bars = [...a].sort((x, y) => (y.backlinks || 0) - (x.backlinks || 0)).slice(0, 10)
    .map(r => ({label: BLK_cut(r.anchor, 16), value: r.backlinks || 0, flag: over && r === top}));
  const chart = window.chBarList ? window.chBarList(bars, {unit: "개"}) : "";
  return head + warn + chart +
    `<details class="bx-alt"><summary>앵커 ${num(a.length)}개 전체 표</summary>` +
    table(["앵커?링크에 실제로 적힌 글자", ">링크 수", ">도메인 수"], rows) + `</details>`;
}

function BLK_links(d) {
  const all = d.bl_links || [];
  const nBroken = all.filter(r => r.is_broken).length;
  const nNof = all.filter(r => !r.dofollow).length;
  // 조건이 안 맞는 거르개는 열지 않는다 — 없는 종류를 눌러 빈 표를 보게 하지 않는다.
  if (BLK_LKF === "broken" && !nBroken) BLK_LKF = "all";
  if (BLK_LKF === "nofollow" && !nNof) BLK_LKF = "all";
  const rows = all.map(r => {
    const hid = (BLK_LKF === "broken" && !r.is_broken) || (BLK_LKF === "nofollow" && r.dofollow)
      ? " hidden" : "";
    return `<tr class="${r.is_broken ? "blk-broken" : ""}"${r.is_broken ? ' data-broken="1"' : ""}${r.dofollow ? "" : ' data-nofollow="1"'}${hid}>` +
    `<td><span class="blk-id">${BLK_av(BLK_host(r.url_from))}<span class="blk-url">${BLK_a(r.url_from || "", BLK_bare(r.url_from))}</span></span></td>` +
    `<td class="blk-anchor"><span class="blk-clamp" title="${esc(r.anchor || "")}">${esc(r.anchor || "")}</span></td>` +
    `<td class="blk-url">${BLK_a(r.url_to || "", BLK_bare(r.url_to))}${r.is_broken ? ` <span class="badge warn">⚠ 안 열림</span>` : ""}</td>` +
    `<td class="${r.dofollow ? "" : "blk-nofollow"}">${r.dofollow
      ? `<span class="badge ok">예</span>` : `<span class="badge muted">아니오</span>`}</td>` +
    `</tr>`;
  });
  const sub = "수집한 링크 전부입니다. 끊긴 것은 위 되찾을 링크에도 따로 모았습니다.";
  if (!rows.length)
    return BLK_bh("개별 링크", sub) +
      BLK_empty("개별 링크를 아직 수집하지 않았습니다",
        "수집하면 어느 페이지가 어떤 앵커로 우리를 가리키는지 한 줄씩 보입니다.",
        BLK_do("backlinks", "", false));
  const chips = nBroken || nNof
    ? `<div role="group" aria-label="링크 거르기">${BLK_chip("all", "전체", all.length, BLK_LKF, "BLK_lkFilter")}` +
      (nBroken ? BLK_chip("broken", "끊김", nBroken, BLK_LKF, "BLK_lkFilter") : "") +
      (nNof ? BLK_chip("nofollow", "반영 안 됨", nNof, BLK_LKF, "BLK_lkFilter") : "") + `</div>` : "";
  const shown = BLK_LKF === "broken" ? nBroken : BLK_LKF === "nofollow" ? nNof : all.length;
  // "cards" — ≤560px 에서 줄을 카드로 쌓는다(칸 라벨은 셸이 머리글에서 단다).
  return BLK_bh("개별 링크", sub, chips + BLK_tools(shown, "BLK_csvLinks", "blk-lk-n")) +
    `<div id="blk-links-tbl">` +
    table(["링크 건 페이지", "앵커", "우리 페이지?⚠ 는 그 URL 이 지금 안 열린다는 뜻",
           "순위 반영?순위로 넘어가는 링크인지. 업계 용어로 dofollow · nofollow 입니다"],
          rows, undefined, "cards") + `</div>`;
}

function BLK_csvDomains() {
  csv("참조도메인", [["도메인", "지수", "링크 수", "순위 반영", "최초 발견", "잃은 날"],
    ...(BLK_D.bl_domains || []).map(r =>
      [r.domain, r.rank, r.backlinks, r.dofollow, BLK_day(r.first_seen),
       BLK_day(r.lost_date)])]);
}

function BLK_csvLinks() {
  csv("백링크", [["링크 건 페이지", "앵커", "우리 페이지", "순위 반영", "깨짐"],
    ...(BLK_D.bl_links || []).map(r =>
      [r.url_from, r.anchor, r.url_to, r.dofollow ? "예" : "아니오",
       r.is_broken ? "Y" : ""])]);
}

/* 빈 화면은 막다른 길이 아니라 다음 한 걸음이다. 여기서 갈리는 것은 셋:
   아직 안 샀다 / 살 수 없다(키 없음) / 샀는데 경쟁사가 없어 교집합만 비었다.
   셋을 같은 "데이터 없음"으로 뭉치면 무엇을 하면 채워지는지가 화면 밖에 남는다.
   셸이 act() 를 세운 배포에서는 배포에 맞는 버튼 하나로 끝난다. 라벨을 비우면
   셸이 STAGE_LABELS 의 재실행 라벨(run)로 채운다 — 여기서 다시 대지 않는다. */
const BLK_do = (stage, label, primary = false) => READONLY ? ""
  : window.act
  ? `<div class="acts">${window.act(stage, label, primary)}</div>`
  : W(`<div class="cmd" role="button" tabindex="0" onclick="copyCmd(this)"
        onkeydown="if(event.key==='Enter'||event.key===' ')
          {event.preventDefault();copyCmd(this)}">/capture ${stage}</div>`,
      `<p class="blk-note">화면 머리의 실행 버튼이 그 자리입니다.</p>`);

/* 상태 셋을 부품으로 가른다: 자료가 없으면 `.empty`, 검사했고 문제가 없으면
   `.empty.ok`(체크), 실패면 `.empty.err`. 여태 「끊긴 링크가 없습니다」가
   빈 상자로 나가서 좋은 소식이 실패처럼 읽혔다.
   문제 없음 상자에는 행동을 안 단다 — 할 일이 없고, 재실행은 화면 머리에 이미 있다. */
const BLK_empty = (title, why, acts, tip) =>
  `<div class="empty"><b>${title}${tip ? BLK_tip(tip) : ""}</b><p>${why}</p>${acts || ""}</div>`;
const BLK_ok = (title, why) =>
  `<div class="empty ok"><b>${title}</b><p>${why}</p></div>`;

// 띠의 주요 버튼이 가리키는 자리로 내린다 — 백링크 화면은 길어서 "아래에 있다"는
// 말만으로는 못 찾는다.
function BLK_jump(id) {
  const el = $(id);
  if (el) el.scrollIntoView({behavior: "smooth", block: "start"});
}
// 링크를 뗀 도메인만 골라 도메인 표로 내린다 — 「잃은 도메인 보기」가 이 손잡이다.
function BLK_lostView() {
  BLK_domFilter("lost");
  BLK_jump("blk-domcard");
}
// 링크를 요청할 상대의 사이트. 도메인만 오므로 https 를 앞에 붙인다.
const BLK_site = dom => dom
  ? `<div class="acts"><a class="go sm sec" target="_blank" rel="noopener"
       href="https://${encodeURI(dom)}">도메인 열기</a></div>` : "";

const BLK_seeBtn = (id, label, primary = true) =>
  `<button type="button" class="go${primary ? "" : " sec"}"
     onclick="BLK_jump('${id}')">${label}</button>`;

/* 가장 많이 겹치는 링크처를 그 자리에서 편다 — 띠가 이름을 말했으니 누르면 그
   줄이 열려야 한다. 도메인 글자를 onclick 에 싣지 않고 dataset 으로 맞춘다.
   목록이 스크롤 상자라 그 줄이 상자 맨 위에 오도록 상자도 같이 민다. */
function BLK_open() {
  const box = $("blk-intersect");
  if (!box) return;
  const det = [...box.querySelectorAll("details[data-key]")]
    .find(x => x.dataset.key === BLK_TOP);
  if (!det) return BLK_jump("bl-intersect");
  det.open = true;
  box.scrollTop = Math.max(0, det.offsetTop - 4);
  BLK_jump("bl-intersect");
}

/* ── 다음 한 걸음 ─────────────────────────────────────────────────────────
      이 화면이 파는 것은 교집합이다 — 경쟁사가 받는데 우리만 빠진 링크처. 그게
      있으면 그 줄 하나로 닫는다. 없을 때만 되찾을 링크·잃은 도메인으로 물러선다. */
function BLK_nextStep(d) {
  if (!window.nextStep || !window.act) return;
  const put = (t, acts) =>
    window.nextStep("backlinks", `<p>${t}</p><div class="acts">${acts}</div>`);
  const failed = window.runFailed("backlinks", d);
  if (!d.bl_date && failed)
    return put(`지난 <b>${esc(BLK_name("backlinks"))}</b>에서 멈췄습니다.
      <span class="live">다시 수집하면 이어서 채워집니다.</span>`,
      window.act("backlinks", "", true));
  if (!d.bl_date)
    return put(`백링크를 아직 수집하지 않았습니다.
      <span class="live">한 번 수집하면 누가 우리를 링크하는지와 우리만 빠진 링크처가
      같이 채워집니다.</span>`, window.act("backlinks", BLK_name("backlinks")));
  const broken = (d.bl_links || []).filter(r => r.is_broken).length;
  const lost = (d.bl_domains || []).filter(r => r.lost_date).length;
  const ixs = (d.bl_intersect || []).slice().sort((a, b) => (b.hits || 0) - (a.hits || 0));
  const rivals = BLK_rivals(d);
  if (ixs.length) {
    BLK_TOP = ixs[0].domain;
    return put(`경쟁사만 받은 링크처가 ${num(ixs.length)}곳입니다. 가장 많이 겹치는 곳은
      <b>${esc(ixs[0].domain)}</b>이고 경쟁사 ${num(ixs[0].hits)}곳이 여기서 받았습니다.`,
      `<button type="button" class="go" onclick="BLK_open()">링크처 열기</button>` +
      (broken ? BLK_seeBtn("bl-broken", `되찾을 링크 ${num(broken)}개`, false) : ""));
  }
  if (broken)
    return put(`끊긴 링크 ${num(broken)}개는 되살리면 그대로 돌아옵니다. 새로 얻는 것보다
      늘 쌉니다.`, BLK_seeBtn("bl-broken", "되찾을 링크 보기"));
  if (lost)
    return put(`링크를 뗀 도메인이 ${num(lost)}곳입니다. 그쪽에 지금도 관련 페이지가 있으면
      다시 링크해 달라고 요청할 자리입니다.`,
      `<button type="button" class="go" onclick="BLK_lostView()">잃은 도메인 보기</button>`);
  if (rivals < 2)
    return put(`경쟁사가 둘 이상이어야 우리만 빠진 링크처를 가려낼 수 있습니다.
      <span class="live">찾으면 이 화면의 교집합이 채워집니다.</span>`,
      window.act("competitors", BLK_name("competitors")));
  return put(`지금 되찾을 링크도 새로 얻을 자리도 없습니다. 백링크는 주 단위로 움직이니
    그때 다시 재면 됩니다.`, window.act("backlinks", "", true));
}

VIEW("backlinks", function (d) {
  BLK_D = d;
  const has = !!d.bl_date;
  const failed = window.runFailed("backlinks", d);
  BLK_nextStep(d);
  window.viewSub && viewSub("backlinks",
    "누가 우리를 링크하는지, 어디를 놓쳤는지 봅니다.");

  // 수집 전·실패는 카드 한 장이 말한다 — 나머지 카드는 그때 채울 것이 없어 숨긴다.
  // 실패는 비어 있는 것과 다른 일이다 — 비었으면 채우면 되고, 실패했으면 무엇이
  // 실패했는지 알아야 다시 할 수 있다. 그래서 상자 모양부터 가른다(.empty.err).
  $("blk-empty").hidden = has;
  $("blk-hero").hidden = !has;
  $("blk-health").hidden = !has;
  $("blk-empty").innerHTML = has ? "" : failed
    ? `<div class="empty err"><b>${esc(BLK_name("backlinks"))}에서 멈췄습니다</b>
        <p>보통 수집원 키가 없거나 잔액이 0일 때 이렇게 끝납니다. 채운 뒤 다시 수집하면
          이어서 채워집니다.</p>${BLK_do("backlinks", "", false)}</div>`
    // 수집 전에는 카드 하나가 나머지를 미리 말하고(BLK_gain 이 정본, 두 번째 문구를
    // 새로 짓지 않는다) CTA 도 하나만 둔다. 아래 section 셋은 채울 것이 없으므로 감춘다.
    : BLK_empty("백링크를 아직 수집하지 않았습니다", BLK_gain("backlinks"),
        BLK_do("backlinks", BLK_name("backlinks"), false),
        "선택 단계입니다. 안 돌려도 다른 화면과 기회 목록은 그대로 채워집니다.");

  // 되찾을 링크·교집합·표들은 위 카드가 이미 예고했다 — 수집 전에는 section 째로 숨긴다.
  // 실패도 다시 돌리기 전까지는 "아직 없음"과 같다.
  $("bl-broken").hidden = !has;
  $("bl-intersect").hidden = !has;
  $("bl-links").hidden = !has;
  if (!has) return;

  $("blk-hero").innerHTML = BLK_hero(d);
  $("blk-health").innerHTML = BLK_health(d);

  // 되찾을 링크 — 이미 번 링크라 새로 얻는 것보다 늘 싸다. 잃은 것을 먼저 세고
  // (끊긴 링크 · 링크를 뗀 도메인) 그다음에 방법을 말한다.
  const broken = (d.bl_links || []).filter(r => r.is_broken).length;
  const lost = (d.bl_domains || []).filter(r => r.lost_date).length;
  // 요약의 깨진 수는 전체 측정치고, 아래 목록은 지수가 높은 것부터 일부만 받아 온다 —
  // 둘이 어긋나면 "0건인데 왜 계기판은 17이냐"가 화면 밖에 남는다.
  const summaryBroken = (d.bl_summary || {}).broken_backlinks || 0;
  const capped = !broken && summaryBroken
    ? BLK_tip(`요약의 깨진 백링크 ${num(summaryBroken)}건은 이번에 받은 링크 목록 안에 ` +
              "없습니다. 목록은 지수가 높은 것부터 일부만 받아 옵니다.") : "";
  // 되찾을 것이 0이면 되찾는 방법을 설명할 이유가 없다 — 셀 것이 없다고만 말한다.
  $("blk-recover-sub").innerHTML = broken || lost
    ? `끊긴 링크 <b>${num(broken)}개</b>, 링크를 뗀 도메인 <b>${num(lost)}곳</b>입니다.` +
      BLK_tip("이미 번 링크라 그 주소를 되살리거나 살아 있는 페이지로 301 리다이렉트하면 " +
              "그대로 돌아옵니다. 새로 얻는 것보다 늘 쌉니다.")
    : `끊긴 링크도 링크를 뗀 도메인도 없습니다.${capped}`;
  $("blk-recover-bar").innerHTML = BLK_brBar(d);
  $("blk-recover").innerHTML = BLK_broken(d);

  // 교집합은 경쟁사가 둘 이상이어야 성립한다 — 비어 있는 이유가 그것일 수 있다.
  const rivals = BLK_rivals(d);
  const ix = (d.bl_intersect || []).length;
  $("blk-ix-sub").innerHTML = ix
    ? `우리만 빠진 링크처가 <b>${num(ix)}곳</b>입니다.` +
      BLK_tip("우리가 이미 받고 있는 도메인은 뺐으므로 남은 것이 곧 할 일 목록입니다. " +
              "지수가 높은 곳부터 우리 자료를 근거로 링크를 요청합니다.")
    : rivals >= 2
      ? "경쟁사가 공통으로 받는 곳 중 우리만 빠진 도메인은 없습니다."
      : "경쟁사가 둘 이상이어야 교집합이 나옵니다.";
  $("blk-ix-bar").innerHTML = BLK_ixBar(d);
  $("blk-intersect").innerHTML = BLK_intersect(d, rivals);

  $("blk-domcard").innerHTML = BLK_domains(d);
  $("blk-anchors").innerHTML = BLK_anchors(d);
  $("blk-links").innerHTML = BLK_links(d);
});
</script>
