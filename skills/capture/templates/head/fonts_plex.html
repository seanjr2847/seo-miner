<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- IBM Plex Mono — 랜딩·방침·404 의 숫자·URL·로고 등폭. 대시보드·입구 화면은 토큰의
     --mono(Cascadia 스택)를 쓰므로 이 조각을 안 받는다. 막지 않게 받는 이유는 fonts.html 과
     같다(media=print + onload). 못 받으면 --mono 의 뒤쪽 스택으로 떨어진다. -->
<link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<noscript><link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"></noscript>
