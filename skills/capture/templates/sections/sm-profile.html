<script type="application/json" class="section-def">
{"id": "sm-profile", "view": "settings", "after": "usage"}
</script>
<!-- 사이트 프로필(브랜드 표기·경쟁사 도메인·등재 도구·씨앗 키워드) — **두 배포 공통**.
     예전엔 호스팅 전용 섹션(sm-set) 안에만 있어서, 로컬 대시보드에는 이 칸이 아예 없었다
     (로컬 설정은 새 사이트 등록 폼뿐이었고, 이 PC 가 호스팅 모드면 그 폼도 숨었다).
     값은 Brain 한 곳에 산다(db.profile_read/save) — 원격 사이트는 로컬 서버가 호스팅으로
     넘기므로 두 화면이 같은 값을 본다. -->
<style>
#sm-profile .sm-ch { margin:0 0 var(--sp-4); }
#sm-profile .sm-ch h2 { font:650 var(--fs-3)/1.4 var(--sans); color:var(--ink); margin:0; }
#sm-profile .sm-ch .sub { font:400 var(--fs-1)/1.5 var(--sans); color:var(--sub); margin:2px 0 0; max-width:74ch; }
#sm-profile .profile .lh { display:block; font:var(--micro); color:var(--sub);
  margin:0 0 6px; max-width:56ch; }
#sm-profile .profile label:not(:first-of-type) { margin-top:16px; }
#sm-profile .profile .msg { display:block; min-height:1.6em; margin-top:2px; }
</style>
<section id="sm-profile">
  <div class="card">
  <div class="sm-ch">
    <h2>브랜드·경쟁사<span class="hint" tabindex="0"
      data-tip="비워 둬도 측정은 그대로 됩니다 — 검색어·분석 화면이 남의 브랜드 검색을 걸러내는 데만 씁니다."
      aria-label="비워 둬도 측정은 그대로 됩니다 — 검색어·분석 화면이 남의 브랜드 검색을 걸러내는 데만 씁니다."
      >i</span></h2>
    <p class="sub">벗어나면(포커스를 잃으면) 그 자리에서 저장되고 다음 실행부터 적용됩니다.</p>
  </div>
  <div class="profile">
    <label for="pf-alias">브랜드 표기</label>
    <span class="lh" id="pf-alias-lh">AI 답변에서 우리 이름을 알아보는 데 씁니다. 쉼표로 여러 개.</span>
    <input id="pf-alias" spellcheck="false">
    <span class="msg" role="status" id="pf-alias-m"></span>
    <label for="pf-comp">경쟁사 도메인</label>
    <span class="lh" id="pf-comp-lh">경쟁사 검색어와 백링크를 견줄 상대입니다. 선택이고 쉼표로 여러 개.</span>
    <input id="pf-comp" spellcheck="false" placeholder="competitor.com, other.com">
    <span class="msg" role="status" id="pf-comp-m"></span>
    <label for="pf-tools">등재·경쟁 도구 이름</label>
    <span class="lh">남의 브랜드 검색을 걸러냅니다. 쉼표로 여러 개.</span>
    <input id="pf-tools" placeholder="ecrett, paperpal, future tools">
    <span class="msg" role="status" id="pf-tools-m"></span>
    <label for="pf-seeds">씨앗 키워드</label>
    <span class="lh" id="pf-seeds-lh">자동완성으로 후보를 넓히는 출발점입니다. 3~10개, 쉼표나 줄바꿈으로.</span>
    <textarea id="pf-seeds" placeholder="예) 무선 이어폰 추천&#10;노트북 가성비 비교"></textarea>
    <span class="msg" role="status" id="pf-seeds-m"></span>
  </div>
  </div>
</section>
<script>
"use strict";
// 브랜드·경쟁사 칸의 불러오기·저장 — 로컬·호스팅 공통. 읽기는 GET /api/settings,
// 쓰기는 셸의 post()(로컬은 X-Token 을 붙여야 받는다 — 호스팅은 무시한다). 답하는 쪽은
// 배포마다 다르지만 본체는 한 벌이다: db.profile_read/profile_save. 로컬 대시보드의
// 원격 사이트는 로컬 서버가 호스팅으로 넘긴다(Handler._proxy).
(function () {
  var FIELDS = ["alias", "comp", "tools", "seeds"];
  var KEY = {alias: "brand_aliases", comp: "competitors_manual",
             tools: "tools", seeds: "seed_keywords"};
  var DONE = "";     // setLoad() 의 SET_DONE 과 같은 구실 — 사이트당 한 번만 받는다

  function proj() {
    var p = document.getElementById("proj");
    return p ? p.value : "";
  }
  function field(k) { return document.getElementById("pf-" + k); }
  function msg(k) { return document.getElementById("pf-" + k + "-m"); }

  async function pfLoad() {
    var pj = proj();
    if (!pj || DONE === pj || !field("alias")) return;
    DONE = pj;
    var d;
    try {
      d = await (await fetch("/api/settings?project=" + encodeURIComponent(pj))).json();
    } catch (e) {
      DONE = "";     // 못 받았으면 다음 sm:site 에서 다시 시도한다
      return;
    }
    FIELDS.forEach(function (k) { field(k).value = d[KEY[k]] || ""; });
    // 브랜드 표기가 비어 있을 때만 도메인 초안을 얹는다 — placeholder 는 저장되지
    // 않는 글자다: 검색어 화면이 켜는 "비었습니다" 경고를 여기서 조용히 지우지
    // 않는다. 사람이 실제로 적어야(또는 이 값을 그대로 옮겨 적어야) 저장된다.
    if (!d.brand_aliases && d.brand_suggestion) {
      field("alias").placeholder = d.brand_suggestion;
      document.getElementById("pf-alias-lh").textContent =
        "AI 답변에서 우리 이름을 알아보는 데 씁니다. 쉼표로 여러 개 — 비어 있으면 " +
        "검색어 화면에서 남의 브랜드를 못 거릅니다. 예: " + d.brand_suggestion;
    }
    hints(d);
  }

  // 칸 옆 안내 한 줄 — 비었을 때 무엇이 달라지는지만 말한다(채우라고 조르지 않는다).
  // 재료는 서버가 준 사실(db.profile_read 의 rivals_confirmed·gsc_connected)이다.
  var BASE = {};
  function hints(d) {
    ["comp", "seeds"].forEach(function (k) {
      var el = document.getElementById("pf-" + k + "-lh");
      if (el && !(k in BASE)) BASE[k] = el.innerHTML;
      if (el) el.innerHTML = BASE[k];
    });
    var comp = document.getElementById("pf-comp-lh");
    // 판정 전 후보(검색 결과가 겹친 곳)만 있고 확인된 경쟁사가 0곳 — [경쟁 분석]도 같은 말을 한다.
    if (comp && !d.competitors_manual && d.rivals_confirmed === 0)
      comp.innerHTML = "경쟁사로 확인된 곳이 아직 없습니다. 아는 곳을 적거나 " +
        (window.go ? window.go("competitors") : "[경쟁 분석]") +
        "에서 찾으세요. 쉼표로 여러 개.";
    var seeds = document.getElementById("pf-seeds-lh");
    // 서치콘솔이 붙은 사이트는 씨앗이 없어도 후보를 캔다(구글 실적의 검색어) — 비워 둬도 된다.
    if (seeds && !d.seed_keywords && d.gsc_connected)
      seeds.innerHTML = "비어 있으면 서치콘솔 검색어로만 후보를 캡니다. 아직 노출이 없는 주제로 " +
        "넓히고 싶을 때만 3~10개 적으세요.";
  }

  async function pfSave(k) {
    var pj = proj();
    if (!pj) return;
    var el = field(k), m = msg(k), val = el.value;
    var body = {project: pj, profile: {}};
    body.profile[KEY[k]] = val;
    m.textContent = "저장하는 중…";
    try {
      var res = await post("/api/settings", body);
      var d = res[1] || {};
      if (!res[0]) throw new Error(d.detail || d.error || "");
      m.textContent = "저장했습니다.";
      if (k === "alias" && val) { el.placeholder = ""; }   // 채웠으면 초안 문구를 뗀다
      hints(d);            // 저장 응답도 profile_read 꼴이다 — 경쟁사를 적으면 안내가 걷힌다
    } catch (e) {
      m.textContent = "저장하지 못했습니다. 다시 벗어나면 재시도합니다.";
    }
  }

  var sec = document.getElementById("sm-profile");
  if (sec) {
    FIELDS.forEach(function (k) {
      var el = field(k);
      if (el) el.addEventListener("change", function () { pfSave(k); });
    });
  }
  document.addEventListener("sm:site", pfLoad);
  pfLoad();   // 이미 사이트가 골라진 채로 이 스크립트가 늦게 실행됐을 때 대비
})();
</script>
