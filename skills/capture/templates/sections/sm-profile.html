<script type="application/json" class="section-def">
{"id": "sm-profile", "view": "settings", "after": "usage"}
</script>
<!-- 사이트 프로필(브랜드 표기·경쟁사 도메인·등재 도구) — **두 배포 공통**.
     예전엔 호스팅 전용 섹션(sm-set) 안에만 있어서, 로컬 대시보드에는 이 칸이 아예 없었다
     (로컬 설정은 새 사이트 등록 폼뿐이었고, 이 PC 가 호스팅 모드면 그 폼도 숨었다).
     값은 Brain 한 곳에 산다(db.profile_read/save) — 원격 사이트는 로컬 서버가 호스팅으로
     넘기므로 두 화면이 같은 값을 본다.
     2026-10-17: 쉼표로 이어 적던 칸 셋을 칩(태그) 입력으로 바꾸고 카드를 셋으로 쪼갰다 —
     성격이 다른 값(우리 이름 · 견줄 상대 · 거를 이름)이 한 카드에 몰려 있었다. 저장 형식은 그대로다:
     화면은 칩 배열을 들고 있다가 `a, b, c` 한 줄로 이어 POST 한다(서버 db.profile_save 가
     쉼표·줄바꿈으로 가른다). 칩 입력기(.tgbox[data-tg])는 이 파일 한 벌이다 — [키워드 관리]의
     씨앗 칸(sm-seeds.html)도 같은 마크업만 놓고 이 스크립트가 붙는다.
     섹션은 상자가 아니다(display:contents) — 안의 카드 셋이 설정 화면 격자에 곧바로 선다. -->
<style>
#sm-profile .sm-ch { margin:0 0 var(--sp-3); }
#sm-profile .sm-ch h2 { font:650 var(--fs-3)/1.4 var(--sans); color:var(--ink); margin:0; }
#sm-profile .sm-ch .sub { font:400 var(--fs-1)/1.5 var(--sans); color:var(--sub); margin:2px 0 0; max-width:74ch; }
/* 칩 입력기 — 칩과 입력칸이 한 상자 안에서 줄바꿈하며 흐른다 */
.tgbox { display:flex; flex-wrap:wrap; align-items:center; gap:6px; min-height:var(--btn-h);
  padding:6px 8px; border:1px solid var(--rule); border-radius:var(--r-in); background:var(--card);
  cursor:text; }
.tgbox:focus-within { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-wash); }
.tgbox .tg { display:inline-flex; align-items:center; gap:2px; max-width:100%; min-height:28px;
  padding:0 4px 0 10px; border-radius:var(--r-pill); background:var(--accent-wash); color:var(--accent);
  font:500 var(--fs-2)/1.3 var(--sans); }
.tgbox .tg .tgt { overflow-wrap:anywhere; cursor:pointer; padding:4px 0; }
.tgbox[data-tg="comp"] .tg .tgt { font-family:var(--mono); font-size:var(--fs-1); }
.tgbox .tg .tgx { flex:none; display:grid; place-items:center; width:20px; height:20px; padding:0;
  border:0; border-radius:50%; background:transparent; color:inherit; cursor:pointer; opacity:.7; }
.tgbox .tg .tgx:hover { opacity:1; background:var(--card); }
.tgbox .tg .tgx svg { width:10px; height:10px; stroke:currentColor; fill:none; stroke-width:2.4; stroke-linecap:round; }
.tgbox .tg.dup { animation:tg-dup .9s ease-out; }
@keyframes tg-dup { 0%,60% { background:var(--warn); color:var(--card); } 100% { background:var(--accent-wash); } }
@media (prefers-reduced-motion: reduce) { .tgbox .tg.dup { animation:none; outline:2px solid var(--warn); } }
.tgbox .tgin { flex:1 1 110px; min-width:90px; width:auto; max-width:none; margin:0; padding:4px 2px;
  border:0; outline:0; background:transparent; box-shadow:none; font:400 var(--fs-2)/1.4 var(--sans);
  color:var(--ink); }
.tgbox[data-tg="comp"] .tgin { font-family:var(--mono); font-size:var(--fs-1); }
.tgrow { display:flex; align-items:center; flex-wrap:wrap; gap:var(--sp-2); margin-top:var(--sp-2);
  min-height:1.6em; }
.tgrow .msg { font:400 var(--fs-1)/1.5 var(--sans); color:var(--sub); margin:0; }
.tgrow .msg.bad { color:var(--warn); }
.tgrow .msg button { border:0; background:transparent; color:var(--accent); cursor:pointer;
  font:inherit; font-weight:650; text-decoration:underline; text-underline-offset:2px; padding:0 2px; }
.tgsug { display:flex; flex-wrap:wrap; gap:6px; margin-top:var(--sp-2); }
.tgsug button { min-height:28px; padding:0 10px; border:1px dashed var(--accent); border-radius:var(--r-pill);
  background:transparent; color:var(--accent); cursor:pointer; font:500 var(--fs-2)/1.3 var(--sans); }
.tgsug button:hover { background:var(--accent-wash); }
.tgsug[hidden] { display:none; }
</style>
<section id="sm-profile">
  <div class="card pf-card" id="pf-c-alias" data-mode="measure">
    <div class="sm-ch">
      <h2>브랜드 표기<span class="hint" tabindex="0"
        data-tip="비워 둬도 측정은 그대로 됩니다 — 검색어·[클릭 변화] 화면이 남의 브랜드 검색을 걸러내는 데만 씁니다."
        aria-label="비워 둬도 측정은 그대로 됩니다 — 검색어·[클릭 변화] 화면이 남의 브랜드 검색을 걸러내는 데만 씁니다."
        >i</span></h2>
      <p class="sub" id="pf-alias-lh">AI 답변에서 우리 이름을 알아보는 데 씁니다.</p>
    </div>
    <div class="tgbox" data-tg="alias"><input id="pf-alias" class="tgin" spellcheck="false" autocomplete="off"
      aria-label="브랜드 표기 추가" placeholder="이름을 적고 Enter"></div>
    <div class="tgsug" id="pf-alias-sug" hidden></div>
    <div class="tgrow"><span class="msg" role="status" id="pf-alias-m"></span></div>
  </div>
  <div class="card pf-card" id="pf-c-comp" data-mode="measure">
    <div class="sm-ch">
      <h2>경쟁사 도메인</h2>
      <p class="sub" id="pf-comp-lh">경쟁사 검색어와 백링크를 견줄 상대입니다. 선택입니다.</p>
    </div>
    <div class="tgbox" data-tg="comp"><input id="pf-comp" class="tgin" spellcheck="false" autocomplete="off"
      inputmode="url" aria-label="경쟁사 도메인 추가" placeholder="competitor.com 입력 후 Enter"></div>
    <div class="tgrow"><span class="msg" role="status" id="pf-comp-m"></span></div>
  </div>
  <div class="card pf-card" id="pf-c-tools" data-mode="measure">
    <div class="sm-ch">
      <h2>등재·경쟁 도구 이름</h2>
      <p class="sub">남의 브랜드 검색을 걸러냅니다.</p>
    </div>
    <div class="tgbox" data-tg="tools"><input id="pf-tools" class="tgin" spellcheck="false" autocomplete="off"
      aria-label="도구 이름 추가" placeholder="ecrett, paperpal …"></div>
    <div class="tgrow"><span class="msg" role="status" id="pf-tools-m"></span></div>
  </div>
</section>
<script>
"use strict";
// 브랜드·경쟁사·도구(+ [키워드 관리]의 씨앗) 칩 입력기의 불러오기·저장 — 로컬·호스팅 공통.
// 읽기는 GET /api/settings, 쓰기는 셸의 post()(로컬은 X-Token 을 붙여야 받는다 — 호스팅은
// 무시한다). 답하는 쪽은 배포마다 다르지만 본체는 한 벌이다: db.profile_read/profile_save.
// 로컬 대시보드의 원격 사이트는 로컬 서버가 호스팅으로 넘긴다(Handler._proxy).
// 형식: 서버는 "a, b, c" 한 줄(쉼표·줄바꿈으로 가른다)을 받고 같은 꼴로 준다 — 화면은 칩 배열로
// 다루다가 보낼 때만 잇는다. 리스트로 보내면 서버가 str(list) 로 읽어 값이 망가진다.
(function () {
  var KEY = {alias: "brand_aliases", comp: "competitors_manual",
             tools: "tools", seeds: "seed_keywords"};
  var DONE = "";     // setLoad() 의 SET_DONE 과 같은 구실 — 사이트당 한 번만 받는다
  var M = {};        // 칸 -> 칩 배열(화면의 정본)
  var UNDO = {};     // 칸 -> 마지막 저장 묶음 직전의 배열(되돌리기)
  var TIMER = {}, BUSY = {}, AGAIN = {}, PJ = {};

  function proj() {
    var p = document.getElementById("proj");
    return p ? p.value : "";
  }
  function boxes() { return document.querySelectorAll(".tgbox[data-tg]"); }
  function box(k) { return document.querySelector('.tgbox[data-tg="' + k + '"]'); }
  function field(k) { return document.getElementById("pf-" + k); }
  function msgEl(k) { return document.getElementById("pf-" + k + "-m"); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c];
    });
  }

  // 칩 하나의 글자 — 공백을 접고, 쉼표류를 뺀다(서버가 쉼표로 가르므로 칩 안에 못 둔다).
  // 경쟁사는 서버가 소문자로 저장하므로 화면도 같게 보이고, 붙여 넣은 주소(https://…/경로)는 도메인만 남긴다.
  function norm(k, v) {
    v = String(v).replace(/\s+/g, " ").trim();
    if (k === "comp") v = v.toLowerCase().replace(/^[a-z]+:\/\//, "").replace(/[\/?#].*$/, "");
    return v.replace(/[,，、;；]/g, "").trim();
  }
  function split(text) { return String(text).split(/[,，、;；\n\r\t]+/); }
  function has(k, v) {
    var low = v.toLowerCase();
    for (var i = 0; i < M[k].length; i++) if (M[k][i].toLowerCase() === low) return i;
    return -1;
  }

  function render(k) {
    var b = box(k), inp = field(k);
    if (!b || !inp) return;
    if (!inp.dataset.ph) inp.dataset.ph = inp.getAttribute("placeholder") || "";
    b.querySelectorAll(".tg").forEach(function (n) { n.remove(); });
    (M[k] || []).forEach(function (v, i) {
      var s = document.createElement("span");
      s.className = "tg";
      s.dataset.i = i;
      s.innerHTML = '<span class="tgt" title="누르면 고칩니다">' + esc(v) + '</span>' +
        '<button type="button" class="tgx" aria-label="' + esc(v) + ' 삭제" title="삭제">' +
        '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
      b.insertBefore(s, inp);
    });
    inp.placeholder = (M[k] || []).length ? "" : inp.dataset.ph;
    sug();
  }

  function say(k, text, bad, undo, retry) {
    var m = msgEl(k);
    if (!m) return;
    m.className = "msg" + (bad ? " bad" : "");
    m.textContent = text;
    var act = undo ? ["되돌리기", "undo"] : retry ? ["다시 시도", "retry"] : null;
    if (act) {
      m.appendChild(document.createTextNode(" "));
      var bt = document.createElement("button");
      bt.type = "button";
      bt.textContent = act[0];
      bt.dataset.tgAct = act[1];
      m.appendChild(bt);
    }
  }

  // 바꾼 뒤 잠깐(0.4초) 모았다가 한 번에 저장한다 — 여러 개를 붙여 넣어도 요청은 하나다.
  function touch(k) {
    if (!TIMER[k]) PJ[k] = proj();       // 묶음의 첫 변경이 가리킨 사이트로 보낸다(그 사이 사이트가 바뀌어도)
    clearTimeout(TIMER[k]);
    say(k, "저장하는 중…");
    TIMER[k] = setTimeout(function () { TIMER[k] = 0; run(k); }, 400);
  }
  function mutate(k, fn) {               // 되돌리기 지점은 저장 묶음의 첫 변경 직전이다
    if (!TIMER[k]) UNDO[k] = (M[k] || []).slice();
    fn();
    render(k);
    touch(k);
  }

  function add(k, text) {
    if (!M[k]) M[k] = [];
    var fresh = [], dups = [];
    split(text).forEach(function (raw) {
      var v = norm(k, raw);
      if (!v) return;
      if (has(k, v) >= 0 || fresh.some(function (x) { return x.toLowerCase() === v.toLowerCase(); })) {
        if (dups.indexOf(v) < 0) dups.push(v);
      } else fresh.push(v);
    });
    if (fresh.length) mutate(k, function () { M[k] = M[k].concat(fresh); });
    if (dups.length) {
      var i = has(k, dups[0]), node = box(k).querySelector('.tg[data-i="' + i + '"]');
      if (node) { node.classList.remove("dup"); void node.offsetWidth; node.classList.add("dup"); }
      if (!fresh.length) say(k, "이미 있습니다 — " + dups.join(", "), true);
    }
  }
  function drop(k, i) {
    if (!M[k] || i < 0 || i >= M[k].length) return;
    mutate(k, function () { M[k].splice(i, 1); });
  }

  async function run(k) {
    if (BUSY[k]) { AGAIN[k] = true; return; }   // 저장 중에 또 바뀌면 끝난 뒤 한 번 더 — 순서가 뒤집히지 않게
    BUSY[k] = true;
    try {
      do { AGAIN[k] = false; await send(k); } while (AGAIN[k]);
    } finally { BUSY[k] = false; }
  }
  async function send(k) {
    var pj = PJ[k] || proj();
    if (!pj) return;
    var body = {project: pj, profile: {}};
    body.profile[KEY[k]] = (M[k] || []).join(", ");
    try {
      var res = await post("/api/settings", body);
      var d = res[1] || {};
      if (!res[0]) throw new Error(d.detail || d.error || "");
      say(k, "저장했습니다.", false, !!(UNDO[k] && !TIMER[k]));
      if (pj === proj()) hints(d);   // 저장 응답도 profile_read 꼴이다 — 경쟁사를 적으면 안내가 걷힌다
    } catch (e) {
      say(k, "저장하지 못했습니다.", true, false, true);
    }
  }

  // 브랜드 표기가 비어 있을 때만 도메인 앞부분을 **제안 칩**으로 띄운다 — 눌러야 들어가고
  // 저장된다(자동으로 채우지 않는다: 검색어 화면이 켜는 "비었습니다" 경고를 조용히 지우지 않는다).
  var SUG = "";
  function sug() {
    var el = document.getElementById("pf-alias-sug");
    if (!el) return;
    var on = SUG && !(M.alias || []).length;
    el.hidden = !on;
    el.innerHTML = on ? '<button type="button" data-tg-sug="' + esc(SUG) + '">+ ' + esc(SUG) + '</button>' : "";
  }

  async function pfLoad() {
    var pj = proj();
    if (!pj || DONE === pj || !boxes().length) return;
    DONE = pj;
    var d;
    try {
      d = await (await fetch("/api/settings?project=" + encodeURIComponent(pj))).json();
    } catch (e) {
      DONE = "";     // 못 받았으면 다음 sm:site 에서 다시 시도한다
      return;
    }
    boxes().forEach(function (b) {
      var k = b.dataset.tg;
      M[k] = split(d[KEY[k]] || "").map(function (v) { return norm(k, v); }).filter(Boolean);
      UNDO[k] = null;
      render(k);
      say(k, "");
    });
    SUG = !d.brand_aliases && d.brand_suggestion ? d.brand_suggestion : "";
    var lh = document.getElementById("pf-alias-lh");
    if (lh) lh.textContent = SUG
      ? "AI 답변에서 우리 이름을 알아보는 데 씁니다. 비어 있으면 검색어 화면에서 남의 브랜드를 못 거릅니다."
      : "AI 답변에서 우리 이름을 알아보는 데 씁니다.";
    sug();
    hints(d);
  }

  // 칸 옆 안내 한 줄 — 비었을 때 무엇이 달라지는지만 말한다(채우라고 조르지 않는다).
  // 재료는 서버가 준 사실(db.profile_read 의 rivals_confirmed·gsc_connected)이다.
  var BASE = {};
  function hints(d) {
    ["comp", "seeds"].forEach(function (k) {
      var el = document.getElementById("pf-" + k + "-lh");
      if (el && !(k in BASE)) BASE[k] = el.innerHTML;
      if (el) el.innerHTML = BASE[k];
    });
    var comp = document.getElementById("pf-comp-lh");
    // 판정 전 후보(검색 결과가 겹친 곳)만 있고 확인된 경쟁사가 0곳 — [경쟁 검색어]도 같은 말을 한다.
    if (comp && !d.competitors_manual && d.rivals_confirmed === 0)
      comp.innerHTML = "경쟁사로 확인된 곳이 아직 없습니다. 아는 곳을 적거나 " +
        (window.go ? window.go("competitors") : "[경쟁 검색어]") + "에서 찾으세요.";
    var seeds = document.getElementById("pf-seeds-lh");
    // 서치콘솔이 붙은 사이트는 씨앗이 없어도 후보를 캔다(구글 실적의 검색어) — 비워 둬도 된다.
    if (seeds && !d.seed_keywords && d.gsc_connected)
      seeds.innerHTML = "비어 있으면 서치콘솔 검색어로만 후보를 캡니다. 아직 노출이 없는 주제로 " +
        "넓히고 싶을 때만 3~10개 적으세요.";
  }

  // 배선은 문서 한 곳에서 위임한다 — 칸이 [설정]에 있든 [키워드 관리]에 있든 같은 길이다.
  function kOf(el) {
    var b = el.closest && el.closest(".tgbox[data-tg]");
    return b ? b.dataset.tg : null;
  }
  function isIn(t) { return t && t.classList && t.classList.contains("tgin"); }
  document.addEventListener("keydown", function (ev) {
    var t = ev.target;
    if (!isIn(t) || ev.isComposing) return;
    var k = kOf(t);
    if (!k) return;
    if (ev.key === "Enter" || ev.key === ",") {
      ev.preventDefault();
      if (t.value.trim()) { add(k, t.value); t.value = ""; }
    } else if (ev.key === "Backspace" && !t.value && (M[k] || []).length) {
      ev.preventDefault();
      drop(k, M[k].length - 1);
    }
  });
  document.addEventListener("input", function (ev) {    // 모바일 키보드·IME 는 keydown 이 ","를 못 줄 때가 있다
    var t = ev.target;
    if (!isIn(t) || ev.isComposing) return;
    var k = kOf(t);
    if (k && /[,，、;；\n]/.test(t.value)) { add(k, t.value); t.value = ""; }
  });
  document.addEventListener("paste", function (ev) {
    var t = ev.target;
    if (!isIn(t)) return;
    var k = kOf(t), txt = (ev.clipboardData && ev.clipboardData.getData("text")) || "";
    if (k && /[,，、;；\n\r\t]/.test(txt)) { ev.preventDefault(); add(k, t.value + txt); t.value = ""; }
  });
  document.addEventListener("focusout", function (ev) {  // 적다 만 글자도 잃지 않는다
    var t = ev.target;
    if (!isIn(t)) return;
    var k = kOf(t);
    if (k && t.value.trim()) { add(k, t.value); t.value = ""; }
  });
  document.addEventListener("click", function (ev) {
    var el = ev.target, k = kOf(el);
    if (k) {
      var chip = el.closest(".tg");
      if (chip && el.closest(".tgx")) {
        drop(k, Number(chip.dataset.i));
      } else if (chip) {                          // 글자를 누르면 고치러 입력칸으로 올린다
        var v = M[k][Number(chip.dataset.i)], inp = field(k);
        if (inp.value.trim()) { add(k, inp.value); inp.value = ""; }
        drop(k, M[k].indexOf(v));
        inp.value = v;
        inp.focus();
      } else if (!el.closest("input")) field(k).focus();
      return;
    }
    var sg = el.closest && el.closest("[data-tg-sug]");
    if (sg) return void add("alias", sg.dataset.tgSug);
    var act = el.closest && el.closest("[data-tg-act]");
    if (!act) return;
    var m = act.closest(".msg"), kk = m && m.id.replace(/^pf-|-m$/g, "");
    if (!kk || !M[kk]) return;
    if (act.dataset.tgAct === "undo") {
      M[kk] = UNDO[kk] || M[kk];
      UNDO[kk] = null;
      render(kk);
    }
    touch(kk);
  });
  document.addEventListener("sm:site", pfLoad);
  pfLoad();   // 이미 사이트가 골라진 채로 이 스크립트가 늦게 실행됐을 때 대비
})();
</script>
