<script type="application/json" class="section-def">
{"id": "sm-cc", "view": "history", "after": "made-sec", "only": "hosted"}

<!-- 목록은 고정 안내 넷이라 정적으로 적는다 — 클릭 배선(복사)만 dash.html 의
     handoff() 가 붙인다. data-cc 값 끝의 공백은 그대로 둔다(클릭 시 사이트 이름이
     바로 이어 붙는다). 여기서만은 명령어가 화면에 나온다: 이 칸의 목적 자체가
     "이 일은 여기서 못 한다, 저기서 하라"는 인계다. -->
<section id="sm-cc">
  <div class="sh">
    <p class="eyebrow">이어서 할 일</p>
    <h2>여기서 못 하는 것</h2>
    <p class="sub">이 넷은 클로드 코드에서 실행합니다 · 누르면 명령이 복사됩니다<span
      class="hint" tabindex="0"
      data-tip="클로드 코드는 터미널에서 쓰는 AI 코딩 도구입니다. 해석과 판단이 드는 이 네 가지는 이 화면에서 못 합니다. 복사한 명령을 채팅에 붙여 넣으면 그대로 실행됩니다."
      aria-label="클로드 코드는 터미널에서 쓰는 AI 코딩 도구입니다. 해석과 판단이 드는 이 네 가지는 이 화면에서 못 합니다. 복사한 명령을 채팅에 붙여 넣으면 그대로 실행됩니다."
      >i</span></p>
  </div>
  <ul>
    <li><div><b>후보 검색어 골라 주기</b><span>관련 있는지는 사람이 봐야 압니다. 대시보드는 서치콘솔에 노출된 것만 자동으로 켭니다.</span></div>
      <button class="cmd sec" data-cc="/capture keywords ">/capture keywords</button></li>
    <li><div><b>개선 기회 깊이 보기</b><span>원인과 조치 방안까지 씁니다. 대시보드는 무엇이 기회인지까지만 말합니다.</span></div>
      <button class="cmd sec" data-cc="/capture gaps ">/capture gaps</button></li>
    <li><div><b>모은 데이터에 질문하기</b><span>“클릭이 0인 검색어는 왜 그런가” 같은 자유 질문에 수집한 값을 찾아 답합니다.</span></div>
      <button class="cmd sec" data-cc="/capture ask ">/capture ask</button></li>
    <li><div><b>콘텐츠 작업 순서 짜기</b><span>저장소 커밋 이력과 대조해 무엇부터 쓸지 배치합니다.</span></div>
      <button class="cmd sec" data-cc="/create plan ">/create plan</button></li>
  </ul>
</section>
