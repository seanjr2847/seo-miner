# Copy to $CAPTURE_HOME/projects/{name}.yaml, then: python scripts/db.py sync-project <path>
name: myproject
type: saas                 # game | local_clinic | saas | directory  (see _presets.yaml)
domain: example.com
locale: ko-KR              # 언어-지역: SERP 나라·자동완성 언어·AI 질문 언어. 고를 수 있는 값은 serp_adapter.LOCALES
gsc_property: sc-domain:example.com   # or "https://example.com/"
brand_aliases: [MyProject, 마이프로젝트]   # for 'mentioned' detection in AI answers
seed_keywords: []
competitors_manual: []
tools: []                  # 등재·경쟁 도구 이름 — 남의 브랜드 검색을 기회 목록에서 걸러낸다 (scoring.md 1a)
foreign_brands: []         # 남의 브랜드 이름 (tools와 동일 목적)
surfaces_ai: [chatgpt, perplexity, gemini]
limits:
  max_keywords: 100        # tracked-set cap (cost control when SERP adapter lands)
  max_ai_prompts: 30
