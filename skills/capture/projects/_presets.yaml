# Type presets: read by Claude during onboarding (F1) & prompt generation (F5).
# They shape keyword expansion angles and AI prompt templates.
# Numeric score weights live in scripts/scoring.py WEIGHTS (per-type, deterministic);
# scoring_bias here is the prose rationale behind those numbers, not the numbers.
game:
  keyword_angles: ["{genre} 추천", "games like {similar}", "{title} 공략", "{title} 리뷰", "{platform} {genre}"]
  ai_prompt_templates:
    - {category: 추천, t: "재밌는 {genre} 게임 추천해줘"}
    - {category: 비교, t: "{similar} 같은 게임 뭐 있어?"}
    - {category: 브랜드, t: "{title} 어때? 할만해?"}
  scoring_bias: "list-inclusion citations weigh heaviest (추천 리스트에 끼는 게 전부)"
local_clinic:
  keyword_angles: ["{지역} {시술}", "{시술} 가격", "{시술} 후기", "{시술} 부작용", "{지역} 피부과 추천"]
  ai_prompt_templates:
    - {category: 추천, t: "{지역} {시술} 잘하는 피부과 추천해줘"}
    - {category: 문제해결, t: "{증상} 어떻게 치료해?"}
    - {category: 비교, t: "{시술A}랑 {시술B} 뭐가 나아?"}
  scoring_bias: "geo-qualified keywords weigh up; note: Naver surface NOT implemented (known gap)"
saas:
  keyword_angles: ["best {category} tools", "{competitor} alternative", "{competitor} vs {name}", "{problem} 해결", "{category} 비교"]
  ai_prompt_templates:
    - {category: 추천, t: "best {category} tools for {icp}"}
    - {category: 비교, t: "{competitor} alternatives?"}
    - {category: 문제해결, t: "how do I {job_to_be_done}?"}
  scoring_bias: "ai_citation_gap dominates — best-of list inclusion is the battlefield"
directory:
  keyword_angles: ["{head} 목록", "{head} 추천", "{head} {지역}", "{head} 찾는 법", "{modifier} {head}"]
  ai_prompt_templates:
    - {category: 추천, t: "{head} 어디서 찾아?"}
    - {category: 추천, t: "괜찮은 {head} 모음 있어?"}
  scoring_bias: "coverage first: indexed/impressed page count (GSC page dim) over per-keyword rank"
